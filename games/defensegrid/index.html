                }

                ctx.textAlign = 'left';
                ctx.font = '10px "Microsoft YaHei"';
                ctx.fillStyle = '#8fb0d0';
                ctx.fillText(getAggregatedDesc(up, up.count), x + 34, ry + rowH / 2 + 10);
            }

            if (overflow > 0) {
                const ry = y + 32 + shown * rowH;
                ctx.textAlign = 'left';
                ctx.font = '11px "Microsoft YaHei"';
                ctx.fillStyle = '#5a7fa8';
                ctx.fillText(`… 还有 ${overflow} 项`, x + 34, ry + rowH / 2);
            }

            ctx.restore();
        }

        function drawEnemyModPanel(x, y, w, h, list, shown, overflow) {
            const rowH = 34;
            ctx.save();
            ctx.fillStyle = 'rgba(8, 14, 24, 0.9)';
            ctx.strokeStyle = 'rgba(255, 107, 107, 0.6)';
            ctx.lineWidth = 1.2;
            roundRect(ctx, x, y, w, h, 10);
            ctx.fill();
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px "Microsoft YaHei"';
            ctx.fillStyle = '#ff8a8a';
            ctx.fillText('☠ 怪物强化', x + 12, y + 17);

            ctx.textAlign = 'right';
            ctx.font = 'bold 11px "Microsoft YaHei"';
            ctx.fillStyle = '#7a9ac0';
            let total = 0;
            for (const it of list) total += it.count;
            ctx.fillText(`${total} 项`, x + w - 12, y + 17);

            ctx.strokeStyle = 'rgba(255, 107, 107, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x + 12, y + 28);
            ctx.lineTo(x + w - 12, y + 28);
            ctx.stroke();

            for (let i = 0; i < shown; i++) {
                const it = list[i];
                const ry = y + 32 + i * rowH;
                const rc = it.color || '#ff8a8a';

                ctx.textAlign = 'left';
                ctx.font = '14px "Microsoft YaHei"';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(it.icon || '☠', x + 12, ry + rowH / 2 - 2);

                ctx.font = 'bold 12px "Microsoft YaHei"';
                ctx.fillStyle = rc;
                ctx.fillText(it.name, x + 34, ry + rowH / 2 - 5);

                if (it.count > 1) {
                    const badgeX = x + 90;
                    const badgeText = `×${it.count}`;
                    ctx.font = 'bold 10px "Microsoft YaHei"';
                    const bw = ctx.measureText(badgeText).width + 8;
                    ctx.fillStyle = rc + '33';
                    roundRect(ctx, badgeX, ry + rowH / 2 - 13, bw, 14, 4);
                    ctx.fill();
                    ctx.fillStyle = rc;
                    ctx.textAlign = 'center';
                    ctx.fillText(badgeText, badgeX + bw / 2, ry + rowH / 2 - 5);
                    ctx.textAlign = 'left';
                }

                ctx.textAlign = 'left';
                ctx.font = '10px "Microsoft YaHei"';
                ctx.fillStyle = '#8fb0d0';
                ctx.fillText(it.desc, x + 34, ry + rowH / 2 + 10);
            }

            if (overflow > 0) {
                const ry = y + 32 + shown * rowH;
                ctx.textAlign = 'left';
                ctx.font = '11px "Microsoft YaHei"';
                ctx.fillStyle = '#5a7fa8';
                ctx.fillText(`… 还有 ${overflow} 项`, x + 34, ry + rowH / 2);
            }

            ctx.restore();
        }

        function drawRoguePanels() {
            if (!rogueState) return;
            const w = ASC_GAME_W;          // 与左侧进阶难度面板等宽，左右对称
            const x = canvas.width - w - 10;
            const rowH = 34, hdrH = 32, padB = 8;
            let y = 56;

            if (rogueState.affixes.length > 0) {
                const h = hdrH + rogueState.affixes.length * rowH + padB;
                drawAffixPanel(x, y, w, h);
                y += h + 10;
            }

            const listA = getAggregatedUpgrades();
            const listB = getAggregatedEnemyMods();
            if (listA.length === 0 && listB.length === 0) return;

            const availH = canvas.height - y - 14;
            const fixedA = listA.length ? hdrH + padB : 0;
            const fixedB = listB.length ? hdrH + padB : 0;
            const gap = (listA.length && listB.length) ? 10 : 0;
            let budget = Math.max(0, Math.floor((availH - fixedA - fixedB - gap) / rowH));

            let rowsA = listA.length, rowsB = listB.length;
            if (rowsA + rowsB > budget) {
                const total = rowsA + rowsB;
                rowsA = Math.floor(budget * rowsA / total);
                rowsB = budget - rowsA;
                if (rowsA > listA.length) { rowsB += rowsA - listA.length; rowsA = listA.length; }
                if (rowsB > listB.length) { rowsA += rowsB - listB.length; rowsB = listB.length; }
                if (rowsA + rowsB > budget) rowsB = Math.max(0, budget - rowsA);
            }

            if (listA.length > 0) {
                const shown = Math.min(rowsA, listA.length);
                const overflow = listA.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawTowerUpgradePanel(x, y, w, h, listA, shown, overflow);
                y += h + gap;
            }
            if (listB.length > 0) {
                const shown = Math.min(rowsB, listB.length);
                const overflow = listB.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawEnemyModPanel(x, y, w, h, listB, shown, overflow);
            }
        }

        // ============================================================
        // Draft 系统
        // ============================================================
        function openDraft(kind) {
            if (!rogueState) return;
            closeBuildMenu();
            closeTowerMenu();
            hideTip();
            selectedTower = null;
            hideSellButton();
            let pool;
            if (kind === 'enemy') {
                pool = ROGUE_ENEMY_BOOSTS.filter(b => !(b.once && rogueState.enemyMods.picks.includes(b.id)));
            } else {
                const pickedIds = new Set(rogueState.upgrades.map(u => u.id));
                pool = ROGUE_UPGRADES.filter(u => {
                    if (u.once && pickedIds.has(u.id)) return false;
                    if (u.requireCrit && !(rogueState.bonus.critChance > 0)) return false;
                    return true;
                });
            }
            const picked = [];
            for (let i = 0; i < 3 && pool.length > 0; i++) {
                const idx = Math.floor(Math.random() * pool.length);
                picked.push(pool.splice(idx, 1)[0]);
            }
            if (picked.length === 0) {
                draftPanel = null;
                openNextDraft();
                return;
            }
            draftPanel = { kind: kind || 'tower', choices: picked, hovered: -1, openAt: performance.now() };
        }

        function openNextDraft() {
            if (draftQueue.length === 0) {
                if (pendingAutoEnemyBoost) {
                    pendingAutoEnemyBoost = false;
                    autoApplyEnemyBoost();
                }
                return;
            }
            const kind = draftQueue.shift();
            openDraft(kind);
        }

        function getDraftCardRect(i) {
            const n = (draftPanel && draftPanel.choices) ? draftPanel.choices.length : 3;
            const cardW = 240, cardH = 280, gap = 20;
            const totalW = cardW * n + gap * Math.max(0, n - 1);
            const startX = (canvas.width - totalW) / 2;
            const panelH = 460;
            const panelY = (canvas.height - panelH) / 2;
            return { x: startX + i * (cardW + gap), y: panelY + 120, w: cardW, h: cardH };
        }

        function charmEnemy(e) {
            if (!e || e.charmed || e.hp <= 0) return;
            if (e.type === 'boss') return;
            e.charmed = true;
            e.state = 'charmed';
            e.nextC = null; e.nextR = null;
            e.slowTimer = 0; e.stunTimer = 0;
            if (e.carrying > 0) {
                const cd = getCoreDelayStacks() * 3.0;
                for (let k = 0; k < e.carrying; k++) {
                    looseCores.push({
                        x: e.x + (Math.random() - 0.5) * 8,
                        y: e.y + (Math.random() - 0.5) * 8,
                        cellC: e.cellC, cellR: e.cellR,
                        nextC: null, nextR: null,
                        dirC: 0, dirR: 0, nextDirC: 0, nextDirR: 0,
                        delay: cd + k * 0.12,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
                e.carrying = 0;
            }
            projectiles.push({
                kind: 'ring', x: e.x, y: e.y, radius: 22 * (CELL / baseCellPx),
                color: 'rgba(255, 120, 220, 0.9)', life: 0.5, maxLife: 0.5
            });
            SFX.shoot('prism');
            if (starts.some(s => s.c === e.cellC && s.r === e.cellR)) {
                const idx = enemies.indexOf(e);
                if (idx !== -1) {
                    enemies.splice(idx, 1);
                    onEnemyRemoved(e);
                }
            }
        }

        function applyDraftUpgrade(up) {
            if (!rogueState || !up) return;
            rogueState.upgrades.push(up);
            up.apply(rogueState);
            if (rogueState.moneyBonus > 0) {
                money += rogueState.moneyBonus;
                rogueState.moneyBonus = 0;
            }
            if (rogueState._pendingCoreRepair) {
                rogueState._pendingCoreRepair = false;
                const alive = bases.filter(b => b.cores > 0);
                if (alive.length > 0) { alive[0].cores++; rebuildActiveBaseField(); }
                else if (bases.length > 0) { bases[0].cores = 1; rebuildActiveBaseField(); }
            }
            if (rogueState._pendingFreeUp) {
                rogueState._pendingFreeUp = false;
                const upgradable = towers.filter(t => t.level < MAX_LEVEL);
                if (upgradable.length > 0) {
                    const t = upgradable[Math.floor(Math.random() * upgradable.length)];
                    const cost = getUpgradeCostEffective(t.type, t.level) || 0;
                    t.level++; t.invested += cost;
                    SFX.upgrade();
                    msgDisplay.textContent = `免费升级：${TOWER_TYPES[t.type].name} → Lv.${t.level}`;
                }
            }
            if (rogueState._pendingKillAll) {
                rogueState._pendingKillAll = false;
                for (const e of enemies) {
                    if (e.hp > 0) { e.hp = 0; e.shield = 0; }
                }
                SFX.boom();
                msgDisplay.textContent = '☠️ 末日审判！全屏敌人被秒杀';
            }
            if (rogueState._pendingStunAll) {
                rogueState._pendingStunAll = false;
                for (const e of enemies) {
                    applyStun(e, 5);
                }
                SFX.shoot('emp');
                msgDisplay.textContent = '⏳ 时间静止！全屏敌人眩晕 5 秒';
            }
            SFX.click();
            if (!msgDisplay.textContent.startsWith('☠️') && !msgDisplay.textContent.startsWith('⏳')) {
                msgDisplay.textContent = `✦ 已选择强化：${up.name}`;
            }
            updateUI();
        }

        function pickRandomEnemyBoost() {
            if (!rogueState) return null;
            const pool = ROGUE_ENEMY_BOOSTS.filter(b => !(b.once && rogueState.enemyMods.picks.includes(b.id)));
            if (pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function autoApplyEnemyBoost() {
            const b = pickRandomEnemyBoost();
            if (!b) return;
            applyEnemyBoost(b);
        }

        function applyEnemyBoost(b) {
            if (!rogueState || !b) return;
            const em = rogueState.enemyMods;
            em.picks.push(b.id);
            switch (b.id) {
                case 'hp':        em.hpMul *= 1.20; break;
                case 'speed':     em.speedMul *= 1.20; break;
                case 'coreLock':
                    em.coreLockStacks++;
                    em.coreLock = true;
                    break;
                case 'coreDelay':
                    em.coreDelayStacks++;
                    em.coreDelay = true;
                    break;
                case 'stunResist':
                    em.stunStacks++;
                    em.stunMul = Math.pow(0.8, em.stunStacks);
                    break;
                case 'dodge':
                    em.dodgeStacks++;
                    em.dodge = 1 - Math.pow(0.92, em.dodgeStacks);
                    break;
            }
            SFX.steal();
            msgDisplay.textContent = `☠️ 怪物强化：${b.name} · ${b.desc}`;
            updateUI();
        }

        function checkRogueDraftTrigger() {
            if (!rogueState || gameOver || draftPanel || draftQueue.length > 0 || pendingAutoEnemyBoost) return;
            for (const rt of waveRuntime) {
                if (rt.cleared && !rt.draftGiven) {
                    rt.draftGiven = true;
                    const waveNum = rt.id + 1;
                    if (rt.id >= totalWaves - 1) return;

                    const isTowerWave = (waveNum % TOWER_DRAFT_INTERVAL === 0);
                    const isEnemyWave = (waveNum % ENEMY_BOOST_INTERVAL === 0);

                    if (isTowerWave) {
                        if (isEnemyWave) pendingAutoEnemyBoost = true;
                        draftQueue = ['tower'];
                        openNextDraft();
                    } else if (isEnemyWave) {
                        autoApplyEnemyBoost();
                    }
                    return;
                }
            }
        }

        function drawDraftPanel() {
            const d = draftPanel;
            if (!d) return;
            const isEnemy = d.kind === 'enemy';
            const elapsed = (performance.now() - d.openAt) / 1000;
            const fade = Math.min(1, elapsed * 4);

            ctx.fillStyle = `rgba(4, 8, 16, ${0.82 * fade})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const panelW = 820, panelH = 460;
            const px = (canvas.width - panelW) / 2;
            const py = (canvas.height - panelH) / 2;

            ctx.save();
            ctx.shadowColor = isEnemy ? 'rgba(220, 80, 80, 0.55)' : 'rgba(60, 140, 220, 0.55)';
            ctx.shadowBlur = 32;
            ctx.fillStyle = '#131c2b';
            roundRect(ctx, px, py, panelW, panelH, 16);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = isEnemy ? '#8a3a3a' : '#3a6a9a';
            ctx.lineWidth = 2;
            roundRect(ctx, px, py, panelW, panelH, 16);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 26px "Microsoft YaHei"';
            ctx.fillStyle = isEnemy ? '#ff8a8a' : '#ffd966';
            ctx.shadowColor = isEnemy ? '#aa2222' : '#aa7722';
            ctx.shadowBlur = 20;
            ctx.fillText(isEnemy ? '☠️ 怪物强化 ☠️' : '⚡ 选择强化 ⚡', canvas.width / 2, py + 50);
            ctx.shadowBlur = 0;

            ctx.font = '13px "Microsoft YaHei"';
            ctx.fillStyle = '#7a9ac0';
            ctx.fillText(isEnemy
                ? `每 ${ENEMY_BOOST_INTERVAL} 波一次 · 敌人将获得永久增益，请谨慎选择`
                : `每 ${TOWER_DRAFT_INTERVAL} 波一次 · 从下列卡牌中选择一张永久生效`, canvas.width / 2, py + 84);

            for (let i = 0; i < d.choices.length; i++) {
                const up = d.choices[i];
                const r = getDraftCardRect(i);
                const hov = d.hovered === i;
                let rc, rarityText;
                if (isEnemy) {
                    rc = up.color || '#ff8a8a';
                    rarityText = '怪物强化';
                } else {
                    rc = RARITY_COLORS[up.rarity] || '#7ec8ff';
                    rarityText = RARITY_LABEL[up.rarity] || '常见';
                }

                ctx.save();
                if (hov) { ctx.shadowColor = rc; ctx.shadowBlur = 24; }
                ctx.fillStyle = hov ? '#22364f' : '#1a2536';
                ctx.strokeStyle = hov ? rc : (rc + '77');
                ctx.lineWidth = hov ? 2.5 : 1.5;
                roundRect(ctx, r.x, r.y, r.w, r.h, 14);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 11px "Microsoft YaHei"';
                ctx.fillStyle = rc;
                ctx.fillText(rarityText, r.x + r.w / 2, r.y + 24);

                ctx.font = '48px "Microsoft YaHei"';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(up.icon || '⭐', r.x + r.w / 2, r.y + 92);

                const nameMaxW = r.w - 36;
                let nameSize = 18;
                ctx.font = `bold ${nameSize}px "Microsoft YaHei"`;
                while (ctx.measureText(up.name).width > nameMaxW && nameSize > 12) {
                    nameSize -= 1;
                    ctx.font = `bold ${nameSize}px "Microsoft YaHei"`;
                }
                ctx.fillStyle = rc;
                ctx.textAlign = 'center';
                ctx.fillText(up.name, r.x + r.w / 2, r.y + 150);

                const desc = up.desc || '';
                const descMaxW = r.w - 36;
                const descStartY = r.y + 172;
                const descMaxY = r.y + r.h - 46;

                let descSize = 13;
                let lineH = 17;
                let descLines = [];
                for (const fs of [13, 12, 11]) {
                    ctx.font = `${fs}px "Microsoft YaHei"`;
                    descLines = wrapTextLines(ctx, desc, descMaxW);
                    lineH = fs + 4;
                    descSize = fs;
                    if (descStartY + descLines.length * lineH <= descMaxY) break;
                }
                const maxLines = Math.max(1, Math.floor((descMaxY - descStartY) / lineH));
                if (descLines.length > maxLines) {
                    descLines = descLines.slice(0, maxLines);
                    let last = descLines[maxLines - 1];
                    while (last.length > 0 && ctx.measureText(last + '…').width > descMaxW) {
                        last = last.slice(0, -1);
                    }
                    descLines[maxLines - 1] = last + '…';
                }
                ctx.font = `${descSize}px "Microsoft YaHei"`;
                ctx.fillStyle = '#8fb0d0';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let k = 0; k < descLines.length; k++) {
                    ctx.fillText(descLines[k], r.x + r.w / 2, descStartY + lineH / 2 + k * lineH);
                }

                if (hov) {
                    ctx.font = 'bold 13px "Microsoft YaHei"';
                    ctx.fillStyle = isEnemy ? '#ff8a8a' : '#ffd966';
                    ctx.fillText('▶ 点击选择', r.x + r.w / 2, r.y + r.h - 22);
                }
            }

            if (rogueState) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '11px "Microsoft YaHei"';
                ctx.fillStyle = '#5a7fa8';
                const extra = isEnemy
                    ? `已承受 ${rogueState.enemyMods.picks.length} 项怪物强化`
                    : `已获得 ${rogueState.upgrades.length} 张塔强化`;
                const autoTip = pendingAutoEnemyBoost ? ' · 选完后将自动应用 1 次怪物强化' : '';
                ctx.fillText(extra + autoTip + ' · 累计效果见右侧面板', canvas.width / 2, py + panelH - 26);
            }
        }

        // ============================================================
        // 结算面板
        // ============================================================
        function getResultLayout() {
            const extra = (gameResult && gameResult.rogue) ? 26 : 0;
            const w = 440, h = 470 + extra;
            return { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h };
        }
        function getResultBtnRect() {
            const L = getResultLayout();
            const bw = 220, bh = 46;
            return { x: L.x + (L.w - bw) / 2, y: L.y + L.h - 64, w: bw, h: bh };
        }
        function getResultEndlessBtnRect() {
            const L = getResultLayout();
            const bw = 250, bh = 36;
            return { x: L.x + (L.w - bw) / 2, y: L.y + L.h - 110, w: bw, h: bh };
        }

        function finishBattle(win) {
            if (gameResult) return;
            gameOver = true;
            closeBuildMenu(); closeTowerMenu(); hideTip(); hideSellButton();
            selectedTower = null;
            draftPanel = null;
            draftQueue = [];
            const st = getEnergyStats();
            const s = battleStats || { kills: 0, leaked: 0, towersBuilt: 0, wavesCleared: 0 };
            const lv = currentLevel;
            const mode = MODES[currentModeKey] || MODES.story;
            let raw = 0;
            raw += s.wavesCleared * 150;
            raw += s.kills * 10;
            raw += (st.green + st.yellow) * 100;
            raw += Math.floor(money);
            raw -= st.red * 150;
            raw += (levelDifficulty(lv) + 1) * 150;
            if (!win) raw = Math.floor(raw * 0.5);
            const towerCount = Math.max(1, s.towersBuilt);
            const rogueMul = rogueState ? (MODES.rogue.scoreMul || 1) : 1;
            const ascensionMul = 1 + selectedAscension * 0.1;
            // ★ 地图越大，得分越高：格子数 / 100
            const mapScoreMul = (COLS * ROWS) / 100;
            const score = Math.max(0, Math.round(raw * ((mode.scoreMul || 1) * rogueMul * ascensionMul * mapScoreMul / towerCount)));
            gameResult = {
                win, score,
                kills: s.kills, leaked: st.red, wavesCleared: s.wavesCleared,
                totalWaves: totalWaves,
                endless: currentModeKey === 'endless',
                rogue: !!rogueState,
                cores: st.green + st.yellow,
                money: Math.floor(money),
                towersBuilt: s.towersBuilt,
                levelName: lv.name, levelNum: levelIndex + 1,
                modeName: mode.name + (routeReverse ? ' · 路线反转' : '') + (rogueState ? ' · Roguelike' : '') + (selectedAscension > 0 ? ' · 进阶'+selectedAscension : ''),
                reverse: routeReverse, playTime: playTime,
                showEndless: false
            };
            if (win && (currentModeKey === 'grind' || rogueState)) {
                unlockEndless();
                gameResult.showEndless = true;
            }
            msgDisplay.textContent = win ? '🎉 关卡通过！点击确定返回关卡选择' : '💀 核心全部丢失... 点击确定返回关卡选择';
            if (win) SFX.win(); else SFX.lose();
        }

        function continueToEndless() {
            closeBuildMenu(); closeTowerMenu(); hideTip(); hideSellButton();
            selectedTower = null; draftPanel = null; draftQueue = [];
            pendingAutoEnemyBoost = false;

            const keepRogue = !!rogueState;
            const fromGrind = currentModeKey === 'grind';

            currentModeKey = 'endless';
            rogueEnabled = keepRogue;

            // 保留当前速度设置，仅解除暂停状态
            paused = false;
            speedBtn.textContent = `⏩ ${speedMultiplier}x`;
            pauseBtn.textContent = '⏸ 暂停';
            pauseBtn.classList.remove('active');
            const lv = LEVELS[levelIndex];
            const mode = MODES.endless;
            waves = generateWaves(levelDifficulty(lv), 'endless', mode.hpMul, levelIndex);
            totalWaves = waves.length;
            if (fromGrind) waveIndex = 99;
            waveRuntime = [];

            // ── 修复：清空残留敌人/弹道，重置时钟，保证无尽模式立即开始刷新波次 ──
            enemies = [];
            projectiles = [];
            gameClock = 0;
            lastTime = 0;
            nextWaveAt = 8.0;
            waveIntervalNext = getWaveInterval(lv, waveIndex);
            waveCountdownStarted = true;

            gameOver = false; gameResult = null;
            resultBtnHover = false; endlessBtnHover = false;
            updateUI();
            gameTitle.textContent = `⚡ ${levelIndex + 1} ${lv.name} · ${mode.name}${rogueState ? ' · Roguelike' : ''}${selectedAscension > 0 ? ' · 进阶'+selectedAscension : ''} ⚡`;
            msgDisplay.textContent = `♾ 无尽模式 · 第 ${waveIndex + 1} 波来袭！${rogueState ? ' · Roguelike 强化保留' : ''}`;
            canvas.style.cursor = 'crosshair';
        }

        function drawResultPanel() {
            const r = gameResult;
            const L = getResultLayout();
            const cx = L.x + L.w / 2;

        // ============================================================
        // 背景 / 墙体
        // ============================================================
        function rebuildBackground() {
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            bgCanvas = document.createElement('canvas');
            bgCanvas.width = Math.max(1, gridW);
            bgCanvas.height = Math.max(1, gridH);
            const g = bgCanvas.getContext('2d');

            // 1. 基础地板：渐变底 + 逐格噪点 + 网格线（与缩略图共用 paintFloorBase）
            paintFloorBase(g, COLS, ROWS, CELL, 0, 0);

            // 2. 可建造空地：中心加号标记（与 X 炮台墙的加号呼应，但更淡）
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (wallGrid[r][c]) continue;
                    if (noBuildGrid[r] && noBuildGrid[r][c]) continue;
                    if (bases.some(b => b.c === c && b.r === r)) continue;
                    if (starts.some(s => s.c === c && s.r === r)) continue;
                    if (exits.some(ex => ex.c === c && ex.r === r)) continue;
                    drawBuildableFloorMark(g, c * CELL, r * CELL, CELL);
                }
            }

            // 3. 禁止建造但可通行的地板（'.'）—— 原代码这里条件写错，实际从未绘制
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(noBuildGrid[r] && noBuildGrid[r][c])) continue;
                    if (straightGrid[r] && straightGrid[r][c]) continue;
                    drawNoBuildFloor(g, c * CELL, r * CELL, CELL, c, r, tileNoiseHash);
                }
            }

            // 3.5 十字路口 +：可通行、不可建造、只能直行
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(straightGrid[r] && straightGrid[r][c])) continue;
                    drawCrossJunction(g, c * CELL, r * CELL, CELL);
                }
            }

            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!wallGrid[r][c]) continue;
                    const x = c * CELL, y = r * CELL;
                    if (buildableWall[r][c]) drawArmorWall(g, x, y, CELL, c, r, tileNoiseHash);
                    else drawRockWall(g, x, y, CELL, c, r, tileNoiseHash);
                }
            }

            g.strokeStyle = 'rgba(70, 122, 180, 0.55)';
            g.lineWidth = 2;
            g.strokeRect(0.5, 0.5, gridW - 1, gridH - 1);
        }

        // 确定性噪声：让同一格在任意缩放下纹理一致
        function tileNoiseHash(x, y) {
            let h = (x | 0) * 374761393 + (y | 0) * 668265263;
            h = (h ^ (h >> 13)) * 1274126177;
            h = h ^ (h >> 16);
            return ((h >>> 0) % 10000) / 10000;
        }

        // 基础地板：渐变底 + 逐格噪点 + 网格线（游戏内与缩略图共用）
        function paintFloorBase(g, cols, rows, cell, offX, offY) {
            const gridW = cols * cell, gridH = rows * cell;

            const floorGrad = g.createLinearGradient(offX, offY, offX + gridW, offY + gridH);
            floorGrad.addColorStop(0, '#0b121c');
            floorGrad.addColorStop(0.5, '#0d1522');
            floorGrad.addColorStop(1, '#08101a');
            g.fillStyle = floorGrad;
            g.fillRect(offX, offY, gridW, gridH);

            // 小尺寸（缩略图）时省略噪点，避免糊成一片
            const detail = cell >= 10;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = offX + c * cell, y = offY + r * cell;
                    const base = tileNoiseHash(c * 7 + 1, r * 13 + 2);
                    const tone = base * 0.5 + 0.5;
                    g.fillStyle = `rgba(${Math.round(8 + tone * 6)}, ${Math.round(14 + tone * 8)}, ${Math.round(22 + tone * 10)}, 0.55)`;
                    g.fillRect(x, y, cell, cell);
                    if (!detail) continue;
                    const dotCount = 2 + Math.floor(base * 3);
                    for (let k = 0; k < dotCount; k++) {
                        const h1 = tileNoiseHash(c * 11 + k * 3, r * 17 + k * 7);
                        const h2 = tileNoiseHash(c * 23 + k * 5, r * 29 + k * 11);
                        const dx = h1 * (cell - 2) + 1;
                        const dy = h2 * (cell - 2) + 1;
                        const sz = 1 + h2 * 1.2;
                        const bright = h1 > 0.5;
                        g.fillStyle = bright
                            ? `rgba(70, 90, 120, ${0.05 + h1 * 0.06})`
                            : `rgba(0, 0, 0, ${0.15 + h2 * 0.15})`;
                        g.fillRect(x + dx, y + dy, sz, sz);
                    }
                }
            }

            if (cell >= 8) {
                g.strokeStyle = 'rgba(45, 75, 110, 0.13)';
                g.lineWidth = 1;
                for (let i = 1; i < cols; i++) {
                    g.beginPath(); g.moveTo(offX + i * cell + 0.5, offY); g.lineTo(offX + i * cell + 0.5, offY + gridH); g.stroke();
                }
                for (let i = 1; i < rows; i++) {
                    g.beginPath(); g.moveTo(offX, offY + i * cell + 0.5); g.lineTo(offX + gridW, offY + i * cell + 0.5); g.stroke();
                }
            }
        }

        // 可建造空地的中心加号标记（与 X 炮台墙的加号呼应，但更淡）
        function drawBuildableFloorMark(g, x, y, size) {
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.14);
            g.save();
            // 淡蓝色外圈
            g.strokeStyle = 'rgba(126, 200, 255, 0.20)';
            g.lineWidth = Math.max(1, size * 0.018);
            g.beginPath(); g.arc(cx, cy, sz * 1.55, 0, Math.PI * 2); g.stroke();
            // 加号
            g.strokeStyle = 'rgba(150, 210, 255, 0.42)';
            g.lineWidth = Math.max(1, size * 0.024);
            g.lineCap = 'round';
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            // 中心小点
            g.fillStyle = 'rgba(190, 230, 255, 0.60)';
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
            g.restore();
        }

        function drawCrossJunction(g, x, y, size) {
            const cx = x + size / 2, cy = y + size / 2;
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;

            // 与普通地板一致的地板底（跟 drawNoBuildFloor 同款渐变）
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#0b121c');
            grad.addColorStop(0.5, '#0d1522');
            grad.addColorStop(1, '#08101a');
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);

            // 四个方向的淡蓝色箭头
            const small = size < 18;                 // 缩略图等小尺寸下省略箭杆，只留三角头
            const armLen = size * 0.32;              // 中心到箭尖
            const headLen = size * (small ? 0.16 : 0.13);
            const headW  = size * (small ? 0.16 : 0.11);
            const shaftW = Math.max(1, size * 0.05);
            const gap    = size * 0.05;              // 中心留空

            g.save();
            g.fillStyle = 'rgba(126, 200, 255, 0.62)';
            for (let dir = 0; dir < 4; dir++) {
                const ang = dir * Math.PI / 2 - Math.PI / 2;   // 上、右、下、左
                const ux = Math.cos(ang), uy = Math.sin(ang);
                const px = -uy, py = ux;

                const tipX = cx + ux * armLen,  tipY = cy + uy * armLen;
                const baseX = cx + ux * (armLen - headLen), baseY = cy + uy * (armLen - headLen);

                // 三角箭头
                g.beginPath();
                g.moveTo(tipX, tipY);
                g.lineTo(baseX + px * headW, baseY + py * headW);
                g.lineTo(baseX - px * headW, baseY - py * headW);
                g.closePath();
                g.fill();

                // 箭杆（小尺寸省略）
                if (!small) {
                    const sx = cx + ux * gap, sy = cy + uy * gap;
                    g.beginPath();
                    g.moveTo(sx + px * shaftW / 2, sy + py * shaftW / 2);
                    g.lineTo(baseX + px * shaftW / 2, baseY + py * shaftW / 2);
                    g.lineTo(baseX - px * shaftW / 2, baseY - py * shaftW / 2);
                    g.lineTo(sx - px * shaftW / 2, sy - py * shaftW / 2);
                    g.closePath();
                    g.fill();
                }
            }
            g.restore();
        }
        // 可通行但禁止建造的地板渲染
        function drawNoBuildFloor(g, x, y, size, c, r, hash) {
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#0b121c');
            grad.addColorStop(0.5, '#0d1522');
            grad.addColorStop(1, '#08101a');
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);
        }

        function drawRockWall(g, x, y, size, c, r, hash) {
            const pad = Math.max(1, size * 0.03);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#3a373f'); grad.addColorStop(1, '#141215');
            g.fillStyle = grad; g.fillRect(bx, by, bw, bh);
            const rows = 2, cols = 2;
            const bh2 = bh / rows, bw2 = bw / cols;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const h1 = hash(c * 13 + j * 7, r * 11 + i * 5);
                    const xx = bx + j * bw2, yy = by + i * bh2;
                    g.fillStyle = h1 > 0.5
                        ? `rgba(255,255,255,${0.03 + h1 * 0.05})`
                        : `rgba(0,0,0,${0.10 + (1 - h1) * 0.15})`;
                    g.fillRect(xx, yy, bw2 + 0.5, bh2 + 0.5);
                }
            }
            g.strokeStyle = 'rgba(0,0,0,0.65)';
            g.lineWidth = Math.max(1, size * 0.035);
            g.beginPath(); g.moveTo(bx, by + bh2); g.lineTo(bx + bw, by + bh2); g.stroke();
            g.beginPath(); g.moveTo(bx + bw2, by); g.lineTo(bx + bw2, by + bh); g.stroke();
            g.strokeStyle = 'rgba(150,140,130,0.35)';
            g.lineWidth = 1;
            g.beginPath(); g.moveTo(bx, by + 0.5); g.lineTo(bx + bw, by + 0.5); g.stroke();
        }

        function drawArmorWall(g, x, y, size, c, r, hash) {
            const pad = Math.max(1.5, size * 0.04);
            const radius = Math.min(Math.max(2, size * 0.08), Math.max(0.5, (size - pad * 2) / 2));
            g.save();
            g.shadowColor = 'rgba(0, 0, 0, 0.7)';
            g.shadowBlur = Math.max(2, size * 0.1);
            g.shadowOffsetY = Math.max(1, size * 0.05);
            const grad = g.createLinearGradient(x, y, x, y + size);
            grad.addColorStop(0, '#52627a');
            grad.addColorStop(0.5, '#33445c');
            grad.addColorStop(1, '#1a2534');
            g.fillStyle = grad;
            roundRect(g, x + pad, y + pad, size - pad * 2, size - pad * 2, radius);
            g.fill();
            g.restore();
            g.strokeStyle = 'rgba(150, 190, 230, 0.45)';
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(x + pad + radius, y + pad + 0.5);
            g.lineTo(x + size - pad - radius, y + pad + 0.5);
            g.moveTo(x + pad + 0.5, y + pad + radius);
            g.lineTo(x + pad + 0.5, y + size - pad - radius);
            g.stroke();
            g.strokeStyle = 'rgba(0, 0, 0, 0.65)';
            g.beginPath();
            g.moveTo(x + size - pad - 0.5, y + pad + radius);
            g.lineTo(x + size - pad - 0.5, y + size - pad - radius);
            g.moveTo(x + size - pad - radius, y + size - pad - 0.5);
            g.lineTo(x + pad + radius, y + size - pad - 0.5);
            g.stroke();
            const inset = Math.max(3, size * 0.12);
            const ix = x + inset, iy = y + inset, iw = size - inset * 2, ih = size - inset * 2;
            const innerGrad = g.createLinearGradient(ix, iy, ix, iy + ih);
            innerGrad.addColorStop(0, '#0a1220');
            innerGrad.addColorStop(0.5, '#0f1a2a');
            innerGrad.addColorStop(1, '#162438');
            g.fillStyle = innerGrad;
            roundRect(g, ix, iy, iw, ih, Math.max(1, radius - 1)); g.fill();
            g.strokeStyle = 'rgba(0, 0, 0, 0.7)'; g.lineWidth = 1;
            g.beginPath();
            g.moveTo(ix + 1, iy + 0.5); g.lineTo(ix + iw - 1, iy + 0.5);
            g.moveTo(ix + 0.5, iy + 1); g.lineTo(ix + 0.5, iy + ih - 1);
            g.stroke();
            g.strokeStyle = 'rgba(120, 160, 200, 0.25)';
            g.beginPath();
            g.moveTo(ix + iw - 1, iy + ih - 0.5); g.lineTo(ix + 1, iy + ih - 0.5);
            g.moveTo(ix + iw - 0.5, iy + ih - 1); g.lineTo(ix + iw - 0.5, iy + 1);
            g.stroke();
            if (size >= 26) {
                const ro = size * 0.15;
                const rr = Math.max(1, size * 0.035);
                const corners = [
                    [x + ro, y + ro], [x + size - ro, y + ro],
                    [x + ro, y + size - ro], [x + size - ro, y + size - ro]
                ];
                for (const [rx, ry] of corners) {
                    g.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    g.beginPath(); g.arc(rx + 0.6, ry + 0.6, rr, 0, Math.PI * 2); g.fill();
                    const rgrad = g.createRadialGradient(rx - rr * 0.3, ry - rr * 0.3, 0, rx, ry, rr);
                    rgrad.addColorStop(0, 'rgba(200, 220, 240, 0.9)');
                    rgrad.addColorStop(0.6, 'rgba(100, 130, 170, 0.85)');
                    rgrad.addColorStop(1, 'rgba(40, 55, 80, 0.9)');
                    g.fillStyle = rgrad;
                    g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.fill();
                }
            }
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.16);
            g.save();
            g.shadowColor = 'rgba(126, 200, 255, 0.6)';
            g.shadowBlur = Math.max(2, size * 0.1);
            g.strokeStyle = 'rgba(126, 200, 255, 0.65)';
            g.lineWidth = Math.max(1, size * 0.025);
            g.beginPath(); g.arc(cx, cy, sz * 1.4, 0, Math.PI * 2); g.stroke();
            g.restore();
            g.strokeStyle = 'rgba(180, 225, 255, 0.85)';
            g.lineWidth = Math.max(1, size * 0.022);
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            g.fillStyle = 'rgba(210, 240, 255, 0.95)';
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
        }

        function drawEnergyPanel(x, y) {

                ctx.fill(); ctx.shadowBlur = 0;

        function drawGameTopInfo(x, y) {
            const st = getEnergyStats();
            const segments = [
                { icon: '💰', color: '#ffd966', text: String(Math.floor(money)) },
                { icon: '💎', color: '#7edcff', text: String(st.green + st.yellow) },
                { icon: '🌊', color: '#8fc4ff', text: (currentModeKey === 'endless' ? `${waveIndex}/∞` : `${waveIndex}/${totalWaves}`) },
                { icon: '⏱', color: '#c8b0ff', text: formatTime(playTime) }
            ];
            ctx.save();
            ctx.font = 'bold 17px "Microsoft YaHei"';
            ctx.textBaseline = 'middle';
            const gap = 20, padX = 18, h = 40;
            const segPad = 6;                 // 每段左右各留 6px，文字不贴边
            let innerW = 0;
            for (let i = 0; i < segments.length; i++) {
                segments[i].label = segments[i].icon + ' ' + segments[i].text;
                segments[i].w = ctx.measureText(segments[i].label).width + segPad * 2;

        // ============================================================
        // 出怪流水线
        // ============================================================
        function getPipelineEntries() {
            const now = gameClock, MAX_AHEAD = 40;
            const waveList = [];
            for (const rt of waveRuntime) {
                if (typeof rt.startAt !== 'number') continue;
                waveList.push({ w: rt.id, t: rt.startAt });
            }
            let t = nextWaveAt;
            for (let w = waveIndex; w < totalWaves; w++) {
                if (t - now > MAX_AHEAD) break;
                waveList.push({ w, t });
                t += getWaveInterval(currentLevel, w + 1);
            }
            waveList.sort((a, b) => a.t - b.t);
            const entries = [];
            for (const item of waveList) {
                const wave = waves[item.w];
                if (!wave || !wave.groups) continue;
                const groups = [];
                const map = new Map();
                for (const g of wave.groups) {
                    let e = map.get(g.type);
                    if (!e) { e = { type: g.type, count: 0 }; map.set(g.type, e); groups.push(e); }
                    e.count += Math.max(1, Math.round(g.count));
                }
                let inWaveSec = 0;
                for (let i = 0; i < groups.length; i++) {
                    const entry = {
                        type: groups[i].type,
                        count: groups[i].count,
                        waveId: item.w,
                        time: item.t + inWaveSec
                    };
                    entry.w = measurePipeBlockWidth(entry);
                    entries.push(entry);
                    // 下一块紧接在当前块右侧 PIPE_INWAVE_GAP 处
                    inWaveSec += (entry.w + PIPE_INWAVE_GAP) / PIPE_SPEED;
                }
            }
            return entries;
        }

        function drawTickerEnemyShape(c, type, cx, cy, size) {
            const def = ENEMY_TYPES[type];
            if (!def) return;
            const color = def.color;
            const outerAlpha = c.globalAlpha;
            c.save(); c.translate(cx, cy);
            c.fillStyle = color; c.strokeStyle = color;
            c.shadowColor = color; c.shadowBlur = 5;
            if (def.stealth) c.globalAlpha = outerAlpha * 0.78;
            if (type === 'runner' || type === 'wraith' || type === 'specter' || type === 'stalker') {
                c.beginPath(); c.moveTo(0, -size); c.lineTo(size * 0.72, 0); c.lineTo(0, size); c.lineTo(-size * 0.72, 0); c.closePath(); c.fill();
            } else if (type === 'tank' || type === 'brute' || type === 'shade') {
                c.fillRect(-size * 0.72, -size * 0.72, size * 1.44, size * 1.44);
            } else if (type === 'boss') {
                c.beginPath();
                for (let i = 0; i < 10; i++) {
                    const a = -Math.PI / 2 + i * Math.PI / 5;
                    const r = (i % 2 === 0) ? size * 1.15 : size * 0.5;
                    const px = Math.cos(a) * r, py = Math.sin(a) * r;
                    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath(); c.fill();
            } else if (def.air) {
                c.beginPath(); c.arc(0, 0, size * 0.62, 0, Math.PI * 2); c.fill();
                c.beginPath(); c.ellipse(-size * 0.92, 0, size * 0.45, size * 0.22, -0.3, 0, Math.PI * 2); c.fill();
                c.beginPath(); c.ellipse(size * 0.92, 0, size * 0.45, size * 0.22, 0.3, 0, Math.PI * 2); c.fill();
            } else if (type === 'shield') {
                c.beginPath(); c.arc(0, 0, size * 0.72, 0, Math.PI * 2); c.fill();
                c.fillStyle = 'rgba(255,255,255,0.45)';
                c.beginPath(); c.moveTo(0, -size * 0.5); c.lineTo(size * 0.5, -size * 0.12);
                c.lineTo(size * 0.5, size * 0.28); c.lineTo(0, size * 0.68);
                c.lineTo(-size * 0.5, size * 0.28); c.lineTo(-size * 0.5, -size * 0.12); c.closePath(); c.fill();
            } else if (type === 'shaman') {
                c.beginPath(); c.arc(0, 0, size * 0.72, 0, Math.PI * 2); c.fill();
                c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2;
                c.beginPath();
                c.moveTo(0, -size * 0.42); c.lineTo(0, size * 0.42);
                c.moveTo(-size * 0.42, 0); c.lineTo(size * 0.42, 0); c.stroke();
            } else if (type === 'hatcher' || type === 'summoner' || type === 'jammer') {
                drawSpecialEnemyBody(c, type, size * 1.25, color);
            } else {
                c.beginPath(); c.arc(0, 0, size * 0.7, 0, Math.PI * 2); c.fill();
            }
            c.shadowBlur = 0;
            if (def.stealth) {
                c.globalAlpha = outerAlpha;
                c.setLineDash([2, 2]); c.strokeStyle = color; c.lineWidth = 1;
                c.beginPath(); c.arc(0, 0, size * 1.2, 0, Math.PI * 2); c.stroke();
                c.setLineDash([]);
            }
            c.restore();
        }
        function measurePipeBlockWidth(entry) {
            ctx.save();
            ctx.font = 'bold 12px "Microsoft YaHei"';
            const textW = ctx.measureText('×' + entry.count).width;

            return Math.min(PIPE_BLOCK_W, Math.max(56, 31 + textW + 10));

        function drawWavePipeline() {
            const barH = 46, barY = 0, leftPad = 16;
            const lineX = PIPELINE_LINE_X;
            const centerY = barY + barH / 2;
            const grad = ctx.createLinearGradient(0, barY, 0, barY + barH);
            grad.addColorStop(0, 'rgba(10, 18, 30, 0.96)');
            grad.addColorStop(1, 'rgba(6, 10, 18, 0.92)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, barY, canvas.width, barH);

            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            const waveLabel = currentModeKey === 'endless' ? `♾ ${waveIndex}` : `${waveIndex}/${totalWaves}`;
            const waveText = `🌊 ${waveLabel}`;
            const enemyText = `场上 ${enemies.length} 个敌人`;

            // 先量出两行文字的实际宽度，取大者作为左侧信息区宽度
            ctx.font = 'bold 17px "Microsoft YaHei"';
            const infoW1 = ctx.measureText(waveText).width;
            ctx.font = 'bold 10px "Microsoft YaHei"';
            const infoW2 = ctx.measureText(enemyText).width;
            const infoW = Math.max(infoW1, infoW2) + 24;   // 左右各留 12px
            const clipLeft = leftPad + infoW;

            ctx.font = 'bold 17px "Microsoft YaHei"';
            ctx.fillStyle = '#7ec8ff'; ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 10;
            ctx.fillText(waveText, leftPad, centerY - 4);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px "Microsoft YaHei"';
            ctx.fillStyle = enemies.length > 0 ? '#ffaa66' : '#5a7fa8';
            ctx.fillText(enemyText, leftPad, centerY + 14);
            ctx.save();
            ctx.strokeStyle = 'rgba(80, 140, 200, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(clipLeft, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();
            ctx.restore();
            const entries = getPipelineEntries();
            const now = gameClock;
            const blockH = 30;
            const blockY = barY + (barH - blockH) / 2;
            ctx.save();
            ctx.beginPath(); ctx.rect(clipLeft, barY, canvas.width - clipLeft, barH); ctx.clip();
            if (entries.length === 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = '#5a7fa8';
                const msg = (waveIndex >= totalWaves) ? '—— 全部波次已结束 ——' : '—— 准备迎敌 ——';
                ctx.fillText(msg, (clipLeft + canvas.width) / 2, centerY);
            } else {
                const FADE_ZONE = 120;
                for (const e of entries) {
                    const bw = e.w || PIPE_BLOCK_W;
                    const x = lineX + (e.time - now) * PIPE_SPEED;
                    if (x > canvas.width + 10) continue;
                    const right = x + bw;
                    if (right < clipLeft) continue;
                    let alpha = 1;
                    if (right < clipLeft + FADE_ZONE) alpha = (right - clipLeft) / FADE_ZONE;
                    if (alpha <= 0.02) continue;
                    ctx.globalAlpha = alpha;
                    drawPipeBlock(x, blockY, bw, blockH, e);
                    ctx.globalAlpha = 1;
                }
            }
            ctx.restore();
            const fadeGrad = ctx.createLinearGradient(clipLeft, 0, clipLeft + 90, 0);
            fadeGrad.addColorStop(0, 'rgba(9, 15, 25, 0.98)');
            fadeGrad.addColorStop(1, 'rgba(9, 15, 25, 0)');
            ctx.fillStyle = fadeGrad;
            ctx.fillRect(clipLeft, barY, 90, barH);
            ctx.save();
            ctx.shadowColor = '#4affd0'; ctx.shadowBlur = 14;
            ctx.strokeStyle = 'rgba(74, 255, 208, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(lineX, barY + 5); ctx.lineTo(lineX, barY + barH - 5);
            ctx.stroke();
            ctx.fillStyle = '#4affd0';
            ctx.beginPath();
            ctx.moveTo(lineX - 5, barY + 4); ctx.lineTo(lineX + 5, barY + 4); ctx.lineTo(lineX, barY + 10);
            ctx.closePath(); ctx.fill();
            const pulse2 = 0.5 + Math.sin(Date.now() / 300) * 0.5;
            ctx.beginPath();
            ctx.arc(lineX, barY + barH - 5, 2.5 + pulse2 * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(74, 255, 208, ${0.4 + pulse2 * 0.6})`;
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.shadowColor = 'rgba(60, 140, 220, 0.7)'; ctx.shadowBlur = 8;
            ctx.strokeStyle = 'rgba(80, 160, 230, 0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, barY + barH - 0.5); ctx.lineTo(canvas.width, barY + barH - 0.5);
            ctx.stroke();
            ctx.restore();
        }

        function drawRouteArrows(route, routeIdx) {
            const pts = route.pts;
            if (pts.length < 2) return;
            const segLen = CELL;
            const totalLen = (pts.length - 1) * segLen;
            const spacing = Math.max(CELL * 1.5, 26);
            const phase = (routeIdx || 0) * 0.37;
            const speed = CELL * 0.85;
            const offset = ((arrowAnimTime + phase) * speed) % spacing;
            const isIn = route.kind === 'in';
            const color = isIn ? 'rgba(170, 220, 255, 0.55)' : 'rgba(255, 220, 170, 0.50)';
            const size = Math.max(4, CELL * 0.25);
            const spread = Math.PI * 0.25;
            ctx.save();
            ctx.fillStyle = color;
            for (let d = offset; d < totalLen; d += spacing) {
                let segIdx = Math.floor(d / segLen);
                if (segIdx >= pts.length - 1) segIdx = pts.length - 2;
                const t = (d - segIdx * segLen) / segLen;
                const p0 = pts[segIdx], p1 = pts[segIdx + 1];
                const ax = p0.x + (p1.x - p0.x) * t;
                const ay = p0.y + (p1.y - p0.y) * t;
                const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
                const bx1 = ax + Math.cos(ang + Math.PI - spread) * size;
                const by1 = ay + Math.sin(ang + Math.PI - spread) * size;
                const bx2 = ax + Math.cos(ang + Math.PI + spread) * size;
                const by2 = ay + Math.sin(ang + Math.PI + spread) * size;
                ctx.beginPath();
                ctx.moveTo(ax, ay); ctx.lineTo(bx1, by1); ctx.lineTo(bx2, by2);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawPendingBuilds() {
            if (pendingBuilds.length === 0) return;
            const tNow = Date.now() / 420;
            const sf = CELL / baseCellPx;
            for (const order of pendingBuilds) {
                const d = TOWER_TYPES[order.type];
                if (!d) continue;
                const cost = getBuildCost(order.type);
                const px = cellCenterX(order.col), py = cellCenterY(order.row);
                const affordable = money >= cost;
                const pulse = 0.5 + Math.sin(tNow + order.col * 0.7 + order.row * 1.3) * 0.5;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([5, 4]);
                ctx.lineDashOffset = -(arrowAnimTime * 18) % 9;
                ctx.strokeStyle = affordable ? 'rgba(255, 217, 102, 0.95)' : 'rgba(255, 217, 102, 0.45)';
                ctx.lineWidth = 2;
                ctx.strokeRect(cellLeft(order.col) + 3.5, cellTop(order.row) + 3.5, CELL - 7, CELL - 7);
                ctx.setLineDash([]);
                ctx.globalAlpha = 0.30 + pulse * 0.28;
                drawTowerLogo(ctx, order.type, 1, px, py, -Math.PI / 2, '#ffd966', sf);
                ctx.globalAlpha = 1;
                const lbl = `🏗 ${cost}`;
                ctx.font = 'bold 9px "Microsoft YaHei"';
                const lw = ctx.measureText(lbl).width + 10;
                ctx.fillStyle = 'rgba(8, 14, 24, 0.9)';
                roundRect(ctx, px - lw / 2, cellTop(order.row) + CELL - 12, lw, 11, 4);
                ctx.fill();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = affordable ? '#ffd966' : '#ff9a8a';
                ctx.fillText(lbl, px, cellTop(order.row) + CELL - 6);
                ctx.restore();
            }
        }

        // ============================================================
        // 游戏主绘制
        // ============================================================
        function drawGame() {
            if (!bgGradient) {
                bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGradient.addColorStop(0, '#04070e');
                bgGradient.addColorStop(0.5, '#060a14');
                bgGradient.addColorStop(1, '#03060c');
            }
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (bgCanvas) ctx.drawImage(bgCanvas, mapOffX, mapOffY);

            const previewChanged = buildMenu && !gameOver && buildMenu.previewRoutes && isBuildPathChanged();
            const routesToDraw = previewChanged ? buildMenu.previewRoutes : routes;
            for (let ri = 0; ri < routesToDraw.length; ri++) {
                const route = routesToDraw[ri];
                if (route.pts.length < 2) continue;
                const pts = route.pts;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.strokeStyle = route.kind === 'in' ? 'rgba(70, 160, 240, 0.13)' : 'rgba(255, 180, 80, 0.11)';
                ctx.lineWidth = CELL * 0.72;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.strokeStyle = route.kind === 'in' ? 'rgba(110, 195, 255, 0.35)' : 'rgba(255, 190, 110, 0.32)';
                ctx.lineWidth = 2;
                ctx.stroke();
                drawRouteArrows(route, ri);
            }
            for (const s of starts) {
                const px = cellCenterX(s.c), py = cellCenterY(s.r);
                const t = Date.now() / 500;
                const pulse = 1 + Math.sin(t) * 0.12;
                ctx.beginPath(); ctx.arc(px, py, CELL * 0.36 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(74, 255, 120, 0.13)'; ctx.fill();
                ctx.strokeStyle = 'rgba(74, 255, 120, 0.85)'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#4aff7a'; ctx.shadowColor = '#4aff7a'; ctx.shadowBlur = 10;
                ctx.fill(); ctx.shadowBlur = 0;
            }
            for (const x of exits) {
                const px = cellCenterX(x.c), py = cellCenterY(x.r);
                ctx.beginPath(); ctx.arc(px, py, CELL * 0.26, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 170, 68, 0.85)';
                ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
            }

            // 进阶难度机制 18：深渊泥潭
            if (ascensionState && ascensionState.mudPit) {
                for (const pit of mudPits) {
                    ctx.beginPath();
                    ctx.arc(cellCenterX(pit.c), cellCenterY(pit.r), CELL * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(80, 40, 100, 0.4)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(150, 80, 200, 0.6)';
                    ctx.stroke();
                }
            }

            for (const b of bases) {
                const px = cellCenterX(b.c), py = cellCenterY(b.r);
                const pulse = 1 + Math.sin(Date.now() / 300) * 0.08;
                const alive = b.cores > 0;
                const sf = CELL / baseCellPx;
                ctx.beginPath(); ctx.arc(px, py, 18 * pulse * sf, 0, Math.PI * 2);
                ctx.fillStyle = alive ? 'rgba(74, 255, 122, 0.14)' : 'rgba(120, 120, 120, 0.10)'; ctx.fill();
                ctx.beginPath(); ctx.arc(px, py, 14 * sf, 0, Math.PI * 2);
                ctx.fillStyle = alive ? 'rgba(74, 255, 122, 0.85)' : 'rgba(110, 120, 130, 0.6)';
                ctx.shadowColor = alive ? '#4aff7a' : '#555'; ctx.shadowBlur = 22;
                ctx.fill(); ctx.shadowBlur = 0;
                ctx.font = `bold ${Math.round(13 * sf)}px "Microsoft YaHei"`;
                ctx.fillStyle = '#06120a';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(String(b.cores), px, py + 1);
            }
            drawPendingBuilds();
            const tsf = CELL / baseCellPx;
            for (const t of towers) {
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                const typeDef = TOWER_TYPES[t.type];
                if (selectedTower === t) {
                    const st = towerStatsAt(t.type, t.level);
                    const rMul = (t.buffs && t.buffs.range) || 1;
                    const rb = (rogueState && rogueState.bonus) ? rogueState.bonus : { range: 1 };
                    const rangeRadius = st.range * rMul * rb.range * CELL;
                    ctx.beginPath(); ctx.arc(px, py, rangeRadius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(126, 200, 255, 0.06)'; ctx.fill();
                    ctx.strokeStyle = rMul > 1.0001 ? 'rgba(74, 255, 208, 0.55)' : 'rgba(126, 200, 255, 0.35)';
                    ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    if (rMul > 1.0001) {
                        ctx.beginPath(); ctx.arc(px, py, st.range * CELL, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(126, 200, 255, 0.18)';
                        ctx.lineWidth = 1; ctx.setLineDash([2, 4]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                drawTowerBase(px, py, t, typeDef);
                drawTowerLogo(ctx, t.type, t.level, px, py, t.angle, LEVEL_COLORS[Math.min(t.level, MAX_LEVEL) - 1], tsf);
                if (selectedTower === t) {
                    ctx.beginPath(); ctx.arc(px, py, TOWER_RADIUS + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 3; ctx.stroke();
                }
                if (t.autoUpgrade && t.level < MAX_LEVEL) {
                    ctx.beginPath();
                    ctx.arc(px + TOWER_RADIUS * 0.9, py - TOWER_RADIUS * 0.9, Math.max(2, 3.2 * tsf), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(74, 255, 208, 0.9)';
                    ctx.shadowColor = '#4affd0'; ctx.shadowBlur = 6;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
                if (t.silenceTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(px, py, TOWER_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(200, 100, 255, 0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                if (t.overheatTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(px, py, TOWER_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 100, 50, 0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
            for (const t of towers) {
                if (t.type === 'prism' && t.beamTargets && t.beamTargets.length) {
                    const px = cellCenterX(t.col), py = cellCenterY(t.row);
                    for (const e of t.beamTargets) {
                        if (enemies.indexOf(e) === -1) continue;
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y);
                        ctx.strokeStyle = 'rgba(255, 102, 221, 0.75)';
                        ctx.lineWidth = 2.5 * tsf; ctx.lineCap = 'round';
                        ctx.shadowColor = '#ff66dd'; ctx.shadowBlur = 10; ctx.stroke();
                        ctx.strokeStyle = 'rgba(255, 230, 250, 0.9)';
                        ctx.lineWidth = 1 * tsf; ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    continue;
                }
                if (t.type !== 'laser' || !t.beamOn || !t.beamTarget) continue;
                if (enemies.indexOf(t.beamTarget) === -1) continue;
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(t.beamTarget.x, t.beamTarget.y);
                ctx.strokeStyle = 'rgba(255, 80, 110, 0.85)';
                ctx.lineWidth = 3.5 * tsf; ctx.lineCap = 'round';
                ctx.shadowColor = '#ff4466'; ctx.shadowBlur = 12; ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 225, 235, 0.9)';
                ctx.lineWidth = 1.2 * tsf; ctx.stroke();
                ctx.shadowBlur = 0;
            }
            for (const e of enemies) {
                drawEnemy(e);
                if (selectedEnemy === e) {
                    const sf2 = CELL / baseCellPx;
                    const r2 = ENEMY_TYPES[e.type].size * sf2 * (e.isElite ? 1.3 : 1) + 8;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, r2, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 217, 102, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            for (const core of looseCores) {
                const pulse = 1 + Math.sin(Date.now() / 200 + (core.phase || 0)) * 0.18;
                ctx.beginPath(); ctx.arc(core.x, core.y, 6 * pulse * tsf, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 217, 102, 0.25)'; ctx.fill();
                ctx.beginPath(); ctx.arc(core.x, core.y, 4 * tsf, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd966';
                ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 14;
                ctx.fill(); ctx.shadowBlur = 0;
                if (core.delay > 0) {
                    ctx.beginPath(); ctx.arc(core.x, core.y, 9 * tsf, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(74, 255, 208, 0.55)';
                    ctx.lineWidth = 1.2 * tsf;
                    ctx.setLineDash([3 * tsf, 3 * tsf]); ctx.stroke(); ctx.setLineDash([]);
                }
                
            }
            for (const p of projectiles) {
                const alpha = Math.max(p.life / p.maxLife, 0);
                ctx.globalAlpha = alpha;
                
                if (p.kind === 'missile') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle || 0);
                    
                    const mColor = p.venom ? '#7aff4a' : '#c44aff';
                    const mFlame = p.venom ? 'rgba(150, 255, 120, 0.8)' : 'rgba(255, 170, 68, 0.8)';
                    ctx.beginPath();
                    ctx.arc(-6 * tsf, 0, 4 * tsf, 0, Math.PI * 2);
                    ctx.fillStyle = mFlame;
                    ctx.shadowColor = p.venom ? '#7aff4a' : '#ffaa44';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(8 * tsf, 0);
                    ctx.lineTo(-5 * tsf, -3.5 * tsf);
                    ctx.lineTo(-3 * tsf, 0);
                    ctx.lineTo(-5 * tsf, 3.5 * tsf);
                    ctx.closePath();
                    ctx.fillStyle = mColor;
                    ctx.shadowColor = mColor;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    
                    ctx.restore();
                    ctx.globalAlpha = 1;
                    continue;
                }

                if (p.kind === 'beam') {
                    ctx.beginPath(); ctx.moveTo(p.fromX, p.fromY); ctx.lineTo(p.toX, p.toY);
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.width;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.kind === 'ring') {
                    const r = p.radius * (1 - alpha * 0.7);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
                } else if (p.kind === 'shockwave') {
                    const r = p.radius * (1 - alpha);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
                } else if (p.kind === 'boom') {
                    const r = p.radius * (1 - alpha);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.fill();
                } else if (p.kind === 'chain') {
                    ctx.beginPath();
                    ctx.moveTo(p.points[0], p.points[1]);
                    for (let i = 2; i < p.points.length; i += 2) ctx.lineTo(p.points[i], p.points[i + 1]);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.kind === 'railbeam') {
                    ctx.beginPath(); ctx.moveTo(p.fromX, p.fromY); ctx.lineTo(p.toX, p.toY);
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.width;
                    ctx.lineCap = 'butt';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 12; ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.lineWidth = Math.max(1, p.width * 0.3);
                    ctx.shadowBlur = 0; ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }
            if (buildMenu && !gameOver) { drawBuildRangePreview(); drawBuildMenu(); }
            if (towerMenu && !gameOver) drawTowerMenu();


            let hudY = 56;
            drawGameTopInfo(10, hudY);
            hudY += 48;
            drawEnergyPanel(10, hudY);
            hudY += 48;
            
            if (waveIndex < totalWaves && !gameOver) {
                drawWaveCountdown(10, hudY);
                hudY += 38;
            }

            const showAsc = selectedAscension > 0;

            // 1. 无尽模式单独显示
            if (currentModeKey === 'endless') {
                drawStatusBadge(10, hudY, '♾ 无尽模式', 'rgba(126, 200, 255, 0.75)', '#7ec8ff');
                hudY += 30;
            }

            // 2. Roguelike 单独显示
            if (rogueState) {
                drawStatusBadge(10, hudY, '🧬 Roguelike', 'rgba(216, 176, 255, 0.75)', '#d8b0ff');
                hudY += 30;
            }

            // 3. 其他状态合并（路线反转、禁升级）
            const otherParts = [];
            if (routeReverse) otherParts.push('🔀 路线反转');
            
            if (otherParts.length > 0) {
                drawStatusBadge(10, hudY, otherParts.join('  ·  '), 'rgba(126, 200, 255, 0.75)', '#7ec8ff');
                hudY += 30;
            }

            ascGamePanelRect = null;
            if (showAsc) {
                drawAscensionGamePanel(10, hudY);
            }
            drawPendingBadge();
            drawZoomBadge();
            drawAutoUpgradeToggle();
            drawWavePipeline();

            if (rogueState && canvas.width >= 1000) {
                drawRoguePanels();
            }

            if (gameOver && gameResult) drawResultPanel();
            if (draftPanel) drawDraftPanel();
        }

        function drawTowerBase(px, py, t, typeDef) {
            const R = TOWER_RADIUS;
            const lvColor = LEVEL_COLORS[Math.min(t.level, MAX_LEVEL) - 1];
            const sides = 8, rot = Math.PI / sides;
            const baseR = R + Math.max(2, R * 0.14);
            const sideOffset = Math.max(2, R * 0.22);
            const shadowCY = py + R * 0.55;
            const shadowGrad = ctx.createRadialGradient(px, shadowCY, 0, px, shadowCY, R * 1.25);
            shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
            shadowGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.18)');
            shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath(); ctx.ellipse(px, shadowCY, R * 1.25, R * 0.6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2 + rot;
                const x = px + Math.cos(a) * baseR;
                const y = py + Math.sin(a) * baseR + sideOffset;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const sideGrad = ctx.createLinearGradient(px, py, px, py + baseR + sideOffset);
            sideGrad.addColorStop(0, '#22334a');
            sideGrad.addColorStop(0.55, '#101a2a');
            sideGrad.addColorStop(1, '#03060c');
            ctx.fillStyle = sideGrad; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2 + rot;
                const x = px + Math.cos(a) * baseR;
                const y = py + Math.sin(a) * baseR;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const topGrad = ctx.createRadialGradient(px - baseR * 0.4, py - baseR * 0.4, baseR * 0.1, px, py, baseR * 1.1);
            topGrad.addColorStop(0, '#4a6288');
            topGrad.addColorStop(0.4, '#2a3e5a');
            topGrad.addColorStop(0.82, '#141f30');
            topGrad.addColorStop(1, '#080e18');
            ctx.fillStyle = topGrad; ctx.fill();
            ctx.strokeStyle = 'rgba(120, 170, 220, 0.55)'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            ctx.beginPath();
            ctx.arc(px - baseR * 0.12, py - baseR * 0.12, baseR * 0.78, Math.PI * 1.05, Math.PI * 1.42);
            ctx.strokeStyle = 'rgba(200, 230, 255, 0.35)'; ctx.lineWidth = Math.max(1, R * 0.06); ctx.stroke();
            const innerR = R * 0.82;
            const innerGrad = ctx.createRadialGradient(px - innerR * 0.35, py - innerR * 0.35, 0, px, py, innerR);
            innerGrad.addColorStop(0, '#0d1726');
            innerGrad.addColorStop(1, '#010205');
            ctx.beginPath(); ctx.arc(px, py, innerR, 0, Math.PI * 2);
            ctx.fillStyle = innerGrad; ctx.fill();
            ctx.beginPath();
            ctx.arc(px, py, innerR, Math.PI * 1.08, Math.PI * 1.92);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)'; ctx.lineWidth = Math.max(1, R * 0.06); ctx.stroke();
            ctx.beginPath();
            ctx.arc(px, py, innerR, Math.PI * 0.15, Math.PI * 0.85);
            ctx.strokeStyle = 'rgba(95, 135, 175, 0.5)'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            ctx.beginPath(); ctx.arc(px, py, baseR * 0.93, 0, Math.PI * 2);
            ctx.strokeStyle = lvColor + '66'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            const dots = 4;
            const dotR = Math.max(1, R * 0.07);
            for (let i = 0; i < dots; i++) {
                const a = (i / dots) * Math.PI * 2 + Math.PI / 4;
                const dx = px + Math.cos(a) * baseR * 0.93;
                const dy = py + Math.sin(a) * baseR * 0.93;
                ctx.beginPath(); ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
                ctx.fillStyle = lvColor;
                ctx.shadowColor = lvColor; ctx.shadowBlur = Math.max(3, R * 0.25);
                ctx.fill(); ctx.shadowBlur = 0;
            }
        }

        function enemyRevealed(e) {
            for (const t of towers) {
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                const d = Math.hypot(e.x - px, e.y - py);
                if (d <= getStealthRevealRadius(t)) return true;
                if (t.type === 'temporal' && t.level >= MAX_LEVEL) {
                    const st = towerStatsAt('temporal', t.level);
                    if (d <= st.range * CELL) return true;
                }
            }
            return false;
        }

        function drawEnemy(e) {
            const type = ENEMY_TYPES[e.type];
            const sf = CELL / baseCellPx;
            const size = type.size * sf * (e.isElite ? 1.3 : 1);
            const color = type.color;
            const stealth = !!type.stealth;
            const revealed = !stealth || enemyRevealed(e);
            if (stealth && !revealed) ctx.globalAlpha = 0.32;
            if (type.air) {
                ctx.beginPath();
                ctx.ellipse(e.x, e.y + size + 8 * sf, size * 0.9, size * 0.35, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; ctx.fill();
            }
            
            // 进阶难度机制12：精英光环
            if (e.isElite) {
                ctx.beginPath();
                ctx.arc(e.x, e.y, size + 6 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 2 * sf;
                ctx.stroke();
            }

            const barW = Math.max(28 * sf, size * 2.5);
            const hpPercent = Math.max(e.hp / e.maxHp, 0);
            const barH = Math.max(2, 3 * sf);
            if (e.maxShield > 0 && e.shield > 0) {
                const sp = e.shield / e.maxShield;
                ctx.fillStyle = '#1a2a4a';
                ctx.fillRect(e.x - barW / 2, e.y - size - 18 * sf, barW, barH);
                ctx.fillStyle = '#66aaff';
                ctx.fillRect(e.x - barW / 2, e.y - size - 18 * sf, barW * sp, barH);
            }
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x - barW / 2, e.y - size - 12 * sf, barW, barH);
            ctx.fillStyle = hpPercent > 0.5 ? '#4aff4a' : (hpPercent > 0.25 ? '#ffaa00' : '#ff4444');
            ctx.fillRect(e.x - barW / 2, e.y - size - 12 * sf, barW * hpPercent, barH);
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.fillStyle = color;
            ctx.shadowColor = color; ctx.shadowBlur = 12;
            if (e.type === 'runner') {
                ctx.beginPath();
                ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0); ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 20; ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            } else if (e.type === 'tank') {
                ctx.fillRect(-size * 0.9, -size * 0.9, size * 1.8, size * 1.8);
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fillRect(-size * 0.4, -size * 0.4, size * 0.8, size * 0.8);
            } else if (e.type === 'flyer') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-size * 1.4, -2, size * 0.7, size * 0.3, -0.3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(size * 1.4, -2, size * 0.7, size * 0.3, 0.3, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'boss') {
                ctx.beginPath(); ctx.arc(0, 0, size + 4 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 180, 255, 0.5)'; ctx.lineWidth = 3 * sf; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size * 0.7, -size * 0.55); ctx.lineTo(-size * 0.55, -size * 1.15);
                ctx.lineTo(-size * 0.25, -size * 0.75); ctx.lineTo(0, -size * 1.25);
                ctx.lineTo(size * 0.25, -size * 0.75); ctx.lineTo(size * 0.55, -size * 1.15);
                ctx.lineTo(size * 0.7, -size * 0.55); ctx.closePath();
                ctx.fillStyle = '#ffdd44'; ctx.fill();
            } else if (e.type === 'shield') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size * 0.6, -size * 0.25); ctx.lineTo(-size * 0.6, size * 0.25);
                ctx.lineTo(0, size * 0.8); ctx.lineTo(size * 0.6, size * 0.25);
                ctx.lineTo(size * 0.6, -size * 0.25); ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.fill();
            } else if (e.type === 'shaman') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 3 * sf;
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.5); ctx.lineTo(0, size * 0.5);
                ctx.moveTo(-size * 0.5, 0); ctx.lineTo(size * 0.5, 0); ctx.stroke();
            } else if (e.type === 'brute') {
                ctx.fillRect(-size, -size, size * 2, size * 2);
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(-size * 0.55, -size * 0.55, size * 1.1, size * 1.1);
            } else if (e.type === 'ghost') {
                ctx.globalAlpha = 0.55;
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            } else if (e.type === 'wasp') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();

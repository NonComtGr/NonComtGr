                ctx.beginPath(); ctx.ellipse(-size * 1.1, -2, size * 0.5, size * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(size * 1.1, -2, size * 0.5, size * 0.25, 0.4, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'hatcher' || e.type === 'summoner' || e.type === 'jammer') {
            drawSpecialEnemyBody(ctx, e.type, size, color);}
            else if (stealth) {
                ctx.globalAlpha = 0.6;
                drawStealthShape(ctx, e.type, size, color);
                drawSpecialEnemyBody(ctx, e.type, size, color);
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            } else {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.shadowBlur = 0;
            const eyeR = Math.max(1.5, size * 0.2);
            const pupilR = Math.max(0.8, size * 0.1);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-size * 0.3, -size * 0.2, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size * 0.3, -size * 0.2, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-size * 0.3, -size * 0.2, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size * 0.3, -size * 0.2, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            if (e.charmed) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 6 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 120, 220, 0.9)'; ctx.lineWidth = 2 * sf;
                ctx.setLineDash([4 * sf, 3 * sf]); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#ff88dd';
                ctx.font = `${Math.round(11 * sf)}px "Microsoft YaHei"`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('💖', e.x, e.y - size - 16 * sf);
            }
            if (e.slowTimer > 0) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 5 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(74, 255, 208, 0.8)'; ctx.lineWidth = 2 * sf; ctx.stroke();
            }
            if (e.burnTimer > 0) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 8 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 110, 60, 0.75)'; ctx.lineWidth = 2 * sf;
                ctx.setLineDash([3 * sf, 3 * sf]); ctx.stroke(); ctx.setLineDash([]);
            }
            if (e.poison && e.poison.length > 0) {
                const stacks = Math.min(e.poison.length, 6);
                for (let k = 0; k < stacks; k++) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, size + (4 + k * 1.5) * sf, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(122, 255, 74, ${0.5 - k * 0.07})`;
                    ctx.lineWidth = 1.2 * sf; ctx.stroke();
                }
            }
            if (e.stunTimer > 0) {
                const t2 = Date.now() / 120;
                ctx.save();
                ctx.fillStyle = '#ffe066';
                ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 8;
                for (let k = 0; k < 3; k++) {
                    const a = t2 + k * Math.PI * 2 / 3;
                    const rx = Math.cos(a) * (size + 8 * sf);
                    const ry = Math.sin(a) * (size + 4 * sf) - size - 4 * sf;
                    ctx.beginPath(); ctx.arc(e.x + rx, e.y + ry, 2.2 * sf, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
            if (e.carrying > 0) {
                const n = Math.min(e.carrying, 4);
                ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffd966';
                for (let k = 0; k < n; k++) {
                    ctx.beginPath();
                    ctx.arc(e.x - (n - 1) * 4 * sf + k * 8 * sf, e.y + size + 12 * sf, 3 * sf, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                if (e.carrying > 4) {
                    ctx.font = `bold ${Math.round(9 * sf)}px "Microsoft YaHei"`;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffd966';
                    ctx.fillText('+' + (e.carrying - 4), e.x + (n - 1) * 4 * sf + 6 * sf, e.y + size + 12 * sf);
                }
            }
            ctx.globalAlpha = 1;
            if (stealth) {
                const ringMul = { wraith: 1.45, phantom: 1.35, stalker: 1.4, specter: 1.9, shade: 1.75 }[e.type] || 1.3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, size * ringMul + Math.sin(Date.now() / 280) * 1.5 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = revealed ? 'rgba(126, 200, 255, 0.75)' : 'rgba(150, 175, 220, 0.30)';
                ctx.lineWidth = 1.4 * sf;
                ctx.setLineDash([4 * sf, 4 * sf]); ctx.stroke(); ctx.setLineDash([]);
            }
        }

        // ============================================================
        // 战斗逻辑
        // ============================================================
        function applyStun(e, dur) {
            if (!e || dur <= 0) return;
            const m = (rogueState && rogueState.enemyMods && rogueState.enemyMods.stunMul) || 1;
            e.stunTimer = Math.max(e.stunTimer || 0, dur * m);
        }

        function damageEnemy(e, dmg, tower, skipDoubleShot, opts) {
            if (e.hp <= 0) return;
            opts = opts || {};
            const isDot = !!opts.dot;
            const em = (rogueState && rogueState.enemyMods) ? rogueState.enemyMods : null;
            if (em) {
                if (em.coreLockStacks > 0 && e.carrying <= 0) {
                    dmg *= Math.pow(0.8, em.coreLockStacks);
                }
                if (!isDot && em.dodge > 0 && Math.random() < em.dodge) return;
            }
            
            // 进阶难度机制 17：反伤装甲
            if (tower && e.type === 'shield' && ascensionState && ascensionState.reflect) {
                if (Math.random() < 0.2) {
                    tower.slowTimer = Math.max(tower.slowTimer || 0, 2.0);
                }
            }

            const hpBefore = e.hp, shBefore = e.shield;
            if (!isDot && !skipDoubleShot && rogueState && tower && rogueState.bonus.currentHpDamage > 0) {
                dmg += e.hp * rogueState.bonus.currentHpDamage;
            }
            if (!isDot && !skipDoubleShot && rogueState && rogueState.bonus.critChance > 0 && Math.random() < rogueState.bonus.critChance) dmg *= (rogueState.bonus.critDmgMul || 2);
            if (rogueState && rogueState.bonus.ignoreShield) {
                e.hp -= dmg;
            } else {
                if (e.shield > 0) {
                    const absorbed = Math.min(e.shield, dmg);
                    e.shield -= absorbed;
                    dmg -= absorbed;
                }
                e.hp -= dmg;
            }
            if (tower) {
                const actual = (hpBefore - Math.max(0, e.hp)) + (shBefore - e.shield);
                if (actual > 0) {
                    tower.damageDealt = (tower.damageDealt || 0) + actual;
                    e.lastHitBy = tower;
                }
            }
            if (!isDot && !skipDoubleShot && tower && rogueState && rogueState.bonus.charmChance > 0 && e.hp > 0 && !e.charmed) {
                if (Math.random() < rogueState.bonus.charmChance) charmEnemy(e);
            }
            if (!skipDoubleShot && tower && rogueState && rogueState.bonus.doubleShotChance > 0 && e.hp > 0 && Math.random() < rogueState.bonus.doubleShotChance) {
                // 弹射（方案B）
                let nearest = null, minDist = 2.5 * CELL;
                for (const other of enemies) {
                    if (other === e || other.hp <= 0) continue;
                    const d = Math.hypot(other.x - e.x, other.y - e.y);
                    if (d < minDist) { minDist = d; nearest = other; }
                }
                if (nearest) {
                    damageEnemy(nearest, dmg * 0.7, tower, true);
                    projectiles.push({ kind: 'beam', fromX: e.x, fromY: e.y, toX: nearest.x, toY: nearest.y, color: '#88ccff', width: 2, life: 0.1, maxLife: 0.1 });
                }
            }
        }

        function applyVenomStack(e, v) {
            if (!e || e.hp <= 0 || !v) return;
            if (!e.poison) e.poison = [];
            if (e.poison.length < v.maxStacks) {
                e.poison.push({ dps: v.dps, timer: v.dur });
            } else {
                let oldest = e.poison[0];
                for (const p of e.poison) if (p.timer < oldest.timer) oldest = p;
                oldest.dps = Math.max(oldest.dps, v.dps);
                oldest.timer = v.dur;
            }
        }

        function cleanupDeadEnemies() {
            let changed = false;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hp <= 0) {
                    if (e.lastHitBy && towers.indexOf(e.lastHitBy) !== -1) {
                        e.lastHitBy.kills = (e.lastHitBy.kills || 0) + 1;
                    }
                    let harvestBonus = 0;
                    for (const ht of towers) {
                        if (ht.type !== 'harvester') continue;
                        const hs = towerStatsAt('harvester', ht.level);
                        const rMul = (ht.buffs && ht.buffs.range) || 1;
                        const hRange = hs.range * rMul * CELL;
                        const dd = Math.hypot(e.x - cellCenterX(ht.col), e.y - cellCenterY(ht.row));
                        if (dd <= hRange) harvestBonus = Math.max(harvestBonus, e.reward * hs.harvest);
                    }
                    const rogueKillBonus = (rogueState && rogueState.bonus.killBonus) || 0;
                    let rogueRewardMul = (rogueState && rogueState.bonus.rewardMul) || 1;
                    if (ascensionState && ascensionState.ecoNerf) {
                        const st = getEnergyStats();
                        const totalCores = st.green + st.yellow;
                        rogueRewardMul *= Math.min(1, totalCores / 20);
                    }
                    money += (e.reward * rogueRewardMul + harvestBonus + rogueKillBonus);
                    if (battleStats) battleStats.kills++;
                    if (e.carrying > 0) {
                        const cd = getCoreDelayStacks() * 3.0;
                        for (let k = 0; k < e.carrying; k++) {
                            looseCores.push({
                                x: e.x + (Math.random() - 0.5) * 8,
                                y: e.y + (Math.random() - 0.5) * 8,
                                cellC: e.cellC, cellR: e.cellR,
                                nextC: null, nextR: null,
                                dirC: 0, dirR: 0, nextDirC: 0, nextDirR: 0,
                                delay: cd + k * 0.12,
                                phase: Math.random() * Math.PI * 2,
                            });
                        }
                    }

                    // 进阶难度机制 3：隐形怪死亡沉默
                    if (ascensionState && ascensionState.stealthDeathSilence && ENEMY_TYPES[e.type].stealth) {
                        const silenceR = 2.5 * CELL;
                        for (const t of towers) {
                            const d = Math.hypot(cellCenterX(t.col) - e.x, cellCenterY(t.row) - e.y);
                            if (d <= silenceR) {
                                t.silenceTimer = Math.max(t.silenceTimer || 0, 3.0);
                            }
                        }
                        projectiles.push({ kind: 'shockwave', x: e.x, y: e.y, radius: silenceR, color: 'rgba(150, 150, 255, 0.6)', life: 0.5, maxLife: 0.5 });
                    }

                    // 进阶难度机制 19：梦魇重生
                    if (ascensionState && ascensionState.bossSplit && e.type === 'boss') {
                        for (let k = 0; k < 2; k++) {
                            enemies.push({
                                type: 'brute',
                                waveId: e.waveId,
                                x: e.x + (Math.random() - 0.5) * CELL,
                                y: e.y + (Math.random() - 0.5) * CELL,
                                cellC: e.cellC, cellR: e.cellR,
                                state: 'toBase', hp: Math.round(e.maxHp * 0.3), maxHp: Math.round(e.maxHp * 0.3),
                                speed: e.speed * 1.2, reward: Math.floor(e.reward * 0.3),
                                carrying: 0, steal: 1, shield: 0, maxShield: 0
                            });
                        }
                    }
                    if (ENEMY_TYPES[e.type].hatcher) {
                        const hatchPool = [
                            'grunt', 'runner', 'shield', 'flyer', 'wasp',
                            'tank', 'ghost', 'brute', 'wraith', 'phantom',
                            'stalker', 'specter', 'shade'
                        ];

                        // 波次越高：种类越多，最多 4 种；数量越多，属性越强
                        const kinds = Math.min(4, 1 + Math.floor(e.waveId / 8));
                        const baseCount = 2 + Math.floor(e.waveId / 6);
                        const childHp = Math.max(
                            8,
                            Math.round(e.maxHp * (0.10 + Math.min(0.30, e.waveId * 0.006)))
                        );

                        for (let i = 0; i < kinds; i++) {
                            const type = hatchPool[Math.floor(Math.random() * hatchPool.length)];
                            for (let k = 0; k < baseCount; k++) {
                                spawnEnemy(
                                    {
                                        type,
                                        hp: childHp,
                                        maxHp: childHp,
                                        speed: (ENEMY_STATS[type] ? ENEMY_STATS[type].spdFactor : 1) * (1 + e.waveId * 0.01),
                                        reward: Math.max(1, Math.floor(childHp * 0.02)),
                                        startIdx: 0
                                    },
                                    e.waveId,
                                    {
                                        at: { c: e.cellC, r: e.cellR },
                                        x: e.x + (Math.random() - 0.5) * CELL,
                                        y: e.y + (Math.random() - 0.5) * CELL,
                                        countAlive: true
                                    }
                                );
                            }
                        }
                    }

                    SFX.kill();
                    enemies.splice(i, 1);
                    onEnemyRemoved(e);
                    changed = true;
                }
            }
            if (changed) updateUI();
        }

        function updateCharmCollisions() {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (!e || !e.charmed || e.hp <= 0) continue;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (i === j) continue;
                    const o = enemies[j];
                    if (!o || o.hp <= 0 || o.charmed) continue;
                    if (o.type !== e.type) continue;
                    const d = Math.hypot(e.x - o.x, e.y - o.y);
                    const sizeSum = (ENEMY_TYPES[e.type].size + ENEMY_TYPES[o.type].size) * (CELL / baseCellPx) * 0.9;
                    if (d <= Math.max(CELL * 0.7, sizeSum)) {
                        const px = (e.x + o.x) / 2, py = (e.y + o.y) / 2;
                        projectiles.push({ kind: 'boom', x: px, y: py, radius: CELL * 0.8, color: '#ff88dd', life: 0.3, maxLife: 0.3 });
                        e.hp = 0; o.hp = 0;
                        SFX.boom();
                        break;
                    }
                }
            }
        }

        function updateEnemies(dt) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (!e) continue;
                if (e.poison && e.poison.length) {
                    let total = 0;
                    for (let k = e.poison.length - 1; k >= 0; k--) {
                        const p = e.poison[k];
                        p.timer -= dt;
                        if (p.timer <= 0) { e.poison.splice(k, 1); continue; }
                        total += p.dps;
                    }
                    if (total > 0) damageEnemy(e, total * dt, null, false, { dot: true });
                }
                if (e.burnTimer > 0) {
                    e.burnTimer -= dt;
                    damageEnemy(e, e.burnDps * dt, e.burnTower, false, { dot: true });
                }
                if (ENEMY_TYPES[e.type].healer) {
                    e.healCd -= dt;
                    if (e.healCd <= 0) {
                        e.healCd = 2.0;
                        let healR = 3.0 * CELL;
                        let healAmt = e.maxHp * 0.05;
                        if (ascensionState && ascensionState.shamanBuff) {
                            healR = 9999;
                            healAmt *= 2;
                        }
                        for (const other of enemies) {
                            if (other === e || other.hp <= 0) continue;
                            const d = Math.hypot(other.x - e.x, other.y - e.y);
                            if (d <= healR) other.hp = Math.min(other.maxHp, other.hp + healAmt);
                        }
                        projectiles.push({
                            kind: 'ring', x: e.x, y: e.y, radius: Math.min(healR, 3000),
                            color: 'rgba(100, 255, 150, 0.55)', life: 0.5, maxLife: 0.5
                        });
                    }
                }
                if (ENEMY_TYPES[e.type].summoner && e.hp > 0) {
    if (e.summonTimer > 0) {
        e.summonTimer -= dt;
    } else {
        e.summonCd -= dt;
        if (e.summonCd <= 0) {
            e.summonCd = 4.0; // 每 4 秒召唤一次，可自行调
            const type = e.summonType || 'grunt';
            const hp = Math.max(
                8,
                Math.round(e.maxHp * (0.10 + Math.min(0.20, e.waveId * 0.004)))
            );

            spawnEnemy(
                {
                    type,
                    hp,
                    maxHp: hp,
                    speed: 1.0 + e.waveId * 0.02,
                    reward: Math.max(1, Math.floor(hp * 0.03)),
                    startIdx: 0
                },
                e.waveId,
                {
                    at: { c: e.cellC, r: e.cellR },
                    x: e.x,
                    y: e.y,
                    countAlive: true
                }
            );

            projectiles.push({
                kind: 'ring',
                x: e.x, y: e.y,
                radius: CELL * 0.8,
                color: 'rgba(100, 255, 150, 0.6)',
                life: 0.4, maxLife: 0.4
            });
        }
    }
}
                if (e.slowTimer > 0) {
                    e.slowTimer -= dt;
                    if (e.slowTimer <= 0) e.slowFactor = 1;
                }
                let step = e.speed * 60 * dt * (CELL / baseCellPx);
                if (e.slowTimer > 0) step *= e.slowFactor;
                if (rogueState && rogueState.bonus.enemySlow < 1) step *= rogueState.bonus.enemySlow;
                if (e.stunTimer > 0) {
                    e.stunTimer -= dt;
                    if (e.stunTimer < 0) e.stunTimer = 0;
                    step = 0;
                }

                if (ascensionState && ascensionState.bloodFury && e.hp < e.maxHp * 0.3) step *= 2.0;
                if (ascensionState && ascensionState.shadowFog && ENEMY_TYPES[e.type].stealth) step *= 1.2;
                if (ascensionState && ascensionState.finalJudgment && e.hp < e.maxHp && e.hp > 0) {
                    e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.01 * dt);
                }

                let guard = 0, removed = false;
                while (step > 0 && guard++ < 12) {
                    let fieldDir;
                    if (e.state === 'toExit') fieldDir = distToExitDir;
                    else if (e.state === 'charmed') fieldDir = distToStartDir;
                    else fieldDir = hasActiveBase ? distToActiveBaseDir : distToBaseDir;
                    if (e.nextC === null) {
                        let nxt = findNextCellInDir(fieldDir, e.cellC, e.cellR, e.dirC, e.dirR);
                        if (!nxt) {
                            if (e.state === 'toBase') {
                                e.state = 'toExit';
                                fieldDir = distToExitDir;
                                nxt = findNextCellInDir(fieldDir, e.cellC, e.cellR, e.dirC, e.dirR);
                                if (!nxt) break;
                            } else break;
                        }
                        e.nextC = nxt.c; e.nextR = nxt.r;
                        e.nextDirC = nxt.dirC; e.nextDirR = nxt.dirR;
                    }
                    const tx = cellCenterX(e.nextC), ty = cellCenterY(e.nextR);
                    const dx = tx - e.x, dy = ty - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist <= step) {
                        e.x = tx; e.y = ty;
                        e.cellC = e.nextC; e.cellR = e.nextR;
                        e.dirC = e.nextDirC; e.dirR = e.nextDirR;
                        e.nextC = null; e.nextR = null;
                        step -= dist;
                        if (e.state === 'charmed') {
                            if (starts.some(s => s.c === e.cellC && s.r === e.cellR)) {
                                enemies.splice(i, 1);
                                onEnemyRemoved(e);
                                removed = true;
                                break;
                            }
                        } else if (e.state === 'toBase') {
                            const base = bases.find(b => b.c === e.cellC && b.r === e.cellR);
                            if (base) {
                                if (base.cores > 0) {
                                    const n = Math.min(e.steal - e.carrying, base.cores);
                                    if (n > 0) {
                                        base.cores -= n;
                                        e.carrying += n;
                                        SFX.steal();
                                        if (ascensionState && ascensionState.coreDestroy) {
                                            const loss = Math.floor(money * 0.1);
                                            money = Math.max(0, money - loss);
                                            msgDisplay.textContent = `核心被夺走！额外损失 ${loss} 金币`;
                                            updateUI();
                                        }
                                    }
                                    e.state = 'toExit';
                                    updateUI();
                                    rebuildActiveBaseField();
                                } else if (!hasActiveBase) {
                                    e.state = 'toExit';
                                    updateUI();
                                }
                            }
                        } else {
                            const atExit = exits.some(x => x.c === e.cellC && x.r === e.cellR);
                            if (atExit) {
                                if (e.carrying > 0) SFX.leak();
                                lostCores += e.carrying;
                                e.carrying = 0;
                                enemies.splice(i, 1);
                                onEnemyRemoved(e);
                                removed = true;
                                break;
                            }
                        }
                    } else {
                        e.x += (dx / dist) * step;
                        e.y += (dy / dist) * step;
                        step = 0;
                    }
                }
                if (removed) {
                    updateUI();
                    const st = getEnergyStats();
                    if (st.green + st.yellow <= 0) { finishBattle(false); return; }
                    continue;
                }
                if (gameOver) return;
                if (ENEMY_TYPES[e.type].jammer) {
    const jamR = 2.5 * CELL; // 干扰半径，可调
    for (const t of towers) {
        const d = Math.hypot(
            cellCenterX(t.col) - e.x,
            cellCenterY(t.row) - e.y
        );
        if (d <= jamR) {
            t.silenceTimer = Math.max(t.silenceTimer || 0, 0.25);
        }
    }
}
            }
            
            updateCharmCollisions();
        }

        function updateLooseCores(dt) {
            for (let i = looseCores.length - 1; i >= 0; i--) {
                const core = looseCores[i];
                if (core.delay > 0) { core.delay -= dt; continue; }
                
                

                const onBase = bases.find(b => b.c === core.cellC && b.r === core.cellR);
                if (onBase && core.nextC === null) {
                    onBase.cores++;
                    looseCores.splice(i, 1);
                    updateUI();
                    rebuildActiveBaseField();
                    continue;
                }
                let step = 0.5 * 60 * dt * (CELL / baseCellPx);
                if (ascensionState && ascensionState.coreNoReturn) step *= 0.5; 
                let guard = 0, gone = false;
                while (step > 0 && guard++ < 8) {
                    if (core.nextC === null) {
                        const nxt = findNextCellInDir(distToBaseDir, core.cellC, core.cellR, core.dirC || 0, core.dirR || 0);
                        if (!nxt) { looseCores.splice(i, 1); gone = true; break; }
                        core.nextC = nxt.c; core.nextR = nxt.r;
                        core.nextDirC = nxt.dirC; core.nextDirR = nxt.dirR;
                    }
                    const tx = cellCenterX(core.nextC), ty = cellCenterY(core.nextR);
                    const dx = tx - core.x, dy = ty - core.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist <= step) {
                        core.x = tx; core.y = ty;
                        core.cellC = core.nextC; core.cellR = core.nextR;
                        core.dirC = core.nextDirC || 0; core.dirR = core.nextDirR || 0;
                        core.nextC = null; core.nextR = null;
                        step -= dist;
                        const b = bases.find(bb => bb.c === core.cellC && bb.r === core.cellR);
                        if (b) {
                            b.cores++;
                            looseCores.splice(i, 1);
                            gone = true;
                            updateUI();
                            rebuildActiveBaseField();
                            break;
                        }
                    } else {
                        core.x += (dx / dist) * step;
                        core.y += (dy / dist) * step;
                        step = 0;
                    }
                }
                if (gone) continue;
            }
        }

        function updateCorePickups() {
            if (looseCores.length === 0) return;
            for (const e of enemies) {
                if (e.charmed) continue;
                if (e.carrying >= e.steal) continue;
                for (let i = looseCores.length - 1; i >= 0; i--) {
                    const core = looseCores[i];
                    
                    const d = Math.hypot(core.x - e.x, core.y - e.y);
                    if (d < CELL * 0.55) {
                        e.carrying++;
                        looseCores.splice(i, 1);
                        if (e.state === 'toBase') {
                            e.state = 'toExit';
                            e.nextC = null; e.nextR = null;
                        }
                        if (e.carrying >= e.steal) break;
                    }
                }
            }
        }

        function enemyVisibleFromTower(e, tower, dist) {
            if (!ENEMY_TYPES[e.type].stealth) return true;
            if (dist <= getStealthRevealRadius(tower)) return true;

            // 满级减速塔的"揭示射程内隐形"特性保留
            for (const tt of towers) {
                if (tt.type !== 'temporal' || tt.level < MAX_LEVEL) continue;
                const st = towerStatsAt('temporal', tt.level);
                const px = cellCenterX(tt.col), py = cellCenterY(tt.row);
                if (Math.hypot(e.x - px, e.y - py) <= st.range * CELL) return true;
            }
            return false;
        }

        function collectTargets(t, towerPx, towerPy, rangePx) {
            const typeDef = TOWER_TYPES[t.type];
            const out = [];
            const em = (rogueState && rogueState.enemyMods) ? rogueState.enemyMods : null;
            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const isAir = ENEMY_TYPES[e.type].air;
                if (isAir && ascensionState && ascensionState.airOnlyFlak && t.type !== 'flak') continue;
                if (isAir && !typeDef.targetsAir) continue;
                if (!isAir && typeDef.airOnly) continue;
                const dx = e.x - towerPx, dy = e.y - towerPy;
                const dist = Math.hypot(dx, dy);
                if (dist > rangePx) continue;
                if (!enemyVisibleFromTower(e, t, dist)) continue;
                out.push({ e, dist });
            }
            out.sort((a, b) => {
                const pa = (a.e.carrying > 0) ? 0 : 1;
                const pb = (b.e.carrying > 0) ? 0 : 1;
                if (pa !== pb) return pa - pb;
                return a.dist - b.dist;
            });
            return out;
        }

        function findTarget(t, towerPx, towerPy, rangePx) {
            const arr = collectTargets(t, towerPx, towerPy, rangePx);
            return arr.length ? arr[0].e : null;
        }

        function turnToward(cur, target, dt, rate) {
            let diff = target - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            return cur + diff * Math.min(1, rate * dt);
        }

        const EMP_RATE_TO_DMG = 0.6;
        const EMP_RANGE_EXTRA = 2.5;

        function updateAmplifiers() {
            for (const t of towers) {
                if (!t.buffs) t.buffs = { dmg: 1, rate: 1, range: 1 };
                t.buffs.dmg = 1; t.buffs.rate = 1; t.buffs.range = 1;
            }
            for (const t of towers) {
                if (t.type !== 'amplifier') continue;
                const st = towerStatsAt('amplifier', t.level);
                const boost = st.boost;
                const rangePx = st.range * CELL;
                const tx = cellCenterX(t.col), ty = cellCenterY(t.row);
                const isMax = t.level >= MAX_LEVEL;
                const dmgBoost = boost.dmg + (isMax ? 0.10 : 0);
                for (const other of towers) {
                    if (other === t) continue;
                    if (other.type === 'amplifier') continue;
                    const d = Math.hypot(cellCenterX(other.col) - tx, cellCenterY(other.row) - ty);
                    if (d > rangePx) continue;
                    if (other.type === 'emp') {
                        other.buffs.dmg   += dmgBoost + boost.rate * EMP_RATE_TO_DMG;
                        other.buffs.range += boost.range * EMP_RANGE_EXTRA;
                    } else {
                        other.buffs.dmg   += dmgBoost;
                        other.buffs.rate  += boost.rate;
                        other.buffs.range += boost.range;
                    }
                }
            }
        }

        function clipRayToMap(px, py, ux, uy, maxLen) {
            const x0 = mapOffX, x1 = mapOffX + COLS * CELL;
            const y0 = mapOffY, y1 = mapOffY + ROWS * CELL;
            let t = maxLen;
            if (ux > 1e-9)       t = Math.min(t, (x1 - px) / ux);
            else if (ux < -1e-9) t = Math.min(t, (x0 - px) / ux);
            if (uy > 1e-9)       t = Math.min(t, (y1 - py) / uy);
            else if (uy < -1e-9) t = Math.min(t, (y0 - py) / uy);
            return Math.max(0, t);
        }

        function explodeMissile(p) {
            const isVenom = !!p.venom;

            // ── 毒弹专用分支：伤害只结算给目标，叠毒按 radius 扩散 ──
            if (isVenom) {
                const vr = p.venom.radius || 0;
                // 单体伤害：只打命中目标（1~5 级与 6 级一致）
                if (p.target && p.target.hp > 0 && enemies.indexOf(p.target) !== -1) {
                    damageEnemy(p.target, p.damage, p.tower);
                }
                // 叠毒：6 级 radius > 0 时对半径内所有敌人叠毒；1~5 级只对目标叠毒
                if (vr > 0) {
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        const d = Math.hypot(e.x - p.x, e.y - p.y);
                        if (d > vr) continue;
                        if (ENEMY_TYPES[e.type].stealth && !enemyVisibleFromTower(e, p.tower, d)) continue;
                        applyVenomStack(e, p.venom);
                    }
                } else if (p.target && p.target.hp > 0 && enemies.indexOf(p.target) !== -1) {
                    applyVenomStack(p.target, p.venom);
                }
                projectiles.push({
                    kind: 'boom', x: p.x, y: p.y,
                    radius: Math.max(vr, CELL * 0.45) * 0.85,
                    color: '#7aff4a',
                    life: 0.25, maxLife: 0.25
                });
                SFX.boom();
                return;
            }

            // ── 普通导弹（导弹塔）分支：保持原逻辑 ──
            let splashR = p.splash * CELL;
            let ratio = 0.6;
            if (p.isMax) { splashR *= 2; ratio = 1.0; }

            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const d = Math.hypot(e.x - p.x, e.y - p.y);
                if (d > splashR) continue;
                if (ENEMY_TYPES[e.type].stealth) {
                    if (!enemyVisibleFromTower(e, p.tower, d)) continue;
                }
                const dmg = (e === p.target) ? p.damage : p.damage * ratio;
                damageEnemy(e, dmg, p.tower);
            }

            projectiles.push({
                kind: 'boom', x: p.x, y: p.y,
                radius: splashR * 0.85,
                color: '#ddaaff',
                life: 0.25, maxLife: 0.25
            });
            SFX.boom();
        }

        // 进阶难度机制 11：累积过热值，连续攻击满 5 秒则停机 1 秒
        function accumulateOverheat(t, attacking, dt) {
            if (!(ascensionState && ascensionState.overheat)) return false;
            if (attacking) t.heat = (t.heat || 0) + dt;
            else t.heat = Math.max(0, (t.heat || 0) - dt * 2);
            if (t.heat >= 5) {
                t.overheatTimer = 1;
                t.heat = 0;
                t.beamOn = false;
                t.beamTarget = null;
                t.beamTargets = null;
                return true;
            }
            return false;
        }

        

        function updateTowers(dt) {
            for (const t of towers) {
                const typeDef = TOWER_TYPES[t.type];
                if (!typeDef) continue;

                // NaN 兜底：一旦角度被污染成 NaN，rotate() 会让炮管永远"卡住"
                if (!Number.isFinite(t.angle)) t.angle = -Math.PI / 2;
                if (t.type === 'harvester') continue;

                // ── 统一转向（唯一写 t.angle 的地方）──
                // 每帧无条件执行：即使被沉默 / 过热 / 装填中，炮管也跟随最近的敌人，
                // 避免状态 continue 之后角度彻底冻结。
                if (TURRET_TOWER_TYPES.has(t.type)) {
                    const aimPx = cellCenterX(t.col), aimPy = cellCenterY(t.row);
                    let aim = null, best = Infinity;
                    for (const e of enemies) {
                        if (!e || e.hp <= 0 || e.charmed) continue;
                        const dx = e.x - aimPx, dy = e.y - aimPy;
                        const dd = dx * dx + dy * dy;
                        if (dd < best) { best = dd; aim = e; }
                    }
                    if (aim) {
                        const wantAngle = Math.atan2(aim.y - aimPy, aim.x - aimPx);
                        if (Number.isFinite(wantAngle)) {
                            t.angle = turnToward(t.angle, wantAngle, dt, 18);
                        }
                    }
                }

                if (t.silenceTimer > 0) { t.silenceTimer -= dt; continue; }

                // 进阶难度机制 11：武器过热 —— 所有攻击塔连续攻击 5 秒后停机 1 秒
                if (ascensionState && ascensionState.overheat && t.overheatTimer > 0) {
                    t.overheatTimer -= dt;
                    t.beamOn = false; t.beamTarget = null; t.beamTargets = null;
                    continue;
                }

                const base = towerStatsAt(t.type, t.level);
                const bf = t.buffs || { dmg: 1, rate: 1, range: 1 };
                const rb = (rogueState && rogueState.bonus) ? rogueState.bonus : { dmg:1, rate:1, range:1 };
                let st = {
                    ...base,
                    damage:  (base.damage  || 0) * bf.dmg * rb.dmg,
                    dps:     (base.dps     || 0) * bf.dmg * rb.dmg,
                    burnDps: (base.burnDps || 0) * bf.dmg * rb.dmg,
                    poisonDps: (base.poisonDps || 0) * bf.dmg * rb.dmg,
                    cooldown:(base.cooldown || 0) / (bf.rate * rb.rate),
                    range:   (base.range   || 0) * bf.range * rb.range
                };

                if (ascensionState && ascensionState.fireDecay) {
                    const decayMul = Math.max(0.5, 1 - Math.floor(waveIndex / 10) * 0.1);
                    st.damage *= decayMul; st.dps *= decayMul; st.burnDps *= decayMul; st.poisonDps *= decayMul;
                }
                
                if (ascensionState && ascensionState.mudPit && mudPits.some(p => p.c === t.col && p.r === t.row)) {
                    st.cooldown *= 1.2;
                }

                const towerPx = cellCenterX(t.col), towerPy = cellCenterY(t.row);
                const rangePx = st.range * CELL;
                const isMax = t.level >= MAX_LEVEL;

                if (t.type === 'laser') {
                    const target = findTarget(t, towerPx, towerPy, rangePx);
                    const wasOn = t.beamOn;
                    if (target) {
                        const burnDur = isMax ? 1e9 : st.burnDur;
                        target.burnTimer = Math.max(target.burnTimer, burnDur);
                        target.burnDps   = Math.max(target.burnDps, st.burnDps);
                        target.burnTower = t;
                        t.beamOn = true; t.beamTarget = target;
                        if (!wasOn) SFX.shoot('laser');
                    } else { t.beamOn = false; t.beamTarget = null; }
                    accumulateOverheat(t, !!t.beamOn, dt);
                    continue;
                }
                if (t.type === 'prism') {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, st.targets);
                    if (picked.length) {
                        t.beamTargets = picked.map(o => o.e);
                        for (const o of picked) damageEnemy(o.e, st.dps * dt, t, false, { dot: true });
                        SFX.shoot('prism');
                    } else t.beamTargets = null;
                    accumulateOverheat(t, !!(t.beamTargets && t.beamTargets.length), dt);
                    continue;
                }

                if (t.type !== 'laser' && t.type !== 'prism') {
                    if (ascensionState && ascensionState.ammo) {
                        if (t.isReloading) {
                            const reloadCost = Math.floor(TOWER_TYPES[t.type].cost * 0.1) + t.level * 5;
                            if (money >= reloadCost) {
                                money -= reloadCost;
                                t.ammo = 50;
                                t.isReloading = false;
                                updateUI();
                                msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动装填，花费 ${reloadCost} 金币`;
                            } else {
                                continue;
                            }
                        }
                        if (t.ammo <= 0) {
                            const reloadCost = Math.floor(TOWER_TYPES[t.type].cost * 0.1) + t.level * 5;
                            if (money >= reloadCost) {
                                money -= reloadCost;
                                t.ammo = 50;
                                updateUI();
                                msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动装填，花费 ${reloadCost} 金币`;
                            } else {
                                t.isReloading = true;
                                continue;
                            }
                        }
                    }
                }

                let actualCooldown = st.cooldown;
                if (t.slowTimer > 0) {
                    t.slowTimer -= dt;
                    actualCooldown *= 2;
                }

                if (t.type === 'laser') {
                    const target = findTarget(t, towerPx, towerPy, rangePx);
                    const wasOn = t.beamOn;
                    if (target) {
                        t.angle = turnToward(t.angle, Math.atan2(target.y - towerPy, target.x - towerPx), dt, 22);
                        const burnDur = isMax ? 1e9 : st.burnDur;
                        target.burnTimer = Math.max(target.burnTimer, burnDur);
                        target.burnDps   = Math.max(target.burnDps, st.burnDps);
                        target.burnTower = t;
                        t.beamOn = true; t.beamTarget = target;
                        if (!wasOn) SFX.shoot('laser');
                    } else { t.beamOn = false; t.beamTarget = null; }
                    continue;
                }
                if (t.type === 'prism') {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, st.targets);
                    if (picked.length) {
                        t.beamTargets = picked.map(o => o.e);
                        for (const o of picked) damageEnemy(o.e, st.dps * dt, t, false, { dot: true });
                        SFX.shoot('prism');
                    } else t.beamTargets = null;
                    continue;
                }

                t.cooldown -= dt;
                const target = findTarget(t, towerPx, towerPy, rangePx);
                if (t.type !== 'amplifier' && accumulateOverheat(t, !!target, dt)) continue;
                if (t.cooldown > 0 || !target) continue;
                if (t.type === 'amplifier') { t.cooldown = 0; continue; }

                if (ascensionState && ascensionState.ammo && t.type !== 'laser' && t.type !== 'prism' && t.type !== 'amplifier') {
                    t.ammo--;
                }

                if (t.type === 'missile') {
                    projectiles.push({
                        kind: 'missile',
                        fromX: towerPx, fromY: towerPy,
                        x: towerPx, y: towerPy,
                        tx: target.x, ty: target.y,
                        target: target,
                        angle: Math.atan2(target.y - towerPy, target.x - towerPx),
                        speed: 12 * CELL,
                        damage: st.damage,
                        tower: t,
                        isMax: isMax,
                        splash: typeDef.splash || 1.2,
                        life: 4.0, maxLife: 4.0,
                        color: '#c44aff'
                    });
                    SFX.shoot('missile');
                    t.cooldown = actualCooldown;
                    continue;
                }

                if (t.type === 'venom') {
                    // 全等级：发射追踪毒弹（与导弹塔同款弹道）
                    // 1~5 级：命中只对目标叠毒；6 级：命中后在 1 格半径内扩散叠毒，且毒层无上限
                    projectiles.push({
                        kind: 'missile',
                        venom: {
                            dps: st.poisonDps,
                            dur: st.poisonDur,
                            maxStacks: st.maxStacks,
                            radius: isMax ? 1.0 * CELL : 0
                        },
                        fromX: towerPx, fromY: towerPy,
                        x: towerPx, y: towerPy,
                        tx: target.x, ty: target.y,
                        target: target,
                        angle: Math.atan2(target.y - towerPy, target.x - towerPx),
                        speed: 12 * CELL,
                        damage: st.damage,
                        tower: t,
                        isMax: false,
                        splash: 0,
                        life: 4.0, maxLife: 4.0,
                        color: '#7aff4a'
                    });
                    SFX.shoot('venom');
                    t.cooldown = actualCooldown;
                    continue;
                }

                if (t.type === 'emp') {
                    let hitAny = false;
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const d2 = Math.hypot(e.x - towerPx, e.y - towerPy);
                        if (d2 > rangePx) continue;
                        if (!enemyVisibleFromTower(e, t, d2)) continue;
                        const mech = MECH_TYPES.has(e.type);
                        damageEnemy(e, st.damage * (mech && isMax ? 1.5 : 1), t);
                        const finalStun = Math.min(st.stun * (mech ? 1.5 : 1), st.cooldown * 0.9);
                        applyStun(e, finalStun);
                        hitAny = true;
                    }
                    if (hitAny) {
                        SFX.shoot('emp');
                        projectiles.push({
                            kind: 'shockwave', x: towerPx, y: towerPy, radius: rangePx,
                            color: 'rgba(160, 224, 255, 0.9)', life: 0.4, maxLife: 0.4
                        });
                    }
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'chain') {
                    const hit = new Set();
                    let cur = target, dmg = st.damage;
                    let fromX = towerPx, fromY = towerPy;
                    const maxJumps = typeDef.chainJumps + Math.floor(t.level / 2);
                    const jumpR = 1.8 * CELL;
                    const pts = [];
                    for (let j = 0; j < maxJumps && cur; j++) {
                        hit.add(cur);
                        damageEnemy(cur, dmg, t);
                        if (isMax && Math.random() < 0.15) applyStun(cur, 0.2);
                        pts.push(fromX, fromY, cur.x, cur.y);
                        fromX = cur.x; fromY = cur.y;
                        let next = null, nd = jumpR;
                        for (const e of enemies) {
                            if (e.hp <= 0 || hit.has(e)) continue;
                            if (ENEMY_TYPES[e.type].air) continue;
                            const dd = Math.hypot(e.x - fromX, e.y - fromY);
                            if (dd < nd) { nd = dd; next = e; }
                        }
                        cur = next;
                        dmg *= typeDef.chainDecay;
                    }
                    projectiles.push({ kind: 'chain', points: pts, color: '#cce8ff', life: 0.15, maxLife: 0.15 });
                    SFX.shoot('chain');
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'sniper') {
                    const crit = isMax && (target.slowTimer > 0 || target.stunTimer > 0);
                    damageEnemy(target, st.damage * (crit ? 2 : 1), t);
                    projectiles.push({
                        kind: 'beam', fromX: towerPx, fromY: towerPy,
                        toX: target.x, toY: target.y,
                        color: crit ? '#ffffff' : '#88ff88',
                        width: crit ? 4 : 2.5, life: 0.14, maxLife: 0.14
                    });
                    SFX.shoot('sniper');
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'railgun') {
                    const dx = target.x - towerPx, dy = target.y - towerPy;
                    const dl = Math.hypot(dx, dy) || 1;
                    const ux = dx / dl, uy = dy / dl;
                    const bLen = clipRayToMap(towerPx, towerPy, ux, uy, rangePx);
                    const hw = (isMax ? typeDef.beamWidth * 2 : typeDef.beamWidth) * CELL;
                    const endX = towerPx + ux * bLen;
                    const endY = towerPy + uy * bLen;
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const ex = e.x - towerPx, ey = e.y - towerPy;
                        const proj = ex * ux + ey * uy;
                        if (proj < 0 || proj > bLen) continue;
                        const perp = Math.abs(ex * -uy + ey * ux);
                        if (perp > hw + ENEMY_TYPES[e.type].size * 0.5 * (CELL / baseCellPx)) continue;
                        if (!enemyVisibleFromTower(e, t, Math.hypot(ex, ey))) continue;
                        damageEnemy(e, st.damage, t);
                    }
                    projectiles.push({
                        kind: 'railbeam', fromX: towerPx, fromY: towerPy,
                        toX: endX, toY: endY,
                        width: hw * 2, color: '#ffe066', life: 0.22, maxLife: 0.22
                    });
                    SFX.shoot('railgun');
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'temporal') {
                    if (!ENEMY_TYPES[target.type].immuneSlow) {
                        target.slowTimer = Math.max(target.slowTimer, st.duration);
                        target.slowFactor = Math.min(target.slowFactor, st.slow);
                    }
                    projectiles.push({
                        kind: 'ring', x: target.x, y: target.y, radius: 22 * (CELL / baseCellPx),
                        color: '#4affd0', life: 0.4, maxLife: 0.4
                    });
                    SFX.shoot('temporal');
                    t.cooldown = typeDef.fireRate;
                } else if (t.type === 'shock') {
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const d = Math.hypot(e.x - towerPx, e.y - towerPy);
                        if (d > rangePx) continue;
                        if (!enemyVisibleFromTower(e, t, d)) continue;
                        damageEnemy(e, st.damage, t);
                        if (isMax && Math.random() < 0.2) applyStun(e, 0.1);
                    }
                    projectiles.push({
                        kind: 'shockwave', x: towerPx, y: towerPy, radius: rangePx,
                        color: 'rgba(255, 204, 0, 0.9)', life: 0.35, maxLife: 0.35
                    });
                    SFX.shoot('shock');
                    t.cooldown = actualCooldown;
                } else if (t.type === 'gun' && isMax) {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, 5);
                    for (const o of picked) {
                        const e = o.e;
                        damageEnemy(e, st.damage, t);
                        projectiles.push({
                            kind: 'beam', fromX: towerPx, fromY: towerPy,
                            toX: e.x, toY: e.y,
                            color: '#4a9eff', width: 2, life: 0.08, maxLife: 0.08
                        });
                    }
                    SFX.shoot('gun');
                    t.cooldown = actualCooldown;
                } else {
                    let dmgToTarget = st.damage;
                    if (t.type === 'flak' && isMax && Math.random() < 0.25) dmgToTarget *= 3;
                    damageEnemy(target, dmgToTarget, t);
                    if (t.type === 'cannon' && isMax) applyStun(target, 0.25);
                    if (typeDef.splash) {
                        let splashR = typeDef.splash * CELL;
                        let ratio = typeDef.splashRatio || 0.5;
                        if (t.type === 'missile' && isMax) { splashR *= 2; ratio = 1.0; }
                        for (const e of enemies) {
                            if (e === target || e.hp <= 0) continue;
                            const d = Math.hypot(e.x - target.x, e.y - target.y);
                            if (d > splashR) continue;
                            if (ENEMY_TYPES[e.type].stealth) {
                                const dt2 = Math.hypot(e.x - towerPx, e.y - towerPy);
                                if (!enemyVisibleFromTower(e, t, dt2)) continue;
                            }
                            damageEnemy(e, st.damage * ratio, t);
                        }
                    }
                    const colors = { gun: '#4a9eff', cannon: '#ff8c42', missile: '#c44aff', flak: '#4ad8ff' };
                    const widths = { gun: 2, cannon: 5, missile: 3, flak: 1.6 };
                    const beamLife = { gun: 0.08, cannon: 0.18, missile: 0.14, flak: 0.06 };
                    projectiles.push({
                        kind: 'beam', fromX: towerPx, fromY: towerPy,
                        toX: target.x, toY: target.y,
                        color: colors[t.type] || '#ffff00',
                        width: widths[t.type] || 2,
                        life: beamLife[t.type] || 0.1,
                        maxLife: beamLife[t.type] || 0.1
                    });
                    if (t.type === 'cannon' || t.type === 'missile' || t.type === 'flak') {
                        projectiles.push({
                            kind: 'boom', x: target.x, y: target.y,
                            radius: (t.type === 'missile' && isMax ? typeDef.splash * 2 : (typeDef.splash || typeDef.boom || 0.6)) * CELL * 0.85,
                            color: t.type === 'cannon' ? '#ffaa44' : (t.type === 'flak' ? '#4ad8ff' : '#ddaaff'),
                            life: 0.25, maxLife: 0.25
                        });
                        SFX.boom();
                    }
                    SFX.shoot(t.type);
                    t.cooldown = actualCooldown;
                }
            }
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                
                if (p.kind === 'missile') {
                    p.life -= dt;
                    
                    if (p.life <= 0) {
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    }
                    
                    if (p.target && p.target.hp > 0 && enemies.includes(p.target)) {
                        p.tx = p.target.x;
                        p.ty = p.target.y;
                    }
                    
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    const dist = Math.hypot(dx, dy);
                    const step = p.speed * dt;
                    
                    if (dist <= step) {
                        p.x = p.tx; p.y = p.ty;
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    } else {
                        p.x += (dx / dist) * step;
                        p.y += (dy / dist) * step;
                        p.angle = Math.atan2(dy, dx);
                    }
                    continue;
                }

                p.life -= dt;
                if (p.life <= 0) projectiles.splice(i, 1);
            }
        }

        // ============================================================
        // 主循环
        // ============================================================
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let rawDt = (timestamp - lastTime) / 1000;
            rawDt = Math.min(rawDt, 0.05);
            const dt = rawDt * (screen === 'game' && !paused && !draftPanel ? speedMultiplier : 1);
            lastTime = timestamp;

            // 进阶难度按住连续调整
            if (ascHoldDir !== 0) {
                if (screen !== 'levels' || pendingLevel >= 0) {
                    ascHoldDir = 0;
                } else {
                    ascHoldTimer += rawDt;
                    const th = ascHoldStarted ? 0.06 : 0.30;
                    if (ascHoldTimer >= th) {
                        ascHoldTimer = 0;
                        ascHoldStarted = true;
                        if (ascHoldDir > 0) selectedAscension = Math.min(20, selectedAscension + 1);
                        else selectedAscension = Math.max(0, selectedAscension - 1);
                    }
                }
            }

            if (screen === 'game' && !paused && !gameOver && !draftPanel && waveCountdownStarted) {
                playTime += rawDt;
                updateTimeDisplay();
            }
            if (screen === 'game' && !draftPanel) updateEdgePan(rawDt);
            if (gameOver && buildMenu) closeBuildMenu();
            if (gameOver && towerMenu) closeTowerMenu();
            if (screen === 'game' && !gameOver) updateAmplifiers();
            if (screen === 'game' && !gameOver && !paused && !draftPanel) {
                arrowAnimTime += dt;
                updateSpawn(dt);
                updateEnemies(dt);
                updateLooseCores(dt);
                updateCorePickups(dt);
                if (!gameOver) processPendingBuilds();
                if (!gameOver) updateAutoUpgrade();
                if (!gameOver) updateTowers(dt);
                cleanupDeadEnemies();
                updateProjectiles(dt);
                if (!gameOver && rogueState) checkRogueDraftTrigger();
            } else if (screen === 'game') {
                if (!paused) updateProjectiles(dt);
            }
            // 选中的敌人信息面板定期刷新（敌人移动/状态变化时）
            if (screen === 'game' && selectedEnemy && !draftPanel && !gameResult) {
                if (selectedEnemy.hp <= 0 || enemies.indexOf(selectedEnemy) === -1) {
                    selectedEnemy = null;
                    hideTip();
                } else {
                    const now = performance.now();
                    if (now - lastEnemyTipUpdate > 120) {
                        lastEnemyTipUpdate = now;
                        const insideCanvas = mouse.inside
                            && mouse.x >= 0 && mouse.x <= canvas.width
                            && mouse.y >= 0 && mouse.y <= canvas.height;
                        if (insideCanvas) {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = rect.width ? canvas.width / rect.width : 1;
                            const scaleY = rect.height ? canvas.height / rect.height : 1;
                            const cx = rect.left + mouse.x / scaleX;
                            const cy = rect.top + mouse.y / scaleY;
                            showTipHTML(cx, cy, buildEnemyInfoHTML(selectedEnemy));
                        }
                    }
                }
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function getGridFromMouse(e) {
            const pos = getCanvasCoords(e);
            const col = Math.floor((pos.x - mapOffX) / CELL);
            const row = Math.floor((pos.y - mapOffY) / CELL);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
            return { col, row };
        }
        function hitRect(mx, my, r) { return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h; }

        // ============================================================
        // 事件
        // ============================================================
        canvas.addEventListener('mousemove', (e) => {
            const pos = getCanvasCoords(e);
            const mx = pos.x, my = pos.y;
            mouse.x = mx; mouse.y = my; mouse.inside = true;
            lastClientX = e.clientX; lastClientY = e.clientY;
            hideTip();
            if (draftPanel) {
                draftPanel.hovered = -1;
                for (let i = 0; i < draftPanel.choices.length; i++) {
                    if (hitRect(mx, my, getDraftCardRect(i))) { draftPanel.hovered = i; break; }
                }
                canvas.style.cursor = draftPanel.hovered >= 0 ? 'pointer' : 'default';
                return;
            }
            if (gameResult) {
                const r = getResultBtnRect();
                resultBtnHover = hitRect(mx, my, r);
                endlessBtnHover = !!gameResult.showEndless && hitRect(mx, my, getResultEndlessBtnRect());
                canvas.style.cursor = (resultBtnHover || endlessBtnHover) ? 'pointer' : 'default';
                return;
            }
            if (screen === 'menu') {
                let nh = -1;
                for (let i = 0; i < 4; i++) {
                    if (hitRect(mx, my, getMainBtnRect(i))) { nh = i; break; }
                }
                hoveredMainBtn = nh;
                canvas.style.cursor = nh >= 0 ? 'pointer' : 'default';
                return;
            }
            if (screen === 'bestiary' || screen === 'towerdex' || screen === 'intro') {
                hoveredBackBtn = hitRect(mx, my, BACK_BTN);
                canvas.style.cursor = hoveredBackBtn ? 'pointer' : 'default';
                return;
            }
            if (screen === 'levels') {
                if (pendingLevel >= 0) {
                    let nh = -1;
                    for (let i = 0; i < MODE_KEYS_ACTIVE.length; i++) {
                        if (hitRect(mx, my, getModeRect(i))) { nh = i; break; }
                    }
                    hoveredMode = nh;
                    const avail = levelHasSeparateExit(LEVELS[pendingLevel]);
                    hoveredReverse = avail && hitRect(mx, my, getReverseToggleRect());
                    hoveredRogue = hitRect(mx, my, getRogueToggleRect());
                    canvas.style.cursor = (nh >= 0 || hoveredReverse || hoveredRogue) ? 'pointer' : 'default';
                    return;
                }
                hoveredBackBtn = hitRect(mx, my, BACK_BTN);
                if (hoveredBackBtn) { hoveredLevel = -1; canvas.style.cursor = 'pointer'; return; }

                hoveredAscUp = hitRect(mx, my, getAscArrowRect('up'));
                hoveredAscDown = hitRect(mx, my, getAscArrowRect('down'));
                if (hoveredAscUp || hoveredAscDown) {
                    canvas.style.cursor = 'pointer';
                    hoveredLevel = -1;
                    ascPanelHover = -1;
                    return;
                }

                const ai = ascItemAt(mx, my);
                ascPanelHover = ai;
                if (ai >= 0) {
                    showTipHTML(e.clientX, e.clientY, ascTipHTML(ASCENSION_MODIFIERS[ai]));
                    hoveredLevel = -1;
                    canvas.style.cursor = 'default';
                    return;
                }

                hoveredLevel = levelCardAt(mx, my);
                canvas.style.cursor = hoveredLevel >= 0 ? 'pointer' : 'default';
                return;
            }
            if (screen !== 'game') return;

            autoUpgradeHover = !gameOver && hitRect(mx, my, getAutoUpgradeBtnRect());
            if (autoUpgradeHover) {
                canvas.style.cursor = 'pointer';
                return;
            }

            if (selectedEnemy) {
                if (selectedEnemy.hp <= 0 || enemies.indexOf(selectedEnemy) === -1) {
                    selectedEnemy = null;
                } else {
                    showTipHTML(e.clientX, e.clientY, buildEnemyInfoHTML(selectedEnemy));
                }
            }

            // 游戏内进阶难度面板悬停
            const gai = gameAscItemAt(mx, my);
            gameAscHover = gai;
            if (gai >= 0) {
                showTipHTML(e.clientX, e.clientY, ascTipHTML(ASCENSION_MODIFIERS[gai]));
                canvas.style.cursor = 'default';
                return;
            }
            if (ascGamePanelRect && hitRect(mx, my, ascGamePanelRect)) {
                canvas.style.cursor = 'default';
                return;
            }

            if (towerMenu) {
                const cr = getTowerMenuCheckRect();
                const sr = getTowerMenuSellRect();
                towerMenu.hoverCheck = hitRect(mx, my, cr);
                towerMenu.hoverSell = hitRect(mx, my, sr);
                if (towerMenu.hoverCheck || towerMenu.hoverSell) canvas.style.cursor = 'pointer';
                else if (hitRect(mx, my, towerMenu)) canvas.style.cursor = 'default';
                else canvas.style.cursor = 'crosshair';
                return;
            }
            if (buildMenu) {
                const h = hitBuildItem(mx, my);
                buildMenu.hover = h;
                if (h >= 0) { showTipAt(e.clientX, e.clientY, BUILD_MENU_ORDER[h]); canvas.style.cursor = 'pointer'; }
                else canvas.style.cursor = 'crosshair';
                return;
            }
            const col = Math.floor((mx - mapOffX) / CELL);
            const row = Math.floor((my - mapOffY) / CELL);
            const hoveredTower = towers.find(t => t.col === col && t.row === row);
            if (hoveredTower && TOWER_TYPES[hoveredTower.type]) {
                if (!selectedEnemy) showTipHTML(e.clientX, e.clientY, buildTowerInfoHTML(hoveredTower));
                canvas.style.cursor = 'pointer';
            } else canvas.style.cursor = 'crosshair';
        });

        window.addEventListener('mousemove', (e) => {
            const pos = getCanvasCoords(e);
            mouse.x = pos.x; mouse.y = pos.y; mouse.inside = true;
        });
        document.addEventListener('mouseleave', () => { mouse.inside = false; hideTip(); });
        window.addEventListener('blur', () => { mouse.inside = false; ascHoldDir = 0; hideTip(); });

        canvas.addEventListener('mouseleave', () => {
            hideTip();
            if (buildMenu) buildMenu.hover = -1;
            if (towerMenu) { towerMenu.hoverCheck = false; towerMenu.hoverSell = false; }
            if (draftPanel) { draftPanel.hovered = -1; return; }
            resultBtnHover = false; endlessBtnHover = false;
            hoveredMainBtn = -1; hoveredBackBtn = false;
            hoveredLevel = -1; hoveredMode = -1; hoveredReverse = false; hoveredRogue = false;
            hoveredAscUp = false; hoveredAscDown = false;
            ascPanelHover = -1; gameAscHover = -1;
            autoUpgradeHover = false;
        });

        canvas.addEventListener('wheel', (e) => {
            if (draftPanel) { e.preventDefault(); return; }
            if (screen === 'levels' || screen === 'bestiary' || screen === 'towerdex' || screen === 'intro') {
                e.preventDefault();
                scrollY = Math.max(0, Math.min(maxScroll, scrollY + e.deltaY));
                return;
            }
            if (screen === 'game') {
                e.preventDefault();
                const pos = getCanvasCoords(e);
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                setGameZoom(zoom * factor, pos.x, pos.y);
            }
        }, { passive: false });

        // 按住进阶难度箭头快速调整
        canvas.addEventListener('mousedown', (e) => {
            if (screen !== 'levels' || pendingLevel >= 0) return;
            if (e.button !== 0) return;
            const pos = getCanvasCoords(e);
            const mx = pos.x, my = pos.y;
            if (hitRect(mx, my, getAscArrowRect('up'))) {
                ascHoldDir = 1; ascHoldTimer = 0; ascHoldStarted = false;
                selectedAscension = Math.min(20, selectedAscension + 1);
                SFX.click();
                e.preventDefault();
            } else if (hitRect(mx, my, getAscArrowRect('down'))) {
                ascHoldDir = -1; ascHoldTimer = 0; ascHoldStarted = false;
                selectedAscension = Math.max(0, selectedAscension - 1);
                SFX.click();
                e.preventDefault();
            }
        });
        window.addEventListener('mouseup', () => { ascHoldDir = 0; });

        canvas.addEventListener('click', (e) => {
            const pos = getCanvasCoords(e);
            const mx = pos.x, my = pos.y;
            if (draftPanel) {
                if (draftPanel.hovered >= 0) {
                    const up = draftPanel.choices[draftPanel.hovered];
                    const kind = draftPanel.kind;
                    draftPanel = null;
                    if (kind === 'enemy') applyEnemyBoost(up);
                    else applyDraftUpgrade(up);
                    openNextDraft();
                }
                return;
            }
            if (gameResult) {
                if (gameResult.showEndless && hitRect(mx, my, getResultEndlessBtnRect())) {
                    SFX.click();
                    gameResult = null;
                    resultBtnHover = false; endlessBtnHover = false;
                    continueToEndless();
                    return;
                }
                if (hitRect(mx, my, getResultBtnRect())) {
                    SFX.click();
                    gameResult = null;
                    resultBtnHover = false; endlessBtnHover = false;
                    setScreen('levels');
                }
                return;
            }
            if (screen === 'menu') {
                for (let i = 0; i < 4; i++) {
                    if (hitRect(mx, my, getMainBtnRect(i))) {
                        SFX.click();
                        if (i === 0) setScreen('levels');
                        else if (i === 1) setScreen('intro');
                        else if (i === 2) setScreen('bestiary');
                        else setScreen('towerdex');
                        return;
                    }
                }
                return;
            }
            if (screen === 'bestiary' || screen === 'towerdex' || screen === 'intro') {
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); }
                return;
            }
            if (screen === 'levels') {
                if (pendingLevel >= 0) {
                    if (levelHasSeparateExit(LEVELS[pendingLevel]) && hitRect(mx, my, getReverseToggleRect())) {
                        SFX.click();
                        pendingReverse = !pendingReverse;
                        return;
                    }
                    if (hitRect(mx, my, getRogueToggleRect())) {
                        SFX.click();
                        pendingRogue = !pendingRogue;
                        return;
                    }
                    for (let i = 0; i < MODE_KEYS_ACTIVE.length; i++) {
                        if (hitRect(mx, my, getModeRect(i))) {
                            SFX.click();
                            const lvIdx = pendingLevel, rev = pendingReverse, rog = pendingRogue;
                            pendingLevel = -1; pendingReverse = false; pendingRogue = false;
                            hoveredMode = -1; hoveredReverse = false; hoveredRogue = false;
                            loadLevel(lvIdx, MODE_KEYS_ACTIVE[i], rev, rog);
                            return;
                        }
                    }
                    const L = getModePanelLayout();
                    if (mx < L.x || mx > L.x + L.w || my < L.y || my > L.y + L.h) {
                        pendingLevel = -1; pendingReverse = false; pendingRogue = false;
                        hoveredMode = -1; hoveredReverse = false; hoveredRogue = false;
                    }
                    return;
                }
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); return; }

                const idx = levelCardAt(mx, my);
                if (idx >= 0) {
                    SFX.click();
                    pendingLevel = idx; pendingReverse = false; pendingRogue = false;
                    hoveredMode = -1; hoveredReverse = false; hoveredRogue = false;
                }
                return;
            }
            if (gameOver) return;

            // 全局自动升级开关
            if (hitRect(mx, my, getAutoUpgradeBtnRect())) {
                toggleGlobalAutoUpgrade();
                return;
            }

            // 进阶难度面板拦截点击
            if (ascGamePanelRect && hitRect(mx, my, ascGamePanelRect)) return;

            const clickedEnemy = getEnemyAt(mx, my);
            if (clickedEnemy) {
                SFX.click();
                closeTowerMenu();
                closeBuildMenu();
                selectedTower = null;
                hideSellButton();
                selectedEnemy = clickedEnemy;
                showTipHTML(e.clientX, e.clientY, buildEnemyInfoHTML(clickedEnemy));
                return;
            }
            selectedEnemy = null;

            if (towerMenu) {
                const menu = towerMenu;
                const t = towers.find(tt => tt.col === menu.col && tt.row === menu.row);
                if (t && hitRect(mx, my, getTowerMenuCheckRect())) {
                    
                    SFX.click();
                    t.autoUpgrade = !t.autoUpgrade;
                    msgDisplay.textContent = t.autoUpgrade
                        ? `${TOWER_TYPES[t.type].name} 开启自动升级`
                        : `${TOWER_TYPES[t.type].name} 关闭自动升级`;
                    return;
                }
                if (t && hitRect(mx, my, getTowerMenuSellRect())) { sellTower(t); closeTowerMenu(); return; }
                if (hitRect(mx, my, menu)) return;
                closeTowerMenu();
                return;
            }
            if (buildMenu) {
                const hit = hitBuildItem(mx, my);
                if (hit >= 0) { tryBuild(buildMenu.col, buildMenu.row, BUILD_MENU_ORDER[hit]); return; }
                closeBuildMenu();
            }
            const grid = getGridFromMouse(e);
            if (!grid) return;
            const col = grid.col, row = grid.row;
            const pendingIdx = pendingBuilds.findIndex(o => o.col === col && o.row === row);
            if (pendingIdx !== -1) {
                SFX.click();
                const o = pendingBuilds[pendingIdx];
                pendingBuilds.splice(pendingIdx, 1);
                msgDisplay.textContent = `已取消预定建造 ${TOWER_TYPES[o.type].name}`;
                return;
            }
            const existingTower = towers.find(t => t.col === col && t.row === row);
            if (existingTower) {
                if (selectedTower === existingTower) {
                    
                    if (existingTower.level >= MAX_LEVEL) { msgDisplay.textContent = `${TOWER_TYPES[existingTower.type].name} 已满级 (Lv.${MAX_LEVEL})`; return; }
                    const upgradeCost = getUpgradeCostEffective(existingTower.type, existingTower.level);
                    if (upgradeCost !== null && money >= upgradeCost) {
                        money -= upgradeCost;
                        existingTower.level++;
                        existingTower.invested += upgradeCost;
                        if (ascensionState && ascensionState.ammo) existingTower.ammo = 50;
                        updateUI();
                        updateSellButton();
                        msgDisplay.textContent = `升级到 Lv.${existingTower.level}`;
                        SFX.upgrade();
                    } else { msgDisplay.textContent = `资金不足，升级需要 ${upgradeCost}`; SFX.error(); }
                } else {
                    SFX.click();
                    selectedTower = existingTower;
                    updateSellButton();
                    msgDisplay.textContent = `${TOWER_TYPES[existingTower.type].name} Lv.${existingTower.level} · 再点一次升级 · 右键打开菜单`;
                }
                return;
            }
            if (!canBuildAt(col, row)) {
                SFX.error();
                selectedTower = null;
                hideSellButton();
                if (noBuildGrid[row] && noBuildGrid[row][col]) msgDisplay.textContent = '此处为禁止建造区域';
                else if (wallGrid[row] && wallGrid[row][col] && !buildableWall[row][col]) msgDisplay.textContent = '岩壁无法建造';
                else if (bases.some(b => b.c === col && b.r === row)) msgDisplay.textContent = '基地位置无法建造';
                else if (exits.some(x => x.c === col && x.r === row)) msgDisplay.textContent = '出口位置无法建造';
                else msgDisplay.textContent = '此处无法建造（会阻断敌军通路）';
                return;
            }
            SFX.click();
            selectedTower = null;
            hideSellButton();
            openBuildMenu(col, row);
            msgDisplay.textContent = '选择塔类型 · 左键建造 · 右键取消';
        });

        function togglePause() {
            if (screen !== 'game' || gameOver || draftPanel) return;
            SFX.click();
            paused = !paused;
            pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
            pauseBtn.classList.toggle('active', paused);
            msgDisplay.textContent = paused ? '⏸ 已暂停 · 可继续建塔/升级' : '继续战斗';
        }

        sellBtn.addEventListener('click', () => { SFX.click(); if (!selectedTower) return; sellTower(selectedTower); });
        pauseBtn.addEventListener('click', togglePause);
        speedBtn.addEventListener('click', () => {
            SFX.click();
            speedMultiplier = speedMultiplier === 1 ? 2 : (speedMultiplier === 2 ? 3 : 1);
            speedBtn.textContent = `⏩ ${speedMultiplier}x`;
        });

        window.addEventListener('scroll', hideTip, true);
        window.addEventListener('resize', hideTip);

        document.getElementById('resetBtn').addEventListener('click', () => {
            SFX.click();
            const kept = (rogueState && rogueState.affixes && rogueState.affixes.length)
                ? rogueState.affixes.slice() : null;
            loadLevel(levelIndex, currentModeKey, routeReverse, rogueEnabled, kept, true);
        });
        document.getElementById('menuBtn').addEventListener('click', () => {
            SFX.click();
            setScreen('levels');
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (draftPanel) return;
            if (screen !== 'game') return;
            if (selectedEnemy) { selectedEnemy = null; hideTip(); }
            const cpos = getCanvasCoords(e);
            if (ascGamePanelRect && hitRect(cpos.x, cpos.y, ascGamePanelRect)) return;
            if (buildMenu) { SFX.click(); closeBuildMenu(); msgDisplay.textContent = '已取消建造'; return; }
            if (!gameOver) {
                const grid = getGridFromMouse(e);
                if (grid) {
                    const pIdx = pendingBuilds.findIndex(o => o.col === grid.col && o.row === grid.row);
                    if (pIdx !== -1) {
                        SFX.click();
                        const o = pendingBuilds[pIdx];
                        pendingBuilds.splice(pIdx, 1);
                        msgDisplay.textContent = `已取消预定建造 ${TOWER_TYPES[o.type].name}`;
                        return;
                    }
                    const t = towers.find(tt => tt.col === grid.col && tt.row === grid.row);
                    if (t) {
                        SFX.click();
                        selectedTower = t;
                        updateSellButton();
                        openTowerMenu(grid.col, grid.row);
                        msgDisplay.textContent = `${TOWER_TYPES[t.type].name} · 可开关自动升级或出售`;
                        return;
                    }
                }
            }
            closeTowerMenu();
            selectedTower = null;
            hideSellButton();
        });

        const soundBtn = document.getElementById('soundBtn');
        function updateSoundBtn(on) {
            soundBtn.textContent = on ? '🔊 音效' : '🔇 静音';
            soundBtn.classList.toggle('off', !on);
        }
        soundBtn.addEventListener('click', () => {
            const on = SFX.toggle();
            updateSoundBtn(on);
            if (on) SFX.click();
        });
        updateSoundBtn(SFX.isOn());

        function unlockAudio() {
            SFX.unlock();
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown', unlockAudio);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                togglePause();
            }
            if (e.key === 'm' || e.key === 'M') {
                const on = SFX.toggle();
                updateSoundBtn(on);
                if (on) SFX.click();
            }
        });

        initEndlessUnlock();
        setScreen('menu');
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>

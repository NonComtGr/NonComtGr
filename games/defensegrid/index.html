<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防御阵型·觉醒 · 简化复刻</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #0a0f1e; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        .game-wrapper { background: #1a1f2e; padding: 1.6rem 2.2rem 1.3rem 2.2rem; border-radius: 1.5rem; box-shadow: 0 0 40px rgba(0, 180, 255, 0.15), inset 0 0 0 1px #2e3a55; }
        h1 { margin: 0 0 0.6rem 0; color: #7ec8ff; text-shadow: 0 0 12px #2a6fdb; letter-spacing: 0.3rem; font-weight: 400; font-size: 1.5rem; text-align: center; }
        canvas { display: block; margin: 0 auto; border-radius: 0.8rem; box-shadow: 0 0 0 2px #2e4a6e, 0 0 30px #000; background: #0b0f17; cursor: pointer; max-width: 100%; height: auto; }
        .hud { display: flex; justify-content: center; align-items: center; margin-top: 0.8rem; gap: 0.8rem; flex-wrap: wrap; min-height: 2.1rem; }
        .stats { display: none; }
        .stats span { color: #ffd966; font-weight: bold; }
        button.action { background: #3a2a1a; border: none; border-radius: 2rem; padding: 0 1rem; height: 1.9rem; display: inline-flex; align-items: center; justify-content: center; color: #ffb86b; font-weight: bold; cursor: pointer; box-shadow: inset 0 -2px 0 #7a5a3a; font-family: inherit; font-size: 0.85rem; white-space: nowrap; }
        button.action:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 #7a5a3a; }
        #sellBtn { background: #4a1a1a; color: #ff8866; box-shadow: inset 0 -2px 0 #7a2a2a; }
        #speedBtn { background: #1a3a4a; color: #7edcff; box-shadow: inset 0 -2px 0 #2a6a7a; }
        #menuBtn { background: #2a2a4a; color: #c8b0ff; box-shadow: inset 0 -2px 0 #4a3a7a; }
        #pauseBtn { background: #1a2a4a; color: #8fc4ff; box-shadow: inset 0 -2px 0 #2a4a7a; }
        #pauseBtn.active { background: #2f5f9a; color: #ffd966; box-shadow: inset 0 -2px 0 #4a7aaa, 0 0 12px #2a6fdb; }
        #soundBtn { background: #1a3a2a; color: #7dffb0; box-shadow: inset 0 -2px 0 #2a6a4a; }
        #soundBtn.off { background: #262a30; color: #8a9aa8; box-shadow: inset 0 -2px 0 #414850; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.55rem; color: #6f8fb5; font-size: 0.78rem; padding: 0 0.3rem; gap: 0.8rem; height: 1.2rem; }
        .info-bar .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
        .info-bar .msg { color: #ffaa44; white-space: nowrap; flex: 0 0 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
        .hidden { display: none !important; }
        .tower-tip { position: fixed; z-index: 999; background: rgba(10, 17, 30, 0.97); border: 1px solid #3a6a9a; border-radius: 10px; padding: 9px 11px; color: #c0dcff; font-size: 12px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 22px rgba(60,140,220,0.28); pointer-events: none; white-space: normal; word-break: break-word; overflow-wrap: break-word; max-width: 340px; }
        .tower-tip .tt-title { color: #7ec8ff; font-weight: bold; font-size: 13px; text-align: center; margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid #2e4a6e; }
        .tower-tip .tt-cost { color: #ffd966; font-weight: normal; font-size: 11px; margin-left: 4px; }
        .tower-tip table { border-collapse: collapse; }
        .tower-tip th { color: #7ec8ff; font-weight: bold; font-size: 11px; padding: 2px 7px; border-bottom: 1px solid #2e4a6e; }
        .tower-tip td { padding: 2px 7px; text-align: center; font-size: 12px; color: #a8c8e8; }
        .tower-tip table { white-space: nowrap; }
        .tower-tip th, .tower-tip td { white-space: nowrap; }
        .tower-tip td.lv { color: #7ec8ff; font-weight: bold; }
        .tower-tip td.cost { color: #ffd966; }
        .tower-tip tr.cur td { color: #ffe9a8; }
        .tower-tip .tt-note { margin-top: 6px; padding-top: 5px; border-top: 1px solid #2e4a6e; font-size: 11px; color: #7a9ac0; text-align: center; }
        .tower-tip .rogue-note { white-space: normal; word-break: break-word; max-width: 100%; line-height: 1.55; text-align: center; }
    </style>
</head>
<body>
<div class="game-wrapper">
    <h1 id="gameTitle" class="hidden">⚡ 防御阵型 · 觉醒 ⚡</h1>
    <canvas id="gameCanvas" width="1480" height="1000"></canvas>
    <div class="hud hidden" id="hud">
        <div class="stats">
            💰 <span id="moneyDisplay">200</span>
            💎 <span id="coreDisplay">20</span>
            🌊 <span id="waveDisplay">0/8</span>
            ⏱ <span id="timeDisplay">0:00</span>
        </div>
        <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
            <button class="action" id="sellBtn" style="display:none;">出售 +0</button>
            <button class="action" id="pauseBtn">⏸ 暂停</button>
            <button class="action" id="speedBtn">⏩ 1x</button>
            <button class="action" id="soundBtn">🔊 音效</button>
            <button class="action" id="menuBtn">关卡选择</button>
            <button class="action" id="resetBtn">重新开始</button>
        </div>
    </div>
    <div class="info-bar hidden" id="infoBar">
        <div class="hint">左键空地/炮台墙建造 · 右键塔打开菜单 · 点击塔升级 · 空格暂停 · 滚轮缩放地图 · 鼠标移出画面边缘平移视野</div>
        <div class="msg" id="msgDisplay">保护基地核心！</div>
    </div>
</div>
<div id="towerTip" class="tower-tip hidden"></div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const moneyDisplay = document.getElementById('moneyDisplay');
        const coreDisplay = document.getElementById('coreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const msgDisplay = document.getElementById('msgDisplay');
        const sellBtn = document.getElementById('sellBtn');
        const speedBtn = document.getElementById('speedBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const hud = document.getElementById('hud');
        const infoBar = document.getElementById('infoBar');
        const gameTitle = document.getElementById('gameTitle');
        const tipEl = document.getElementById('towerTip');

        // ---------- 音效系统 ----------
        const SFX = (function () {
            let actx = null, master = null, enabled = true, noiseBuf = null;
            const lastAt = Object.create(null);
            function unlock() {
                if (!actx) {
                    try {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        actx = new AC();
                        master = actx.createGain();
                        master.gain.value = 0.5;
                        master.connect(actx.destination);
                    } catch (e) { actx = null; return; }
                }
                if (actx.state === 'suspended') actx.resume();
            }
            function ok() { return !!actx && enabled && actx.state === 'running'; }
            function throttle(key, ms) {
                const t = performance.now();
                const prev = lastAt[key];
                if (prev !== undefined && t - prev < ms) return false;
                lastAt[key] = t; return true;
            }
            function tone(freq, dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                const t0 = actx.currentTime + (opt.delay || 0);
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = opt.type || 'sine';
                osc.frequency.setValueAtTime(freq, t0);
                if (opt.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur);
                const vol = opt.vol == null ? 0.2 : opt.vol;
                const atk = opt.attack == null ? 0.004 : opt.attack;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.linearRampToValueAtTime(vol, t0 + atk);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(g); g.connect(master);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            }
            function noise(dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                if (!noiseBuf) {
                    const n = Math.max(1, Math.floor(actx.sampleRate * 0.6));
                    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
                    const d = noiseBuf.getChannelData(0);
                    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                }
                const t0 = actx.currentTime + (opt.delay || 0);
                const src = actx.createBufferSource();
                src.buffer = noiseBuf; src.loop = true;
                const flt = actx.createBiquadFilter();
                flt.type = opt.filter || 'lowpass';
                flt.frequency.setValueAtTime(opt.freq || 1200, t0);
                if (opt.to) flt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to), t0 + dur);
                flt.Q.value = opt.q == null ? 0.8 : opt.q;
                const g = actx.createGain();
                const vol = opt.vol == null ? 0.2 : opt.vol;
                g.gain.setValueAtTime(vol, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                src.connect(flt); flt.connect(g); g.connect(master);
                src.start(t0); src.stop(t0 + dur + 0.05);
            }
            return {
                unlock,
                toggle() { enabled = !enabled; return enabled; },
                isOn() { return enabled; },
                click() { if (!throttle('click', 45)) return; tone(720, 0.05, { type: 'triangle', vol: 0.08, to: 980 }); },
                error() { if (!throttle('error', 160)) return; tone(200, 0.11, { type: 'square', vol: 0.09, to: 130 }); tone(140, 0.13, { type: 'square', vol: 0.07, to: 90, delay: 0.07 }); },
                build() { if (!throttle('build', 50)) return; noise(0.09, { vol: 0.12, freq: 800, to: 2600, filter: 'bandpass', q: 1.4 }); tone(280, 0.10, { type: 'triangle', vol: 0.10, to: 540 }); },
                sell() { if (!throttle('sell', 50)) return; tone(640, 0.09, { type: 'triangle', vol: 0.09, to: 320 }); noise(0.10, { vol: 0.06, freq: 2400, to: 500 }); },
                upgrade() { if (!throttle('upgrade', 70)) return; tone(560, 0.08, { type: 'triangle', vol: 0.09, to: 820 }); tone(840, 0.10, { type: 'sine', vol: 0.07, to: 1180, delay: 0.06 }); },
                shoot(kind) {
                    switch (kind) {
                        case 'gun': if (!throttle('sh_gun', 70)) return; tone(820 + Math.random() * 180, 0.045, { type: 'square', vol: 0.04, to: 380 }); break;
                        case 'cannon': if (!throttle('sh_cannon', 120)) return; noise(0.14, { vol: 0.12, freq: 520, to: 90 }); tone(130, 0.15, { type: 'sine', vol: 0.13, to: 50 }); break;
                        case 'missile': if (!throttle('sh_missile', 120)) return; noise(0.22, { vol: 0.09, freq: 700, to: 2800, filter: 'bandpass', q: 2.2 }); tone(260, 0.20, { type: 'sawtooth', vol: 0.045, to: 720 }); break;
                        case 'flak': if (!throttle('sh_flak', 55)) return; noise(0.07, { vol: 0.075, freq: 2600, to: 900, filter: 'highpass' }); tone(1100, 0.05, { type: 'square', vol: 0.035, to: 520 }); break;
                        case 'sniper': if (!throttle('sh_sniper', 140)) return; noise(0.10, { vol: 0.10, freq: 3000, to: 400, filter: 'bandpass', q: 3 }); tone(1400, 0.07, { type: 'square', vol: 0.05, to: 220 }); break;
                        case 'railgun': if (!throttle('sh_rail', 140)) return; tone(90, 0.26, { type: 'sawtooth', vol: 0.10, to: 40 }); noise(0.24, { vol: 0.10, freq: 500, to: 5000, filter: 'bandpass', q: 1.6 }); break;
                        case 'laser': if (!throttle('sh_laser', 200)) return; noise(0.16, { vol: 0.075, freq: 1800, to: 3200, filter: 'bandpass', q: 4 }); tone(880, 0.10, { type: 'sawtooth', vol: 0.04, to: 1400 }); break;
                        case 'prism': if (!throttle('sh_prism', 230)) return; tone(1180, 0.12, { type: 'sine', vol: 0.05, to: 1560 }); tone(1560, 0.10, { type: 'sine', vol: 0.035, to: 1980, delay: 0.04 }); break;
                        case 'chain': if (!throttle('sh_chain', 90)) return; noise(0.10, { vol: 0.09, freq: 3600, to: 1200, filter: 'highpass' }); tone(1600 + Math.random() * 500, 0.06, { type: 'square', vol: 0.04, to: 640 }); break;
                        case 'shock': if (!throttle('sh_shock', 110)) return; tone(220, 0.14, { type: 'sawtooth', vol: 0.08, to: 900 }); noise(0.12, { vol: 0.07, freq: 900, to: 3200, filter: 'bandpass', q: 1.5 }); break;
                        case 'emp': if (!throttle('sh_emp', 150)) return; tone(120, 0.30, { type: 'sine', vol: 0.10, to: 520 }); noise(0.26, { vol: 0.06, freq: 400, to: 2400, filter: 'bandpass', q: 1.2 }); break;
                        case 'venom': if (!throttle('sh_venom', 90)) return; tone(340, 0.10, { type: 'sine', vol: 0.06, to: 620 }); noise(0.09, { vol: 0.05, freq: 900, to: 2200, filter: 'bandpass', q: 2.5 }); break;
                        case 'temporal': if (!throttle('sh_slow', 160)) return; tone(1240, 0.14, { type: 'sine', vol: 0.045, to: 760 }); break;
                        default: break;
                    }
                },
                boom() { if (!throttle('boom', 90)) return; noise(0.28, { vol: 0.13, freq: 1600, to: 90 }); tone(95, 0.26, { type: 'sine', vol: 0.12, to: 38 }); },
                kill() { if (!throttle('kill', 55)) return; tone(540, 0.08, { type: 'square', vol: 0.055, to: 180 }); noise(0.09, { vol: 0.05, freq: 2400, to: 700 }); },
                steal() { if (!throttle('steal', 130)) return; tone(440, 0.10, { type: 'sawtooth', vol: 0.09, to: 300 }); tone(300, 0.14, { type: 'sawtooth', vol: 0.07, to: 190, delay: 0.08 }); },
                leak() { if (!throttle('leak', 220)) return; tone(160, 0.34, { type: 'sawtooth', vol: 0.12, to: 65 }); noise(0.30, { vol: 0.07, freq: 700, to: 130 }); },
                waveStart() { if (!throttle('wave', 350)) return; tone(392, 0.13, { type: 'triangle', vol: 0.09 }); tone(523, 0.13, { type: 'triangle', vol: 0.09, delay: 0.10 }); tone(659, 0.20, { type: 'triangle', vol: 0.09, delay: 0.20 }); },
                win() { const seq = [523, 659, 784, 1047]; for (let i = 0; i < seq.length; i++) tone(seq[i], 0.30, { type: 'triangle', vol: 0.12, delay: i * 0.13 }); tone(1047, 0.55, { type: 'sine', vol: 0.09, delay: seq.length * 0.13 }); },
                lose() { const seq = [392, 330, 262, 196]; for (let i = 0; i < seq.length; i++) tone(seq[i], 0.34, { type: 'sawtooth', vol: 0.10, delay: i * 0.17 }); }
            };
        })();

        // ---------- 常量 ----------
        const CELL_MAX = 48, CELL_MIN = 16;
        let CELL = CELL_MAX;
        let COLS = 20, ROWS = 13;
        let mapOffX = 0, mapOffY = 0;
        let TOWER_RADIUS = 15;
        let zoom = 1;
        const ZOOM_MIN = 1, ZOOM_MAX = 3;
        let baseCellPx = CELL_MAX;
        const MAX_LEVEL = 6, MAX_LEVEL_COST = 5000;
        const LEVEL_COLORS = ['#ffffff', '#ffdd44', '#4aff7a', '#4a9eff', '#c44aff', '#ff4444'];
        const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];
        // 需要"炮管"转向的塔类型（统一在此维护，绘制与逻辑保持一致）
        const TURRET_TOWER_TYPES = new Set(['gun', 'cannon', 'missile', 'flak', 'sniper', 'railgun', 'laser']);
        const STEALTH_REVEAL_RANGE = 2.5;
        const SHADOW_FOG_MUL = 0.7;           // 暗影迷雾缩小系数
        const SHADOW_FOG_RANGE_RATIO = 0.50;   // 暗影迷雾下探测半径至少覆盖塔射程的 50%

        function getStealthRevealRadius(tower) {
            const revealMul = (rogueState && rogueState.bonus.revealRange) || 1;
            let r = STEALTH_REVEAL_RANGE * CELL * revealMul;

            if (ascensionState && ascensionState.shadowFog) {
                r *= SHADOW_FOG_MUL;
                // 保底：探测半径不小于自身射程的 50%，避免"射程 7 格却只能探 1 格"
                if (tower && TOWER_TYPES[tower.type]) {
                    const st = towerStatsAt(tower.type, tower.level);
                    if (st && st.range) {
                        const bf = (tower.buffs && tower.buffs.range) || 1;
                        r = Math.max(r, st.range * CELL * bf * SHADOW_FOG_RANGE_RATIO);
                    }
                }
            }
            return r;
        }
        const GROW = { damage: 0.60, rate: 0.30, range: 0.08, slowMin: 0.15, slowStep: 0.07, slowDurStep: 0.4 };

        const TOWER_DRAFT_INTERVAL = 6; // 每 6 波选塔
        const ENEMY_BOOST_INTERVAL = 4; // 每 4 波怪物强化
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
        function lcm(a, b) { return a / gcd(a, b) * b; }

        const BUILD_MENU_ORDER = ['gun','laser','temporal','cannon','missile','shock','chain','sniper','amplifier','railgun','venom','flak','prism','emp','harvester'];
        const BUILD_ITEM_H = 36, BUILD_MENU_W = 78, BUILD_MENU_PAD = 4;
        let buildMenu = null;

        const PIPELINE_LINE_X = 400, PIPELINE_INFO_W = 130, PIPE_BLOCK_W = 96, PIPE_BLOCK_GAP = 8, PIPE_SPEED = 120;
        const PIPE_SLOT = (PIPE_BLOCK_W + PIPE_BLOCK_GAP) / PIPE_SPEED;
        const PIPE_INWAVE_GAP = 4;

        const TOWER_MENU_W = 190, TOWER_MENU_H = 96;
        let towerMenu = null;

        // ---------- 模式 ----------
        const MODES = {
            story:     { name: '剧情模式',  desc: '标准体验 · 敌人的常规强度',        hpMul: 1.00, coreHp: 20, waveMode: 'normal', scoreMul: 1.0 },
            storyPlus: { name: '剧情增强',  desc: '敌人生命值提升 60% · 更加凶险',    hpMul: 1.60, coreHp: 20, waveMode: 'normal', scoreMul: 1.4 },
            oneHp:     { name: '一滴血',    desc: '基地仅有 1 枚核心 · 失去即失败',    hpMul: 1.00, coreHp: 1,  waveMode: 'normal', scoreMul: 2.0 },
            grind:     { name: '超级研磨',  desc: '99 波敌军连绵不绝 · 极限考验 · 通过后可进入无尽模式',      hpMul: 1.00, coreHp: 20, waveMode: 'grind',  scoreMul: 2.5 },
            endless:   { name: '无尽模式',  desc: '敌军无休无止 · 生命值指数膨胀 · 生存极限', hpMul: 1.00, coreHp: 20, waveMode: 'endless', scoreMul: 3.0 },
            rogue:     { name: 'Roguelike', desc: '随机词条开局 · 构筑极限组合', hpMul: 1.00, coreHp: 20, waveMode: 'normal', scoreMul: 4.0 }
        };
        const MODE_KEYS = ['story', 'storyPlus', 'oneHp', 'grind'];

        // ---------- 进阶难度 ----------
        const ASCENSION_MODIFIERS = [
            { id: 1,  name: '弹药限制',   desc: '每座塔有 50 发子弹，打空后需扣除金币自动装填（资金不足则停火）。' },
            { id: 2,  name: '终极狂潮',   desc: '最后一波的怪物数量翻倍。' },
            { id: 3,  name: '死亡沉默',   desc: '隐形怪被击杀时，会使周围 2.5 格内的防御塔失效 3 秒。' },
            { id: 4,  name: '绝对制空',   desc: '飞行怪只会被防空塔攻击。' },
            { id: 5,  name: '资源匮乏',   desc: '初始资金降低 30%。' },
            { id: 6,  name: '建筑限额',   desc: '造塔次数不能超过 20 座（无尽模式不受此限制）。' },
            { id: 7,  name: '迟缓归巢',   desc: '被抢走的核心从掉落到回到基地的移动速度减半。' },
            { id: 8,  name: '经济衰退',   desc: '击杀金币获取量 = 原本收益 × (基地核心数 / 20)。' },
            { id: 9,  name: '血怒狂暴',   desc: '怪物生命值低于 30% 时，移动速度提升 100%。' },
            { id: 10, name: '萨满图腾',   desc: '萨满的治疗量翻倍，且治疗范围扩大至全图。' },
            { id: 11, name: '武器过热',   desc: '所有防御塔连续攻击 5 秒后会过热停机 1 秒。' },
            { id: 12, name: '精英降临',   desc: '每波有 10% 的怪物随机变异为精英怪（生命值和速度提升 1.5 倍，体型更大）。' },
            { id: 13, name: '核心破坏',   desc: '怪物抢走核心时，会同时扣除当前资金的 10%。' },
            { id: 14, name: '暗影迷雾',   desc: '隐形怪移动速度 +20%；防御塔对隐形单位的侦测半径缩减 30%，但不会小于自身射程的 35%。' },
            { id: 15, name: '火力衰减',   desc: '随着波次推进，所有防御塔的伤害每 10 波降低 10%（最多衰减 50%）。' },

        function getUpgradeCost(type, curLevel) {
            if (curLevel >= MAX_LEVEL) return null;
            if (curLevel === MAX_LEVEL - 1) return MAX_LEVEL_COST;
            const d = TOWER_TYPES[type];
            const base = (typeof d.upgradeBase === 'number') ? d.upgradeBase : d.cost;
            return Math.floor(base * 1.6 * curLevel);
        }

        function towerStatsAt(type, lv) {
            const d = TOWER_TYPES[type];
            const range = d.range * (1 + (lv - 1) * GROW.range);
            if (type === 'amplifier') {
                const la = lv - 1;
                return { range, boost: {
                    dmg:   d.boostBase.dmg   + la * d.boostPerLevel.dmg,
                    rate:  d.boostBase.rate  + la * d.boostPerLevel.rate,
                    range: d.boostBase.range + la * d.boostPerLevel.range
                }};
            }
            if (type === 'temporal') {
                return { slow: Math.max(GROW.slowMin, 0.5 - (lv - 1) * GROW.slowStep), duration: 1.5 + (lv - 1) * GROW.slowDurStep, range, cooldown: d.fireRate };
            }
            if (type === 'laser') {
                const dps = d.damage * (1 + (lv - 1) * GROW.damage);
                return { dps, burnDps: dps, burnDur: 2.0 + (lv - 1) * 0.3, range };
            }
            if (type === 'shock') {
                return { damage: d.damage * (1 + (lv - 1) * GROW.damage), cooldown: d.fireRate / (1 + (lv - 1) * GROW.rate), range };
            }
            if (type === 'prism') {
                return { dps: d.damage * (1 + (lv - 1) * GROW.damage), range, targets: 1 + Math.floor((lv - 1) * 1.6) + (lv >= MAX_LEVEL ? 2 : 0), cooldown: 0 };
            }
            if (type === 'venom') {
                const pb = !!(rogueState && rogueState.bonus && rogueState.bonus.poisonBoost);
                return {
                    damage:    d.damage    * (1 + (lv - 1) * GROW.damage),
                    cooldown:  d.fireRate  / (1 + (lv - 1) * GROW.rate),
                    range,
                    poisonDps: d.poisonDps * (1 + (lv - 1) * GROW.damage) * (pb ? 1.5 : 1),
                    poisonDur: d.poisonDur + (lv - 1) * 0.35 + (pb ? 2 : 0) + (lv >= MAX_LEVEL ? 2 : 0),
                    maxStacks: lv >= MAX_LEVEL ? Infinity : 3 + Math.floor(lv / 2)
                };
            }
            if (type === 'emp') {
                const cd = d.fireRate / (1 + (lv - 1) * GROW.rate);
                const rawStun = 0.1 + (lv - 1) * 0.1 + (lv >= MAX_LEVEL ? 1.2 : 0);
                return { damage: d.damage * (1 + (lv - 1) * GROW.damage), cooldown: cd, range, stun: Math.min(rawStun, cd * 0.7) };
            }
            if (type === 'harvester') {
                return { range: range * (lv >= MAX_LEVEL ? 2 : 1), harvest: d.harvestBase + (lv - 1) * d.harvestPerLevel };
            }
            return { damage: d.damage * (1 + (lv - 1) * GROW.damage), cooldown: d.fireRate / (1 + (lv - 1) * GROW.rate), range };
        }

            if (bases.some(b => b.c === col && b.r === row)) return false;
            if (exits.some(x => x.c === col && x.r === row)) return false;
            if (towers.some(t => t.col === col && t.row === row)) return false;
            for (const e of enemies) {
                if (e.cellC === col && e.cellR === row) return false;
                if (e.nextC !== null && e.nextC === col && e.nextR === row) return false;
            }

            towers.push({ col, row, type: '__tmp__', level: 1, invested: 0 });
            const blocked = getBlockedGrid();
            towers.pop();
            const bipartiteConnected = (setA, setB) => {
                if (setA.length === 0 || setB.length === 0) return true;
                if (setA.length <= setB.length) {
                    for (const a of setA) {
                        const f = makeDirField();
                        bfsFromDir(f, [a], blocked);
                        for (const b of setB) if (!anyDirFinite(f, b.r, b.c)) return false;
                    }
                } else {
                    for (const b of setB) {
                        const f = makeDirField();
                        bfsFromDir(f, [b], blocked);
                        for (const a of setA) if (!anyDirFinite(f, a.r, a.c)) return false;
                    }
                }
                return true;
            };
            if (!bipartiteConnected(starts, bases)) return false;
            if (!bipartiteConnected(bases, exits)) return false;
            const db = makeDirField(), de = makeDirField();
            bfsFromDir(db, bases, blocked); bfsFromDir(de, exits, blocked);
            for (const e of enemies) {

            }
            for (const core of looseCores) if (!anyDirFinite(db, core.cellR, core.cellC)) return false;
            return true;
        }

            if (!t) return;
            const price = getSellValue(t);

            if (selectedTower === t) { selectedTower = null; hideSellButton(); }
            if (towerMenu && towerMenu.col === t.col && towerMenu.row === t.row) closeTowerMenu();

        function getEnemyAt(mx, my) {
            let best = null, bestD = Infinity;
            const sf = CELL / baseCellPx;
            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const size = ENEMY_TYPES[e.type].size * sf * (e.isElite ? 1.3 : 1);
                const r = Math.max(size * 1.2, CELL * 0.42);
                const d = Math.hypot(e.x - mx, e.y - my);
                if (d <= r && d < bestD) { bestD = d; best = e; }
            }
            return best;
        }


        function showTipHTML(clientX, clientY, html) {
            tipEl.innerHTML = html;
            tipEl.classList.remove('hidden');
            tipEl.style.transform = 'none';
            tipEl.style.left = '0px';
            tipEl.style.top = '0px';

            // 临时解除限制，测出内容真实宽度
            tipEl.style.maxWidth = 'none';
            const table = tipEl.querySelector('table');
            const hpBar = tipEl.querySelector('.hpbar-wrap');
            let naturalW = 0;
            if (table) naturalW = Math.max(naturalW, table.offsetWidth);
            if (hpBar) naturalW = Math.max(naturalW, hpBar.offsetWidth);   // ★ 新增

            if (naturalW > 0) {
                const padX = 22;                          // 左右 padding 11×2
                const borderX = 2;                        // 左右 border 1×2
                const capW = window.innerWidth - 16;      // 屏幕边界保护
                tipEl.style.maxWidth = Math.min(naturalW + padX + borderX, capW) + 'px';
            } else {
                tipEl.style.maxWidth = '';                // 无表格时回退到 CSS 的 340px
            }

            const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
            let left = clientX + 18;
            if (left + tw > window.innerWidth - 8) left = clientX - tw - 18;
            left = Math.max(8, left);
            let top = clientY - th / 2;
            top = Math.max(8, Math.min(window.innerHeight - th - 8, top));
            tipEl.style.left = left + 'px';
            tipEl.style.top = top + 'px';
        }
        function showTipAt(clientX, clientY, type) { showTipHTML(clientX, clientY, buildTipHTML(type)); }
        function hideTip() { tipEl.classList.add('hidden'); }

        function getBuildMenuHeight() { return BUILD_MENU_ORDER.length * BUILD_ITEM_H + BUILD_MENU_PAD * 2; }
        function openBuildMenu(col, row) {
            closeTowerMenu();
            const totalH = getBuildMenuHeight();
            const cellX = cellLeft(col), cellY = cellTop(row);
            let x = cellX + CELL + 6;
            if (x + BUILD_MENU_W > canvas.width - 4) x = cellX - BUILD_MENU_W - 6;
            if (x < 4) x = 4;
            let y = cellY - (totalH - CELL) / 2;
            if (y < 4) y = 4;
            if (y + totalH > canvas.height - 4) y = canvas.height - totalH - 4;
            const previewRoutes = computeRoutesWithExtraBlock(col, row);
            const pathChanged = routeSignature(previewRoutes) !== routeSignature(routes);
            buildMenu = { col, row, x, y, w: BUILD_MENU_W, h: totalH, hover: -1, previewRoutes, pathChanged };
            hideTip();
            canvas.style.cursor = 'crosshair';
        }
        function closeBuildMenu() { if (!buildMenu) return; buildMenu = null; hideTip(); }

        function getBuildItemRect(i) {
            return { x: buildMenu.x + BUILD_MENU_PAD, y: buildMenu.y + BUILD_MENU_PAD + i * BUILD_ITEM_H, w: buildMenu.w - BUILD_MENU_PAD * 2, h: BUILD_ITEM_H };
        }
        function hitBuildItem(mx, my) {
            if (!buildMenu) return -1;
            for (let i = 0; i < BUILD_MENU_ORDER.length; i++) {
                const r = getBuildItemRect(i);
                if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
            }
            return -1;
        }

            const def = TOWER_TYPES[type];

            const baseStats = towerStatsAt(type, 1);
            if (!baseStats || !baseStats.range) return;
            const px = cellCenterX(buildMenu.col), py = cellCenterY(buildMenu.row);
            let rangeMul = 1;
            if (type !== 'amplifier') {
                for (const t of towers) {
                    if (t.type !== 'amplifier') continue;
                    const ast = towerStatsAt('amplifier', t.level);
                    const d = Math.hypot(px - cellCenterX(t.col), py - cellCenterY(t.row));
                    if (d <= ast.range * CELL) rangeMul += ast.boost.range;
                }
            }
            const radius = baseStats.range * CELL * rangeMul;
            const affordable = money >= getBuildCost(type);
            const hue = affordable ? '126, 200, 255' : '255, 120, 120';
            ctx.save();
            ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${hue}, 0.09)`; ctx.fill();
            ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${hue}, 0.75)`; ctx.lineWidth = 1.8;

            ctx.beginPath(); ctx.arc(px, py, radius * 0.55, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${hue}, 0.22)`; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + radius, py);
            ctx.strokeStyle = `rgba(${hue}, 0.3)`; ctx.lineWidth = 1; ctx.stroke();

        function updateAutoUpgrade() {
            let reserved = 0;
            for (const order of pendingBuilds) {
                reserved += getBuildCost(order.type);
            }
            let changed = false;
            for (const t of towers) {
                if (!t.autoUpgrade) continue;
                let guard = 0;
                while (t.level < MAX_LEVEL && guard++ < MAX_LEVEL) {
                    const cost = getUpgradeCostEffective(t.type, t.level);
                    if (cost === null) break;
                    if (money - cost < reserved) break;
                    money -= cost; t.level++; t.invested += cost; changed = true;
                    if (ascensionState && ascensionState.ammo) t.ammo = 50;
                    SFX.upgrade();
                    msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动升级 → Lv.${t.level}`;
                }
            }
            if (changed) { updateUI(); if (selectedTower) updateSellButton(); }
        }

        function addTower(col, row, type, startCountdown) {
            const d = TOWER_TYPES[type];
            const cost = getBuildCost(type);
            money -= cost;
            towers.push({
                col, row, type, level: 1, cooldown: 0, invested: cost,
                beamOn: false, beamTarget: null, beamTargets: null,
                angle: -Math.PI / 2, kills: 0, damageDealt: 0,
                autoUpgrade: globalAutoUpgrade,
                ammo: 50, isReloading: false,
                heat: 0, overheatTimer: 0, slowTimer: 0, silenceTimer: 0
            });
            battleStats.towersBuilt++;
            SFX.build();
            if (startCountdown !== false && !waveCountdownStarted) waveCountdownStarted = true;
        }

        function processPendingBuilds() {
            if (pendingBuilds.length === 0) return;
            let changed = false;
            for (let i = 0; i < pendingBuilds.length; ) {
                const order = pendingBuilds[i];
                const d = TOWER_TYPES[order.type];
                if (!d) { pendingBuilds.splice(i, 1); continue; }
                const cost = getBuildCost(order.type);
                if (money < cost) { i++; continue; }
                if (!canBuildAt(order.col, order.row)) { i++; continue; }
                addTower(order.col, order.row, order.type);
                pendingBuilds.splice(i, 1);
                changed = true;
                msgDisplay.textContent = `预定建造完成：${d.name}`;
            }
            if (changed) { rebuildPaths(); updateUI(); if (selectedTower) updateSellButton(); }
        }

        function tryBuild(col, row, type) {
            const d = TOWER_TYPES[type];
            const cost = getBuildCost(type);
            if (ascensionState && ascensionState.limitTowers && battleStats.towersBuilt >= ascensionState.limitTowers && currentModeKey !== 'endless') {
                closeBuildMenu();
                msgDisplay.textContent = `进阶难度限制：造塔数量已达上限（${ascensionState.limitTowers}）`;
                SFX.error();
                return;
            }
            if (!canBuildAt(col, row)) {
                closeBuildMenu();
                msgDisplay.textContent = (noBuildGrid[row] && noBuildGrid[row][col])
                    ? '此处为禁止建造区域'
                    : '此处无法建塔（会阻断敌军通路）';
                SFX.error();
                return;
            }
            if (money < cost) {
                if (!pendingBuilds.some(o => o.col === col && o.row === row)) pendingBuilds.push({ col, row, type });
                closeBuildMenu();
                msgDisplay.textContent = `已预定 ${d.name}（${cost}）· 资金足够后自动建造`;
                return;
            }
            addTower(col, row, type);
            closeBuildMenu();
            rebuildPaths();
            updateUI();
            msgDisplay.textContent = `建造 ${d.name}`;
        }

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.lineTo(x + w - r, y);
            c.arcTo(x + w, y, x + w, y + r, r);
            c.lineTo(x + w, y + h - r);
            c.arcTo(x + w, y + h, x + w - r, y + h, r);
            c.lineTo(x + r, y + h);
            c.arcTo(x, y + h, x, y + h - r, r);
            c.lineTo(x, y + r);
            c.arcTo(x, y, x + r, y, r);
            c.closePath();
        }

        function wrapTextLines(c, text, maxWidth) {
            const lines = [];
            let current = '';
            const NO_LINE_START = '，。、；：？！）》」』】〉”’·…—～';
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '\n') { lines.push(current); current = ''; continue; }
                const test = current + ch;
                if (c.measureText(test).width > maxWidth && current.length > 0) {
                    if (NO_LINE_START.indexOf(ch) !== -1 && current.length > 1) {
                        const last = current[current.length - 1];
                        lines.push(current.slice(0, -1));
                        current = last + ch;
                    } else {
                        lines.push(current);
                        current = ch;
                    }
                } else {
                    current = test;
                }
            }
            if (current.length > 0) lines.push(current);
            return lines;
        }

        function drawIntro() {
            drawBackdrop();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 18;
            ctx.fillText('玩 法 简 介', canvas.width / 2, 36);
            ctx.shadowBlur = 0;
            ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText('鼠标滚轮上下滑动', canvas.width / 2, 60);
            drawBackBtn();

            // 卡片横向铺满界面：左右各留 20px 边距
            const sideMargin = 20;
            const cardW = canvas.width - sideMargin * 2;
            const gapY = 14;
            const startX = sideMargin;
            const top = 78;
            const viewH = canvas.height - top - 12;
            const lineH = 17;

            ctx.font = '12.5px "Microsoft YaHei"';
            const cardHeights = INTRO_ITEMS.map(item => {
                const lines = wrapTextLines(ctx, item[2], cardW - 220);
                const textH = lines.length * lineH;
                return Math.max(76, textH + 26);
            });

            let contentH = 0;
            for (let i = 0; i < cardHeights.length; i++) {
                contentH += cardHeights[i];
                if (i < cardHeights.length - 1) contentH += gapY;
            }
            maxScroll = Math.max(0, contentH - viewH + 12);
            scrollY = Math.max(0, Math.min(maxScroll, scrollY));

            ctx.save();
            ctx.beginPath(); ctx.rect(0, top, canvas.width, viewH); ctx.clip();
            ctx.translate(0, -scrollY);
            let cy = top;
            for (let i = 0; i < INTRO_ITEMS.length; i++) {
                const cardH = cardHeights[i];
                if (cy - scrollY > canvas.height + 120 || cy - scrollY + cardH < top - 120) {
                    cy += cardH + gapY;
                    continue;
                }
                drawIntroCard(startX, cy, cardW, cardH, INTRO_ITEMS[i]);
                cy += cardH + gapY;
            }
            ctx.restore();
            drawScrollbar(top, viewH);
        }

        const BESTIARY_ORDER = [
    // ── 基础地面 ──

        const ENEMY_DESC = {

        function enemyStatRange(key) {
            const es = ENEMY_STATS[key] || { hpFactor: 1, spdFactor: 1 };
            const hpLo = Math.round(26 * 2.9 * es.hpFactor);
            const hpHi = Math.round((26 + 9 * 8) * 2.9 * es.hpFactor);
            const spLo = (1.00 * es.spdFactor).toFixed(2);
            const spHi = (1.00 + 9 * 0.03) * es.spdFactor;
            return { hpLo, hpHi, spLo, spHi: spHi.toFixed(2) };
        }

        function drawEnemyIcon(c, key, px, py, size) {
            const t = ENEMY_TYPES[key];
            const color = t.color;
            c.save(); c.translate(px, py);
            c.fillStyle = color; c.strokeStyle = color;
            c.shadowColor = color; c.shadowBlur = 10;
            switch (key) {
                case 'runner': {
                    c.beginPath(); c.moveTo(0, -size); c.lineTo(size * 0.8, 0);
                    c.lineTo(0, size); c.lineTo(-size * 0.8, 0); c.closePath(); c.fill(); break;
                }
                case 'tank': case 'brute': {
                    c.fillRect(-size * 0.85, -size * 0.85, size * 1.7, size * 1.7);
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0,0,0,0.4)';
                    c.fillRect(-size * 0.4, -size * 0.4, size * 0.8, size * 0.8); break;
                }
                case 'flyer': case 'wasp': {
                    c.beginPath(); c.arc(0, 0, size * 0.8, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.ellipse(-size * 1.1, -2, size * 0.55, size * 0.25, -0.35, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.ellipse(size * 1.1, -2, size * 0.55, size * 0.25, 0.35, 0, Math.PI * 2); c.fill(); break;
                }
                case 'boss': {
                    c.beginPath(); c.arc(0, 0, size * 0.9, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = '#ffdd44';
                    c.beginPath();
                    c.moveTo(-size * 0.6, -size * 0.5); c.lineTo(-size * 0.45, -size * 1.0);
                    c.lineTo(-size * 0.2, -size * 0.65); c.lineTo(0, -size * 1.1);
                    c.lineTo(size * 0.2, -size * 0.65); c.lineTo(size * 0.45, -size * 1.0);
                    c.lineTo(size * 0.6, -size * 0.5); c.closePath(); c.fill(); break;
                }
                case 'shield': {
                    c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,0.35)';
                    c.beginPath(); c.moveTo(-size * 0.5, -size * 0.2); c.lineTo(-size * 0.5, size * 0.2);
                    c.lineTo(0, size * 0.7); c.lineTo(size * 0.5, size * 0.2);
                    c.lineTo(size * 0.5, -size * 0.2); c.closePath(); c.fill(); break;
                }
                case 'shaman': {
                    c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2.5;
                    c.beginPath();
                    c.moveTo(0, -size * 0.45); c.lineTo(0, size * 0.45);
                    c.moveTo(-size * 0.45, 0); c.lineTo(size * 0.45, 0); c.stroke(); break;
                }
                case 'ghost': {
                    c.globalAlpha = 0.6; c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = 1; break;
                }
                case 'hatcher':
                case 'summoner':
                case 'jammer': {
                    drawSpecialEnemyBody(c, key, size * 0.9, color);
                    break;
                }
                case 'wraith': case 'phantom': case 'stalker': case 'specter': case 'shade': {
                    c.globalAlpha = 0.62;
                    drawStealthShape(c, key, size * 0.9, color);
                    c.globalAlpha = 1; c.shadowBlur = 0;
                    c.setLineDash([3, 3]); c.lineWidth = 1.5; c.strokeStyle = color;
                    c.beginPath(); c.arc(0, 0, size * 1.45, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
                    c.fillStyle = '#ffffff';
                    c.beginPath(); c.arc(-size * 0.28, -size * 0.08, size * 0.16, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.arc(size * 0.28, -size * 0.08, size * 0.16, 0, Math.PI * 2); c.fill(); break;
                }
                default: { c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill(); }
            }
            c.restore();
        }

        function drawStealthShape(c, type, size, color) {
            c.save();
            const base = c.globalAlpha;
            c.fillStyle = color; c.shadowColor = color;
            switch (type) {
                case 'wraith': {
                    c.beginPath(); c.moveTo(0, -size * 1.25); c.lineTo(size * 0.9, size * 0.6);
                    c.lineTo(0, size * 0.18); c.lineTo(-size * 0.9, size * 0.6); c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.45)';
                    c.beginPath(); c.moveTo(0, -size * 0.55); c.lineTo(size * 0.4, size * 0.32);
                    c.lineTo(0, size * 0.06); c.lineTo(-size * 0.4, size * 0.32); c.closePath(); c.fill(); break;
                }
                case 'phantom': {
                    c.globalAlpha = base * 0.4;
                    c.beginPath(); c.arc(-size * 0.55, size * 0.2, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = base * 0.65;
                    c.beginPath(); c.arc(size * 0.48, -size * 0.14, size * 0.7, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = base;
                    c.beginPath(); c.arc(0, 0, size * 0.78, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    c.beginPath(); c.arc(0, 0, size * 0.34, 0, Math.PI * 2); c.fill(); break;
                }
                case 'stalker': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const rr = (i % 2 === 0) ? size * 1.18 : size * 0.7;
                        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.moveTo(0, -size * 0.52); c.lineTo(size * 0.34, 0);
                    c.lineTo(0, size * 0.52); c.lineTo(-size * 0.34, 0); c.closePath(); c.fill(); break;
                }
                case 'specter': {
                    c.beginPath(); c.moveTo(-size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(-size * 1.9, -size * 0.95, -size * 1.5, size * 0.4);
                    c.quadraticCurveTo(-size * 1.0, size * 0.12, -size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(size * 1.9, -size * 0.95, size * 1.5, size * 0.4);
                    c.quadraticCurveTo(size * 1.0, size * 0.12, size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(-size * 0.52, size * 0.5);
                    c.quadraticCurveTo(0, size * 1.45, size * 0.52, size * 0.5);
                    c.closePath(); c.fill();
                    c.beginPath(); c.arc(0, 0, size * 0.76, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    c.beginPath(); c.arc(0, 0, size * 0.3, 0, Math.PI * 2); c.fill(); break;
                }
                case 'shade': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const px = Math.cos(a) * size * 1.0;
                        const py = Math.sin(a) * size * 1.0;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        c.beginPath();
                        c.moveTo(Math.cos(a - 0.2) * size * 0.95, Math.sin(a - 0.2) * size * 0.95);
                        c.lineTo(Math.cos(a) * size * 1.48, Math.sin(a) * size * 1.48);
                        c.lineTo(Math.cos(a + 0.2) * size * 0.95, Math.sin(a + 0.2) * size * 0.95);
                        c.closePath(); c.fill();
                    }
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.arc(0, 0, size * 0.46, 0, Math.PI * 2); c.fill();
                    c.fillStyle = 'rgba(205, 175, 255, 0.95)';
                    c.beginPath(); c.arc(0, 0, size * 0.2, 0, Math.PI * 2); c.fill(); break;
                }
            }
            c.restore();
        }

                function drawSpecialEnemyBody(c, type, size, color) {
            const now = Date.now();
            const tiny = size < 10;   // 流水线小图标时简化细节
            c.save();
            if (type === 'hatcher') {
                // ── 孵化母体：脉动卵囊 + 环绕虫卵 + 底部裂缝 ──
                const pulse = 1 + Math.sin(now / 320) * 0.05;
                c.save();
                c.scale(pulse, pulse);
                c.beginPath();
                c.ellipse(0, 0, size * 1.05, size * 0.95, 0, 0, Math.PI * 2);
                c.fillStyle = color;
                c.shadowColor = color;
                c.shadowBlur = tiny ? 4 : 12;
                c.fill();
                c.shadowBlur = 0;
                c.beginPath();
                c.ellipse(0, 0, size * 0.66, size * 0.6, 0, 0, Math.PI * 2);
                c.fillStyle = 'rgba(70, 12, 45, 0.55)';
                c.fill();
                const n = tiny ? 4 : 6;
                const rot = now / 1400;
                for (let k = 0; k < n; k++) {
                    const a = rot + k * Math.PI * 2 / n;
                    const ox = Math.cos(a) * size * 0.78;
                    const oy = Math.sin(a) * size * 0.66;
                    c.beginPath();
                    c.arc(ox, oy, size * 0.18, 0, Math.PI * 2);
                    c.fillStyle = 'rgba(255, 205, 232, 0.92)';
                    c.fill();
                    if (!tiny) {
                        c.beginPath();
                        c.arc(ox - size * 0.05, oy - size * 0.05, size * 0.065, 0, Math.PI * 2);
                        c.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        c.fill();
                    }
                }
                c.strokeStyle = 'rgba(255, 220, 240, 0.85)';
                c.lineWidth = Math.max(1, size * 0.07);
                c.lineCap = 'round';
                c.beginPath();
                c.moveTo(-size * 0.42, size * 0.34);
                c.lineTo(-size * 0.18, size * 0.5);
                c.lineTo(0, size * 0.3);
                c.lineTo(size * 0.18, size * 0.5);
                c.lineTo(size * 0.42, size * 0.34);
                c.stroke();
                c.restore();
            } else if (type === 'summoner') {
                // ── 召唤者：六边形法躯 + 环绕符文 + 中心法阵 ──
                c.beginPath();
                for (let k = 0; k < 6; k++) {
                    const a = -Math.PI / 2 + k * Math.PI / 3;
                    const px = Math.cos(a) * size;
                    const py = Math.sin(a) * size;
                    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath();
                c.fillStyle = color;
                c.shadowColor = color;
                c.shadowBlur = tiny ? 4 : 12;
                c.fill();
                c.shadowBlur = 0;
                c.beginPath();
                for (let k = 0; k < 6; k++) {
                    const a = -Math.PI / 2 + k * Math.PI / 3;
                    const px = Math.cos(a) * size * 0.7;
                    const py = Math.sin(a) * size * 0.7;
                    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath();
                c.fillStyle = 'rgba(10, 42, 32, 0.55)';
                c.fill();
                const rot = now / 900;
                c.fillStyle = 'rgba(190, 255, 220, 0.95)';
                for (let k = 0; k < 3; k++) {
                    const a = rot + k * Math.PI * 2 / 3;
                    const ox = Math.cos(a) * size * 1.38;
                    const oy = Math.sin(a) * size * 1.38;
                    const ss = size * 0.16;
                    c.beginPath();
                    c.moveTo(ox + Math.cos(a) * ss, oy + Math.sin(a) * ss);
                    c.lineTo(ox + Math.cos(a + 2.4) * ss, oy + Math.sin(a + 2.4) * ss);
                    c.lineTo(ox + Math.cos(a - 2.4) * ss, oy + Math.sin(a - 2.4) * ss);
                    c.closePath();
                    c.fill();
                }
                if (!tiny) {
                    c.strokeStyle = 'rgba(190, 255, 220, 0.8)';
                    c.lineWidth = Math.max(1, size * 0.06);
                    c.beginPath();
                    c.arc(0, 0, size * 0.44, 0, Math.PI * 2);
                    c.stroke();
                }
            } else if (type === 'jammer') {
                // ── 干扰者：菱形机体 + 天线 + 扩散干扰波 ──
                const waves = tiny ? 1 : 2;
                for (let k = 0; k < waves; k++) {
                    const phase = ((now / 900) + k * 0.5) % 1;
                    const r = size * (1.1 + phase * 0.9);
                    c.beginPath();
                    c.arc(0, 0, r, 0, Math.PI * 2);
                    c.strokeStyle = `rgba(255, 150, 90, ${0.55 * (1 - phase)})`;
                    c.lineWidth = Math.max(1, size * 0.1 * (1 - phase * 0.6));
                    if (!tiny) {
                        c.setLineDash([size * 0.25, size * 0.18]);
                        c.lineDashOffset = -phase * size * 0.9;
                    }
                    c.stroke();
                    c.setLineDash([]);
                }
                c.beginPath();
                c.moveTo(0, -size * 1.05);
                c.lineTo(size * 0.92, 0);
                c.lineTo(0, size * 1.05);
                c.lineTo(-size * 0.92, 0);
                c.closePath();
                c.fillStyle = color;
                c.shadowColor = color;
                c.shadowBlur = tiny ? 4 : 12;
                c.fill();
                c.shadowBlur = 0;
                c.beginPath();
                c.moveTo(0, -size * 0.62);
                c.lineTo(size * 0.55, 0);
                c.lineTo(0, size * 0.62);
                c.lineTo(-size * 0.55, 0);
                c.closePath();
                c.fillStyle = 'rgba(55, 22, 8, 0.55)';
                c.fill();
                c.strokeStyle = color;
                c.lineWidth = Math.max(1, size * 0.09);
                c.beginPath();
                c.moveTo(0, -size * 1.05);
                c.lineTo(0, -size * 1.35);
                c.stroke();
                c.beginPath();
                c.arc(0, -size * 1.42, size * 0.15, 0, Math.PI * 2);
                c.fillStyle = '#ffe066';
                c.shadowColor = '#ffcc00';
                c.shadowBlur = tiny ? 4 : 8;
                c.fill();
                c.shadowBlur = 0;
            }
            c.restore();
        }

        function drawEnemyCard(x, y, w, h, key) {
            const t = ENEMY_TYPES[key];
            ctx.fillStyle = '#131c2b';
            ctx.strokeStyle = t.stealth ? t.color + '99' : '#2e4a6e';
            ctx.lineWidth = t.stealth ? 2 : 1.5;
            roundRect(ctx, x, y, w, h, 12); ctx.fill(); ctx.stroke();

            // 图标
            const iconCx = x + 62, iconCy = y + h / 2, iconR = 42;
            ctx.beginPath(); ctx.arc(iconCx, iconCy, iconR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
            ctx.strokeStyle = t.color + '88'; ctx.lineWidth = 2; ctx.stroke();
            drawEnemyIcon(ctx, key, iconCx, iconCy, Math.max(14, Math.min(t.size, 20)));

            const textX = x + 126;
            const textW = w - 150;

            // 名称
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 20px "Microsoft YaHei"'; ctx.fillStyle = '#e0ecff';
            ctx.fillText(t.name, textX, y + 30, 300);

            // 类型标签
            ctx.textAlign = 'right'; ctx.font = 'bold 13px "Microsoft YaHei"';
            ctx.fillStyle = t.air ? '#44ccff' : '#7adf9a';
            ctx.fillText(t.air ? '空中单位' : '地面单位', x + w - 20, y + 30);

            // 描述
            ctx.textAlign = 'left'; ctx.font = '14px "Microsoft YaHei"'; ctx.fillStyle = '#8fb0d0';
            ctx.fillText(ENEMY_DESC[key], textX, y + 60, textW);

            // 特性
            const traits = [];
            if (t.stealth) traits.push('隐形');
            if (t.air) traits.push('飞行');
            if (t.healer) traits.push('治疗');
            if (t.hasShield) traits.push('护盾');
            if (t.immuneSlow) traits.push('免疫减速');
            traits.push('夺取 ' + (t.steal || 1) + ' 核');
            ctx.font = '12.5px "Microsoft YaHei"';
            ctx.fillStyle = t.stealth ? '#9fb8e8' : '#6f8fb5';
            ctx.fillText('特性：' + traits.join(' · '), textX, y + 87, textW);

            // 难度属性
            const sr = enemyStatRange(key);
            const bx = textX, by = y + 116;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '13px "Microsoft YaHei"';
            const label = '难度 1→10：';
            ctx.fillStyle = '#6f8fb5'; ctx.fillText(label, bx, by);
            let cursor = bx + ctx.measureText(label).width;
            const hpStr = `生命 ${sr.hpLo}→${sr.hpHi}`;
            ctx.fillStyle = '#ff9a8a'; ctx.fillText(hpStr, cursor, by);
            cursor += ctx.measureText(hpStr).width;
            ctx.fillStyle = '#4a6a8a'; ctx.fillText(' · ', cursor, by);
            cursor += ctx.measureText(' · ').width;
            const spStr = `速度 ${sr.spLo}→${sr.spHi}`;
            ctx.fillStyle = '#7adfff'; ctx.fillText(spStr, cursor, by);
        }

        function drawBestiary() {
            drawBackdrop();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 18;
            ctx.fillText('怪 物 图 鉴', canvas.width / 2, 36);
            ctx.shadowBlur = 0;
            ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText(`共 ${BESTIARY_ORDER.length} 种敌人 · 属性随难度与波数指数提升 · 鼠标滚轮上下滑动`, canvas.width / 2, 60);
            drawBackBtn();
            const cardW = 704, cardH = 150, gapX = 24, gapY = 16;
            const startX = (canvas.width - (2 * cardW + gapX)) / 2;
            const top = 78;
            const viewH = canvas.height - top - 12;
            const rows = Math.ceil(BESTIARY_ORDER.length / 2);
            const contentH = rows * (cardH + gapY) - gapY;
            maxScroll = Math.max(0, contentH - viewH + 12);
            scrollY = Math.max(0, Math.min(maxScroll, scrollY));

            const c = i % LV_COLS, r = Math.floor(i / LV_COLS);

        function levelCardAt(mx, my) {
            if (my < LEVELS_TOP || my > canvas.height) return -1;
            const totalW = LV_COLS * LV_CARD_W + (LV_COLS - 1) * LV_GAP_X;
            const startX = Math.max(340, (canvas.width - totalW) / 2 + 60);
            const lx = mx - startX;
            if (lx < 0) return -1;
            const c = Math.floor(lx / (LV_CARD_W + LV_GAP_X));
            if (c < 0 || c >= LV_COLS) return -1;
            if (lx - c * (LV_CARD_W + LV_GAP_X) > LV_CARD_W) return -1;
            const cy = my - LEVELS_TOP + scrollY;
            if (cy < 0) return -1;
            const r = Math.floor(cy / (LV_CARD_H + LV_GAP_Y));
            if (cy - r * (LV_CARD_H + LV_GAP_Y) > LV_CARD_H) return -1;
            const idx = r * LV_COLS + c;
            if (idx < 0 || idx >= LEVELS.length) return -1;
            return idx;
        }

        // 面板：加宽加高

        function getRogueToggleRect() {

        const levelThumbCache = new Map();

        function drawLevelThumbnail(x, y, w, h, level, idx) {
            let tc = levelThumbCache.get(idx);
            if (!tc) {
                tc = renderLevelThumbnail(w, h, level);
                levelThumbCache.set(idx, tc);
            }
            ctx.drawImage(tc, Math.round(x), Math.round(y));
            ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
        }

        function renderLevelThumbnail(w, h, level) {
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const g = cv.getContext('2d');
            g.fillStyle = '#070b12';
            g.fillRect(0, 0, w, h);

            const tRows = Math.max(1, level.map.length);
            let tCols = 1;
            for (const row of level.map) tCols = Math.max(tCols, row.length);
            const cellSize = Math.min(w / tCols, h / tRows);
            const gx = (w - tCols * cellSize) / 2;
            const gy = (h - tRows * cellSize) / 2;

            // 1. 基础地板：与游戏内 rebuildBackground 共用同一套绘制
            paintFloorBase(g, tCols, tRows, cellSize, gx, gy);

            // 2. 逐格图块：与游戏内保持完全一致
            for (let r = 0; r < tRows; r++) {
                const rowStr = level.map[r] || '';
                for (let c = 0; c < tCols; c++) {
                    const ch = rowStr[c];
                    const px = gx + c * cellSize;
                    const py = gy + r * cellSize;
                    const cx = px + cellSize / 2;
                    const cy = py + cellSize / 2;
                    g.save();
                    if (ch === '#') {
                        drawRockWall(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === 'X') {
                        drawArmorWall(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === '.') {
                        drawNoBuildFloor(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === '+') {
                        drawCrossJunction(g, px, py, cellSize);
                    } else if (ch === 'S') {
                        // 入口：亮绿圆 + 中心高光点（与游戏内绿色脉冲点对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.38, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(74, 255, 120, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.15, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(220, 255, 230, 0.95)'; g.fill();
                    } else if (ch === 'E') {
                        // 出口：发光橙色虚线圆 + 内部淡填充 + 中心亮点，更显眼
                        g.save();
                        g.shadowColor = 'rgba(255, 170, 68, 0.9)';
                        g.shadowBlur = Math.max(3, cellSize * 0.35);
                        // 内部淡橙色填充
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.34, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 170, 68, 0.30)';
                        g.fill();
                        // 粗虚线外圈
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.36, 0, Math.PI * 2);
                        g.strokeStyle = 'rgba(255, 190, 90, 1)';
                        g.lineWidth = Math.max(1.5, cellSize * 0.10);
                        const dash = Math.max(1.5, cellSize * 0.16);
                        g.setLineDash([dash, dash]);
                        g.stroke();
                        g.setLineDash([]);
                        // 中心亮点
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.12, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 232, 180, 1)';
                        g.fill();
                        g.restore();
                    } else if (ch === 'C') {
                        // 基地：红圆 + 深色内芯（与游戏内显示核心数的位置对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.4, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 85, 85, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.2, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(30, 6, 6, 0.9)'; g.fill();
                    } else {
                        // 可建造空地（空格 / 'o' / 越界字符）：中心加号标记
                        drawBuildableFloorMark(g, px, py, cellSize);
                    }
                    g.restore();
                }
            }
            return cv;
        }

        function drawReverseToggle() {
    const r = getReverseToggleRect();
    const avail = pendingLevel >= 0 && levelHasSeparateExit(LEVELS[pendingLevel]);
    const on = pendingReverse && avail;
    const hov = hoveredReverse && avail;
    ctx.save();
    ctx.fillStyle = on ? 'rgba(42, 95, 138, 0.6)' : '#1a2536';
    ctx.strokeStyle = hov ? '#7ec8ff' : (on ? '#3a7ec0' : '#2e4a6e');

    roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();

    // ★ 统一：框 20×20，左边缘 r.x + 16，垂直居中；文字从框右侧 +10 开始
    const bs = 20;
    const bx = r.x + 16, by = r.y + r.h / 2 - bs / 2;
    ctx.strokeStyle = avail ? (on ? '#7ec8ff' : '#5a7fa8') : '#3a4a5e';

        ctx.strokeStyle = '#7ec8ff'; ctx.lineWidth = 2.4;

    }
    const tx = bx + bs + 10;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

    ctx.fillStyle = avail ? '#7a9ac0' : '#4a5a6e';

}

        function drawModeSelector() {
            ctx.fillStyle = 'rgba(4, 8, 16, 0.78)';

            const L = getModePanelLayout();
            ctx.fillStyle = '#131c2b'; ctx.strokeStyle = '#3a6a9a'; ctx.lineWidth = 2;

            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 14;

            ctx.shadowBlur = 0;
            ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';

            for (let i = 0; i < MODE_KEYS_ACTIVE.length; i++) {
                const key = MODE_KEYS_ACTIVE[i];

                    ctx.shadowColor = '#3a8fd4'; ctx.shadowBlur = 12;

        // ============================================================
        // 塔图标绘制
        // ============================================================
        function drawTowerLogo(c, type, lv, px, py, angle, color, scale) {
            color = color || '#ffffff';
            const sf = (typeof scale === 'number' && scale > 0) ? scale : 1;
            c.save();
            c.translate(px, py);
            if (sf !== 1) c.scale(sf, sf);
            if (typeof angle === 'number' && (type === 'gun' || type === 'cannon' || type === 'missile' || type === 'sniper' || type === 'railgun' || type === 'flak' || type === 'laser')) {
                c.rotate(angle + Math.PI / 2);
            }
            c.lineCap = 'round'; c.lineJoin = 'round';
            if (color === '#ffffff') { c.shadowColor = 'rgba(0, 0, 0, 0.55)'; c.shadowBlur = 3; }
            switch (type) {
                case 'gun':       drawGunLogo(c, lv, color); break;
                case 'cannon':    drawCannonLogo(c, lv, color); break;
                case 'missile':   drawMissileLogo(c, lv, color); break;
                case 'temporal':  drawSlowLogo(c, lv, color); break;
                case 'laser':     drawLaserLogo(c, lv, color); break;
                case 'shock':     drawShockLogo(c, lv, color); break;
                case 'chain':     drawChainLogo(c, lv, color); break;
                case 'sniper':    drawSniperLogo(c, lv, color); break;
                case 'amplifier': drawAmplifierLogo(c, lv, color); break;
                case 'railgun':   drawRailgunLogo(c, lv, color); break;
                case 'venom':     drawVenomLogo(c, lv, color); break;
                case 'flak':      drawFlakLogo(c, lv, color); break;
                case 'prism':     drawPrismLogo(c, lv, color); break;
                case 'emp':       drawEmpLogo(c, lv, color); break;
                case 'harvester': drawHarvesterLogo(c, lv, color); break;
                default: break;
            }
            c.restore();
        }

        function drawGunLogo(c, lv, color) {
            color = color || '#ffffff';
            const barrels = lv >= 4 ? 3 : 2;
            const bw = 2.0, gap = 2.6, bLen = 10, bodyTop = -1, bodyBot = 6;
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(-3, bodyTop); c.lineTo(3, bodyTop);
            c.lineTo(4.5, bodyBot); c.lineTo(-4.5, bodyBot); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.42)';
            c.fillRect(-2.2, bodyTop + 1.8, 4.4, 0.8);
            c.fillRect(-2.8, bodyTop + 3.4, 5.6, 0.8);
            for (let i = 0; i < barrels; i++) {
                const ox = (i - (barrels - 1) / 2) * gap;
                c.fillStyle = color;
                c.fillRect(ox - bw / 2, -bLen, bw, bLen + 1);
                c.fillRect(ox - bw / 2 - 0.6, -bLen - 1.4, bw + 1.2, 1.6);
                c.fillStyle = 'rgba(0,0,0,0.38)';
                c.fillRect(ox - bw / 2 + 0.4, -bLen + 3, bw - 0.8, 0.8);
                c.fillRect(ox - bw / 2 + 0.4, -bLen + 5.4, bw - 0.8, 0.8);
            }
        }
        function drawCannonLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            const barrelTopW = 3.0 + t * 0.22, barrelBotW = 4.0 + t * 0.30;
            const bLen = 11, bodyR = 4.0 + t * 0.16;
            c.fillStyle = color;
            c.beginPath(); c.arc(0, 2.5, bodyR, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.35)';
            c.beginPath(); c.arc(0, 2.5, bodyR, 0, Math.PI); c.fill();
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(-barrelTopW / 2, -bLen); c.lineTo(barrelTopW / 2, -bLen);
            c.lineTo(barrelBotW / 2, 2.5); c.lineTo(-barrelBotW / 2, 2.5); c.closePath(); c.fill();
            c.fillRect(-barrelTopW / 2 - 1, -bLen - 1, barrelTopW + 2, 2.6);
            c.fillStyle = 'rgba(0,0,0,0.65)';
            c.beginPath(); c.ellipse(0, -bLen + 0.3, barrelTopW / 2 - 0.5, 1, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.45)';
            const rings = Math.min(lv, 4);
            for (let i = 0; i < rings; i++) {
                const y = -bLen + 4 + i * 1.9;
                const w = barrelTopW + (barrelBotW - barrelTopW) * ((i + 0.5) / rings) - 0.6;
                c.fillRect(-w / 2, y, w, 0.9);
            }
            for (let i = 0; i < 3; i++) {
                const a = -Math.PI / 2 + (i - 1) * 0.65;
                c.beginPath(); c.arc(Math.cos(a) * bodyR * 0.62, 2.5 + Math.sin(a) * bodyR * 0.62, 0.7, 0, Math.PI * 2); c.fill();
            }
        }
        function drawMissileLogo(c, lv, color) {
            color = color || '#ffffff';
            const count = lv === 1 ? 1 : (lv <= 3 ? 2 : 3);
            c.fillStyle = color;
            c.beginPath(); c.moveTo(-6, 2); c.lineTo(6, 2); c.lineTo(5, 7.5); c.lineTo(-5, 7.5); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.42)'; c.fillRect(-5, 5.5, 10, 2);
            const positions = count === 1 ? [0] : count === 2 ? [-4, 4] : [-5, 0, 5];
            const scale = count === 1 ? 1 : (count === 2 ? 0.85 : 0.7);
            for (const ox of positions) {
                c.save(); c.translate(ox, 0); c.scale(scale, scale);
                c.fillStyle = color;
                c.fillRect(-1.8, -8, 3.6, 10);
                c.beginPath(); c.moveTo(-1.8, -8); c.lineTo(1.8, -8); c.lineTo(0, -13); c.closePath(); c.fill();
                c.fillStyle = 'rgba(255,255,255,0.45)';
                c.beginPath(); c.moveTo(-0.9, -9); c.lineTo(0.3, -9); c.lineTo(0, -12); c.closePath(); c.fill();
                c.fillStyle = 'rgba(0,0,0,0.5)';
                c.fillRect(-1.8, -5, 3.6, 0.8); c.fillRect(-1.8, -1, 3.6, 0.8);
                c.fillStyle = color;
                c.beginPath(); c.moveTo(-1.8, 0); c.lineTo(-4, 3); c.lineTo(-1.8, 3); c.closePath(); c.fill();
                c.beginPath(); c.moveTo(1.8, 0); c.lineTo(4, 3); c.lineTo(1.8, 3); c.closePath(); c.fill();
                c.restore();
            }
        }
        function drawSlowLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6), arms = 6, len = 9 + t * 0.55;
            c.strokeStyle = color; c.globalAlpha = 0.3; c.lineWidth = 1;
            c.beginPath(); c.arc(0, 0, len + 3, 0, Math.PI * 2); c.stroke();
            c.globalAlpha = 1; c.strokeStyle = color; c.lineWidth = 2; c.lineCap = 'round';
            for (let i = 0; i < arms; i++) {
                const a = (i / arms) * Math.PI * 2 - Math.PI / 2;
                const ex = Math.cos(a) * len, ey = Math.sin(a) * len;
                c.beginPath(); c.moveTo(0, 0); c.lineTo(ex, ey); c.stroke();
                for (let b = 1; b <= 2; b++) {
                    const tt = b / 3, bx = ex * tt, by = ey * tt, bl = 3.6 - b * 0.8;
                    c.beginPath(); c.moveTo(bx, by);
                    c.lineTo(bx + Math.cos(a + Math.PI / 3) * bl, by + Math.sin(a + Math.PI / 3) * bl); c.stroke();
                    c.beginPath(); c.moveTo(bx, by);
                    c.lineTo(bx + Math.cos(a - Math.PI / 3) * bl, by + Math.sin(a - Math.PI / 3) * bl); c.stroke();
                }
            }
            c.fillStyle = color;
            c.beginPath(); c.arc(0, 0, 2.4 + t * 0.16, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(255,255,255,0.75)';
            c.beginPath(); c.arc(-0.6, -0.6, 1.1, 0, Math.PI * 2); c.fill();
        }
        function drawLaserLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6), tubeLen = 10 + t * 0.3, topW = 1.8 + t * 0.14, botW = 4.4 + t * 0.22;
            c.fillStyle = color;
            c.beginPath(); c.moveTo(-botW, 5); c.lineTo(botW, 5); c.lineTo(botW - 1, 8.5); c.lineTo(-botW + 1, 8.5); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(-botW + 0.8, 7.4, botW * 2 - 1.6, 1.2);
            c.fillStyle = color;
            c.beginPath(); c.moveTo(-topW, -tubeLen); c.lineTo(topW, -tubeLen); c.lineTo(botW, 5); c.lineTo(-botW, 5); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.28)';
            c.beginPath(); c.moveTo(0, -tubeLen); c.lineTo(topW, -tubeLen); c.lineTo(botW, 5); c.lineTo(0, 5); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.42)';
            for (let i = 0; i < 3; i++) {
                const y = -tubeLen + 4.5 + i * 2.4;
                const w = topW + (botW - topW) * ((y + tubeLen) / (tubeLen + 5));
                c.fillRect(-w, y, w * 2, 0.9);
            }
            c.save(); c.shadowColor = color; c.shadowBlur = 6; c.fillStyle = color;
            c.beginPath(); c.arc(0, -tubeLen, topW + 0.6, 0, Math.PI * 2); c.fill(); c.restore();
            c.fillStyle = 'rgba(0,0,0,0.6)';
            c.beginPath(); c.arc(0, -tubeLen, topW - 0.6, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#ffffff';
            c.beginPath(); c.arc(0, -tubeLen, Math.max(0.9, topW * 0.5), 0, Math.PI * 2); c.fill();
        }
        function drawShockLogo(c, lv, color) {

        function getAggregatedUpgrades() {
            if (!rogueState || rogueState.upgrades.length === 0) return [];
            const counts = new Map();
            for (const u of rogueState.upgrades) {
                if (u.id === 'freeUp' || u.id === 'coreRepair') continue;
                counts.set(u.id, (counts.get(u.id) || 0) + 1);
            }
            const result = [];
            for (const [id, count] of counts) {
                const up = ROGUE_UPGRADES.find(u => u.id === id);
                if (!up) continue;
                result.push({ ...up, count, _rord: RARITY_ORDER[up.rarity] ?? 4 });
            }
            result.sort((a, b) => {
                if (a._rord !== b._rord) return a._rord - b._rord;
                return b.count - a.count;
            });
            return result;
        }

        function getAggregatedEnemyMods() {
            if (!rogueState || !rogueState.enemyMods) return [];
            const em = rogueState.enemyMods;
            const counts = new Map();
            for (const id of em.picks) counts.set(id, (counts.get(id) || 0) + 1);
            const out = [];
            for (const def of ROGUE_ENEMY_BOOSTS) {
                const n = counts.get(def.id);
                if (!n) continue;
                let desc = '';
                switch (def.id) {
                    case 'hp':          desc = `敌人生命 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'speed':       desc = `敌人移速 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'coreLock':    desc = `未携带核心的敌人受伤 -${Math.round((1 - Math.pow(0.8, n)) * 100)}%`; break;
                    case 'stunResist':  desc = `眩晕时长 -${100.00 - 100.00 * Math.pow(0.8, n).toFixed(2)}%`; break;
                    case 'coreDelay':   desc = `核心原地停留 ${3 * n} 秒`; break;
                    case 'dodge':       desc = `闪避概率 ${Math.round((1 - Math.pow(0.92, n)) * 100)}%`; break;
                }
                out.push({ icon: def.icon, name: def.name, color: def.color, desc, count: n });
            }
            return out;
        }

        function getAggregatedDesc(up, count) {
            switch (up.id) {
                case 'dmg':       return `全塔伤害 +${Math.round((Math.pow(1.15, count) - 1) * 100)}%`;
                case 'rate':      return `全塔射速 +${Math.round((Math.pow(1.12, count) - 1) * 100)}%`;
                case 'range':     return `全塔射程 +${Math.round((Math.pow(1.08, count) - 1) * 100)}%`;
                case 'money': {
                    const total = 350 * count + 100 * count * (count - 1) / 2;
                    const latest = 350 + (count - 1) * 100;
                    return `累计获得 ${total} 资金（最近一次 +${latest}）`;
                }
                case 'killBonus': return `击杀 +${8 * count} 资金`;
                case 'priceDown': return `建造与升级花费 -${Math.round((1 - Math.pow(0.9, count)) * 100)}%`;
                case 'reveal':    return `隐形发现 +${Math.round((Math.pow(1.5, count) - 1) * 100)}%`;
                case 'slowAura':  return `敌人移速 -${Math.round((1 - Math.pow(0.9, count)) * 100)}%`;
                case 'sellPlus':  return `出售返还 +${Math.min(50, 25 * count)}%`;
                case 'crit':      return `暴击率 ${Math.round((1 - Math.pow(0.88, count)) * 100)}%（倍率 ×${((rogueState && rogueState.bonus.critDmgMul) || 2).toFixed(1)}）`;
                case 'critDmg':   return `暴击伤害倍率 ×${((rogueState && rogueState.bonus.critDmgMul) || 2).toFixed(1)}`;
                case 'doubleShot':return `弹射率 ${Math.round((1 - Math.pow(0.85, count)) * 100)}%`;
                case 'killAll':   return `已触发 ${count} 次全屏秒杀`;
                case 'stunAll':   return `已触发 ${count} 次全屏眩晕`;
                case 'currentHpDmg': return `攻击附带 ${Math.round(Math.min(0.20, 0.01 * count) * 100)}% 当前生命值伤害`;
                case 'charm':     return `魅惑率 ${Math.round((1 - Math.pow(0.97, count)) * 100)}%`;
                default: return up.desc;
            }
        }

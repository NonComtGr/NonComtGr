    isBreakShot = false;
    shotFirstContact = null;
    shotPottedBalls = [];
    shotPotted = 0;
    cuePottedThisShot = false;
    shotTargetBall = (mode === 'nine') ? lowestNineBall() : null;

    const speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * p;
    const dx = Math.cos(aimAngle), dy = Math.sin(aimAngle);
    cueBall.vx = dx * speed;
    cueBall.vy = dy * speed;
    const rollOmega = speed / R;
    const spinFactor = -cueHitY * 2;
    cueBall.wx = -dy * rollOmega * spinFactor;
    cueBall.wy = dx * rollOmega * spinFactor;
    cueBall.wz = -cueHitX * rollOmega;
    cueHitX = 0; cueHitY = 0;
    drawCueSpotSelector();
    shots++;
    beep(170, 0.09, 0.16, 'square');
    setTimeout(() => beep(110, 0.14, 0.10, 'sine'), 30);
  }

  // ============================================================
  //  渲染
  // ============================================================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function drawTable() {
    if (table.isPolygon) drawPolygonTable();
    else drawRectTable();
  }

  function drawPolygonTable() {
    const p = table.polygon;
    ctx.beginPath();
    for (let i = 0; i < p.sides; i++) {
      const a = p.angles[i];
      const x = p.cx + Math.cos(a) * p.rad;
      const y = p.cy + Math.sin(a) * p.rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    const felt = ctx.createRadialGradient(
      p.cx - p.rad * 0.25, p.cy - p.rad * 0.25, 10,
      p.cx, p.cy, p.rad * 1.2
    );
    felt.addColorStop(0, '#1f9452');
    felt.addColorStop(0.6, '#177c43');
    felt.addColorStop(1, '#0d6636');
    ctx.fillStyle = felt;
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < p.sides; i++) {
      const a = p.angles[i];
      const x = p.cx + Math.cos(a) * p.rad;
      const y = p.cy + Math.sin(a) * p.rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.clip();
    const vig = ctx.createRadialGradient(p.cx, p.cy, p.rad * 0.3, p.cx, p.cy, p.rad);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.44)');
    ctx.fillStyle = vig;
    ctx.fillRect(p.cx - p.rad, p.cy - p.rad, p.rad * 2, p.rad * 2);
    ctx.restore();
    for (const w of table.walls) drawCushion(w);
    for (const pkt of table.pockets) drawPocket(pkt);
  }

  function drawRectTable() {
    const fw = 35;
    const outerRect = {
      x: TABLE.left - fw, y: TABLE.top - fw,
      w: TW + fw * 2, h: TH + fw * 2
    };
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(outerRect.x, outerRect.y, outerRect.w, outerRect.h, 18);
    const woodGrad = ctx.createLinearGradient(outerRect.x, outerRect.y, outerRect.x, outerRect.y + outerRect.h);
    woodGrad.addColorStop(0, '#1a1a1a');
    woodGrad.addColorStop(0.5, '#0a0a0a');
    woodGrad.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = woodGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    for (const r of table.rects) {
      const felt = ctx.createRadialGradient(
        r.x + r.w / 2, r.y + r.h / 2, 10,
        r.x + r.w / 2, r.y + r.h / 2, Math.max(r.w, r.h) * 0.8
      );
      felt.addColorStop(0, '#1f9e57');
      felt.addColorStop(0.7, '#198b49');
      felt.addColorStop(1, '#116e38');
      ctx.fillStyle = felt;
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }

    ctx.save();
    ctx.beginPath();
    for (const r of table.rects) ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();
    const b = table.bounds;
    const cx = (b.left + b.right) / 2;
    const cy = (b.top + b.bottom) / 2;
    const diag = Math.hypot(b.right - b.left, b.bottom - b.top);
    const vig = ctx.createRadialGradient(cx, cy, diag * 0.25, cx, cy, diag * 0.7);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vig;
    ctx.fillRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
    ctx.restore();

    for (const w of table.walls) drawCushion(w);
    for (const p of table.pockets) drawPocket(p);

    ctx.save();
    if (mode === 'snooker') {
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(BALK_X, TABLE.top);
      ctx.lineTo(BALK_X, TABLE.bottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(BALK_X, CY, D_RADIUS, Math.PI / 2, Math.PI * 1.5);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      const spots = [
        [BALK_X, CY - D_RADIUS], [BALK_X, CY], [BALK_X, CY + D_RADIUS],
        [SPOT.centerX, CY], [SPOT.pinkX, CY], [SPOT.blackX, CY]
      ];
      for (const [sx, sy] of spots) {
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (mode === 'eight' || mode === 'nine') {
      const footX = TABLE.left + TW * 0.75;
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(HEAD_X, TABLE.top);
      ctx.lineTo(HEAD_X, TABLE.bottom);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.arc(HEAD_X, CY, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(footX, CY, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawCushion(w) {
    const CUSH = 22;
    const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
    const len = Math.hypot(dx, dy);
    if (len < 1) return;
    const ux = dx / len, uy = dy / len;
    const nx = w.nx, ny = w.ny;
    const c1 = w.cut1 || 0, c2 = w.cut2 || 0;
    const n1x = w.x1 + ux * c1, n1y = w.y1 + uy * c1;
    const n2x = w.x2 - ux * c2, n2y = w.y2 - uy * c2;
    const b1x = w.x1 + ux * (c1 * 0.2) - nx * CUSH;
    const b1y = w.y1 + uy * (c1 * 0.2) - ny * CUSH;
    const b2x = w.x2 - ux * (c2 * 0.2) - nx * CUSH;
    const b2y = w.y2 - uy * (c2 * 0.2) - ny * CUSH;
    ctx.beginPath();
    ctx.moveTo(n1x, n1y);
    ctx.lineTo(n2x, n2y);
    if (c2 > 0.5) {
      const mx = (n2x + b2x) * 0.5, my = (n2y + b2y) * 0.5;
      let ox = mx - w.x2, oy = my - w.y2;
      const ol = Math.hypot(ox, oy) || 1;
      ox /= ol; oy /= ol;
      ctx.quadraticCurveTo(mx - ox * CUSH * 0.2, my - oy * CUSH * 0.2, b2x, b2y);
    } else ctx.lineTo(b2x, b2y);
    ctx.lineTo(b1x, b1y);
    if (c1 > 0.5) {
      const mx = (n1x + b1x) * 0.5, my = (n1y + b1y) * 0.5;
      let ox = mx - w.x1, oy = my - w.y1;
      const ol = Math.hypot(ox, oy) || 1;
      ox /= ol; oy /= ol;
      ctx.quadraticCurveTo(mx - ox * CUSH * 0.2, my - oy * CUSH * 0.2, n1x, n1y);
    } else ctx.lineTo(n1x, n1y);
    ctx.closePath();
    const g = ctx.createLinearGradient(w.x1, w.y1, w.x1 - nx * CUSH, w.y1 - ny * CUSH);
    g.addColorStop(0, '#0f5c30');
    g.addColorStop(0.15, '#0a4524');
    g.addColorStop(0.8, '#042211');
    g.addColorStop(1, '#02140a');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(n1x, n1y);
    ctx.lineTo(n2x, n2y);
    ctx.strokeStyle = 'rgba(150,255,200,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawPocket(p) {
    const cfg = pocketCfg(p);
    const isMid = p.type === 'mid';
    const innerR = cfg.innerR, outerR = cfg.outerR;
    const kx = isMid ? 1.10 : 1, ky = isMid ? 0.92 : 1;
    const ox = outerR * kx, oy = outerR * ky;
    const ix = innerR * kx, iy = innerR * ky;
    const px = p.x, py = p.y;

    const dimple = ctx.createRadialGradient(px, py, ox * 0.92, px, py, ox * 1.55);
    dimple.addColorStop(0, 'rgba(0,0,0,0.30)');
    dimple.addColorStop(0.55, 'rgba(0,0,0,0.12)');
    dimple.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.ellipse(px, py, ox * 1.55, oy * 1.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = dimple;
    ctx.fill();

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    ctx.ellipse(px, py, ox, oy, 0, 0, Math.PI * 2);
    const rimGrad = ctx.createRadialGradient(
      px - ox * 0.32, py - oy * 0.36, ox * 0.12,
      px, py, ox * 1.02
    );
    rimGrad.addColorStop(0, '#666d76');
    rimGrad.addColorStop(0.28, '#3a3f47');
    rimGrad.addColorStop(0.58, '#1c1f24');
    rimGrad.addColorStop(0.85, '#0a0b0d');
    rimGrad.addColorStop(1, '#000000');
    ctx.fillStyle = rimGrad;
    ctx.fill();
    ctx.restore();

    const wallGrad = ctx.createRadialGradient(px, py, ix * 0.62, px, py, ox - 2.5);
    wallGrad.addColorStop(0, 'rgba(0,0,0,0)');
    wallGrad.addColorStop(0.55, 'rgba(0,0,0,0.45)');
    wallGrad.addColorStop(0.86, 'rgba(8,10,12,0.94)');
    wallGrad.addColorStop(1, 'rgba(30,34,40,0.98)');
    ctx.beginPath();
    ctx.ellipse(px, py, ox - 2.5, oy - 2.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = wallGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(px, py, ix + 1.2, iy + 1.2, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.lineWidth = 2.3;
    ctx.stroke();

    const holeGrad = ctx.createRadialGradient(
      px - ix * 0.22, py - iy * 0.28, ix * 0.08,
      px, py + iy * 0.12, ix * 1.08
    );
    holeGrad.addColorStop(0, '#000000');
    holeGrad.addColorStop(0.62, '#000000');
    holeGrad.addColorStop(1, '#060607');
    ctx.beginPath();
    ctx.ellipse(px, py, ix, iy, 0, 0, Math.PI * 2);
    ctx.fillStyle = holeGrad;
    ctx.fill();
  }

  function drawPlacementZone() {
    if (!placingCue) return;
    ctx.save();
    if (mode === 'snooker') {
      ctx.fillStyle = 'rgba(120, 255, 160, 0.10)';
      ctx.beginPath();
      ctx.arc(BALK_X, CY, D_RADIUS, Math.PI / 2, Math.PI * 1.5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(120, 255, 160, 0.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(BALK_X, CY, D_RADIUS, Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (mode === 'eight' || mode === 'nine') {
      if (ballInHandMode === 'kitchen') {
        ctx.fillStyle = 'rgba(120, 255, 160, 0.07)';
        ctx.fillRect(TABLE.left, TABLE.top, HEAD_X - TABLE.left, TH);
        ctx.strokeStyle = 'rgba(120, 255, 160, 0.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(HEAD_X, TABLE.top);
        ctx.lineTo(HEAD_X, TABLE.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        const b = table.bounds;
        ctx.fillStyle = 'rgba(120, 255, 160, 0.05)';
        ctx.fillRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
      }
    } else {
      if (table.isPolygon) {
        const p = table.polygon;
        ctx.fillStyle = 'rgba(120, 255, 160, 0.05)';
        ctx.beginPath();
        for (let i = 0; i < p.sides; i++) {
          const a = p.angles[i];
          const x = p.cx + Math.cos(a) * p.rad;
          const y = p.cy + Math.sin(a) * p.rad;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        const b = table.bounds;
        ctx.fillStyle = 'rgba(120, 255, 160, 0.05)';
        ctx.fillRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
      }
    }
    ctx.restore();
  }

  function drawStripeBand(color, M, k) {
    const ax = M[0], ay = M[3], az = M[6];
    const threshold = k * R;
    ctx.fillStyle = color;
    const Rceil = Math.ceil(R);
    for (let Y = -Rceil; Y < Rceil; Y++) {
      const Yc = Y + 0.5;
      const halfW = Math.sqrt(Math.max(0, R * R - Yc * Yc));
      if (halfW < 0.5) continue;
      const step = 1;
      let start = null;
      const segments = [];
      for (let X = -halfW; X <= halfW + step * 0.5; X += step) {
        const Xc = Math.min(X, halfW);
        const z2 = R * R - Xc * Xc - Yc * Yc;
        const Z = z2 > 0 ? Math.sqrt(z2) : 0;
        const val = Xc * ax + Yc * ay + Z * az;
        const inside = Math.abs(val) < threshold;
        if (inside && start === null) start = Xc;
        else if (!inside && start !== null) { segments.push([start, Xc]); start = null; }
      }
      if (start !== null) segments.push([start, halfW]);
      for (const [x0, x1] of segments) {
        ctx.fillRect(x0, Y, Math.max(0.5, x1 - x0), 1);
      }
    }
  }

  function drawBallNumber(num, M) {
    const isEight = (mode === 'eight');
    const baseNumR = isEight ? 0.52 : 0.56;
    const baseFs = isEight ? 0.72 : 0.58;
    const positions = [
      transformPoint(M, 0, 0, 1),
      transformPoint(M, 0, 0, -1)
    ];
    for (const w of positions) {
      const wz = w[2];
      if (wz <= 0.1) continue;
      const px = w[0] * R, py = w[1] * R;
      const scale = 0.4 + 0.6 * wz;
      const numR = R * baseNumR * scale;
      const fs = R * baseFs * scale;
      ctx.beginPath();
      ctx.arc(px, py, numR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.93)';
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = `bold ${Math.round(fs)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(num), px, py + 0.5);
    }
  }

  function drawCueMark(M) {
    const lx = 0.45;
    const lz = Math.sqrt(1 - 0.45 * 0.45);
    const w = transformPoint(M, lx, 0, lz);
    if (w[2] <= 0.05) return;
    const px = w[0] * R, py = w[1] * R;
    const size = R * 0.10 * (0.3 + 0.7 * w[2]);
    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,60,60,0.30)';
    ctx.fill();
  }

  function drawBall(b) {
    const x = b.x, y = b.y;
    ctx.beginPath();
    ctx.ellipse(x + 2.5, y + 3.5, R * 0.95, R * 0.85, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fill();
    const M = quatToMatrix(b);
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    if (b.type === 'cue') {
      ctx.fillStyle = '#fbfbf7';
      ctx.fillRect(-R, -R, 2 * R, 2 * R);
    } else if (b.type === 'stripe') {
      ctx.fillStyle = '#f7f6f0';
      ctx.fillRect(-R, -R, 2 * R, 2 * R);
      drawStripeBand(b.color, M, 0.6);
    } else {
      ctx.fillStyle = b.color;
      ctx.fillRect(-R, -R, 2 * R, 2 * R);
      const marker = transformPoint(M, 0, 0, 1);
      if (marker[2] > 0.1) {
        ctx.beginPath();
        ctx.arc(marker[0] * R, marker[1] * R, R * 0.10 * (0.3 + 0.7 * marker[2]), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fill();
      }
    }
    if (b.num > 0 && (mode === 'eight' || mode === 'nine' || mode === 'crazy' || mode === 'polygon')) {
      drawBallNumber(b.num, M);
    }
    if (b.type === 'cue') drawCueMark(M);

    const shade = ctx.createRadialGradient(-R * 0.35, -R * 0.38, R * 0.05, 0, 0, R * 1.15);
    shade.addColorStop(0, 'rgba(255,255,255,0.62)');
    shade.addColorStop(0.4, 'rgba(255,255,255,0.03)');
    shade.addColorStop(0.78, 'rgba(0,0,0,0.12)');
    shade.addColorStop(1, 'rgba(0,0,0,0.50)');
    ctx.fillStyle = shade;
    ctx.fillRect(-R, -R, 2 * R, 2 * R);

    const gloss = ctx.createRadialGradient(R * 0.3, R * 0.42, 1, R * 0.3, R * 0.42, R * 0.6);
    gloss.addColorStop(0, 'rgba(255,255,255,0.18)');
    gloss.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.fillRect(-R, -R, 2 * R, 2 * R);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, R - 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.30)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (b.type === 'cue' && b.vx === 0 && b.vy === 0 && !placingCue && !clearPending && isPlayerTurn()) {
      const mx = x + cueHitX * R * 0.58;
      const my = y + cueHitY * R * 0.58;
      ctx.beginPath();
      ctx.arc(mx, my, R * 0.17, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(229, 57, 53, 0.88)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function drawBalls() {
    for (const b of balls) {
      if (!b.potted) {
        if (placingCue && b === cueBall) {
          ctx.save(); ctx.globalAlpha = 0.65; drawBall(b); ctx.restore();
        } else drawBall(b);
      }
    }
    if (placingCue) drawPlacementRing();
  }

  // ★★★ 取当前行动方应当击打的球（不再画黄圈）
  function getTargetBalls() {
    let targets = [];
    if (mode === 'eight') {
      if (!groupsAssigned) {
        targets = balls.filter(b => !b.potted && b.type !== 'cue' && b.num !== 8);
      } else {
        const grp = (turn === 'player') ? playerGroup : aiGroup;
        if (grp) {
          const mine = balls.filter(b => !b.potted && b.type === grp && b.num !== 8);
          targets = mine.length ? mine : balls.filter(b => !b.potted && b.num === 8);
        }
      }
    } else if (mode === 'nine') {
      const t = lowestNineBall();
      if (t) targets = [t];
    } else if (mode === 'snooker') {
      targets = balls.filter(b => {
        if (b.potted || b.type === 'cue') return false;
        if (snookerTarget === 'red') return b.type === 'red';
        if (snookerTarget === 'color') return b.type === 'color';
        return b.type === 'color' && b.points === snookerTarget;
      });
    } else {
      targets = balls.filter(b => !b.potted && b.type !== 'cue');
    }
        targets.sort((a, b) => (a.num || 0) - (b.num || 0));
    return targets;
  }

  // ★★★ 单个迷你球图标
  function drawMiniBall(x, y, r, b) {
    ctx.save();

    // 阴影
    ctx.beginPath();
    ctx.arc(x + 0.8, y + 1.4, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.fill();

    // 球体
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (b.type === 'stripe') {
      ctx.fillStyle = '#f7f6f0';
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = b.color;
      ctx.fillRect(x - r, y - r * 0.42, 2 * r, r * 0.84);
      ctx.restore();
    } else {
      ctx.fillStyle = b.color || '#ffffff';
      ctx.fill();
    }

    // 立体高光
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    const sh = ctx.createRadialGradient(
      x - r * 0.35, y - r * 0.38, r * 0.05,
      x, y, r * 1.1
    );
    sh.addColorStop(0, 'rgba(255,255,255,0.55)');
    sh.addColorStop(0.45, 'rgba(255,255,255,0.02)');
    sh.addColorStop(1, 'rgba(0,0,0,0.48)');
    ctx.fillStyle = sh;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.restore();

    // 号码
    if (b.num > 0) {
      const nr = r * 0.58;
      ctx.beginPath();
      ctx.arc(x, y, nr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = `bold ${Math.max(7, Math.round(nr * 1.55))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(b.num), x, y + 0.5);
    }

    // 描边
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.42)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  // ★★★ 目标球图标行（位于蓄力条左侧）
  function drawTargetIcons() {
    if (aiLevel === 0) return;
    if (!table || !cueBall) return;
    if (gameOver || clearPending || placingCue) return;

    const targets = getTargetBalls();
    if (targets.length === 0) return;

    const allActive = balls.filter(b => !b.potted && b.type !== 'cue');
    if (allActive.length > 0 && targets.length >= allActive.length) return;

    const ICON_R = 10;
    const GAP = 6;
    const MAX_SHOW = 7;
    const shown = targets.slice(0, MAX_SHOW);
    const more = targets.length - shown.length;

    const bw = 280, bh = 16;
    const bx = (W - bw) / 2;
    const by = H - 30;
    const cyc = by + bh / 2;

    const rightEdge = bx - 20;

    // 组装条目
    const items = [];
    if (more > 0) items.push({ type: 'more', w: 22 });
    for (const b of shown) items.push({ type: 'ball', b, w: ICON_R * 2 });

    let totalW = 0;
    for (let i = 0; i < items.length; i++) {
      totalW += items[i].w;
      if (i < items.length - 1) totalW += GAP;
    }

    const leftEdge = rightEdge - totalW;

    // 背景胶囊
    ctx.save();
    roundRect(leftEdge - 10, cyc - ICON_R - 5, totalW + 20, ICON_R * 2 + 10, 999);
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    let x = leftEdge;
    for (const it of items) {
      if (it.type === 'more') {
        ctx.save();
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.70)';
        ctx.fillText(`+${more}`, x + it.w / 2, cyc + 0.5);
        ctx.restore();
      } else {
        drawMiniBall(x + ICON_R, cyc, ICON_R, it.b);
      }
      x += it.w + GAP;
    }
  }

  function drawPlacementRing() {
    const { x, y, valid } = placementPreview;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R + 6, 0, Math.PI * 2);
    ctx.strokeStyle = valid ? 'rgba(120,255,160,0.9)' : 'rgba(255,90,90,0.9)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = -(performance.now() / 60) % 10;
    ctx.stroke();
    ctx.setLineDash([]);
    let hint = valid ? '松开放置母球' : '位置重叠';
    if (mode === 'eight' || mode === 'nine') {
      if (ballInHandMode === 'kitchen') hint = valid ? '松开放置母球（线后）' : '线后位置重叠';
      else hint = valid ? '松开放置母球（自由球）' : '位置重叠';
    } else if (mode === 'snooker') {
      hint = valid ? '松开放置母球（D 区）' : 'D 区位置重叠';
    }
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = valid ? 'rgba(180,255,200,0.95)' : 'rgba(255,150,150,0.95)';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fillText(hint, x, y - R - 18);
    ctx.restore();
  }

  function rayWallHit(ox, oy, dx, dy, w) {
    const denom = dx * w.nx + dy * w.ny;
    if (Math.abs(denom) < 1e-6) return null;
    const num = R - (ox - w.x1) * w.nx - (oy - w.y1) * w.ny;
    const t = num / denom;
    if (t <= 0) return null;
    const px = ox + dx * t, py = oy + dy * t;
    const wx = w.x2 - w.x1, wy = w.y2 - w.y1;
    const len2 = wx * wx + wy * wy;
    if (len2 < 1e-6) return null;
    const u = ((px - w.x1) * wx + (py - w.y1) * wy) / len2;
    if (u < 0 || u > 1) return null;
    return { t, px, py, wall: w };
  }

  function drawAim() {
    if (placingCue || clearPending || cueBall.potted || !allStopped()) return;
    const dx = Math.cos(aimAngle), dy = Math.sin(aimAngle);
    let dist = 3000;
    let hitBall = null, hitWall = null;
    for (const b of balls) {
      if (b === cueBall || b.potted) continue;
      const ox = b.x - cueBall.x, oy = b.y - cueBall.y;
      const proj = ox * dx + oy * dy;
      if (proj <= 0) continue;
      const perp2 = ox * ox + oy * oy - proj * proj;
      const rr = (2 * R) * (2 * R);
      if (perp2 > rr) continue;
      const t = proj - Math.sqrt(rr - perp2);
      if (t >= 0 && t < dist) { dist = t; hitBall = b; }
    }
    if (!hitBall) {
      for (const w of table.walls) {
        const h = rayWallHit(cueBall.x, cueBall.y, dx, dy, w);
        if (h && h.t < dist) { dist = h.t; hitWall = h; }
      }
    }
    if (!hitBall && !hitWall) dist = Math.min(dist, 260);
    const ex = cueBall.x + dx * dist;
    const ey = cueBall.y + dy * dist;
    const isAI = !isPlayerTurn();
    ctx.save();
    ctx.setLineDash([9, 9]);
    ctx.lineDashOffset = -(performance.now() / 45) % 18;
    ctx.strokeStyle = charging ? 'rgba(255,235,130,0.92)' :
      (isAI ? 'rgba(150,215,255,0.80)' : 'rgba(255,255,255,0.68)');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cueBall.x + dx * R, cueBall.y + dy * R);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.restore();

    if (hitBall) {
      ctx.beginPath();
      ctx.arc(ex, ey, R, 0, Math.PI * 2);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(255,255,255,0.90)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
      let nx = hitBall.x - ex, ny = hitBall.y - ey;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      const targetEndX = hitBall.x + nx * (R + sepLength);
      const targetEndY = hitBall.y + ny * (R + sepLength);
      ctx.beginPath();
      ctx.moveTo(hitBall.x + nx * R, hitBall.y + ny * R);
      ctx.lineTo(targetEndX, targetEndY);
      ctx.strokeStyle = `rgba(120, 255, 160, ${sepAlpha})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(targetEndX, targetEndY);
      ctx.lineTo(targetEndX - nx * 11 - ny * 6, targetEndY - ny * 11 + nx * 6);
      ctx.lineTo(targetEndX - nx * 11 + ny * 6, targetEndY - ny * 11 - nx * 6);
      ctx.closePath();
      ctx.fillStyle = `rgba(120, 255, 160, ${sepAlpha})`;
      ctx.fill();

      // ★★★ 母球分离线：碰撞后母球沿两球心连线的切线方向运动
      let tx = -ny, ty = nx;
      const tProj = dx * tx + dy * ty;
      if (tProj < 0) { tx = -tx; ty = -ty; }
      const cutMag = Math.abs(tProj);
      if (cutMag > 0.05) {
        const cueLen = Math.max(26, sepLength * cutMag);
        const cex = ex + tx * cueLen;
        const cey = ey + ty * cueLen;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(cex, cey);
        ctx.strokeStyle = `rgba(140, 205, 255, ${sepAlpha})`;
        ctx.lineWidth = 2.4;
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -(performance.now() / 50) % 13;
        ctx.stroke();
        ctx.setLineDash([]);
        const ah = 10, aw = 5.5;
        ctx.beginPath();
        ctx.moveTo(cex + tx * 1, cey + ty * 1);
        ctx.lineTo(cex - tx * ah - ty * aw, cey - ty * ah + tx * aw);
        ctx.lineTo(cex - tx * ah + ty * aw, cey - ty * ah - tx * aw);
        ctx.closePath();
        ctx.fillStyle = `rgba(140, 205, 255, ${sepAlpha})`;
        ctx.fill();
        ctx.restore();
      }
    } else if (hitWall) {
      const nx = hitWall.wall.nx, ny = hitWall.wall.ny;
      const dot = dx * nx + dy * ny;
      const rdx = dx - 2 * dot * nx, rdy = dy - 2 * dot * ny;
      const bl = sepLength * 1.1;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex + rdx * bl, ey + rdy * bl);
      ctx.strokeStyle = `rgba(255, 255, 255, ${sepAlpha * 0.45})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.beginPath();
      ctx.arc(ex, ey, R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function drawCueStick() {
    if (placingCue || clearPending || cueBall.potted || !allStopped()) return;
    const dx = Math.cos(aimAngle), dy = Math.sin(aimAngle);
    const pullBack = R + 14 + power * 85;
    const sx = cueBall.x - dx * pullBack;
    const sy = cueBall.y - dy * pullBack;
    const ex = sx - dx * 235, ey = sy - dy * 235;
    ctx.save();
    ctx.lineCap = 'round';
    const g = ctx.createLinearGradient(sx, sy, ex, ey);
    g.addColorStop(0, '#f6ecd8');
    g.addColorStop(0.12, '#d9bd8c');
    g.addColorStop(0.6, '#8b5a2b');
    g.addColorStop(1, '#3d2412');
    ctx.strokeStyle = g;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.strokeStyle = '#2f6fb8';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - dx * 9, sy - dy * 9);
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life) * 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const SNOOKER_COLOR_NAMES = { 2: '黄球', 3: '绿球', 4: '棕球', 5: '蓝球', 6: '粉球', 7: '黑球' };

  // ★★★ 该击打的球提示文案
  function shotTargetLabel(who) {
    if (mode === 'eight') {
      if (!groupsAssigned) return { text: '目标：任意非 8 号球', color: '#ffd76a' };
      const grp = (who === 'player') ? playerGroup : aiGroup;
      if (!grp) return null;
      const left = balls.filter(b => !b.potted && b.type === grp && b.num !== 8).length;
      const tag = (grp === 'solid') ? '全色球' : '花色球';
      if (left === 0) return { text: '目标：8 号球', color: '#ffb0b0' };
      return {
        text: `目标：${tag} · 剩 ${left}`,
        color: (grp === 'solid') ? '#ffd76a' : '#a9d4ff'
      };
    }
    if (mode === 'nine') {
      const t = lowestNineBall();
      return t ? { text: `目标：${t.num} 号球`, color: '#ffd76a' } : null;
    }
    if (mode === 'snooker') {
      let n;
      if (snookerTarget === 'red') n = '红球';
      else if (snookerTarget === 'color') n = '任意彩球';
      else n = SNOOKER_COLOR_NAMES[snookerTarget] || '—';
      return { text: `目标：${n}`, color: '#ffd76a' };
    }
    return null;
  }

  function drawHUD() {
    const hx = 18, hy = 22;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 8;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(`杆数  ${shots}`, hx, hy);

    if (mode === 'eight') {
      const left = 15 - pottedCount;
      ctx.fillStyle = left > 0 ? 'rgba(255,255,255,0.82)' : '#7dffa8';
      ctx.fillText(`剩余  ${Math.max(0, left)} / 15`, hx, hy + 24);
    } else if (mode === 'nine') {
      const left = balls.filter(b => b.type !== 'cue' && !b.potted).length;
      ctx.fillStyle = left > 0 ? 'rgba(255,255,255,0.82)' : '#7dffa8';
      ctx.fillText(`剩余  ${left} / 9`, hx, hy + 24);
      const t = lowestNineBall();
      ctx.fillStyle = '#ffd76a';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText(`目标  ${t ? (t.num + ' 号球') : '—'}`, hx, hy + 46);
    } else if (mode === 'crazy' || mode === 'polygon') {
      const left = totalBalls - pottedCount;
      ctx.fillStyle = left > 0 ? 'rgba(255,255,255,0.82)' : '#7dffa8';
      ctx.fillText(`剩余  ${Math.max(0, left)} / ${totalBalls}`, hx, hy + 24);
      if (mode === 'polygon') {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = 'bold 13px system-ui, sans-serif';
        ctx.fillText(`正 ${table.polygon.sides} 边形`, hx, hy + 46);
      }
    } else {
      const redsLeft = balls.filter(b => b.type === 'red' && !b.potted).length;
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.fillText(`红球  ${redsLeft}`, hx, hy + 24);
      let tName;
      if (snookerTarget === 'red') tName = '红球';
      else if (snookerTarget === 'color') tName = '任意彩球';
      else tName = SNOOKER_COLOR_NAMES[snookerTarget] || '—';
      ctx.fillStyle = '#ffd76a';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillText(`目标  ${tName}`, hx, hy + 46);
    }

    if (aiLevel > 0) {
      const rx = W - 18;
      ctx.textAlign = 'right';

      // ★ 比分
      ctx.font = 'bold 17px system-ui, sans-serif';
      ctx.fillStyle = turn === 'player' ? '#8dffb0' : 'rgba(255,255,255,0.52)';
      ctx.fillText(`你 ${scoreP}`, rx - 96, hy);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillText(':', rx - 62, hy);
      ctx.fillStyle = turn === 'ai' ? '#8fd8ff' : 'rgba(255,255,255,0.52)';
      ctx.fillText(`AI ${scoreA}`, rx, hy);

      // ★ 回合状态
      let txt, col;
      if (turn === 'ai') {
        col = 'rgba(150,215,255,0.95)';
        txt = aiAiming ? `AI Lv${aiLevel} 瞄准中…`
          : aiThinking ? `AI Lv${aiLevel} 思考中…`
          : (placingCue ? `AI Lv${aiLevel} 放置母球…` : `AI Lv${aiLevel} 出杆`);
      } else {
        col = 'rgba(150,255,190,0.95)';
        txt = placingCue ? '放置母球 · 点击拖动 · 松开确认' : '你的回合 · 按住蓄力';
      }
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillStyle = col;
      ctx.fillText(txt, rx, hy + 22);

      // ★ 该击打的球
      const ti = shotTargetLabel(turn === 'player' ? 'player' : 'ai');
      if (ti) {
        ctx.font = 'bold 13px system-ui, sans-serif';
        ctx.fillStyle = ti.color;
        ctx.fillText(ti.text, rx, hy + 44);
      }
    }
    ctx.restore();

    if (charging) {
      const bw = 280, bh = 16;
      const bx = (W - bw) / 2, by = H - 30;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 12;
      roundRect(bx, by, bw, bh, 8);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fill();
      const fillW = Math.max(1, (bw - 4) * power);
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#3ee07a');
      g.addColorStop(0.5, '#f5cf30');
      g.addColorStop(1, '#ef4444');
      roundRect(bx + 2, by + 2, fillW, bh - 4, 6);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawClearMessage() {
    if (!clearPending) return;
    const elapsed = performance.now() - clearTime;
    const t = Math.min(1, elapsed / CLEAR_DELAY);
    const fadeIn = Math.min(1, elapsed / 250);
    const fadeOut = Math.min(1, (CLEAR_DELAY - elapsed) / 300);
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fillRect(0, 0, W, H);
    const pop = 1 + Math.sin(Math.min(1, t * 1.6) * Math.PI * 0.85) * 0.16;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(pop, pop);
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 260);
    glow.addColorStop(0, 'rgba(255,215,80,0.35)');
    glow.addColorStop(1, 'rgba(255,215,80,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 260, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 24;
    ctx.font = 'bold 68px system-ui, -apple-system, "PingFang SC", sans-serif';
    const textGrad = ctx.createLinearGradient(-180, 0, 180, 0);
    textGrad.addColorStop(0, '#ffd54a');
    textGrad.addColorStop(0.5, '#fff8c4');
    textGrad.addColorStop(1, '#ffb300');
    ctx.fillStyle = textGrad;
    let title = '清台！';
    if (mode === 'crazy') title = '55 球清空！';
    else if (mode === 'polygon') title = `正 ${table.polygon.sides} 边形清空！`;
    else if (mode === 'eight' && aiLevel > 0) title = '8 球对决结束';
    else if (mode === 'nine' && aiLevel > 0) title = '9 球对决结束';
    else if (mode === 'snooker' && aiLevel > 0) title = '斯诺克结束';
    ctx.fillText(title, 0, -12);
    ctx.shadowBlur = 10;
    ctx.font = 'bold 20px system-ui, -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    let sub;
    if (aiLevel > 0) {
      if (mode === 'eight' || mode === 'nine') {
        sub = winner === 'player' ? '你赢了 🏆' : (winner === 'ai' ? 'AI 获胜' : '平局');
      } else {
        const w = scoreP > scoreA ? '你赢了 🏆' : (scoreP < scoreA ? 'AI 获胜' : '平局');
        sub = `你 ${scoreP} : ${scoreA} AI  ·  ${w}`;
      }
    } else if (mode === 'snooker') {
      sub = `得分 ${scoreP} · 即将重新开始`;
    } else {
      sub = `共 ${shots} 杆 · 即将重新开始`;
    }
    ctx.fillText(sub, 0, 52);
    ctx.restore();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawTable();
    drawPlacementZone();
    drawAim();
    drawCueStick();
    drawBalls();
    drawTargetIcons();   // ★ 原 drawTargetHints()（黄圈）已替换为蓄力条左侧的图标
    drawParticles();
    drawHUD();
    drawClearMessage();
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt / 0.65;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function loop() {
    const moving = !allStopped();
    if (moving) {
      for (let s = 0; s < SUBSTEPS; s++) step(DT / SUBSTEPS);
    } else {
      while (pendingRespawns.length > 0) {
        const b = pendingRespawns.shift();
        const inRedPhase = (snookerTarget === 'red' || snookerTarget === 'color');
        if (inRedPhase) respawnColorBall(b);
      }
      if (shotInProgress) {
        shotInProgress = false;
        resolveShot();
      }
      if (!clearPending && isGameFinished()) {
        if (!winner) {
          if (mode === 'snooker' && aiLevel > 0) {
            winner = scoreP > scoreA ? 'player' : (scoreA > scoreP ? 'ai' : 'tie');
          } else if (mode === 'eight' && aiLevel === 0) {
            winner = 'player';
          } else {
            winner = scoreP > scoreA ? 'player' : (scoreA > scoreP ? 'ai' : 'tie');
          }
        }
        clearPending = true;
        clearTime = performance.now();
        beep(660, 0.12, 0.14, 'sine');
        setTimeout(() => beep(880, 0.12, 0.14, 'sine'), 120);
        setTimeout(() => beep(1100, 0.20, 0.14, 'sine'), 240);
        setTimeout(() => beep(1320, 0.24, 0.12, 'sine'), 380);
      }
      if (clearPending && performance.now() - clearTime > CLEAR_DELAY) {
        clearPending = false;
        newGame();
      }
      if (!clearPending && !placingCue && (cueBall.potted || pendingBallInHand)) {
        startCuePlacement(ballInHandMode);
        pendingBallInHand = false;
      }
      if (!clearPending) scheduleAI();
    }
    if (charging) power = Math.min(1, (performance.now() - chargeStart) / CHARGE_TIME);
    updateParticles(DT);
    render();
    requestAnimationFrame(loop);
  }

  drawCueSpotSelector();
  newGame();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>

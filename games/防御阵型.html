        function wrapTextLines(c, text, maxWidth) {
            const lines = [];
            let current = '';
            const NO_LINE_START = '，。、；：？！）》」』】〉”’·…—～';
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '\n') { lines.push(current); current = ''; continue; }
                const test = current + ch;
                if (c.measureText(test).width > maxWidth && current.length > 0) {
                    if (NO_LINE_START.indexOf(ch) !== -1 && current.length > 1) {
                        const last = current[current.length - 1];
                        lines.push(current.slice(0, -1));
                        current = last + ch;
                    } else {
                        lines.push(current);
                        current = ch;
                    }
                } else {
                    current = test;
                }
            }
            if (current.length > 0) lines.push(current);
            return lines;
        }

        function drawIntroCard(x, y, w, h, item) {
            ctx.fillStyle = '#131c2b'; ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1.3;
            roundRect(ctx, x, y, w, h, 12); ctx.fill(); ctx.stroke();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#ffd966';
            ctx.fillText(item[0], x + 22, y + h / 2 + 1);
            ctx.font = 'bold 18px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.fillText(item[1], x + 64, y + h / 2 + 1);
            ctx.font = '18px "Microsoft YaHei"'; ctx.fillStyle = '#8fb0d0';
            const textX = x + 190;
            const textMaxW = w - 220;
            const lineH = 17;
            const lines = wrapTextLines(ctx, item[2], textMaxW);
            const totalH = lines.length * lineH;
            let startY = y + h / 2 - totalH / 2 + lineH / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i], textX, startY + i * lineH);
            }
        }

        function drawIntro() {
            drawBackdrop();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 18;
            ctx.fillText('玩 法 简 介', canvas.width / 2, 36);
            ctx.shadowBlur = 0;
            ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText('鼠标滚轮上下滑动', canvas.width / 2, 60);
            drawBackBtn();

            // 卡片横向铺满界面：左右各留 20px 边距
            const sideMargin = 20;
            const cardW = canvas.width - sideMargin * 2;
            const gapY = 14;
            const startX = sideMargin;
            const top = 78;
            const viewH = canvas.height - top - 12;
            const lineH = 17;

            ctx.font = '12.5px "Microsoft YaHei"';
            const cardHeights = INTRO_ITEMS.map(item => {
                const lines = wrapTextLines(ctx, item[2], cardW - 220);
                const textH = lines.length * lineH;
                return Math.max(76, textH + 26);
            });

            let contentH = 0;
            for (let i = 0; i < cardHeights.length; i++) {
                contentH += cardHeights[i];
                if (i < cardHeights.length - 1) contentH += gapY;
            }
            maxScroll = Math.max(0, contentH - viewH + 12);
            scrollY = Math.max(0, Math.min(maxScroll, scrollY));

            ctx.save();
            ctx.beginPath(); ctx.rect(0, top, canvas.width, viewH); ctx.clip();
            ctx.translate(0, -scrollY);
            let cy = top;
            for (let i = 0; i < INTRO_ITEMS.length; i++) {
                const cardH = cardHeights[i];
                if (cy - scrollY > canvas.height + 120 || cy - scrollY + cardH < top - 120) {
                    cy += cardH + gapY;
                    continue;
                }
                drawIntroCard(startX, cy, cardW, cardH, INTRO_ITEMS[i]);
                cy += cardH + gapY;
            }
            ctx.restore();
            drawScrollbar(top, viewH);
        }

        function enemyStatRange(key) {
            const es = ENEMY_STATS[key] || { hpFactor: 1, spdFactor: 1 };
            const hpLo = Math.round(26 * 2.9 * es.hpFactor);
            const hpHi = Math.round((26 + 9 * 8) * 2.9 * es.hpFactor);
            const spLo = (1.00 * es.spdFactor).toFixed(2);
            const spHi = (1.00 + 9 * 0.03) * es.spdFactor;
            return { hpLo, hpHi, spLo, spHi: spHi.toFixed(2) };
        }

        function drawEnemyIcon(c, key, px, py, size) {
            const t = ENEMY_TYPES[key];
            const color = t.color;
            c.save(); c.translate(px, py);
            c.fillStyle = color; c.strokeStyle = color;
            c.shadowColor = color; c.shadowBlur = 10;
            switch (key) {
                case 'runner': {
                    c.beginPath(); c.moveTo(0, -size); c.lineTo(size * 0.8, 0);
                    c.lineTo(0, size); c.lineTo(-size * 0.8, 0); c.closePath(); c.fill(); break;
                }
                case 'tank': case 'brute': {
                    c.fillRect(-size * 0.85, -size * 0.85, size * 1.7, size * 1.7);
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0,0,0,0.4)';
                    c.fillRect(-size * 0.4, -size * 0.4, size * 0.8, size * 0.8); break;
                }
                case 'flyer': case 'wasp': {
                    c.beginPath(); c.arc(0, 0, size * 0.8, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.ellipse(-size * 1.1, -2, size * 0.55, size * 0.25, -0.35, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.ellipse(size * 1.1, -2, size * 0.55, size * 0.25, 0.35, 0, Math.PI * 2); c.fill(); break;
                }
                case 'boss': {
                    c.beginPath(); c.arc(0, 0, size * 0.9, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = '#ffdd44';
                    c.beginPath();
                    c.moveTo(-size * 0.6, -size * 0.5); c.lineTo(-size * 0.45, -size * 1.0);
                    c.lineTo(-size * 0.2, -size * 0.65); c.lineTo(0, -size * 1.1);
                    c.lineTo(size * 0.2, -size * 0.65); c.lineTo(size * 0.45, -size * 1.0);
                    c.lineTo(size * 0.6, -size * 0.5); c.closePath(); c.fill(); break;
                }
                case 'shield': {
                    c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,0.35)';
                    c.beginPath(); c.moveTo(-size * 0.5, -size * 0.2); c.lineTo(-size * 0.5, size * 0.2);
                    c.lineTo(0, size * 0.7); c.lineTo(size * 0.5, size * 0.2);
                    c.lineTo(size * 0.5, -size * 0.2); c.closePath(); c.fill(); break;
                }
                case 'shaman': {
                    c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2.5;
                    c.beginPath();
                    c.moveTo(0, -size * 0.45); c.lineTo(0, size * 0.45);
                    c.moveTo(-size * 0.45, 0); c.lineTo(size * 0.45, 0); c.stroke(); break;
                }
                case 'ghost': {
                    c.globalAlpha = 0.6; c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = 1; break;
                }
                case 'hatcher':
                case 'summoner':
                case 'jammer': {
                    drawSpecialEnemyBody(c, key, size * 0.9, color);
                    break;
                }
                case 'wraith': case 'phantom': case 'stalker': case 'specter': case 'shade': {
                    c.globalAlpha = 0.62;
                    drawStealthShape(c, key, size * 0.9, color);
                    c.globalAlpha = 1; c.shadowBlur = 0;
                    c.setLineDash([3, 3]); c.lineWidth = 1.5; c.strokeStyle = color;
                    c.beginPath(); c.arc(0, 0, size * 1.45, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
                    c.fillStyle = '#ffffff';
                    c.beginPath(); c.arc(-size * 0.28, -size * 0.08, size * 0.16, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.arc(size * 0.28, -size * 0.08, size * 0.16, 0, Math.PI * 2); c.fill(); break;
                }
                default: { c.beginPath(); c.arc(0, 0, size * 0.85, 0, Math.PI * 2); c.fill(); }
            }
            c.restore();
        }

        function drawStealthShape(c, type, size, color) {
            c.save();
            const base = c.globalAlpha;
            c.fillStyle = color; c.shadowColor = color;
            switch (type) {
                case 'wraith': {
                    c.beginPath(); c.moveTo(0, -size * 1.25); c.lineTo(size * 0.9, size * 0.6);
                    c.lineTo(0, size * 0.18); c.lineTo(-size * 0.9, size * 0.6); c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.45)';
                    c.beginPath(); c.moveTo(0, -size * 0.55); c.lineTo(size * 0.4, size * 0.32);
                    c.lineTo(0, size * 0.06); c.lineTo(-size * 0.4, size * 0.32); c.closePath(); c.fill(); break;
                }
                case 'phantom': {
                    c.globalAlpha = base * 0.4;
                    c.beginPath(); c.arc(-size * 0.55, size * 0.2, size * 0.85, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = base * 0.65;
                    c.beginPath(); c.arc(size * 0.48, -size * 0.14, size * 0.7, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = base;
                    c.beginPath(); c.arc(0, 0, size * 0.78, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    c.beginPath(); c.arc(0, 0, size * 0.34, 0, Math.PI * 2); c.fill(); break;
                }
                case 'stalker': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const rr = (i % 2 === 0) ? size * 1.18 : size * 0.7;
                        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.moveTo(0, -size * 0.52); c.lineTo(size * 0.34, 0);
                    c.lineTo(0, size * 0.52); c.lineTo(-size * 0.34, 0); c.closePath(); c.fill(); break;
                }
                case 'specter': {
                    c.beginPath(); c.moveTo(-size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(-size * 1.9, -size * 0.95, -size * 1.5, size * 0.4);
                    c.quadraticCurveTo(-size * 1.0, size * 0.12, -size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(size * 1.9, -size * 0.95, size * 1.5, size * 0.4);
                    c.quadraticCurveTo(size * 1.0, size * 0.12, size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(-size * 0.52, size * 0.5);
                    c.quadraticCurveTo(0, size * 1.45, size * 0.52, size * 0.5);
                    c.closePath(); c.fill();
                    c.beginPath(); c.arc(0, 0, size * 0.76, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    c.beginPath(); c.arc(0, 0, size * 0.3, 0, Math.PI * 2); c.fill(); break;
                }
                case 'shade': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const px = Math.cos(a) * size * 1.0;
                        const py = Math.sin(a) * size * 1.0;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        c.beginPath();
                        c.moveTo(Math.cos(a - 0.2) * size * 0.95, Math.sin(a - 0.2) * size * 0.95);
                        c.lineTo(Math.cos(a) * size * 1.48, Math.sin(a) * size * 1.48);
                        c.lineTo(Math.cos(a + 0.2) * size * 0.95, Math.sin(a + 0.2) * size * 0.95);
                        c.closePath(); c.fill();
                    }
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.arc(0, 0, size * 0.46, 0, Math.PI * 2); c.fill();
                    c.fillStyle = 'rgba(205, 175, 255, 0.95)';
                    c.beginPath(); c.arc(0, 0, size * 0.2, 0, Math.PI * 2); c.fill(); break;
                }
            }
            c.restore();
        }

                function drawSpecialEnemyBody(c, type, size, color) {
            const now = Date.now();
            const tiny = size < 10;   // 流水线小图标时简化细节
            c.save();
            if (type === 'hatcher') {
                // ── 孵化母体：脉动卵囊 + 环绕虫卵 + 底部裂缝 ──
                const pulse = 1 + Math.sin(now / 320) * 0.05;
                c.save();
                c.scale(pulse, pulse);
                c.beginPath();
                c.ellipse(0, 0, size * 1.05, size * 0.95, 0, 0, Math.PI * 2);
                c.fillStyle = color;
                c.shadowColor = color;
                c.shadowBlur = tiny ? 4 : 12;
                c.fill();
                c.shadowBlur = 0;
                c.beginPath();
                c.ellipse(0, 0, size * 0.66, size * 0.6, 0, 0, Math.PI * 2);
                c.fillStyle = 'rgba(70, 12, 45, 0.55)';
                c.fill();
                const n = tiny ? 4 : 6;
                const rot = now / 1400;
                for (let k = 0; k < n; k++) {
                    const a = rot + k * Math.PI * 2 / n;
                    const ox = Math.cos(a) * size * 0.78;
                    const oy = Math.sin(a) * size * 0.66;
                    c.beginPath();
                    c.arc(ox, oy, size * 0.18, 0, Math.PI * 2);
                    c.fillStyle = 'rgba(255, 205, 232, 0.92)';
                    c.fill();
                    if (!tiny) {
                        c.beginPath();
                        c.arc(ox - size * 0.05, oy - size * 0.05, size * 0.065, 0, Math.PI * 2);
                        c.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        c.fill();
                    }
                }
                c.strokeStyle = 'rgba(255, 220, 240, 0.85)';
                c.lineWidth = Math.max(1, size * 0.07);
                c.lineCap = 'round';
                c.beginPath();
                c.moveTo(-size * 0.42, size * 0.34);
                c.lineTo(-size * 0.18, size * 0.5);
                c.lineTo(0, size * 0.3);
                c.lineTo(size * 0.18, size * 0.5);
                c.lineTo(size * 0.42, size * 0.34);
                c.stroke();
                c.restore();
            } else if (type === 'summoner') {
                // ── 召唤者：六边形法躯 + 环绕符文 + 中心法阵 ──
                c.beginPath();
                for (let k = 0; k < 6; k++) {
                    const a = -Math.PI / 2 + k * Math.PI / 3;
                    const px = Math.cos(a) * size;
                    const py = Math.sin(a) * size;
                    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath();
                c.fillStyle = color;
                c.shadowColor = color;
                c.shadowBlur = tiny ? 4 : 12;
                c.fill();
                c.shadowBlur = 0;
                c.beginPath();
                for (let k = 0; k < 6; k++) {
                    const a = -Math.PI / 2 + k * Math.PI / 3;
                    const px = Math.cos(a) * size * 0.7;
                    const py = Math.sin(a) * size * 0.7;
                    if (k === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath();
                c.fillStyle = 'rgba(10, 42, 32, 0.55)';
                c.fill();
                const rot = now / 900;
                c.fillStyle = 'rgba(190, 255, 220, 0.95)';
                for (let k = 0; k < 3; k++) {
                    const a = rot + k * Math.PI * 2 / 3;
                    const ox = Math.cos(a) * size * 1.38;
                    const oy = Math.sin(a) * size * 1.38;
                    const ss = size * 0.16;
                    c.beginPath();
                    c.moveTo(ox + Math.cos(a) * ss, oy + Math.sin(a) * ss);
                    c.lineTo(ox + Math.cos(a + 2.4) * ss, oy + Math.sin(a + 2.4) * ss);
                    c.lineTo(ox + Math.cos(a - 2.4) * ss, oy + Math.sin(a - 2.4) * ss);
                    c.closePath();
                    c.fill();
                }
                if (!tiny) {
                    c.strokeStyle = 'rgba(190, 255, 220, 0.8)';
                    c.lineWidth = Math.max(1, size * 0.06);
                    c.beginPath();
                    c.arc(0, 0, size * 0.44, 0, Math.PI * 2);
                    c.stroke();
                }
            } else if (type === 'jammer') {
                // ── 干扰者：菱形机体 + 天线 + 扩散干扰波 ──
                const waves = tiny ? 1 : 2;
                for (let k = 0; k < waves; k++) {
                    const phase = ((now / 900) + k * 0.5) % 1;
                    const r = size * (1.1 + phase * 0.9);
                    c.beginPath();
                    c.arc(0, 0, r, 0, Math.PI * 2);
                    c.strokeStyle = `rgba(255, 150, 90, ${0.55 * (1 - phase)})`;
                    c.lineWidth = Math.max(1, size * 0.1 * (1 - phase * 0.6));
                    if (!tiny) {
                        c.setLineDash([size * 0.25, size * 0.18]);
                        c.lineDashOffset = -phase * size * 0.9;
                    }
                    c.stroke();
                    c.setLineDash([]);
                }
                c.beginPath();
                c.moveTo(0, -size * 1.05);
                c.lineTo(size * 0.92, 0);
                c.lineTo(0, size * 1.05);

                c.fillStyle = 'rgba(55, 22, 8, 0.55)';

                c.strokeStyle = color;

            const c = i % LV_COLS, r = Math.floor(i / LV_COLS);

        function levelCardAt(mx, my) {
            if (my < LEVELS_TOP || my > canvas.height) return -1;
            const totalW = LV_COLS * LV_CARD_W + (LV_COLS - 1) * LV_GAP_X;
            const startX = Math.max(340, (canvas.width - totalW) / 2 + 60);
            const lx = mx - startX;
            if (lx < 0) return -1;
            const c = Math.floor(lx / (LV_CARD_W + LV_GAP_X));
            if (c < 0 || c >= LV_COLS) return -1;
            if (lx - c * (LV_CARD_W + LV_GAP_X) > LV_CARD_W) return -1;
            const cy = my - LEVELS_TOP + scrollY;
            if (cy < 0) return -1;
            const r = Math.floor(cy / (LV_CARD_H + LV_GAP_Y));
            if (cy - r * (LV_CARD_H + LV_GAP_Y) > LV_CARD_H) return -1;
            const idx = r * LV_COLS + c;
            if (idx < 0 || idx >= LEVELS.length) return -1;
            return idx;
        }

        const levelThumbCache = new Map();

        function drawLevelThumbnail(x, y, w, h, level, idx) {
            let tc = levelThumbCache.get(idx);
            if (!tc) {
                tc = renderLevelThumbnail(w, h, level);
                levelThumbCache.set(idx, tc);
            }
            ctx.drawImage(tc, Math.round(x), Math.round(y));
            ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
        }

        function renderLevelThumbnail(w, h, level) {
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const g = cv.getContext('2d');
            g.fillStyle = '#070b12';
            g.fillRect(0, 0, w, h);

            const tRows = Math.max(1, level.map.length);
            let tCols = 1;
            for (const row of level.map) tCols = Math.max(tCols, row.length);
            const cellSize = Math.min(w / tCols, h / tRows);
            const gx = (w - tCols * cellSize) / 2;
            const gy = (h - tRows * cellSize) / 2;

            // 1. 基础地板：与游戏内 rebuildBackground 共用同一套绘制
            paintFloorBase(g, tCols, tRows, cellSize, gx, gy);

            // 2. 逐格图块：与游戏内保持完全一致
            for (let r = 0; r < tRows; r++) {
                const rowStr = level.map[r] || '';
                for (let c = 0; c < tCols; c++) {
                    const ch = rowStr[c];
                    const px = gx + c * cellSize;
                    const py = gy + r * cellSize;
                    const cx = px + cellSize / 2;
                    const cy = py + cellSize / 2;
                    g.save();
                    if (ch === '#') {
                        drawRockWall(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === 'X') {
                        drawArmorWall(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === '.') {
                        drawNoBuildFloor(g, px, py, cellSize, c, r, tileNoiseHash);
                    } else if (ch === '+') {
                        drawCrossJunction(g, px, py, cellSize);
                    } else if (ch === 'S') {
                        // 入口：亮绿圆 + 中心高光点（与游戏内绿色脉冲点对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.38, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(74, 255, 120, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.15, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(220, 255, 230, 0.95)'; g.fill();
                    } else if (ch === 'E') {
                        // 出口：发光橙色虚线圆 + 内部淡填充 + 中心亮点，更显眼
                        g.save();
                        g.shadowColor = 'rgba(255, 170, 68, 0.9)';
                        g.shadowBlur = Math.max(3, cellSize * 0.35);
                        // 内部淡橙色填充
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.34, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 170, 68, 0.30)';
                        g.fill();
                        // 粗虚线外圈
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.36, 0, Math.PI * 2);
                        g.strokeStyle = 'rgba(255, 190, 90, 1)';
                        g.lineWidth = Math.max(1.5, cellSize * 0.10);
                        const dash = Math.max(1.5, cellSize * 0.16);
                        g.setLineDash([dash, dash]);
                        g.stroke();
                        g.setLineDash([]);
                        // 中心亮点
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.12, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 232, 180, 1)';
                        g.fill();
                        g.restore();
                    } else if (ch === 'C') {
                        // 基地：红圆 + 深色内芯（与游戏内显示核心数的位置对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.4, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 85, 85, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.2, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(30, 6, 6, 0.9)'; g.fill();
                    } else {
                        // 可建造空地（空格 / 'o' / 越界字符）：中心加号标记
                        drawBuildableFloorMark(g, px, py, cellSize);
                    }
                    g.restore();
                }
            }
            return cv;
        }

        // ============================================================
        // 塔图标绘制
        // ============================================================
        function drawTowerLogo(c, type, lv, px, py, angle, color, scale) {
            color = color || '#ffffff';
            const sf = (typeof scale === 'number' && scale > 0) ? scale : 1;
            c.save();
            c.translate(px, py);
            if (sf !== 1) c.scale(sf, sf);
            if (typeof angle === 'number' && (type === 'gun' || type === 'cannon' || type === 'missile' || type === 'sniper' || type === 'railgun' || type === 'flak' || type === 'laser')) {
                c.rotate(angle + Math.PI / 2);
            }
            c.lineCap = 'round'; c.lineJoin = 'round';
            if (color === '#ffffff') { c.shadowColor = 'rgba(0, 0, 0, 0.55)'; c.shadowBlur = 3; }
            switch (type) {
                case 'gun':       drawGunLogo(c, lv, color); break;
                case 'cannon':    drawCannonLogo(c, lv, color); break;
                case 'missile':   drawMissileLogo(c, lv, color); break;
                case 'temporal':  drawSlowLogo(c, lv, color); break;
                case 'laser':     drawLaserLogo(c, lv, color); break;
                case 'shock':     drawShockLogo(c, lv, color); break;
                case 'chain':     drawChainLogo(c, lv, color); break;
                case 'sniper':    drawSniperLogo(c, lv, color); break;
                case 'amplifier': drawAmplifierLogo(c, lv, color); break;
                case 'railgun':   drawRailgunLogo(c, lv, color); break;
                case 'venom':     drawVenomLogo(c, lv, color); break;
                case 'flak':      drawFlakLogo(c, lv, color); break;
                case 'prism':     drawPrismLogo(c, lv, color); break;
                case 'emp':       drawEmpLogo(c, lv, color); break;
                case 'harvester': drawHarvesterLogo(c, lv, color); break;
                default: break;
            }
            c.restore();
        }

        function drawGunLogo(c, lv, color) {
            color = color || '#ffffff';
            const barrels = lv >= 4 ? 3 : 2;
            const bw = 2.0, gap = 2.6, bLen = 10, bodyTop = -1, bodyBot = 6;
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(-3, bodyTop); c.lineTo(3, bodyTop);
            c.lineTo(4.5, bodyBot); c.lineTo(-4.5, bodyBot); c.closePath(); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.42)';
            c.fillRect(-2.2, bodyTop + 1.8, 4.4, 0.8);
            c.fillRect(-2.8, bodyTop + 3.4, 5.6, 0.8);
            for (let i = 0; i < barrels; i++) {
                const ox = (i - (barrels - 1) / 2) * gap;
                c.fillStyle = color;
                c.fillRect(ox - bw / 2, -bLen, bw, bLen + 1);
                c.fillRect(ox - bw / 2 - 0.6, -bLen - 1.4, bw + 1.2, 1.6);
                c.fillStyle = 'rgba(0,0,0,0.38)';
                c.fillRect(ox - bw / 2 + 0.4, -bLen + 3, bw - 0.8, 0.8);
                c.fillRect(ox - bw / 2 + 0.4, -bLen + 5.4, bw - 0.8, 0.8);
            }
        }
        function drawCannonLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            const barrelTopW = 3.0 + t * 0.22, barrelBotW = 4.0 + t * 0.30;
            const bLen = 11, bodyR = 4.0 + t * 0.16;
            c.fillStyle = color;
            c.beginPath(); c.arc(0, 2.5, bodyR, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.35)';
            c.beginPath(); c.arc(0, 2.5, bodyR, 0, Math.PI); c.fill();
            c.fillStyle = color;
            c.beginPath();
            c.moveTo(-barrelTopW / 2, -bLen); c.lineTo(barrelTopW / 2, -bLen);
            c.lineTo(barrelBotW / 2, 2.5); c.lineTo(-barrelBotW / 2, 2.5); c.closePath(); c.fill();
            c.fillRect(-barrelTopW / 2 - 1, -bLen - 1, barrelTopW + 2, 2.6);
            c.fillStyle = 'rgba(0,0,0,0.65)';
            c.beginPath(); c.ellipse(0, -bLen + 0.3, barrelTopW / 2 - 0.5, 1, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(0,0,0,0.45)';
            const rings = Math.min(lv, 4);
            for (let i = 0; i < rings; i++) {
                const y = -bLen + 4 + i * 1.9;
                const w = barrelTopW + (barrelBotW - barrelTopW) * ((i + 0.5) / rings) - 0.6;
                c.fillRect(-w / 2, y, w, 0.9);
            }
            for (let i = 0; i < 3; i++) {
                const a = -Math.PI / 2 + (i - 1) * 0.65;
                c.beginPath(); c.arc(Math.cos(a) * bodyR * 0.62, 2.5 + Math.sin(a) * bodyR * 0.62, 0.7, 0, Math.PI * 2); c.fill();
            }
        }
        function drawMissileLogo(c, lv, color) {
            color = color || '#ffffff';

        function getAggregatedUpgrades() {
    // ★ 坑 1：放宽早退条件
    if (!rogueState) return [];
    if (rogueState.upgrades.length === 0 &&
        (!rogueState.synergies || rogueState.synergies.length === 0)) return [];

    const counts = new Map();
    for (const u of rogueState.upgrades) {
        if (u.id === 'freeUp' || u.id === 'coreRepair') continue;
        counts.set(u.id, (counts.get(u.id) || 0) + 1);
    }
    const result = [];
    for (const [id, count] of counts) {
        const up = ROGUE_UPGRADES.find(u => u.id === id);
        if (!up) continue;
        result.push({ ...up, count, _rord: RARITY_ORDER[up.rarity] ?? 4 });
    }

    // ★ 新增：联动卡（每张只算 1 份，因为抽卡时已去重）
    for (const s of (rogueState.synergies || [])) {
        result.push({ ...s, count: 1, _rord: RARITY_ORDER[s.rarity] ?? 4 });
    }

    result.sort((a, b) => {
        if (a._rord !== b._rord) return a._rord - b._rord;
        return b.count - a.count;
    });
    return result;
}

        function getAggregatedEnemyMods() {
            if (!rogueState || !rogueState.enemyMods) return [];
            const em = rogueState.enemyMods;
            const counts = new Map();
            for (const id of em.picks) counts.set(id, (counts.get(id) || 0) + 1);
            const out = [];
            for (const def of ROGUE_ENEMY_BOOSTS) {
                const n = counts.get(def.id);
                if (!n) continue;
                let desc = '';
                switch (def.id) {
                    case 'hp':          desc = `敌人生命 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'speed':       desc = `敌人移速 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'coreLock':    desc = `未携带核心的敌人受伤 -${Math.round((1 - Math.pow(0.8, n)) * 100)}%`; break;
                    case 'stunResist':  desc = `眩晕时长 -${100.00 - 100.00 * Math.pow(0.8, n).toFixed(2)}%`; break;
                    case 'coreDelay':   desc = `核心原地停留 ${3 * n} 秒`; break;
                    case 'dodge':       desc = `闪避概率 ${Math.round((1 - Math.pow(0.92, n)) * 100)}%`; break;
                }
                out.push({ icon: def.icon, name: def.name, color: def.color, desc, count: n });
            }
            return out;
        }

        function getAggregatedDesc(up, count) {
            switch (up.id) {
                case 'dmg':       return `全塔伤害 +${Math.round((Math.pow(1.15, count) - 1) * 100)}%`;

                case 'synBoost': {
    const cur = Math.min(SYNERGY_SCALE_MAX, 1.0 + SYNERGY_SCALE_STEP * count);
    return `联动数值再 ×${cur.toFixed(2)}（已叠加 ${count} 张）`;
}
                case 'sellPlus':  return `出售返还 +${Math.min(50, 25 * count)}%`;
                case 'crit':      return `暴击率 ${Math.round((1 - Math.pow(0.88, count)) * 100)}%（倍率 ×${((rogueState && rogueState.bonus.critDmgMul) || 2).toFixed(1)}）`;

                case 'charm':     return `魅惑率 ${Math.round((1 - Math.pow(0.97, count)) * 100)}%`;
                default: return up.desc;

        function drawRoguePanels() {
            affixPanelRect = null;
            towerUpPanelRect = null;
            enemyModPanelRect = null;
            if (!rogueState) return;
            if (canvas.width < 1000) return;

            const w = ASC_GAME_W;
            const x = canvas.width - w - 10;
            const rowH = 34, hdrH = ROGUE_PANEL_HDR_H, padB = 8;
            let y = 56;

            if (rogueState.affixes.length > 0) {
                const rows = affixCollapsed ? 0 : rogueState.affixes.length;
                const h = hdrH + rows * rowH + padB;
                drawAffixPanel(x, y, w, h);
                affixPanelRect = { x, y, w, h };
                y += h + 10;
            }

            const listA = getAggregatedUpgrades();
            const listB = getAggregatedEnemyMods();
            if (listA.length === 0 && listB.length === 0) return;

            const availH = canvas.height - y - 14;
            const fixedA = listA.length ? hdrH + padB : 0;
            const fixedB = listB.length ? hdrH + padB : 0;
            const gap = (listA.length && listB.length) ? 10 : 0;
            let budget = Math.max(0, Math.floor((availH - fixedA - fixedB - gap) / rowH));

            let rowsA = towerUpCollapsed ? 0 : listA.length;
            let rowsB = enemyModCollapsed ? 0 : listB.length;
            if (rowsA + rowsB > budget) {
                const total = rowsA + rowsB;
                rowsA = Math.floor(budget * rowsA / total);
                rowsB = budget - rowsA;
                if (rowsA > listA.length) { rowsB += rowsA - listA.length; rowsA = listA.length; }
                if (rowsB > listB.length) { rowsA += rowsB - listB.length; rowsB = listB.length; }
                if (rowsA + rowsB > budget) rowsB = Math.max(0, budget - rowsA);
            }

            if (listA.length > 0) {
                const shown = Math.min(rowsA, listA.length);
                const overflow = towerUpCollapsed ? 0 : listA.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawTowerUpgradePanel(x, y, w, h, listA, shown, overflow);
                towerUpPanelRect = { x, y, w, h };
                y += h + gap;
            }
            if (listB.length > 0) {
                const shown = Math.min(rowsB, listB.length);
                const overflow = enemyModCollapsed ? 0 : listB.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawEnemyModPanel(x, y, w, h, listB, shown, overflow);
                enemyModPanelRect = { x, y, w, h };
            }
        }

        function openDraft(kind) {
            if (!rogueState) return;
            closeBuildMenu();
            closeTowerMenu();
            hideTip();
            selectedTower = null;
            hideSellButton();

            const picked = [];

            if (kind === 'enemy') {
                const pool = ROGUE_ENEMY_BOOSTS.filter(b => !(b.once && rogueState.enemyMods.picks.includes(b.id)));
                for (let i = 0; i < 3 && pool.length > 0; i++) {
                    const idx = Math.floor(Math.random() * pool.length);
                    picked.push(pool.splice(idx, 1)[0]);
                }
            } else if (kind === 'synergy') {
                // ★ 开局联动：随机抽 3 张不重复的联动
                const ownedSyn = new Set(rogueState.synergies.map(s => s.id));
                const pool = ROGUE_SYNERGIES.filter(s => !ownedSyn.has(s.id));
                for (let i = 0; i < 3 && pool.length > 0; i++) {
                    const idx = Math.floor(Math.random() * pool.length);
                    picked.push(pool.splice(idx, 1)[0]);
                }
            } else {
                // 1) 先按概率抽联动卡（0~3 张，同一联动不重复）
                const ownedSyn = new Set(rogueState.synergies.map(s => s.id));
                const synPool = ROGUE_SYNERGIES.filter(s => !ownedSyn.has(s.id));
                const synWant = Math.min(synPool.length, rollSynergyCount());
                for (let i = 0; i < synWant; i++) {
                    const idx = Math.floor(Math.random() * synPool.length);
                    picked.push(synPool.splice(idx, 1)[0]);
                }

                // 2) 剩余槽位用普通塔强化补齐
                const pickedIds = new Set(rogueState.upgrades.map(u => u.id));
                const upPool = ROGUE_UPGRADES.filter(u => {
                    if (u.once && pickedIds.has(u.id)) return false;
                    if (u.requireCrit && !(rogueState.bonus.critChance > 0)) return false;
                    if (u.requireSynergy && (!rogueState.synergies || rogueState.synergies.length === 0)) return false;  // ★ 新增
                    return true;
                });
                while (picked.length < 3 && upPool.length > 0) {
                    const idx = Math.floor(Math.random() * upPool.length);
                    picked.push(upPool.splice(idx, 1)[0]);
                }

                // 3) 打乱顺序，避免联动卡永远排最左
                for (let i = picked.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [picked[i], picked[j]] = [picked[j], picked[i]];
                }
            }

            if (picked.length === 0) {
                draftPanel = null;
                openNextDraft();
                return;
            }
            draftPanel = { kind: kind || 'tower', choices: picked, hovered: -1, openAt: performance.now() };
        }

        function openNextDraft() {
            if (draftQueue.length === 0) {
                if (pendingAutoEnemyBoost) {
                    pendingAutoEnemyBoost = false;
                    autoApplyEnemyBoost();
                }
                return;
            }
            const kind = draftQueue.shift();
            openDraft(kind);
        }

        function getDraftCardRect(i) {
            const n = (draftPanel && draftPanel.choices) ? draftPanel.choices.length : 3;
            const cardW = 240, cardH = 280, gap = 20;
            const totalW = cardW * n + gap * Math.max(0, n - 1);
            const startX = (canvas.width - totalW) / 2;
            const panelH = 460;
            const panelY = (canvas.height - panelH) / 2;
            return { x: startX + i * (cardW + gap), y: panelY + 120, w: cardW, h: cardH };
        }

        function charmEnemy(e) {
            if (!e || e.charmed || e.hp <= 0) return;
            if (e.type === 'boss') return;
            e.charmed = true;
            e.state = 'charmed';
            e.nextC = null; e.nextR = null;
            e.slowTimer = 0; e.stunTimer = 0;
            if (e.carrying > 0) {
                const cd = getCoreDelayStacks() * 3.0;
                for (let k = 0; k < e.carrying; k++) {
                    looseCores.push({
                        x: e.x + (Math.random() - 0.5) * 8,
                        y: e.y + (Math.random() - 0.5) * 8,
                        cellC: e.cellC, cellR: e.cellR,
                        nextC: null, nextR: null,
                        dirC: 0, dirR: 0, nextDirC: 0, nextDirR: 0,
                        delay: cd + k * 0.12,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
                e.carrying = 0;
            }
            projectiles.push({
                kind: 'ring', x: e.x, y: e.y, radius: 22 * (CELL / baseCellPx),
                color: 'rgba(255, 120, 220, 0.9)', life: 0.5, maxLife: 0.5
            });
            SFX.shoot('prism');
            if (starts.some(s => s.c === e.cellC && s.r === e.cellR)) {
                const idx = enemies.indexOf(e);
                if (idx !== -1) {
                    enemies.splice(idx, 1);
                    onEnemyRemoved(e);
                }
            }
        }

        // 应用一张联动卡
function applySynergy(s) {
    if (!rogueState || !s) return;
    rogueState.synergies.push(s);
    SFX.click();
    msgDisplay.textContent = `🔗 联动激活：${s.name}（${TOWER_TYPES[s.a].name} × ${TOWER_TYPES[s.b].name}）`;
    updateUI();
}
        function applyDraftUpgrade(up) {
            if (!rogueState || !up) return;
            if (up.isSynergy) { applySynergy(up); return; } 
            rogueState.upgrades.push(up);
            up.apply(rogueState);
            if (rogueState.moneyBonus > 0) {
                money += rogueState.moneyBonus;
                rogueState.moneyBonus = 0;
            }
            if (rogueState._pendingCoreRepair) {
                rogueState._pendingCoreRepair = false;
                const alive = bases.filter(b => b.cores > 0);
                if (alive.length > 0) { alive[0].cores++; rebuildActiveBaseField(); }
                else if (bases.length > 0) { bases[0].cores = 1; rebuildActiveBaseField(); }
            }
            if (rogueState._pendingFreeUp) {
                rogueState._pendingFreeUp = false;
                const upgradable = towers.filter(t => t.level < MAX_LEVEL);
                if (upgradable.length > 0) {
                    const t = upgradable[Math.floor(Math.random() * upgradable.length)];
                    const cost = getUpgradeCostEffective(t.type, t.level) || 0;
                    t.level++; t.invested += cost;
                    SFX.upgrade();
                    msgDisplay.textContent = `免费升级：${TOWER_TYPES[t.type].name} → Lv.${t.level}`;
                }
            }
            if (rogueState._pendingKillAll) {
                rogueState._pendingKillAll = false;
                for (const e of enemies) {
                    if (e.hp > 0) { e.hp = 0; e.shield = 0; }
                }
                SFX.boom();
                msgDisplay.textContent = '☠️ 末日审判！全屏敌人被秒杀';
            }
            if (rogueState._pendingStunAll) {
                rogueState._pendingStunAll = false;
                for (const e of enemies) {
                    applyStun(e, 5);
                }
                SFX.shoot('emp');
                msgDisplay.textContent = '⏳ 时间静止！全屏敌人眩晕 5 秒';
            }
            SFX.click();
            if (!msgDisplay.textContent.startsWith('☠️') && !msgDisplay.textContent.startsWith('⏳')) {
                msgDisplay.textContent = `✦ 已选择强化：${up.name}`;
            }
            updateUI();
        }

        function pickRandomEnemyBoost() {
            if (!rogueState) return null;
            const pool = ROGUE_ENEMY_BOOSTS.filter(b => !(b.once && rogueState.enemyMods.picks.includes(b.id)));
            if (pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function autoApplyEnemyBoost() {
            const b = pickRandomEnemyBoost();
            if (!b) return;
            applyEnemyBoost(b);
        }

        function applyEnemyBoost(b) {
            if (!rogueState || !b) return;
            const em = rogueState.enemyMods;
            em.picks.push(b.id);
            switch (b.id) {
                case 'hp':        em.hpMul *= 1.20; break;
                case 'speed':     em.speedMul *= 1.20; break;
                case 'coreLock':
                    em.coreLockStacks++;
                    em.coreLock = true;
                    break;
                case 'coreDelay':
                    em.coreDelayStacks++;
                    em.coreDelay = true;
                    break;
                case 'stunResist':
                    em.stunStacks++;
                    em.stunMul = Math.pow(0.8, em.stunStacks);
                    break;
                case 'dodge':
                    em.dodgeStacks++;
                    em.dodge = 1 - Math.pow(0.92, em.dodgeStacks);
                    break;
            }
            SFX.steal();
            msgDisplay.textContent = `☠️ 怪物强化：${b.name} · ${b.desc}`;
            updateUI();
        }

        function checkRogueDraftTrigger() {
            if (!rogueState || gameOver || draftPanel || draftQueue.length > 0 || pendingAutoEnemyBoost) return;
            for (const rt of waveRuntime) {
                if (rt.cleared && !rt.draftGiven) {
                    rt.draftGiven = true;
                    const waveNum = rt.id + 1;
                    if (rt.id >= totalWaves - 1) return;

                    const isTowerWave = (waveNum % TOWER_DRAFT_INTERVAL === 0);
                    const isEnemyWave = (waveNum % ENEMY_BOOST_INTERVAL === 0);

                    if (isTowerWave) {
                        if (isEnemyWave) pendingAutoEnemyBoost = true;
                        draftQueue = ['tower'];
                        openNextDraft();
                    } else if (isEnemyWave) {
                        autoApplyEnemyBoost();
                    }
                    return;
                }
            }
        }

            const panelW = 820, panelH = 460;
            const px = (canvas.width - panelW) / 2;
            const py = (canvas.height - panelH) / 2;

            if (gameResult) return;

            const lv = currentLevel;
            const mode = MODES[currentModeKey] || MODES.story;
            let raw = 0;
            raw += s.wavesCleared * 150;
            raw += s.kills * 10;
            raw += (st.green + st.yellow) * 100;
            raw += Math.floor(money);
            raw -= st.red * 150;
            raw += (levelDifficulty(lv) + 1) * 150;
            if (!win) raw = Math.floor(raw * 0.5);
            const towerCount = Math.max(1, s.towersBuilt);
            const rogueMul = rogueState ? (MODES.rogue.scoreMul || 1) : 1;
            const ascensionMul = 1 + selectedAscension * 0.1;

        // ============================================================
        // 背景 / 墙体
        // ============================================================
        function rebuildBackground() {
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            bgCanvas = document.createElement('canvas');
            bgCanvas.width = Math.max(1, gridW);
            bgCanvas.height = Math.max(1, gridH);
            const g = bgCanvas.getContext('2d');

            // 1. 基础地板：渐变底 + 逐格噪点 + 网格线（与缩略图共用 paintFloorBase）
            paintFloorBase(g, COLS, ROWS, CELL, 0, 0);

            // 2. 可建造空地：中心加号标记（与 X 炮台墙的加号呼应，但更淡）
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (wallGrid[r][c]) continue;
                    if (noBuildGrid[r] && noBuildGrid[r][c]) continue;
                    if (bases.some(b => b.c === c && b.r === r)) continue;
                    if (starts.some(s => s.c === c && s.r === r)) continue;
                    if (exits.some(ex => ex.c === c && ex.r === r)) continue;
                    drawBuildableFloorMark(g, c * CELL, r * CELL, CELL);
                }
            }

            // 3. 禁止建造但可通行的地板（'.'）—— 原代码这里条件写错，实际从未绘制
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(noBuildGrid[r] && noBuildGrid[r][c])) continue;
                    if (straightGrid[r] && straightGrid[r][c]) continue;
                    drawNoBuildFloor(g, c * CELL, r * CELL, CELL, c, r, tileNoiseHash);
                }
            }

            // 3.5 十字路口 +：可通行、不可建造、只能直行
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(straightGrid[r] && straightGrid[r][c])) continue;
                    drawCrossJunction(g, c * CELL, r * CELL, CELL);
                }
            }

            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!wallGrid[r][c]) continue;
                    const x = c * CELL, y = r * CELL;
                    if (buildableWall[r][c]) drawArmorWall(g, x, y, CELL, c, r, tileNoiseHash);
                    else drawRockWall(g, x, y, CELL, c, r, tileNoiseHash);
                }
            }

            g.strokeStyle = 'rgba(70, 122, 180, 0.55)';
            g.lineWidth = 2;
            g.strokeRect(0.5, 0.5, gridW - 1, gridH - 1);
        }

        // 确定性噪声：让同一格在任意缩放下纹理一致
        function tileNoiseHash(x, y) {
            let h = (x | 0) * 374761393 + (y | 0) * 668265263;
            h = (h ^ (h >> 13)) * 1274126177;
            h = h ^ (h >> 16);
            return ((h >>> 0) % 10000) / 10000;
        }

        // 基础地板：渐变底 + 逐格噪点 + 网格线（游戏内与缩略图共用）
        function paintFloorBase(g, cols, rows, cell, offX, offY) {
            const gridW = cols * cell, gridH = rows * cell;

            const floorGrad = g.createLinearGradient(offX, offY, offX + gridW, offY + gridH);
            floorGrad.addColorStop(0, '#0b121c');
            floorGrad.addColorStop(0.5, '#0d1522');
            floorGrad.addColorStop(1, '#08101a');
            g.fillStyle = floorGrad;
            g.fillRect(offX, offY, gridW, gridH);

            // 小尺寸（缩略图）时省略噪点，避免糊成一片
            const detail = cell >= 10;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = offX + c * cell, y = offY + r * cell;
                    const base = tileNoiseHash(c * 7 + 1, r * 13 + 2);
                    const tone = base * 0.5 + 0.5;
                    g.fillStyle = `rgba(${Math.round(8 + tone * 6)}, ${Math.round(14 + tone * 8)}, ${Math.round(22 + tone * 10)}, 0.55)`;
                    g.fillRect(x, y, cell, cell);
                    if (!detail) continue;
                    const dotCount = 2 + Math.floor(base * 3);
                    for (let k = 0; k < dotCount; k++) {
                        const h1 = tileNoiseHash(c * 11 + k * 3, r * 17 + k * 7);
                        const h2 = tileNoiseHash(c * 23 + k * 5, r * 29 + k * 11);
                        const dx = h1 * (cell - 2) + 1;
                        const dy = h2 * (cell - 2) + 1;
                        const sz = 1 + h2 * 1.2;
                        const bright = h1 > 0.5;
                        g.fillStyle = bright
                            ? `rgba(70, 90, 120, ${0.05 + h1 * 0.06})`
                            : `rgba(0, 0, 0, ${0.15 + h2 * 0.15})`;
                        g.fillRect(x + dx, y + dy, sz, sz);
                    }
                }
            }

            if (cell >= 8) {
                g.strokeStyle = 'rgba(45, 75, 110, 0.13)';
                g.lineWidth = 1;
                for (let i = 1; i < cols; i++) {
                    g.beginPath(); g.moveTo(offX + i * cell + 0.5, offY); g.lineTo(offX + i * cell + 0.5, offY + gridH); g.stroke();
                }
                for (let i = 1; i < rows; i++) {
                    g.beginPath(); g.moveTo(offX, offY + i * cell + 0.5); g.lineTo(offX + gridW, offY + i * cell + 0.5); g.stroke();
                }
            }
        }

        // 可建造空地的中心加号标记（与 X 炮台墙的加号呼应，但更淡）
        function drawBuildableFloorMark(g, x, y, size) {
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.14);
            g.save();
            // 淡蓝色外圈
            g.strokeStyle = 'rgba(126, 200, 255, 0.20)';
            g.lineWidth = Math.max(1, size * 0.018);
            g.beginPath(); g.arc(cx, cy, sz * 1.55, 0, Math.PI * 2); g.stroke();
            // 加号
            g.strokeStyle = 'rgba(150, 210, 255, 0.42)';
            g.lineWidth = Math.max(1, size * 0.024);
            g.lineCap = 'round';
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            // 中心小点
            g.fillStyle = 'rgba(190, 230, 255, 0.60)';
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
            g.restore();
        }

        function drawCrossJunction(g, x, y, size) {
            const cx = x + size / 2, cy = y + size / 2;
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;

            // 与普通地板一致的地板底（跟 drawNoBuildFloor 同款渐变）
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#0b121c');
            grad.addColorStop(0.5, '#0d1522');
            grad.addColorStop(1, '#08101a');
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);

            // 四个方向的淡蓝色箭头
            const small = size < 18;                 // 缩略图等小尺寸下省略箭杆，只留三角头
            const armLen = size * 0.32;              // 中心到箭尖
            const headLen = size * (small ? 0.16 : 0.13);
            const headW  = size * (small ? 0.16 : 0.11);
            const shaftW = Math.max(1, size * 0.05);
            const gap    = size * 0.05;              // 中心留空

            g.save();
            g.fillStyle = 'rgba(126, 200, 255, 0.62)';
            for (let dir = 0; dir < 4; dir++) {
                const ang = dir * Math.PI / 2 - Math.PI / 2;   // 上、右、下、左
                const ux = Math.cos(ang), uy = Math.sin(ang);
                const px = -uy, py = ux;

                const tipX = cx + ux * armLen,  tipY = cy + uy * armLen;
                const baseX = cx + ux * (armLen - headLen), baseY = cy + uy * (armLen - headLen);

                // 三角箭头
                g.beginPath();
                g.moveTo(tipX, tipY);
                g.lineTo(baseX + px * headW, baseY + py * headW);
                g.lineTo(baseX - px * headW, baseY - py * headW);
                g.closePath();
                g.fill();

                // 箭杆（小尺寸省略）
                if (!small) {
                    const sx = cx + ux * gap, sy = cy + uy * gap;
                    g.beginPath();
                    g.moveTo(sx + px * shaftW / 2, sy + py * shaftW / 2);
                    g.lineTo(baseX + px * shaftW / 2, baseY + py * shaftW / 2);
                    g.lineTo(baseX - px * shaftW / 2, baseY - py * shaftW / 2);
                    g.lineTo(sx - px * shaftW / 2, sy - py * shaftW / 2);
                    g.closePath();
                    g.fill();
                }
            }
            g.restore();
        }
        // 可通行但禁止建造的地板渲染
        function drawNoBuildFloor(g, x, y, size, c, r, hash) {
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#0b121c');
            grad.addColorStop(0.5, '#0d1522');
            grad.addColorStop(1, '#08101a');
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);
        }

        function drawRockWall(g, x, y, size, c, r, hash) {
            const pad = Math.max(1, size * 0.03);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, '#3a373f'); grad.addColorStop(1, '#141215');
            g.fillStyle = grad; g.fillRect(bx, by, bw, bh);
            const rows = 2, cols = 2;
            const bh2 = bh / rows, bw2 = bw / cols;
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const h1 = hash(c * 13 + j * 7, r * 11 + i * 5);
                    const xx = bx + j * bw2, yy = by + i * bh2;
                    g.fillStyle = h1 > 0.5
                        ? `rgba(255,255,255,${0.03 + h1 * 0.05})`
                        : `rgba(0,0,0,${0.10 + (1 - h1) * 0.15})`;
                    g.fillRect(xx, yy, bw2 + 0.5, bh2 + 0.5);
                }
            }
            g.strokeStyle = 'rgba(0,0,0,0.65)';
            g.lineWidth = Math.max(1, size * 0.035);
            g.beginPath(); g.moveTo(bx, by + bh2); g.lineTo(bx + bw, by + bh2); g.stroke();
            g.beginPath(); g.moveTo(bx + bw2, by); g.lineTo(bx + bw2, by + bh); g.stroke();
            g.strokeStyle = 'rgba(150,140,130,0.35)';
            g.lineWidth = 1;
            g.beginPath(); g.moveTo(bx, by + 0.5); g.lineTo(bx + bw, by + 0.5); g.stroke();
        }

        function drawArmorWall(g, x, y, size, c, r, hash) {
            const pad = Math.max(1.5, size * 0.04);
            const radius = Math.min(Math.max(2, size * 0.08), Math.max(0.5, (size - pad * 2) / 2));
            g.save();
            g.shadowColor = 'rgba(0, 0, 0, 0.7)';
            g.shadowBlur = Math.max(2, size * 0.1);
            g.shadowOffsetY = Math.max(1, size * 0.05);
            const grad = g.createLinearGradient(x, y, x, y + size);
            grad.addColorStop(0, '#52627a');
            grad.addColorStop(0.5, '#33445c');
            grad.addColorStop(1, '#1a2534');
            g.fillStyle = grad;
            roundRect(g, x + pad, y + pad, size - pad * 2, size - pad * 2, radius);
            g.fill();
            g.restore();
            g.strokeStyle = 'rgba(150, 190, 230, 0.45)';
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(x + pad + radius, y + pad + 0.5);
            g.lineTo(x + size - pad - radius, y + pad + 0.5);
            g.moveTo(x + pad + 0.5, y + pad + radius);
            g.lineTo(x + pad + 0.5, y + size - pad - radius);
            g.stroke();
            g.strokeStyle = 'rgba(0, 0, 0, 0.65)';
            g.beginPath();
            g.moveTo(x + size - pad - 0.5, y + pad + radius);
            g.lineTo(x + size - pad - 0.5, y + size - pad - radius);
            g.moveTo(x + size - pad - radius, y + size - pad - 0.5);
            g.lineTo(x + pad + radius, y + size - pad - 0.5);
            g.stroke();
            const inset = Math.max(3, size * 0.12);
            const ix = x + inset, iy = y + inset, iw = size - inset * 2, ih = size - inset * 2;
            const innerGrad = g.createLinearGradient(ix, iy, ix, iy + ih);
            innerGrad.addColorStop(0, '#0a1220');
            innerGrad.addColorStop(0.5, '#0f1a2a');
            innerGrad.addColorStop(1, '#162438');
            g.fillStyle = innerGrad;
            roundRect(g, ix, iy, iw, ih, Math.max(1, radius - 1)); g.fill();
            g.strokeStyle = 'rgba(0, 0, 0, 0.7)'; g.lineWidth = 1;
            g.beginPath();
            g.moveTo(ix + 1, iy + 0.5); g.lineTo(ix + iw - 1, iy + 0.5);
            g.moveTo(ix + 0.5, iy + 1); g.lineTo(ix + 0.5, iy + ih - 1);
            g.stroke();
            g.strokeStyle = 'rgba(120, 160, 200, 0.25)';
            g.beginPath();
            g.moveTo(ix + iw - 1, iy + ih - 0.5); g.lineTo(ix + 1, iy + ih - 0.5);
            g.moveTo(ix + iw - 0.5, iy + ih - 1); g.lineTo(ix + iw - 0.5, iy + 1);
            g.stroke();
            if (size >= 26) {
                const ro = size * 0.15;
                const rr = Math.max(1, size * 0.035);
                const corners = [
                    [x + ro, y + ro], [x + size - ro, y + ro],
                    [x + ro, y + size - ro], [x + size - ro, y + size - ro]
                ];
                for (const [rx, ry] of corners) {
                    g.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    g.beginPath(); g.arc(rx + 0.6, ry + 0.6, rr, 0, Math.PI * 2); g.fill();
                    const rgrad = g.createRadialGradient(rx - rr * 0.3, ry - rr * 0.3, 0, rx, ry, rr);
                    rgrad.addColorStop(0, 'rgba(200, 220, 240, 0.9)');
                    rgrad.addColorStop(0.6, 'rgba(100, 130, 170, 0.85)');
                    rgrad.addColorStop(1, 'rgba(40, 55, 80, 0.9)');
                    g.fillStyle = rgrad;
                    g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.fill();
                }
            }
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.16);
            g.save();
            g.shadowColor = 'rgba(126, 200, 255, 0.6)';
            g.shadowBlur = Math.max(2, size * 0.1);
            g.strokeStyle = 'rgba(126, 200, 255, 0.65)';
            g.lineWidth = Math.max(1, size * 0.025);
            g.beginPath(); g.arc(cx, cy, sz * 1.4, 0, Math.PI * 2); g.stroke();
            g.restore();
            g.strokeStyle = 'rgba(180, 225, 255, 0.85)';
            g.lineWidth = Math.max(1, size * 0.022);
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            g.fillStyle = 'rgba(210, 240, 255, 0.95)';
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
        }

        // ============================================================
        // 出怪流水线
        // ============================================================
        function getPipelineEntries() {
            const now = gameClock, MAX_AHEAD = 40;
            const waveList = [];
            for (const rt of waveRuntime) {
                if (typeof rt.startAt !== 'number') continue;
                waveList.push({ w: rt.id, t: rt.startAt });
            }
            let t = nextWaveAt;
            for (let w = waveIndex; w < totalWaves; w++) {
                if (t - now > MAX_AHEAD) break;
                waveList.push({ w, t });
                t += getWaveInterval(currentLevel, w + 1);
            }
            waveList.sort((a, b) => a.t - b.t);
            const entries = [];
            for (const item of waveList) {
                const wave = waves[item.w];
                if (!wave || !wave.groups) continue;
                const groups = [];
                const map = new Map();
                for (const g of wave.groups) {
                    let e = map.get(g.type);
                    if (!e) { e = { type: g.type, count: 0 }; map.set(g.type, e); groups.push(e); }
                    e.count += Math.max(1, Math.round(g.count));
                }
                let inWaveSec = 0;
                for (let i = 0; i < groups.length; i++) {
                    const entry = {
                        type: groups[i].type,
                        count: groups[i].count,
                        waveId: item.w,
                        time: item.t + inWaveSec
                    };
                    entry.w = measurePipeBlockWidth(entry);
                    entries.push(entry);
                    // 下一块紧接在当前块右侧 PIPE_INWAVE_GAP 处
                    inWaveSec += (entry.w + PIPE_INWAVE_GAP) / PIPE_SPEED;
                }
            }
            return entries;
        }

        function drawTickerEnemyShape(c, type, cx, cy, size) {
            const def = ENEMY_TYPES[type];
            if (!def) return;
            const color = def.color;
            const outerAlpha = c.globalAlpha;
            c.save(); c.translate(cx, cy);
            c.fillStyle = color; c.strokeStyle = color;
            c.shadowColor = color; c.shadowBlur = 5;
            if (def.stealth) c.globalAlpha = outerAlpha * 0.78;
            if (type === 'runner' || type === 'wraith' || type === 'specter' || type === 'stalker') {
                c.beginPath(); c.moveTo(0, -size); c.lineTo(size * 0.72, 0); c.lineTo(0, size); c.lineTo(-size * 0.72, 0); c.closePath(); c.fill();
            } else if (type === 'tank' || type === 'brute' || type === 'shade') {
                c.fillRect(-size * 0.72, -size * 0.72, size * 1.44, size * 1.44);
            } else if (type === 'boss') {
                c.beginPath();
                for (let i = 0; i < 10; i++) {
                    const a = -Math.PI / 2 + i * Math.PI / 5;
                    const r = (i % 2 === 0) ? size * 1.15 : size * 0.5;
                    const px = Math.cos(a) * r, py = Math.sin(a) * r;
                    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                }
                c.closePath(); c.fill();
            } else if (def.air) {
                c.beginPath(); c.arc(0, 0, size * 0.62, 0, Math.PI * 2); c.fill();
                c.beginPath(); c.ellipse(-size * 0.92, 0, size * 0.45, size * 0.22, -0.3, 0, Math.PI * 2); c.fill();
                c.beginPath(); c.ellipse(size * 0.92, 0, size * 0.45, size * 0.22, 0.3, 0, Math.PI * 2); c.fill();
            } else if (type === 'shield') {
                c.beginPath(); c.arc(0, 0, size * 0.72, 0, Math.PI * 2); c.fill();
                c.fillStyle = 'rgba(255,255,255,0.45)';
                c.beginPath(); c.moveTo(0, -size * 0.5); c.lineTo(size * 0.5, -size * 0.12);
                c.lineTo(size * 0.5, size * 0.28); c.lineTo(0, size * 0.68);
                c.lineTo(-size * 0.5, size * 0.28); c.lineTo(-size * 0.5, -size * 0.12); c.closePath(); c.fill();
            } else if (type === 'shaman') {
                c.beginPath(); c.arc(0, 0, size * 0.72, 0, Math.PI * 2); c.fill();
                c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2;
                c.beginPath();
                c.moveTo(0, -size * 0.42); c.lineTo(0, size * 0.42);
                c.moveTo(-size * 0.42, 0); c.lineTo(size * 0.42, 0); c.stroke();
            } else if (type === 'hatcher' || type === 'summoner' || type === 'jammer') {
                drawSpecialEnemyBody(c, type, size * 1.25, color);
            } else {
                c.beginPath(); c.arc(0, 0, size * 0.7, 0, Math.PI * 2); c.fill();
            }
            c.shadowBlur = 0;
            if (def.stealth) {
                c.globalAlpha = outerAlpha;
                c.setLineDash([2, 2]); c.strokeStyle = color; c.lineWidth = 1;
                c.beginPath(); c.arc(0, 0, size * 1.2, 0, Math.PI * 2); c.stroke();
                c.setLineDash([]);
            }
            c.restore();
        }
        function measurePipeBlockWidth(entry) {
            ctx.save();
            ctx.font = 'bold 12px "Microsoft YaHei"';
            const textW = ctx.measureText('×' + entry.count).width;
            ctx.restore();
            return Math.min(PIPE_BLOCK_W, Math.max(56, 31 + textW + 10));
        }
        function drawPipeBlock(x, y, w, h, entry) {
            const def = ENEMY_TYPES[entry.type];
            const color = def ? def.color : '#888888';
            const cy = y + h / 2;
            const label = '×' + entry.count;

            ctx.fillStyle = 'rgba(16, 27, 42, 0.94)';
            roundRect(ctx, x, y, w, h, 6); ctx.fill();
            ctx.strokeStyle = color + '99'; ctx.lineWidth = 1.2; ctx.stroke();

            drawTickerEnemyShape(ctx, entry.type, x + 17, cy, 8);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px "Microsoft YaHei"';
            ctx.fillStyle = '#e8f2ff';
            ctx.fillText(label, x + 31, cy + 1);
        }

        function drawWavePipeline() {
            const barH = 46, barY = 0, leftPad = 16;
            const lineX = PIPELINE_LINE_X;
            const centerY = barY + barH / 2;
            const grad = ctx.createLinearGradient(0, barY, 0, barY + barH);
            grad.addColorStop(0, 'rgba(10, 18, 30, 0.96)');
            grad.addColorStop(1, 'rgba(6, 10, 18, 0.92)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, barY, canvas.width, barH);

            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            const waveLabel = currentModeKey === 'endless' ? `♾ ${waveIndex}` : `${waveIndex}/${totalWaves}`;
            const waveText = `🌊 ${waveLabel}`;
            const enemyText = `场上 ${enemies.length} 个敌人`;

            // 先量出两行文字的实际宽度，取大者作为左侧信息区宽度
            ctx.font = 'bold 17px "Microsoft YaHei"';
            const infoW1 = ctx.measureText(waveText).width;
            ctx.font = 'bold 10px "Microsoft YaHei"';
            const infoW2 = ctx.measureText(enemyText).width;
            const infoW = Math.max(infoW1, infoW2) + 24;   // 左右各留 12px
            const clipLeft = leftPad + infoW;

            ctx.font = 'bold 17px "Microsoft YaHei"';
            ctx.fillStyle = '#7ec8ff'; ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 10;
            ctx.fillText(waveText, leftPad, centerY - 4);
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px "Microsoft YaHei"';
            ctx.fillStyle = enemies.length > 0 ? '#ffaa66' : '#5a7fa8';
            ctx.fillText(enemyText, leftPad, centerY + 14);
            ctx.save();
            ctx.strokeStyle = 'rgba(80, 140, 200, 0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(clipLeft, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();
            ctx.restore();
            const entries = getPipelineEntries();
            const now = gameClock;
            const blockH = 30;
            const blockY = barY + (barH - blockH) / 2;
            ctx.save();
            ctx.beginPath(); ctx.rect(clipLeft, barY, canvas.width - clipLeft, barH); ctx.clip();
            if (entries.length === 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = '#5a7fa8';
                const msg = (waveIndex >= totalWaves) ? '—— 全部波次已结束 ——' : '—— 准备迎敌 ——';
                ctx.fillText(msg, (clipLeft + canvas.width) / 2, centerY);
            } else {
                const FADE_ZONE = 120;
                for (const e of entries) {
                    const bw = e.w || PIPE_BLOCK_W;
                    const x = lineX + (e.time - now) * PIPE_SPEED;
                    if (x > canvas.width + 10) continue;
                    const right = x + bw;
                    if (right < clipLeft) continue;
                    let alpha = 1;
                    if (right < clipLeft + FADE_ZONE) alpha = (right - clipLeft) / FADE_ZONE;
                    if (alpha <= 0.02) continue;
                    ctx.globalAlpha = alpha;
                    drawPipeBlock(x, blockY, bw, blockH, e);
                    ctx.globalAlpha = 1;
                }
            }
            ctx.restore();
            const fadeGrad = ctx.createLinearGradient(clipLeft, 0, clipLeft + 90, 0);
            fadeGrad.addColorStop(0, 'rgba(9, 15, 25, 0.98)');
            fadeGrad.addColorStop(1, 'rgba(9, 15, 25, 0)');
            ctx.fillStyle = fadeGrad;
            ctx.fillRect(clipLeft, barY, 90, barH);
            ctx.save();
            ctx.shadowColor = '#4affd0'; ctx.shadowBlur = 14;
            ctx.strokeStyle = 'rgba(74, 255, 208, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(lineX, barY + 5); ctx.lineTo(lineX, barY + barH - 5);
            ctx.stroke();
            ctx.fillStyle = '#4affd0';
            ctx.beginPath();
            ctx.moveTo(lineX - 5, barY + 4); ctx.lineTo(lineX + 5, barY + 4); ctx.lineTo(lineX, barY + 10);
            ctx.closePath(); ctx.fill();
            const pulse2 = 0.5 + Math.sin(Date.now() / 300) * 0.5;
            ctx.beginPath();
            ctx.arc(lineX, barY + barH - 5, 2.5 + pulse2 * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(74, 255, 208, ${0.4 + pulse2 * 0.6})`;
            ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.shadowColor = 'rgba(60, 140, 220, 0.7)'; ctx.shadowBlur = 8;
            ctx.strokeStyle = 'rgba(80, 160, 230, 0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, barY + barH - 0.5); ctx.lineTo(canvas.width, barY + barH - 0.5);
            ctx.stroke();
            ctx.restore();
        }

        function drawWaveCountdown(x, y) {
            if (screen !== 'game' || gameOver) return;
            if (waveIndex >= totalWaves) return;
            const w = 246, h = 30;
            ctx.save();
            ctx.fillStyle = 'rgba(8, 14, 24, 0.88)';
            ctx.strokeStyle = 'rgba(58, 106, 154, 0.9)';
            ctx.lineWidth = 1.2;
            roundRect(ctx, x, y, w, h, 8);
            ctx.fill(); ctx.stroke();
            ctx.textBaseline = 'middle';

            if (!waveCountdownStarted) {                     // ← 新增分支
                ctx.font = 'bold 15px "Microsoft YaHei"';
                ctx.textAlign = 'left'; ctx.fillStyle = '#7ec8ff';
                ctx.fillText('下一波', x + 12, y + h / 2 + 1);
                ctx.textAlign = 'right'; ctx.fillStyle = '#ffd966';
                ctx.fillText('建塔后开始', x + w - 12, y + h / 2 + 1);
                ctx.restore();
                return;
            }
            if (paused) {
                ctx.font = 'bold 15px "Microsoft YaHei"';
                ctx.textAlign = 'left'; ctx.fillStyle = '#7ec8ff';
                ctx.fillText('战斗', x + 12, y + h / 2 + 1);
                ctx.textAlign = 'right'; ctx.fillStyle = '#ff8866';
                ctx.fillText('⏸ 已暂停', x + w - 12, y + h / 2 + 1);

            }
            const t = Math.max(0, nextWaveAt - gameClock);
            ctx.font = 'bold 15px "Microsoft YaHei"';
            ctx.textAlign = 'left'; ctx.fillStyle = '#7ec8ff';
            ctx.fillText('下一波', x + 12, y + h / 2 + 1);
            ctx.textAlign = 'right';

                        const d = Math.hypot(e.x - towerPx, e.y - towerPy);
                        if (d > rangePx) continue;
                        if (!enemyVisibleFromTower(e, t, d)) continue;
                        damageEnemy(e, st.damage, t);
                        if (isMax && Math.random() < 0.2) applyStun(e, 0.1 * (1 + (syn ? (syn.stun || 0) : 0)));
                        if (syn && syn.stun > 0) applyStun(e, 0.4 * syn.stun);
                    }
                    projectiles.push({
                        kind: 'shockwave', x: towerPx, y: towerPy, radius: rangePx,
                        color: 'rgba(255, 204, 0, 0.9)', life: 0.35, maxLife: 0.35
                    });
                    SFX.shoot('shock');
                    t.cooldown = actualCooldown;
                } else if (t.type === 'gun' && isMax) {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, 5);
                    for (const o of picked) {
                        const e = o.e;
                        damageEnemy(e, st.damage, t);
                        projectiles.push({
                            kind: 'beam', fromX: towerPx, fromY: towerPy,
                            toX: e.x, toY: e.y,
                            color: '#4a9eff', width: 2, life: 0.08, maxLife: 0.08
                        });
                    }
                    SFX.shoot('gun');
                    t.cooldown = actualCooldown;
                } else {
                    let dmgToTarget = st.damage;
                    if (t.type === 'flak' && isMax && Math.random() < 0.25) dmgToTarget *= 3;
                    damageEnemy(target, dmgToTarget, t);
                    if (t.type === 'cannon') {
                        if (isMax) applyStun(target, 0.25 * (1 + (syn ? (syn.stun || 0) : 0)));
                        else if (syn && syn.stun > 0) applyStun(target, 0.4 * syn.stun);
                    }
                    let splashRVis = 0;
                    if (typeDef.splash || enhancementMod(t.type, 'splashAdd')) {
                        const enhSplashAdd = enhancementMod(t.type, 'splashAdd') || 0;
                        let splashR = ((typeDef.splash || 0) + enhSplashAdd) * CELL * (1 + (syn ? (syn.splash || 0) : 0));
                        let ratio = typeDef.splash ? (typeDef.splashRatio || 0.5) : (enhancementMod(t.type, 'splashRatio') || 0.6);
                        if (t.type === 'missile' && isMax) { splashR *= 2; ratio = 1.0; }
                        splashRVis = splashR;
                        for (const e of enemies) {
                            if (e === target || e.hp <= 0) continue;
                            const d = Math.hypot(e.x - target.x, e.y - target.y);
                            if (d > splashR) continue;
                            if (ENEMY_TYPES[e.type].stealth) {
                                const dt2 = Math.hypot(e.x - towerPx, e.y - towerPy);
                                if (!enemyVisibleFromTower(e, t, dt2)) continue;
                            }
                            damageEnemy(e, st.damage * ratio, t);
                        }
                    }
                    const colors = { gun: '#4a9eff', cannon: '#ff8c42', missile: '#c44aff', flak: '#4ad8ff' };
                    const widths = { gun: 2, cannon: 5, missile: 3, flak: 1.6 };
                    const beamLife = { gun: 0.08, cannon: 0.18, missile: 0.14, flak: 0.06 };
                    // ★ 增强「分裂箭」：有几率把这一发额外打向别的目标
                    const splitN = rollSplitShot(t);
                    if (splitN > 0) {
                        const extras = pickSplitTargets(t, towerPx, towerPy, rangePx, target, splitN);
                        const splitDmg = st.damage * (enhancementMod(t.type, 'splitRatio') || 0.75);
                        for (const se of extras) {
                            damageEnemy(se, splitDmg, t);
                            projectiles.push({
                                kind: 'beam', fromX: towerPx, fromY: towerPy,
                                toX: se.x, toY: se.y,
                                color: colors[t.type] || '#ffff00',
                                width: widths[t.type] || 2,
                                life: beamLife[t.type] || 0.1, maxLife: beamLife[t.type] || 0.1
                            });
                        }
                        if (extras.length) SFX.shoot(t.type);
                    }
                    projectiles.push({
                        kind: 'beam', fromX: towerPx, fromY: towerPy,
                        toX: target.x, toY: target.y,
                        color: colors[t.type] || '#ffff00',
                        width: widths[t.type] || 2,
                        life: beamLife[t.type] || 0.1,
                        maxLife: beamLife[t.type] || 0.1
                    });
                    if (t.type === 'cannon' || t.type === 'missile' || t.type === 'flak') {
                        projectiles.push({
                            kind: 'boom', x: target.x, y: target.y,
                            radius: splashRVis > 0 ? splashRVis * 0.85
                                : (t.type === 'missile' && isMax ? typeDef.splash * 2 : (typeDef.splash || typeDef.boom || 0.6)) * CELL * 0.85,
                            color: t.type === 'cannon' ? '#ffaa44' : (t.type === 'flak' ? '#4ad8ff' : '#ddaaff'),
                            life: 0.25, maxLife: 0.25
                        });
                        SFX.boom();
                    }
                    SFX.shoot(t.type);
                    t.cooldown = actualCooldown;
                }
            }
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                
                if (p.kind === 'missile') {
                    p.life -= dt;
                    
                    if (p.life <= 0) {
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    }
                    
                    if (p.target && p.target.hp > 0 && enemies.includes(p.target)) {
                        p.tx = p.target.x;
                        p.ty = p.target.y;
                    }
                    
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    const dist = Math.hypot(dx, dy);
                    const step = p.speed * dt;
                    
                    if (dist <= step) {
                        p.x = p.tx; p.y = p.ty;
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    } else {
                        p.x += (dx / dist) * step;
                        p.y += (dy / dist) * step;
                        p.angle = Math.atan2(dy, dx);
                    }
                    continue;
                }

                p.life -= dt;
                if (p.life <= 0) projectiles.splice(i, 1);
            }
        }

        // ============================================================
        // 主循环
        // ============================================================
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let rawDt = (timestamp - lastTime) / 1000;
            rawDt = Math.min(rawDt, 0.05);
            const dt = rawDt * (screen === 'game' && !paused && !draftPanel ? speedMultiplier : 1);
            lastTime = timestamp;

            // 进阶难度按住连续调整
            if (ascHoldDir !== 0) {
                if (screen !== 'levels' || pendingLevel >= 0) {
                    ascHoldDir = 0;
                } else {
                    ascHoldTimer += rawDt;
                    const th = ascHoldStarted ? 0.06 : 0.30;
                    if (ascHoldTimer >= th) {
                        ascHoldTimer = 0;
                        ascHoldStarted = true;
                        if (ascHoldDir > 0) selectedAscension = Math.min(20, selectedAscension + 1);
                        else selectedAscension = Math.max(0, selectedAscension - 1);
                    }
                }
            }

            if (screen === 'game' && !paused && !gameOver && !draftPanel && waveCountdownStarted) {
                playTime += rawDt;
                updateTimeDisplay();
            }
            if (screen === 'game' && !draftPanel) updateEdgePan(rawDt);
            if (gameOver && buildMenu) closeBuildMenu();
            if (gameOver && towerMenu) closeTowerMenu();
            if (screen === 'game' && !gameOver) { refreshAurasIfDirty(); }
            if (screen === 'game' && !gameOver && !paused && !draftPanel) {
                arrowAnimTime += dt;
                updateSpawn(dt);
                updateEnemies(dt);
                updateLooseCores(dt);
                updateCorePickups(dt);
                if (!gameOver) processPendingBuilds();
                if (!gameOver) updateAutoUpgrade();
                if (!gameOver) updateTowers(dt);
                cleanupDeadEnemies();
                updateProjectiles(dt);
                if (!gameOver && rogueState) checkRogueDraftTrigger();
            } else if (screen === 'game') {
                if (!paused) updateProjectiles(dt);
            }
            // 独立于战斗更新阶段运行：允许 AI 在敌人存在或 Roguelike 选卡暂停时继续决策。
            if (screen === 'game' && !gameOver && aiAutoMode && !paused) {
    try {
        aiUpdateAuto(rawDt);
    } catch (err) {
        console.error('AI 托管异常:', err);
        const detail = err && err.message ? err.message : String(err || '未知错误');
        aiSetStatus(`AI 托管遇到异常：${detail}`);
    }
}
            // 选中的敌人信息面板定期刷新（敌人移动/状态变化时）
            if (screen === 'game' && selectedEnemy && !draftPanel && !gameResult) {
                if (selectedEnemy.hp <= 0 || enemies.indexOf(selectedEnemy) === -1) {
                    selectedEnemy = null;
                    hideTip();
                } else {
                    const now = performance.now();
                    if (now - lastEnemyTipUpdate > 120) {
                        lastEnemyTipUpdate = now;
                        const insideCanvas = mouse.inside
                            && mouse.x >= 0 && mouse.x <= canvas.width
                            && mouse.y >= 0 && mouse.y <= canvas.height;
                        if (insideCanvas) {
                            const rect = canvas.getBoundingClientRect();
                            const scaleX = rect.width ? canvas.width / rect.width : 1;
                            const scaleY = rect.height ? canvas.height / rect.height : 1;
                            const cx = rect.left + mouse.x / scaleX;
                            const cy = rect.top + mouse.y / scaleY;
                            showTipHTML(cx, cy, buildEnemyInfoHTML(selectedEnemy));
                        }
                    }
                }
            }

            // 先排下一帧再绘制：即使某帧绘制抛异常，主循环也不会死掉（否则界面会整屏冻住）
            requestAnimationFrame(gameLoop);
            try {
                draw();
            } catch (err) {
                const now = performance.now();
                if (!window.__lastDrawErrAt || now - window.__lastDrawErrAt > 3000) {
                    window.__lastDrawErrAt = now;
                    console.error('绘制异常：', err);
                }
            }
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }
        function getGridFromMouse(e) {
            const pos = getCanvasCoords(e);
            const col = Math.floor((pos.x - mapOffX) / CELL);
            const row = Math.floor((pos.y - mapOffY) / CELL);
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;

        // ============================================================
        // 事件
        // ============================================================
        canvas.addEventListener('mousemove', (e) => {

        window.addEventListener('mousemove', (e) => {

        canvas.addEventListener('wheel', (e) => {
            if (draftPanel) { e.preventDefault(); return; }

                e.preventDefault();
                // 行/页滚动模式统一换算成像素：不同设备一格滚轮可能是 3 行而不是 100px
                const unit = e.deltaMode === 1 ? 18 : (e.deltaMode === 2 ? canvas.height : 1);
                const dy = e.deltaY * unit;

                    const viewH = canvas.height - LEVELS_TOP - 14;

                    maxScroll = Math.max(0, contentH - viewH + 16);
                }
                scrollY = Math.max(0, Math.min(maxScroll, scrollY + dy));
                return;
            }
            if (screen === 'game') {
                e.preventDefault();
                const pos = getCanvasCoords(e);
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                setGameZoom(zoom * factor, pos.x, pos.y);
            }
        }, { passive: false });

        // 按住进阶难度箭头快速调整
        canvas.addEventListener('mousedown', (e) => {
            if (screen !== 'levels' || pendingLevel >= 0) return;
            if (e.button !== 0) return;
            const pos = getCanvasCoords(e);
            const mx = pos.x, my = pos.y;
            if (hitRect(mx, my, getAscArrowRect('up'))) {
                ascHoldDir = 1; ascHoldTimer = 0; ascHoldStarted = false;
                selectedAscension = Math.min(20, selectedAscension + 1);
                SFX.click();
                e.preventDefault();
            } else if (hitRect(mx, my, getAscArrowRect('down'))) {
                ascHoldDir = -1; ascHoldTimer = 0; ascHoldStarted = false;
                selectedAscension = Math.max(0, selectedAscension - 1);
                SFX.click();
                e.preventDefault();
            }
        });
        window.addEventListener('mouseup', () => { ascHoldDir = 0; });

        canvas.addEventListener('click', (e) => {
            const pos = getCanvasCoords(e);
            const mx = pos.x, my = pos.y;
            if (draftPanel) {
                if (draftPanel.hovered >= 0) {
                    const up = draftPanel.choices[draftPanel.hovered];
                    const kind = draftPanel.kind;
                    draftPanel = null;
                    if (kind === 'enemy') applyEnemyBoost(up);
                    else applyDraftUpgrade(up);
                    openNextDraft();
                }
                return;
            }
            if (screen === 'game' && gameResult) {
                if (gameResult.showEndless && hitRect(mx, my, getResultEndlessBtnRect())) {
                    SFX.click();
                    gameResult = null;
                    resultBtnHover = false; endlessBtnHover = false;
                    continueToEndless();
                    return;
                }
                if (hitRect(mx, my, getResultBtnRect())) {
                    SFX.click();
                    gameResult = null;
                    resultBtnHover = false; endlessBtnHover = false;
                    setScreen('levels');
                }
                return;
            }
            if (screen === 'menu') {
                for (let i = 0; i < MAIN_BTN_COUNT; i++) {
                    if (hitRect(mx, my, getMainBtnRect(i))) {
                        SFX.click();
                        if (i === 0) setScreen('levels');
                        else if (i === 1) setScreen('intro');
                        else if (i === 2) setScreen('bestiary');
                        else if (i === 3) setScreen('towerdex');
                        else if (i === 4) { selectedEnhTower = Math.max(0, enhTowerList().indexOf('gun')); setScreen('enhance'); }
                        else { statsTab = 'overview'; setScreen('stats'); }
                        return;
                    }
                }
                return;
            }
            if (screen === 'enhance') {
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); return; }
                const tl = enhTowerList();
                for (let i = 0; i < tl.length; i++) {
                    if (hitRect(mx, my, getEnhTowerChipRect(i))) {
                        SFX.click(); selectedEnhTower = i; hoveredEnhCard = -1;
                        return;
                    }
                }
                const type = tl[selectedEnhTower];
                if (!type) return;
                for (let i = 0; i < ENHANCEMENT_COUNT_PER_TOWER; i++) {
                    if (!hitRect(mx, my, getEnhCardRect(i))) continue;
                    if (!enhancementIsUnlocked(type, i)) {
                        SFX.click();
                        enhScreenNotice = '🔒 该增强尚未解锁：每关每模式首次金牌随机解锁一个';
                        enhScreenNoticeAt = Date.now();
                        return;
                    }
                    SFX.click();
                    if (enhancementSelectedIndex(type) === i) {
                        selectTowerEnhancement(type, ENHANCEMENT_NONE);
                        enhScreenNotice = `已关闭「${(TOWER_TYPES[type] || {}).name || type}」的增强，恢复原始性能`;
                    } else {
                        selectTowerEnhancement(type, i);
                        enhScreenNotice = `已启用：${(TOWER_TYPES[type] || {}).name || type} · ${TOWER_ENHANCEMENTS[type][i].name}`;
                    }
                    enhScreenNoticeAt = Date.now();
                    return;
                }
                return;
            }
            if (screen === 'stats') {
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); return; }
                for (let i = 0; i < GAME_STATS_TAB_LIST.length; i++) {
                    if (hitRect(mx, my, getStatsTabRect(i))) {
                        SFX.click(); statsTab = GAME_STATS_TAB_LIST[i].id; scrollY = 0; return;
                    }
                }
                return;
            }
            if (screen === 'bestiary' || screen === 'towerdex' || screen === 'intro') {
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); }
                return;
            }
            if (screen === 'levels') {
                if (pendingLevel >= 0) {
                    if (levelHasSeparateExit(LEVELS[pendingLevel]) && hitRect(mx, my, getReverseToggleRect())) {
                        SFX.click();
                        pendingReverse = !pendingReverse;
                        return;
                    }
                    if (hitRect(mx, my, getChaosToggleRect())) {
                        SFX.click();
                        pendingChaos = !pendingChaos;
                        return;
                    }
                    if (hitRect(mx, my, getRogueToggleRect())) {
                        SFX.click();
                        pendingRogue = !pendingRogue;
                        return;
                    }
                    for (let i = 0; i < MODE_KEYS_ACTIVE.length; i++) {
                        if (hitRect(mx, my, getModeRect(i))) {
                            SFX.click();
                            const lvIdx = pendingLevel, rev = pendingReverse, rog = pendingRogue, cha = pendingChaos;
                            pendingLevel = -1; pendingReverse = false; pendingRogue = false; pendingChaos = false;
                            hoveredMode = -1; hoveredReverse = false; hoveredRogue = false; hoveredChaos = false;
                            loadLevel(lvIdx, MODE_KEYS_ACTIVE[i], rev, rog, undefined, undefined, cha);
                            return;
                        }
                    }
                    const L = getModePanelLayout();
                    if (mx < L.x || mx > L.x + L.w || my < L.y || my > L.y + L.h) {
                        pendingLevel = -1; pendingReverse = false; pendingRogue = false; pendingChaos = false;
                        hoveredMode = -1; hoveredReverse = false; hoveredRogue = false; hoveredChaos = false;
                    }
                    return;
                }
                if (hitRect(mx, my, RANDOM_BTN)) { SFX.click(); startRandomLevel(); return; }
                if (hitRect(mx, my, BACK_BTN)) { SFX.click(); setScreen('menu'); return; }

                const idx = levelCardAt(mx, my);
                if (idx >= 0) {
                    SFX.click();
                    pendingLevel = idx; pendingReverse = false; pendingRogue = false; pendingChaos = false;
                    hoveredMode = -1; hoveredReverse = false; hoveredRogue = false; hoveredChaos = false;
                }
                return;
            }
            if (gameOver) return;

            // 全局自动升级开关
            if (hitRect(mx, my, getAutoUpgradeBtnRect())) {
                toggleGlobalAutoUpgrade();
                return;
            }

            // 进阶难度面板：点击标题栏折叠/展开
            if (ascGamePanelRect && hitRect(mx, my, ascGamePanelRect)) {
                if (my <= ascGamePanelRect.y + ASC_GAME_HDR_H) {
                    ascGameCollapsed = !ascGameCollapsed;
                    SFX.click();
                }
                return;
            }

            // Roguelike 面板：点击标题栏折叠/展开
            if (affixPanelRect && hitRect(mx, my, affixPanelRect)) {
                if (my <= affixPanelRect.y + ROGUE_PANEL_HDR_H) {
                    affixCollapsed = !affixCollapsed;
                    SFX.click();
                }
                return;
            }
            if (towerUpPanelRect && hitRect(mx, my, towerUpPanelRect)) {
                if (my <= towerUpPanelRect.y + ROGUE_PANEL_HDR_H) {
                    towerUpCollapsed = !towerUpCollapsed;
                    SFX.click();
                }
                return;
            }
            if (enemyModPanelRect && hitRect(mx, my, enemyModPanelRect)) {
                if (my <= enemyModPanelRect.y + ROGUE_PANEL_HDR_H) {
                    enemyModCollapsed = !enemyModCollapsed;
                    SFX.click();
                }
                return;
            }

            const clickedEnemy = getEnemyAt(mx, my);
            if (clickedEnemy) {
                SFX.click();
                closeTowerMenu();
                closeBuildMenu();
                selectedTower = null;
                hideSellButton();
                selectedEnemy = clickedEnemy;
                showTipHTML(e.clientX, e.clientY, buildEnemyInfoHTML(clickedEnemy));
                return;
            }
            selectedEnemy = null;

            if (towerMenu) {
                const menu = towerMenu;
                const t = towers.find(tt => tt.col === menu.col && tt.row === menu.row);
                if (t && hitRect(mx, my, getTowerMenuCheckRect())) {
                    
                    SFX.click();
                    t.autoUpgrade = !t.autoUpgrade;
                    msgDisplay.textContent = t.autoUpgrade
                        ? `${TOWER_TYPES[t.type].name} 开启自动升级`
                        : `${TOWER_TYPES[t.type].name} 关闭自动升级`;
                    return;
                }
                if (t && hitRect(mx, my, getTowerMenuSellRect())) { sellTower(t); closeTowerMenu(); return; }
                if (hitRect(mx, my, menu)) return;
                closeTowerMenu();
                return;
            }
            if (buildMenu) {
                const hit = hitBuildItem(mx, my);
                if (hit >= 0) { tryBuild(buildMenu.col, buildMenu.row, BUILD_MENU_ORDER[hit]); return; }
                closeBuildMenu();
            }
            const grid = getGridFromMouse(e);
            if (!grid) return;
            const col = grid.col, row = grid.row;
            const pendingIdx = pendingBuilds.findIndex(o => o.col === col && o.row === row);
            if (pendingIdx !== -1) {
                SFX.click();
                const o = pendingBuilds[pendingIdx];
                pendingBuilds.splice(pendingIdx, 1);
                msgDisplay.textContent = `已取消预定建造 ${TOWER_TYPES[o.type].name}`;
                return;
            }
            const existingTower = towers.find(t => t.col === col && t.row === row);
            if (existingTower) {
                if (selectedTower === existingTower) {
                    
                    if (existingTower.level >= MAX_LEVEL) { msgDisplay.textContent = `${TOWER_TYPES[existingTower.type].name} 已满级 (Lv.${MAX_LEVEL})`; return; }
                    const upgradeCost = getUpgradeCostEffective(existingTower.type, existingTower.level, existingTower.col, existingTower.row);
                    if (upgradeCost !== null && money >= upgradeCost) {
                        const _fromLv = existingTower.level;
                        money -= upgradeCost;
                        existingTower.level++;
                        existingTower.invested += upgradeCost;
                        recordUpgrade(existingTower, _fromLv, upgradeCost);
                        if (ascensionState && ascensionState.ammo) existingTower.ammo = 50;
                        updateUI();
                        updateSellButton();
                        msgDisplay.textContent = `升级到 Lv.${existingTower.level}`;
                        SFX.upgrade();
                    } else { msgDisplay.textContent = `资金不足，升级需要 ${upgradeCost}`; SFX.error(); }
                } else {
                    SFX.click();
                    selectedTower = existingTower;
                    updateSellButton();
                    msgDisplay.textContent = `${TOWER_TYPES[existingTower.type].name} Lv.${existingTower.level} · 再点一次升级 · 右键打开菜单`;
                }
                return;
            }
            if (!canBuildAt(col, row)) {
                SFX.error();
                selectedTower = null;
                hideSellButton();
                if (noBuildGrid[row] && noBuildGrid[row][col]) msgDisplay.textContent = '此处为禁止建造区域';
                else if (wallGrid[row] && wallGrid[row][col] && !buildableWall[row][col]) msgDisplay.textContent = '岩壁无法建造';
                else if (bases.some(b => b.c === col && b.r === row)) msgDisplay.textContent = '基地位置无法建造';
                else if (exits.some(x => x.c === col && x.r === row)) msgDisplay.textContent = '出口位置无法建造';
                else msgDisplay.textContent = '此处无法建造（会阻断敌军通路）';
                return;
            }
            SFX.click();
            selectedTower = null;
            hideSellButton();
            openBuildMenu(col, row);
            msgDisplay.textContent = '选择塔类型 · 左键建造 · 右键取消';
        });

        function togglePause() {
            if (screen !== 'game' || gameOver || draftPanel) return;
            SFX.click();
            paused = !paused;
            pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
            pauseBtn.classList.toggle('active', paused);
            msgDisplay.textContent = paused ? '⏸ 已暂停 · 可继续建塔/升级' : '继续战斗';
        }
        function callNextWave() {
    if (screen !== 'game' || gameOver || draftPanel) return;
    if (!waveCountdownStarted) {
        msgDisplay.textContent = '⚠ 先建造一座防御塔，倒计时才会开始';
        SFX.error();
        return;
    }
    if (waveIndex >= totalWaves) {
        msgDisplay.textContent = '⚠ 已经没有更多波次了';
        SFX.error();
        return;
    }
    if (gameClock >= nextWaveAt) return;   // 这一波已经在刷新了
    nextWaveAt = gameClock;                // 把下一波的到来时间拉到当前时刻
    SFX.click();
    const totalLabel = (currentModeKey === 'endless') ? '∞' : totalWaves;
    msgDisplay.textContent = `⚡ 提前召唤！第 ${Math.min(waveIndex + 1, totalWaves)}/${totalLabel} 波即将来袭`;
}

nextWaveBtn.addEventListener('click', callNextWave);

        sellBtn.addEventListener('click', () => { SFX.click(); if (!selectedTower) return; sellTower(selectedTower); });
        pauseBtn.addEventListener('click', togglePause);
        // 仅保留 1x 与 3x 两档；任何旧存档中的 2x 都会被归一化为 1x。
        function setGameSpeed(multiplier) {
            speedMultiplier = Number(multiplier) >= 3 ? 3 : 1;
            speedBtn.textContent = `⏩ ${speedMultiplier}x`;
            speedBtn.title = '点击或按 F 切换 1x / 3x';
        }
        function toggleGameSpeed() {
            setGameSpeed(speedMultiplier === 1 ? 3 : 1);
            SFX.click();
        }
        speedBtn.addEventListener('click', toggleGameSpeed);
        rewindBtn.addEventListener('click', () => {
            if (screen !== 'game' || !currentLevel) return;
            rewindWaves(REWIND_BACK);
        });

        window.addEventListener('scroll', hideTip, true);
        window.addEventListener('resize', hideTip);

        document.getElementById('resetBtn').addEventListener('click', () => {
            SFX.click();
            GAME_STATS.recordRestart();
            const kept = (rogueState && rogueState.affixes && rogueState.affixes.length)
                ? rogueState.affixes.slice() : null;
            loadLevel(levelIndex, currentModeKey, routeReverse, rogueEnabled, kept, true, chaosEnabled);
        });
        document.getElementById('saveBtn').addEventListener('click', saveGame);
        document.getElementById('loadBtn').addEventListener('click', loadGame);
        document.getElementById('menuBtn').addEventListener('click', () => {
            SFX.click();
            // 生涯统计：关卡内点「关卡选择」返回计一次
            if (screen === 'game') GAME_STATS.recordLevelSelect();
            setScreen('levels');
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (draftPanel) return;
            if (screen !== 'game') return;
            if (selectedEnemy) { selectedEnemy = null; hideTip(); }
            const cpos = getCanvasCoords(e);
            if (ascGamePanelRect && hitRect(cpos.x, cpos.y, ascGamePanelRect)) return;
            if (buildMenu) { SFX.click(); closeBuildMenu(); msgDisplay.textContent = '已取消建造'; return; }
            if (!gameOver) {
                const grid = getGridFromMouse(e);
                if (grid) {
                    const pIdx = pendingBuilds.findIndex(o => o.col === grid.col && o.row === grid.row);
                    if (pIdx !== -1) {
                        SFX.click();
                        const o = pendingBuilds[pIdx];
                        pendingBuilds.splice(pIdx, 1);
                        msgDisplay.textContent = `已取消预定建造 ${TOWER_TYPES[o.type].name}`;
                        return;
                    }
                    const t = towers.find(tt => tt.col === grid.col && tt.row === grid.row);
                    if (t) {
                        SFX.click();
                        selectedTower = t;
                        updateSellButton();
                        openTowerMenu(grid.col, grid.row);
                        msgDisplay.textContent = `${TOWER_TYPES[t.type].name} · 可开关自动升级或出售`;
                        return;
                    }
                }
            }
            closeTowerMenu();
            selectedTower = null;
            hideSellButton();
        });

        const soundBtn = document.getElementById('soundBtn');
        function updateSoundBtn(on) {
            soundBtn.textContent = on ? '🔊 音效' : '🔇 静音';
            soundBtn.classList.toggle('off', !on);
        }
        soundBtn.addEventListener('click', () => {
            const on = SFX.toggle();
            updateSoundBtn(on);
            if (on) SFX.click();
        });
        updateSoundBtn(SFX.isOn());

        function unlockAudio() {
            SFX.unlock();
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown', unlockAudio);

        window.addEventListener('keydown', (e) => {
            const target = e.target;
            const isTypingTarget = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName || ''));
            const hasModifier = e.ctrlKey || e.altKey || e.metaKey;

            // 空格：恢复为暂停/继续；长按不重复切换，也不干扰文本输入。
            if (e.code === 'Space' && screen === 'game' && !isTypingTarget && !hasModifier) {
                e.preventDefault();
                if (!e.repeat) {
                    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                    togglePause();
                }
            }
            if ((e.key === 'm' || e.key === 'M') && !isTypingTarget && !hasModifier) {
                const on = SFX.toggle();
                updateSoundBtn(on);
                if (on) SFX.click();
            }
            // D：提前召唤下一波，与“下一波”按钮执行完全相同的逻辑。
            if ((e.code === 'KeyD' || e.key === 'd' || e.key === 'D') && !e.repeat && !isTypingTarget && !hasModifier && screen === 'game') {
                e.preventDefault();
                callNextWave();
            }
            // F：在正常速度与 3 倍速之间切换；输入文本时不抢占用户按键。
            if ((e.code === 'KeyF' || e.key === 'f' || e.key === 'F') && !e.repeat && !hasModifier && !isTypingTarget && screen === 'game') {
                e.preventDefault();
                toggleGameSpeed();
            }
            // Backspace：回档到 3 波之前（战斗中可用，退格键不再触发浏览器返回上一页）
            if ((e.code === 'Backspace' || e.key === 'Backspace') && !isTypingTarget && !hasModifier) {
                e.preventDefault();
                if (!e.repeat && screen === 'game') rewindWaves(REWIND_BACK);
            }
        });
        initEndlessUnlock();
        refreshSaveInfo();
        setScreen('menu');
        requestAnimationFrame(gameLoop);
    })();
</script>

</body>
</html>

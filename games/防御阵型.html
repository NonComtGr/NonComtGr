        // 按像素宽度拆分模式简介，避免长文本越过卡片边框。
        function wrapModeDescription(text, maxWidth) {
            const chars = Array.from(String(text || ''));
            const lines = [];
            let line = '';
            for (const ch of chars) {
                const candidate = line + ch;
                if (line && ctx.measureText(candidate).width > maxWidth) {
                    lines.push(line);
                    line = ch;
                } else {
                    line = candidate;
                }
            }
            if (line) lines.push(line);
            if (lines.length > 2) {
                lines.length = 2;
                let last = lines[1];
                while (last && ctx.measureText(last + '…').width > maxWidth) {
                    last = Array.from(last).slice(0, -1).join('');
                }
                lines[1] = last + '…';
            }
            return lines;
        }

        // 奖牌要求预览：门槛与结算判定同源，并给出各档牌需要的核心数与分数
        function getModeMedalPreview(levelIdx, modeKey) {
            const lv = LEVELS[levelIdx];
            if (!lv) return null;
            const mode = MODES[modeKey] || MODES.story;
            const normalWaves = Math.max(20, storyWaveCount(levelIdx));
            const waveCount = (mode.waveMode === 'grind') ? 99 : normalWaves;
            const t = getModeMedalThresholds(
                lv, modeKey, selectedAscension || 0, !!pendingRogue, waveCount, levelIdx, pendingChaos
            );
            const fullCores = Math.max(1, Number(mode.coreHp) || 20);
            return {
                copper: 100,            // 铜牌基准分
                copperCores: 1,         // 铜牌：允许丢核，只要还有 1 枚核心
                silver: t.silver,
                gold: t.gold,
                fullCores               // 银牌 / 金牌：核心必须全数保留
            };
        }

        // 每种模式右侧的矩形框：列出铜 / 银 / 金三档牌所需的核数与分数
        function drawModeMedalBox(r, key, hov) {
            const info = getModeMedalPreview(pendingLevel, key);
            if (!info) return;
            ctx.save();
            ctx.fillStyle = 'rgba(12, 20, 33, 0.92)';
            ctx.strokeStyle = hov ? '#4a86c0' : '#2e4a6e';
            ctx.lineWidth = hov ? 1.8 : 1.2;
            roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill(); ctx.stroke();

            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.font = 'bold 11.5px "Microsoft YaHei"';
            ctx.fillStyle = '#7ec8ff';
            ctx.fillText('奖牌要求', r.x + 14, r.y + 14);
            ctx.strokeStyle = 'rgba(58, 106, 154, 0.55)'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(r.x + 14, r.y + 23);
            ctx.lineTo(r.x + r.w - 14, r.y + 23);
            ctx.stroke();

            const rows = [
                ['铜牌', '#d99a65', info.copperCores, info.copper, '#ffb877'],
                ['银牌', '#d8e3ef', info.fullCores,   info.silver, '#e6eff8'],
                ['金牌', '#ffd966', info.fullCores,   info.gold,   '#ffe08a']
            ];
            const labelX = r.x + 14, coreX = r.x + 66;
            for (let i = 0; i < rows.length; i++) {
                const y = r.y + 39 + i * 20;
                // 奖牌色小圆点：比纯文字更容易扫读
                ctx.beginPath();
                ctx.arc(labelX + 4, y, 3.6, 0, Math.PI * 2);
                ctx.fillStyle = rows[i][1]; ctx.fill();
                ctx.textAlign = 'left';
                ctx.font = 'bold 12px "Microsoft YaHei"';
                ctx.fillStyle = rows[i][1];
                ctx.fillText(rows[i][0], labelX + 13, y);
                ctx.font = '11.5px "Microsoft YaHei"';
                ctx.fillStyle = '#8fb4d8';
                ctx.fillText(`核心≥${rows[i][2]}`, coreX, y);
                ctx.textAlign = 'right';
                ctx.font = 'bold 12px "Microsoft YaHei"';
                ctx.fillStyle = rows[i][4];
                ctx.fillText(`${rows[i][3]} 分`, r.x + r.w - 14, y);
            }
            ctx.restore();
        }

        // 面板上此刻勾选的组合（路线反转在无独立出口的关卡上不可用）
        function getPendingVariantFlags() {
            const rev = pendingReverse && pendingLevel >= 0 && !!LEVELS[pendingLevel] && levelHasSeparateExit(LEVELS[pendingLevel]);
            return { rev: !!rev, chaos: !!pendingChaos, rogue: !!pendingRogue };
        }

        // 奖牌配色：奖牌胶囊与记录条共用，保证同一档牌在界面上颜色一致
        function medalPalette(medal) {
            if (medal === 'gold')   return { color: '#ffe08a', tint: 'rgba(255,217,102,0.16)', edge: 'rgba(255,217,102,0.62)', icon: '🥇' };
            if (medal === 'silver') return { color: '#e6eff8', tint: 'rgba(220,232,245,0.14)', edge: 'rgba(220,232,245,0.52)', icon: '🥈' };
            if (medal === 'copper') return { color: '#f0b482', tint: 'rgba(224,160,106,0.16)', edge: 'rgba(224,160,106,0.58)', icon: '🥉' };
            return null;
        }
        function medalShortLabel(medal) {
            return medal === 'gold' ? '金牌' : medal === 'silver' ? '银牌' : medal === 'copper' ? '铜牌' : '未获牌';
        }

        // 模式卡片右上角的奖牌胶囊：奖牌色描边 + 半透明底色 + 难度小字
        function drawMedalPill(rightX, topY, rec) {
            const pal = rec ? medalPalette(rec.medal) : null;
            const main = rec ? `${pal.icon} ${medalShortLabel(rec.medal)}` : '未获牌';
            const diff = rec ? (Number(rec.difficulty) || 0) : (selectedAscension || 0);
            const sub = `· 难度 ${diff}`;
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px "Microsoft YaHei"';
            const wMain = ctx.measureText(main).width;
            ctx.font = '10.5px "Microsoft YaHei"';
            const wSub = ctx.measureText(sub).width;
            const padX = 9, gap = 4, h = 22;
            const w = padX * 2 + wMain + gap + wSub;
            const x = rightX - w, y = topY;
            ctx.save();
            ctx.fillStyle = pal ? pal.tint : 'rgba(96,116,140,0.12)';
            roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
            ctx.strokeStyle = pal ? pal.edge : 'rgba(122,140,164,0.32)';
            ctx.lineWidth = 1.1;
            roundRect(ctx, x, y, w, h, h / 2); ctx.stroke();
            ctx.restore();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px "Microsoft YaHei"';
            ctx.fillStyle = pal ? pal.color : '#71839a';
            ctx.fillText(main, x + padX, y + h / 2 + 0.5);
            ctx.font = '10.5px "Microsoft YaHei"';
            ctx.fillStyle = pal ? '#a9c2da' : '#5b7189';
            ctx.fillText(sub, x + padX + wMain + gap, y + h / 2 + 1);
        }

        // 奖牌框下方：玩家在本关该模式该组合的最佳记录（塔数 + 分数）
        function drawModeRecordBar(r, key) {
            const v = getPendingVariantFlags();
            const rec = getModeMedalRecord(pendingLevel, key, v.rev, v.chaos, v.rogue);
            const pal = rec ? medalPalette(rec.medal) : null;
            ctx.save();
            ctx.fillStyle = rec ? 'rgba(17, 28, 44, 0.95)' : 'rgba(12, 19, 31, 0.72)';
            roundRect(ctx, r.x, r.y, r.w, r.h, 7); ctx.fill();
            ctx.strokeStyle = rec ? 'rgba(58, 106, 154, 0.55)' : 'rgba(34, 51, 74, 0.7)';
            ctx.lineWidth = 1;
            roundRect(ctx, r.x, r.y, r.w, r.h, 7); ctx.stroke();

            // 左侧奖牌色竖条：一眼能看出这条记录是什么级别的成绩
            if (pal) {
                ctx.fillStyle = pal.tint;
                roundRect(ctx, r.x + 1.5, r.y + 4, 3.4, r.h - 8, 1.7); ctx.fill();
                ctx.fillStyle = pal.edge;
                roundRect(ctx, r.x + 1.5, r.y + 4, 1.8, r.h - 8, 0.9); ctx.fill();
            }

            // 组合标记：反 / 混 / R 做成小胶囊，比裸字符更整齐
            let x = r.x + 12;
            const chips = [];
            if (v.rev)   chips.push({ t: '反', c: '#8fd6ff', bg: 'rgba(126,200,255,0.16)', e: 'rgba(126,200,255,0.45)' });
            if (v.chaos) chips.push({ t: '混', c: '#ffd88a', bg: 'rgba(255,207,107,0.16)', e: 'rgba(255,207,107,0.45)' });
            if (v.rogue) chips.push({ t: 'R',  c: '#d8b0ff', bg: 'rgba(201,166,255,0.16)', e: 'rgba(201,166,255,0.45)' });
            for (const ch of chips) {
                ctx.font = 'bold 10px "Microsoft YaHei"';
                const cw = ctx.measureText(ch.t).width + 10;
                const bh = 15;
                ctx.fillStyle = ch.bg;
                roundRect(ctx, x, r.y + (r.h - bh) / 2, cw, bh, 4); ctx.fill();
                ctx.strokeStyle = ch.e; ctx.lineWidth = 1;
                roundRect(ctx, x, r.y + (r.h - bh) / 2, cw, bh, 4); ctx.stroke();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = ch.c;
                ctx.fillText(ch.t, x + cw / 2, r.y + r.h / 2 + 0.5);
                x += cw + 5;
            }

            if (!rec) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = '11.5px "Microsoft YaHei"';
                ctx.fillStyle = '#5b7189';
                ctx.fillText('暂无记录', (x + r.x + r.w - 12) / 2, r.y + r.h / 2);
                ctx.restore();
                return;
            }

            // 旧存档没有塔数字段，显示占位符而不是误报 0
            const hasTowers = rec.towersBuilt != null && Number.isFinite(Number(rec.towersBuilt));
            const towersText = hasTowers ? String(Math.max(0, Number(rec.towersBuilt))) : '—';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = '11.5px "Microsoft YaHei"';
            ctx.fillStyle = '#86a8c8';
            ctx.fillText(`塔数 ${towersText}`, x + 2, r.y + r.h / 2);

            // 分数：金色加粗，右侧贴边
            ctx.textAlign = 'right';
            ctx.font = 'bold 12.5px "Microsoft YaHei"';
            ctx.fillStyle = '#ffd966';
            ctx.fillText(`${Number(rec.score) || 0} 分`, r.x + r.w - 12, r.y + r.h / 2 + 0.5);

            // 布局被 AI 改动过的成绩：塔数与分数之间加 AI 徽标
            if (rec.ai) {
                ctx.font = 'bold 10px "Microsoft YaHei"';
                const chipLabel = 'AI';
                const chipW = ctx.measureText(chipLabel).width + 12;
                const chipH = 15;
                const towersW = ctx.measureText(`塔数 ${towersText}`).width;
                let chipX = x + 2 + towersW + 10;
                const maxX = r.x + r.w - 12 - ctx.measureText(`${Number(rec.score) || 0} 分`).width - chipW - 8;
                if (chipX > maxX) chipX = Math.max(x + 2 + towersW + 6, maxX);
                const chipY = r.y + r.h / 2 - chipH / 2;
                ctx.fillStyle = 'rgba(58, 143, 212, 0.22)';
                roundRect(ctx, chipX, chipY, chipW, chipH, 7); ctx.fill();
                ctx.strokeStyle = 'rgba(126, 200, 255, 0.7)'; ctx.lineWidth = 1;
                roundRect(ctx, chipX, chipY, chipW, chipH, 7); ctx.stroke();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#9ad6ff';
                ctx.fillText(chipLabel, chipX + chipW / 2, r.y + r.h / 2 + 0.5);
            }
            ctx.restore();
        }

        function drawModeSelector() {
            ctx.fillStyle = 'rgba(4, 8, 16, 0.78)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const L = getModePanelLayout();
            ctx.fillStyle = '#131c2b'; ctx.strokeStyle = '#3a6a9a'; ctx.lineWidth = 2;
            roundRect(ctx, L.x, L.y, L.w, L.h, 14); ctx.fill(); ctx.stroke();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 14;
            ctx.fillText(LEVELS[pendingLevel].name, canvas.width / 2, L.y + 36);
            ctx.shadowBlur = 0;
            ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText(`#${pendingLevel + 1} · 选择游戏模式`, canvas.width / 2, L.y + 68);
            for (let i = 0; i < MODE_KEYS_ACTIVE.length; i++) {
                const key = MODE_KEYS_ACTIVE[i];
                const m = MODES[key];
                if (!m) continue;
                const r = getModeRect(i);
                const hov = hoveredMode === i;
                const isNoUpgrade = (key === 'noUpgrade');
                const isRogue = (key === 'rogue');
                ctx.fillStyle = hov ? '#243654' : '#1a2536';
                ctx.strokeStyle = hov ? '#7ec8ff' : (isRogue ? '#5a3a8a' : '#2e4a6e');
                ctx.lineWidth = hov ? 2 : 1.5;
                const cardH = MODE_CARD_H;
                roundRect(ctx, r.x, r.y, r.w, cardH, 10); ctx.fill(); ctx.stroke();
                if (hov) {
                    ctx.shadowColor = '#3a8fd4'; ctx.shadowBlur = 12;
                    roundRect(ctx, r.x, r.y, r.w, cardH, 10); ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 18px "Microsoft YaHei"';
                ctx.fillStyle = hov ? '#ffffff' : (isRogue ? '#d8b0ff' : '#c0dcff');
                ctx.fillText(m.name, r.x + 22, r.y + 26);
                const v = getPendingVariantFlags();
                const medalRec = getModeMedalRecord(pendingLevel, key, v.rev, v.chaos, v.rogue);
                // 右上角奖牌胶囊（含难度），比纯文字更醒目
                drawMedalPill(r.x + r.w - 16, r.y + 15, medalRec);
                ctx.textAlign = 'left';
                ctx.font = '12px "Microsoft YaHei"';
                ctx.fillStyle = hov ? '#9fc4e8' : '#7a9ac0';
                const descX = r.x + 22;
                const descMaxWidth = r.w - 44;
                const descLines = wrapModeDescription(m.desc, descMaxWidth);
                if (descLines.length > 1) {
                    ctx.fillText(descLines[0], descX, r.y + 54, descMaxWidth);
                    ctx.fillText(descLines[1], descX, r.y + 70, descMaxWidth);
                } else {
                    ctx.fillText(descLines[0] || '', descX, r.y + 62, descMaxWidth);
                }
                // 右侧：该模式的奖牌要求（核数 + 分数）
                drawModeMedalBox(getModeMedalBoxRect(i), key, hov);
                // 奖牌要求框下方：玩家的塔数与分数记录
                drawModeRecordBar(getModeRecordRect(i), key);
            }
            drawReverseToggle();
            drawChaosToggle();
            drawRogueToggle();
        }

        // ============================================================
        // 塔图标绘制
        // ============================================================
        function drawTowerLogo(c, type, lv, px, py, angle, color, scale) {
            const plainWhite = !color || color === '#ffffff';
            color = color || '#ffffff';
            // 纯白（建造菜单 / 图鉴 / 1 级塔）改用钢灰本体，白底渐变才不会被冲成一片白
            const bodyColor = plainWhite ? '#93a8bd' : color;
            const sf = (typeof scale === 'number' && scale > 0) ? scale : 1;
            c.save();
            c.translate(px, py);
            if (sf !== 1) c.scale(sf, sf);
            if (typeof angle === 'number' && (type === 'gun' || type === 'cannon' || type === 'missile' || type === 'sniper' || type === 'railgun' || type === 'flak' || type === 'laser')) {
                c.rotate(angle + Math.PI / 2);
            }
            c.lineCap = 'round'; c.lineJoin = 'round';
            // 车体横向略拉宽、纵向略压扁，装甲车辆的低矮宽厚感（整体再放大一档，图标更醒目）
            c.scale(1.20, 0.96);
            if (plainWhite) { c.shadowColor = 'rgba(0, 0, 0, 0.55)'; c.shadowBlur = 3; }
            switch (type) {
                case 'gun':       drawGunLogo(c, lv, bodyColor); break;
                case 'cannon':    drawCannonLogo(c, lv, bodyColor); break;
                case 'missile':   drawMissileLogo(c, lv, bodyColor); break;
                case 'temporal':  drawSlowLogo(c, lv, bodyColor); break;
                case 'laser':     drawLaserLogo(c, lv, bodyColor); break;
                case 'shock':     drawShockLogo(c, lv, bodyColor); break;
                case 'chain':     drawChainLogo(c, lv, bodyColor); break;
                case 'sniper':    drawSniperLogo(c, lv, bodyColor); break;
                case 'amplifier': drawAmplifierLogo(c, lv, bodyColor); break;
                case 'railgun':   drawRailgunLogo(c, lv, bodyColor); break;
                case 'venom':     drawVenomLogo(c, lv, bodyColor); break;
                case 'flak':      drawFlakLogo(c, lv, bodyColor); break;
                case 'prism':     drawPrismLogo(c, lv, bodyColor); break;
                case 'emp':       drawEmpLogo(c, lv, bodyColor); break;
                case 'harvester': drawHarvesterLogo(c, lv, bodyColor); break;
                default: break;
            }
            c.restore();
        }

        // ============================================================
        // 塔图标：俯视装甲机（挤出多边形 = 顶面受光 + 侧壁背光 + 棱线细亮）
        const LOGO_SHADE_CACHE = new Map();
        // k > 0 向白提亮，k < 0 压暗；结果按「颜色 + 系数」缓存，避免每帧重复换算
        function shadeColor(hex, k) {
            const key = hex + '|' + k;
            const cached = LOGO_SHADE_CACHE.get(key);
            if (cached !== undefined) return cached;
            let r = 255, g = 255, b = 255;
            if (typeof hex === 'string' && hex.charAt(0) === '#') {
                let h = hex.slice(1);
                if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                if (h.length >= 6) {
                    r = parseInt(h.slice(0, 2), 16);
                    g = parseInt(h.slice(2, 4), 16);
                    b = parseInt(h.slice(4, 6), 16);
                    if (isNaN(r) || isNaN(g) || isNaN(b)) { r = g = b = 255; }
                }
            } else if (typeof hex === 'string') {
                // 允许再叠一次明暗：接受上一级算出的 rgb()/rgba() 字符串
                const m = hex.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
                if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
            }
            let rr, gg, bb;
            if (k >= 0) {
                rr = r + (255 - r) * k; gg = g + (255 - g) * k; bb = b + (255 - b) * k;
            } else {
                const f = 1 + k; rr = r * f; gg = g * f; bb = b * f;
            }
            const cv = (v) => Math.max(0, Math.min(255, Math.round(v)));
            const out = 'rgb(' + cv(rr) + ',' + cv(gg) + ',' + cv(bb) + ')';
            if (LOGO_SHADE_CACHE.size > 600) LOGO_SHADE_CACHE.clear();
            LOGO_SHADE_CACHE.set(key, out);
            return out;
        }

        // 落影：让塔看起来站在底座上
        function logoShadow(c, w, y) {
            const cy = (typeof y === 'number') ? y : 8.4;
            c.fillStyle = 'rgba(0, 0, 0, 0.30)';
            c.beginPath(); c.ellipse(0, cy, w, w * 0.32, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(0, 0, 0, 0.15)';
            c.beginPath(); c.ellipse(0, cy + 0.5, w * 1.32, w * 0.42, 0, 0, Math.PI * 2); c.fill();
        }

        function isoTop(c, pts) {
            c.beginPath();
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]);
            }
            c.closePath();
        }

        // 把一块「顶面轮廓」朝下挤出 hz：先画侧壁（压暗），再盖顶面（提亮），最后描棱线
        function extrude(c, pts, hz, color, opt) {
            opt = opt || {};
            // 整体压扁：装甲车辆看起来更低更宽，而不是竖着堆棋子
            hz = hz * 0.74;
            c.save(); c.translate(0, hz);
            isoTop(c, pts);
            c.fillStyle = opt.side || shadeColor(color, -0.52);
            c.fill();
            c.strokeStyle = 'rgba(0, 0, 0, 0.36)'; c.lineWidth = 0.9;
            isoTop(c, pts); c.stroke();
            c.restore();
            isoTop(c, pts);
            c.fillStyle = opt.top || shadeColor(color, 0.24);
            c.fill();
            c.strokeStyle = opt.edge || 'rgba(255, 255, 255, 0.34)';
            c.lineWidth = opt.lw || 0.7;
            isoTop(c, pts); c.stroke();
        }

        function rectPts(cx, cy, w, h) {
            return [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]];
        }

        function bevelPts(cx, cy, w, h, b) {
            const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
            return [[x0 + b, y0], [x1 - b, y0], [x1, y0 + b], [x1, y1 - b], [x1 - b, y1], [x0 + b, y1], [x0, y1 - b], [x0, y0 + b]];
        }

        function prismPts(cx, cy, r, squash, n, rot) {
            const pts = [];
            for (let i = 0; i < n; i++) {
                const a = (i / n) * Math.PI * 2 + (typeof rot === 'number' ? rot : Math.PI / 8);
                pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * (squash || 0.88)]);
            }
            return pts;
        }

        function slab(c, cx, cy, w, h, hz, color, opt) { extrude(c, rectPts(cx, cy, w, h), hz, color, opt); }
        function slabB(c, cx, cy, w, h, b, hz, color, opt) { extrude(c, bevelPts(cx, cy, w, h, b), hz, color, opt); }
        function prism(c, cx, cy, r, squash, hz, color, n, rot, opt) { extrude(c, prismPts(cx, cy, r, squash, n || 8, rot), hz, color, opt); }

        // 底盘：两条分节履带 + 宽装甲车体 + 前部斜板 + 侧裙板 + 后甲板
        function chassis(c, color, w, len, z) {
            z = z || 2.6;
            const tw = Math.max(2.0, w * 0.19);
            const hw = w * 0.82;
            const hl = len * 0.90;
            // 履带（先画，压在车体下面）
            for (const s of [-1, 1]) {
                const tx = s * (w / 2 - tw / 2);
                slab(c, tx, 1.0, tw, len - 2.0, z * 0.62, shadeColor(color, -0.58), { edge: 'rgba(255, 255, 255, 0.16)', lw: 0.5 });
                const segs = Math.max(3, Math.round((len - 2.0) / 2.4));
                for (let i = 0; i < segs; i++) {
                    const yy = 1.0 - (len - 2.0) / 2 + (i + 0.5) * ((len - 2.0) / segs);
                    c.fillStyle = 'rgba(0, 0, 0, 0.40)';
                    c.fillRect(tx - tw / 2 + 0.35, yy - 0.32, tw - 0.7, 0.5);
                }
            }
            // 车体：宽而低
            slabB(c, 0, 1.0, hw, hl - 2.0, Math.min(1.5, hw * 0.16), z, color);
            // 侧裙板（参考图那两块大平板）
            for (const s of [-1, 1]) {
                slab(c, s * (hw / 2 + 0.55), 1.0, 1.5, hl - 3.4, z * 0.52, shadeColor(color, -0.34), { edge: 'rgba(255, 255, 255, 0.30)', lw: 0.5 });
            }
            // 前部斜装甲
            extrude(c, [
                [-hw / 2 + 0.7, -(hl / 2 - 1.1) - 2.2],
                [hw / 2 - 0.7, -(hl / 2 - 1.1) - 2.2],
                [hw / 2 - 1.5, -(hl / 2 - 1.1)],
                [-hw / 2 + 1.5, -(hl / 2 - 1.1)]
            ], z * 0.62, shadeColor(color, -0.22), { edge: 'rgba(255, 255, 255, 0.34)' });
            // 后甲板
            slab(c, 0, hl / 2 - 1.6, hw - 1.4, 1.9, z * 0.38, shadeColor(color, -0.06), { edge: 'rgba(255, 255, 255, 0.24)', lw: 0.5 });
        }

        // 炮管：梯形管身（朝上）+ 枪口制退器
        function isoBarrel(c, color, cx, yTip, yBase, wTip, wBase, hz, brakeW, brakeLen) {
            extrude(c, [[cx - wTip / 2, yTip], [cx + wTip / 2, yTip], [cx + wBase / 2, yBase], [cx - wBase / 2, yBase]], hz, shadeColor(color, 0.04));
            c.fillStyle = 'rgba(0, 0, 0, 0.32)';
            c.fillRect(cx + wTip / 2 - 0.34, yTip + 1.0, 0.34, Math.max(1.0, (yBase - yTip) - 1.6));
            if (brakeLen) {
                extrude(c, rectPts(cx, yTip + brakeLen / 2 + 0.1, brakeW, brakeLen), hz * 0.85, shadeColor(color, -0.02));
                c.fillStyle = 'rgba(0, 0, 0, 0.46)';
                c.fillRect(cx - brakeW / 2 + 0.7, yTip + 0.6, 1.5, 1.1);
                c.fillRect(cx + brakeW / 2 - 2.2, yTip + 0.6, 1.5, 1.1);
                c.fillStyle = 'rgba(0, 0, 0, 0.74)';
                c.beginPath(); c.ellipse(cx, yTip + 0.3, brakeW / 2 - 0.5, 0.5, 0, 0, Math.PI * 2); c.fill();
            }
        }

        function hatch(c, x, y, r) {
            c.strokeStyle = 'rgba(255, 255, 255, 0.40)'; c.lineWidth = 0.6;
            c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke();
            c.fillStyle = 'rgba(0, 0, 0, 0.24)';
            c.beginPath(); c.arc(x, y, r * 0.62, 0, Math.PI * 2); c.fill();
        }

        function logoRing(c, x, y, rx, ry, col, lw) {
            c.strokeStyle = col; c.lineWidth = lw || 1;
            c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.stroke();
        }

        function logoGlow(c, x, y, r, col, blur) {
            c.save();
            c.shadowColor = col; c.shadowBlur = blur || 6;
            c.fillStyle = col;
            c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
            c.restore();
            c.fillStyle = 'rgba(255, 255, 255, 0.85)';
            c.beginPath(); c.arc(x - r * 0.28, y - r * 0.28, r * 0.42, 0, Math.PI * 2); c.fill();
        }

        // 便宜版发光：两道实心圆代替 shadowBlur，批量出现时省一半绘制开销
        function cheapGlow(c, x, y, r, col) {
            c.fillStyle = col; c.globalAlpha = 0.30;
            c.beginPath(); c.arc(x, y, r * 1.75, 0, Math.PI * 2); c.fill();
            c.globalAlpha = 1;
            c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(255, 255, 255, 0.88)';
            c.beginPath(); c.arc(x - r * 0.26, y - r * 0.26, r * 0.42, 0, Math.PI * 2); c.fill();
        }

        // 绕中心旋转一组点（保持挤出方向一致，侧壁阴影才不会随角度乱翻）
        function rotPts(pts, ang, cx, cy) {
            const co = Math.cos(ang), si = Math.sin(ang);
            return pts.map(p => [(cx || 0) + p[0] * co - p[1] * si, (cy || 0) + p[0] * si + p[1] * co]);
        }

        // 机枪：窄车体 + 细长单管（带散热护套）+ 侧挂弹链箱——整体比火炮瘦一圈
        function drawGunLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            logoShadow(c, 7.8, 8.4);
            chassis(c, color, 10.2, 10.8, 2.1);
            prism(c, 0, -1.5, 2.6, 0.72, 2.6, color, 8, Math.PI / 8);
            hatch(c, 0, -1.5, 1.15);
            // 双细管：每根口径只有火炮的 1/6，枪口是小小的消焰器
            const yTip = -16.2 + t * 0.14, yBase = -3.0;
            for (const ox of [-0.95, 0.95]) isoBarrel(c, color, ox, yTip, yBase, 0.52, 0.78, 0.85, 1.25, 0.85);
            // 机匣：两根管之间的一小段接收器，只到枪管中段，不遮住细管
            slab(c, 0, -4.0, 2.5, 2.4, 1.05, shadeColor(color, -0.16), { edge: 'rgba(255, 255, 255, 0.28)', lw: 0.45 });
            // 弹链箱 + 弹点（比火炮的液压筒小、偏后）
            slab(c, 3.9, 1.4, 2.7, 4.2, 1.9, shadeColor(color, -0.28), { edge: 'rgba(255, 255, 255, 0.30)' });
            c.fillStyle = 'rgba(255, 224, 138, 0.55)';
            for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(3.3 + i * 0.62, 0.6 + i * 0.95, 0.26, 0, Math.PI * 2); c.fill(); }
        }

        // 火炮：厚重车体 + 八角炮塔 + 大口径炮管 + 后座液压筒
        function drawCannonLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            logoShadow(c, 9.4, 8.8);
            chassis(c, color, 13.4, 11.8, 3.0);
            prism(c, 0, -0.8, 4.6, 0.78, 4.2, color, 8, Math.PI / 8);
            hatch(c, -1.7, -1.4, 1.35);
            for (const ox of [-3.3, 3.3]) prism(c, ox, 1.5, 1.5, 0.66, 2.5, shadeColor(color, -0.20), 6);
            isoBarrel(c, color, 0, -16.2, -3.4, 2.4, 3.3, 2.4, 6.2, 2.9);
            const rings = Math.min(lv, 4);
            for (let i = 0; i < rings; i++) {
                const yy = -11.6 + i * 2.0;
                c.fillStyle = 'rgba(0, 0, 0, 0.30)';
                c.fillRect(-2.5, yy, 5.0, 0.55);
                c.fillStyle = 'rgba(255, 255, 255, 0.22)';
                c.fillRect(-2.5, yy, 5.0, 0.22);
            }
        }

        // 导弹：装甲车体 + 发射架 + 1~3 根弹筒（尖头 + 尾翼）
        function drawMissileLogo(c, lv, color) {
            color = color || '#ffffff';
            const count = lv === 1 ? 1 : (lv <= 3 ? 2 : 3);
            logoShadow(c, 9.2, 8.6);
            chassis(c, color, 12.6, 12.0, 2.6);
            slab(c, 0, 0.6, 9.4, 8.6, 2.0, shadeColor(color, -0.12), { edge: 'rgba(255, 255, 255, 0.30)' });
            const xs = count === 1 ? [0] : (count === 2 ? [-2.4, 2.4] : [-3.5, 0, 3.5]);
            for (const ox of xs) {
                slab(c, ox, -1.9, 3.0, 8.6, 3.3, shadeColor(color, -0.24), { edge: 'rgba(255, 255, 255, 0.34)' });
                // 尖弹头
                extrude(c, [[ox - 1.45, -6.1], [ox + 1.45, -6.1], [ox, -9.6]], 2.8, shadeColor(color, 0.26), { edge: 'rgba(255, 255, 255, 0.52)' });
                c.strokeStyle = 'rgba(255, 255, 255, 0.55)'; c.lineWidth = 0.7;
                c.beginPath(); c.moveTo(ox, -6.1); c.lineTo(ox, -9.2); c.stroke();
                // 尾翼
                extrude(c, [[ox - 2.4, 2.0], [ox - 1.2, 2.0], [ox - 1.2, 3.8], [ox - 2.8, 3.8]], 1.3, shadeColor(color, -0.40), { lw: 0.5 });
                extrude(c, [[ox + 1.2, 2.0], [ox + 2.4, 2.0], [ox + 2.8, 3.8], [ox + 1.2, 3.8]], 1.3, shadeColor(color, -0.40), { lw: 0.5 });
            }
            c.fillStyle = 'rgba(0, 0, 0, 0.26)';
            c.fillRect(-4.4, 3.2, 8.8, 0.7);
        }

        // 缓速：圆形转台 + 6 片均布扇叶 + 中央核（中心对称）
        function drawSlowLogo(c, lv, color) {
            color = color || '#ffffff';
            logoShadow(c, 9.6, 9.0);
            prism(c, 0, 0.4, 7.0, 0.99, 1.7, shadeColor(color, -0.24), 12, Math.PI / 12);
            prism(c, 0, 0.4, 5.2, 0.99, 1.5, shadeColor(color, -0.06), 12, Math.PI / 12);
            const blades = 6;
            for (let i = 0; i < blades; i++) {
                const a = (i / blades) * Math.PI * 2;
                extrude(c, rotPts([[-1.1, -2.2], [1.1, -2.2], [2.2, -8.4], [-2.2, -8.4]], a, 0, 0.4), 1.0,
                    i % 2 ? color : shadeColor(color, -0.14), { lw: 0.5 });
            }
            prism(c, 0, 0.4, 2.5, 1, 2.9, color, 12, Math.PI / 12);
            logoGlow(c, 0, 0.2, 1.15, 'rgba(150, 230, 255, 0.9)', 8);
            logoRing(c, 0, 0.4, 8.8, 8.8, 'rgba(150, 230, 255, 0.22)', 1);
        }

        // 激光：车体 + 镜筒 + 散热鳍 + 发光透镜
        function drawLaserLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            logoShadow(c, 8.8, 8.4);
            chassis(c, color, 10.8, 10.2, 2.2);
            prism(c, 0, 1.6, 3.2, 0.70, 2.4, color, 8);
            // 镜筒（细长，朝前）
            isoBarrel(c, shadeColor(color, 0.02), 0, -10.4, -1.0, 2.2, 2.9, 2.6, 0, 0);
            // 散热鳍（筒身两侧）
            for (let i = 0; i < 3; i++) {
                slab(c, -3.0, -2.4 + i * 1.7, 2.0, 0.8, 1.1, shadeColor(color, -0.36), { lw: 0.5 });
                slab(c, 3.0, -2.4 + i * 1.7, 2.0, 0.8, 1.1, shadeColor(color, -0.36), { lw: 0.5 });
            }
            // 出光护罩 + 透镜
            prism(c, 0, -10.8, 2.3 + t * 0.10, 0.66, 1.6, shadeColor(color, 0.04), 10, Math.PI / 10);
            logoGlow(c, 0, -11.2, 1.05, 'rgba(190, 245, 255, 0.95)', 9);
        }

        // 电塔：圆盘底座 + 4/6 根均布电极杆 + 中央球 + 冲击环（中心对称）
        function drawShockLogo(c, lv, color) {
            color = color || '#ffffff';
            const t = Math.min(lv, 6);
            logoShadow(c, 9.2, 8.8);
            prism(c, 0, 0.4, 5.2, 0.99, 1.7, shadeColor(color, -0.24), 12, Math.PI / 12);
            prism(c, 0, 0.4, 4.0, 0.99, 1.5, shadeColor(color, -0.05), 12, Math.PI / 12);
            const rods = (lv >= 4 ? 6 : 4);
            for (let i = 0; i < rods; i++) {
                const a = (i / rods) * Math.PI * 2 + Math.PI / 8;
                extrude(c, rotPts([[-1.15, -2.6], [1.15, -2.6], [1.15, -7.2], [-1.15, -7.2]], a, 0, 0.4), 1.3,
                    shadeColor(color, -0.10), { lw: 0.5 });
                const ex = 7.2 * Math.sin(a), ey = 0.4 - 7.2 * Math.cos(a);
                cheapGlow(c, ex, ey, 1.05 + t * 0.02, 'rgba(190, 235, 255, 0.95)');
            }
            prism(c, 0, 0.4, 2.6, 1, 2.9, color, 12, Math.PI / 12);
            cheapGlow(c, 0, 0.2, 1.15, 'rgba(200, 240, 255, 0.95)');
            // 冲击环
            c.strokeStyle = shadeColor(color, 0.48); c.lineWidth = 1;
            for (let i = 0; i < 2; i++) {
                c.beginPath(); c.arc(0, 0.4, 7.4 + i * 1.6, 0, Math.PI * 2); c.stroke();
            }
        }

        // 链电：双立柱放电 + 中央核 + 跳链电弧
        function drawChainLogo(c, lv, color) {
            color = color || '#ffffff';
            logoShadow(c, 8.8, 8.4);
            chassis(c, color, 11.6, 9.8, 2.2);
            for (const s of [-1, 1]) {
                prism(c, s * 3.6, 0.8, 2.1, 0.7, 2.2, color, 8);
                for (let i = 0; i < 3; i++) prism(c, s * 3.6, -0.8 - i * 1.5, 1.5 - i * 0.2, 0.5, 1.2, i % 2 ? shadeColor(color, -0.18) : color, 8);
                logoGlow(c, s * 3.6, -5.6, 1.1, 'rgba(190, 235, 255, 0.95)', 8);
            }
            // 中央核
            prism(c, 0, -2.4, 1.7, 1, 2.0, color, 10, Math.PI / 10);
            logoGlow(c, 0, -2.8, 0.85, 'rgba(255, 255, 255, 0.9)', 6);
            // 电弧
            const arcs = 2 + Math.min(lv, 3);
            for (let i = 0; i < arcs; i++) {
                const s = (i % 2) ? 1 : -1;
                c.strokeStyle = 'rgba(200, 240, 255, 0.85)'; c.lineWidth = 0.9;
                c.beginPath();
                c.moveTo(0, -2.6);
                c.lineTo(s * 1.7, -3.6 + i * 0.2);
                c.lineTo(s * 2.6, -4.8 - i * 0.3);
                c.lineTo(s * 3.5, -5.4);
                c.stroke();
            }
        }

        // 狙击：长车体 + 侧裙装甲板 + 低矮炮塔 + 超长枪管 + 瞄准镜（照参考图）
        function drawSniperLogo(c, lv, color) {
            color = color || '#ffffff';

            logoShadow(c, 9.6, 8.8);
            chassis(c, color, 12.4, 15.0, 2.6);
            // 前后两块侧裙装甲（参考图里的两块大平板）
            for (const s of [-1, 1]) {
                slabB(c, s * 4.5, -3.4, 2.6, 5.6, 0.7, 1.6, shadeColor(color, -0.02), { edge: 'rgba(255, 255, 255, 0.46)' });
                slabB(c, s * 4.5, 3.6, 2.6, 5.4, 0.7, 1.6, shadeColor(color, -0.02), { edge: 'rgba(255, 255, 255, 0.46)' });
                c.strokeStyle = 'rgba(0, 0, 0, 0.30)'; c.lineWidth = 0.5;
                c.beginPath(); c.moveTo(s * 3.3, -0.7); c.lineTo(s * 3.3, 6.2); c.stroke();
            }
            // 炮塔（低矮多面体）
            prism(c, 0, 0.2, 3.6, 0.80, 3.4, color, 8, Math.PI / 8);
            hatch(c, -1.5, -0.4, 1.2);
            // 枪管 + 制退器
            isoBarrel(c, color, 0, -19.4 + t * 0.2, -4.2, 1.5, 2.1, 1.9, 3.4, 3.0);
            // 横置瞄准镜
            slab(c, 0, -3.4, 4.2, 2.4, 2.0, shadeColor(color, -0.30), { edge: 'rgba(255, 255, 255, 0.40)' });
            c.fillStyle = 'rgba(0, 0, 0, 0.80)';
            c.beginPath(); c.ellipse(-2.1, -3.4, 0.75, 0.9, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = 'rgba(150, 230, 255, 0.95)';
            c.beginPath(); c.arc(-2.25, -3.6, 0.35, 0, Math.PI * 2); c.fill();
            // 尾部弹药箱
            slab(c, 0, 5.0, 6.2, 3.4, 1.8, shadeColor(color, -0.20), { edge: 'rgba(255, 255, 255, 0.30)' });
        }

        // 增幅：圆形底座 + 中央核 + 4 个均布发射盘 + 同心波纹环（中心对称）
        function drawAmplifierLogo(c, lv, color) {

        // 磁轨：双导轨 + 环绕加速线圈 + 加速腔 + 枪口板
        function drawRailgunLogo(c, lv, color) {

        // 毒液：车体 + 储液罐 + 箍带 + 观察窗 + 喷口
        function drawVenomLogo(c, lv, color) {
            color = color || '#ffffff';
            logoShadow(c, 9.0, 8.6);
            chassis(c, color, 11.4, 10.6, 2.4);
            // 储液罐
            prism(c, 0, 0.6, 4.4, 0.86, 3.0, shadeColor(color, -0.18), 10, Math.PI / 10);
            for (let i = 0; i < 3; i++) {

                c.fillRect(-4.0, -1.6 + i * 1.8, 8.0, 0.24);

        // ============================================================
        // Roguelike 强化聚合 & 面板
        // ============================================================
        function getAggregatedUpgrades() {
    // ★ 坑 1：放宽早退条件
    if (!rogueState) return [];
    if (rogueState.upgrades.length === 0 &&
        (!rogueState.synergies || rogueState.synergies.length === 0)) return [];

    const counts = new Map();
    for (const u of rogueState.upgrades) {
        if (u.id === 'freeUp' || u.id === 'coreRepair') continue;
        counts.set(u.id, (counts.get(u.id) || 0) + 1);
    }
    const result = [];
    for (const [id, count] of counts) {
        const up = ROGUE_UPGRADES.find(u => u.id === id);
        if (!up) continue;
        result.push({ ...up, count, _rord: RARITY_ORDER[up.rarity] ?? 4 });
    }

    // ★ 新增：联动卡（每张只算 1 份，因为抽卡时已去重）
    for (const s of (rogueState.synergies || [])) {
        result.push({ ...s, count: 1, _rord: RARITY_ORDER[s.rarity] ?? 4 });
    }

    result.sort((a, b) => {
        if (a._rord !== b._rord) return a._rord - b._rord;
        return b.count - a.count;
    });
    return result;
}

        function getAggregatedEnemyMods() {
            if (!rogueState || !rogueState.enemyMods) return [];
            const em = rogueState.enemyMods;
            const counts = new Map();
            for (const id of em.picks) counts.set(id, (counts.get(id) || 0) + 1);
            const out = [];
            for (const def of ROGUE_ENEMY_BOOSTS) {
                const n = counts.get(def.id);
                if (!n) continue;
                let desc = '';
                switch (def.id) {
                    case 'hp':          desc = `敌人生命 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'speed':       desc = `敌人移速 +${Math.round((Math.pow(1.2, n) - 1) * 100)}%`; break;
                    case 'coreLock':    desc = `未携带核心的敌人受伤 -${Math.round((1 - Math.pow(0.8, n)) * 100)}%`; break;
                    case 'stunResist':  desc = `眩晕时长 -${100.00 - 100.00 * Math.pow(0.8, n).toFixed(2)}%`; break;
                    case 'coreDelay':   desc = `核心原地停留 ${3 * n} 秒`; break;
                    case 'dodge':       desc = `闪避概率 ${Math.round((1 - Math.pow(0.92, n)) * 100)}%`; break;
                }
                out.push({ icon: def.icon, name: def.name, color: def.color, desc, count: n });
            }
            return out;
        }

        function getAggregatedDesc(up, count) {
            switch (up.id) {
                case 'dmg':       return `全塔伤害 +${Math.round((Math.pow(1.15, count) - 1) * 100)}%`;
                case 'rate':      return `全塔射速 +${Math.round((Math.pow(1.12, count) - 1) * 100)}%`;
                case 'range':     return `全塔射程 +${Math.round((Math.pow(1.08, count) - 1) * 100)}%`;
                case 'money': {
                    const total = 350 * count + 100 * count * (count - 1) / 2;
                    const latest = 350 + (count - 1) * 100;
                    return `累计获得 ${total} 资金（最近一次 +${latest}）`;
                }
                case 'killBonus': return `击杀 +${8 * count} 资金`;
                case 'priceDown': return `建造与升级花费 -${Math.round((1 - Math.pow(0.9, count)) * 100)}%`;
                case 'reveal':    return `隐形发现 +${Math.round((Math.pow(1.5, count) - 1) * 100)}%`;
                case 'slowAura':  return `敌人移速 -${Math.round((1 - Math.pow(0.9, count)) * 100)}%`;
                case 'coreSpeed':    return `核心返回速度 +${Math.round((Math.pow(1.20, count) - 1) * 100)}%`;
                case 'jammerReduce': return `干扰者干扰范围 -${Math.round((1 - Math.pow(0.85, count)) * 100)}%`;
                case 'antiJam':      return `抗干扰 +${Math.round(Math.min(0.85, 0.20 * count) * 100)}%（干扰者沉默时长 ×${Math.max(0.1, 1 - Math.min(0.85, 0.20 * count)).toFixed(2)}）`;
                case 'synBoost': {
    const cur = Math.min(SYNERGY_SCALE_MAX, 1.0 + SYNERGY_SCALE_STEP * count);
    return `联动数值再 ×${cur.toFixed(2)}（已叠加 ${count} 张）`;
}
                case 'sellPlus':  return `出售返还 +${Math.min(50, 25 * count)}%`;
                case 'crit':      return `暴击率 ${Math.round((1 - Math.pow(0.88, count)) * 100)}%（倍率 ×${((rogueState && rogueState.bonus.critDmgMul) || 2).toFixed(1)}）`;
                case 'critDmg':   return `暴击伤害倍率 ×${((rogueState && rogueState.bonus.critDmgMul) || 2).toFixed(1)}`;
                case 'doubleShot':return `弹射率 ${Math.round((1 - Math.pow(0.85, count)) * 100)}%`;
                case 'killAll':   return `已触发 ${count} 次全屏秒杀`;
                case 'stunAll':   return `已触发 ${count} 次全屏眩晕`;
                case 'currentHpDmg': return `攻击附带 ${Math.round(Math.min(0.20, 0.01 * count) * 100)}% 当前生命值伤害`;
                case 'charm':     return `魅惑率 ${Math.round((1 - Math.pow(0.97, count)) * 100)}%`;
                default: return up.desc;
            }
        }

            if (overflow > 0) {
                const ry = y + 32 + shown * rowH;
                ctx.textAlign = 'left';
                ctx.font = '11px "Microsoft YaHei"';
                ctx.fillStyle = '#5a7fa8';

        function drawRoguePanels() {
            affixPanelRect = null;
            towerUpPanelRect = null;
            enemyModPanelRect = null;
            if (!rogueState) return;
            if (canvas.width < 1000) return;

            const w = ASC_GAME_W;
            const x = canvas.width - w - 10;
            const rowH = 34, hdrH = ROGUE_PANEL_HDR_H, padB = 8;
            let y = 56;

            if (rogueState.affixes.length > 0) {
                const rows = affixCollapsed ? 0 : rogueState.affixes.length;
                const h = hdrH + rows * rowH + padB;
                drawAffixPanel(x, y, w, h);
                affixPanelRect = { x, y, w, h };
                y += h + 10;
            }

            const listA = getAggregatedUpgrades();
            const listB = getAggregatedEnemyMods();
            if (listA.length === 0 && listB.length === 0) return;

            const availH = canvas.height - y - 14;
            const fixedA = listA.length ? hdrH + padB : 0;
            const fixedB = listB.length ? hdrH + padB : 0;
            const gap = (listA.length && listB.length) ? 10 : 0;
            let budget = Math.max(0, Math.floor((availH - fixedA - fixedB - gap) / rowH));

            let rowsA = towerUpCollapsed ? 0 : listA.length;
            let rowsB = enemyModCollapsed ? 0 : listB.length;
            if (rowsA + rowsB > budget) {
                const total = rowsA + rowsB;
                rowsA = Math.floor(budget * rowsA / total);
                rowsB = budget - rowsA;
                if (rowsA > listA.length) { rowsB += rowsA - listA.length; rowsA = listA.length; }
                if (rowsB > listB.length) { rowsA += rowsB - listB.length; rowsB = listB.length; }
                if (rowsA + rowsB > budget) rowsB = Math.max(0, budget - rowsA);
            }

            if (listA.length > 0) {
                const shown = Math.min(rowsA, listA.length);
                const overflow = towerUpCollapsed ? 0 : listA.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawTowerUpgradePanel(x, y, w, h, listA, shown, overflow);
                towerUpPanelRect = { x, y, w, h };
                y += h + gap;
            }
            if (listB.length > 0) {
                const shown = Math.min(rowsB, listB.length);
                const overflow = enemyModCollapsed ? 0 : listB.length - shown;
                const totalRows = shown + (overflow > 0 ? 1 : 0);
                const h = hdrH + totalRows * rowH + padB;
                drawEnemyModPanel(x, y, w, h, listB, shown, overflow);
                enemyModPanelRect = { x, y, w, h };
            }
        }

        // ============================================================

        function openDraft(kind) {
            if (!rogueState) return;
            closeBuildMenu();
            closeTowerMenu();
            hideTip();
            selectedTower = null;
            hideSellButton();

            const picked = [];

            if (kind === 'enemy') {
                const pool = ROGUE_ENEMY_BOOSTS.filter(b => !(b.once && rogueState.enemyMods.picks.includes(b.id)));
                for (let i = 0; i < 3 && pool.length > 0; i++) {
                    const idx = Math.floor(Math.random() * pool.length);
                    picked.push(pool.splice(idx, 1)[0]);
                }
            } else if (kind === 'synergy') {
                // ★ 开局联动：随机抽 3 张不重复的联动
                const ownedSyn = new Set(rogueState.synergies.map(s => s.id));
                const pool = ROGUE_SYNERGIES.filter(s => !ownedSyn.has(s.id));
                for (let i = 0; i < 3 && pool.length > 0; i++) {
                    const idx = Math.floor(Math.random() * pool.length);
                    picked.push(pool.splice(idx, 1)[0]);
                }
            } else {
                // 1) 先按概率抽联动卡（0~3 张，同一联动不重复）
                const ownedSyn = new Set(rogueState.synergies.map(s => s.id));
                const synPool = ROGUE_SYNERGIES.filter(s => !ownedSyn.has(s.id));
                const synWant = Math.min(synPool.length, rollSynergyCount());
                for (let i = 0; i < synWant; i++) {
                    const idx = Math.floor(Math.random() * synPool.length);
                    picked.push(synPool.splice(idx, 1)[0]);
                }

                // 2) 剩余槽位用普通塔强化补齐
                const pickedIds = new Set(rogueState.upgrades.map(u => u.id));
                const upPool = ROGUE_UPGRADES.filter(u => {
                    if (u.once && pickedIds.has(u.id)) return false;
                    if (u.requireCrit && !(rogueState.bonus.critChance > 0)) return false;
                    if (u.requireSynergy && (!rogueState.synergies || rogueState.synergies.length === 0)) return false;  // ★ 新增
                    return true;
                });
                while (picked.length < 3 && upPool.length > 0) {
                    const idx = Math.floor(Math.random() * upPool.length);
                    picked.push(upPool.splice(idx, 1)[0]);
                }

                // 3) 打乱顺序，避免联动卡永远排最左
                for (let i = picked.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [picked[i], picked[j]] = [picked[j], picked[i]];
                }
            }

            if (picked.length === 0) {
                draftPanel = null;
                openNextDraft();
                return;
            }
            draftPanel = { kind: kind || 'tower', choices: picked, hovered: -1, openAt: performance.now() };
        }

        function openNextDraft() {
            if (draftQueue.length === 0) {

            const kind = draftQueue.shift();
            openDraft(kind);

        function applyEnemyBoost(b) {
            if (!rogueState || !b) return;
            const em = rogueState.enemyMods;
            em.picks.push(b.id);
            if (battleStats) battleStats.drafts.push({ id: b.id, kind: 'enemy', wave: waveIndex });
            switch (b.id) {
                case 'hp':        em.hpMul *= 1.20; break;
                case 'speed':     em.speedMul *= 1.20; break;

                    em.coreLockStacks++;
                    em.coreLock = true;
                    break;
                case 'coreDelay':
                    em.coreDelayStacks++;
                    em.coreDelay = true;
                    break;
                case 'stunResist':
                    em.stunStacks++;
                    em.stunMul = Math.pow(0.8, em.stunStacks);
                    break;
                case 'dodge':
                    em.dodgeStacks++;
                    em.dodge = 1 - Math.pow(0.92, em.dodgeStacks);

                    rt.draftGiven = true;
                    const waveNum = rt.id + 1;
                    if (rt.id >= totalWaves - 1) return;

                    const isTowerWave = (waveNum % TOWER_DRAFT_INTERVAL === 0);

                    if (isTowerWave) {
                        if (isEnemyWave) pendingAutoEnemyBoost = true;
                        draftQueue = ['tower'];
                        openNextDraft();

                    }

        function finishBattle(win) {
            if (gameResult) return;
            gameOver = true;
            GAME_STATS.recordResult(!!win);
            closeBuildMenu(); closeTowerMenu(); hideTip(); hideSellButton();
            selectedTower = null;
            draftPanel = null;
            draftQueue = [];
            const st = getEnergyStats();
            const s = battleStats || { kills: 0, leaked: 0, towersBuilt: 0, wavesCleared: 0 };
            const aiLearnUsed = !!(s.aiAssisted || aiAutoMode);
            const lv = currentLevel;
            const mode = MODES[currentModeKey] || MODES.story;
            // 基础分：优先奖励推进波数、击杀效率、保全核心与合理的资金结余。
            // 塔数不再直接作为除数，改为温和的防御效率系数：塔越少且完成同等战果，得分越高。
            let raw = 0;
            raw += s.wavesCleared * 180;
            raw += s.kills * 12;
            raw += (st.green + st.yellow) * 180;
            raw += Math.floor(money) * 0.35;
            raw -= st.red * 300;
            raw += (levelDifficulty(lv) + 1) * 180;
            if (win) raw += Math.max(500, totalWaves * 100); // 完整通关奖励
            else raw = Math.floor(raw * 0.5); // 失败分数折半
            const towerCount = Math.max(1, s.towersBuilt);
            // 少塔仍有优势，但限制极少量建塔带来的过高倍率，避免单靠塔数冲金。
            const towerEfficiencyMul = Math.max(0.75, Math.min(1.35, Math.sqrt(10 / towerCount)));
            const rogueMul = rogueState ? (MODES.rogue.scoreMul || 1) : 1;
            const ascensionMul = 1 + selectedAscension * 0.1;
            // 与奖牌门槛使用完全一致的地图尺寸倍率。
            const mapScoreMul = Math.max(0.5, (COLS * ROWS) / 100);
            const score = Math.max(0, Math.round(raw * towerEfficiencyMul * (mode.scoreMul || 1) * rogueMul * ascensionMul * mapScoreMul));
            const medalThresholds = getModeMedalThresholds(
                lv, currentModeKey, selectedAscension, !!rogueState, totalWaves, undefined, chaosEnabled
            );
            // 任何核心永久丢失都直接判铜牌；未丢核心时按本模式校准后的分数门槛判定。
            const calculatedMedal = st.red > 0 ? 'copper' :
                (score >= medalThresholds.gold ? 'gold' :
                (score >= medalThresholds.silver ? 'silver' : 'copper'));
            // 无尽模式的奖牌以进入无尽前的超级研磨结算为准；无尽中的失败不降级。
            const useGrindEntryMedal = currentModeKey === 'endless' && !!endlessEntryMedalSnapshot;
            const medal = useGrindEntryMedal ? endlessEntryMedalSnapshot.medal : calculatedMedal;
            const medalBasisScore = useGrindEntryMedal ? endlessEntryMedalSnapshot.score : score;
            const medalDifficulty = useGrindEntryMedal ? endlessEntryMedalSnapshot.difficulty : selectedAscension;
            const medalBasisThresholds = useGrindEntryMedal ? endlessEntryMedalSnapshot.medalThresholds : medalThresholds;
            // 塔数跟随同一次成绩：沿用无尽入口时的快照，否则用本局建塔数
            const medalBasisTowers = useGrindEntryMedal
                ? (Number(endlessEntryMedalSnapshot.towersBuilt) || 0)
                : (Number(s.towersBuilt) || 0);
            // 本局布局是否由 AI 改动过（智能托管 / 执行推荐 / 优化升级）：成绩要标明来源
            const medalBasisAi = useGrindEntryMedal ? !!endlessEntryMedalSnapshot.ai : aiLearnUsed;
            // 生涯统计：本次结算拿到的奖牌（无尽沿用研磨入口奖牌的那次已在研磨局计过，不重复计）
            if (!useGrindEntryMedal) GAME_STATS.recordMedal(medal);
            // 金牌奖励：同一关同一模式（含路线反转/混乱/Roguelike 组合）只在「首次拿到金牌」时解锁一个增强
            const prevMedalRecord = getModeMedalRecord(levelIndex, currentModeKey, routeReverse, chaosEnabled, !!rogueState);
            saveModeMedalResult(levelIndex, currentModeKey, medal, medalBasisScore, medalDifficulty, medalBasisTowers, medalBasisAi,
                                routeReverse, chaosEnabled, !!rogueState);
            const firstGold = medal === 'gold' && !(prevMedalRecord && prevMedalRecord.medal === 'gold');
            const goldRepeat = !useGrindEntryMedal && medal === 'gold' && !firstGold;
            const enhancementUnlock = (!useGrindEntryMedal && firstGold) ? awardGoldMedalEnhancement() : null;
            gameResult = {
                win, score, medal, medalBasisScore, medalThresholds: medalBasisThresholds, difficulty: medalDifficulty,
                kills: s.kills, leaked: st.red, wavesCleared: s.wavesCleared,
                totalWaves: totalWaves,
                endless: currentModeKey === 'endless',
                rogue: !!rogueState,
                cores: st.green + st.yellow,
                money: Math.floor(money),
                towersBuilt: s.towersBuilt,
                aiAssisted: aiLearnUsed,
                levelName: lv.name, levelNum: levelIndex + 1,
                modeName: mode.name + (chaosEnabled ? ' · 混乱' : '') + (routeReverse ? ' · 路线反转' : '') + (rogueState ? ' · Roguelike' : '') + (selectedAscension > 0 ? ' · 进阶'+selectedAscension : ''),
                reverse: routeReverse, playTime: playTime,
                showEndless: false,
                enhancementUnlock: enhancementUnlock,
                goldRepeat: goldRepeat
            };
            // 无尽入口只认超级研磨：Roguelike / 混乱 / 反转 都只是叠加项，不构成进入资格
            if (win && currentModeKey === 'grind') {
                unlockEndless();
                gameResult.showEndless = true;
            }
            let endMsg = win ? '🎉 关卡通过！点击确定返回关卡选择' : '💀 核心全部丢失... 点击确定返回关卡选择';
            if (enhancementUnlock) {
                const tname = (TOWER_TYPES[enhancementUnlock.type] || {}).name || enhancementUnlock.type;
                const ename = ((TOWER_ENHANCEMENTS[enhancementUnlock.type] || [])[enhancementUnlock.idx] || {}).name || '增强';
                endMsg += ` · 🔓 金牌解锁新增强：${tname} · ${ename}`;
            } else if (goldRepeat) {
                endMsg += ' · 🔓 本关首次金牌已记录，重复金牌不再解锁';
            }
            msgDisplay.textContent = endMsg;
            if (aiLearnUsed) {
                aiSetStatus(win ? 'AI 已完成本关 · 通关成功' : 'AI 托管结束 · 本关未能守住');
                aiAddMessage(win ? '🎉 本关所有波次已清除，AI 自动通关成功！' : '本局结束：基地核心已全部丢失。可以重新开始并调整难度。', 'bot');
            }
                        // ★ 记录本局，触发 AI 学习
            try {
                AI_LEARN.recordGame({
                    ts: Date.now(),
                    levelIndex, modeKey: currentModeKey,
                    ascension: selectedAscension, rogue: !!rogueState,
                    // 路线反转会改变进攻方向，布局样本必须按同一朝向复用
                    reverse: !!routeReverse,
                    aiAuto: aiLearnUsed,
                    win,
                    wavesCleared: s.wavesCleared,
                    totalWaves,
                    builds: (s.builds || []).slice(),
                    upgrades: (s.upgrades || []).slice(),
                    drafts: (s.drafts || []).slice(),
                    towersBuilt: s.towersBuilt,
                    kills: s.kills,
                    leaked: st.red || 0,
                    baseBreachesByRole: { ...(s.baseBreachesByRole || {}) },
                    baseBreachesByEnemy: { ...(s.baseBreachesByEnemy || {}) },
                    coreStolenByRole: { ...(s.coreStolenByRole || {}) },
                    coreStolenByEnemy: { ...(s.coreStolenByEnemy || {}) },
                    coreLossByRole: { ...(s.coreLossByRole || {}) },
                    coreLossByEnemy: { ...(s.coreLossByEnemy || {}) },
                    basePathLength: s.basePathLength || 0,
                    pathLength: routes.reduce((sum, r) => sum + Math.max(0, r.pts.length - 1), 0),
                    score: gameResult.score,
                    moneyLeft: Math.floor(money)
                });
                const _ls = AI_LEARN.getSummary();
                aiAddMessage(`📊 本局已记录（${aiLearnUsed ? 'AI 参与' : '纯手动'}）：${win ? '胜' : '负'}。累计记录 ${_ls.games} 局，AI 学习样本 ${_ls.aiGames} 局。`, 'bot');
                if (aiLearnUsed && _ls.lastLesson && _ls.lastLesson.text) {
                    aiAddMessage(`🧠 本局复盘：${_ls.lastLesson.text}`, 'bot');
                }
            } catch (err) { console.error('学习记录失败', err); }

            if (win) SFX.win(); else SFX.lose();
        }

        function continueToEndless() {
            // 兜底：不是从超级研磨通关进来的一律拒绝，避免任何路径绕开入口判定
            if (currentModeKey !== 'grind') return;
            closeBuildMenu(); closeTowerMenu(); hideTip(); hideSellButton();
            selectedTower = null; draftPanel = null; draftQueue = [];
            pendingAutoEnemyBoost = false;

            const keepRogue = !!rogueState;
            const fromGrind = currentModeKey === 'grind';
            // 保存开启无尽前的超级研磨奖牌，供无尽失败/结束时沿用。
            if (gameResult) {
                endlessEntryMedalSnapshot = {
                    medal: gameResult.medal || 'copper',
                    score: Number(gameResult.score) || 0,
                    difficulty: Number(gameResult.difficulty) || 0,
                    towersBuilt: Number(gameResult.towersBuilt) || 0,
                    ai: !!gameResult.aiAssisted,
                    medalThresholds: gameResult.medalThresholds || null
                };
            }

            currentModeKey = 'endless';
            rogueEnabled = keepRogue;
            GAME_STATS.recordPlay(levelIndex, 'endless', keepRogue);

            // 保留当前速度设置，仅解除暂停状态
            paused = false;
            speedBtn.textContent = `⏩ ${speedMultiplier}x`;
            pauseBtn.textContent = '⏸ 暂停';
            pauseBtn.classList.remove('active');
            const lv = LEVELS[levelIndex];
            const mode = MODES.endless;
            waves = generateWaves(levelDifficulty(lv), 'endless', mode.hpMul, levelIndex);
            totalWaves = waves.length;
            if (fromGrind) waveIndex = 99;
            waveRuntime = [];

            // ── 修复：清空残留敌人/弹道，重置时钟，保证无尽模式立即开始刷新波次 ──
            enemies = [];
            projectiles = [];
            gameClock = 0;
            lastTime = 0;
            nextWaveAt = 8.0;
            waveIntervalNext = getWaveInterval(lv, waveIndex);
            waveCountdownStarted = true;

            gameOver = false; gameResult = null;
            resultBtnHover = false; endlessBtnHover = false;
            updateUI();
            gameTitle.textContent = `⚡ ${levelIndex + 1} ${lv.name} · ${mode.name}${routeReverse ? ' · 🔀 路线反转' : ''}${chaosEnabled ? ' · 混乱' : ''}${rogueState ? ' · Roguelike' : ''}${selectedAscension > 0 ? ' · 进阶'+selectedAscension : ''} ⚡`;
            msgDisplay.textContent = `♾ 无尽模式 · 第 ${waveIndex + 1} 波来袭！${rogueState ? ' · Roguelike 强化保留' : ''}`;
            canvas.style.cursor = 'crosshair';
        }

        function drawResultPanel() {

            const cx = L.x + L.w / 2;
            ctx.fillStyle = 'rgba(2, 6, 14, 0.84)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            roundRect(ctx, L.x, L.y, L.w, L.h, 16); ctx.fill();

            ctx.strokeStyle = r.win ? '#3a7ec0' : '#a05a5a';
            ctx.lineWidth = 2;
            roundRect(ctx, L.x, L.y, L.w, L.h, 16); ctx.stroke();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 26px "Microsoft YaHei"';
            ctx.fillStyle = r.win ? '#7ec8ff' : '#ff8866';
            ctx.shadowColor = r.win ? '#2a6fdb' : '#aa3322'; ctx.shadowBlur = 20;
            ctx.fillText(r.win ? '🎉 关卡通过！' : '💀 核心全部丢失', cx, L.y + 44);
            ctx.shadowBlur = 0;
            ctx.font = '13px "Microsoft YaHei"';
            ctx.fillStyle = '#7a9ac0';
            ctx.fillText(`#${r.levelNum} ${r.levelName} · ${r.modeName}`, cx, L.y + 76);
            ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(L.x + 36, L.y + 96);
            ctx.lineTo(L.x + L.w - 36, L.y + 96);
            ctx.stroke();
            const totalLabel = r.endless ? '∞' : r.totalWaves;
            const rows = [
                ['完成波次', `${r.wavesCleared} / ${totalLabel}`],
                ['击杀敌人', `${r.kills}`],
                ['丢失核心', `${r.leaked}`],
                ['剩余核心', `${r.cores}`],
                ['剩余资金', `${r.money}`],
                ['建塔总数', `${r.towersBuilt}`],
                ['游玩时间', formatTime(r.playTime || 0)]
            ];
            if (r.rogue && rogueState) rows.push(['强化次数', String(rogueState.upgrades.length)]);
            if (r.enhancementUnlock) {
                const eu = r.enhancementUnlock;
                const tname = (TOWER_TYPES[eu.type] || {}).name || eu.type;
                const ename = ((TOWER_ENHANCEMENTS[eu.type] || [])[eu.idx] || {}).name || '增强';
                rows.push(['🔓 金牌奖励', `${tname} · ${ename}`]);
            } else if (r.goldRepeat) {
                rows.push(['🔓 金牌奖励', '本关金牌已记录（重复不再解锁）']);
            }
            ctx.font = '14px "Microsoft YaHei"';
            for (let i = 0; i < rows.length; i++) {
                const y = L.y + 124 + i * 26;
                ctx.textAlign = 'left'; ctx.fillStyle = '#7a9ac0';
                ctx.fillText(rows[i][0], L.x + 48, y);
                ctx.textAlign = 'right'; ctx.fillStyle = '#c0dcff';
                ctx.fillText(rows[i][1], L.x + L.w - 48, y);
            }
            const boxY = L.y + L.h - 180;
            ctx.fillStyle = 'rgba(20, 34, 54, 0.9)';
            roundRect(ctx, L.x + 48, boxY, L.w - 96, 56, 10);
            ctx.fill();
            ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1; ctx.stroke();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 14px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText('本场得分', L.x + 68, boxY + 28);
            // 分数与本局奖牌、进阶难度并排显示
            ctx.textAlign = 'right';
            ctx.font = 'bold 27px "Microsoft YaHei"';
            ctx.fillStyle = '#ffd966'; ctx.shadowColor = '#aa7722'; ctx.shadowBlur = 12;
            ctx.fillText(String(r.score), L.x + L.w - 190, boxY + 29);
            ctx.shadowBlur = 0;
            const medalColors = { gold: '#ffd966', silver: '#d8e3ef', copper: '#d99a65' };
            ctx.font = 'bold 15px "Microsoft YaHei"';
            ctx.fillStyle = medalColors[r.medal] || '#d99a65';
            ctx.fillText(getMedalLabel(r.medal) + ' · 难度 ' + (r.difficulty || 0), L.x + L.w - 62, boxY + 29);
            if (r.showEndless) {
                const eb = getResultEndlessBtnRect();
                ctx.fillStyle = endlessBtnHover ? '#2f7a5a' : '#173a2e';
                roundRect(ctx, eb.x, eb.y, eb.w, eb.h, 18); ctx.fill();
                ctx.strokeStyle = endlessBtnHover ? '#4affd0' : '#2e6a52';
                ctx.lineWidth = endlessBtnHover ? 2 : 1.5; ctx.stroke();
                if (endlessBtnHover) {
                    ctx.shadowColor = '#4affd0'; ctx.shadowBlur = 16;
                    roundRect(ctx, eb.x, eb.y, eb.w, eb.h, 18); ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 14px "Microsoft YaHei"';
                ctx.fillStyle = endlessBtnHover ? '#ffffff' : '#8fffd8';
                ctx.fillText('🔁 进入无尽模式', eb.x + eb.w / 2, eb.y + eb.h / 2 + 1);
            }
            const btn = getResultBtnRect();
            ctx.fillStyle = resultBtnHover ? '#2f5f9a' : '#1f3c5e';
            roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 22); ctx.fill();
            ctx.strokeStyle = resultBtnHover ? '#7ec8ff' : '#3a6a9a';
            ctx.lineWidth = resultBtnHover ? 2 : 1.5; ctx.stroke();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 16px "Microsoft YaHei"';
            ctx.fillStyle = resultBtnHover ? '#ffffff' : '#c0dcff';
            ctx.fillText('确定 · 返回关卡选择', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);
        }

        const MAP_STYLE_ORDER = ['void', 'moon', 'lava', 'ice', 'forest', 'desert', 'crystal', 'ruins'];

        function mapStyleKeyForLevel(idx, lv) {
            const n = (lv && lv.name) ? lv.name : '';
            const en = n.toLowerCase();
            if (/烈日|赤岩|熔|火|炎|电站|熔炉/.test(n) || /forge|furnace|magma|ember|lava/.test(en)) return 'lava';
            if (/冰|零度|雪|霜|深蓝|寒/.test(n) || /ice|frost|snow|glacier/.test(en)) return 'ice';
            if (/沙|漠|旱|荒野|黄砂|石林/.test(n) || /sand|dune|desert/.test(en)) return 'desert';
            if (/水晶|晶|矿|紫|秘法|幻境/.test(n) || /crystal|gem|quarry|glow/.test(en)) return 'crystal';
            if (/森林|丛林|翡翠|毒沼|洞穴|地下|暗影|银月|苔|沼/.test(n) || /forest|grove|jungle|moss|swamp|cave|veil/.test(en)) return 'forest';
            if (/月|星|浮空|空港|港|苍穹/.test(n) || /moon|lunar|orbit|star/.test(en)) return 'moon';
            if (/遗迹|废墟|神殿|圣|碑|远古|王座|祭坛/.test(n) || /ruin|temple|ancient|shrine|tomb/.test(en)) return 'ruins';
            if (/钢|铁|要塞|枢纽|哨站|车站|堡垒|防线|回廊|核心|幽影|峡谷|评估/.test(n) || /steel|iron|fort|station|hub|core|gate|factory|barrier|lockdown|power|outpost|support/.test(en)) return 'void';
            return MAP_STYLE_ORDER[idx % MAP_STYLE_ORDER.length];
        }

        function currentMapStyle() {
            return MAP_STYLES[mapStyleKey] || MAP_STYLES.void;
        }

        // ---------- 随机风景 ----------
        function styleHash(a, b) {
            let h = (a | 0) * 73856093 ^ (b | 0) * 19349663 ^ (mapStyleSeed * 83492791);
            h = (h ^ (h >>> 13)) * 1274126177;
            return ((h ^ (h >>> 16)) >>> 0) % 100000 / 100000;
        }

        function drawMapDeco(g, kind, cx, cy, s, h1, h2, P, alpha) {

                    g.fillStyle = P.light;

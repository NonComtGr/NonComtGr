        #pauseBtn { background: #1a2a4a; color: #8fc4ff; box-shadow: inset 0 -2px 0 #2a4a7a; }

        #soundBtn { background: #1a3a2a; color: #7dffb0; box-shadow: inset 0 -2px 0 #2a6a4a; }

        /* ============================================================
   移动端 / 触摸屏适配
   ============================================================ */
html, body {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
}
canvas { touch-action: none; }

#rotateHint { display: none; }

        @media (pointer: coarse) {
            html, body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
                overscroll-behavior: none;
            }
            body {
                display: block;
                background: #05080f;
            }

            .game-wrapper {
                width: 100vw;
                height: 100vh;                 /* 老浏览器回退 */
                height: 100dvh;                /* 动态视口 */
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                background: #05080f;
                display: flex;                 /* ★ 改成 flex column */
                flex-direction: column;
                overflow: hidden;
            }
            #gameTitle { display: none; }

            /* ★ 关键：包裹层用 flex 吃掉剩余高度，min-height:0 允许它缩小 */
            .canvas-wrap {
                flex: 1 1 0;
                min-height: 0;                 /* ★ 核心修复 */
                min-width: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .canvas-wrap > #gameCanvas {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                box-shadow: none;
                cursor: default;
                touch-action: none;
            }

            .save-bar {
                flex: 0 0 auto;
                margin: 0;
                padding: 3px 6px;
                min-height: 0;
                gap: 6px;
                background: #05080f;
            }
            .save-bar .save-info { display: none; }
            .save-bar button.action { height: 26px; font-size: 11px; padding: 0 8px; }

            .hud {
                flex: 0 0 auto;                /* ★ 不再被挤走 */
                margin: 0;
                padding: 4px 6px 6px;
                gap: 4px;
                min-height: 0;
                background: #05080f;
            }
            .hud > div { gap: 4px !important; }
            .hud button.action {
                height: 30px;
                font-size: 11px;
                padding: 0 9px;
                border-radius: 15px;
            }

            .info-bar { display: none !important; }

            .tower-tip {
                font-size: 11px;
                max-width: 240px;
                padding: 7px 9px;
            }
            .tower-tip .tt-title { font-size: 12px; }
        }
        

        @media (pointer: coarse) and (orientation: portrait) {
            #rotateHint {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 99999;
                background: #05080f;
                color: #7ec8ff;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 14px;
                font-size: 16px;
                letter-spacing: 1px;
                text-align: center;
                padding: 24px;
            }
        }

/* 竖屏时盖一层提示 */

    #rotateHint {

        @media (pointer: coarse) {

            .ai-log { max-height:22vh; }
        }

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const moneyDisplay = document.getElementById('moneyDisplay');
        const coreDisplay = document.getElementById('coreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const msgDisplay = document.getElementById('msgDisplay');
        const sellBtn = document.getElementById('sellBtn');
        const speedBtn = document.getElementById('speedBtn');
        const nextWaveBtn = document.getElementById('nextWaveBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const hud = document.getElementById('hud');
        const infoBar = document.getElementById('infoBar');
        const gameTitle = document.getElementById('gameTitle');
        const tipEl = document.getElementById('towerTip');

        // ---------- 音效系统 ----------
        const SFX = (function () {
            let actx = null, master = null, enabled = true, noiseBuf = null;
            const lastAt = Object.create(null);
            function unlock() {
                if (!actx) {
                    try {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        actx = new AC();
                        master = actx.createGain();
                        master.gain.value = 0.5;
                        master.connect(actx.destination);
                    } catch (e) { actx = null; return; }
                }
                if (actx.state === 'suspended') actx.resume();
            }
            function ok() { return !!actx && enabled && actx.state === 'running'; }
            function throttle(key, ms) {
                const t = performance.now();
                const prev = lastAt[key];
                if (prev !== undefined && t - prev < ms) return false;
                lastAt[key] = t; return true;
            }
            function tone(freq, dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                const t0 = actx.currentTime + (opt.delay || 0);
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = opt.type || 'sine';
                osc.frequency.setValueAtTime(freq, t0);
                if (opt.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur);
                const vol = opt.vol == null ? 0.2 : opt.vol;
                const atk = opt.attack == null ? 0.004 : opt.attack;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.linearRampToValueAtTime(vol, t0 + atk);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(g); g.connect(master);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            }
            function noise(dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                if (!noiseBuf) {
                    const n = Math.max(1, Math.floor(actx.sampleRate * 0.6));
                    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
                    const d = noiseBuf.getChannelData(0);
                    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                }
                const t0 = actx.currentTime + (opt.delay || 0);
                const src = actx.createBufferSource();
                src.buffer = noiseBuf; src.loop = true;
                const flt = actx.createBiquadFilter();
                flt.type = opt.filter || 'lowpass';
                flt.frequency.setValueAtTime(opt.freq || 1200, t0);
                if (opt.to) flt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to), t0 + dur);
                flt.Q.value = opt.q == null ? 0.8 : opt.q;
                const g = actx.createGain();
                const vol = opt.vol == null ? 0.2 : opt.vol;
                g.gain.setValueAtTime(vol, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                src.connect(flt); flt.connect(g); g.connect(master);
                src.start(t0); src.stop(t0 + dur + 0.05);
            }
            return {
                unlock,
                toggle() { enabled = !enabled; return enabled; },
                isOn() { return enabled; },
                click() { if (!throttle('click', 45)) return; tone(720, 0.05, { type: 'triangle', vol: 0.08, to: 980 }); },
                error() { if (!throttle('error', 160)) return; tone(200, 0.11, { type: 'square', vol: 0.09, to: 130 }); tone(140, 0.13, { type: 'square', vol: 0.07, to: 90, delay: 0.07 }); },
                build() { if (!throttle('build', 50)) return; noise(0.09, { vol: 0.12, freq: 800, to: 2600, filter: 'bandpass', q: 1.4 }); tone(280, 0.10, { type: 'triangle', vol: 0.10, to: 540 }); },
                sell() { if (!throttle('sell', 50)) return; tone(640, 0.09, { type: 'triangle', vol: 0.09, to: 320 }); noise(0.10, { vol: 0.06, freq: 2400, to: 500 }); },
                upgrade() { if (!throttle('upgrade', 70)) return; tone(560, 0.08, { type: 'triangle', vol: 0.09, to: 820 }); tone(840, 0.10, { type: 'sine', vol: 0.07, to: 1180, delay: 0.06 }); },
                shoot(kind) {
                    switch (kind) {
                        case 'gun': if (!throttle('sh_gun', 70)) return; tone(820 + Math.random() * 180, 0.045, { type: 'square', vol: 0.04, to: 380 }); break;
                        case 'cannon': if (!throttle('sh_cannon', 120)) return; noise(0.14, { vol: 0.12, freq: 520, to: 90 }); tone(130, 0.15, { type: 'sine', vol: 0.13, to: 50 }); break;
                        case 'missile': if (!throttle('sh_missile', 120)) return; noise(0.22, { vol: 0.09, freq: 700, to: 2800, filter: 'bandpass', q: 2.2 }); tone(260, 0.20, { type: 'sawtooth', vol: 0.045, to: 720 }); break;
                        case 'flak': if (!throttle('sh_flak', 55)) return; noise(0.07, { vol: 0.075, freq: 2600, to: 900, filter: 'highpass' }); tone(1100, 0.05, { type: 'square', vol: 0.035, to: 520 }); break;

// 稀有度权重表（数值越小越不敏感，1 为标准）
const SYN_RARITY_WEIGHT = {
    dmg: 1.00, rate: 1.15, range: 1.40, crit: 2.60, slow: 1.60,
    poison: 1.00, stun: 0.70, splash: 0.90, burn: 1.00, harvest: 1.40,
    targets: 0.45, chain: 0.35, pierce: 0.70, reveal: 1.30
};

function calcSynergyRarity(s) {
    let w = 0;
    for (const k in s.mods) w += (SYN_RARITY_WEIGHT[k] || 1) * s.mods[k] * s.cap;
    if (w >= 0.85) return 'epic';
    if (w >= 0.60) return 'rare';
    if (w >= 0.38) return 'uncommon';
    return 'common';
}

function buildSynergyDesc(s) {
    const aName = TOWER_TYPES[s.a].name;
    const bName = TOWER_TYPES[s.b].name;
    const parts = [];
    for (const k in s.mods) {
        const meta = SYN_MOD_TEXT[k];
        if (!meta) continue;
        parts.push(`${meta.label} ${meta.fmt(s.mods[k])}`);
    }
    return `每有 1 座${bName}，${aName}${parts.join(' · ')}`;
}

        function applySavedState(s) {
            if (!s || s.v !== 1 || !LEVELS[s.levelIndex]) return false;

            closeBuildMenu(); closeTowerMenu(); hideTip();
            gameResult = null; resultBtnHover = false; endlessBtnHover = false;
            selectedTower = null; selectedEnemy = null; hideSellButton();
            draftPanel = null; draftQueue = []; pendingAutoEnemyBoost = false;

            levelIndex = s.levelIndex;
            currentModeKey = s.currentModeKey || 'story';
            routeReverse = !!s.routeReverse;
            rogueEnabled = !!s.rogueEnabled;
            selectedAscension = Math.max(0, Math.min(20, s.selectedAscension | 0));

            const mode = MODES[currentModeKey] || MODES.story;
            const lv = LEVELS[levelIndex];
            currentLevel = lv;

            zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, s.zoom || 1));
            computeLayoutForMap(mapRowCount(lv.map), mapColCount(lv.map));

            ascGameCollapsed = false; affixCollapsed = false;
            towerUpCollapsed = false; enemyModCollapsed = false;

            // ── 地图网格重建 ──
            wallGrid = []; buildableWall = []; noBuildGrid = []; straightGrid = [];
            for (let r = 0; r < ROWS; r++) {
                wallGrid.push(new Array(COLS).fill(false));
                buildableWall.push(new Array(COLS).fill(false));
                noBuildGrid.push(new Array(COLS).fill(false));
                straightGrid.push(new Array(COLS).fill(false));
            }
            starts = []; exits = []; bases = [];
            const hasExitTile = lv.map.some(row => row.indexOf('E') !== -1);
            for (let r = 0; r < ROWS; r++) {
                const rowStr = lv.map[r] || '';
                for (let c = 0; c < COLS; c++) {
                    const ch = rowStr[c];
                    if (ch === '#') wallGrid[r][c] = true;
                    else if (ch === 'X') { wallGrid[r][c] = true; buildableWall[r][c] = true; }
                    else if (ch === '.') noBuildGrid[r][c] = true;
                    else if (ch === '+') { straightGrid[r][c] = true; noBuildGrid[r][c] = true; }
                    else if (ch === 'S') { starts.push({ c, r }); if (!hasExitTile) exits.push({ c, r }); }
                    else if (ch === 'E') exits.push({ c, r });
                    else if (ch === 'C') bases.push({ c, r, cores: 0 });
                }
            }
            if (routeReverse && hasExitTile) { const tmp = starts; starts = exits; exits = tmp; }

            if (Array.isArray(s.bases)) {
                for (const sb of s.bases) {
                    const b = bases.find(bb => bb.c === sb.c && bb.r === sb.r);
                    if (b) b.cores = Math.max(0, sb.cores | 0);
                }
            }
            totalCores = s.totalCores || 0;
            lostCores = s.lostCores || 0;

            ascensionState = buildAscensionState();
            mudPits = (s.mudPits || []).map(p => ({ c: p.c, r: p.r }));
            savedInitialMudPits = s.savedMudPits
                ? s.savedMudPits.map(p => ({ c: p.c, r: p.r }))
                : null;

            // ── Roguelike 状态重建 ──
            rogueState = null;
            if (rogueEnabled && s.rogue) {
                const affixMap = new Map(ROGUE_AFFIXES.map(a => [a.id, a]));
                const upMap = new Map(ROGUE_UPGRADES.map(u => [u.id, u]));
                const synMap = new Map(ROGUE_SYNERGIES.map(x => [x.id, x]));
                const b = s.rogue.bonus || {};
                const em = s.rogue.enemyMods || {};
                rogueState = {
                    affixes: (s.rogue.affixIds || []).map(id => affixMap.get(id)).filter(Boolean),
                    synergies: (s.rogue.synergyIds || []).map(id => synMap.get(id)).filter(Boolean),
                    upgrades: (s.rogue.upgradeIds || []).map(id => upMap.get(id)).filter(Boolean),
                    bonus: {
                        dmg: b.dmg ?? 1, rate: b.rate ?? 1, range: b.range ?? 1,
                        priceMul: b.priceMul ?? 1,
                        critStacks: b.critStacks || 0, doubleShotStacks: b.doubleShotStacks || 0,
                        critChance: b.critChance || 0, critDmgMul: b.critDmgMul ?? 2,
                        enemySlow: b.enemySlow ?? 1, killBonus: b.killBonus || 0,
                        rewardMul: b.rewardMul ?? 1, revealRange: b.revealRange ?? 1,
                        sellMul: b.sellMul ?? 0.5,
                        ignoreShield: !!b.ignoreShield,
                        doubleShotChance: b.doubleShotChance || 0,
                        poisonBoost: !!b.poisonBoost,
                        currentHpDamage: b.currentHpDamage || 0,
                        charmStacks: b.charmStacks || 0, charmChance: b.charmChance || 0,
                        coreReturnSpeed: b.coreReturnSpeed ?? 1,
                        jammerRangeMul: b.jammerRangeMul ?? 1,
                        jamResist: b.jamResist || 0,
                        synergyScale: b.synergyScale ?? 1.0
                    },
                    moneyBonus: s.rogue.moneyBonus || 0,
                    moneyPicks: s.rogue.moneyPicks || 0,
                    enemyMods: {
                        hpMul: em.hpMul ?? 1, speedMul: em.speedMul ?? 1,
                        stunStacks: em.stunStacks || 0, stunMul: em.stunMul ?? 1,
                        dodgeStacks: em.dodgeStacks || 0, dodge: em.dodge || 0,
                        coreLock: !!em.coreLock, coreLockStacks: em.coreLockStacks || 0,
                        coreDelay: !!em.coreDelay, coreDelayStacks: em.coreDelayStacks || 0,
                        picks: Array.isArray(em.picks) ? em.picks.slice() : []
                    },
                    _pendingFreeUp: false, _pendingCoreRepair: false,
                    _pendingKillAll: false, _pendingStunAll: false
                };
            }

            // ── 波次重建（算法确定性一致）──
            waves = generateWaves(levelDifficulty(lv), currentModeKey, mode.hpMul, levelIndex);
            totalWaves = waves.length;
            if (rogueState) {
                for (const affix of rogueState.affixes) {
                    const m = affix.mod || {};
                    if (m.hpMul) {
                        for (const w of waves) for (const g of w.groups)
                            g.hp = Math.max(8, Math.round(g.hp * m.hpMul));
                    }
                    if (m.airHpMul || m.groundHpMul) {
                        for (const w of waves) for (const g of w.groups) {
                            const isAir = ENEMY_TYPES[g.type] && ENEMY_TYPES[g.type].air;
                            const mul = isAir ? (m.airHpMul || 1) : (m.groundHpMul || 1);
                            g.hp = Math.max(8, Math.round(g.hp * mul));
                        }
                    }
                    if (m.enemySpeedMul) {
                        for (const w of waves) for (const g of w.groups) g.speed *= m.enemySpeedMul;
                    }
                }
            }

            // ── 坐标映射（兼容不同分辨率 / 缩放）──
            const k = (s.cellPx && s.cellPx > 0) ? CELL / s.cellPx : 1;
            const ox0 = mapOffX - (s.offX || 0) * k;
            const oy0 = mapOffY - (s.offY || 0) * k;
            const mapX = (x) => ox0 + x * k;
            const mapY = (y) => oy0 + y * k;

            // ── 塔 ──
            towers = (s.towers || []).filter(td => TOWER_TYPES[td.type]).map(td => ({
                col: td.col, row: td.row, type: td.type,
                level: Math.max(1, Math.min(MAX_LEVEL, td.level | 0)),
                cooldown: td.cooldown || 0, invested: td.invested || 0,
                beamOn: false, beamTarget: null, beamTargets: null,
                angle: Number.isFinite(td.angle) ? td.angle : -Math.PI / 2,
                kills: td.kills || 0, damageDealt: td.damageDealt || 0,
                autoUpgrade: !!td.autoUpgrade,
                ammo: td.ammo == null ? 50 : td.ammo,
                isReloading: !!td.isReloading,
                heat: td.heat || 0, overheatTimer: td.overheatTimer || 0,
                slowTimer: td.slowTimer || 0, silenceTimer: td.silenceTimer || 0,
                jamResist: td.jamResist || 0
            }));
            const towerAt = (i) => (i >= 0 && i < towers.length) ? towers[i] : null;

            // ── 敌人 ──
            enemies = (s.enemies || []).filter(ed => ENEMY_TYPES[ed.type]).map(ed => ({
                type: ed.type, waveId: ed.waveId | 0,
                x: mapX(ed.x), y: mapY(ed.y),
                cellC: ed.cellC, cellR: ed.cellR,
                nextC: ed.nextC, nextR: ed.nextR,
                dirC: ed.dirC || 0, dirR: ed.dirR || 0,
                nextDirC: ed.nextDirC || 0, nextDirR: ed.nextDirR || 0,
                state: ed.state || 'toBase',
                carrying: ed.carrying || 0, steal: ed.steal || 1,
                hp: ed.hp, maxHp: ed.maxHp,
                shield: ed.shield || 0, maxShield: ed.maxShield || 0,
                speed: ed.speed, reward: ed.reward || 0,
                slowTimer: ed.slowTimer || 0, slowFactor: ed.slowFactor || 1,
                burnTimer: ed.burnTimer || 0, burnDps: ed.burnDps || 0,
                burnTower: towerAt(ed.burnTowerIdx),
                poison: Array.isArray(ed.poison)
                    ? ed.poison.map(p => ({ dps: p.dps, timer: p.timer }))
                    : [],
                stunTimer: ed.stunTimer || 0,
                healCd: ed.healCd == null ? 2.0 : ed.healCd,
                charmed: !!ed.charmed, isElite: !!ed.isElite,
                summonTimer: ed.summonTimer || 0, summonCd: ed.summonCd || 0,
                summonType: ed.summonType || null,
                lastHitBy: towerAt(ed.lastHitByIdx)
            }));

            // ── 预定建造 / 掉落核心 ──
            pendingBuilds = (s.pendingBuilds || [])
                .filter(o => TOWER_TYPES[o.type])
                .map(o => ({ col: o.col, row: o.row, type: o.type }));

            looseCores = (s.looseCores || []).map(c => ({
                x: mapX(c.x), y: mapY(c.y),
                cellC: c.cellC, cellR: c.cellR,
                nextC: c.nextC, nextR: c.nextR,
                dirC: c.dirC || 0, dirR: c.dirR || 0,
                nextDirC: c.nextDirC || 0, nextDirR: c.nextDirR || 0,
                delay: c.delay || 0, phase: c.phase || 0
            }));

            // ── 波次运行时 ──
            waveRuntime = (s.waveRuntime || []).map(rt => ({
                id: rt.id | 0,
                startAt: rt.startAt || 0,
                queue: (rt.queue || []).map(q => ({ ...q })),
                total: rt.total || 0,
                alive: rt.alive || 0,
                spawnGap: rt.spawnGap || 0.3,
                cleared: !!rt.cleared,
                reward: rt.reward || 0,
                draftGiven: !!rt.draftGiven
            }));

            // ── 计时与资源 ──
            money = s.money || 0;
            waveIndex = s.waveIndex | 0;
            playTime = s.playTime || 0;
            gameClock = s.gameClock || 0;
            nextWaveAt = s.nextWaveAt || 0;
            waveIntervalNext = s.waveIntervalNext || 10;
            waveCountdownStarted = !!s.waveCountdownStarted;
            globalAutoUpgrade = !!s.globalAutoUpgrade;
            battleStats = s.battleStats || { kills: 0, leaked: 0, towersBuilt: 0, wavesCleared: 0 };
            gameOver = false;
            projectiles = [];
            arrowAnimTime = 0;
            lastShownSecond = -1;
            lastTime = 0;

            rebuildActiveBaseField();
            rebuildBackground();
            updateUI();
            updateTimeDisplay();
            setScreen('game');

            speedMultiplier = s.speedMultiplier || 1;
            speedBtn.textContent = `⏩ ${speedMultiplier}x`;
            paused = !!s.paused;
            pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
            pauseBtn.classList.toggle('active', paused);

            gameTitle.textContent = `⚡ ${levelIndex + 1} ${lv.name} · ${mode.name}`
                + `${rogueEnabled ? ' · Roguelike' : ''}`
                + `${selectedAscension > 0 ? ' · 进阶' + selectedAscension : ''} ⚡`;
            return true;
        }

        function saveGame() {
            if (screen !== 'game' || !currentLevel || gameOver) {
                msgDisplay.textContent = '⚠ 只有在战斗进行中才能存档';
                SFX.error();
                return;
            }
            if (draftPanel) {
                msgDisplay.textContent = '⚠ 请先完成强化选择再存档';
                SFX.error();
                return;
            }
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(captureGameState()));
                SFX.click();
                msgDisplay.textContent = `💾 存档成功 · ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                msgDisplay.textContent = '⚠ 存档失败：浏览器存储空间不足或被禁用';
                SFX.error();
            }
            refreshSaveInfo();
        }

        function loadGame() {
            let raw = null;
            try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
            if (!raw) {
                msgDisplay.textContent = '⚠ 没有可读取的存档';
                SFX.error();
                return;
            }
            let s = null;
            try { s = JSON.parse(raw); } catch (e) { s = null; }
            if (!s) {
                msgDisplay.textContent = '⚠ 存档文件已损坏';
                SFX.error();
                return;
            }
            let ok = false;
            try { ok = applySavedState(s); } catch (e) {
                console.error('读档失败', e);
                ok = false;
            }
            if (!ok) {
                msgDisplay.textContent = '⚠ 存档与当前版本不兼容';
                SFX.error();
                return;
            }
            SFX.click();
            msgDisplay.textContent = '📂 存档已载入';
            refreshSaveInfo();
        }

        function refreshSaveInfo() {
            const infoEl = document.getElementById('saveInfo');
            const btn = document.getElementById('loadBtn');
            let raw = null;
            try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
            if (!raw) {
                if (infoEl) infoEl.textContent = '（无存档）';
                if (btn) btn.classList.add('disabled');
                return;
            }
            if (btn) btn.classList.remove('disabled');
            let ts = 0;
            try { ts = JSON.parse(raw).ts || 0; } catch (e) { ts = 0; }
            if (infoEl) {
                infoEl.textContent = ts
                    ? '上次存档：' + new Date(ts).toLocaleString()
                    : '已有存档';
            }
        }

            const d = TOWER_TYPES[type];

            let inflation = 0;
            if (ascensionState && ascensionState.inflation) {
                inflation = Math.min(100, Math.floor(waveIndex / 10) * 20);

            return Math.max(1, Math.round(d.cost * getPriceMul()) + inflation);
        }

            const base = getUpgradeCost(type, curLevel);
            if (base === null) return null;
            let inflation = 0;
            if (ascensionState && ascensionState.inflation) {
                inflation = Math.min(100, Math.floor(waveIndex / 10) * 20);
            }
            return Math.max(1, Math.round(base * getPriceMul()) + inflation);

        function makeField() {
            const f = [];
            for (let r = 0; r < ROWS; r++) f.push(new Array(COLS).fill(Infinity));
            return f;
        }
        function bfsFrom(field, sources, blocked) {
            const q = [];
            for (const s of sources) {
                if (s.c < 0 || s.c >= COLS || s.r < 0 || s.r >= ROWS) continue;
                if (blocked[s.r][s.c]) continue;
                if (field[s.r][s.c] === 0) continue;
                field[s.r][s.c] = 0;
                q.push([s.c, s.r]);
            }
            let head = 0;
            while (head < q.length) {
                const cur = q[head++];
                const c = cur[0], r = cur[1], d = field[r][c];
                for (const dir of DIRS) {
                    const nc = c + dir[0], nr = r + dir[1];
                    if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
                    if (blocked[nr][nc]) continue;
                    if (field[nr][nc] <= d + 1) continue;
                    field[nr][nc] = d + 1;
                    q.push([nc, nr]);
                }
            }
        }
        function findNextCellIn(field, c, r) {
            const d = field[r][c];
            if (!isFinite(d)) return null;
            let bestC = -1, bestR = -1, bestD = d;
            for (const dir of DIRS) {
                const nc = c + dir[0], nr = r + dir[1];
                if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
                const nd = field[nr][nc];
                if (nd < bestD) { bestD = nd; bestC = nc; bestR = nr; }
            }
            if (bestC < 0) return null;
            return { c: bestC, r: bestR };
        }
        function makeDirField() {
            const fields = [];
            for (let d = 0; d < 4; d++) fields.push(makeField());

        }
        function anyDirFinite(fieldDir, r, c) {
            for (let d = 0; d < 4; d++) if (isFinite(fieldDir[d][r][c])) return true;
            return false;
        }
        function bfsFromDir(fieldDir, sources, blocked) {
            const q = [];
            for (const s of sources) {
                if (s.c < 0 || s.c >= COLS || s.r < 0 || s.r >= ROWS) continue;
                if (blocked[s.r][s.c]) continue;
                for (let d = 0; d < 4; d++) {
                    if (fieldDir[d][s.r][s.c] === 0) continue;
                    fieldDir[d][s.r][s.c] = 0;
                    q.push([s.c, s.r, d]);
                }
            }
            let head = 0;
            while (head < q.length) {
                const cur = q[head++];
                const c = cur[0], r = cur[1], dEnter = cur[2];
                const curD = fieldDir[dEnter][r][c];
                for (let di = 0; di < 4; di++) {
                    if (straightGrid[r] && straightGrid[r][c] && di !== dEnter) continue;
                    const dc = DIRS[di][0], dr = DIRS[di][1];
                    const pc = c - dc, pr = r - dr;
                    if (pc < 0 || pc >= COLS || pr < 0 || pr >= ROWS) continue;
                    if (blocked[pr][pc]) continue;
                    const dOut = di;
                    if (straightGrid[pr] && straightGrid[pr][pc]) {
                        const dIn = dOut;
                        if (fieldDir[dIn][pr][pc] > curD + 1) {
                            fieldDir[dIn][pr][pc] = curD + 1;
                            q.push([pc, pr, dIn]);
                        }
                    } else {
                        for (let dIn = 0; dIn < 4; dIn++) {
                            if (fieldDir[dIn][pr][pc] > curD + 1) {
                                fieldDir[dIn][pr][pc] = curD + 1;
                                q.push([pc, pr, dIn]);
                            }
                        }
                    }
                }
            }
        }
        function findNextCellInDir(fieldDir, c, r, inDirC, inDirR) {
            const isStraight = straightGrid[r] && straightGrid[r][c];
            const unknownDir = (inDirC === 0 && inDirR === 0);
            let best = null, bestD = Infinity;
            for (let di = 0; di < 4; di++) {
                const dc = DIRS[di][0], dr = DIRS[di][1];
                if (isStraight && !unknownDir && (dc !== inDirC || dr !== inDirR)) continue;
                const nc = c + dc, nr = r + dr;
                if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
                if (wallGrid[nr][nc]) continue;
                const d = fieldDir[di][nr][nc];
                if (d < bestD) {
                    bestD = d;
                    best = { c: nc, r: nr, dirC: dc, dirR: dr };
                }
            }
            return best;
        }

function computeRoutesWithExtraBlocks(extraBlocks) {

        function routeSignature(routesArr) {

        function isBuildPathChanged() {
            if (!buildMenu) return false;

        function rebuildPaths() {

        function tracePathDir(fieldDir, startC, startR, endPred) {
            const pts = [];

                if (!nxt) break;

                dirC = nxt.dirC; dirR = nxt.dirR;

        function buildEnemyInfoHTML(e) {

            if (e.maxShield > 0) {
                html += `<tr><td style="text-align:left;color:#7a9ac0;">护盾</td><td style="color:#66aaff;">${Math.ceil(e.shield)} / ${Math.ceil(e.maxShield)}</td></tr>`;
            }

            html += `<tr><td style="text-align:left;color:#7a9ac0;">波次</td><td>第 ${e.waveId + 1} 波</td></tr>`;

            const traits = [];
            if (def.stealth) traits.push('隐形');

            const status = [];

            if (e.poison && e.poison.length) status.push(`<span style="color:#7aff4a;">中毒 ×${e.poison.length}</span>`);
            if (e.charmed) status.push(`<span style="color:#ff88dd;">魅惑</span>`);
            if (status.length) html += `<div class="tt-note">状态：${status.join(' · ')}</div>`;

            if (def.stealth && !enemyRevealed(e)) {

            }

            html += `<div class="hpbar-wrap" style="margin-top:6px;width:180px;max-width:100%;height:6px;background:#1a2536;border-radius:3px;overflow:hidden;">`
     +  `<div style="width:${hpPct * 100}%;height:100%;background:${hpColor};"></div></div>`;
            html += `<div class="tt-note" style="border-top:none;padding-top:2px;margin-top:2px;color:#7a9ac0;">点击空地取消选中</div>`;

        function getEnemyAt(mx, my) {
            let best = null, bestD = Infinity;
            const sf = CELL / baseCellPx;
            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const size = ENEMY_TYPES[e.type].size * sf * (e.isElite ? 1.3 : 1);
                const r = Math.max(size * 1.2, CELL * 0.42);
                const d = Math.hypot(e.x - mx, e.y - my);
                if (d <= r && d < bestD) { bestD = d; best = e; }
            }
            return best;
        }


        function showTipHTML(clientX, clientY, html) {
            tipEl.innerHTML = html;
            tipEl.classList.remove('hidden');
            tipEl.style.transform = 'none';
            tipEl.style.left = '0px';
            tipEl.style.top = '0px';

            // 临时解除限制，测出内容真实宽度
            tipEl.style.maxWidth = 'none';
            const table = tipEl.querySelector('table');
            const hpBar = tipEl.querySelector('.hpbar-wrap');
            let naturalW = 0;
            if (table) naturalW = Math.max(naturalW, table.offsetWidth);
            if (hpBar) naturalW = Math.max(naturalW, hpBar.offsetWidth);   // ★ 新增

            if (naturalW > 0) {
                const padX = 22;                          // 左右 padding 11×2
                const borderX = 2;                        // 左右 border 1×2
                const capW = window.innerWidth - 16;      // 屏幕边界保护
                tipEl.style.maxWidth = Math.min(naturalW + padX + borderX, capW) + 'px';
            } else {
                tipEl.style.maxWidth = '';                // 无表格时回退到 CSS 的 340px
            }

            const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
            let left = clientX + 18;
            if (left + tw > window.innerWidth - 8) left = clientX - tw - 18;
            left = Math.max(8, left);
            let top = clientY - th / 2;
            top = Math.max(8, Math.min(window.innerHeight - th - 8, top));
            tipEl.style.left = left + 'px';
            tipEl.style.top = top + 'px';
        }
        function showTipAt(clientX, clientY, type) { showTipHTML(clientX, clientY, buildTipHTML(type)); }
        function hideTip() { tipEl.classList.add('hidden'); }

        function getBuildMenuHeight() { return BUILD_MENU_ORDER.length * BUILD_ITEM_H + BUILD_MENU_PAD * 2; }
        function openBuildMenu(col, row) {
            closeTowerMenu();
            const totalH = getBuildMenuHeight();
            const cellX = cellLeft(col), cellY = cellTop(row);
            let x = cellX + CELL + 6;
            if (x + BUILD_MENU_W > canvas.width - 4) x = cellX - BUILD_MENU_W - 6;
            if (x < 4) x = 4;
            let y = cellY - (totalH - CELL) / 2;
            if (y < 4) y = 4;
            if (y + totalH > canvas.height - 4) y = canvas.height - totalH - 4;
            const previewRoutes = computeRoutesWithExtraBlock(col, row);
            const pathChanged = routeSignature(previewRoutes) !== routeSignature(routes);
            buildMenu = { col, row, x, y, w: BUILD_MENU_W, h: totalH, hover: -1, previewRoutes, pathChanged };
            hideTip();
            canvas.style.cursor = 'crosshair';
        }
        function closeBuildMenu() { if (!buildMenu) return; buildMenu = null; hideTip(); }

        function getBuildItemRect(i) {
            return { x: buildMenu.x + BUILD_MENU_PAD, y: buildMenu.y + BUILD_MENU_PAD + i * BUILD_ITEM_H, w: buildMenu.w - BUILD_MENU_PAD * 2, h: BUILD_ITEM_H };
        }
        function hitBuildItem(mx, my) {
            if (!buildMenu) return -1;
            for (let i = 0; i < BUILD_MENU_ORDER.length; i++) {
                const r = getBuildItemRect(i);
                if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
            }
            return -1;
        }

        function drawBuildRangePreview() {
            if (!buildMenu) return;
            const hover = buildMenu.hover;
            if (hover < 0 || hover >= BUILD_MENU_ORDER.length) return;
            const type = BUILD_MENU_ORDER[hover];
            const def = TOWER_TYPES[type];
            if (!def) return;
            const baseStats = towerStatsAt(type, 1);
            if (!baseStats || !baseStats.range) return;
            const px = cellCenterX(buildMenu.col), py = cellCenterY(buildMenu.row);
            let rangeMul = 1;
            if (type !== 'amplifier') {
                for (const t of towers) {
                    if (t.type !== 'amplifier') continue;
                    const ast = towerStatsAt('amplifier', t.level);
                    const d = Math.hypot(px - cellCenterX(t.col), py - cellCenterY(t.row));
                    if (d <= ast.range * CELL) rangeMul += ast.boost.range;
                }
            }
            const radius = baseStats.range * CELL * rangeMul;
            const affordable = money >= getBuildCost(type);
            const hue = affordable ? '126, 200, 255' : '255, 120, 120';
            ctx.save();
            ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${hue}, 0.09)`; ctx.fill();
            ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${hue}, 0.75)`; ctx.lineWidth = 1.8;
            ctx.setLineDash([7, 6]); ctx.lineDashOffset = -(arrowAnimTime * 26) % 13;
            ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(px, py, radius * 0.55, 0, Math.PI * 2);
                        // ★ 新增：绘制隐形检测半径（仅攻击塔）
            if (!['temporal', 'amplifier', 'harvester'].includes(type)) {
                const revealR = STEALTH_REVEAL_RANGE * CELL;
                ctx.beginPath(); ctx.arc(px, py, revealR, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200, 150, 255, 0.55)';
                ctx.lineWidth = 1.4;
                ctx.setLineDash([3, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                // 小标识文字
                ctx.font = 'bold 10px "Microsoft YaHei"';
                ctx.fillStyle = 'rgba(200, 150, 255, 0.7)';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('👁', px, py - revealR - 8);
            }
            // 满级减速塔的揭示射程（与射程相同，无需额外绘制）
            ctx.strokeStyle = `rgba(${hue}, 0.22)`; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + radius, py);
            ctx.strokeStyle = `rgba(${hue}, 0.3)`; ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
        }

                function getTowerMenuScale() {
            const touch = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
            if (!touch) return 1;
            const rect = canvas.getBoundingClientRect();
            const cssW = (rect && rect.width > 0) ? rect.width : canvas.width;
            const k = canvas.width / cssW;      // 每个 CSS 像素对应多少内部像素
            // 目标：菜单在屏幕上约 250 × 132 CSS px
            const s = Math.max(250 * k / TOWER_MENU_W, 132 * k / TOWER_MENU_H);
            return Math.max(1.2, Math.min(3.5, s));
        }

        function openTowerMenu(col, row) {
            closeBuildMenu();
            const s = getTowerMenuScale();
            const w = Math.round(TOWER_MENU_W * s), h = Math.round(TOWER_MENU_H * s);
            const cellX = cellLeft(col), cellY = cellTop(row);
            let x = cellX + CELL + 6;
            if (x + w > canvas.width - 4) x = cellX - w - 6;
            if (x < 4) x = 4;
            let y = cellY - (h - CELL) / 2;
            if (y < 4) y = 4;
            if (y + h > canvas.height - 4) y = canvas.height - h - 4;
            towerMenu = { col, row, x, y, w, h, s, hoverCheck: false, hoverSell: false };
            hideTip();
        }
        function closeTowerMenu() { if (!towerMenu) return; towerMenu = null; }
                function getTowerMenuCheckRect() {

        function getTowerMenuSellRect() {
            if (!towerMenu) return null;
            const s = towerMenu.s || 1;
            return { x: towerMenu.x + 12 * s, y: towerMenu.y + 62 * s, w: (TOWER_MENU_W - 24) * s, h: 24 * s };
        }

        function drawTowerMenu() {
            if (!towerMenu) return;
            const m = towerMenu;
            const t = towers.find(tt => tt.col === m.col && tt.row === m.row);
            if (!t) { towerMenu = null; return; }
            const d = TOWER_TYPES[t.type];
            const lvColor = LEVEL_COLORS[Math.min(Math.max(t.level, 1), MAX_LEVEL) - 1];
            const s = m.s || 1;

            // 选中格子高亮
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 217, 102, 0.9)';
            ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
            ctx.strokeRect(cellLeft(m.col) + 3, cellTop(m.row) + 3, CELL - 6, CELL - 6);
            ctx.setLineDash([]); ctx.restore();

            // 菜单背景
            ctx.save();
            ctx.shadowColor = 'rgba(60, 140, 220, 0.45)'; ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(10, 17, 30, 0.97)';
            roundRect(ctx, m.x, m.y, m.w, m.h, 10 * s); ctx.fill();
            ctx.shadowBlur = 0; ctx.strokeStyle = '#3a6a9a'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.restore();

            // 内容按设计坐标 190×96 绘制，整体缩放 s
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.scale(s, s);

            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 13px "Microsoft YaHei"'; ctx.fillStyle = lvColor;
            ctx.fillText(`${d.icon} ${d.name} Lv.${t.level}`, 12, 20);

            const cr = { x: 12, y: 34, w: 20, h: 20 };
            ctx.fillStyle = t.autoUpgrade ? 'rgba(42, 95, 138, 0.9)' : '#1a2536';
            roundRect(ctx, cr.x, cr.y, cr.w, cr.h, 4); ctx.fill();
            ctx.strokeStyle = (m.hoverCheck || t.autoUpgrade) ? '#7ec8ff' : '#3a5a7e';
            ctx.lineWidth = 1.5; ctx.stroke();
            if (t.autoUpgrade) {
                ctx.strokeStyle = '#7ec8ff'; ctx.lineWidth = 2.4;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(cr.x + 4, cr.y + 10); ctx.lineTo(cr.x + 8, cr.y + 15); ctx.lineTo(cr.x + 16, cr.y + 5);
                ctx.stroke();
            }
            ctx.font = 'bold 12px "Microsoft YaHei"';
            ctx.fillStyle = t.autoUpgrade ? '#ffffff' : '#c0dcff';
            ctx.fillText('自动升级', cr.x + 28, cr.y + cr.h / 2 + 1);

            ctx.textAlign = 'right';
            ctx.font = '11px "Microsoft YaHei"';
            if (t.level >= MAX_LEVEL) {
                ctx.fillStyle = '#5a7fa8';
                ctx.fillText('已满级', TOWER_MENU_W - 12, cr.y + cr.h / 2 + 1);
            } else {
                const up = getUpgradeCostEffective(t.type, t.level);
                ctx.fillStyle = money >= up ? '#ffd966' : '#ff6666';
                ctx.fillText(`${up}💰`, TOWER_MENU_W - 12, cr.y + cr.h / 2 + 1);
            }

            const sr = { x: 12, y: 62, w: TOWER_MENU_W - 24, h: 24 };
            const price = getSellValue(t);
            ctx.fillStyle = m.hoverSell ? '#7a2a2a' : '#3a1414';
            roundRect(ctx, sr.x, sr.y, sr.w, sr.h, 8); ctx.fill();
            ctx.strokeStyle = m.hoverSell ? '#ff8866' : '#5a2a2a'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px "Microsoft YaHei"'; ctx.fillStyle = '#ff8866';
            ctx.fillText(`出售 +${price}`, sr.x + sr.w / 2, sr.y + sr.h / 2 + 1);

            ctx.restore();
        }

        function updateAutoUpgrade() {
            let reserved = 0;
            for (const order of pendingBuilds) {
                reserved += getBuildCost(order.type);
            }
            let changed = false;
            for (const t of towers) {
                if (!t.autoUpgrade) continue;
                let guard = 0;
                while (t.level < MAX_LEVEL && guard++ < MAX_LEVEL) {
                    const cost = getUpgradeCostEffective(t.type, t.level);
                    if (cost === null) break;
                    if (money - cost < reserved) break;
                    money -= cost; t.level++; t.invested += cost; changed = true;
                    if (ascensionState && ascensionState.ammo) t.ammo = 50;
                    SFX.upgrade();
                    msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动升级 → Lv.${t.level}`;
                }
            }

// 沿路径采样，返回长度、转弯数、被 N 座塔覆盖的加权长度
function aiPathQuality(routesArr, coverFn) {
    let length = 0, turns = 0, weightedLen = 0, coveredPts = 0, totalPts = 0;
    for (const route of routesArr) {
        const pts = route && route.pts;
        if (!pts || pts.length < 2) continue;
        let prevX = 0, prevY = 0, hasPrev = false;
        for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const cov = coverFn ? coverFn(p.x, p.y) : 0;
            if (cov > 0) coveredPts++;
            totalPts++;
            if (i === 0) continue;
            const q = pts[i - 1];
            const dx = p.x - q.x, dy = p.y - q.y;
            const d = Math.hypot(dx, dy);
            if (d < 0.0001) continue;
            length += d;
            weightedLen += d * cov;
            const ux = dx / d, uy = dy / d;
            if (hasPrev && (prevX * ux + prevY * uy) < 0.85) turns++;   // 方向变化 > ~31°
            prevX = ux; prevY = uy; hasPrev = true;
        }
    }
    return { length, turns, weightedLen, coveredPts, totalPts };
}

// 构造覆盖函数：任意像素点被多少座塔覆盖（含射程/增幅/联动/全局加成）
// extraSpec 可选：{ type, col, row } 用于"若在此建塔"的模拟
function aiMakeCoverFn(towerList, extraSpec) {
    const entries = [];
    const pushOne = (type, level, col, row, buffs, syn) => {
        if (!TOWER_TYPES[type]) return;
        if (['temporal', 'amplifier', 'harvester'].includes(type)) return;
        const st = towerStatsAt(type, level);
        const baseRange = st.range || TOWER_TYPES[type].range || 0;
        const bfR = (buffs && buffs.range) || 1;
        const synR = 1 + ((syn && syn.range) || 0);
        const rbR = (rogueState && rogueState.bonus && rogueState.bonus.range) || 1;
        const rr = baseRange * bfR * synR * rbR * CELL;
        entries.push({ x: cellCenterX(col), y: cellCenterY(row), r2: rr * rr });
    };
    for (const t of towerList) pushOne(t.type, t.level, t.col, t.row, t.buffs, t.syn);
    if (extraSpec) pushOne(extraSpec.type, 1, extraSpec.col, extraSpec.row, null, null);
    return function (px, py) {
        let n = 0;
        for (let i = 0; i < entries.length; i++) {
            const dx = px - entries[i].x, dy = py - entries[i].y;
            if (dx * dx + dy * dy <= entries[i].r2) n++;
        }
        return n;
    };
}

// 新塔自身射程覆盖新路径的比例（每 2 个点采样一次，控制成本）
function aiSelfCoverRatio(newRoutes, col, row, type) {
    if (!TOWER_TYPES[type]) return 0;
    const st = towerStatsAt(type, 1);
    const rr = (st.range || TOWER_TYPES[type].range || 0) * CELL;
    const rr2 = rr * rr;
    const cx = cellCenterX(col), cy = cellCenterY(row);
    let covered = 0, total = 0;
    for (const route of newRoutes) {
        const pts = route && route.pts;
        if (!pts || pts.length < 2) continue;
        for (let i = 0; i < pts.length; i += 2) {
            const dx = pts[i].x - cx, dy = pts[i].y - cy;
            if (dx * dx + dy * dy <= rr2) covered++;
            total++;
        }
    }
    return total > 0 ? covered / total : 0;
}

function aiPlanStrategy() {
    try {
        if (screen !== 'game' || gameOver || !routes.length) return;

        const key = levelIndex + '|' + currentModeKey + '|' + routeReverse + '|' + rogueEnabled;
        if (aiStrategyPlan && aiStrategyPlan.key === key) return;

        const nodes = aiGetPathNodes();
        if (!nodes.length) { aiStrategyPlan = null; return; }

        // ── 候选池：路径附近 radius=3 的格 ──
        const candidateSet = new Set();
        const radius = 3;
        for (const n of nodes) {
            const cc = Math.round(n.x), rr = Math.round(n.y);
            for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
                if (dx * dx + dy * dy > radius * radius) continue;
                const c = cc + dx, r = rr + dy;
                if (c >= 0 && c < COLS && r >= 0 && r < ROWS) candidateSet.add(r * COLS + c);
            }
        }

        // 统一的合法性检查
        const isCellUsable = (c, r) => {
            if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
            if (noBuildGrid[r] && noBuildGrid[r][c]) return false;
            if (wallGrid[r] && wallGrid[r][c] && !buildableWall[r][c]) return false;
            if (bases.some(b => b.c === c && b.r === r)) return false;
            if (exits.some(x => x.c === c && x.r === r)) return false;
            if (starts.some(s => s.c === c && s.r === r)) return false;
            if (towers.some(t => t.col === c && t.row === r)) return false;
            try { return canBuildAt(c, r); } catch (e) { return false; }
        };

        // ── 基准路径质量 ──
        const beforeQ = aiPathQuality(routes, null);
        const baseLength = Math.max(1, beforeQ.length);
        const targetLength = baseLength * 2.8;
        const towerCap = Math.min(20, Math.max(10, Math.round(baseLength / CELL / 2)));
        const minGainPerTower = CELL * 0.65;

        // ── 第一轮：基于"原路径 + 单点"评估每个候选的路径增益 ──
        // （不累积模拟，避免依赖新函数；邻格剔除保证不堆叠）
        const evaluated = [];
        for (const ck of candidateSet) {
            const c = ck % COLS, r = Math.floor(ck / COLS);
            if (!isCellUsable(c, r)) continue;
            try {
                const newRoutes = computeRoutesWithExtraBlock(c, r);
                if (!newRoutes || !newRoutes.length) continue;
                const afterQ = aiPathQuality(newRoutes, null);
                const gain = afterQ.length - baseLength;
                if (gain < 0) continue;
                const turnGain = Math.max(0, afterQ.turns - beforeQ.turns);
                const selfCover = aiSelfCoverRatio(newRoutes, c, r, 'cannon');
                const rawScore = gain * (1 + Math.min(0.5, turnGain * 0.08)) * (0.5 + selfCover * 0.7);
                evaluated.push({ c, r, gain, turnGain, selfCover, rawScore });
            } catch (err) { continue; }
        }

        evaluated.sort((a, b) => b.rawScore - a.rawScore);

        // ── 第二轮：贪心选点，剔除邻格；边际收益低于阈值就停 ──
        const positions = [];
        if (evaluated.length) {
            let idx = 0;
            while (positions.length < towerCap && idx < evaluated.length) {
                const top = evaluated[idx];
                // 第一座塔强制选；之后低于阈值就停
                if (positions.length >= 1 && top.rawScore < minGainPerTower) break;
                positions.push({
                    col: top.c, row: top.r,
                    baseScore: top.rawScore, gain: top.gain,
                    turnGain: top.turnGain, selfCover: top.selfCover
                });
                // 剔除邻格
                idx = 0;
                while (idx < evaluated.length) {
                    if (Math.abs(evaluated[idx].c - top.c) <= 1 && Math.abs(evaluated[idx].r - top.r) <= 1) {
                        evaluated.splice(idx, 1);
                    } else idx++;
                }
            }
        }

        // ── 兜底：如果路径完全无法延长（开阔地图开局），退回到"靠近路径的格子" ──
        if (!positions.length) {
            const relaxed = [];
            for (const ck of candidateSet) {
                const c = ck % COLS, r = Math.floor(ck / COLS);
                if (!isCellUsable(c, r)) continue;
                let minDist = Infinity;
                for (const n of nodes) {
                    const dd = Math.hypot(n.x - (c + 0.5), n.y - (r + 0.5));
                    if (dd < minDist) minDist = dd;
                }
                relaxed.push({ c, r, dist: minDist });
            }
            relaxed.sort((a, b) => a.dist - b.dist);
            const need = Math.min(towerCap, relaxed.length);
            for (let i = 0; i < need; i++) {
                positions.push({
                    col: relaxed[i].c, row: relaxed[i].r,
                    baseScore: 0, gain: 0, turnGain: 0, selfCover: 1
                });
            }
        }

        if (!positions.length) { aiStrategyPlan = null; return; }

        aiStrategyPlan = { key, positions, idx: 0, baseLength };
        const totalGain = positions.reduce((s, p) => s + (p.gain || 0), 0);
        const pct = totalGain > 0 ? Math.round(totalGain / baseLength * 100) : 0;
        aiAddMessage(
            `🗺️ 路线规划：${positions.length} 个建塔位置（预计路径延长约 ${pct}%）`,
            'bot'
        );
    } catch (err) {
        // 任何异常都不应该让 AI 完全瘫痪
        console.error('[aiPlanStrategy] 异常:', err);
        aiStrategyPlan = null;
    }
}

                const st = ENEMY_STATS[type] || {};
                // 精英降临：10% 概率属性 ×1.5，故期望生命/速度系数为 1.05。
                const eliteHpMul = AI_ASCENSION_STATE.elite ? 1.05 : 1;
                counts[type] = { count, hp: (st.hpFactor || 1) * count * eliteHpMul };
            }

            // 梦魇重生：每只首领死亡后分裂成两只巨兽；最终审判额外首领血量更高。
            if (AI_ASCENSION_STATE.bossSplit && counts.brute && counts.boss) {
                const regularBosses = Math.max(0, counts.boss.count - (isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 2 : 0));
                const extraBosses = isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 2 : 0;
                const splitBrutes = regularBosses * 2 + extraBosses * 2;
                const bruteHp = (ENEMY_STATS.boss.hpFactor || 45) * 0.30 * regularBosses * 2 +
                    (ENEMY_STATS.boss.hpFactor || 45) * 1.6 * 0.30 * extraBosses * 2;
                counts.brute.count += splitBrutes;
                counts.brute.hp += bruteHp;
            }

            // 孵化母体与召唤者会把波次规模继续放大；把预期增援折算为普通群怪压力。
            const hatcherCount = counts.hatcher ? counts.hatcher.count : 0;
            const summonerCount = counts.summoner ? counts.summoner.count : 0;
            const hatchKinds = Math.min(4, 1 + Math.floor(waveOrdinal / 8));
            const hatchPerKind = 2 + Math.floor(waveOrdinal / 6);
            const hatchAdds = Math.round(hatcherCount * hatchKinds * hatchPerKind * 0.55);
            const summonAdds = Math.round(summonerCount * 2.0);
            const hatchPool = ['grunt', 'runner', 'shield', 'flyer', 'wasp', 'tank', 'ghost', 'brute', 'wraith', 'phantom', 'stalker', 'specter', 'shade'];
            const summonPoolSize = Math.min(SUMMON_POOL.length, 2 + Math.floor(waveOrdinal / 3));
            const summonPool = SUMMON_POOL.slice(0, summonPoolSize);
            const addExpectedReinforcements = (pool, amount) => {
                if (!pool.length || amount <= 0) return;
                const each = amount / pool.length;
                for (const type of pool) {
                    if (!counts[type]) counts[type] = { count: 0, hp: 0 };
                    counts[type].count += each;
                    counts[type].hp += each * ((ENEMY_STATS[type] && ENEMY_STATS[type].hpFactor) || 1) * 1.05;
                }

            addExpectedReinforcements(summonPool, summonAdds);

            for (const type of Object.keys(counts)) {
                const item = counts[type];
                const def = ENEMY_TYPES[type] || {};
                const st = ENEMY_STATS[type] || {};
                total += item.count;
                totalHp += item.hp;
                if (def.air) air += item.count;
                if (def.stealth) stealth += item.count;
                if (['tank', 'brute', 'boss', 'hatcher', 'summoner', 'jammer'].includes(type)) heavy += item.count;
                if ((st.spdFactor || 1) >= 1.3 || type === 'jammer') {
                    fast += item.count;
                    if (!def.immuneSlow) slowableFast += item.count;
                }
                if (MECH_TYPES.has(type)) mech += item.count;
                if (def.healer) healer += item.count;
                if (def.hatcher) hatcher += item.count;
                if (def.summoner) summoner += item.count;
                if (def.jammer || type === 'jammer') jammer += item.count;
                if (item.count >= 3) crowd += item.count;
            }

            const averageHp = totalHp / Math.max(1, total);
            let swarmCount = 0;
            const entries = [];
            for (const type of Object.keys(counts)) {
                const item = counts[type];
                const averageTypeHp = item.hp / Math.max(1, item.count);
                if (item.count >= 3 && averageTypeHp <= averageHp * 0.75) swarmCount += item.count;
                entries.push({ type, name: (ENEMY_TYPES[type] && ENEMY_TYPES[type].name) || type,

                entries, total, air, stealth, heavy, fast, slowableFast, mech, healer, jammer, crowd, hatcher, summoner,
                airRatio: air / den,
                stealthRatio: stealth / den,
                heavyRatio: heavy / den,
                fastRatio: fast / den,
                mechRatio: mech / den,
                healerRatio: healer / den,
                jammerRatio: jammer / den,
                crowdRatio: crowd / den,
                slowableFastRatio: slowableFast / den,
                groundRatio: (total - air) / den,
                avgGroupSize: Object.keys(counts).reduce((a, k) => a + counts[k].count, 0) / Math.max(1, Object.keys(counts).length),
                maxGroupSize: Math.max(0, ...Object.keys(counts).map(k => counts[k].count)),
                swarmRatio: swarmCount / den,
                difficulty20: true,
                endgameUniversal: true,
                lastWaveStress: isFinalWave,
                healerThreat: healer * 2.2,
                spawnPressure: hatchAdds + summonAdds,
                bossSplitPressure: isFinalWave ? (counts.boss ? counts.boss.count * 2 : 0) : (counts.boss ? counts.boss.count * 2 : 0),
                regenThreat: isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 1 : 0,
                eliteRatio: AI_ASCENSION_STATE.elite ? 0.10 : 0,
                damageDecay: Math.max(0.5, 1 - Math.floor(waveOrdinal / 10) * 0.1)
            };
            return p;
        }

        function aiDifficulty20RoleState(profile) {
            const usable = towers.filter(t => !!TOWER_TYPES[t.type]);
            const effectiveCount = (t) => {
                let v = 1;
                if (AI_ASCENSION_STATE.ammo && !['laser', 'prism', 'amplifier', 'harvester'].includes(t.type)) {
                    const ammo = Math.max(0, Math.min(50, Number.isFinite(t.ammo) ? t.ammo : 50));
                    v *= ammo <= 0 ? 0.48 : (ammo < 10 ? 0.72 : 1);
                }
                if ((t.silenceTimer || 0) > 0) v *= 0.72;
                return v;
            };
            let aoe = 0, jammer = 0, air = 0, control = 0, heavy = 0;
            const typeHave = { shock: 0, chain: 0, missile: 0, prism: 0, emp: 0 };
            for (const t of usable) {
                const e = effectiveCount(t);
                if (t.type === 'shock') { aoe += 1.15 * e; control += 0.85 * e; typeHave.shock += e; }
                else if (t.type === 'chain') { aoe += 1.05 * e; typeHave.chain += e; }
                else if (t.type === 'missile') { aoe += 1.05 * e; typeHave.missile += e; }
                else if (t.type === 'prism') {
                    const quality = Math.min(1.20, 0.65 + Math.max(0, (t.level || 1) - 1) * 0.11);
                    aoe += quality * e; typeHave.prism += quality * e;
                } else if (t.type === 'emp') { aoe += 0.95 * e; control += 1.0 * e; typeHave.emp += e; }
                if (['sniper', 'railgun'].includes(t.type)) jammer += e;
                else if (t.type === 'cannon') jammer += 0.65 * e;
                if (t.type === 'flak') air += e;
                if (t.type === 'temporal') control += e;
                if (['sniper', 'railgun', 'venom', 'laser'].includes(t.type)) heavy += (t.type === 'venom' ? 0.75 : 1) * e;
                else if (t.type === 'cannon') heavy += 0.65 * e;
            }
            const highAir = profile && profile.airRatio > 0.28;
            const airNeed = profile && profile.airRatio > 0.08 ? (highAir ? 4 : (profile.airRatio > 0.16 ? 3 : 2)) : 0;
            // 若当前压力画像几乎全是飞行单位，地面 AOE 配额应为 0，不能因此无限补地面群攻塔。
            const hasGroundTargets = !!profile && (profile.groundRatio == null || profile.groundRatio > 0.10);
            const aoeNeed = !hasGroundTargets ? 0 : (profile && profile.endgameUniversal ? 5.1 :
                (profile && (profile.total > 45 || profile.swarmRatio > 0.55) ? 3.8 : 2.6));
            return {
                aoe, jammer, air, control, heavy, typeHave,
                aoeNeed,
                jammerNeed: profile && profile.jammerRatio >= 0.08 ? 3 : ((profile && profile.jammer > 0) ? 2 : 0),
                airNeed,
                controlNeed: profile && (profile.endgameUniversal || profile.fastRatio > 0.15) ? 2 : 1,
                heavyNeed: profile && (profile.endgameUniversal || profile.heavyRatio > 0.12) ? 3 : 1
            };
        }

        function aiDifficulty20RoleMultiplier(type, profile, state) {
            if (!profile || !profile.difficulty20) return 1;
            const r = state || aiDifficulty20RoleState(profile);
            const deficit = (need, have) => Math.max(0, (need || 0) - (have || 0));
            let m = 1;
            const aoeGap = deficit(r.aoeNeed, r.aoe);
            if (AI_GROUND_AOE_TYPES.has(type)) {
                // 高数量地面敌人下，先补到至少 5 个有效群攻单位（20 塔总上限内仍留出防空/反干扰位）。
                m *= 1 + Math.min(1.45, aoeGap * 0.34);
                const typeNeed = { shock: 1.15, chain: 1.10, missile: 1.45, prism: 0.95, emp: 0.85 }[type] || 0;
                const typeGap = deficit(typeNeed, (r.typeHave && r.typeHave[type]) || 0);
                m *= 1 + Math.min(0.75, typeGap * 0.48);
            } else if (['sniper', 'railgun', 'laser', 'cannon', 'gun', 'venom'].includes(type) && aoeGap >= 1.0) {
                // 群攻严重不足时，压低继续堆单体塔的收益；但保留反干扰/重甲的必要火力。
                const singlePenalty = ['sniper', 'railgun', 'cannon'].includes(type) && profile.jammerRatio >= 0.08 ? 0.82 : 0.68;
                m *= Math.max(singlePenalty, 1 - Math.min(0.34, aoeGap * 0.075));
            }
            if (['sniper', 'railgun', 'cannon'].includes(type))
                m *= 1 + Math.min(0.80, deficit(r.jammerNeed, r.jammer) * 0.27);
            if (type === 'flak' && r.airNeed > 0)
                m *= 1 + Math.min(2.10, deficit(r.airNeed, r.air) * 0.72);
            if (['temporal', 'shock', 'emp'].includes(type))
                m *= 1 + Math.min(0.48, deficit(r.controlNeed, r.control) * 0.22);
            if (['sniper', 'railgun', 'venom', 'cannon', 'laser'].includes(type))
                m *= 1 + Math.min(0.48, deficit(r.heavyNeed, r.heavy) * 0.16);
            if ((profile.healer || 0) > 0 && ['sniper', 'railgun', 'cannon', 'laser'].includes(type)) m *= 1.18;
            if ((profile.spawnPressure || 0) > 0 && ['cannon', 'missile', 'chain', 'prism', 'shock', 'emp'].includes(type))
                m *= 1 + Math.min(0.30, profile.spawnPressure / Math.max(1, profile.total) * 0.42);
            return m;
        }

        function aiDifficulty20AmmoReserve() {
            if (!AI_ASCENSION_STATE.ammo) return 0;
            let reserve = 0;
            for (const t of towers) {
                if (!TOWER_TYPES[t.type] || ['laser', 'prism', 'amplifier', 'harvester'].includes(t.type)) continue;
                const ammo = Math.max(0, Number.isFinite(t.ammo) ? t.ammo : 50);
                if (ammo > 8 && !t.isReloading) continue;
                const reloadCost = Math.floor(TOWER_TYPES[t.type].cost * 0.1) + (t.level || 1) * 5;
                const urgency = (ammo <= 0 || t.isReloading) ? 1 : (8 - ammo) / 8 * 0.45;
                reserve += reloadCost * urgency;
            }
            return Math.min(Math.ceil(reserve), Math.floor(Math.max(0, money) * 0.28));
        }

        function aiCoverageStats() {
            const nodes = [];
            for (const route of routes) for (const p of route.pts || []) {
                const x = (p.x - mapOffX) / CELL, y = (p.y - mapOffY) / CELL;
                if (Number.isFinite(x) && Number.isFinite(y)) nodes.push({ x, y });
            }
            if (!nodes.length) return { normal: 0, air: 0, stealth: 0, nodes: 0 };
            let normal = 0, air = 0, stealth = 0;
            for (const p of nodes) {
                let n = false, a = false, st = false;
                for (const t of towers) {
                    const def = TOWER_TYPES[t.type];
                    if (!def) continue;
                    const dx = p.x - (t.col + 0.5), dy = p.y - (t.row + 0.5);
                    const d = Math.hypot(dx, dy);
                    const ts = towerStatsAt(t.type, t.level);
                    const rr = (ts.range || def.range || 0) * ((t.buffs && t.buffs.range) || 1) * (1 + ((t.syn && t.syn.range) || 0));
                    const canFire = !['temporal','amplifier','harvester'].includes(t.type);
                    if (d <= rr && canFire && !def.airOnly) n = true;
                    if (d <= rr && canFire && def.targetsAir && !(AI_ASCENSION_STATE.airOnlyFlak && t.type !== 'flak')) a = true;
                    // 攻击塔：按难度20（暗影迷雾）下的检测半径判定
                    if (canFire && d <= rr && d <= aiStealthRevealRadius(t) / CELL) st = true;
                    // 满级减速塔：揭示射程内所有隐形单位（原先被 canFire 短路漏掉）
                    if (!canFire && t.type === 'temporal' && t.level >= MAX_LEVEL && d <= rr) st = true;
                    if (n && a && st) break;
                }
                if (n) normal++;
                if (a) air++;
                if (st) stealth++;
            }
            return {
                normal: Math.round(normal / nodes.length * 100),
                air: Math.round(air / nodes.length * 100),
                stealth: Math.round(stealth / nodes.length * 100),
                nodes: nodes.length
            };
        }
        function aiDescribeThreat(p) {

            if (p.stealth > 0) out.push(`隐形单位 ${p.stealth} 只`);

            if (!out.length) out.push('以常规地面单位为主');

        function aiAnalyzeSituation(silent) {

                        // ★ 群体威胁诊断

                );

            if (p.fastRatio > 0.18) lines.push('建议：在转弯或长通道附近配置减速塔；注意幽灵类敌人免疫减速。');
            if (p.heavyRatio > 0.12) lines.push('建议：使用狙击塔、炮塔或磁轨炮处理高生命目标，避免只堆低单发伤害的机枪塔。');

            if (corePct <= 50) lines.push('危险：安全核心储备已经偏低，优先升级能够覆盖关键路线的主力塔；只有出现新的火力缺口时才补塔。');

        }
                // ★ 群体效能系数：群怪场景下 AOE / 控场塔加权，单体塔降权
        function aiGroupMultiplier(type, profile, level) {
            const swarm = profile.swarmRatio || 0;

            const load = Math.min(1, (profile.total || 0) / 38);
            const spawnPressure = Math.min(1, (profile.spawnPressure || 0) / Math.max(1, profile.total || 1));
            const groupSizePressure = Math.min(1, Math.max(0, ((profile.avgGroupSize || 0) - 2) / 8));
            const groupPressure = Math.min(1, swarm * 0.25 + load * 0.48 + groupSizePressure * 0.15 + spawnPressure * 0.12);
            const p = Math.max(groupPressure, groupSizePressure * 0.85);
            switch (type) {
                case 'temporal':  return 1 + p * 0.70;   // 减速对所有经过的敌人有效
                case 'emp':       return 1 + p * 0.60;   // 范围眩晕
                case 'chain':     return 1 + p * 0.60;   // 跳跃多目标
                case 'prism':     return 1 + p * 0.55;   // 多目标光束
                case 'shock':     return 1 + p * 0.50;   // 范围伤害
                case 'missile':   return 1 + p * 0.45;   // 溅射

            // 即使敌人正在移动，也会根据当前战场重新评估建塔点和升级收益。
            const up = aiFindUpgradeRecommendation();
            const build = aiFindBuildRecommendation(false);
            if (!up && !build) {
                if (aiLastAssistantAction) aiSetStatus(`智能托管：${aiLastAssistantAction} · 等待资金/安全位置`);
                return;
            }

            // 默认更倾向升级已有高效炮塔，而不是不断增加塔数。
            const energy = getEnergyStats();
            const coreRatio = energy.green / Math.max(1, totalCores || 1);
            const underPressure = enemies.length > 0;
            const liveJammers = enemies.filter(e => e.hp > 0 && (e.type === 'jammer' || (ENEMY_TYPES[e.type] && ENEMY_TYPES[e.type].jammer)));
            const liveCarriers = enemies.filter(e => e.hp > 0 && e.carrying > 0);
            const hasSafeJammerCounter = liveJammers.some(e => towers.some(t => {
                const def = TOWER_TYPES[t.type];
                if (!def || def.airOnly || ['temporal','amplifier','harvester'].includes(t.type) || t.silenceTimer > 0 ||
                    (AI_ASCENSION_STATE.ammo && !['laser','prism','amplifier','harvester'].includes(t.type) && (t.ammo <= 0 || t.isReloading))) return false;
                const range = (towerStatsAt(t.type, t.level).range || def.range || 0) * CELL *
                    ((t.buffs && t.buffs.range) || 1) * (1 + ((t.syn && t.syn.range) || 0));
                const d = Math.hypot(e.x - cellCenterX(t.col), e.y - cellCenterY(t.row));
                return d > aiJammerInterferenceCells() * CELL && d <= range;
            }));
            const hasCarrierCounter = liveCarriers.some(e => towers.some(t => {
                const def = TOWER_TYPES[t.type];
                if (!def || ['temporal','amplifier','harvester'].includes(t.type) || (def.airOnly && !ENEMY_TYPES[e.type].air) || (ENEMY_TYPES[e.type].air && !def.targetsAir) ||
                    (AI_ASCENSION_STATE.airOnlyFlak && ENEMY_TYPES[e.type].air && t.type !== 'flak') || t.silenceTimer > 0 ||
                    (AI_ASCENSION_STATE.ammo && !['laser','prism','amplifier','harvester'].includes(t.type) && (t.ammo <= 0 || t.isReloading))) return false;
                const range = (towerStatsAt(t.type, t.level).range || def.range || 0) * CELL *
                    ((t.buffs && t.buffs.range) || 1) * (1 + ((t.syn && t.syn.range) || 0));
                return Math.hypot(e.x - cellCenterX(t.col), e.y - cellCenterY(t.row)) <= range;
            }));
            

                        // ★ 「少塔长路」策略：塔越多 / 覆盖率越高 → 越优先升级现有塔
            const cov = aiCoverageStats();
            const avgCoverage = (cov.normal + cov.air + cov.stealth) / 3;

            let upgradeBias = 2.4;
            let buildBias = (underPressure ? 1.10 : 1.20) * (coreRatio < 0.55 ? 1.18 : 1);

            // 塔数量已经很多 → 新塔边际价值下降
            upgradeBias += Math.min(1.2, Math.max(0, towers.length - 2) * 0.12);

            // 覆盖率足够 → 优先升级现有塔，避免铺塔
            if (avgCoverage >= 55) upgradeBias += 0.20;
            if (avgCoverage >= 70) upgradeBias += 0.30;
            if (avgCoverage >= 85) upgradeBias += 0.40;
            if (avgCoverage >= 80 && towers.length >= 4) buildBias *= 0.80;
            if (avgCoverage >= 90 && towers.length >= 6) buildBias *= 0.80;

            // ── 紧急情况（干扰者 / 携核敌人）覆盖上面的偏置 ──
            if (liveJammers.length) {
                if (hasSafeJammerCounter) {
                    // 已有塔能在干扰圈外命中：优先升级这类有效火力，而非升级被沉默的塔。
                    upgradeBias = 3.25;
                    buildBias = 0.92;
                } else {
                    // 没有安全反制时，优先新建狙击/磁轨炮等安全射程火力。
                    upgradeBias = 1.10;
                    buildBias = 1.85;
                }
            }
            if (liveCarriers.length && !hasCarrierCounter) {
                upgradeBias = Math.min(upgradeBias, 1.35);
                buildBias = Math.max(buildBias, 1.55);
            } else if (liveCarriers.length && hasCarrierCounter) {
                upgradeBias = Math.max(upgradeBias, 2.95);
            }
            if (coreRatio < 0.35 && !liveJammers.length && !liveCarriers.length) {
                upgradeBias = Math.max(upgradeBias, 3.0);
            }

            // 最后 4 波按难度20综合压力模型补齐职能缺口，但保留20座总建塔上限。
            const endgameProfile = aiPlanningEnemyProfile();
            if (endgameProfile.difficulty20 && build) {
                const roles = aiDifficulty20RoleState(endgameProfile);
                const roleGap = roles.aoe < roles.aoeNeed || roles.jammer < roles.jammerNeed ||
                    roles.air < roles.airNeed || roles.control < roles.controlNeed || roles.heavy < roles.heavyNeed;
                if (roleGap) {
                    upgradeBias = Math.min(upgradeBias, 1.55);
                    buildBias = Math.max(buildBias, 2.05);
                }
                // 地面群攻明显短缺时，即使已有少量 AOE，也持续补足而不是转回单体塔升级。
                if (roles.aoeNeed - roles.aoe >= 1.15 && endgameProfile.groundRatio > 0.10 && (endgameProfile.total > 45 || endgameProfile.swarmRatio > 0.55 || endgameProfile.endgameUniversal)) {
                    upgradeBias = Math.min(upgradeBias, 1.18);
                    buildBias = Math.max(buildBias, 2.45);
                }
                // 飞行单位只能由防空塔处理，防空缺口也必须优先补齐。
                if (AI_ASCENSION_STATE.airOnlyFlak && roles.airNeed > roles.air + 0.5) {
                    upgradeBias = Math.min(upgradeBias, 1.25);
                    buildBias = Math.max(buildBias, 2.30);
                }
            }

                        // ★ 群体压力大且缺乏 AOE / 控场塔时，优先补塔而不是继续升级单体塔
            if (build) {
                const prof = aiPlanningEnemyProfile();
                const swarmR = prof.swarmRatio || 0;
                const loadR = Math.min(1, (prof.total || 0) / 38);
                const sizeR = Math.min(1, Math.max(0, (prof.avgGroupSize || 0) - 2) / 8);
                const spawnR = Math.min(1, (prof.spawnPressure || 0) / Math.max(1, prof.total || 1));
                const gp = Math.min(1, swarmR * 0.25 + loadR * 0.48 + sizeR * 0.15 + spawnR * 0.12);
                const roleNow = aiDifficulty20RoleState(prof);
                const aoeCnt = roleNow.aoe;
                if (gp >= 0.48 && aoeCnt < Math.min(2.0, roleNow.aoeNeed)) {
                    const cost0 = getBuildCost(build.type);
                    if (money >= cost0 + (aiDifficulty20AmmoReserve() * 0.5) && canBuildAt(build.col, build.row)) {
                        closeBuildMenu(); closeTowerMenu();
                        addTower(build.col, build.row, build.type);
                        rebuildPaths(); updateUI();
                        aiConsumePlanPositionIfFromPlan(build);
                        aiLastAssistantAction = `紧急补 AOE：${TOWER_TYPES[build.type].name}（群体威胁高）`;
                        aiSetStatus(`智能托管：${aiLastAssistantAction}`);
                        aiAddMessage(`托管已执行：${aiLastAssistantAction}。`, 'bot');
                        aiLastRecommendation = null; aiSetApplyEnabled(false);
                        return;
                    }
                }
            }


            const criticalResponse = (liveJammers.length > 0 && !hasSafeJammerCounter) ||
                (liveCarriers.length > 0 && !hasCarrierCounter) || coreRatio < 0.30;
            const ammoReserve = criticalResponse ? 0 : aiDifficulty20AmmoReserve();
            const spendableMoney = Math.max(0, money - ammoReserve);
            const upAffordable = !!up && up.cost <= spendableMoney;
            const buildAffordable = !!build && build.cost <= spendableMoney;
            if (!upAffordable && !buildAffordable) {
                aiSetStatus(`难度20资源管理：预留 ${ammoReserve} 金币用于弹药装填`);
                return;
            }
            const chooseUpgrade = upAffordable && (!buildAffordable || up.score * upgradeBias >= build.score * buildBias);

            if (chooseUpgrade) {
                const t = up.tower;
                const cost = getUpgradeCostEffective(t.type, t.level);
                if (cost == null || money < cost || !towers.includes(t)) return;
                money -= cost; t.level++; t.invested += cost;
                if (ascensionState && ascensionState.ammo) t.ammo = 50;
                updateUI(); if (selectedTower === t) updateSellButton();
                SFX.upgrade();
                aiLastAssistantAction = `自动升级 ${TOWER_TYPES[t.type].name} Lv.${t.level}`;
            } else {
                if (!buildAffordable || !build) return;
                const cost = getBuildCost(build.type);
                const reserve = 0;
                if (money < cost + reserve || !canBuildAt(build.col, build.row)) return;
                closeBuildMenu(); closeTowerMenu();
                addTower(build.col, build.row, build.type);
                rebuildPaths(); updateUI();
                aiConsumePlanPositionIfFromPlan(build);
                aiLastAssistantAction = `自动建造 ${TOWER_TYPES[build.type].name}`;
            }
            aiSetStatus(`智能托管：${aiLastAssistantAction}`);
            aiAddMessage(`托管已执行：${aiLastAssistantAction}。`, 'bot');
            aiLastRecommendation = null; aiSetApplyEnabled(false);
        }

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.lineTo(x + w - r, y);
            c.arcTo(x + w, y, x + w, y + r, r);
            c.lineTo(x + w, y + h - r);
            c.arcTo(x + w, y + h, x + w - r, y + h, r);
            c.lineTo(x + r, y + h);
            c.arcTo(x, y + h, x, y + h - r, r);
            c.lineTo(x, y + r);
            c.arcTo(x, y, x + r, y, r);
            c.closePath();
        }

        function drawBackdrop() {
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0f1e');
            grad.addColorStop(1, '#1a2540');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(80, 140, 210, 0.10)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 43; i++) {
                const y = 20 + i * 16;
                ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(canvas.width - 24, y); ctx.stroke();
            }
        }

        function drawScrollbar(top, viewH) {
            if (maxScroll <= 0) return;
            const x = canvas.width - 11;
            ctx.fillStyle = 'rgba(60, 100, 150, 0.22)';
            roundRect(ctx, x, top, 5, viewH, 3); ctx.fill();
            const totalH = viewH + maxScroll;
            const barH = Math.max(28, viewH * viewH / totalH);
            const barY = top + (viewH - barH) * (scrollY / maxScroll);
            ctx.fillStyle = 'rgba(126, 200, 255, 0.5)';
            roundRect(ctx, x, barY, 5, barH, 3); ctx.fill();
        }

                airRatio: air / den, stealthRatio: stealth / den, heavyRatio: heavy / den,
                fastRatio: fast / den, mechRatio: mech / den, healerRatio: healer / den,
                jammerRatio: jammer / den, crowdRatio: crowd / den, slowableFastRatio: slowableFast / den, groundRatio: (total - air) / den,
                // ★ 群体威胁
                          avgGroupSize, maxGroupSize, swarmRatio
            };
        }

        // ============================================================
        // ★ 全局波次预知：AI 直接读取整关所有剩余波次的敌人构成
        //   常规波次按「当前波 + 剩余全部波次」加权评估，提前补齐长期短板
        //   （防空 / 反隐 / 反干扰 / 群攻），而不是只看眼前一波。
        //   结果按 waveIndex 缓存，开新波才重算。
        // ============================================================
        let _aiGlobalProfileCache = null;

        function aiGlobalThreatProfile() {
            const affixKey = rogueState ? rogueState.affixes.map(a => a.id).join('+') : '';
            const cacheKey = levelIndex + '|' + currentModeKey + '|' + waveIndex + '|' + totalWaves + '|' + affixKey;
            if (_aiGlobalProfileCache && _aiGlobalProfileCache.key === cacheKey) return _aiGlobalProfileCache.data;

            const empty = {
                sourceLabel: '暂无波次信息', startWave: 0, endWave: 0, waveSpan: 0,
                counts: Object.create(null), entries: [], total: 0, totalHp: 0,
                air: 0, stealth: 0, heavy: 0, fast: 0, slowableFast: 0, mech: 0,
                healer: 0, jammer: 0, crowd: 0, hatcher: 0, summoner: 0,
                airRatio: 0, stealthRatio: 0, heavyRatio: 0, fastRatio: 0,
                slowableFastRatio: 0, mechRatio: 0, healerRatio: 0, jammerRatio: 0,
                crowdRatio: 0, groundRatio: 1, avgHp: 0, swarmRatio: 0,
                avgWaveSize: 0, maxTypeCount: 0,
                peakWave: 0, peakScore: 0, peakCount: 0, peakHp: 0, wavesUntilPeak: 0
            };
            if (!waves || waves.length === 0) return empty;

            const em = (rogueState && rogueState.enemyMods) ? rogueState.enemyMods : { hpMul: 1 };
            const isEndless = currentModeKey === 'endless';
            const curWave = Math.max(0, waveIndex - 1);
            const startWave = Math.min(waves.length - 1, curWave);
            // 无尽模式只预知未来 12 波，避免遍历 9999 波造成卡顿
            const horizon = isEndless ? 12 : Math.max(1, waves.length - startWave);
            const endWave = Math.min(waves.length, startWave + horizon);

            const counts = Object.create(null);
            let total = 0, totalHp = 0;
            let peakWave = startWave, peakScore = -1, peakCount = 0, peakHp = 0;

            for (let w = startWave; w < endWave; w++) {
                const wave = waves[w];
                if (!wave || !wave.groups) continue;
                const isLast = !isEndless && totalWaves > 0 && w === totalWaves - 1;
                let waveCount = 0, waveHp = 0, hasBoss = false;
                for (const g of wave.groups) {
                    const type = g.type;
                    if (!ENEMY_TYPES[type]) continue;
                    let count = Math.max(0, Math.round(g.count || 0));
                    let hp = Math.max(0, g.hp || 0) * (em.hpMul || 1);
                    // 与 startNextWave 保持一致：末波双倍 / 最终审判额外首领
                    if (isLast && ascensionState && ascensionState.finalWaveDouble) count *= 2;
                    if (isLast && ascensionState && ascensionState.finalJudgment && type === 'boss') count += 2;
                    if (count <= 0) continue;
                    if (type === 'boss') hasBoss = true;
                    const item = counts[type] || (counts[type] = { count: 0, hp: 0 });
                    item.count += count;
                    item.hp += hp * count;
                    total += count;
                    totalHp += hp * count;
                    waveCount += count;
                    waveHp += hp * count;
                }
                // 波峰评分：血量为主、数量为辅，首领波额外加权
                const score = waveHp * 0.6 + waveCount * 45 + (hasBoss ? waveHp * 0.5 + 220 : 0);
                if (score > peakScore) {
                    peakScore = score;
                    peakWave = w;
                    peakCount = waveCount;
                    peakHp = waveHp;
                }
            }

            let air = 0, stealth = 0, heavy = 0, fast = 0, slowableFast = 0, mech = 0;
            let healer = 0, jammer = 0, crowd = 0, hatcher = 0, summoner = 0;
            const entries = [];
            for (const type of Object.keys(counts)) {
                const v = counts[type];
                const def = ENEMY_TYPES[type] || {};
                const st = ENEMY_STATS[type] || {};
                if (def.air) air += v.count;
                if (def.stealth) stealth += v.count;
                if (['tank', 'brute', 'boss', 'hatcher', 'summoner', 'jammer'].includes(type)) heavy += v.count;
                if ((st.spdFactor || 1) >= 1.3 || type === 'jammer') {
                    fast += v.count;
                    if (!def.immuneSlow) slowableFast += v.count;
                }
                if (MECH_TYPES.has(type)) mech += v.count;
                if (def.healer) healer += v.count;
                if (def.hatcher) hatcher += v.count;
                if (def.summoner) summoner += v.count;
                if (def.jammer || type === 'jammer') jammer += v.count;
                if (v.count >= 3) crowd += v.count;
                entries.push({ type, name: def.name || type, count: v.count, hp: v.hp });
            }

            const den = Math.max(1, total);
            const avgHp = totalHp / den;
            let swarmCount = 0;
            for (const type of Object.keys(counts)) {
                const v = counts[type];
                if (v.count >= 3 && v.hp / v.count <= avgHp * 0.75) swarmCount += v.count;
            }

            const waveSpan = Math.max(1, endWave - startWave);
            const data = {
                sourceLabel: isEndless
                    ? `无尽模式未来 ${waveSpan} 波预知`
                    : `整关剩余 ${waveSpan} 波预知`,
                startWave, endWave, waveSpan,
                counts, entries, total, totalHp,
                air, stealth, heavy, fast, slowableFast, mech, healer, jammer, crowd, hatcher, summoner,
                airRatio: air / den,
                stealthRatio: stealth / den,
                heavyRatio: heavy / den,
                fastRatio: fast / den,
                slowableFastRatio: slowableFast / den,
                mechRatio: mech / den,
                healerRatio: healer / den,
                jammerRatio: jammer / den,
                crowdRatio: crowd / den,
                groundRatio: (total - air) / den,
                avgHp,
                swarmRatio: swarmCount / den,
                avgWaveSize: total / waveSpan,
                maxTypeCount: entries.length ? Math.max.apply(null, entries.map(e => e.count)) : 0,
                peakWave, peakScore, peakCount, peakHp,
                wavesUntilPeak: Math.max(0, peakWave - curWave)
            };
            _aiGlobalProfileCache = { key: cacheKey, data };
            return data;
        }



        // 终局规划画像：最后 4 波不再只盯着当前波的随机组合，
        // 而是假设所有敌种都以高数量同时出现，让 AI 提前形成完整的反制体系。
        // 该画像只用于 AI 评分，不会生成/修改敌人，也不改变波次机制。
        function aiPlanningEnemyProfile() {
            const actual = aiEnemyProfile();
            const inFinalWaves = currentModeKey !== 'endless' && totalWaves > 0 &&
                waveIndex >= Math.max(0, totalWaves - 4);
                        if (!inFinalWaves) {
                // ★ 全局预知：AI 读取整关剩余波次的完整构成，与当前波加权融合。
                //   - 构成比例（防空/反隐/反干扰/群攻）→ 当前 45% + 全局 55%，提前布局
                //   - 规模/群体压力（AOE 数量需求）→ 以当前波为主，避免前期过度堆 AOE
                const global = aiGlobalThreatProfile();
                const useActual = actual.total > 0;
                const wa = useActual ? 0.45 : 0;   // 当前波权重
                const wg = 1 - wa;
                const mix  = (a, b) => (a || 0) * wa + (b || 0) * wg;
                const mixN = (a, b) => Math.round((a || 0) * wa + (b || 0) * wg);

                const p = { ...actual, difficulty20: true, globalAware: true, global };
                p.globalSourceLabel = global.sourceLabel;
                p.upcomingWaves = Math.max(0, totalWaves - waveIndex);
                p.peakWave = global.peakWave;
                p.peakCount = global.peakCount;
                p.peakHp = global.peakHp;
                p.wavesUntilPeak = global.wavesUntilPeak;

                // 数量：用于 > 0 判断与"是否存在该类威胁"
                p.air           = mixN(actual.air, global.air);
                p.stealth       = mixN(actual.stealth, global.stealth);
                p.heavy         = mixN(actual.heavy, global.heavy);
                p.fast          = mixN(actual.fast, global.fast);
                p.slowableFast  = mixN(actual.slowableFast, global.slowableFast);
                p.mech          = mixN(actual.mech, global.mech);
                p.healer        = mixN(actual.healer, global.healer);
                p.jammer        = mixN(actual.jammer, global.jammer);
                p.crowd         = mixN(actual.crowd, global.crowd);
                p.hatcher       = mixN(actual.hatcher, global.hatcher);
                p.summoner      = mixN(actual.summoner, global.summoner);

                // 比例：驱动职能需求（防空/反隐/反干扰/AOE）
                p.airRatio           = mix(actual.airRatio, global.airRatio);
                p.stealthRatio       = mix(actual.stealthRatio, global.stealthRatio);
                p.heavyRatio         = mix(actual.heavyRatio, global.heavyRatio);
                p.fastRatio          = mix(actual.fastRatio, global.fastRatio);
                p.slowableFastRatio  = mix(actual.slowableFastRatio, global.slowableFastRatio);
                p.mechRatio          = mix(actual.mechRatio, global.mechRatio);
                p.healerRatio        = mix(actual.healerRatio, global.healerRatio);
                p.jammerRatio        = mix(actual.jammerRatio, global.jammerRatio);
                p.crowdRatio         = mix(actual.crowdRatio, global.crowdRatio);
                p.groundRatio        = mix(actual.groundRatio, global.groundRatio);

                // 规模/群体压力：当前波有敌人时以真实规模为准，否则用全局平均波规模预判
                if (useActual) {
                    p.total        = actual.total;
                    p.avgGroupSize = actual.avgGroupSize;
                    p.maxGroupSize = actual.maxGroupSize;
                    p.swarmRatio   = actual.swarmRatio;
                } else {
                    p.total        = global.avgWaveSize;
                    p.avgGroupSize = global.avgWaveSize;
                    p.maxGroupSize = global.maxTypeCount;
                    p.swarmRatio   = global.swarmRatio;
                }

                p.sourceLabel = useActual
                    ? `${actual.sourceLabel} + ${global.sourceLabel}`
                    : global.sourceLabel;

                // 其余派生威胁指标
                p.healerThreat = (p.healer || 0) * 2.2;
                const forecastOrdinal = Math.max(0, waveIndex - 1);
                p.spawnPressure = (p.hatcher || 0) * Math.min(4, 1 + Math.floor(forecastOrdinal / 8)) *
                    (2 + Math.floor(forecastOrdinal / 6)) * 0.55 + (p.summoner || 0) * 2.0;
                p.regenThreat = (waveIndex >= totalWaves - 1 && currentModeKey !== 'endless') ? 1 : 0;
                p.damageDecay = Math.max(0.5, 1 - Math.floor(Math.max(0, waveIndex) / 10) * 0.1);
                p.endgameUniversal = false;
                return p;
            }

            const isFinalWave = currentModeKey !== 'endless' && totalWaves > 0 && waveIndex >= totalWaves - 1;
            const waveOrdinal = Math.max(0, isFinalWave ? totalWaves - 1 : waveIndex);
            const waveMultiplier = isFinalWave && AI_ASCENSION_STATE.finalWaveDouble ? 2 : 1;
            const counts = Object.create(null);
            let total = 0, air = 0, stealth = 0, heavy = 0, fast = 0;
            let slowableFast = 0, mech = 0, healer = 0, jammer = 0, crowd = 0, hatcher = 0, summoner = 0;
            let totalHp = 0;

            // 压力测试：每种常规敌人均视为高数量，干扰者与首领额外加权。
            for (const type of Object.keys(ENEMY_TYPES)) {
                const baseCount = type === 'jammer' ? 28 : (type === 'boss' ? 10 : 18);
                let count = baseCount * waveMultiplier;
                if (type === 'boss' && isFinalWave && AI_ASCENSION_STATE.finalJudgment) count += 2;
                const def = ENEMY_TYPES[type] || {};
                const st = ENEMY_STATS[type] || {};
                // 精英降临：10% 概率属性 ×1.5，故期望生命/速度系数为 1.05。
                const eliteHpMul = AI_ASCENSION_STATE.elite ? 1.05 : 1;
                counts[type] = { count, hp: (st.hpFactor || 1) * count * eliteHpMul };
            }

            // 梦魇重生：每只首领死亡后分裂成两只巨兽；最终审判额外首领血量更高。
            if (AI_ASCENSION_STATE.bossSplit && counts.brute && counts.boss) {
                const regularBosses = Math.max(0, counts.boss.count - (isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 2 : 0));
                const extraBosses = isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 2 : 0;
                const splitBrutes = regularBosses * 2 + extraBosses * 2;
                const bruteHp = (ENEMY_STATS.boss.hpFactor || 45) * 0.30 * regularBosses * 2 +
                    (ENEMY_STATS.boss.hpFactor || 45) * 1.6 * 0.30 * extraBosses * 2;
                counts.brute.count += splitBrutes;
                counts.brute.hp += bruteHp;
            }

            // 孵化母体与召唤者会把波次规模继续放大；把预期增援折算为普通群怪压力。
            const hatcherCount = counts.hatcher ? counts.hatcher.count : 0;
            const summonerCount = counts.summoner ? counts.summoner.count : 0;
            const hatchKinds = Math.min(4, 1 + Math.floor(waveOrdinal / 8));
            const hatchPerKind = 2 + Math.floor(waveOrdinal / 6);
            const hatchAdds = Math.round(hatcherCount * hatchKinds * hatchPerKind * 0.55);
            const summonAdds = Math.round(summonerCount * 2.0);
            const hatchPool = ['grunt', 'runner', 'shield', 'flyer', 'wasp', 'tank', 'ghost', 'brute', 'wraith', 'phantom', 'stalker', 'specter', 'shade'];
            const summonPoolSize = Math.min(SUMMON_POOL.length, 2 + Math.floor(waveOrdinal / 3));
            const summonPool = SUMMON_POOL.slice(0, summonPoolSize);
            const addExpectedReinforcements = (pool, amount) => {
                if (!pool.length || amount <= 0) return;
                const each = amount / pool.length;
                for (const type of pool) {
                    if (!counts[type]) counts[type] = { count: 0, hp: 0 };
                    counts[type].count += each;
                    counts[type].hp += each * ((ENEMY_STATS[type] && ENEMY_STATS[type].hpFactor) || 1) * 1.05;
                }
            };
            addExpectedReinforcements(hatchPool, hatchAdds);
            addExpectedReinforcements(summonPool, summonAdds);

            // 聚合全部派生威胁指标，避免增援只增加总量却没有进入群体压力评估。
            for (const type of Object.keys(counts)) {
                const item = counts[type];
                const def = ENEMY_TYPES[type] || {};
                const st = ENEMY_STATS[type] || {};
                total += item.count;
                totalHp += item.hp;
                if (def.air) air += item.count;
                if (def.stealth) stealth += item.count;
                if (['tank', 'brute', 'boss', 'hatcher', 'summoner', 'jammer'].includes(type)) heavy += item.count;
                if ((st.spdFactor || 1) >= 1.3 || type === 'jammer') {
                    fast += item.count;
                    if (!def.immuneSlow) slowableFast += item.count;
                }
                if (MECH_TYPES.has(type)) mech += item.count;
                if (def.healer) healer += item.count;
                if (def.hatcher) hatcher += item.count;
                if (def.summoner) summoner += item.count;
                if (def.jammer || type === 'jammer') jammer += item.count;
                if (item.count >= 3) crowd += item.count;
            }

            const averageHp = totalHp / Math.max(1, total);
            let swarmCount = 0;
            const entries = [];
            for (const type of Object.keys(counts)) {
                const item = counts[type];
                const averageTypeHp = item.hp / Math.max(1, item.count);
                if (item.count >= 3 && averageTypeHp <= averageHp * 0.75) swarmCount += item.count;
                entries.push({ type, name: (ENEMY_TYPES[type] && ENEMY_TYPES[type].name) || type,
                    count: item.count, hp: item.hp });
            }

            const den = Math.max(1, total);
            const p = {
                ...actual,
                sourceLabel: isFinalWave ? '难度20末波压力预案（双倍敌群/首领分裂/全图治疗）' : '难度20终局综合预案（全敌种高数量）',
                entries, total, air, stealth, heavy, fast, slowableFast, mech, healer, jammer, crowd, hatcher, summoner,
                airRatio: air / den,
                stealthRatio: stealth / den,
                heavyRatio: heavy / den,
                fastRatio: fast / den,
                mechRatio: mech / den,
                healerRatio: healer / den,
                jammerRatio: jammer / den,
                crowdRatio: crowd / den,
                slowableFastRatio: slowableFast / den,
                groundRatio: (total - air) / den,
                avgGroupSize: Object.keys(counts).reduce((a, k) => a + counts[k].count, 0) / Math.max(1, Object.keys(counts).length),
                maxGroupSize: Math.max(0, ...Object.keys(counts).map(k => counts[k].count)),
                swarmRatio: swarmCount / den,
                difficulty20: true,
                endgameUniversal: true,
                lastWaveStress: isFinalWave,
                healerThreat: healer * 2.2,
                spawnPressure: hatchAdds + summonAdds,
                bossSplitPressure: isFinalWave ? (counts.boss ? counts.boss.count * 2 : 0) : (counts.boss ? counts.boss.count * 2 : 0),
                regenThreat: isFinalWave && AI_ASCENSION_STATE.finalJudgment ? 1 : 0,
                eliteRatio: AI_ASCENSION_STATE.elite ? 0.10 : 0,
                damageDecay: Math.max(0.5, 1 - Math.floor(waveOrdinal / 10) * 0.1)
            };
            return p;
        }

        function aiDifficulty20RoleState(profile) {
            const usable = towers.filter(t => !!TOWER_TYPES[t.type]);
            const effectiveCount = (t) => {
                let v = 1;
                if (AI_ASCENSION_STATE.ammo && !AMMO_LESS_TOWER_TYPES.has(t.type)) {
                    const ammo = Math.max(0, Math.min(50, Number.isFinite(t.ammo) ? t.ammo : 50));
                    v *= ammo <= 0 ? 0.48 : (ammo < 10 ? 0.72 : 1);
                }
                if ((t.silenceTimer || 0) > 0) v *= 0.72;
                return v;
            };
            let aoe = 0, jammer = 0, air = 0, control = 0, heavy = 0;
            const typeHave = { shock: 0, chain: 0, missile: 0, prism: 0, emp: 0 };
            for (const t of usable) {
                const e = effectiveCount(t);
                if (t.type === 'shock') { aoe += 1.15 * e; control += 0.85 * e; typeHave.shock += e; }
                else if (t.type === 'chain') { aoe += 1.05 * e; typeHave.chain += e; }
                else if (t.type === 'missile') { aoe += 1.05 * e; typeHave.missile += e; }
                else if (t.type === 'prism') {
                    const quality = Math.min(1.20, 0.65 + Math.max(0, (t.level || 1) - 1) * 0.11);
                    aoe += quality * e; typeHave.prism += quality * e;
                } else if (t.type === 'emp') { aoe += 0.95 * e; control += 1.0 * e; typeHave.emp += e; }
                if (['sniper', 'railgun'].includes(t.type)) jammer += e;
                else if (t.type === 'cannon') jammer += 0.65 * e;
                if (t.type === 'flak') air += e;
                if (t.type === 'temporal') control += e;
                if (['sniper', 'railgun', 'venom', 'laser'].includes(t.type)) heavy += (t.type === 'venom' ? 0.75 : 1) * e;
                else if (t.type === 'cannon') heavy += 0.65 * e;
            }
            const highAir = profile && profile.airRatio > 0.28;
            let airNeed = profile && profile.airRatio > 0.08 ? (highAir ? 4 : (profile.airRatio > 0.16 ? 3 : 2)) : 0;
            // 若当前压力画像几乎全是飞行单位，地面 AOE 配额应为 0，不能因此无限补地面群攻塔。
            const hasGroundTargets = !!profile && (profile.groundRatio == null || profile.groundRatio > 0.10);
            let aoeNeed = !hasGroundTargets ? 0 : (profile && profile.endgameUniversal ? 5.1 :
                (profile && (profile.total > 45 || profile.swarmRatio > 0.55) ? 3.8 : 2.6));
            let jammerNeed = profile && profile.jammerRatio >= 0.08 ? 3 : ((profile && profile.jammer > 0) ? 2 : 0);
            let controlNeed = profile && (profile.endgameUniversal || profile.fastRatio > 0.15) ? 2 : 1;
            let heavyNeed = profile && (profile.endgameUniversal || profile.heavyRatio > 0.12) ? 3 : 1;
            // ★ 历史学习：按过去输赢局的需求缺口微调各职能配额
            if (aoeNeed > 0)     aoeNeed     *= AI_LEARN.getRoleNeed('aoe');
            if (jammerNeed > 0)  jammerNeed  *= AI_LEARN.getRoleNeed('jammer');
            if (airNeed > 0)     airNeed     *= AI_LEARN.getRoleNeed('air');
            if (controlNeed > 0) controlNeed *= AI_LEARN.getRoleNeed('control');
            if (heavyNeed > 0)   heavyNeed   *= AI_LEARN.getRoleNeed('heavy');
            return {
                aoe, jammer, air, control, heavy, typeHave,
                aoeNeed, jammerNeed, airNeed, controlNeed, heavyNeed
            };
        }

        function aiDifficulty20RoleMultiplier(type, profile, state) {
            if (!profile || !profile.difficulty20) return 1;
            const r = state || aiDifficulty20RoleState(profile);
            const deficit = (need, have) => Math.max(0, (need || 0) - (have || 0));
            let m = 1;
            const aoeGap = deficit(r.aoeNeed, r.aoe);
            if (AI_GROUND_AOE_TYPES.has(type)) {
                // 高数量地面敌人下，先补到至少 5 个有效群攻单位（20 塔总上限内仍留出防空/反干扰位）。
                m *= 1 + Math.min(1.45, aoeGap * 0.34);
                const typeNeed = { shock: 1.15, chain: 1.10, missile: 1.45, prism: 0.95, emp: 0.85 }[type] || 0;
                const typeGap = deficit(typeNeed, (r.typeHave && r.typeHave[type]) || 0);
                m *= 1 + Math.min(0.75, typeGap * 0.48);
            } else if (['sniper', 'railgun', 'laser', 'cannon', 'gun', 'venom'].includes(type) && aoeGap >= 1.0) {
                // 群攻严重不足时，压低继续堆单体塔的收益；但保留反干扰/重甲的必要火力。
                const singlePenalty = ['sniper', 'railgun', 'cannon'].includes(type) && profile.jammerRatio >= 0.08 ? 0.82 : 0.68;
                m *= Math.max(singlePenalty, 1 - Math.min(0.34, aoeGap * 0.075));
            }
            if (['sniper', 'railgun', 'cannon'].includes(type))
                m *= 1 + Math.min(0.80, deficit(r.jammerNeed, r.jammer) * 0.27);
            if (type === 'flak' && r.airNeed > 0)
                m *= 1 + Math.min(2.10, deficit(r.airNeed, r.air) * 0.72);
            if (['temporal', 'shock', 'emp'].includes(type))
                m *= 1 + Math.min(0.48, deficit(r.controlNeed, r.control) * 0.22);
            if (['sniper', 'railgun', 'venom', 'cannon', 'laser'].includes(type))

                // ★ 群体效能系数：群怪场景下 AOE / 控场塔加权，单体塔降权
        function aiGroupMultiplier(type, profile, level) {

                    // 没有安全反制时，优先新建狙击/磁轨炮等安全射程火力。
                    upgradeBias = 1.10;
                    buildBias = 1.85;
                }
            }
            if (liveCarriers.length && !hasCarrierCounter) {
                upgradeBias = Math.min(upgradeBias, 1.35);
                buildBias = Math.max(buildBias, 1.55);
            } else if (liveCarriers.length && hasCarrierCounter) {
                upgradeBias = Math.max(upgradeBias, 2.95);
            }
            if (coreRatio < 0.35 && !liveJammers.length && !liveCarriers.length) {
                upgradeBias = Math.max(upgradeBias, 3.0);
            }

            // 最后 4 波按难度20综合压力模型补齐职能缺口，但保留20座总建塔上限。
            const endgameProfile = aiPlanningEnemyProfile();

            // ★ 全局预知：波峰即将到来时，优先升级现有塔（提升质量）而不是继续铺塔
            if (endgameProfile.globalAware && endgameProfile.wavesUntilPeak <= 2 && endgameProfile.peakCount > 0) {
                upgradeBias += 0.30;
                buildBias *= 0.88;
            }

            if (endgameProfile.difficulty20 && build) {
                const roles = aiDifficulty20RoleState(endgameProfile);
                const roleGap = roles.aoe < roles.aoeNeed || roles.jammer < roles.jammerNeed ||
                    roles.air < roles.airNeed || roles.control < roles.controlNeed || roles.heavy < roles.heavyNeed;
                if (roleGap) {
                    upgradeBias = Math.min(upgradeBias, 1.55);
                    buildBias = Math.max(buildBias, 2.05);
                }
                // 地面群攻明显短缺时，即使已有少量 AOE，也持续补足而不是转回单体塔升级。
                if (roles.aoeNeed - roles.aoe >= 1.15 && endgameProfile.groundRatio > 0.10 && (endgameProfile.total > 45 || endgameProfile.swarmRatio > 0.55 || endgameProfile.endgameUniversal)) {
                    upgradeBias = Math.min(upgradeBias, 1.18);
                    buildBias = Math.max(buildBias, 2.45);
                }
                // 飞行单位只能由防空塔处理，防空缺口也必须优先补齐。
                if (AI_ASCENSION_STATE.airOnlyFlak && roles.airNeed > roles.air + 0.5) {
                    upgradeBias = Math.min(upgradeBias, 1.25);
                    buildBias = Math.max(buildBias, 2.30);
                }
            }

                        // ★ 群体压力大且缺乏 AOE / 控场塔时，优先补塔而不是继续升级单体塔
            if (build) {
                const prof = aiPlanningEnemyProfile();
                const swarmR = prof.swarmRatio || 0;
                const loadR = Math.min(1, (prof.total || 0) / 38);
                const sizeR = Math.min(1, Math.max(0, (prof.avgGroupSize || 0) - 2) / 8);
                const spawnR = Math.min(1, (prof.spawnPressure || 0) / Math.max(1, prof.total || 1));
                const gp = Math.min(1, swarmR * 0.25 + loadR * 0.48 + sizeR * 0.15 + spawnR * 0.12);
                const roleNow = aiDifficulty20RoleState(prof);
                const aoeCnt = roleNow.aoe;
                if (gp >= 0.48 && aoeCnt < Math.min(2.0, roleNow.aoeNeed)) {
                    const cost0 = getBuildCost(build.type, build.col, build.row);
                    if (money >= cost0 + (aiDifficulty20AmmoReserve() * 0.5) && canBuildAt(build.col, build.row)) {
                        closeBuildMenu(); closeTowerMenu();
                        addTower(build.col, build.row, build.type);
                        rebuildPaths(); updateUI();
                        aiConsumePlanPositionIfFromPlan(build);
                        aiLastAssistantAction = `紧急补 AOE：${TOWER_TYPES[build.type].name}（群体威胁高）`;
                        aiSetStatus(`智能托管：${aiLastAssistantAction}`);
                        aiAddMessage(`托管已执行：${aiLastAssistantAction}。`, 'bot');
                        aiLastRecommendation = null; aiSetApplyEnabled(false);
                        return;
                    }
                }
            }


            const criticalResponse = (liveJammers.length > 0 && !hasSafeJammerCounter) ||
                (liveCarriers.length > 0 && !hasCarrierCounter) || coreRatio < 0.30;
            const ammoReserve = criticalResponse ? 0 : aiDifficulty20AmmoReserve();
            const spendableMoney = Math.max(0, money - ammoReserve);
            const upAffordable = !!up && up.cost <= spendableMoney;
            const buildAffordable = !!build && build.cost <= spendableMoney;
            if (!upAffordable && !buildAffordable) {
                aiSetStatus(`难度20资源管理：预留 ${ammoReserve} 金币用于弹药装填`);
                return;
            }
            const chooseUpgrade = upAffordable && (!buildAffordable || up.score * upgradeBias >= build.score * buildBias);

            if (chooseUpgrade) {
                const t = up.tower;
                const cost = getUpgradeCostEffective(t.type, t.level, t.col, t.row);

            } else {

                const cost = getBuildCost(build.type, build.col, build.row);
                const reserve = 0;

                closeBuildMenu(); closeTowerMenu();

            }

        (() => {

            const handle = panel?.querySelector('.ai-head');
            if (!panel || !handle) return;

            let dragging = false;
            let activePointerId = null;
            let startX = 0, startY = 0, startLeft = 0, startTop = 0;

            const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));

            handle.addEventListener('pointerdown', (e) => {
                // 只响应鼠标左键；标题栏中的关闭按钮仍保持原有点击行为
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (e.target.closest('button, input, textarea, select, a')) return;
                if (panel.classList.contains('hidden')) return;

                const rect = panel.getBoundingClientRect();
                dragging = true;
                activePointerId = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;

                // 改用 left/top 定位，避免同时受 right/bottom 和移动端媒体查询影响
                panel.style.left = `${rect.left}px`;
                panel.style.top = `${rect.top}px`;
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';

                try { handle.setPointerCapture(e.pointerId); } catch (_) {}
                e.preventDefault();
            });

            handle.addEventListener('pointermove', (e) => {
                if (!dragging || e.pointerId !== activePointerId) return;
                const rect = panel.getBoundingClientRect();
                const margin = 8;
                const maxLeft = window.innerWidth - rect.width - margin;
                const maxTop = window.innerHeight - rect.height - margin;
                const left = clamp(startLeft + e.clientX - startX, margin, maxLeft);
                const top = clamp(startTop + e.clientY - startY, margin, maxTop);
                panel.style.left = `${left}px`;
                panel.style.top = `${top}px`;
            });

            const stopDragging = (e) => {
                if (!dragging || (e && e.pointerId !== activePointerId)) return;
                dragging = false;
                activePointerId = null;
            };
            handle.addEventListener('pointerup', stopDragging);
            handle.addEventListener('pointercancel', stopDragging);
            handle.addEventListener('lostpointercapture', stopDragging);
        })();

        function roundRect(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.lineTo(x + w - r, y);
            c.arcTo(x + w, y, x + w, y + r, r);
            c.lineTo(x + w, y + h - r);
            c.arcTo(x + w, y + h, x + w - r, y + h, r);
            c.lineTo(x + r, y + h);
            c.arcTo(x, y + h, x, y + h - r, r);
            c.lineTo(x, y + r);
            c.arcTo(x, y, x + r, y, r);
            c.closePath();
        }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(80, 140, 210, 0.10)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 43; i++) {
                const y = 20 + i * 16;
                ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(canvas.width - 24, y); ctx.stroke();

        function wrapTextLines(c, text, maxWidth) {
            const lines = [];
            let current = '';
            const NO_LINE_START = '，。、；：？！）》」』】〉”’·…—～';
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '\n') { lines.push(current); current = ''; continue; }
                const test = current + ch;
                if (c.measureText(test).width > maxWidth && current.length > 0) {
                    if (NO_LINE_START.indexOf(ch) !== -1 && current.length > 1) {
                        const last = current[current.length - 1];
                        lines.push(current.slice(0, -1));
                        current = last + ch;
                    } else {
                        lines.push(current);
                        current = ch;
                    }
                } else {
                    current = test;
                }
            }
            if (current.length > 0) lines.push(current);
            return lines;
        }

        function drawIntroCard(x, y, w, h, item) {

            ctx.fillText(item[1], x + 64, y + h / 2 + 1);
            ctx.font = '18px "Microsoft YaHei"'; ctx.fillStyle = '#8fb0d0';
            const textX = x + 190;
            const textMaxW = w - 220;
            const lineH = 17;
            const lines = wrapTextLines(ctx, item[2], textMaxW);
            const totalH = lines.length * lineH;
            let startY = y + h / 2 - totalH / 2 + lineH / 2;

        function drawIntro() {
            drawBackdrop();

            ctx.font = 'bold 24px "Microsoft YaHei"'; ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#2a6fdb'; ctx.shadowBlur = 18;

            ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#7a9ac0';
            ctx.fillText('鼠标滚轮上下滑动', canvas.width / 2, 60);
            drawBackBtn();

            // 卡片横向铺满界面：左右各留 20px 边距
            const sideMargin = 20;
            const cardW = canvas.width - sideMargin * 2;
            const gapY = 14;
            const startX = sideMargin;
            const top = 78;
            const viewH = canvas.height - top - 12;
            const lineH = 17;

            ctx.font = '12.5px "Microsoft YaHei"';
            const cardHeights = INTRO_ITEMS.map(item => {
                const lines = wrapTextLines(ctx, item[2], cardW - 220);
                const textH = lines.length * lineH;
                return Math.max(76, textH + 26);
            });

            let contentH = 0;
            for (let i = 0; i < cardHeights.length; i++) {
                contentH += cardHeights[i];
                if (i < cardHeights.length - 1) contentH += gapY;
            }
            maxScroll = Math.max(0, contentH - viewH + 12);
            scrollY = Math.max(0, Math.min(maxScroll, scrollY));

            ctx.save();
            ctx.beginPath(); ctx.rect(0, top, canvas.width, viewH); ctx.clip();
            ctx.translate(0, -scrollY);
            let cy = top;
            for (let i = 0; i < INTRO_ITEMS.length; i++) {
                const cardH = cardHeights[i];
                if (cy - scrollY > canvas.height + 120 || cy - scrollY + cardH < top - 120) {
                    cy += cardH + gapY;
                    continue;
                }
                drawIntroCard(startX, cy, cardW, cardH, INTRO_ITEMS[i]);
                cy += cardH + gapY;
            }
            ctx.restore();
            drawScrollbar(top, viewH);
        }

        function enemyStatRange(key) {
            const es = ENEMY_STATS[key] || { hpFactor: 1, spdFactor: 1 };
            const hpLo = Math.round(26 * 2.9 * es.hpFactor);
            const hpHi = Math.round((26 + 9 * 8) * 2.9 * es.hpFactor);
            const spLo = (1.00 * es.spdFactor).toFixed(2);
            const spHi = (1.00 + 9 * 0.03) * es.spdFactor;
            return { hpLo, hpHi, spLo, spHi: spHi.toFixed(2) };
        }

        function drawEnemyIcon(c, key, px, py, size) {

        function drawStealthShape(c, type, size, color) {
            c.save();
            const base = c.globalAlpha;
            c.fillStyle = color; c.shadowColor = color;
            switch (type) {
                case 'wraith': {
                    c.beginPath(); c.moveTo(0, -size * 1.25); c.lineTo(size * 0.9, size * 0.6);
                    c.lineTo(0, size * 0.18); c.lineTo(-size * 0.9, size * 0.6); c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.45)';
                    c.beginPath(); c.moveTo(0, -size * 0.55); c.lineTo(size * 0.4, size * 0.32);
                    c.lineTo(0, size * 0.06); c.lineTo(-size * 0.4, size * 0.32); c.closePath(); c.fill(); break;

                    c.globalAlpha = base * 0.65;
                    c.beginPath(); c.arc(size * 0.48, -size * 0.14, size * 0.7, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = base;
                    c.beginPath(); c.arc(0, 0, size * 0.78, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    c.beginPath(); c.arc(0, 0, size * 0.34, 0, Math.PI * 2); c.fill(); break;
                }
                case 'stalker': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const rr = (i % 2 === 0) ? size * 1.18 : size * 0.7;
                        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.moveTo(0, -size * 0.52); c.lineTo(size * 0.34, 0);
                    c.lineTo(0, size * 0.52); c.lineTo(-size * 0.34, 0); c.closePath(); c.fill(); break;
                }
                case 'specter': {
                    c.beginPath(); c.moveTo(-size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(-size * 1.9, -size * 0.95, -size * 1.5, size * 0.4);
                    c.quadraticCurveTo(-size * 1.0, size * 0.12, -size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(size * 0.55, -size * 0.15);
                    c.quadraticCurveTo(size * 1.9, -size * 0.95, size * 1.5, size * 0.4);
                    c.quadraticCurveTo(size * 1.0, size * 0.12, size * 0.55, size * 0.4);
                    c.closePath(); c.fill();
                    c.beginPath(); c.moveTo(-size * 0.52, size * 0.5);
                    c.quadraticCurveTo(0, size * 1.45, size * 0.52, size * 0.5);
                    c.closePath(); c.fill();
                    c.beginPath(); c.arc(0, 0, size * 0.76, 0, Math.PI * 2); c.fill();
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    c.beginPath(); c.arc(0, 0, size * 0.3, 0, Math.PI * 2); c.fill(); break;
                }
                case 'shade': {
                    c.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        const px = Math.cos(a) * size * 1.0;
                        const py = Math.sin(a) * size * 1.0;
                        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
                    }
                    c.closePath(); c.fill();
                    for (let i = 0; i < 6; i++) {
                        const a = -Math.PI / 2 + i * Math.PI / 3;
                        c.beginPath();
                        c.moveTo(Math.cos(a - 0.2) * size * 0.95, Math.sin(a - 0.2) * size * 0.95);
                        c.lineTo(Math.cos(a) * size * 1.48, Math.sin(a) * size * 1.48);
                        c.lineTo(Math.cos(a + 0.2) * size * 0.95, Math.sin(a + 0.2) * size * 0.95);
                        c.closePath(); c.fill();
                    }
                    c.shadowBlur = 0; c.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    c.beginPath(); c.arc(0, 0, size * 0.46, 0, Math.PI * 2); c.fill();
                    c.fillStyle = 'rgba(205, 175, 255, 0.95)';
                    c.beginPath(); c.arc(0, 0, size * 0.2, 0, Math.PI * 2); c.fill(); break;
                }
            }
            c.restore();
        }

                function drawSpecialEnemyBody(c, type, size, color) {

        function getLevelCardRect(i, scroll) {

            const c = i % LV_COLS, r = Math.floor(i / LV_COLS);

        function levelCardAt(mx, my) {
            if (my < LEVELS_TOP || my > canvas.height) return -1;
            const totalW = LV_COLS * LV_CARD_W + (LV_COLS - 1) * LV_GAP_X;
            const startX = Math.max(340, (canvas.width - totalW) / 2 + 60);
            const lx = mx - startX;
            if (lx < 0) return -1;
            const c = Math.floor(lx / (LV_CARD_W + LV_GAP_X));
            if (c < 0 || c >= LV_COLS) return -1;
            if (lx - c * (LV_CARD_W + LV_GAP_X) > LV_CARD_W) return -1;
            const cy = my - LEVELS_TOP + scrollY;
            if (cy < 0) return -1;
            const r = Math.floor(cy / (LV_CARD_H + LV_GAP_Y));
            if (cy - r * (LV_CARD_H + LV_GAP_Y) > LV_CARD_H) return -1;
            const idx = r * LV_COLS + c;
            if (idx < 0 || idx >= LEVELS.length) return -1;
            return idx;
        }

        // 面板：加宽加高（右侧预留奖牌要求框的位置）

        function getModePanelLayout() {

        const levelThumbCache = new Map();
        const levelThumbPending = new Set();
        const LEVEL_THUMB_W = ASC_PANEL_W, LEVEL_THUMB_H = 100;

        function drawLevelThumbnail(x, y, w, h, level, idx) {
            const tc = levelThumbCache.get(idx);
            if (!tc) {
                // 缩略图不在这一帧里现画：先占位，交给 pumpLevelThumbnails 每帧补两张
                if (typeof idx === 'number') levelThumbPending.add(idx);
                ctx.save();
                ctx.fillStyle = '#0c1420';
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = 'rgba(126, 200, 255, 0.32)';
                ctx.font = '13px "Microsoft YaHei"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('生成中…', x + w / 2, y + h / 2);
                ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
                ctx.restore();
                return;
            }
            ctx.drawImage(tc, Math.round(x), Math.round(y));
            ctx.strokeStyle = '#2e4a6e'; ctx.lineWidth = 1;
            ctx.strokeRect(x, y, w, h);
        }

        // 进入选关页时把还没生成的缩略图全部排进队列，每帧补几张，滚到哪儿都是现成的
        function queueAllLevelThumbs() {
            for (let i = 0; i < LEVELS.length; i++) {
                if (!levelThumbCache.has(i)) levelThumbPending.add(i);
            }
        }

        // 每帧最多补两张缩略图，优先当前视口内的卡片——滚动时不再一帧连画多张
        function pumpLevelThumbnails(budget) {
            if (levelThumbPending.size === 0) return;
            const viewTop = scrollY, viewBot = scrollY + (canvas.height - LEVELS_TOP);
            const near = [], far = [];
            for (const idx of levelThumbPending) {
                const rowY = Math.floor(idx / LV_COLS) * (LV_CARD_H + LV_GAP_Y);
                if (rowY >= viewTop - LV_CARD_H && rowY <= viewBot) near.push(idx); else far.push(idx);
            }
            near.sort((a, b) => a - b);
            far.sort((a, b) => a - b);
            const order = near.concat(far);
            let n = 0;
            for (const idx of order) {
                if (n >= budget) break;
                const lv = LEVELS[idx];
                levelThumbPending.delete(idx);
                if (!lv) continue;
                let tc = null;
                try {
                    tc = renderLevelThumbnail(LEVEL_THUMB_W, LEVEL_THUMB_H, lv, idx);
                } catch (err) {
                    // 兜底：个别关卡画不出来也不能让整帧渲染断掉
                    tc = document.createElement('canvas');
                    tc.width = LEVEL_THUMB_W; tc.height = LEVEL_THUMB_H;
                    const gg = tc.getContext('2d');
                    gg.fillStyle = '#101a28';
                    gg.fillRect(0, 0, tc.width, tc.height);
                    gg.strokeStyle = '#2e4a6e';
                    gg.strokeRect(0.5, 0.5, tc.width - 1, tc.height - 1);
                }
                levelThumbCache.set(idx, tc);
                n++;
            }
        }

        function renderLevelThumbnail(w, h, level, idx) {
            const tms = MAP_STYLES[mapStyleKeyForLevel(typeof idx === 'number' ? idx : 0, level)] || MAP_STYLES.void;
            const cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            const g = cv.getContext('2d');
            g.fillStyle = tms.floor[0];
            g.fillRect(0, 0, w, h);

            const tRows = Math.max(1, level.map.length);
            let tCols = 1;
            for (const row of level.map) tCols = Math.max(tCols, row.length);
            const cellSize = Math.min(w / tCols, h / tRows);
            const gx = (w - tCols * cellSize) / 2;
            const gy = (h - tRows * cellSize) / 2;

            // 1. 基础地板：与游戏内 rebuildBackground 共用同一套绘制
            paintFloorBase(g, tCols, tRows, cellSize, gx, gy, tms);

            // 2. 逐格图块：与游戏内保持完全一致
            for (let r = 0; r < tRows; r++) {
                const rowStr = level.map[r] || '';
                for (let c = 0; c < tCols; c++) {
                    const ch = rowStr[c];
                    const px = gx + c * cellSize;
                    const py = gy + r * cellSize;
                    const cx = px + cellSize / 2;
                    const cy = py + cellSize / 2;
                    g.save();
                    if (ch === '#') {
                        drawRockWall(g, px, py, cellSize, c, r, tileNoiseHash, tms);
                    } else if (ch === 'X') {
                        drawArmorWall(g, px, py, cellSize, c, r, tileNoiseHash, tms);
                    } else if (ch === '.') {
                        drawNoBuildFloor(g, px, py, cellSize, c, r, tileNoiseHash, tms);
                    } else if (ch === '+') {
                        drawCrossJunction(g, px, py, cellSize, tms);
                    } else if (ch === 'S') {
                        // 入口：亮绿圆 + 中心高光点（与游戏内绿色脉冲点对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.38, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(74, 255, 120, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.15, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(220, 255, 230, 0.95)'; g.fill();
                    } else if (ch === 'E') {
                        // 出口：发光橙色虚线圆 + 内部淡填充 + 中心亮点，更显眼
                        g.save();
                        g.shadowColor = 'rgba(255, 170, 68, 0.9)';
                        g.shadowBlur = Math.max(3, cellSize * 0.35);
                        // 内部淡橙色填充
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.34, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 170, 68, 0.30)';
                        g.fill();
                        // 粗虚线外圈
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.36, 0, Math.PI * 2);
                        g.strokeStyle = 'rgba(255, 190, 90, 1)';
                        g.lineWidth = Math.max(1.5, cellSize * 0.10);
                        const dash = Math.max(1.5, cellSize * 0.16);
                        g.setLineDash([dash, dash]);
                        g.stroke();
                        g.setLineDash([]);
                        // 中心亮点
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.12, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 232, 180, 1)';
                        g.fill();
                        g.restore();
                    } else if (ch === 'C') {
                        // 基地：红圆 + 深色内芯（与游戏内显示核心数的位置对应）
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.4, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(255, 85, 85, 0.9)'; g.fill();
                        g.beginPath(); g.arc(cx, cy, cellSize * 0.2, 0, Math.PI * 2);
                        g.fillStyle = 'rgba(30, 6, 6, 0.9)'; g.fill();
                    } else {
                        // 可建造空地（空格 / 'o' / 越界字符）：中心加号标记
                        drawBuildableFloorMark(g, px, py, cellSize, tms);
                    }
                    g.restore();
                }
            }
            return cv;
        }

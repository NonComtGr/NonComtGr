                canvas { display: block; margin: 0 auto; border-radius: 0.8rem; box-shadow: 0 0 0 2px #2e4a6e, 0 0 30px #000; background: #0b0f17; cursor: pointer; max-width: 100%;max-height: 80vh;object-fit:contain; }

        .info-bar .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
        .info-bar .msg { color: #ffaa44; white-space: nowrap; flex: 0 0 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
        .hidden { display: none !important; }
        .tower-tip { position: fixed; z-index: 999; background: rgba(10, 17, 30, 0.97); border: 1px solid #3a6a9a; border-radius: 10px; padding: 9px 11px; color: #c0dcff; font-size: 12px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 22px rgba(60,140,220,0.28); pointer-events: none; white-space: normal; word-break: break-word; overflow-wrap: break-word; max-width: 480px; }
        /* 炮塔详情面板比敌人面板更宽，内部走一套更舒展的排版 */
        .tower-tip .tt-wide { min-width: 430px; }
        .tower-tip .tt-wide table { width: 100%; }
        .tower-tip .tt-wide th { padding: 3px 10px; font-size: 11.5px; letter-spacing: 0.02em; }
        .tower-tip .tt-wide td { padding: 3px 10px; font-size: 12.5px; }
        .tower-tip .tt-wide .tt-note { text-align: left; line-height: 1.55; padding-left: 2px; }
        .tower-tip .tt-wide .tt-note b { color: #cfe6ff; font-weight: normal; }
        .tower-tip .tt-wide .tt-two { display: flex; justify-content: space-between; gap: 14px; }
        .tower-tip .tt-wide .tt-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }

        .tower-tip .tt-wide .tt-kv { color: #ffb86b; }
        /* 窄屏（手机竖屏 / 小窗）时不强制宽度，交给屏幕边界保护 */
        @media (max-width: 540px) {
            .tower-tip .tt-wide { min-width: 0; }

        /* ============================================================
   移动端 / 触摸屏适配
   ============================================================ */
html, body {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
}
canvas { touch-action: none; }

#rotateHint { display: none; }

        @media (pointer: coarse) {
            html, body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                margin: 0;
                padding: 0;
                -webkit-tap-highlight-color: transparent;
                overscroll-behavior: none;
            }
            body {
                display: block;
                background: #05080f;
            }

            .game-wrapper {
                width: 100vw;
                height: 100vh;                 /* 老浏览器回退 */
                height: 100dvh;                /* 动态视口 */
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                background: #05080f;
                display: flex;                 /* ★ 改成 flex column */
                flex-direction: column;
                overflow: hidden;
            }
            #gameTitle { display: none; }

            /* ★ 关键：包裹层用 flex 吃掉剩余高度，min-height:0 允许它缩小 */
            .canvas-wrap {
                flex: 1 1 0;
                min-height: 0;                 /* ★ 核心修复 */
                min-width: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            .canvas-wrap > #gameCanvas {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                box-shadow: none;
                cursor: default;
                touch-action: none;
            }

            .save-bar {
                flex: 0 0 auto;
                margin: 0;
                padding: 3px 6px;
                min-height: 0;
                gap: 6px;
                background: #05080f;
            }
            .save-bar .save-info { display: none; }
            .save-bar button.action { height: 26px; font-size: 11px; padding: 0 8px; }

            .hud {
                flex: 0 0 auto;                /* ★ 不再被挤走 */
                margin: 0;
                padding: 4px 6px 6px;
                gap: 4px;
                min-height: 0;
                background: #05080f;
            }
            .hud > div { gap: 4px !important; }
            .hud button.action {
                height: 30px;
                font-size: 11px;
                padding: 0 9px;
                border-radius: 15px;
            }

            .info-bar { display: none !important; }

            .tower-tip {
                font-size: 11px;
                max-width: 240px;
                padding: 7px 9px;
            }
            .tower-tip .tt-title { font-size: 12px; }
        }
        

        @media (pointer: coarse) and (orientation: portrait) {
            #rotateHint {
                display: flex;
                position: fixed;
                inset: 0;
                z-index: 99999;
                background: #05080f;
                color: #7ec8ff;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 14px;
                font-size: 16px;
                letter-spacing: 1px;
                text-align: center;
                padding: 24px;
            }
        }

/* 竖屏时盖一层提示 */
@media (pointer: coarse) and (orientation: portrait) {
    #rotateHint {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #05080f;
        color: #7ec8ff;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        font-size: 16px;
        letter-spacing: 1px;
        text-align: center;
        padding: 24px;
    }
}

        /* ================= AI 战术助手 ================= */

            display: flex; flex-direction: column; overflow: hidden;
            color: #d9eaff; background: rgba(9, 17, 31, .97);

        .ai-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 13px; background:linear-gradient(110deg,#153452,#17223a); border-bottom:1px solid #2d5278; }
        /* AI 助手可通过顶部标题栏拖动 */
        .ai-head { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
        .ai-head:active { cursor: grabbing; }
        .ai-head button { cursor: pointer; }

        .ai-head small { display:block; color:#7295b9; font-size:10px; margin-top:2px; font-weight:400; }
        .ai-close { border:0; border-radius:8px; width:28px; height:28px; cursor:pointer; color:#a9c9e8; background:#263a53; font-size:18px; }

        .ai-log { min-height:90px; max-height: min(34vh, 290px); overflow:auto; padding:10px; display:flex; flex-direction:column; gap:8px; scrollbar-width:thin; }
        .ai-msg { max-width:96%; padding:8px 10px; border-radius:10px; font-size:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }

        .ai-actions button:hover { background:#244969; border-color:#6bb8f0; }

        .ai-auto { display:flex; align-items:center; gap:7px; padding:7px 11px; border-top:1px solid #203954; color:#ffd978; font-size:11px; }
        .ai-auto input { accent-color:#42d98a; }

        @media (pointer: coarse) {
            .ai-assistant { top:auto; bottom:74px; right:8px; width:min(340px, calc(100vw - 16px)); max-height:65vh; }
            .ai-log { max-height:22vh; }
        }

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const moneyDisplay = document.getElementById('moneyDisplay');
        const coreDisplay = document.getElementById('coreDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const msgDisplay = document.getElementById('msgDisplay');
        const sellBtn = document.getElementById('sellBtn');
        const speedBtn = document.getElementById('speedBtn');
        const nextWaveBtn = document.getElementById('nextWaveBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const hud = document.getElementById('hud');
        const infoBar = document.getElementById('infoBar');
        const gameTitle = document.getElementById('gameTitle');
        const tipEl = document.getElementById('towerTip');

        // ---------- 音效系统 ----------
        const SFX = (function () {
            let actx = null, master = null, enabled = true, noiseBuf = null;
            const lastAt = Object.create(null);
            function unlock() {
                if (!actx) {
                    try {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        actx = new AC();
                        master = actx.createGain();
                        master.gain.value = 0.5;
                        master.connect(actx.destination);
                    } catch (e) { actx = null; return; }
                }
                if (actx.state === 'suspended') actx.resume();
            }
            function ok() { return !!actx && enabled && actx.state === 'running'; }
            function throttle(key, ms) {
                const t = performance.now();
                const prev = lastAt[key];
                if (prev !== undefined && t - prev < ms) return false;
                lastAt[key] = t; return true;
            }
            function tone(freq, dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                const t0 = actx.currentTime + (opt.delay || 0);
                const osc = actx.createOscillator();
                const g = actx.createGain();
                osc.type = opt.type || 'sine';
                osc.frequency.setValueAtTime(freq, t0);
                if (opt.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur);
                const vol = opt.vol == null ? 0.2 : opt.vol;
                const atk = opt.attack == null ? 0.004 : opt.attack;
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.linearRampToValueAtTime(vol, t0 + atk);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(g); g.connect(master);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            }
            function noise(dur, opt) {
                if (!ok()) return;
                opt = opt || {};
                if (!noiseBuf) {
                    const n = Math.max(1, Math.floor(actx.sampleRate * 0.6));
                    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
                    const d = noiseBuf.getChannelData(0);
                    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                }
                const t0 = actx.currentTime + (opt.delay || 0);
                const src = actx.createBufferSource();
                src.buffer = noiseBuf; src.loop = true;
                const flt = actx.createBiquadFilter();
                flt.type = opt.filter || 'lowpass';
                flt.frequency.setValueAtTime(opt.freq || 1200, t0);
                if (opt.to) flt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.to), t0 + dur);
                flt.Q.value = opt.q == null ? 0.8 : opt.q;
                const g = actx.createGain();
                const vol = opt.vol == null ? 0.2 : opt.vol;
                g.gain.setValueAtTime(vol, t0);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                src.connect(flt); flt.connect(g); g.connect(master);
                src.start(t0); src.stop(t0 + dur + 0.05);
            }
            return {
                unlock,
                toggle() { enabled = !enabled; return enabled; },
                isOn() { return enabled; },
                click() { if (!throttle('click', 45)) return; tone(720, 0.05, { type: 'triangle', vol: 0.08, to: 980 }); },
                error() { if (!throttle('error', 160)) return; tone(200, 0.11, { type: 'square', vol: 0.09, to: 130 }); tone(140, 0.13, { type: 'square', vol: 0.07, to: 90, delay: 0.07 }); },
                build() { if (!throttle('build', 50)) return; noise(0.09, { vol: 0.12, freq: 800, to: 2600, filter: 'bandpass', q: 1.4 }); tone(280, 0.10, { type: 'triangle', vol: 0.10, to: 540 }); },
                sell() { if (!throttle('sell', 50)) return; tone(640, 0.09, { type: 'triangle', vol: 0.09, to: 320 }); noise(0.10, { vol: 0.06, freq: 2400, to: 500 }); },
                upgrade() { if (!throttle('upgrade', 70)) return; tone(560, 0.08, { type: 'triangle', vol: 0.09, to: 820 }); tone(840, 0.10, { type: 'sine', vol: 0.07, to: 1180, delay: 0.06 }); },

// 稀有度权重表（数值越小越不敏感，1 为标准）
const SYN_RARITY_WEIGHT = {
    dmg: 1.00, rate: 1.15, range: 1.40, crit: 2.60, slow: 1.60,
    poison: 1.00, stun: 0.70, splash: 0.90, burn: 1.00, harvest: 1.40,
    targets: 0.45, chain: 0.35, pierce: 0.70, reveal: 1.30
};

function calcSynergyRarity(s) {
    let w = 0;
    for (const k in s.mods) w += (SYN_RARITY_WEIGHT[k] || 1) * s.mods[k] * s.cap;
    if (w >= 0.85) return 'epic';
    if (w >= 0.60) return 'rare';
    if (w >= 0.38) return 'uncommon';
    return 'common';
}

function buildSynergyDesc(s) {
    const aName = TOWER_TYPES[s.a].name;
    const bName = TOWER_TYPES[s.b].name;
    const parts = [];
    for (const k in s.mods) {
        const meta = SYN_MOD_TEXT[k];
        if (!meta) continue;
        parts.push(`${meta.label} ${meta.fmt(s.mods[k])}`);
    }
    return `每有 1 座${bName}，${aName}${parts.join(' · ')}`;
}

    const r = Math.random();
    if (r < 0.50) return 0;
    if (r < 0.80) return 1;
    if (r < 0.95) return 2;
    return 3;
}

        // ============================================================
        // 回档系统（Backspace）：每波开始前留档，按一下退回 3 波
        // ============================================================
        function pushRewindSnapshot() {
            if (screen !== 'game' || gameOver || !currentLevel) return;
            let st = null;
            try { st = captureGameState(); } catch (err) { console.error('回档快照失败：', err); return; }
            rewindHistory.push({ wave: waveIndex + 1, state: st });
            while (rewindHistory.length > REWIND_KEEP) rewindHistory.shift();
        }

        function rewindWaves(back) {
            if (screen !== 'game' || !currentLevel) return;
            back = (back > 0) ? back : REWIND_BACK;
            const beforeWave = waveIndex;
            const target = Math.max(1, beforeWave - back);
            let entry = null, fallback = null;
            for (const h of rewindHistory) {
                if (h.wave === target) { entry = h; break; }
                if (h.wave <= target && (!fallback || h.wave > fallback.wave)) fallback = h;
            }
            entry = entry || fallback;
            if (!entry) {
                msgDisplay.textContent = `⚠ 回档记录不足（当前第 ${beforeWave} 波，无法退回 ${back} 波）`;
                SFX.error();
                return;
            }
            const restored = entry.wave;
            // 比回档点更晚的记录全部作废，连续回档才不会错位
            rewindHistory = rewindHistory.filter(h => h.wave < restored);
            let ok = false;
            try { ok = applySavedState(entry.state); } catch (err) { console.error('回档失败：', err); ok = false; }
            if (!ok) { msgDisplay.textContent = '⚠ 回档失败'; SFX.error(); return; }
            // 回档后给 3 秒准备时间，别让下一波立刻压上来把提示冲掉
            nextWaveAt = Math.max(nextWaveAt, gameClock + 3);
            SFX.click();
            const totalLabel = (currentModeKey === 'endless') ? '∞' : totalWaves;
            msgDisplay.textContent = `⏪ 已回档到第 ${restored}/${totalLabel} 波开波前（退回 ${beforeWave - restored} 波）`;
        }

        function saveGame() {
            if (screen !== 'game' || !currentLevel || gameOver) {
                msgDisplay.textContent = '⚠ 只有在战斗进行中才能存档';
                SFX.error();
                return;
            }
            if (draftPanel) {
                msgDisplay.textContent = '⚠ 请先完成强化选择再存档';
                SFX.error();
                return;
            }
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(captureGameState()));
                SFX.click();
                msgDisplay.textContent = `💾 存档成功 · ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                msgDisplay.textContent = '⚠ 存档失败：浏览器存储空间不足或被禁用';
                SFX.error();
            }
            refreshSaveInfo();
        }

        function loadGame() {
            let raw = null;
            try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
            if (!raw) {
                msgDisplay.textContent = '⚠ 没有可读取的存档';
                SFX.error();
                return;
            }
            let s = null;
            try { s = JSON.parse(raw); } catch (e) { s = null; }
            if (!s) {
                msgDisplay.textContent = '⚠ 存档文件已损坏';
                SFX.error();
                return;
            }
            let ok = false;
            try { ok = applySavedState(s); } catch (e) {
                console.error('读档失败', e);
                ok = false;
            }
            if (!ok) {
                msgDisplay.textContent = '⚠ 存档与当前版本不兼容';
                SFX.error();
                return;
            }
            rewindHistory = [];     // 读档换了一条时间线，旧的回档记录作废
            SFX.click();
            msgDisplay.textContent = '📂 存档已载入';
            refreshSaveInfo();
        }

        function refreshSaveInfo() {
            const infoEl = document.getElementById('saveInfo');
            const btn = document.getElementById('loadBtn');
            let raw = null;
            try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
            if (!raw) {
                if (infoEl) infoEl.textContent = '（无存档）';
                if (btn) btn.classList.add('disabled');
                return;
            }
            if (btn) btn.classList.remove('disabled');
            let ts = 0;
            try { ts = JSON.parse(raw).ts || 0; } catch (e) { ts = 0; }
            if (infoEl) {
                infoEl.textContent = ts
                    ? '上次存档：' + new Date(ts).toLocaleString()
                    : '已有存档';
            }
        }

        function getPriceMul() {
            return (rogueState && rogueState.bonus && typeof rogueState.bonus.priceMul === 'number') ? rogueState.bonus.priceMul : 1;
        }
        // 回收塔「议价」增强：返回该格可享受的造价 / 升级费折扣（多座取最优，不叠加）
        function harvesterDiscountAt(col, row) {
            const out = { build: 1, upgrade: 1 };
            if (col === undefined || col === null || row === undefined || row === null) return out;
            let bm = null, um = null;
            try {
                bm = enhancementMod('harvester', 'discountBuild');
                um = enhancementMod('harvester', 'discountUpgrade');
            } catch (e) { return out; }
            if (!bm && !um) return out;
            let trs = [];
            try { trs = towers; } catch (e) { return out; }
            if (!trs || !trs.length) return out;
            const px = cellCenterX(col), py = cellCenterY(row);
            for (const t of trs) {
                if (t.type !== 'harvester') continue;
                const st = towerStatsAt('harvester', t.level);
                if (!st || !st.range) continue;
                const d = Math.hypot(cellCenterX(t.col) - px, cellCenterY(t.row) - py);
                if (d > st.range * CELL) continue;
                if (bm) out.build = Math.min(out.build, bm);
                if (um) out.upgrade = Math.min(out.upgrade, um);
            }
            return out;
        }

        function getBuildCost(type, col, row) {
            const d = TOWER_TYPES[type];
            if (!d) return 0;
            let inflation = 0;
            if (ascensionState && ascensionState.inflation) {
                inflation = Math.min(100, Math.floor(waveIndex / 10) * 20);
            }
            let cost = Math.max(1, Math.round(d.cost * getPriceMul()) + inflation);
            if (col !== undefined && col !== null && row !== undefined && row !== null) {
                const disc = harvesterDiscountAt(col, row);
                if (disc.build < 1) cost = Math.max(1, Math.round(cost * disc.build));
            }
            return cost;
        }
        function getUpgradeCostEffective(type, curLevel, col, row) {
            const base = getUpgradeCost(type, curLevel);
            if (base === null) return null;
            let inflation = 0;
            if (ascensionState && ascensionState.inflation) {
                inflation = Math.min(100, Math.floor(waveIndex / 10) * 20);
            }
            let cost = Math.max(1, Math.round(base * getPriceMul()) + inflation);
            if (col !== undefined && col !== null && row !== undefined && row !== null) {
                const disc = harvesterDiscountAt(col, row);
                if (disc.upgrade < 1) cost = Math.max(1, Math.round(cost * disc.upgrade));
            }
            return cost;
        }
        function getCoreDelayStacks() {
            return (rogueState && rogueState.enemyMods && rogueState.enemyMods.coreDelayStacks) || 0;
        }

        function makeWaveInterval(base) {
            const min = Math.max(7, Math.round(base * 0.5));
            return (w) => Math.max(min, base - w * 0.4) + 10.0;
        }

        // 地图排序系统
        //   规则①：按地图里 'o' 与 '.' 的数量之和对地图排序（少 → 多）；
        //   规则②：数量相同时按地图名称排序（中文按拼音，英文按字母）。
        //   每次载入页面都会重新排一遍，所以在 LEVELS 里新加的地图会自动排到对应位置，
        //   不需要再手动调整先后顺序。
        //   （想要反过来「多 → 少」，把 compareMapSortOrder 里的 ca - cb 改成 cb - ca 即可。）
        // ============================================================
        function countMapSortCells(lv) {
            if (!lv || !Array.isArray(lv.map)) return 0;
            let n = 0;
            for (const row of lv.map) {
                const cells = String(row || '');
                for (let c = 0; c < cells.length; c++) {
                    const ch = cells[c];
                    if (ch === 'o' || ch === '.') n++;
                }
            }
            return n;
        }
        function compareMapSortOrder(a, b) {
            const ca = countMapSortCells(a);
            const cb = countMapSortCells(b);
            if (ca !== cb) return ca - cb;   // ① o + . 的总数：少 → 多
            // ② 总数相同：按名称。中文用 zh-Hans-CN 排序规则，即拼音顺序；英文按字母。
            return String((a && a.name) || '').localeCompare(String((b && b.name) || ''), 'zh-Hans-CN');

                const donors = shuffleValues(allTypes);       // 随机双射：每个敌种领一份别人的属性
                chaosEnemyPermutation = Object.fromEntries(allTypes.map((type, i) => [type, donors[i]]));
            }
            // 先回到基准，再套用置换，避免切换关卡/重开时属性残留
            for (const [type, base] of Object.entries(ENEMY_BASELINE)) Object.assign(ENEMY_TYPES[type], base);
            for (const [type, base] of Object.entries(ENEMY_STATS_BASELINE)) Object.assign(ENEMY_STATS[type], base);
            for (const [type, donor] of Object.entries(chaosEnemyPermutation)) {
                const src = ENEMY_BASELINE[donor];
                if (!src) continue;
                // 飞行 (air) 与各类特性不动，只换体积与夺核数
                ENEMY_TYPES[type].size  = src.size;
                ENEMY_TYPES[type].steal = src.steal;
            }
        }

        // 移速越慢，血量越高（以 1.0 速率为基准，慢速部分线性加成，最多 +120%）
        // 混乱模式也按置换后的最终速度结算，保证「慢 = 肉」的直觉不被随机打散
        function slowEnemyHpBonus(spdFactor) {
            const spd = (spdFactor == null) ? 1 : spdFactor;
            const slow = Math.max(0, 1 - spd);
            return 1 + Math.min(1.20, slow * 2.20);
        }

        // 把混乱置换 + 慢速加血一次性结算到已生成的波次上：
        // 1) 混乱模式按同一份置换等比换算血量与速度（总盘不变，只换分布）
        // 2) 按最终速度补上慢速血量加成
        // 3) 同步属性表，供怪物图鉴与 AI 威胁评估使用（绝对赋值，重复生成不会累加）
        function applyEnemyWaveFinalStats(list) {
            if (!list || !list.length) return;
            const own = {};
            for (const w of list) {
                for (const g of (w.groups || [])) {
                    if (own[g.type]) continue;
                    const f = (g.hpF != null && g.spdF != null) ? { hp: g.hpF, spd: g.spdF } : ENEMY_WAVE_FACTOR[g.type];
                    if (f) own[g.type] = f;
                }
            }
            const ratio = {};
            if (chaosEnabled && chaosEnemyPermutation) {
                for (const w of list) {
                    for (const g of (w.groups || [])) {
                        const donor = chaosEnemyPermutation[g.type];
                        if (!donor) continue;
                        const ownF = own[g.type] || ENEMY_WAVE_FACTOR[g.type];
                        const srcF = own[donor] || ENEMY_WAVE_FACTOR[donor];
                        if (!ownF || !srcF || !ownF.hp || !ownF.spd) continue;
                        const hpBase = g.hp / ownF.hp;
                        const spdBase = g.speed / ownF.spd;
                        g.hp = Math.max(8, Math.round(hpBase * srcF.hp));
                        g.speed = spdBase * srcF.spd;
                        g.hpF = srcF.hp;
                        g.spdF = srcF.spd;
                        ratio[g.type] = { hp: srcF.hp / ownF.hp, spd: srcF.spd / ownF.spd };
                    }
                }
            }
            for (const w of list) {
                for (const g of (w.groups || [])) {
                    const bonus = slowEnemyHpBonus(g.spdF);
                    if (bonus > 1) g.hp = Math.max(8, Math.round(g.hp * bonus));
                    // 图鉴 / AI 用同一套数
                    const bs = ENEMY_STATS_BASELINE[g.type];
                    if (!bs) continue;
                    const r = ratio[g.type] || { hp: 1, spd: 1 };
                    ENEMY_STATS[g.type].hpFactor  = bs.hpFactor  * r.hp * bonus;
                    ENEMY_STATS[g.type].spdFactor = bs.spdFactor * r.spd;
                }
            }
        }


        // ============================================================
        // 全局统计：独立于单局存档与 AI 学习数据，跨刷新长期保存。
        // 只在建造/伤害/击杀/突破等既有事件点累计，不进行额外轮询。
        // ============================================================
        const GAME_STATS_KEY = 'defense_game_lifetime_stats_v1';
        const GAME_STATS = (function () {
            let data = null;
            const fresh = () => ({
                version: 1,
                totalStarts: 0, finishedGames: 0, wins: 0, losses: 0, rogueStarts: 0,
                restarts: 0, levelSelects: 0,
                medals: { gold: 0, silver: 0, copper: 0 },
                levels: {}, towers: {}, enemies: {}
            });
            function load() {
                if (data) return data;
                try {
                    const raw = localStorage.getItem(GAME_STATS_KEY);
                    data = raw ? JSON.parse(raw) : null;
                } catch (e) { data = null; }
                if (!data || data.version !== 1 || typeof data !== 'object') data = fresh();
                if (!data.levels || typeof data.levels !== 'object') data.levels = {};
                if (!data.towers || typeof data.towers !== 'object') data.towers = {};
                if (!data.enemies || typeof data.enemies !== 'object') data.enemies = {};
                for (const k of ['totalStarts','finishedGames','wins','losses','rogueStarts','restarts','levelSelects']) {
                    data[k] = Math.max(0, Number(data[k]) || 0);
                }
                // 奖牌次数：老存档没有这段，缺字段按 0 补齐
                if (!data.medals || typeof data.medals !== 'object') data.medals = { gold: 0, silver: 0, copper: 0 };
                for (const k of ['gold', 'silver', 'copper']) {
                    data.medals[k] = Math.max(0, Number(data.medals[k]) || 0);
                }
                return data;
            }
            let saveTimer = null, dirty = false;
            function flush() {
                if (saveTimer !== null) { clearTimeout(saveTimer); saveTimer = null; }
                if (!dirty) return;
                dirty = false;
                try { localStorage.setItem(GAME_STATS_KEY, JSON.stringify(load())); } catch (e) {}
            }
            function save() {
                dirty = true;
                // 战斗中伤害事件可能非常密集，最多每 750ms 写一次存档。
                if (saveTimer !== null) return;
                saveTimer = setTimeout(flush, 750);
            }
            function tower(type) {
                const d = load();
                return d.towers[type] || (d.towers[type] = {
                    built: 0, upgrades: 0, sold: 0, kills: 0,
                    damage: 0, buildCost: 0, upgradeCost: 0
                });
            }
            function enemy(type) {
                const d = load();
                return d.enemies[type] || (d.enemies[type] = {
                    spawned: 0, killed: 0, damageTaken: 0,
                    baseBreaches: 0, coresStolen: 0, coresLost: 0
                });
            }
            function recordPlay(levelIdx, modeKey, rogue) {
                const d = load();
                const key = String(Math.max(0, levelIdx | 0));
                if (!d.levels[key] || typeof d.levels[key] !== 'object') d.levels[key] = {};
                const countKey = modeKey + (rogue ? '_rogue' : '');
                d.levels[key][countKey] = (Number(d.levels[key][countKey]) || 0) + 1;
                d.totalStarts++;
                if (rogue) d.rogueStarts++;
                save();
            }
            function recordResult(win) {
                const d = load();
                d.finishedGames++;
                if (win) d.wins++; else d.losses++;
                save();
            }
            // 每次结算拿到奖牌计数（金/银/铜）；无尽沿用研磨入口奖牌的那次不重复计
            function recordMedal(kind) {
                if (kind !== 'gold' && kind !== 'silver' && kind !== 'copper') return;
                const d = load();
                d.medals[kind]++;
                save();
            }
            // 重开次数：点击「重新开始」重开当前局的次数
            function recordRestart() {
                const d = load();
                d.restarts++;
                save();
            }
            // 关卡内点击「关卡选择」返回的次数（只在战斗界面点这个按钮才计）
            function recordLevelSelect() {
                const d = load();
                d.levelSelects++;
                save();
            }
            function recordTowerBuild(type, cost) {
                if (!type) return;
                const t = tower(type); t.built++; t.buildCost += Math.max(0, Number(cost) || 0); save();
            }
            function recordTowerUpgrade(type, _level, cost) {
                if (!type) return;
                const t = tower(type); t.upgrades++;
                t.upgradeCost += Math.max(0, Number(cost) || 0); save();
            }
            function recordTowerSold(type) { if (!type) return; tower(type).sold++; save(); }
            function recordTowerDamage(type, amount) {
                if (!type || !(amount > 0)) return;
                tower(type).damage += amount; save();
            }
            function recordTowerKill(type) { if (!type) return; tower(type).kills++; save(); }
            function recordEnemySpawn(type) { if (!type) return; enemy(type).spawned++; save(); }
            function recordEnemyDamage(type, amount) {
                if (!type || !(amount > 0)) return;
                enemy(type).damageTaken += amount; save();
            }
            function recordEnemyKill(type) { if (!type) return; enemy(type).killed++; save(); }
            function recordEnemyBreach(type, stolen) {
                if (!type) return;
                const e = enemy(type); e.baseBreaches++;
                e.coresStolen += Math.max(0, Number(stolen) || 0); save();
            }
            function recordEnemyCoreLoss(type, amount) {
                if (!type || !(amount > 0)) return;
                enemy(type).coresLost += amount; save();
            }
            return {
                getData: load, flush, recordPlay, recordResult, recordMedal, recordRestart, recordLevelSelect,
                recordTowerBuild, recordTowerUpgrade, recordTowerSold,
                recordTowerDamage, recordTowerKill,
                recordEnemySpawn, recordEnemyDamage, recordEnemyKill,
                recordEnemyBreach, recordEnemyCoreLoss

            return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });

                { type: 'phantom',  minWave: 6, count: (w, d) => 1 + w * 0.18 + d * 0.12, hp: 0.75, spd: 1.35 },
                { type: 'stalker',  minWave: 7, count: (w, d) => 1 + w * 0.15 + d * 0.10, hp: 1.30, spd: 0.95 },
                { type: 'specter',  minWave: 8, count: (w, d) => 1 + w * 0.15 + d * 0.10, hp: 0.60, spd: 1.55 },
                { type: 'shade',    minWave: 9, count: (w, d) => 1 + w * 0.12 + d * 0.08, hp: 1.70, spd: 0.85 },
                { type: 'hatcher',  minWave: 7, count: (w, d) => 1 + w * 0.16 + d * 0.08, hp: 7.0, spd: 0.75 },
                { type: 'summoner', minWave: 6, count: (w, d) => 1 + w * 0.22 + d * 0.10, hp: 2.4, spd: 1.0 },
                { type: 'jammer',   minWave: 8, count: (w, d) => 1 + w * 0.14 + d * 0.08, hp: 3.5, spd: 2.2 }
            ];
        function generateWaves(difficulty, modeKey, hpMul, levelIdx) {
            const isGrind = modeKey === 'grind';
            const isEndless = modeKey === 'endless';
            const isMill = modeKey === 'mill';
            const waveCount = isEndless ? 9999 : ((isGrind || isMill) ? 99 : storyWaveCount(levelIdx));
            const baseHp = (26 + difficulty * 8) * hpMul * 8.0;     //怪物血量
            const baseSpeed = 1.04 + difficulty * 0.032;
            const GRIND_GROWTH = 1.045;              // 研磨 / 超级研磨：血量每波 +4.5%，指数增长
            const GRIND_SPEED_GROWTH = 1.010;        // 研磨 / 超级研磨：移速每波 +1%，指数增长
            const GRIND_WAVES = 99;
            const ENDLESS_WARMUP_GROWTH = 1.045;     // 无尽模式前 99 波沿用原节奏，不被研磨的数值牵连
            const ENDLESS_GROWTH = 1.055;            // 无尽模式 99 波之后血量增速进一步放大
            const hpGrowth = (isGrind || isMill) ? GRIND_GROWTH : 1.090;
            // —— 研磨 / 超级研磨 / 无尽：数量整体收紧，且波次带来的数量增长放缓 ——
            const GRIND_COUNT_SCALE = 0.62;          // 每波数量整体乘以此系数
            const GRIND_COUNT_GROWTH_DAMP = 0.55;    // 数量公式里的波次按此折算，增长更平缓
            const ENDLESS_MAX_PER_TYPE = 16;         // 无尽模式：每波每种怪物数量上限
            const GRIND_FAMILY = isGrind || isMill || isEndless;
            function waveScale(w) {
                if (isEndless) {
                    if (w <= GRIND_WAVES - 1) return Math.pow(ENDLESS_WARMUP_GROWTH, w);
                    return Math.pow(ENDLESS_WARMUP_GROWTH, GRIND_WAVES - 1) * Math.pow(ENDLESS_GROWTH, w - (GRIND_WAVES - 1));
                }
                return Math.pow(hpGrowth, w);
            }
            // 研磨族的移速同样逐波指数增长
            const speedScaleOf = (w) => (isGrind || isMill) ? Math.pow(GRIND_SPEED_GROWTH, w) : 1;
            const waves = [];
            for (let w = 0; w < waveCount; w++) {
                const bossWave = (w === waveCount - 1) || (isGrind && w > 0 && w % 10 === 9) || (isEndless && w > 0 && w % 10 === 9);
                const scale = waveScale(w);
                const speedScale = speedScaleOf(w);
                const groups = [];
                const mapMul = getEnemyCountMapMul();                    // ★ 新增
                const maxPerGroup = Math.max(1, Math.round(60 * mapMul)); // ★ 每个 group 上限随地图放大
                const countWave = GRIND_FAMILY ? w * GRIND_COUNT_GROWTH_DAMP : w; // 数量的波次增长折算
                const add = (type, count, hpFactor, spdFactor) => {
                    let groupCount = Math.round(count * ENEMY_COUNT_MUL * 1.55 * mapMul * (GRIND_FAMILY ? GRIND_COUNT_SCALE : 1));
                    groupCount = Math.max(1, Math.min(maxPerGroup, groupCount));
                    if (isEndless) groupCount = Math.min(groupCount, ENDLESS_MAX_PER_TYPE);
                    groups.push({
                        type,
                        count: groupCount,
                        hp: Math.max(8, Math.round(baseHp * scale * hpFactor)),
                        speed: baseSpeed * spdFactor * speedScale,
                        hpF: hpFactor,          // 记录基准系数，供混乱模式置换时换算
                        spdF: spdFactor
                    });
                };
                if (isMill) {
                    // 研磨模式：全程只有一种敌人，进关时随机选定，重开本关沿用同一敌种
                    if (!millEnemyType || millEnemyLevelIdx !== levelIdx) {
                        millEnemyType = RANDOM_WAVE_RULES[Math.floor(Math.random() * RANDOM_WAVE_RULES.length)].type;
                        millEnemyLevelIdx = levelIdx;
                    }
                    const millRule = RANDOM_WAVE_RULES.find(r => r.type === millEnemyType) || RANDOM_WAVE_RULES[0];
                    // 单怪模式没有其它敌种分摊，按 ~2 组混编的量级补齐（原为 4 组，已随需求下调）
                    add(millRule.type, millRule.count(countWave, difficulty) * 2, millRule.hp, millRule.spd);
                    waves.push({ groups });
                } else if (isGrind || isEndless) {
                    // 随机模式：每波 3~8 种（规则表提至 IIFE 顶层 RANDOM_WAVE_RULES）

                    // 用 levelIdx + modeKey + 波次 作为种子，重开同一关同一模式结果一致
                    const rng = makeSeededRng(
                        (levelIdx + 1) * 1000003 +
                        (modeKey === 'endless' ? 91 : 37) * 10007 +
                        w * 97
                    );

                    const eligible = RANDOM_WAVE_RULES.filter(r => w >= r.minWave);
                    const pickN = Math.min(8, Math.max(3, 3 + Math.floor(rng() * 6)));

                    // 洗牌
                    const shuffled = eligible.slice();
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(rng() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }

                    for (let i = 0; i < pickN && i < shuffled.length; i++) {
                        const r = shuffled[i];
                        add(r.type, r.count(countWave, difficulty), r.hp, r.spd);
                    }

                    if (bossWave) add('boss', 1, 5.0, 0.7);
                    waves.push({ groups });
                } else {

                if ((w >= 0 && w <= 98 && w % 3 === 0) || (w >=99 && (w % 10 === 1 || w % 10 === 6))) add('grunt',  4 + w * 0.8 + difficulty * 0.6, 1.0, 1.0);
                if ((w >= 1 && w <= 98 && w % 3 === 1) || (w >=99 && (w % 10 === 1 || w % 10 === 6))) add('runner', 2 + w * 0.7 + difficulty * 0.4, 0.6, 1.8);
                if ((w >= 2 && w <= 98 && w % 3 === 2) || (w >=99 && (w % 10 === 1 || w % 10 === 6))) add('tank',   1 + w * 0.5 + difficulty * 0.3, 2.5, 0.55);
                if ((w >= 3 && w <= 98 && w % 4 === 1) || (w >=99 && (w % 10 === 1 || w % 10 === 6))) add('shield', 1 + w * 0.33 + difficulty * 0.3, 1.2, 0.9);
                if (w >= 4 && (w % 10 === 4 || w % 10 === 1 || w % 10 === 7)) add('flyer',  2 + w * 0.5 + difficulty * 0.35, 0.7, 1.4);
                if (w >= 5 && (w % 10 === 1 || w % 10 === 8)) add('ghost',  1 + w * 0.33 + difficulty * 0.25, 0.8, 1.6);
                if (w >= 6 && (w % 10 === 3 || w % 10 === 0 || w % 10 === 6)) add('wasp',   2 + w * 0.33 + difficulty * 0.3, 0.5, 1.7);
                if (w >= 7 && (w % 10 === 7 || w % 10 === 4)) add('brute',  1 + w * 0.33 + difficulty * 0.2, 3.2, 0.5);
                if (w >= 8 && (w % 10 === 8 || w % 10 === 5)) add('shaman', 1 + w * 0.25 + difficulty * 0.15, 1.1, 0.8);
                if (w >= 5 && (w % 10 === 2 || w % 10 === 9)) add('wraith',  1 + w * 0.22 + difficulty * 0.15, 0.85, 1.25);
                if (w >= 6 && (w % 10 === 5 || w % 10 === 2)) add('phantom', 1 + w * 0.18 + difficulty * 0.12, 0.75, 1.35);
                if (w >= 7 && (w % 10 === 9 || w % 10 === 6)) add('stalker', 1 + w * 0.15 + difficulty * 0.10, 1.30, 0.95);
                if (w >= 8 && (w % 10 === 6 || w % 10 === 3)) add('specter', 1 + w * 0.15 + difficulty * 0.10, 0.60, 1.55);
                if (w >= 9 && (w % 10 === 0 || w % 10 === 7)) add('shade',   1 + w * 0.12 + difficulty * 0.08, 1.70, 0.85);
                if (w >= 7 && (w % 10 === 4 || w % 10 === 9)) add('hatcher', 1 + w * 0.16 + difficulty * 0.08, 7.0, 0.75);
                if (w >= 6 && (w % 10 === 5 || w % 10 === 1)) add('summoner', 1 + w * 0.22 + difficulty * 0.10, 2.4, 1.0);
                if (w >= 8 && (w % 10 === 8 || w % 10 === 2)) add('jammer', 1 + w * 0.14 + difficulty * 0.08, 5.5, 2.2);
                
                if (bossWave) add('boss', 1, 5.0, 0.7);
                waves.push({ groups });
                }
            }
            // 统一结算：混乱置换 + 慢速怪加血（所有模式共用）
            applyEnemyWaveFinalStats(waves);
            return waves;
        }

        // ---------- 游戏状态 ----------
        let screen = 'menu';

        function cellCenterX(c) { return mapOffX + c * CELL + CELL / 2; }
        function cellCenterY(r) { return mapOffY + r * CELL + CELL / 2; }
        function cellLeft(c) { return mapOffX + c * CELL; }

        function computeLayoutForMap(mapRows, mapCols) {
            ROWS = Math.max(1, mapRows);
            COLS = Math.max(1, mapCols);
            const fitCell = Math.floor(Math.min(canvas.width / COLS, canvas.height / ROWS));
            baseCellPx = Math.max(CELL_MIN, Math.min(CELL_MAX, fitCell));
            CELL = Math.max(CELL_MIN, Math.round(baseCellPx * zoom));
            TOWER_RADIUS = Math.max(9, Math.round(CELL * 0.375));
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            mapOffX = Math.round((canvas.width - gridW) / 2);
            mapOffY = Math.round((canvas.height - gridH) / 2);
        }

        function setGameZoom(newZoom, anchorX, anchorY) {
            if (screen !== 'game') return;
            newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
            if (Math.abs(newZoom - zoom) < 0.0005) return;
            const oldCell = CELL, oldOffX = mapOffX, oldOffY = mapOffY;
            const anchorC = (anchorX - oldOffX) / oldCell;
            const anchorR = (anchorY - oldOffY) / oldCell;
            zoom = newZoom;
            const fitCell = Math.floor(Math.min(canvas.width / COLS, canvas.height / ROWS));
            baseCellPx = Math.max(CELL_MIN, Math.min(CELL_MAX, fitCell));
            CELL = Math.max(CELL_MIN, Math.round(baseCellPx * zoom));
            TOWER_RADIUS = Math.max(9, Math.round(CELL * 0.375));
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            mapOffX = Math.round(anchorX - anchorC * CELL);
            mapOffY = Math.round(anchorY - anchorR * CELL);
            if (gridW <= canvas.width) mapOffX = Math.round((canvas.width - gridW) / 2);
            else mapOffX = Math.max(canvas.width - gridW, Math.min(0, mapOffX));
            if (gridH <= canvas.height) mapOffY = Math.round((canvas.height - gridH) / 2);
            else mapOffY = Math.max(canvas.height - gridH, Math.min(0, mapOffY));
            const k = CELL / oldCell;
            for (const e of enemies) { e.x = mapOffX + (e.x - oldOffX) * k; e.y = mapOffY + (e.y - oldOffY) * k; }
            for (const core of looseCores) { core.x = mapOffX + (core.x - oldOffX) * k; core.y = mapOffY + (core.y - oldOffY) * k; }
            projectiles.length = 0;

        function panMap(dx, dy) {
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            const oldX = mapOffX, oldY = mapOffY;
            let nx = oldX + dx, ny = oldY + dy;
            if (gridW <= canvas.width) nx = Math.round((canvas.width - gridW) / 2);
            else nx = Math.max(canvas.width - gridW, Math.min(0, nx));
            if (gridH <= canvas.height) ny = Math.round((canvas.height - gridH) / 2);
            else ny = Math.max(canvas.height - gridH, Math.min(0, ny));
            const adx = nx - oldX, ady = ny - oldY;
            if (adx === 0 && ady === 0) return;
            mapOffX = nx; mapOffY = ny;
            for (const e of enemies) { e.x += adx; e.y += ady; }
            for (const core of looseCores) { core.x += adx; core.y += ady; }
            for (const p of projectiles) {
                if (typeof p.x === 'number') { p.x += adx; p.y += ady; }

                if (typeof p.toX === 'number') { p.toX += adx; p.toY += ady; }

        function updateEdgePan(dt) {

            if (canX && overX > 0) { const k = Math.min(1, overX / EDGE_PAN_MAX_DIST); const mag = 0.35 + 0.65 * k; vx = (mouse.x < 0) ? mag : -mag; }
            if (canY && overY > 0) { const k = Math.min(1, overY / EDGE_PAN_MAX_DIST); const mag = 0.35 + 0.65 * k; vy = (mouse.y < 0) ? mag : -mag; }

        function makeField() {
            const f = [];
            for (let r = 0; r < ROWS; r++) f.push(new Array(COLS).fill(Infinity));
            return f;
        }
        function makeDirField() {
            const fields = [];
            for (let d = 0; d < 4; d++) fields.push(makeField());
            return fields;
        }
        function anyDirFinite(fieldDir, r, c) {
            for (let d = 0; d < 4; d++) if (isFinite(fieldDir[d][r][c])) return true;
            return false;
        }
        function bfsFromDir(fieldDir, sources, blocked) {
            const q = [];
            for (const s of sources) {
                if (s.c < 0 || s.c >= COLS || s.r < 0 || s.r >= ROWS) continue;
                if (blocked[s.r][s.c]) continue;
                for (let d = 0; d < 4; d++) {
                    if (fieldDir[d][s.r][s.c] === 0) continue;
                    fieldDir[d][s.r][s.c] = 0;
                    q.push([s.c, s.r, d]);
                }
            }
            let head = 0;
            while (head < q.length) {
                const cur = q[head++];
                const c = cur[0], r = cur[1], dEnter = cur[2];
                const curD = fieldDir[dEnter][r][c];
                for (let di = 0; di < 4; di++) {
                    if (straightGrid[r] && straightGrid[r][c] && di !== dEnter) continue;
                    const dc = DIRS[di][0], dr = DIRS[di][1];
                    const pc = c - dc, pr = r - dr;
                    if (pc < 0 || pc >= COLS || pr < 0 || pr >= ROWS) continue;
                    if (blocked[pr][pc]) continue;
                    const dOut = di;
                    if (straightGrid[pr] && straightGrid[pr][pc]) {
                        const dIn = dOut;
                        if (fieldDir[dIn][pr][pc] > curD + 1) {
                            fieldDir[dIn][pr][pc] = curD + 1;
                            q.push([pc, pr, dIn]);
                        }
                    } else {
                        for (let dIn = 0; dIn < 4; dIn++) {
                            if (fieldDir[dIn][pr][pc] > curD + 1) {
                                fieldDir[dIn][pr][pc] = curD + 1;
                                q.push([pc, pr, dIn]);
                            }
                        }
                    }
                }
            }
        }
        function findNextCellInDir(fieldDir, c, r, inDirC, inDirR) {
            const isStraight = straightGrid[r] && straightGrid[r][c];
            const unknownDir = (inDirC === 0 && inDirR === 0);
            let best = null, bestD = Infinity;
            for (let di = 0; di < 4; di++) {
                const dc = DIRS[di][0], dr = DIRS[di][1];
                if (isStraight && !unknownDir && (dc !== inDirC || dr !== inDirR)) continue;
                const nc = c + dc, nr = r + dr;
                if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
                if (wallGrid[nr][nc]) continue;
                const d = fieldDir[di][nr][nc];
                if (d < bestD) {
                    bestD = d;
                    best = { c: nc, r: nr, dirC: dc, dirR: dr };
                }
            }
            return best;
        }

        function getMudPitCount() {

        // 在可建造的空位中随机生成泥潭；已存在泥潭/塔/敌人/核心/出入口的位置自动跳过
        function spawnMudPits(count) {
            if (!ascensionState || !ascensionState.mudPit) return;
            const target = Math.max(0, count | 0);
            const maxAttempts = Math.max(200, target * 300);
            let attempts = 0, spawned = 0;
            while (spawned < target && attempts++ < maxAttempts) {
                const cc = Math.floor(Math.random() * COLS);
                const rr = Math.floor(Math.random() * ROWS);
                if (mudPits.some(p => p.c === cc && p.r === rr)) continue;
                if (!canBuildAt(cc, rr)) continue;
                mudPits.push({ c: cc, r: rr });
                spawned++;
            }
        }

        function getBlockedGrid() {
            const blocked = [];
            for (let r = 0; r < ROWS; r++) {
                const row = new Array(COLS).fill(false);
                for (let c = 0; c < COLS; c++) if (wallGrid[r][c]) row[c] = true;
                blocked.push(row);
            }
            for (const t of towers) {
                if (t.col >= 0 && t.col < COLS && t.row >= 0 && t.row < ROWS) blocked[t.row][t.col] = true;
            }
            return blocked;
        }

        // 新增：一次性模拟多个位置被阻挡后的路径
// （aiPlanStrategy 贪心迭代时需要基于"已模拟的塔"整体重算）
        function computeRoutesWithExtraBlock(col, row) {
            const blocked = [];
            for (let r = 0; r < ROWS; r++) {
                const rowArr = new Array(COLS).fill(false);
                for (let c = 0; c < COLS; c++) if (wallGrid[r][c]) rowArr[c] = true;
                blocked.push(rowArr);
            }
            for (const t of towers) blocked[t.row][t.col] = true;
            if (col >= 0 && col < COLS && row >= 0 && row < ROWS) blocked[row][col] = true;
            const db = makeDirField(), de = makeDirField();
            bfsFromDir(db, bases, blocked); bfsFromDir(de, exits, blocked);
            const out = [];
            for (const s of starts) {
                if (!anyDirFinite(db, s.r, s.c)) continue;
                const pts = tracePathDir(db, s.c, s.r, (c, r) => bases.some(b => b.c === c && b.r === r));
                if (pts.length > 1) out.push({ pts, kind: 'in' });
            }
            for (const b of bases) {
                if (!anyDirFinite(de, b.r, b.c)) continue;
                const pts = tracePathDir(de, b.c, b.r, (c, r) => exits.some(x => x.c === c && x.r === r));
                if (pts.length > 1) out.push({ pts, kind: 'out' });
            }
            return out;
        }

        function routeSignature(routesArr) {
            return routesArr.map(r => r.kind + ':' + r.pts.map(p => Math.round(p.x) + ',' + Math.round(p.y)).join(';')).sort().join('|');
        }

        function isBuildPathChanged() {
            if (!buildMenu) return false;
            const previewSig = routeSignature(buildMenu.previewRoutes || []);
            const currentSig = routeSignature(routes);
            let changed = previewSig !== currentSig;
            if (!changed && routes.length > 0) {
                const cx = cellCenterX(buildMenu.col);
                const cy = cellCenterY(buildMenu.row);
                outer:
                for (const route of routes) {
                    for (const p of route.pts) {
                        if (Math.abs(p.x - cx) < 0.5 && Math.abs(p.y - cy) < 0.5) { changed = true; break outer; }
                    }
                }
            }
            return changed;
        }

        function rebuildPaths() {
            routeCanvas = null;   // 路线静态层失效，下次绘制时重新烘焙
            const blocked = getBlockedGrid();
            distToBaseDir = makeDirField();
            distToExitDir = makeDirField();
            distToStartDir = makeDirField();
            bfsFromDir(distToBaseDir, bases, blocked);
            bfsFromDir(distToExitDir, exits, blocked);
            bfsFromDir(distToStartDir, starts, blocked);
            routes = [];
            for (const s of starts) {
                if (!anyDirFinite(distToBaseDir, s.r, s.c)) continue;
                const pts = tracePathDir(distToBaseDir, s.c, s.r, (c, r) => bases.some(b => b.c === c && b.r === r));
                if (pts.length > 1) routes.push({ pts, kind: 'in' });
            }
            for (const b of bases) {
                if (!anyDirFinite(distToExitDir, b.r, b.c)) continue;
                const pts = tracePathDir(distToExitDir, b.c, b.r, (c, r) => exits.some(x => x.c === c && x.r === r));
                if (pts.length > 1) routes.push({ pts, kind: 'out' });
            }
                        if (battleStats && !battleStats.basePathLength) {
                battleStats.basePathLength = routes.reduce((s, r) => s + Math.max(0, r.pts.length - 1), 0);
            }
            rebuildActiveBaseField();
        }

        function rebuildActiveBaseField() {
            const activeBases = bases.filter(b => b.cores > 0);
            hasActiveBase = activeBases.length > 0;
            distToActiveBaseDir = makeDirField();
            if (!hasActiveBase) return;
            const blocked = getBlockedGrid();
            bfsFromDir(distToActiveBaseDir, activeBases, blocked);
        }

        function tracePathDir(fieldDir, startC, startR, endPred) {
            const pts = [];
            let c = startC, r = startR;
            let dirC = 0, dirR = 0;
            let guard = 0;
            while (guard++ < 900) {
                pts.push({ x: cellCenterX(c), y: cellCenterY(r) });
                if (endPred(c, r)) break;
                const nxt = findNextCellInDir(fieldDir, c, r, dirC, dirR);
                if (!nxt) break;
                c = nxt.c; r = nxt.r;
                dirC = nxt.dirC; dirR = nxt.dirR;
            }
            return pts;
        }

        function canBuildAt(col, row) {
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return false;
            if (noBuildGrid[row] && noBuildGrid[row][col]) return false;
            if (wallGrid[row][col] && !buildableWall[row][col]) return false;
            if (bases.some(b => b.c === col && b.r === row)) return false;
            if (exits.some(x => x.c === col && x.r === row)) return false;
            if (towers.some(t => t.col === col && t.row === row)) return false;
            for (const e of enemies) {
                if (e.cellC === col && e.cellR === row) return false;
                if (e.nextC !== null && e.nextC === col && e.nextR === row) return false;
            }
            for (const core of looseCores) if (core.cellC === col && core.cellR === row) return false;
            towers.push({ col, row, type: '__tmp__', level: 1, invested: 0 });
            const blocked = getBlockedGrid();
            towers.pop();
            const bipartiteConnected = (setA, setB) => {
                if (setA.length === 0 || setB.length === 0) return true;
                if (setA.length <= setB.length) {
                    for (const a of setA) {
                        const f = makeDirField();
                        bfsFromDir(f, [a], blocked);
                        for (const b of setB) if (!anyDirFinite(f, b.r, b.c)) return false;
                    }
                } else {
                    for (const b of setB) {
                        const f = makeDirField();
                        bfsFromDir(f, [b], blocked);
                        for (const a of setA) if (!anyDirFinite(f, a.r, a.c)) return false;
                    }
                }
                return true;
            };
            if (!bipartiteConnected(starts, bases)) return false;
            if (!bipartiteConnected(bases, exits)) return false;
            const db = makeDirField(), de = makeDirField();
            bfsFromDir(db, bases, blocked); bfsFromDir(de, exits, blocked);
            for (const e of enemies) {
                const f = (e.state === 'toExit') ? de : db;
                if (!anyDirFinite(f, e.cellR, e.cellC)) return false;
            }
            for (const core of looseCores) if (!anyDirFinite(db, core.cellR, core.cellC)) return false;
            return true;
        }

        function startNextWave() {
            if (gameOver) return;
            if (waveIndex >= totalWaves) return;
            pushRewindSnapshot();       // 开波前留档，供 Backspace 回退
            const wave = waves[waveIndex];
            const queue = [];
            let hasAir = false, hasStealth = false, counter = 0;
            const em = (rogueState && rogueState.enemyMods) ? rogueState.enemyMods : { hpMul: 1, speedMul: 1 };
            const isLastWave = (waveIndex === totalWaves - 1);
            for (const g of wave.groups) {
                if (ENEMY_TYPES[g.type].air) hasAir = true;
                if (ENEMY_TYPES[g.type].stealth) hasStealth = true;
                const hpVal = Math.max(8, Math.round(g.hp * em.hpMul));
                const spdVal = g.speed * em.speedMul;
                let count = g.count;
                if (ascensionState && ascensionState.finalWaveDouble && isLastWave) {
                    count *= 2;
                }
                for (let i = 0; i < count; i++) {
                    queue.push({
                        type: g.type, hp: hpVal, maxHp: hpVal, speed: spdVal,
                        reward: Math.floor(hpVal * 0.042),
                        startIdx: (counter++) % Math.max(1, starts.length)
                    });
                }
            }

        function getEnemyAt(mx, my) {
            let best = null, bestD = Infinity;
            const sf = CELL / baseCellPx;
            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const size = ENEMY_TYPES[e.type].size * sf * (e.isElite ? 1.3 : 1);

                function getTowerMenuScale() {

            const s = Math.max(250 * k / TOWER_MENU_W, 132 * k / TOWER_MENU_H);

        function updateAutoUpgrade() {

            }
            let changed = false;
            for (const t of towers) {
                if (!t.autoUpgrade) continue;
                let guard = 0;
                while (t.level < MAX_LEVEL && guard++ < MAX_LEVEL) {
                    const cost = getUpgradeCostEffective(t.type, t.level, t.col, t.row);
                    if (cost === null) break;
                    if (money - cost < reserved) break;
                    money -= cost; t.level++; t.invested += cost; changed = true;
                    if (ascensionState && ascensionState.ammo) t.ammo = 50;
                    SFX.upgrade();
                    msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动升级 → Lv.${t.level}`;
                }
            }
            if (changed) { updateUI(); if (selectedTower) updateSellButton(); }
        }

// 把一个建造事件编码成桶键：塔类型 × 离路径距离 × 是否拐角 × 波次段
function aiBuildContextKey(gameOrNull, buildOrPos, typeOverride, waveOverride) {
    const type = typeOverride || buildOrPos.type;
    const col  = buildOrPos.col;
    const row  = buildOrPos.row;
    const wave = (waveOverride != null ? waveOverride : buildOrPos.wave) | 0;

    // ① 离最近路径点的格子距离
    const cx = col + 0.5, cy = row + 0.5;
    let minD = Infinity;
    for (const route of routes) for (const p of route.pts || []) {
        const x = (p.x - mapOffX) / CELL, y = (p.y - mapOffY) / CELL;
        const d = Math.hypot(x - cx, y - cy);
        if (d < minD) minD = d;
    }
    if (!Number.isFinite(minD)) return null;
    const distBucket = minD <= 1.2 ? 'adj' : (minD <= 2.6 ? 'near' : 'far');

    // ② 3×3 邻域内路径是否有转弯（用路径点的方向变化近似）
    let corner = false;
    for (const route of routes) {
        const pts = route.pts || [];
        for (let i = 1; i < pts.length - 1; i++) {
            const a = pts[i-1], b = pts[i], c = pts[i+1];
            const ax = (b.x - a.x), ay = (b.y - a.y);
            const bx = (c.x - b.x), by = (c.y - b.y);
            if (Math.abs(ax*by - ay*bx) < 1e-3) continue;   // 共线不算拐角

            if (Math.hypot(px - cx, py - cy) <= 1.8) { corner = true; break; }

    const prog = totalWaves > 0 ? wave / totalWaves : 0;
    const phase = prog < 0.34 ? 'early' : (prog < 0.67 ? 'mid' : 'late');

}

// 沿路径采样，返回长度、转弯数、被 N 座塔覆盖的加权长度
function aiPathQuality(routesArr, coverFn) {
    let length = 0, turns = 0, weightedLen = 0, coveredPts = 0, totalPts = 0;
    for (const route of routesArr) {
        const pts = route && route.pts;
        if (!pts || pts.length < 2) continue;
        let prevX = 0, prevY = 0, hasPrev = false;
        for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const cov = coverFn ? coverFn(p.x, p.y) : 0;
            if (cov > 0) coveredPts++;
            totalPts++;
            if (i === 0) continue;
            const q = pts[i - 1];
            const dx = p.x - q.x, dy = p.y - q.y;
            const d = Math.hypot(dx, dy);
            if (d < 0.0001) continue;
            length += d;
            weightedLen += d * cov;
            const ux = dx / d, uy = dy / d;
            if (hasPrev && (prevX * ux + prevY * uy) < 0.85) turns++;   // 方向变化 > ~31°
            prevX = ux; prevY = uy; hasPrev = true;
        }
    }
    return { length, turns, weightedLen, coveredPts, totalPts };
}

// 构造覆盖函数：任意像素点被多少座塔覆盖（含射程/增幅/联动/全局加成）
// extraSpec 可选：{ type, col, row } 用于"若在此建塔"的模拟
function aiMakeCoverFn(towerList, extraSpec) {
    const entries = [];
    const pushOne = (type, level, col, row, buffs, syn) => {
        if (!TOWER_TYPES[type]) return;
        if (NON_ATTACK_TOWER_TYPES.has(type)) return;
        const st = towerStatsAt(type, level);
        const baseRange = st.range || TOWER_TYPES[type].range || 0;
        const bfR = (buffs && buffs.range) || 1;
        const synR = 1 + ((syn && syn.range) || 0);
        const rbR = (rogueState && rogueState.bonus && rogueState.bonus.range) || 1;
        const rr = baseRange * bfR * synR * rbR * CELL;
        entries.push({ x: cellCenterX(col), y: cellCenterY(row), r2: rr * rr });
    };
    for (const t of towerList) pushOne(t.type, t.level, t.col, t.row, t.buffs, t.syn);
    if (extraSpec) pushOne(extraSpec.type, 1, extraSpec.col, extraSpec.row, null, null);
    return function (px, py) {
        let n = 0;
        for (let i = 0; i < entries.length; i++) {
            const dx = px - entries[i].x, dy = py - entries[i].y;
            if (dx * dx + dy * dy <= entries[i].r2) n++;
        }
        return n;
    };
}

// 新塔自身射程覆盖新路径的比例（每 2 个点采样一次，控制成本）
function aiSelfCoverRatio(newRoutes, col, row, type) {
    if (!TOWER_TYPES[type]) return 0;
    const st = towerStatsAt(type, 1);
    const rr = (st.range || TOWER_TYPES[type].range || 0) * CELL;
    const rr2 = rr * rr;
    const cx = cellCenterX(col), cy = cellCenterY(row);
    let covered = 0, total = 0;
    for (const route of newRoutes) {
        const pts = route && route.pts;
        if (!pts || pts.length < 2) continue;
        for (let i = 0; i < pts.length; i += 2) {
            const dx = pts[i].x - cx, dy = pts[i].y - cy;
            if (dx * dx + dy * dy <= rr2) covered++;
            total++;
        }
    }
    return total > 0 ? covered / total : 0;
}

// 实时热点：每个格子 3×3 半径内的当前敌人数量
function aiBuildPathHotspot() {
    const map = new Map();
    for (const e of enemies) {
        if (!e || e.hp <= 0) continue;
        const c = Math.round((e.x - mapOffX) / CELL - 0.5);
        const r = Math.round((e.y - mapOffY) / CELL - 0.5);
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const key = (r + dr) + ',' + (c + dc);
            map.set(key, (map.get(key) || 0) + 1);
        }
    }
    return map;
}

// AI 全局路线规划：首次进入战斗时根据地图一次性生成整体迷宫策略
// 若存在多个同等优秀的候选位置，则随机挑选其中一个，避免每次都选同一个
// ============================================================
let aiStrategyPlan = null;

function aiPlanStrategy() {
    try {
        if (screen !== 'game' || gameOver || !routes.length) return;

        const key = levelIndex + '|' + currentModeKey + '|' + routeReverse + '|' + rogueEnabled;
        if (aiStrategyPlan && aiStrategyPlan.key === key) return;

        const nodes = aiGetPathNodes();
        if (!nodes.length) { aiStrategyPlan = null; return; }

        // ── 候选池：路径附近 radius=3 的格 ──
        const candidateSet = new Set();
        const radius = 3;
        for (const n of nodes) {
            const cc = Math.round(n.x), rr = Math.round(n.y);
            for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
                if (dx * dx + dy * dy > radius * radius) continue;
                const c = cc + dx, r = rr + dy;
                if (c >= 0 && c < COLS && r >= 0 && r < ROWS) candidateSet.add(r * COLS + c);
            }
        }

        // 统一的合法性检查
        const isCellUsable = (c, r) => {
            if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
            if (noBuildGrid[r] && noBuildGrid[r][c]) return false;
            if (wallGrid[r] && wallGrid[r][c] && !buildableWall[r][c]) return false;
            if (bases.some(b => b.c === c && b.r === r)) return false;
            if (exits.some(x => x.c === c && x.r === r)) return false;
            if (starts.some(s => s.c === c && s.r === r)) return false;
            if (towers.some(t => t.col === c && t.row === r)) return false;
            try { return canBuildAt(c, r); } catch (e) { return false; }
        };

        // ── 基准路径质量 ──
        const beforeQ = aiPathQuality(routes, null);
        const baseLength = Math.max(1, beforeQ.length);
        const towerCap = Math.min(20, Math.max(10, Math.round(baseLength / CELL / 2)));
        const minGainPerTower = CELL * 0.65;

        // ── 玩家高分少塔布局优先：能匹配就直接按人类建塔序列复刻 ──
        const humanLayout = AI_LEARN.getBestHumanLayout(levelIndex, currentModeKey, routeReverse);
        const humanPositions = [];
        if (humanLayout && Array.isArray(humanLayout.builds)) {
            const seen = new Set();
            for (const b of humanLayout.builds) {
                const c = Number(b.col), r = Number(b.row);
                if (!Number.isFinite(c) || !Number.isFinite(r)) continue;
                const ck = r * COLS + c;
                if (seen.has(ck)) continue;      // 同一格重复建/重建只取第一次
                seen.add(ck);
                if (!isCellUsable(c, r)) continue;
                humanPositions.push({
                    col: c, row: r, typeHint: b.type, fromHuman: true,
                    baseScore: 0, gain: 0, turnGain: 0, selfCover: 1
                });
            }
        }
        if (humanPositions.length) {
            aiStrategyPlan = { key, positions: humanPositions, idx: 0, baseLength, human: true };
            aiAddMessage(
                `🧠 已匹配玩家高分少塔布局：${humanLayout.towers} 塔 / ${humanLayout.score} 分` +
                `（难度 ${humanLayout.ascension || 0}${humanLayout.rogue ? ' · Roguelike' : ''}），按该序列复刻建塔`,
                'bot'
            );
            return;
        }

        // ── 第一轮：基于"原路径 + 单点"评估每个候选的路径增益 ──
        // （不累积模拟，避免依赖新函数；邻格剔除保证不堆叠）
        const evaluated = [];
        for (const ck of candidateSet) {
            const c = ck % COLS, r = Math.floor(ck / COLS);
            if (!isCellUsable(c, r)) continue;
            try {
                const newRoutes = computeRoutesWithExtraBlock(c, r);
                if (!newRoutes || !newRoutes.length) continue;
                const afterQ = aiPathQuality(newRoutes, null);
                const gain = afterQ.length - baseLength;
                if (gain < 0) continue;
                const turnGain = Math.max(0, afterQ.turns - beforeQ.turns);
                const selfCover = aiSelfCoverRatio(newRoutes, c, r, 'cannon');
                const rawScore = gain * (1 + Math.min(0.5, turnGain * 0.08)) * (0.5 + selfCover * 0.7);
                evaluated.push({ c, r, gain, turnGain, selfCover, rawScore });
            } catch (err) { continue; }
        }

        evaluated.sort((a, b) => b.rawScore - a.rawScore);

        // ── 第二轮：贪心选点，剔除邻格；边际收益低于阈值就停 ──
        const positions = [];
        if (evaluated.length) {
            let idx = 0;
            while (positions.length < towerCap && idx < evaluated.length) {
                const top = evaluated[idx];
                // 第一座塔强制选；之后低于阈值就停
                if (positions.length >= 1 && top.rawScore < minGainPerTower) break;
                positions.push({
                    col: top.c, row: top.r,
                    baseScore: top.rawScore, gain: top.gain,
                    turnGain: top.turnGain, selfCover: top.selfCover
                });
                // 剔除邻格
                idx = 0;
                while (idx < evaluated.length) {
                    if (Math.abs(evaluated[idx].c - top.c) <= 1 && Math.abs(evaluated[idx].r - top.r) <= 1) {
                        evaluated.splice(idx, 1);
                    } else idx++;
                }
            }
        }

        // ── 兜底：如果路径完全无法延长（开阔地图开局），退回到"靠近路径的格子" ──
        if (!positions.length) {
            const relaxed = [];
            for (const ck of candidateSet) {
                const c = ck % COLS, r = Math.floor(ck / COLS);
                if (!isCellUsable(c, r)) continue;
                let minDist = Infinity;
                for (const n of nodes) {
                    const dd = Math.hypot(n.x - (c + 0.5), n.y - (r + 0.5));
                    if (dd < minDist) minDist = dd;
                }
                relaxed.push({ c, r, dist: minDist });
            }
            relaxed.sort((a, b) => a.dist - b.dist);
            const need = Math.min(towerCap, relaxed.length);
            for (let i = 0; i < need; i++) {
                positions.push({
                    col: relaxed[i].c, row: relaxed[i].r,
                    baseScore: 0, gain: 0, turnGain: 0, selfCover: 1
                });
            }
        }

        if (!positions.length) { aiStrategyPlan = null; return; }

        aiStrategyPlan = { key, positions, idx: 0, baseLength };
        const totalGain = positions.reduce((s, p) => s + (p.gain || 0), 0);
        const pct = totalGain > 0 ? Math.round(totalGain / baseLength * 100) : 0;
        aiAddMessage(
            `🗺️ 路线规划：${positions.length} 个建塔位置（预计路径延长约 ${pct}%）`,
            'bot'
        );
    } catch (err) {
        // 任何异常都不应该让 AI 完全瘫痪
        console.error('[aiPlanStrategy] 异常:', err);
        aiStrategyPlan = null;
    }
}
function aiIsPlanPositionUsable(pos) {

    if (noBuildGrid[r] && noBuildGrid[r][c]) return false;
    if (wallGrid[r] && wallGrid[r][c] && !buildableWall[r][c]) return false;
    if (bases.some(b => b.c === c && b.r === r)) return false;
    if (exits.some(x => x.c === c && x.r === r)) return false;
    if (starts.some(s => s.c === c && s.r === r)) return false;

}

function aiConsumePlanPositionIfFromPlan(rec) {

}

        function aiEnemyProfile() {

        }

        function drawRouteArrows(route, routeIdx) {
            const pts = route.pts;
            if (pts.length < 2) return;
            const segLen = CELL;
            const totalLen = (pts.length - 1) * segLen;
            const spacing = Math.max(CELL * 1.5, 26);
            const phase = (routeIdx || 0) * 0.37;
            const speed = CELL * 0.85;
            const offset = ((arrowAnimTime + phase) * speed) % spacing;
            const isIn = route.kind === 'in';
            const color = isIn ? 'rgba(170, 220, 255, 0.55)' : 'rgba(255, 220, 170, 0.50)';
            const size = Math.max(4, CELL * 0.25);
            const spread = Math.PI * 0.25;
            ctx.save();
            ctx.fillStyle = color;
            for (let d = offset; d < totalLen; d += spacing) {
                let segIdx = Math.floor(d / segLen);
                if (segIdx >= pts.length - 1) segIdx = pts.length - 2;
                const t = (d - segIdx * segLen) / segLen;
                const p0 = pts[segIdx], p1 = pts[segIdx + 1];
                const ax = p0.x + (p1.x - p0.x) * t;
                const ay = p0.y + (p1.y - p0.y) * t;
                const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
                const bx1 = ax + Math.cos(ang + Math.PI - spread) * size;
                const by1 = ay + Math.sin(ang + Math.PI - spread) * size;
                const bx2 = ax + Math.cos(ang + Math.PI + spread) * size;
                const by2 = ay + Math.sin(ang + Math.PI + spread) * size;
                ctx.beginPath();
                ctx.moveTo(ax, ay); ctx.lineTo(bx1, by1); ctx.lineTo(bx2, by2);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }

        function drawPendingBuilds() {
            if (pendingBuilds.length === 0) return;
            const tNow = Date.now() / 420;
            const sf = CELL / baseCellPx;
            for (const order of pendingBuilds) {
                const d = TOWER_TYPES[order.type];
                if (!d) continue;
                const cost = getBuildCost(order.type);
                const px = cellCenterX(order.col), py = cellCenterY(order.row);
                const affordable = money >= cost;
                const pulse = 0.5 + Math.sin(tNow + order.col * 0.7 + order.row * 1.3) * 0.5;
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([5, 4]);
                ctx.lineDashOffset = -(arrowAnimTime * 18) % 9;
                ctx.strokeStyle = affordable ? 'rgba(255, 217, 102, 0.95)' : 'rgba(255, 217, 102, 0.45)';
                ctx.lineWidth = 2;
                ctx.strokeRect(cellLeft(order.col) + 3.5, cellTop(order.row) + 3.5, CELL - 7, CELL - 7);
                ctx.setLineDash([]);
                ctx.globalAlpha = 0.30 + pulse * 0.28;
                drawTowerLogo(ctx, order.type, 1, px, py, -Math.PI / 2, '#ffd966', sf);
                ctx.globalAlpha = 1;
                const lbl = `🏗 ${cost}`;
                ctx.font = 'bold 9px "Microsoft YaHei"';
                const lw = ctx.measureText(lbl).width + 10;
                ctx.fillStyle = 'rgba(8, 14, 24, 0.9)';
                roundRect(ctx, px - lw / 2, cellTop(order.row) + CELL - 12, lw, 11, 4);
                ctx.fill();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = affordable ? '#ffd966' : '#ff9a8a';
                ctx.fillText(lbl, px, cellTop(order.row) + CELL - 6);
                ctx.restore();
            }
        }

        // ============================================================
        // 游戏主绘制
        // ============================================================
        function drawGame() {
            if (!bgGradient) {
                bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGradient.addColorStop(0, '#04070e');
                bgGradient.addColorStop(0.5, '#060a14');
                bgGradient.addColorStop(1, '#03060c');
            }
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (bgCanvas) ctx.drawImage(bgCanvas, mapOffX, mapOffY);

            const previewChanged = buildMenu && !gameOver && buildMenu.previewRoutes && isBuildPathChanged();
            const routesToDraw = previewChanged ? buildMenu.previewRoutes : routes;
            for (let ri = 0; ri < routesToDraw.length; ri++) {
                const route = routesToDraw[ri];
                if (route.pts.length < 2) continue;
                const pts = route.pts;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.strokeStyle = route.kind === 'in' ? 'rgba(70, 160, 240, 0.13)' : 'rgba(255, 180, 80, 0.11)';
                ctx.lineWidth = CELL * 0.72;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.strokeStyle = route.kind === 'in' ? 'rgba(110, 195, 255, 0.35)' : 'rgba(255, 190, 110, 0.32)';
                ctx.lineWidth = 2;
                ctx.stroke();
                drawRouteArrows(route, ri);
            }
            for (const s of starts) {
                const px = cellCenterX(s.c), py = cellCenterY(s.r);
                const t = Date.now() / 500;
                const pulse = 1 + Math.sin(t) * 0.12;
                ctx.beginPath(); ctx.arc(px, py, CELL * 0.36 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(74, 255, 120, 0.13)'; ctx.fill();
                ctx.strokeStyle = 'rgba(74, 255, 120, 0.85)'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#4aff7a'; ctx.shadowColor = '#4aff7a'; ctx.shadowBlur = 10;
                ctx.fill(); ctx.shadowBlur = 0;
            }
            for (const x of exits) {
                const px = cellCenterX(x.c), py = cellCenterY(x.r);
                ctx.beginPath(); ctx.arc(px, py, CELL * 0.26, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 170, 68, 0.85)';
                ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
            }

            // 进阶难度机制 18：深渊泥潭
            if (ascensionState && ascensionState.mudPit) {
                for (const pit of mudPits) {
                    ctx.beginPath();
                    ctx.arc(cellCenterX(pit.c), cellCenterY(pit.r), CELL * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(80, 40, 100, 0.4)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(150, 80, 200, 0.6)';
                    ctx.stroke();
                }
            }

            for (const b of bases) {
                const px = cellCenterX(b.c), py = cellCenterY(b.r);
                const pulse = 1 + Math.sin(Date.now() / 300) * 0.08;
                const alive = b.cores > 0;
                const sf = CELL / baseCellPx;
                ctx.beginPath(); ctx.arc(px, py, 18 * pulse * sf, 0, Math.PI * 2);
                ctx.fillStyle = alive ? 'rgba(74, 255, 122, 0.14)' : 'rgba(120, 120, 120, 0.10)'; ctx.fill();
                ctx.beginPath(); ctx.arc(px, py, 14 * sf, 0, Math.PI * 2);
                ctx.fillStyle = alive ? 'rgba(74, 255, 122, 0.85)' : 'rgba(110, 120, 130, 0.6)';
                ctx.shadowColor = alive ? '#4aff7a' : '#555'; ctx.shadowBlur = 22;
                ctx.fill(); ctx.shadowBlur = 0;
                ctx.font = `bold ${Math.round(13 * sf)}px "Microsoft YaHei"`;
                ctx.fillStyle = '#06120a';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(String(b.cores), px, py + 1);
            }
            drawPendingBuilds();
            const tsf = CELL / baseCellPx;
            for (const t of towers) {
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                const typeDef = TOWER_TYPES[t.type];
                if (selectedTower === t) {
                    const st = towerStatsAt(t.type, t.level);
                    const rMul = (t.buffs && t.buffs.range) || 1;
                    const rb = (rogueState && rogueState.bonus) ? rogueState.bonus : { range: 1 };
                    const rangeRadius = st.range * rMul * rb.range * CELL;
                    ctx.beginPath(); ctx.arc(px, py, rangeRadius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(126, 200, 255, 0.06)'; ctx.fill();
                    ctx.strokeStyle = rMul > 1.0001 ? 'rgba(74, 255, 208, 0.55)' : 'rgba(126, 200, 255, 0.35)';
                    ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    if (rMul > 1.0001) {
                        ctx.beginPath(); ctx.arc(px, py, st.range * CELL, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(126, 200, 255, 0.18)';
                        ctx.lineWidth = 1; ctx.setLineDash([2, 4]); ctx.stroke(); ctx.setLineDash([]);
                    }
                }
                drawTowerBase(px, py, t, typeDef);
                drawTowerLogo(ctx, t.type, t.level, px, py, t.angle, LEVEL_COLORS[Math.min(t.level, MAX_LEVEL) - 1], tsf);
                if (selectedTower === t) {
                    ctx.beginPath(); ctx.arc(px, py, TOWER_RADIUS + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 3; ctx.stroke();
                }
                if (t.autoUpgrade && t.level < MAX_LEVEL) {
                    ctx.beginPath();
                    ctx.arc(px + TOWER_RADIUS * 0.9, py - TOWER_RADIUS * 0.9, Math.max(2, 3.2 * tsf), 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(74, 255, 208, 0.9)';
                    ctx.shadowColor = '#4affd0'; ctx.shadowBlur = 6;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
                if (t.silenceTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(px, py, TOWER_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(200, 100, 255, 0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                if (t.overheatTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(px, py, TOWER_RADIUS, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 100, 50, 0.9)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
            for (const t of towers) {
                if (t.type === 'prism' && t.beamTargets && t.beamTargets.length) {
                    const px = cellCenterX(t.col), py = cellCenterY(t.row);
                    for (const e of t.beamTargets) {
                        if (enemies.indexOf(e) === -1) continue;
                        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y);
                        ctx.strokeStyle = 'rgba(255, 102, 221, 0.75)';
                        ctx.lineWidth = 2.5 * tsf; ctx.lineCap = 'round';
                        ctx.shadowColor = '#ff66dd'; ctx.shadowBlur = 10; ctx.stroke();
                        ctx.strokeStyle = 'rgba(255, 230, 250, 0.9)';
                        ctx.lineWidth = 1 * tsf; ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    continue;
                }
                if (t.type !== 'laser' || !t.beamOn || !t.beamTarget) continue;
                if (enemies.indexOf(t.beamTarget) === -1) continue;
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(t.beamTarget.x, t.beamTarget.y);
                ctx.strokeStyle = 'rgba(255, 80, 110, 0.85)';
                ctx.lineWidth = 3.5 * tsf; ctx.lineCap = 'round';
                ctx.shadowColor = '#ff4466'; ctx.shadowBlur = 12; ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 225, 235, 0.9)';
                ctx.lineWidth = 1.2 * tsf; ctx.stroke();
                ctx.shadowBlur = 0;
            }
            for (const e of enemies) {
                drawEnemy(e);
                if (selectedEnemy === e) {
                    const sf2 = CELL / baseCellPx;
                    const r2 = ENEMY_TYPES[e.type].size * sf2 * (e.isElite ? 1.3 : 1) + 8;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, r2, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 217, 102, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            for (const core of looseCores) {
                const pulse = 1 + Math.sin(Date.now() / 200 + (core.phase || 0)) * 0.18;
                ctx.beginPath(); ctx.arc(core.x, core.y, 6 * pulse * tsf, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 217, 102, 0.25)'; ctx.fill();
                ctx.beginPath(); ctx.arc(core.x, core.y, 4 * tsf, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd966';
                ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 14;
                ctx.fill(); ctx.shadowBlur = 0;
                if (core.delay > 0) {
                    ctx.beginPath(); ctx.arc(core.x, core.y, 9 * tsf, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(74, 255, 208, 0.55)';
                    ctx.lineWidth = 1.2 * tsf;
                    ctx.setLineDash([3 * tsf, 3 * tsf]); ctx.stroke(); ctx.setLineDash([]);
                }
                
            }
            for (const p of projectiles) {
                const alpha = Math.max(p.life / p.maxLife, 0);
                ctx.globalAlpha = alpha;
                
                if (p.kind === 'missile') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle || 0);
                    
                    const mColor = p.venom ? '#7aff4a' : '#c44aff';
                    const mFlame = p.venom ? 'rgba(150, 255, 120, 0.8)' : 'rgba(255, 170, 68, 0.8)';
                    ctx.beginPath();
                    ctx.arc(-6 * tsf, 0, 4 * tsf, 0, Math.PI * 2);
                    ctx.fillStyle = mFlame;
                    ctx.shadowColor = p.venom ? '#7aff4a' : '#ffaa44';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(8 * tsf, 0);
                    ctx.lineTo(-5 * tsf, -3.5 * tsf);
                    ctx.lineTo(-3 * tsf, 0);
                    ctx.lineTo(-5 * tsf, 3.5 * tsf);
                    ctx.closePath();
                    ctx.fillStyle = mColor;
                    ctx.shadowColor = mColor;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    
                    ctx.restore();
                    ctx.globalAlpha = 1;
                    continue;
                }

                if (p.kind === 'beam') {
                    ctx.beginPath(); ctx.moveTo(p.fromX, p.fromY); ctx.lineTo(p.toX, p.toY);
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.width;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.kind === 'ring') {
                    const r = p.radius * (1 - alpha * 0.7);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
                } else if (p.kind === 'shockwave') {
                    const r = p.radius * (1 - alpha);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.stroke();
                } else if (p.kind === 'boom') {
                    const r = p.radius * (1 - alpha);
                    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color; ctx.fill();
                } else if (p.kind === 'chain') {
                    ctx.beginPath();
                    ctx.moveTo(p.points[0], p.points[1]);
                    for (let i = 2; i < p.points.length; i += 2) ctx.lineTo(p.points[i], p.points[i + 1]);
                    ctx.strokeStyle = p.color; ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.kind === 'railbeam') {
                    ctx.beginPath(); ctx.moveTo(p.fromX, p.fromY); ctx.lineTo(p.toX, p.toY);
                    ctx.strokeStyle = p.color; ctx.lineWidth = p.width;
                    ctx.lineCap = 'butt';
                    ctx.shadowColor = p.color; ctx.shadowBlur = 12; ctx.stroke();
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.lineWidth = Math.max(1, p.width * 0.3);
                    ctx.shadowBlur = 0; ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }
            if (buildMenu && !gameOver) { drawBuildRangePreview(); drawBuildMenu(); }
            if (towerMenu && !gameOver) drawTowerMenu();


            let hudY = 56;
            drawGameTopInfo(10, hudY);
            hudY += 48;
            drawEnergyPanel(10, hudY);
            hudY += 48;
            
            if (waveIndex < totalWaves && !gameOver) {
                drawWaveCountdown(10, hudY);
                hudY += 38;
            }

        function drawTowerBase(px, py, t, typeDef) {
            const R = TOWER_RADIUS;
            const lvColor = LEVEL_COLORS[Math.min(t.level, MAX_LEVEL) - 1];
            const sides = 8, rot = Math.PI / sides;
            const baseR = R + Math.max(2, R * 0.14);
            const sideOffset = Math.max(2, R * 0.22);
            const shadowCY = py + R * 0.55;
            const shadowGrad = ctx.createRadialGradient(px, shadowCY, 0, px, shadowCY, R * 1.25);
            shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
            shadowGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.18)');
            shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath(); ctx.ellipse(px, shadowCY, R * 1.25, R * 0.6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2 + rot;
                const x = px + Math.cos(a) * baseR;
                const y = py + Math.sin(a) * baseR + sideOffset;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const sideGrad = ctx.createLinearGradient(px, py, px, py + baseR + sideOffset);
            sideGrad.addColorStop(0, '#22334a');
            sideGrad.addColorStop(0.55, '#101a2a');
            sideGrad.addColorStop(1, '#03060c');
            ctx.fillStyle = sideGrad; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const a = (i / sides) * Math.PI * 2 + rot;
                const x = px + Math.cos(a) * baseR;
                const y = py + Math.sin(a) * baseR;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const topGrad = ctx.createRadialGradient(px - baseR * 0.4, py - baseR * 0.4, baseR * 0.1, px, py, baseR * 1.1);
            topGrad.addColorStop(0, '#4a6288');
            topGrad.addColorStop(0.4, '#2a3e5a');
            topGrad.addColorStop(0.82, '#141f30');
            topGrad.addColorStop(1, '#080e18');
            ctx.fillStyle = topGrad; ctx.fill();
            ctx.strokeStyle = 'rgba(120, 170, 220, 0.55)'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            ctx.beginPath();
            ctx.arc(px - baseR * 0.12, py - baseR * 0.12, baseR * 0.78, Math.PI * 1.05, Math.PI * 1.42);
            ctx.strokeStyle = 'rgba(200, 230, 255, 0.35)'; ctx.lineWidth = Math.max(1, R * 0.06); ctx.stroke();
            const innerR = R * 0.82;
            const innerGrad = ctx.createRadialGradient(px - innerR * 0.35, py - innerR * 0.35, 0, px, py, innerR);
            innerGrad.addColorStop(0, '#0d1726');
            innerGrad.addColorStop(1, '#010205');
            ctx.beginPath(); ctx.arc(px, py, innerR, 0, Math.PI * 2);
            ctx.fillStyle = innerGrad; ctx.fill();
            ctx.beginPath();
            ctx.arc(px, py, innerR, Math.PI * 1.08, Math.PI * 1.92);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)'; ctx.lineWidth = Math.max(1, R * 0.06); ctx.stroke();
            ctx.beginPath();
            ctx.arc(px, py, innerR, Math.PI * 0.15, Math.PI * 0.85);
            ctx.strokeStyle = 'rgba(95, 135, 175, 0.5)'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            ctx.beginPath(); ctx.arc(px, py, baseR * 0.93, 0, Math.PI * 2);
            ctx.strokeStyle = lvColor + '66'; ctx.lineWidth = Math.max(1, R * 0.05); ctx.stroke();
            const dots = 4;
            const dotR = Math.max(1, R * 0.07);
            for (let i = 0; i < dots; i++) {
                const a = (i / dots) * Math.PI * 2 + Math.PI / 4;
                const dx = px + Math.cos(a) * baseR * 0.93;
                const dy = py + Math.sin(a) * baseR * 0.93;
                ctx.beginPath(); ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
                ctx.fillStyle = lvColor;
                ctx.shadowColor = lvColor; ctx.shadowBlur = Math.max(3, R * 0.25);
                ctx.fill(); ctx.shadowBlur = 0;
            }
        }

        function enemyRevealed(e) {
            for (const t of towers) {
                const px = cellCenterX(t.col), py = cellCenterY(t.row);
                const d = Math.hypot(e.x - px, e.y - py);
                if (d <= getStealthRevealRadius(t)) return true;
                if (t.type === 'temporal' && t.level >= MAX_LEVEL) {
                    const st = towerStatsAt('temporal', t.level);
                    if (d <= st.range * CELL) return true;
                }
            }
            return false;
        }

        function drawEnemy(e) {
            const type = ENEMY_TYPES[e.type];
            const sf = CELL / baseCellPx;
            const size = type.size * sf * (e.isElite ? 1.3 : 1);
            const color = type.color;
            const stealth = !!type.stealth;
            const revealed = !stealth || enemyRevealed(e);
            if (stealth && !revealed) ctx.globalAlpha = 0.20;
            if (type.air) {
                ctx.beginPath();
                ctx.ellipse(e.x, e.y + size + 8 * sf, size * 0.9, size * 0.35, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)'; ctx.fill();
            }
            
            // 进阶难度机制12：精英光环
            if (e.isElite) {
                ctx.beginPath();
                ctx.arc(e.x, e.y, size + 6 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.lineWidth = 2 * sf;
                ctx.stroke();
            }

            const barW = Math.max(28 * sf, size * 2.5);
            const hpPercent = Math.max(e.hp / e.maxHp, 0);
            const barH = Math.max(2, 3 * sf);
            if (e.maxShield > 0 && e.shield > 0) {
                const sp = e.shield / e.maxShield;
                ctx.fillStyle = '#1a2a4a';
                ctx.fillRect(e.x - barW / 2, e.y - size - 18 * sf, barW, barH);
                ctx.fillStyle = '#66aaff';
                ctx.fillRect(e.x - barW / 2, e.y - size - 18 * sf, barW * sp, barH);
            }
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x - barW / 2, e.y - size - 12 * sf, barW, barH);
            ctx.fillStyle = hpPercent > 0.5 ? '#4aff4a' : (hpPercent > 0.25 ? '#ffaa00' : '#ff4444');
            ctx.fillRect(e.x - barW / 2, e.y - size - 12 * sf, barW * hpPercent, barH);
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.fillStyle = color;
            ctx.shadowColor = color; ctx.shadowBlur = 12;
            if (e.type === 'runner') {
                ctx.beginPath();
                ctx.moveTo(0, -size); ctx.lineTo(size, 0); ctx.lineTo(0, size); ctx.lineTo(-size, 0); ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 20; ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            } else if (e.type === 'tank') {
                ctx.fillRect(-size * 0.9, -size * 0.9, size * 1.8, size * 1.8);
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fillRect(-size * 0.4, -size * 0.4, size * 0.8, size * 0.8);
            } else if (e.type === 'flyer') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-size * 1.4, -2, size * 0.7, size * 0.3, -0.3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(size * 1.4, -2, size * 0.7, size * 0.3, 0.3, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'boss') {
                ctx.beginPath(); ctx.arc(0, 0, size + 4 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 180, 255, 0.5)'; ctx.lineWidth = 3 * sf; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size * 0.7, -size * 0.55); ctx.lineTo(-size * 0.55, -size * 1.15);
                ctx.lineTo(-size * 0.25, -size * 0.75); ctx.lineTo(0, -size * 1.25);
                ctx.lineTo(size * 0.25, -size * 0.75); ctx.lineTo(size * 0.55, -size * 1.15);
                ctx.lineTo(size * 0.7, -size * 0.55); ctx.closePath();
                ctx.fillStyle = '#ffdd44'; ctx.fill();
            } else if (e.type === 'shield') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(-size * 0.6, -size * 0.25); ctx.lineTo(-size * 0.6, size * 0.25);
                ctx.lineTo(0, size * 0.8); ctx.lineTo(size * 0.6, size * 0.25);
                ctx.lineTo(size * 0.6, -size * 0.25); ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.fill();
            } else if (e.type === 'shaman') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 3 * sf;
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.5); ctx.lineTo(0, size * 0.5);
                ctx.moveTo(-size * 0.5, 0); ctx.lineTo(size * 0.5, 0); ctx.stroke();
            } else if (e.type === 'brute') {
                ctx.fillRect(-size, -size, size * 2, size * 2);
                ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(-size * 0.55, -size * 0.55, size * 1.1, size * 1.1);
            } else if (e.type === 'ghost') {
                ctx.globalAlpha = 0.55;
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            } else if (e.type === 'wasp') {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-size * 1.1, -2, size * 0.5, size * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(size * 1.1, -2, size * 0.5, size * 0.25, 0.4, 0, Math.PI * 2); ctx.fill();
            } else if (e.type === 'hatcher' || e.type === 'summoner' || e.type === 'jammer') {
            drawSpecialEnemyBody(ctx, e.type, size, color);}
            else if (stealth) {
                ctx.globalAlpha = 0.6;
                drawStealthShape(ctx, e.type, size, color);
                drawSpecialEnemyBody(ctx, e.type, size, color);
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            } else {
                ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.shadowBlur = 0;
            const eyeR = Math.max(1.5, size * 0.2);
            const pupilR = Math.max(0.8, size * 0.1);
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-size * 0.3, -size * 0.2, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size * 0.3, -size * 0.2, eyeR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-size * 0.3, -size * 0.2, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size * 0.3, -size * 0.2, pupilR, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
            if (e.charmed) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 6 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 120, 220, 0.9)'; ctx.lineWidth = 2 * sf;
                ctx.setLineDash([4 * sf, 3 * sf]); ctx.stroke(); ctx.setLineDash([]);
                ctx.fillStyle = '#ff88dd';
                ctx.font = `${Math.round(11 * sf)}px "Microsoft YaHei"`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('💖', e.x, e.y - size - 16 * sf);
            }
            if (e.slowTimer > 0) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 5 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(74, 255, 208, 0.8)'; ctx.lineWidth = 2 * sf; ctx.stroke();
            }
            if (e.burnTimer > 0) {
                ctx.beginPath(); ctx.arc(e.x, e.y, size + 8 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 110, 60, 0.75)'; ctx.lineWidth = 2 * sf;
                ctx.setLineDash([3 * sf, 3 * sf]); ctx.stroke(); ctx.setLineDash([]);
            }
            if (e.poison && e.poison.length > 0) {
                const stacks = Math.min(e.poison.length, 6);
                for (let k = 0; k < stacks; k++) {
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, size + (4 + k * 1.5) * sf, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(122, 255, 74, ${0.5 - k * 0.07})`;
                    ctx.lineWidth = 1.2 * sf; ctx.stroke();
                }
            }
            if (e.stunTimer > 0) {
                const t2 = Date.now() / 120;
                ctx.save();
                ctx.fillStyle = '#ffe066';
                ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 8;
                for (let k = 0; k < 3; k++) {
                    const a = t2 + k * Math.PI * 2 / 3;
                    const rx = Math.cos(a) * (size + 8 * sf);
                    const ry = Math.sin(a) * (size + 4 * sf) - size - 4 * sf;
                    ctx.beginPath(); ctx.arc(e.x + rx, e.y + ry, 2.2 * sf, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
            if (e.carrying > 0) {
                const n = Math.min(e.carrying, 4);
                ctx.shadowColor = '#ffd966'; ctx.shadowBlur = 8;
                ctx.fillStyle = '#ffd966';
                for (let k = 0; k < n; k++) {
                    ctx.beginPath();
                    ctx.arc(e.x - (n - 1) * 4 * sf + k * 8 * sf, e.y + size + 12 * sf, 3 * sf, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                if (e.carrying > 4) {
                    ctx.font = `bold ${Math.round(9 * sf)}px "Microsoft YaHei"`;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#ffd966';
                    ctx.fillText('+' + (e.carrying - 4), e.x + (n - 1) * 4 * sf + 6 * sf, e.y + size + 12 * sf);
                }
            }
            ctx.globalAlpha = 1;
            if (stealth) {
                const ringMul = { wraith: 1.45, phantom: 1.35, stalker: 1.4, specter: 1.9, shade: 1.75 }[e.type] || 1.3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, size * ringMul + Math.sin(Date.now() / 280) * 1.5 * sf, 0, Math.PI * 2);
                ctx.strokeStyle = revealed
                    ? 'rgba(255, 200, 100, 0.95)'          // ★ 已揭示：暖金色 → 让玩家知道它"被打上了灯"
                    : 'rgba(150, 175, 220, 0.30)';
                ctx.lineWidth = (revealed ? 2.2 : 1.4) * sf;    // ★ 已揭示更醒目
                ctx.setLineDash([4 * sf, 4 * sf]); ctx.stroke(); ctx.setLineDash([]);
                if (revealed) {
                    // 揭示标记
                    ctx.fillStyle = 'rgba(255, 210, 120, 0.9)';
                    ctx.font = `bold ${Math.round(10 * sf)}px "Microsoft YaHei"`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('👁', e.x, e.y - size - 22 * sf);
                }
            }
        }

        // ============================================================
        // 战斗逻辑
        // ============================================================
        function applyStun(e, dur) {
            if (!e || dur <= 0) return;
            const m = (rogueState && rogueState.enemyMods && rogueState.enemyMods.stunMul) || 1;
            e.stunTimer = Math.max(e.stunTimer || 0, dur * m);
        }

        function damageEnemy(e, dmg, tower, skipDoubleShot, opts) {
            if (e.hp <= 0) return;
            opts = opts || {};
            const isDot = !!opts.dot;
            const em = (rogueState && rogueState.enemyMods) ? rogueState.enemyMods : null;
            if (em) {
                if (em.coreLockStacks > 0 && e.carrying <= 0) {
                    dmg *= Math.pow(0.8, em.coreLockStacks);
                }
                if (!isDot && em.dodge > 0 && Math.random() < em.dodge) return;
            }
            
            // 进阶难度机制 17：反伤装甲
            if (tower && e.type === 'shield' && ascensionState && ascensionState.reflect) {
                if (Math.random() < 0.2) {
                    tower.slowTimer = Math.max(tower.slowTimer || 0, 2.0);
                }
            }

            const hpBefore = e.hp, shBefore = e.shield;
            if (!isDot && !skipDoubleShot && rogueState && tower && rogueState.bonus.currentHpDamage > 0) {
                dmg += e.hp * rogueState.bonus.currentHpDamage;
            }
                let critChance = 0;
    if (rogueState && rogueState.bonus.critChance > 0) critChance += rogueState.bonus.critChance;
    if (tower && tower.syn && tower.syn.crit > 0) critChance += tower.syn.crit;
    if (critChance > 1) critChance = 1;
    if (!isDot && !skipDoubleShot && critChance > 0 && Math.random() < critChance) {
        dmg *= (rogueState && rogueState.bonus.critDmgMul) || 2;
    }
            if (rogueState && rogueState.bonus.ignoreShield) {
                e.hp -= dmg;
            } else {
                if (e.shield > 0) {
                    const absorbed = Math.min(e.shield, dmg);
                    e.shield -= absorbed;
                    dmg -= absorbed;
                }
                e.hp -= dmg;
            }
            if (tower) {
                const actual = (hpBefore - Math.max(0, e.hp)) + (shBefore - e.shield);
                if (actual > 0) {
                    tower.damageDealt = (tower.damageDealt || 0) + actual;
                    e.lastHitBy = tower;
                }
            }
            if (!isDot && !skipDoubleShot && tower && rogueState && rogueState.bonus.charmChance > 0 && e.hp > 0 && !e.charmed) {
                if (Math.random() < rogueState.bonus.charmChance) charmEnemy(e);
            }
            if (!skipDoubleShot && tower && rogueState && rogueState.bonus.doubleShotChance > 0 && e.hp > 0 && Math.random() < rogueState.bonus.doubleShotChance) {
                // 弹射（方案B）
                let nearest = null, minDist = 2.5 * CELL;
                for (const other of enemies) {
                    if (other === e || other.hp <= 0) continue;
                    const d = Math.hypot(other.x - e.x, other.y - e.y);
                    if (d < minDist) { minDist = d; nearest = other; }
                }
                if (nearest) {
                    damageEnemy(nearest, dmg * 0.7, tower, true);
                    projectiles.push({ kind: 'beam', fromX: e.x, fromY: e.y, toX: nearest.x, toY: nearest.y, color: '#88ccff', width: 2, life: 0.1, maxLife: 0.1 });
                }
            }
        }

        function applyVenomStack(e, v) {
            if (!e || e.hp <= 0 || !v) return;
            if (!e.poison) e.poison = [];
            if (e.poison.length < v.maxStacks) {
                e.poison.push({ dps: v.dps, timer: v.dur });
            } else {
                let oldest = e.poison[0];
                for (const p of e.poison) if (p.timer < oldest.timer) oldest = p;
                oldest.dps = Math.max(oldest.dps, v.dps);
                oldest.timer = v.dur;
            }
        }

        function cleanupDeadEnemies() {
            let changed = false;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.hp <= 0) {
                    if (e.lastHitBy && towers.indexOf(e.lastHitBy) !== -1) {
                        e.lastHitBy.kills = (e.lastHitBy.kills || 0) + 1;
                    }
                    let harvestBonus = 0;
                    for (const ht of towers) {
                        if (ht.type !== 'harvester') continue;
                        const hs = towerStatsAt('harvester', ht.level);
                        const rMul = (ht.buffs && ht.buffs.range) || 1;
                        const synR = 1 + (ht.syn ? (ht.syn.range   || 0) : 0);
                        const synH = 1 + (ht.syn ? (ht.syn.harvest || 0) : 0);
                        const hRange = hs.range * rMul * synR * CELL;
                        const dd = Math.hypot(e.x - cellCenterX(ht.col), e.y - cellCenterY(ht.row));
                        if (dd <= hRange) harvestBonus = Math.max(harvestBonus, e.reward * hs.harvest * synH);
                    }
                    const rogueKillBonus = (rogueState && rogueState.bonus.killBonus) || 0;
                    let rogueRewardMul = (rogueState && rogueState.bonus.rewardMul) || 1;
                    if (ascensionState && ascensionState.ecoNerf) {
                        const st = getEnergyStats();
                        const totalCores = st.green + st.yellow;
                        rogueRewardMul *= Math.min(1, totalCores / 20);
                    }
                    money += (e.reward * rogueRewardMul + harvestBonus + rogueKillBonus);
                    if (battleStats) battleStats.kills++;
                    if (e.carrying > 0) {
                        const cd = getCoreDelayStacks() * 3.0;
                        for (let k = 0; k < e.carrying; k++) {
                            looseCores.push({
                                x: e.x + (Math.random() - 0.5) * 8,
                                y: e.y + (Math.random() - 0.5) * 8,
                                cellC: e.cellC, cellR: e.cellR,
                                nextC: null, nextR: null,
                                dirC: 0, dirR: 0, nextDirC: 0, nextDirR: 0,
                                delay: cd + k * 0.12,
                                phase: Math.random() * Math.PI * 2,
                            });

            if (def.jammer || e.type === 'jammer') score += 2100;

                nearest = Math.min(nearest, Math.hypot(e.x - gx, e.y - gy));

        function collectTargets(t, towerPx, towerPy, rangePx) {
            const typeDef = TOWER_TYPES[t.type];

            for (const e of enemies) {

                const enemyDef = ENEMY_TYPES[e.type] || {};
                const isAir = !!enemyDef.air;
                if (isAir && ascensionState && ascensionState.airOnlyFlak && t.type !== 'flak') continue;
                if (isAir && !typeDef.targetsAir) continue;
                if (!isAir && typeDef.airOnly) continue;
                const dx = e.x - towerPx, dy = e.y - towerPy;
                const dist = Math.hypot(dx, dy);
                if (dist > rangePx) continue;
                if (!enemyVisibleFromTower(e, t, dist)) continue;
                out.push({ e, dist, priority: aiEnemyTacticalPriority(e) });
            }
            out.sort((a, b) => {
                if (a.priority !== b.priority) return b.priority - a.priority;
                return a.dist - b.dist;
            });
            return out;
        }

// 每帧重算每座塔的联动加成
function updateSynergies() {

    const cardScale = (rogueState && rogueState.bonus && typeof rogueState.bonus.synergyScale === 'number')

const scale = (rogueState && rogueState.bonus && typeof rogueState.bonus.synergyScale === 'number')
    ? rogueState.bonus.synergyScale

    const posCache = new Map();

            const baseStats = towerStatsAt(t.type, t.level);

                const q = posCache.get(o);

                };
            }
            for (const k in s.mods) {
                syn[k] = (syn[k] || 0) + s.mods[k] * n * scale;
            }
        }

        function clipRayToMap(px, py, ux, uy, maxLen) {
            const x0 = mapOffX, x1 = mapOffX + COLS * CELL;
            const y0 = mapOffY, y1 = mapOffY + ROWS * CELL;
            let t = maxLen;
            if (ux > 1e-9)       t = Math.min(t, (x1 - px) / ux);
            else if (ux < -1e-9) t = Math.min(t, (x0 - px) / ux);
            if (uy > 1e-9)       t = Math.min(t, (y1 - py) / uy);

            return Math.max(0, t);

            // ── 毒弹专用分支：伤害只结算给目标，叠毒按 radius 扩散 ──
            if (isVenom) {
                const vr = p.venom.radius || 0;
                // 单体伤害：只打命中目标（1~5 级与 6 级一致）
                if (p.target && p.target.hp > 0 && enemies.indexOf(p.target) !== -1) {
                    damageEnemy(p.target, p.damage, p.tower);
                }
                // 叠毒：6 级 radius > 0 时对半径内所有敌人叠毒；1~5 级只对目标叠毒
                if (vr > 0) {
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        const d = Math.hypot(e.x - p.x, e.y - p.y);
                        if (d > vr) continue;
                        if (ENEMY_TYPES[e.type].stealth && !enemyVisibleFromTower(e, p.tower, d)) continue;
                        applyVenomStack(e, p.venom);
                    }
                } else if (p.target && p.target.hp > 0 && enemies.indexOf(p.target) !== -1) {
                    applyVenomStack(p.target, p.venom);
                }
                projectiles.push({
                    kind: 'boom', x: p.x, y: p.y,
                    radius: Math.max(vr, CELL * 0.45) * 0.85,
                    color: '#7aff4a',
                    life: 0.25, maxLife: 0.25
                });
                SFX.boom();
                return;
            }

            // ── 普通导弹（导弹塔）分支：保持原逻辑 ──
            let splashR = p.splash * CELL;
            let ratio = 0.6;
            if (p.isMax) { splashR *= 2; ratio = 1.0; }

            for (const e of enemies) {
                if (e.hp <= 0) continue;
                const d = Math.hypot(e.x - p.x, e.y - p.y);
                if (d > splashR) continue;
                if (ENEMY_TYPES[e.type].stealth) {
                    if (!enemyVisibleFromTower(e, p.tower, d)) continue;
                }
                const dmg = (e === p.target) ? p.damage : p.damage * ratio;
                damageEnemy(e, dmg, p.tower);
                if (p.tower && p.tower.syn && p.tower.syn.stun > 0) {
                    applyStun(e, 0.4 * p.tower.syn.stun);
                }
            }

            projectiles.push({
                kind: 'boom', x: p.x, y: p.y,
                radius: splashR * 0.85,
                color: '#ddaaff',
                life: 0.25, maxLife: 0.25
            });
            SFX.boom();
        }

        // 进阶难度机制 11：累积过热值，连续攻击满 5 秒则停机 1 秒
        function accumulateOverheat(t, attacking, dt) {
            if (!(ascensionState && ascensionState.overheat)) return false;
            if (attacking) t.heat = (t.heat || 0) + dt;
            else t.heat = Math.max(0, (t.heat || 0) - dt * 2);
            if (t.heat >= 5) {
                t.overheatTimer = 1;
                t.heat = 0;
                t.beamOn = false;
                t.beamTarget = null;
                t.beamTargets = null;
                return true;
            }
            return false;
        }

        

        function updateTowers(dt) {
            for (const t of towers) {
                const typeDef = TOWER_TYPES[t.type];
                if (!typeDef) continue;

                // NaN 兜底：一旦角度被污染成 NaN，rotate() 会让炮管永远"卡住"
                if (!Number.isFinite(t.angle)) t.angle = -Math.PI / 2;
                if (t.type === 'harvester') {
                    if (t.silenceTimer > 0) t.silenceTimer = Math.max(0, t.silenceTimer - dt);
                    if (t.slowTimer   > 0) t.slowTimer   = Math.max(0, t.slowTimer   - dt);
                    continue;
                }

                // 先计算有效射程与目标过滤，再决定是否转向；射程内没有可攻击目标时保持原朝向。
                // 沉默/过热状态仍允许炮塔对射程内目标保持瞄准，但不会因此获得攻击能力。

                const base = towerStatsAt(t.type, t.level);
                const bf = t.buffs || { dmg: 1, rate: 1, range: 1 };
                const rb = (rogueState && rogueState.bonus) ? rogueState.bonus : { dmg:1, rate:1, range:1 };
                let st = {
                    ...base,
                    damage:  (base.damage  || 0) * bf.dmg * rb.dmg,
                    dps:     (base.dps     || 0) * bf.dmg * rb.dmg,
                    burnDps: (base.burnDps || 0) * bf.dmg * rb.dmg,
                    poisonDps: (base.poisonDps || 0) * bf.dmg * rb.dmg,
                    cooldown:(base.cooldown || 0) / (bf.rate * rb.rate),
                    range:   (base.range   || 0) * bf.range * rb.range
                };
                                // ★ 合并联动加成（伤害/射速/射程）
                const syn = t.syn;
                if (syn) {
                    st.damage    *= (1 + syn.dmg);
                    st.dps       *= (1 + syn.dmg);
                    st.burnDps   *= (1 + syn.burn);
                    st.poisonDps *= (1 + syn.poison);
                    st.cooldown  /= (1 + syn.rate);
                    st.range     *= (1 + syn.range);
                }

                if (ascensionState && ascensionState.fireDecay) {
                    const decayMul = Math.max(0.5, 1 - Math.floor(waveIndex / 10) * 0.1);
                    st.damage *= decayMul; st.dps *= decayMul; st.burnDps *= decayMul; st.poisonDps *= decayMul;
                }
                
                if (ascensionState && ascensionState.mudPit && mudPits.some(p => p.c === t.col && p.r === t.row)) {
                    st.cooldown *= 1.2;
                }

                const towerPx = cellCenterX(t.col), towerPy = cellCenterY(t.row);
                const rangePx = st.range * CELL;
                const isMax = t.level >= MAX_LEVEL;

                if (TURRET_TOWER_TYPES.has(t.type) && rangePx > 0) {
                    const aim = findTarget(t, towerPx, towerPy, rangePx);
                    if (aim) {
                        const wantAngle = Math.atan2(aim.y - towerPy, aim.x - towerPx);
                        if (Number.isFinite(wantAngle)) t.angle = turnToward(t.angle, wantAngle, dt, 18);
                    }
                }

                if (t.silenceTimer > 0) { t.silenceTimer -= dt; continue; }

                // 进阶难度机制 11：过热时停止攻击，但仍允许炮管跟踪射程内目标。
                if (ascensionState && ascensionState.overheat && t.overheatTimer > 0) {
                    t.overheatTimer -= dt;
                    t.beamOn = false; t.beamTarget = null; t.beamTargets = null;
                    continue;
                }

                if (t.type === 'laser') {
                    const target = findTarget(t, towerPx, towerPy, rangePx);
                    const wasOn = t.beamOn;
                    if (target) {
                        // 激光持续照射时，炮管始终精确朝向当前照射目标。
                        aimTurretAtTarget(t, towerPx, towerPy, target);
                        const burnDur = isMax ? 1e9 : st.burnDur;
                        target.burnTimer = Math.max(target.burnTimer, burnDur);
                        target.burnDps   = Math.max(target.burnDps, st.burnDps);
                        target.burnTower = t;
                        t.beamOn = true; t.beamTarget = target;
                        if (!wasOn) SFX.shoot('laser');
                        // ★ 联动眩晕：每 0.4 秒对主目标施加一次短眩晕
                        if (syn && syn.stun > 0) {
                            t.stunTickTimer = (t.stunTickTimer || 0) - dt;
                            if (t.stunTickTimer <= 0) {
                                applyStun(target, 0.3 * syn.stun);
                                t.stunTickTimer = 0.4;
                            }
                        }
                    } else { t.beamOn = false; t.beamTarget = null; }
                    accumulateOverheat(t, !!t.beamOn, dt);
                    continue;
                }
                if (t.type === 'prism') {
                    const prismTargets = st.targets + (syn ? Math.floor(syn.targets) : 0);
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, prismTargets);
                    if (picked.length) {
                        t.beamTargets = picked.map(o => o.e);
                        for (const o of picked) damageEnemy(o.e, st.dps * dt, t, false, { dot: true });
                        SFX.shoot('prism');
                    } else t.beamTargets = null;
                    accumulateOverheat(t, !!(t.beamTargets && t.beamTargets.length), dt);
                    continue;
                }

                if (t.type !== 'laser' && t.type !== 'prism') {
                    if (ascensionState && ascensionState.ammo) {
                        if (t.isReloading) {
                            const reloadCost = Math.floor(TOWER_TYPES[t.type].cost * 0.1) + t.level * 5;
                            if (money >= reloadCost) {
                                money -= reloadCost;
                                t.ammo = 50;
                                t.isReloading = false;
                                updateUI();
                                msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动装填，花费 ${reloadCost} 金币`;
                            } else {
                                continue;
                            }
                        }
                        if (t.ammo <= 0) {
                            const reloadCost = Math.floor(TOWER_TYPES[t.type].cost * 0.1) + t.level * 5;
                            if (money >= reloadCost) {
                                money -= reloadCost;
                                t.ammo = 50;
                                updateUI();
                                msgDisplay.textContent = `${TOWER_TYPES[t.type].name} 自动装填，花费 ${reloadCost} 金币`;
                            } else {
                                t.isReloading = true;
                                continue;
                            }
                        }
                    }
                }

                let actualCooldown = st.cooldown;
                if (t.slowTimer > 0) {
                    t.slowTimer -= dt;
                    actualCooldown *= 2;
                }

                if (t.type === 'laser') {
                    const target = findTarget(t, towerPx, towerPy, rangePx);
                    const wasOn = t.beamOn;
                    if (target) {
                        aimTurretAtTarget(t, towerPx, towerPy, target);
                        const burnDur = isMax ? 1e9 : st.burnDur;
                        target.burnTimer = Math.max(target.burnTimer, burnDur);
                        target.burnDps   = Math.max(target.burnDps, st.burnDps);
                        target.burnTower = t;
                        t.beamOn = true; t.beamTarget = target;
                        if (!wasOn) SFX.shoot('laser');
                    } else { t.beamOn = false; t.beamTarget = null; }
                    continue;
                }
                if (t.type === 'prism') {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, st.targets);
                    if (picked.length) {
                        t.beamTargets = picked.map(o => o.e);
                        for (const o of picked) damageEnemy(o.e, st.dps * dt, t, false, { dot: true });
                        SFX.shoot('prism');
                    } else t.beamTargets = null;
                    continue;
                }

                t.cooldown -= dt;
                const target = findTarget(t, towerPx, towerPy, rangePx);
                if (t.type !== 'amplifier' && accumulateOverheat(t, !!target, dt)) continue;
                if (t.cooldown > 0 || !target) continue;
                // 只有真正进入本次射击时才校准方向，确保炮管与子弹/光束方向一致。
                aimTurretAtTarget(t, towerPx, towerPy, target);
                if (t.type === 'amplifier') { t.cooldown = 0; continue; }

                if (ascensionState && ascensionState.ammo && t.type !== 'laser' && t.type !== 'prism' && t.type !== 'amplifier') {
                    t.ammo--;
                }

                if (t.type === 'missile') {
                    projectiles.push({
                        kind: 'missile',
                        fromX: towerPx, fromY: towerPy,
                        x: towerPx, y: towerPy,
                        tx: target.x, ty: target.y,
                        target: target,
                        angle: Math.atan2(target.y - towerPy, target.x - towerPx),
                        speed: 12 * CELL,
                        damage: st.damage,
                        tower: t,
                        isMax: isMax,
                        splash: (typeDef.splash || 1.2) * (1 + (syn ? (syn.splash || 0) : 0)),
                        life: 4.0, maxLife: 4.0,
                        color: '#c44aff'
                    });
                    SFX.shoot('missile');
                    t.cooldown = actualCooldown;
                    continue;
                }

                if (t.type === 'venom') {
                    // 全等级：发射追踪毒弹（与导弹塔同款弹道）
                    // 1~5 级：命中只对目标叠毒；6 级：命中后在 1 格半径内扩散叠毒，且毒层无上限
                    projectiles.push({
                        kind: 'missile',
                        venom: {
                            dps: st.poisonDps,
                            dur: st.poisonDur,
                            maxStacks: st.maxStacks,
                            radius: isMax ? 1.0 * CELL : 0
                        },
                        fromX: towerPx, fromY: towerPy,
                        x: towerPx, y: towerPy,
                        tx: target.x, ty: target.y,
                        target: target,
                        angle: Math.atan2(target.y - towerPy, target.x - towerPx),
                        speed: 12 * CELL,
                        damage: st.damage,
                        tower: t,
                        isMax: false,
                        splash: 0,
                        life: 4.0, maxLife: 4.0,
                        color: '#7aff4a'
                    });
                    SFX.shoot('venom');
                    t.cooldown = actualCooldown;
                    continue;
                }

                if (t.type === 'emp') {
                    let hitAny = false;
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const d2 = Math.hypot(e.x - towerPx, e.y - towerPy);
                        if (d2 > rangePx) continue;
                        if (!enemyVisibleFromTower(e, t, d2)) continue;
                                                const mech = MECH_TYPES.has(e.type);
                        damageEnemy(e, st.damage * (mech && isMax ? 1.5 : 1), t);
                        const stunMul = 1 + (syn ? (syn.stun || 0) : 0);
                        const finalStun = Math.min(st.stun * stunMul * (mech ? 1.5 : 1), st.cooldown * 0.9);
                        applyStun(e, finalStun);
                        hitAny = true;
                    }
                    if (hitAny) {
                        SFX.shoot('emp');
                        projectiles.push({
                            kind: 'shockwave', x: towerPx, y: towerPy, radius: rangePx,
                            color: 'rgba(160, 224, 255, 0.9)', life: 0.4, maxLife: 0.4
                        });
                    }
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'chain') {
                    const hit = new Set();
                    let cur = target, dmg = st.damage;
                    let fromX = towerPx, fromY = towerPy;
                    const maxJumps = typeDef.chainJumps + Math.floor(t.level / 2) + (syn ? Math.floor(syn.chain) : 0);
                    const jumpR = 1.8 * CELL;
                    const pts = [];
                    for (let j = 0; j < maxJumps && cur; j++) {
                        hit.add(cur);
                        damageEnemy(cur, dmg, t);
                        if (isMax && Math.random() < 0.15) applyStun(cur, 0.2 * (1 + (syn ? (syn.stun || 0) : 0)));
                        if (syn && syn.stun > 0 && Math.random() < 0.15) applyStun(cur, 0.3 * syn.stun);
                        pts.push(fromX, fromY, cur.x, cur.y);
                        fromX = cur.x; fromY = cur.y;
                        let next = null, nd = jumpR;
                        for (const e of enemies) {
                            if (e.hp <= 0 || hit.has(e)) continue;
                            if (ENEMY_TYPES[e.type].air) continue;
                            const dd = Math.hypot(e.x - fromX, e.y - fromY);
                            if (dd < nd) { nd = dd; next = e; }
                        }
                        cur = next;
                        dmg *= typeDef.chainDecay;
                    }
                    projectiles.push({ kind: 'chain', points: pts, color: '#cce8ff', life: 0.15, maxLife: 0.15 });
                    SFX.shoot('chain');
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'sniper') {
                    const crit = isMax && (target.slowTimer > 0 || target.stunTimer > 0);
                    damageEnemy(target, st.damage * (crit ? 2 : 1), t);
                    if (syn && syn.stun > 0) applyStun(target, 0.4 * syn.stun);
                    projectiles.push({
                        kind: 'beam', fromX: towerPx, fromY: towerPy,
                        toX: target.x, toY: target.y,
                        color: crit ? '#ffffff' : '#88ff88',
                        width: crit ? 4 : 2.5, life: 0.14, maxLife: 0.14
                    });
                    SFX.shoot('sniper');
                    t.cooldown = actualCooldown;
                    continue;
                }
                if (t.type === 'railgun') {
                    const dx = target.x - towerPx, dy = target.y - towerPy;
                    const dl = Math.hypot(dx, dy) || 1;
                    const ux = dx / dl, uy = dy / dl;
                    const bLen = clipRayToMap(towerPx, towerPy, ux, uy, rangePx);
                    const pierceMul = 1 + (syn ? (syn.pierce || 0) : 0);
                    const hw = (isMax ? typeDef.beamWidth * 2 : typeDef.beamWidth) * CELL * pierceMul;
                    const endX = towerPx + ux * bLen;
                    const endY = towerPy + uy * bLen;
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const ex = e.x - towerPx, ey = e.y - towerPy;
                        const proj = ex * ux + ey * uy;
                        if (proj < 0 || proj > bLen) continue;
                        const perp = Math.abs(ex * -uy + ey * ux);
                        if (perp > hw + ENEMY_TYPES[e.type].size * 0.5 * (CELL / baseCellPx)) continue;
                        if (!enemyVisibleFromTower(e, t, Math.hypot(ex, ey))) continue;
                        damageEnemy(e, st.damage, t);
                        if (syn && syn.stun > 0) applyStun(e, 0.4 * syn.stun);
                    }
                    projectiles.push({
                        kind: 'railbeam', fromX: towerPx, fromY: towerPy,
                        toX: endX, toY: endY,
                        width: hw * 2, color: '#ffe066', life: 0.22, maxLife: 0.22
                    });
                    SFX.shoot('railgun');
                    t.cooldown = actualCooldown;
                    continue;
                }
                                if (t.type === 'temporal') {
                    if (!ENEMY_TYPES[target.type].immuneSlow) {
                        const slowVal = Math.min(1, st.slow * (1 + (syn ? (syn.slow || 0) : 0)));
                        target.slowTimer = Math.max(target.slowTimer, st.duration);
                        target.slowFactor = Math.min(target.slowFactor, slowVal);
                    }
                    projectiles.push({
                        kind: 'ring', x: target.x, y: target.y, radius: 22 * (CELL / baseCellPx),
                        color: '#4affd0', life: 0.4, maxLife: 0.4
                    });
                    SFX.shoot('temporal');
                    t.cooldown = typeDef.fireRate;
                } else if (t.type === 'shock') {
                    for (const e of enemies) {
                        if (e.hp <= 0) continue;
                        if (ENEMY_TYPES[e.type].air) continue;
                        const d = Math.hypot(e.x - towerPx, e.y - towerPy);
                        if (d > rangePx) continue;
                        if (!enemyVisibleFromTower(e, t, d)) continue;
                        damageEnemy(e, st.damage, t);
                        if (isMax && Math.random() < 0.2) applyStun(e, 0.1 * (1 + (syn ? (syn.stun || 0) : 0)));
                        if (syn && syn.stun > 0) applyStun(e, 0.4 * syn.stun);
                    }
                    projectiles.push({
                        kind: 'shockwave', x: towerPx, y: towerPy, radius: rangePx,
                        color: 'rgba(255, 204, 0, 0.9)', life: 0.35, maxLife: 0.35
                    });
                    SFX.shoot('shock');
                    t.cooldown = actualCooldown;
                } else if (t.type === 'gun' && isMax) {
                    const picked = collectTargets(t, towerPx, towerPy, rangePx).slice(0, 5);
                    for (const o of picked) {
                        const e = o.e;
                        damageEnemy(e, st.damage, t);
                        projectiles.push({
                            kind: 'beam', fromX: towerPx, fromY: towerPy,
                            toX: e.x, toY: e.y,
                            color: '#4a9eff', width: 2, life: 0.08, maxLife: 0.08
                        });
                    }
                    SFX.shoot('gun');
                    t.cooldown = actualCooldown;
                } else {
                    let dmgToTarget = st.damage;
                    if (t.type === 'flak' && isMax && Math.random() < 0.25) dmgToTarget *= 3;
                    damageEnemy(target, dmgToTarget, t);
                    if (t.type === 'cannon') {
                        if (isMax) applyStun(target, 0.25 * (1 + (syn ? (syn.stun || 0) : 0)));
                        else if (syn && syn.stun > 0) applyStun(target, 0.4 * syn.stun);
                    }
                    if (typeDef.splash) {
                        let splashR = typeDef.splash * CELL * (1 + (syn ? (syn.splash || 0) : 0));
                        let ratio = typeDef.splashRatio || 0.5;
                        if (t.type === 'missile' && isMax) { splashR *= 2; ratio = 1.0; }
                        for (const e of enemies) {
                            if (e === target || e.hp <= 0) continue;
                            const d = Math.hypot(e.x - target.x, e.y - target.y);
                            if (d > splashR) continue;
                            if (ENEMY_TYPES[e.type].stealth) {
                                const dt2 = Math.hypot(e.x - towerPx, e.y - towerPy);
                                if (!enemyVisibleFromTower(e, t, dt2)) continue;
                            }
                            damageEnemy(e, st.damage * ratio, t);
                        }
                    }
                    const colors = { gun: '#4a9eff', cannon: '#ff8c42', missile: '#c44aff', flak: '#4ad8ff' };
                    const widths = { gun: 2, cannon: 5, missile: 3, flak: 1.6 };
                    const beamLife = { gun: 0.08, cannon: 0.18, missile: 0.14, flak: 0.06 };
                    projectiles.push({
                        kind: 'beam', fromX: towerPx, fromY: towerPy,
                        toX: target.x, toY: target.y,
                        color: colors[t.type] || '#ffff00',
                        width: widths[t.type] || 2,
                        life: beamLife[t.type] || 0.1,
                        maxLife: beamLife[t.type] || 0.1
                    });
                    if (t.type === 'cannon' || t.type === 'missile' || t.type === 'flak') {
                        projectiles.push({
                            kind: 'boom', x: target.x, y: target.y,
                            radius: (t.type === 'missile' && isMax ? typeDef.splash * 2 : (typeDef.splash || typeDef.boom || 0.6)) * CELL * 0.85,
                            color: t.type === 'cannon' ? '#ffaa44' : (t.type === 'flak' ? '#4ad8ff' : '#ddaaff'),
                            life: 0.25, maxLife: 0.25
                        });
                        SFX.boom();
                    }
                    SFX.shoot(t.type);
                    t.cooldown = actualCooldown;
                }
            }
        }

        function updateProjectiles(dt) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                
                if (p.kind === 'missile') {
                    p.life -= dt;
                    
                    if (p.life <= 0) {
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    }
                    
                    if (p.target && p.target.hp > 0 && enemies.includes(p.target)) {
                        p.tx = p.target.x;
                        p.ty = p.target.y;
                    }
                    
                    const dx = p.tx - p.x;
                    const dy = p.ty - p.y;
                    const dist = Math.hypot(dx, dy);
                    const step = p.speed * dt;
                    
                    if (dist <= step) {
                        p.x = p.tx; p.y = p.ty;
                        explodeMissile(p);
                        projectiles.splice(i, 1);
                        continue;
                    } else {
                        p.x += (dx / dist) * step;
                        p.y += (dy / dist) * step;
                        p.angle = Math.atan2(dy, dx);
                    }
                    continue;
                }

                p.life -= dt;

    try {

            }
            closeTowerMenu();
            selectedTower = null;
            hideSellButton();
        });

        const soundBtn = document.getElementById('soundBtn');
        function updateSoundBtn(on) {
            soundBtn.textContent = on ? '🔊 音效' : '🔇 静音';
            soundBtn.classList.toggle('off', !on);
        }
        soundBtn.addEventListener('click', () => {
            const on = SFX.toggle();
            updateSoundBtn(on);
            if (on) SFX.click();
        });
        updateSoundBtn(SFX.isOn());

        function unlockAudio() {
            SFX.unlock();
            window.removeEventListener('pointerdown', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        }
        window.addEventListener('pointerdown', unlockAudio);
        window.addEventListener('keydown', unlockAudio);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                togglePause();
            }
            if (e.key === 'm' || e.key === 'M') {
                const on = SFX.toggle();
                updateSoundBtn(on);
                if (on) SFX.click();
            }
            if (e.key === 'n' || e.key === 'N') {
                callNextWave();
            }
        });
        // ============================================================
        // 触摸屏操作适配：点击 / 长按右键 / 拖动平移 / 双指缩放
        // ============================================================
        const IS_TOUCH_DEVICE = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);

        (function setupTouchControls() {
            if (!IS_TOUCH_DEVICE) return;

            const TAP_TOLERANCE   = 12;    // CSS px：移动超过这个距离即视为拖动
            const LONG_PRESS_MS   = 480;   // 长按多久等价于右键
            const HOVER_THROTTLE  = 70;    // hover 派发节流（ms）

            let state = 'idle';            // idle | tap | pan | scroll | pinch
            let startCX = 0, startCY = 0;
            let lastCX = 0, lastCY = 0;
            let longPressTimer = 0;
            let pinchStartDist = 0;
            let pinchStartZoom = 1;
            let lastHoverAt = 0;

            function toCanvas(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (clientX - rect.left) * (canvas.width / Math.max(1, rect.width)),
                    y: (clientY - rect.top) * (canvas.height / Math.max(1, rect.height))
                };
            }
            function canvasScale() {
                const rect = canvas.getBoundingClientRect();
                return canvas.width / Math.max(1, rect.width);
            }
            function emit(type, clientX, clientY, extra) {
                canvas.dispatchEvent(new MouseEvent(type, Object.assign({
                    bubbles: true, cancelable: true, view: window,
                    clientX: clientX, clientY: clientY,
                    button: 0, buttons: 1
                }, extra || {})));
            }
            function emitHover(clientX, clientY, force) {
                const now = performance.now();
                if (!force && now - lastHoverAt < HOVER_THROTTLE) return;
                lastHoverAt = now;
                const p = toCanvas(clientX, clientY);
                mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
                emit('mousemove', clientX, clientY);
            }
            function clearLongPress() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = 0; }
            }
            function isScrollableScreen() {
                return screen === 'levels' || screen === 'bestiary' ||
                       screen === 'towerdex' || screen === 'intro';
            }

            canvas.addEventListener('touchstart', function (e) {
                // 双指 → 捏合缩放
                if (e.touches.length >= 2) {
                    clearLongPress();
                    state = 'pinch';
                    const a = e.touches[0], b = e.touches[1];
                    pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
                    pinchStartZoom = zoom;
                    e.preventDefault();
                    return;
                }
                if (e.touches.length !== 1) return;

                const t = e.touches[0];
                state = 'tap';
                startCX = t.clientX; startCY = t.clientY;
                lastCX  = t.clientX; lastCY  = t.clientY;
                emitHover(t.clientX, t.clientY, true);

                // 长按 → 右键（打开塔菜单 / 取消建造）
                clearLongPress();
                const lx = t.clientX, ly = t.clientY;
                longPressTimer = setTimeout(function () {
                    longPressTimer = 0;
                    if (state !== 'tap') return;
                    state = 'idle';
                    emit('contextmenu', lx, ly, { button: 2, buttons: 2 });
                    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
                }, LONG_PRESS_MS);

                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchmove', function (e) {
                // 双指缩放
                if (e.touches.length >= 2 && state === 'pinch') {
                    const a = e.touches[0], b = e.touches[1];
                    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
                    const mid = toCanvas((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
                    if (screen === 'game') {
                        setGameZoom(pinchStartZoom * (d / pinchStartDist), mid.x, mid.y);
                    }
                    e.preventDefault();
                    return;
                }
                if (e.touches.length !== 1) return;

                const t = e.touches[0];

                if (state === 'tap') {
                    const moved = Math.hypot(t.clientX - startCX, t.clientY - startCY);
                    if (moved > TAP_TOLERANCE) {
                        clearLongPress();
                        if (screen === 'game')            state = 'pan';
                        else if (isScrollableScreen())    state = 'scroll';
                        else                              state = 'idle';
                        lastCX = t.clientX; lastCY = t.clientY;
                    } else {
                        emitHover(t.clientX, t.clientY, false);
                    }
                }

                if (state === 'pan') {
                    const k = canvasScale();
                    panMap((t.clientX - lastCX) * k, (t.clientY - lastCY) * k);
                    lastCX = t.clientX; lastCY = t.clientY;
                } else if (state === 'scroll') {
                    const k = canvasScale();
                    scrollY = Math.max(0, Math.min(maxScroll, scrollY + (lastCY - t.clientY) * k));
                    lastCX = t.clientX; lastCY = t.clientY;
                }
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchend', function (e) {
                clearLongPress();

                if (state === 'pinch') {
                    if (e.touches.length === 0) state = 'idle';
                    return;
                }
                if (e.touches.length > 0) return;   // 还有手指没抬起

                // 短按 → 合成一次完整的鼠标点击
                if (state === 'tap' && e.changedTouches.length) {
                    const t = e.changedTouches[0];
                    emitHover(t.clientX, t.clientY, true);
                    emit('mousedown', t.clientX, t.clientY);
                    emit('mouseup',   t.clientX, t.clientY);
                    emit('click',     t.clientX, t.clientY);
                }
                state = 'idle';
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchcancel', function () {
                clearLongPress();
                state = 'idle';
            });
        })();
        initEndlessUnlock();
        refreshSaveInfo();
        setScreen('menu');
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>

                case 'crystal': {
                    for (let i = 0; i < 3; i++) {
                        const px = cx + (i - 1) * s * 0.13;
                        const py = cy + s * 0.1;
                        const hh = s * (0.20 + h2 * 0.14) * (i === 1 ? 1.3 : 0.85);
                        const w0 = Math.max(1, s * 0.055);
                        g.beginPath();
                        g.moveTo(px, py - hh); g.lineTo(px + w0, py); g.lineTo(px - w0, py); g.closePath();
                        g.fillStyle = i === 1 ? P.light : P.mid;
                        g.fill();
                        g.strokeStyle = P.glow; g.lineWidth = Math.max(0.8, s * 0.018);
                        g.stroke();
                    }
                    const rgC = g.createRadialGradient(cx, cy, 0, cx, cy, s * 0.34);
                    rgC.addColorStop(0, P.glow);
                    rgC.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    g.globalAlpha = alpha * 0.4;
                    g.fillStyle = rgC;
                    g.beginPath(); g.arc(cx, cy, s * 0.34, 0, Math.PI * 2); g.fill();
                    g.globalAlpha = alpha;
                    break;
                }
                case 'shardPile': {
                    for (let i = 0; i < 4; i++) {
                        const px = cx + (i - 1.5) * s * 0.08;
                        const py = cy + s * (0.06 + (i % 2) * 0.05);
                        const w0 = Math.max(1, s * 0.035);
                        const hh = s * (0.07 + (i % 3) * 0.02 + h2 * 0.04);
                        g.beginPath();
                        g.moveTo(px, py - hh); g.lineTo(px + w0, py); g.lineTo(px - w0, py);
                        g.closePath();
                        g.fillStyle = P.mid; g.fill();
                        g.strokeStyle = 'rgba(0, 0, 0, 0.35)'; g.lineWidth = 0.8; g.stroke();
                    }
                    break;
                }
                case 'glowMoss': {
                    const r = s * (0.18 + h1 * 0.14);
                    const rgM = g.createRadialGradient(cx, cy, 0, cx, cy, r * 1.8);
                    rgM.addColorStop(0, P.glow);
                    rgM.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    g.globalAlpha = alpha * 0.45;
                    g.fillStyle = rgM;
                    g.beginPath(); g.arc(cx, cy, r * 1.8, 0, Math.PI * 2); g.fill();
                    g.globalAlpha = alpha;
                    g.fillStyle = P.mid;
                    g.beginPath(); g.ellipse(cx, cy, r * 0.82, r * 0.42, 0, 0, Math.PI * 2); g.fill();
                    g.fillStyle = P.light;
                    g.globalAlpha = alpha * 0.5;
                    g.beginPath(); g.ellipse(cx - r * 0.2, cy - r * 0.1, r * 0.34, r * 0.18, 0, 0, Math.PI * 2); g.fill();
                    g.globalAlpha = alpha;
                    break;
                }
                case 'pillar': {
                    const pw = s * (0.16 + h1 * 0.06);
                    const ph = s * (0.42 + h1 * 0.22);
                    const top = cy - ph * 0.55;
                    g.fillStyle = P.mid;
                    g.fillRect(cx - pw, top, pw * 2, ph);
                    g.fillStyle = P.dark;
                    g.fillRect(cx + pw * 0.2, top, pw * 1.8, ph);
                    g.globalAlpha = alpha * 0.55;
                    g.fillStyle = P.light;
                    g.fillRect(cx - pw, top + ph * 0.5, pw * 0.8, ph * 0.5);
                    g.globalAlpha = alpha;
                    g.fillStyle = P.light;
                    g.fillRect(cx - pw * 1.3, cy - ph * 0.85, pw * 2.6, ph * 0.12);
                    g.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    g.beginPath();
                    g.moveTo(cx - pw, top); g.lineTo(cx - pw * 0.2, top - ph * 0.08);
                    g.lineTo(cx + pw * 0.6, top + ph * 0.04); g.lineTo(cx + pw, top);
                    g.closePath(); g.fill();
                    break;
                }
                case 'rubble': {
                    for (let i = 0; i < 3; i++) {
                        const px = cx + (i - 1) * s * 0.14;
                        const py = cy + s * (0.04 + (i % 2) * 0.06);
                        const rr = s * (0.05 + h1 * 0.03 + i * 0.008);
                        g.fillStyle = i % 2 ? P.mid : P.dark;
                        g.beginPath();
                        g.moveTo(px - rr, py + rr * 0.6); g.lineTo(px - rr * 0.5, py - rr);
                        g.lineTo(px + rr * 0.9, py - rr * 0.4); g.lineTo(px + rr, py + rr * 0.6);
                        g.closePath(); g.fill();
                        g.strokeStyle = 'rgba(0, 0, 0, 0.35)'; g.lineWidth = 0.9; g.stroke();
                    }
                    break;
                }
                case 'root': {
                    g.strokeStyle = P.mid;
                    g.lineWidth = Math.max(1, s * 0.035);
                    g.lineCap = 'round';
                    for (let i = 0; i < 3; i++) {
                        const a = (i / 3) * Math.PI * 2 + h1 * 2;
                        const len = s * (0.16 + h2 * 0.14);
                        g.beginPath();
                        g.moveTo(cx, cy);
                        g.quadraticCurveTo(
                            cx + Math.cos(a) * len * 0.6, cy + Math.sin(a) * len * 0.6,
                            cx + Math.cos(a + 0.4) * len, cy + Math.sin(a + 0.4) * len * 0.8
                        );
                        g.stroke();
                    }
                    break;
                }
                default: break;
            }
            g.restore();
        }

        // 大尺度氛围：风格化的远景（陨石坑群 / 熔岩河流 / 冰裂 / 树冠阴影 / 星云）
        function drawStyleAmbience(g, w, h, ms) {
            g.save();
            if (ms.key === 'void') {
                for (let i = 0; i < 3; i++) {
                    const rg = g.createRadialGradient(
                        w * (0.2 + styleHash(i + 1, 3) * 0.6), h * (0.15 + styleHash(i + 4, 9) * 0.7), 0,
                        w * 0.5, h * 0.5, Math.max(w, h) * (0.25 + styleHash(i, 7) * 0.2)
                    );
                    rg.addColorStop(0, 'rgba(60, 120, 190, 0.06)');
                    rg.addColorStop(1, 'rgba(20, 50, 90, 0)');
                    g.fillStyle = rg;
                    g.fillRect(0, 0, w, h);
                }
            } else if (ms.key === 'moon') {
                // 三个大的陨石坑 + 一条横向月尘带
                for (let i = 0; i < 3; i++) {
                    const x = w * (0.15 + styleHash(i + 2, 5) * 0.7);
                    const y = h * (0.18 + styleHash(i + 6, 11) * 0.64);
                    const r = Math.max(w, h) * (0.07 + styleHash(i + 9, 13) * 0.09);
                    g.fillStyle = 'rgba(120, 126, 138, 0.20)';
                    g.beginPath(); g.ellipse(x, y, r, r * 0.7, 0, 0, Math.PI * 2); g.fill();
                    g.strokeStyle = 'rgba(240, 246, 255, 0.22)'; g.lineWidth = Math.max(2, r * 0.11);
                    g.beginPath(); g.ellipse(x, y, r * 0.97, r * 0.68, 0, Math.PI * 0.08, Math.PI * 0.98); g.stroke();
                    g.strokeStyle = 'rgba(60, 66, 78, 0.16)';
                    g.beginPath(); g.ellipse(x, y, r * 1.02, r * 0.73, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
                }
                const band = g.createLinearGradient(0, h * 0.35, 0, h * 0.75);
                band.addColorStop(0, 'rgba(255, 255, 255, 0.06)');
                band.addColorStop(1, 'rgba(255, 255, 255, 0)');
                g.fillStyle = band; g.fillRect(0, h * 0.35, w, h * 0.4);
            } else if (ms.key === 'lava') {
                // 熔岩河：粗的发光曲线 + 热池
                for (let i = 0; i < 2; i++) {
                    const y0 = h * (0.3 + i * 0.34 + styleHash(i, 3) * 0.1);
                    g.strokeStyle = 'rgba(255, 110, 40, 0.30)';
                    g.lineWidth = Math.max(6, h * 0.02);
                    g.shadowColor = 'rgba(255, 100, 30, 0.8)';
                    g.shadowBlur = Math.max(10, h * 0.03);
                    g.beginPath();
                    g.moveTo(-20, y0);
                    g.bezierCurveTo(w * 0.3, y0 - h * 0.12, w * 0.6, y0 + h * 0.14, w + 20, y0 - h * 0.05);
                    g.stroke();
                    g.shadowBlur = 0;
                    g.strokeStyle = 'rgba(255, 220, 160, 0.35)';
                    g.lineWidth = Math.max(2, h * 0.006);
                    g.stroke();
                }
                for (let i = 0; i < 3; i++) {
                    const x = w * (0.2 + styleHash(i + 5, 7) * 0.6), y = h * (0.25 + styleHash(i + 8, 12) * 0.5);
                    const r = Math.max(w, h) * (0.05 + styleHash(i, 15) * 0.05);
                    const rg = g.createRadialGradient(x, y, 0, x, y, r);
                    rg.addColorStop(0, 'rgba(255, 150, 60, 0.35)');
                    rg.addColorStop(1, 'rgba(255, 90, 30, 0)');
                    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
                }
            } else if (ms.key === 'ice') {
                // 冰盖楔形 + 放射状冰裂
                for (let i = 0; i < 4; i++) {
                    const x = w * (0.1 + styleHash(i + 3, 6) * 0.8), y = h * (0.1 + styleHash(i + 7, 10) * 0.8);
                    const r = Math.max(w, h) * (0.12 + styleHash(i, 14) * 0.1);
                    g.fillStyle = 'rgba(170, 230, 255, 0.07)';
                    g.beginPath();
                    g.moveTo(x - r, y + r * 0.4);
                    g.lineTo(x, y - r);
                    g.lineTo(x + r * 0.8, y + r * 0.6);
                    g.closePath(); g.fill();
                    g.strokeStyle = 'rgba(200, 240, 255, 0.16)'; g.lineWidth = Math.max(1.5, r * 0.03);
                    g.beginPath();
                    g.moveTo(x, y - r * 0.98); g.lineTo(x, y + r * 0.5);
                    g.stroke();
                }
            } else if (ms.key === 'forest') {
                // 顶部树冠阴影 + 光斑
                for (let i = 0; i < 4; i++) {
                    const x = w * (0.1 + styleHash(i + 4, 8) * 0.8), y = h * (0.05 + styleHash(i + 9, 12) * 0.25);
                    const r = Math.max(w, h) * (0.1 + styleHash(i, 5) * 0.08);
                    const rg = g.createRadialGradient(x, y, 0, x, y, r);
                    rg.addColorStop(0, 'rgba(10, 30, 18, 0.30)');
                    rg.addColorStop(1, 'rgba(10, 30, 18, 0)');
                    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
                }
                for (let i = 0; i < 2; i++) {
                    const x = w * (0.2 + styleHash(i + 11, 4) * 0.6);
                    g.fillStyle = 'rgba(180, 255, 200, 0.05)';
                    g.beginPath();
                    g.moveTo(x, h * 0.05);
                    g.lineTo(x + w * 0.18, h * 0.55);
                    g.lineTo(x + w * 0.34, h * 0.55);
                    g.lineTo(x + w * 0.1, h * 0.05);
                    g.closePath(); g.fill();
                }
            } else if (ms.key === 'desert') {
                // 沙丘起伏：多层弧线 + 顶部热浪
                for (let i = 0; i < 3; i++) {
                    const y0 = h * (0.22 + i * 0.26);
                    g.fillStyle = i % 2 ? 'rgba(255, 226, 175, 0.05)' : 'rgba(50, 34, 16, 0.10)';
                    g.beginPath();
                    g.moveTo(0, y0);
                    g.bezierCurveTo(w * 0.3, y0 - h * 0.07, w * 0.7, y0 + h * 0.08, w, y0 - h * 0.02);
                    g.lineTo(w, y0 + h * 0.18);
                    g.bezierCurveTo(w * 0.7, y0 + h * 0.26, w * 0.3, y0 + h * 0.13, 0, y0 + h * 0.2);
                    g.closePath(); g.fill();
                }
                const hz = g.createLinearGradient(0, 0, 0, h * 0.3);
                hz.addColorStop(0, 'rgba(255, 220, 160, 0.10)');
                hz.addColorStop(1, 'rgba(255, 220, 160, 0)');
                g.fillStyle = hz; g.fillRect(0, 0, w, h * 0.3);
            } else if (ms.key === 'crystal') {
                // 洞顶垂下的晶簇剪影 + 荧光斑
                for (let i = 0; i < 4; i++) {
                    const x = w * (0.1 + styleHash(i + 2, 6) * 0.8);
                    const len = h * (0.12 + styleHash(i + 5, 9) * 0.14);
                    g.fillStyle = 'rgba(90, 60, 140, 0.16)';
                    g.beginPath();
                    g.moveTo(x, 0); g.lineTo(x + len * 0.4, 0);
                    g.lineTo(x + len * 0.1, len); g.closePath(); g.fill();
                }
                for (let i = 0; i < 3; i++) {
                    const x = w * (0.15 + styleHash(i + 8, 4) * 0.7), y = h * (0.2 + styleHash(i + 3, 12) * 0.6);
                    const r = Math.max(w, h) * (0.06 + styleHash(i, 17) * 0.05);
                    const rg = g.createRadialGradient(x, y, 0, x, y, r);
                    rg.addColorStop(0, 'rgba(190, 140, 255, 0.22)');
                    rg.addColorStop(1, 'rgba(150, 100, 230, 0)');
                    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
                }
            } else if (ms.key === 'ruins') {
                // 斜射的柱影 + 地面裂缝
                for (let i = 0; i < 4; i++) {
                    const x = w * (0.1 + styleHash(i + 6, 7) * 0.8);
                    g.fillStyle = 'rgba(16, 14, 11, 0.16)';
                    g.beginPath();
                    g.moveTo(x, 0); g.lineTo(x + w * 0.05, 0);
                    g.lineTo(x + w * 0.17, h); g.lineTo(x + w * 0.12, h);
                    g.closePath(); g.fill();
                }
                for (let i = 0; i < 3; i++) {
                    const x = w * (0.15 + styleHash(i + 4, 11) * 0.7), y = h * (0.2 + styleHash(i + 9, 3) * 0.6);
                    g.strokeStyle = 'rgba(20, 18, 14, 0.22)'; g.lineWidth = Math.max(1.5, w * 0.004);
                    g.beginPath();
                    g.moveTo(x, y);
                    g.lineTo(x + w * (0.08 + styleHash(i, 5) * 0.12), y + h * 0.10);
                    g.lineTo(x + w * 0.06, y + h * 0.20);
                    g.stroke();
                }
            }
            // 统一的光照纵深：左上受光、右下压暗，避免整张地图一片平灰
            const lit = g.createLinearGradient(0, 0, w, h);
            lit.addColorStop(0, 'rgba(255, 255, 255, 0.10)');
            lit.addColorStop(0.55, 'rgba(255, 255, 255, 0.02)');
            lit.addColorStop(1, 'rgba(0, 0, 0, 0.16)');
            g.fillStyle = lit;
            g.fillRect(0, 0, w, h);
            g.restore();
        }

        // 逐格随机风景（不压在墙体/路径中心，避免干扰判断）
        function drawMapScenery(g, ms) {
            const acc = ms.accent;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (wallGrid[r] && wallGrid[r][c]) continue;
                    if (noBuildGrid[r] && noBuildGrid[r][c]) continue;
                    if (straightGrid[r] && straightGrid[r][c]) continue;
                    if (bases.some(b => b.c === c && b.r === r)) continue;
                    if (starts.some(s => s.c === c && s.r === r)) continue;
                    if (exits.some(e => e.c === c && e.r === r)) continue;
                    const hA = styleHash(c * 7 + 1, r * 13 + 2);
                    if (hA > ms.density) continue;
                    const kinds = ms.deco;
                    const kind = kinds[Math.floor(styleHash(c * 17 + 3, r * 19 + 5) * kinds.length) % kinds.length];
                    const h1 = styleHash(c * 23 + 11, r * 29 + 7);
                    const h2 = styleHash(c * 31 + 4, r * 37 + 9);
                    // 贴边放置：靠近格子四角，中心留给建造加号
                    const sideX = (h1 > 0.5 ? 1 : -1), sideY = (h2 > 0.5 ? 1 : -1);
                    const cx = c * CELL + CELL / 2 + sideX * CELL * (0.16 + h2 * 0.14);
                    const cy = r * CELL + CELL / 2 + sideY * CELL * (0.14 + h1 * 0.16);
                    const sz = CELL * (0.72 + h1 * 0.42);
                    drawMapDeco(g, kind, cx, cy, sz, h1, h2, ms.decoPal, 0.85);
                }
            }
            // 轻微暗角，让整张图更像一个完整场景
            const vg = g.createRadialGradient(
                COLS * CELL / 2, ROWS * CELL / 2, Math.min(COLS * CELL, ROWS * CELL) * 0.35,
                COLS * CELL / 2, ROWS * CELL / 2, Math.max(COLS * CELL, ROWS * CELL) * 0.78
            );
            vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vg.addColorStop(1, `rgba(0, 0, 0, ${MAP_STYLE_VIGNETTE[ms.key] || 0.28})`);
            g.fillStyle = vg;
            g.fillRect(0, 0, COLS * CELL, ROWS * CELL);
        }

        function rebuildBackground() {
            const ms = currentMapStyle();
            const gridW = COLS * CELL, gridH = ROWS * CELL;
            bgCanvas = document.createElement('canvas');
            bgCanvas.width = Math.max(1, gridW);
            bgCanvas.height = Math.max(1, gridH);
            const g = bgCanvas.getContext('2d');

            // 1. 基础地板：渐变底 + 逐格噪点 + 网格线（与缩略图共用 paintFloorBase）
            paintFloorBase(g, COLS, ROWS, CELL, 0, 0, ms);

            // 1.5 风格远景 + 逐格随机风景（压在标记与墙体下面，不影响判读）
            drawStyleAmbience(g, gridW, gridH, ms);
            drawMapScenery(g, ms);

            // 2. 可建造空地：中心加号标记（与 X 炮台墙的加号呼应，但更淡）
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (wallGrid[r][c]) continue;
                    if (noBuildGrid[r] && noBuildGrid[r][c]) continue;
                    if (bases.some(b => b.c === c && b.r === r)) continue;
                    if (starts.some(s => s.c === c && s.r === r)) continue;
                    if (exits.some(ex => ex.c === c && ex.r === r)) continue;
                    drawBuildableFloorMark(g, c * CELL, r * CELL, CELL, ms);
                }
            }

            // 3. 禁止建造但可通行的地板（'.'）
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(noBuildGrid[r] && noBuildGrid[r][c])) continue;
                    if (straightGrid[r] && straightGrid[r][c]) continue;
                    drawNoBuildFloor(g, c * CELL, r * CELL, CELL, c, r, tileNoiseHash, ms);
                }
            }

            // 3.5 十字路口 +：可通行、不可建造、只能直行
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!(straightGrid[r] && straightGrid[r][c])) continue;
                    drawCrossJunction(g, c * CELL, r * CELL, CELL, ms);
                }
            }

            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!wallGrid[r][c]) continue;
                    const x = c * CELL, y = r * CELL;
                    if (buildableWall[r][c]) drawArmorWall(g, x, y, CELL, c, r, tileNoiseHash, ms);
                    else drawRockWall(g, x, y, CELL, c, r, tileNoiseHash, ms);
                }
            }

            g.strokeStyle = ms.border;
            g.lineWidth = 2;
            g.strokeRect(0.5, 0.5, gridW - 1, gridH - 1);
        }

        // 确定性噪声：让同一格在任意缩放下纹理一致
        function tileNoiseHash(x, y) {
            let h = (x | 0) * 374761393 + (y | 0) * 668265263;
            h = (h ^ (h >> 13)) * 1274126177;
            h = h ^ (h >> 16);
            return ((h >>> 0) % 10000) / 10000;
        }

        // 基础地板：渐变底 + 逐格噪点 + 网格线（游戏内与缩略图共用）
        function paintFloorBase(g, cols, rows, cell, offX, offY, msArg) {
            const ms = msArg || currentMapStyle();
            const gridW = cols * cell, gridH = rows * cell;

            const floorGrad = g.createLinearGradient(offX, offY, offX + gridW, offY + gridH);
            floorGrad.addColorStop(0, ms.floor[0]);
            floorGrad.addColorStop(0.5, ms.floor[1]);
            floorGrad.addColorStop(1, ms.floor[2]);
            g.fillStyle = floorGrad;
            g.fillRect(offX, offY, gridW, gridH);

            // 小尺寸（缩略图）时省略噪点，避免糊成一片
            const detail = cell >= 10;
            const tr = ms.tile[0], tg = ms.tile[1], tb = ms.tile[2];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = offX + c * cell, y = offY + r * cell;
                    const base = tileNoiseHash(c * 7 + 1, r * 13 + 2);
                    const tone = base * 0.5 + 0.5;
                    const k = 0.94 + tone * 0.12;
                    g.fillStyle = `rgba(${Math.round(tr * k)}, ${Math.round(tg * k)}, ${Math.round(tb * k)}, ${ms.tileA})`;
                    g.fillRect(x, y, cell, cell);
                    if (!detail) continue;
                    const dotCount = 2 + Math.floor(base * 3);
                    for (let k2 = 0; k2 < dotCount; k2++) {
                        const h1 = tileNoiseHash(c * 11 + k2 * 3, r * 17 + k2 * 7);
                        const h2 = tileNoiseHash(c * 23 + k2 * 5, r * 29 + k2 * 11);
                        const dx = h1 * (cell - 2) + 1;
                        const dy = h2 * (cell - 2) + 1;
                        const sz = 1 + h2 * 1.2;
                        const bright = h1 > 0.5;
                        const col = bright ? ms.dotL : ms.dotD;
                        g.fillStyle = bright
                            ? `rgba(${col[0]}, ${col[1]}, ${col[2]}, ${0.03 + h1 * 0.04})`
                            : `rgba(0, 0, 0, ${0.13 + h2 * 0.12})`;
                        g.fillRect(x + dx, y + dy, sz, sz);
                    }
                }
            }

            if (cell >= 8) {
                g.strokeStyle = ms.grid;
                g.lineWidth = 1;
                for (let i = 1; i < cols; i++) {
                    g.beginPath(); g.moveTo(offX + i * cell + 0.5, offY); g.lineTo(offX + i * cell + 0.5, offY + gridH); g.stroke();
                }
                for (let i = 1; i < rows; i++) {
                    g.beginPath(); g.moveTo(offX, offY + i * cell + 0.5); g.lineTo(offX + gridW, offY + i * cell + 0.5); g.stroke();
                }
            }
        }

        // 可建造空地的中心加号标记（与 X 炮台墙的加号呼应，但更淡）
        function drawBuildableFloorMark(g, x, y, size, msArg) {
            const ms = msArg || currentMapStyle();
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.14);
            g.save();
            // 淡色外圈
            g.strokeStyle = ms.markRing;
            g.lineWidth = Math.max(1, size * 0.018);
            g.beginPath(); g.arc(cx, cy, sz * 1.55, 0, Math.PI * 2); g.stroke();
            // 加号
            g.strokeStyle = ms.markPlus;
            g.lineWidth = Math.max(1, size * 0.024);
            g.lineCap = 'round';
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            // 中心小点
            g.fillStyle = ms.markDot;
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
            g.restore();
        }

        function drawCrossJunction(g, x, y, size, msArg) {
            const ms = msArg || currentMapStyle();
            const cx = x + size / 2, cy = y + size / 2;
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;

            // 与普通地板一致的地板底（跟 drawNoBuildFloor 同款渐变）
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, ms.path[0]);
            grad.addColorStop(0.5, ms.path[1]);
            grad.addColorStop(1, ms.path[2]);
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);

            // 四个方向的淡蓝色箭头
            const small = size < 18;                 // 缩略图等小尺寸下省略箭杆，只留三角头
            const armLen = size * 0.32;              // 中心到箭尖
            const headLen = size * (small ? 0.16 : 0.13);
            const headW  = size * (small ? 0.16 : 0.11);
            const shaftW = Math.max(1, size * 0.05);
            const gap    = size * 0.05;              // 中心留空

            g.save();
            g.fillStyle = ms.arrow;
            for (let dir = 0; dir < 4; dir++) {
                const ang = dir * Math.PI / 2 - Math.PI / 2;   // 上、右、下、左
                const ux = Math.cos(ang), uy = Math.sin(ang);
                const px = -uy, py = ux;

                const tipX = cx + ux * armLen,  tipY = cy + uy * armLen;
                const baseX = cx + ux * (armLen - headLen), baseY = cy + uy * (armLen - headLen);

                // 三角箭头
                g.beginPath();
                g.moveTo(tipX, tipY);
                g.lineTo(baseX + px * headW, baseY + py * headW);
                g.lineTo(baseX - px * headW, baseY - py * headW);
                g.closePath();
                g.fill();

                // 箭杆（小尺寸省略）
                if (!small) {
                    const sx = cx + ux * gap, sy = cy + uy * gap;
                    g.beginPath();
                    g.moveTo(sx + px * shaftW / 2, sy + py * shaftW / 2);
                    g.lineTo(baseX + px * shaftW / 2, baseY + py * shaftW / 2);
                    g.lineTo(baseX - px * shaftW / 2, baseY - py * shaftW / 2);
                    g.lineTo(sx - px * shaftW / 2, sy - py * shaftW / 2);
                    g.closePath();
                    g.fill();
                }
            }
            g.restore();
        }
        // 可通行但禁止建造的地板渲染
        function drawNoBuildFloor(g, x, y, size, c, r, hash, msArg) {
            const ms = msArg || currentMapStyle();
            const pad = Math.max(1, size * 0.04);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, ms.path[0]);
            grad.addColorStop(0.5, ms.path[1]);
            grad.addColorStop(1, ms.path[2]);
            g.fillStyle = grad;
            g.fillRect(bx, by, bw, bh);
        }

        // 不可通行的岩体/墙体：几何形态随风格变化（不是只换颜色）
        function drawRockWall(g, x, y, size, c, r, hash, msArg) {
            const ms = msArg || currentMapStyle();
            const pad = Math.max(1, size * 0.03);
            const bx = x + pad, by = y + pad, bw = size - pad * 2, bh = size - pad * 2;
            const grad = g.createLinearGradient(bx, by, bx, by + bh);
            grad.addColorStop(0, ms.rock[0]); grad.addColorStop(1, ms.rock[1]);
            g.fillStyle = grad; g.fillRect(bx, by, bw, bh);
            const shape = ms.wall || 'block';
            const h1 = hash(c * 11 + 3, r * 17 + 9);
            const h2 = hash(c * 7 + 13, r * 23 + 1);
            const h3 = hash(c * 29 + 5, r * 31 + 11);

            if (shape === 'plate') {
                // 金属拼板：斜切受光边 + 内框 + 通风槽 + 四角铆钉
                const bev = Math.max(1.5, size * 0.055);
                g.fillStyle = 'rgba(255, 255, 255, 0.07)';
                g.beginPath();
                g.moveTo(bx, by + bh); g.lineTo(bx, by); g.lineTo(bx + bw, by);
                g.lineTo(bx + bw - bev, by + bev); g.lineTo(bx + bev, by + bev);
                g.lineTo(bx + bev, by + bh - bev); g.closePath();
                g.fill();
                const ins = Math.max(2, size * 0.09);
                g.strokeStyle = 'rgba(0, 0, 0, 0.55)'; g.lineWidth = 1;
                g.strokeRect(bx + ins, by + ins, bw - ins * 2, bh - ins * 2);
                g.strokeStyle = ms.rockHi;
                g.beginPath();
                g.moveTo(bx + ins, by + ins + 0.5); g.lineTo(bx + bw - ins, by + ins + 0.5);
                g.stroke();
                // 通风槽（右下）
                g.strokeStyle = 'rgba(0, 0, 0, 0.45)';
                g.lineWidth = Math.max(1, size * 0.02);
                const vw = bw * 0.4, vx = bx + bw - ins - vw - size * 0.02, vy = by + bh - ins - size * 0.035;
                for (let i = 0; i < 3; i++) {
                    g.beginPath();
                    g.moveTo(vx, vy - i * size * 0.055); g.lineTo(vx + vw, vy - i * size * 0.055);
                    g.stroke();
                }
                const rr = Math.max(1, size * 0.026);
                const dots = [[bx + ins * 0.62, by + ins * 0.62], [bx + bw - ins * 0.62, by + ins * 0.62],
                              [bx + ins * 0.62, by + bh - ins * 0.62], [bx + bw - ins * 0.62, by + bh - ins * 0.62]];
                for (const [dx, dy] of dots) {
                    g.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    g.beginPath(); g.arc(dx, dy, rr, 0, Math.PI * 2); g.fill();
                    g.fillStyle = ms.rockHi;
                    g.beginPath(); g.arc(dx - rr * 0.25, dy - rr * 0.25, rr * 0.65, 0, Math.PI * 2); g.fill();
                }
            } else if (shape === 'blob') {
                // 月壤岩块：三块圆钝石头叠放，只有柔和的高光边
                const stones = [
                    [bx + bw * (0.26 + h1 * 0.16), by + bh * (0.32 + h2 * 0.16), bw * (0.28 + h3 * 0.12)],
                    [bx + bw * (0.64 + h2 * 0.18), by + bh * (0.26 + h3 * 0.16), bw * (0.22 + h1 * 0.12)],
                    [bx + bw * (0.36 + h3 * 0.22), by + bh * (0.64 + h1 * 0.22), bw * (0.24 + h2 * 0.16)]
                ];
                for (const [sx, sy, sr] of stones) {
                    const rg = g.createRadialGradient(sx - sr * 0.4, sy - sr * 0.5, sr * 0.1, sx, sy, sr);
                    rg.addColorStop(0, ms.rock[0]);
                    rg.addColorStop(0.72, ms.rock[1]);
                    rg.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                    g.fillStyle = rg;
                    g.beginPath(); g.ellipse(sx, sy, sr, sr * 0.86, h1 * 0.5, 0, Math.PI * 2); g.fill();
                    g.strokeStyle = ms.rockHi;
                    g.lineWidth = Math.max(1, size * 0.014);
                    g.beginPath(); g.ellipse(sx, sy, sr * 0.88, sr * 0.74, h1 * 0.5, Math.PI * 1.06, Math.PI * 1.74); g.stroke();
                }
            } else if (shape === 'jagged') {
                // 玄武岩碎块：尖角多边形 + 熔缝亮边
                for (let i = 0; i < 3; i++) {
                    const cx0 = bx + bw * (0.24 + i * 0.28 + hash(c * 5 + i, r * 9 + i) * 0.1);
                    const cy0 = by + bh * (0.30 + hash(c * 3 + i * 4, r * 7 + i) * 0.42);
                    const rad = bw * (0.20 + hash(c * 9 + i, r * 5 + i * 2) * 0.10);
                    g.beginPath();
                    for (let k = 0; k < 5; k++) {
                        const ang = (k / 5) * Math.PI * 2 + h2 * 3;
                        const rr2 = rad * (0.66 + hash(c * 3 + i * 7, r * 11 + k) * 0.5);
                        const px = cx0 + Math.cos(ang) * rr2, py = cy0 + Math.sin(ang) * rr2 * 0.92;
                        if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
                    }
                    g.closePath();
                    g.fillStyle = i === 0 ? ms.rock[0] : ms.rock[1];
                    g.fill();
                    g.strokeStyle = i === 0 ? ms.rockHi : 'rgba(255, 120, 50, 0.35)';
                    g.lineWidth = Math.max(1, size * 0.016);
                    g.stroke();
                }
            } else if (shape === 'facet') {
                // 冰棱：一块实心冰岩底 + 两根几何棱柱，带中棱高光
                // 底：带棱角的冰岩块，先保证墙体在深色地面上是"实心"的
                g.beginPath();
                for (let k = 0; k < 6; k++) {
                    const ang = (k / 6) * Math.PI * 2 + h2 * 1.6;
                    const rr = bw * (0.48 + hash(c * 6 + k, r * 8 + k) * 0.10);
                    const px = bx + bw * 0.5 + Math.cos(ang) * rr;
                    const py = by + bh * 0.54 + Math.sin(ang) * rr * 0.82;
                    if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
                }
                g.closePath();
                g.fillStyle = ms.rock[1];
                g.fill();
                g.strokeStyle = 'rgba(0, 8, 14, 0.6)'; g.lineWidth = Math.max(1, size * 0.02);
                g.stroke();
                const prism = (px, py, w0, hh, hi) => {
                    g.beginPath();
                    g.moveTo(px, py - hh);
                    g.lineTo(px + w0, py - hh * 0.24);
                    g.lineTo(px + w0 * 0.66, py + hh);
                    g.lineTo(px - w0 * 0.66, py + hh);
                    g.lineTo(px - w0, py - hh * 0.24);
                    g.closePath();
                    const lg = g.createLinearGradient(px - w0, py - hh, px + w0, py + hh);
                    lg.addColorStop(0, ms.rock[0]);
                    lg.addColorStop(0.55, ms.rock[1]);
                    lg.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
                    g.fillStyle = lg; g.fill();
                    g.strokeStyle = ms.rockHi; g.lineWidth = Math.max(1, size * 0.014);
                    g.stroke();
                    g.strokeStyle = hi || 'rgba(255, 255, 255, 0.22)';
                    g.beginPath(); g.moveTo(px, py - hh); g.lineTo(px, py + hh); g.stroke();
                };
                prism(bx + bw * (0.44 + h1 * 0.08), by + bh * 0.58, bw * 0.26, bh * 0.40);
                prism(bx + bw * (0.76 - h2 * 0.05), by + bh * 0.70, bw * 0.16, bh * 0.24);
            } else if (shape === 'prism') {
                // 水晶洞：深色晶岩底 + 三根发光晶柱 + 中心荧光
                g.fillStyle = ms.rock[1];
                g.beginPath();
                for (let k = 0; k < 7; k++) {
                    const ang = (k / 7) * Math.PI * 2 + h1 * 2;
                    const rr = bw * (0.40 + hash(c * 2 + k, r * 3 + k) * 0.16);
                    const px = bx + bw * 0.5 + Math.cos(ang) * rr;
                    const py = by + bh * 0.64 + Math.sin(ang) * rr * 0.60;
                    if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
                }
                g.closePath(); g.fill();
                g.strokeStyle = 'rgba(0, 0, 0, 0.55)'; g.lineWidth = 1; g.stroke();
                for (let i = 0; i < 3; i++) {
                    const px = bx + bw * (0.22 + i * 0.28 + (hash(c * 4 + i, r * 6 + i) - 0.5) * 0.10);
                    const py = by + bh * (0.56 + hash(c * 8 + i, r * 2 + i) * 0.22);
                    const w0 = bw * (0.09 + hash(c * 3 + i, r * 5 + i) * 0.06);
                    const hh = bh * (0.26 + hash(c * 6 + i, r * 7 + i) * 0.30);
                    g.beginPath();
                    g.moveTo(px, py - hh);
                    g.lineTo(px + w0, py - hh * 0.28);
                    g.lineTo(px + w0 * 0.5, py + hh * 0.18);
                    g.lineTo(px - w0 * 0.5, py + hh * 0.18);
                    g.lineTo(px - w0, py - hh * 0.28);
                    g.closePath();
                    const lg = g.createLinearGradient(px - w0, py - hh, px + w0, py);
                    lg.addColorStop(0, ms.decoPal.light);
                    lg.addColorStop(0.45, ms.rock[0]);
                    lg.addColorStop(1, ms.rock[1]);
                    g.fillStyle = lg; g.fill();
                    g.strokeStyle = ms.rockHi; g.lineWidth = Math.max(1, size * 0.012);
                    g.stroke();
                }
                const rg2 = g.createRadialGradient(bx + bw * 0.5, by + bh * 0.55, 0, bx + bw * 0.5, by + bh * 0.55, bw * 0.55);
                rg2.addColorStop(0, ms.decoPal.glow);
                rg2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                g.globalAlpha = 0.32;
                g.fillStyle = rg2; g.fillRect(bx, by, bw, bh);
                g.globalAlpha = 1;
            } else if (shape === 'cobble') {
                // 林地卵石：圆钝石块 + 顶部苔色
                const stones = [
                    [bx + bw * (0.34 + h1 * 0.08), by + bh * 0.44, bw * 0.31],
                    [bx + bw * (0.74 - h2 * 0.06), by + bh * 0.68, bw * 0.24]
                ];
                for (const [sx, sy, sr] of stones) {
                    const rg = g.createRadialGradient(sx - sr * 0.35, sy - sr * 0.45, sr * 0.1, sx, sy, sr);
                    rg.addColorStop(0, ms.rock[0]);
                    rg.addColorStop(1, ms.rock[1]);
                    g.fillStyle = rg;
                    g.beginPath(); g.ellipse(sx, sy, sr, sr * 0.82, 0, 0, Math.PI * 2); g.fill();
                    g.strokeStyle = 'rgba(0, 0, 0, 0.45)'; g.lineWidth = 1;
                    g.beginPath(); g.ellipse(sx, sy, sr, sr * 0.82, 0, Math.PI * 0.15, Math.PI * 0.95); g.stroke();
                    if (h3 > 0.3) {
                        g.fillStyle = ms.decoPal.mid;
                        g.beginPath(); g.ellipse(sx - sr * 0.15, sy - sr * 0.52, sr * 0.62, sr * 0.22, -0.18, 0, Math.PI * 2); g.fill();
                    }
                }
            } else if (shape === 'sand') {
                // 风蚀砂岩：横向层理 + 崩落缺角
                for (let i = 0; i < 3; i++) {
                    g.fillStyle = i % 2 === 0 ? 'rgba(255, 226, 175, 0.10)' : 'rgba(50, 34, 16, 0.18)';
                    g.fillRect(bx, by + bh * (i / 3), bw, bh / 3);
                }
                g.strokeStyle = 'rgba(0, 0, 0, 0.34)'; g.lineWidth = 1;
                for (let i = 1; i < 3; i++) {
                    const y0 = by + bh * (i / 3);
                    g.beginPath();
                    g.moveTo(bx, y0 + (i % 2 ? 0.8 : -0.8) * size * 0.02);
                    g.bezierCurveTo(bx + bw * 0.3, y0 + size * 0.03, bx + bw * 0.7, y0 - size * 0.03, bx + bw, y0);
                    g.stroke();
                }
                g.fillStyle = 'rgba(0, 0, 0, 0.28)';
                g.beginPath();
                g.moveTo(bx + bw * (0.70 + h1 * 0.12), by);
                g.lineTo(bx + bw, by + bh * (0.22 + h2 * 0.12));
                g.lineTo(bx + bw, by);
                g.closePath(); g.fill();
                g.strokeStyle = ms.rockHi;
                g.beginPath(); g.moveTo(bx, by + 0.5); g.lineTo(bx + bw, by + 0.5); g.stroke();
            } else if (shape === 'ruin') {
                // 遗迹砌块：错缝方石 + 裂纹
                for (let i = 0; i < 2; i++) {
                    for (let j = 0; j < 2; j++) {
                        const hh = hash(c * 17 + j * 5, r * 13 + i * 3);
                        const xx = bx + j * bw / 2, yy = by + i * bh / 2;
                        g.fillStyle = hh > 0.55 ? 'rgba(255, 245, 220, 0.10)' : 'rgba(0, 0, 0, 0.18)';
                        g.fillRect(xx + 1, yy + 1, bw / 2 - 2, bh / 2 - 2);
                        g.strokeStyle = 'rgba(0, 0, 0, 0.45)'; g.lineWidth = 1;
                        g.strokeRect(xx + 0.5, yy + 0.5, bw / 2 - 1, bh / 2 - 1);
                    }
                }
                g.strokeStyle = 'rgba(0, 0, 0, 0.4)'; g.lineWidth = Math.max(1, size * 0.012);
                g.beginPath();
                g.moveTo(bx + bw * (0.2 + h1 * 0.2), by + bh * 0.1);
                g.lineTo(bx + bw * (0.45 + h2 * 0.1), by + bh * 0.55);
                g.lineTo(bx + bw * (0.34 + h3 * 0.2), by + bh * 0.94);
                g.stroke();
                g.strokeStyle = ms.rockHi;
                g.beginPath(); g.moveTo(bx, by + 0.5); g.lineTo(bx + bw, by + 0.5); g.stroke();
            } else {
                // 方块砌石（2×2 砖 + 灰缝 + 顶边高光）
                const rows = 2, cols = 2;
                const bh2 = bh / rows, bw2 = bw / cols;
                for (let i = 0; i < rows; i++) {
                    for (let j = 0; j < cols; j++) {
                        const hh = hash(c * 13 + j * 7, r * 11 + i * 5);
                        const xx = bx + j * bw2, yy = by + i * bh2;
                        g.fillStyle = hh > 0.5
                            ? `rgba(255,255,255,${0.03 + hh * 0.05})`
                            : `rgba(0,0,0,${0.10 + (1 - hh) * 0.15})`;
                        g.fillRect(xx, yy, bw2 + 0.5, bh2 + 0.5);
                    }
                }
                g.strokeStyle = ms.rockMortar;
                g.lineWidth = Math.max(1, size * 0.035);
                g.beginPath(); g.moveTo(bx, by + bh2); g.lineTo(bx + bw, by + bh2); g.stroke();
                g.beginPath(); g.moveTo(bx + bw2, by); g.lineTo(bx + bw2, by + bh); g.stroke();
                g.strokeStyle = ms.rockHi;
                g.lineWidth = 1;
                g.beginPath(); g.moveTo(bx, by + 0.5); g.lineTo(bx + bw, by + 0.5); g.stroke();
            }
        }

        function drawArmorWall(g, x, y, size, c, r, hash, msArg) {
            const ms = msArg || currentMapStyle();
            const pad = Math.max(1.5, size * 0.04);
            const radius = Math.min(Math.max(2, size * 0.08), Math.max(0.5, (size - pad * 2) / 2));
            g.save();
            g.shadowColor = 'rgba(0, 0, 0, 0.7)';
            g.shadowBlur = Math.max(2, size * 0.1);
            g.shadowOffsetY = Math.max(1, size * 0.05);
            const grad = g.createLinearGradient(x, y, x, y + size);
            grad.addColorStop(0, ms.armor[0]);
            grad.addColorStop(0.5, ms.armor[1]);
            grad.addColorStop(1, ms.armor[2]);
            g.fillStyle = grad;
            roundRect(g, x + pad, y + pad, size - pad * 2, size - pad * 2, radius);
            g.fill();
            g.restore();
            g.strokeStyle = ms.armorRim;
            g.lineWidth = 1;
            g.beginPath();
            g.moveTo(x + pad + radius, y + pad + 0.5);
            g.lineTo(x + size - pad - radius, y + pad + 0.5);
            g.moveTo(x + pad + 0.5, y + pad + radius);
            g.lineTo(x + pad + 0.5, y + size - pad - radius);
            g.stroke();
            g.strokeStyle = 'rgba(0, 0, 0, 0.65)';
            g.beginPath();
            g.moveTo(x + size - pad - 0.5, y + pad + radius);
            g.lineTo(x + size - pad - 0.5, y + size - pad - radius);
            g.moveTo(x + size - pad - radius, y + size - pad - 0.5);
            g.lineTo(x + pad + radius, y + size - pad - 0.5);
            g.stroke();
            const inset = Math.max(3, size * 0.12);
            const ix = x + inset, iy = y + inset, iw = size - inset * 2, ih = size - inset * 2;
            const innerGrad = g.createLinearGradient(ix, iy, ix, iy + ih);
            innerGrad.addColorStop(0, ms.armorInner[0]);
            innerGrad.addColorStop(0.5, ms.armorInner[1]);
            innerGrad.addColorStop(1, ms.armorInner[2]);
            g.fillStyle = innerGrad;
            roundRect(g, ix, iy, iw, ih, Math.max(1, radius - 1)); g.fill();
            g.strokeStyle = 'rgba(0, 0, 0, 0.7)'; g.lineWidth = 1;
            g.beginPath();
            g.moveTo(ix + 1, iy + 0.5); g.lineTo(ix + iw - 1, iy + 0.5);
            g.moveTo(ix + 0.5, iy + 1); g.lineTo(ix + 0.5, iy + ih - 1);
            g.stroke();
            g.strokeStyle = ms.armorRim2;
            g.beginPath();
            g.moveTo(ix + iw - 1, iy + ih - 0.5); g.lineTo(ix + 1, iy + ih - 0.5);
            g.moveTo(ix + iw - 0.5, iy + ih - 1); g.lineTo(ix + iw - 0.5, iy + 1);
            g.stroke();
            if (size >= 26) {
                const ro = size * 0.15;
                const rr = Math.max(1, size * 0.035);
                const corners = [
                    [x + ro, y + ro], [x + size - ro, y + ro],
                    [x + ro, y + size - ro], [x + size - ro, y + size - ro]
                ];
                for (const [rx, ry] of corners) {
                    g.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    g.beginPath(); g.arc(rx + 0.6, ry + 0.6, rr, 0, Math.PI * 2); g.fill();
                    const rgrad = g.createRadialGradient(rx - rr * 0.3, ry - rr * 0.3, 0, rx, ry, rr);
                    rgrad.addColorStop(0, ms.rivet[0]);
                    rgrad.addColorStop(0.6, ms.rivet[1]);
                    rgrad.addColorStop(1, ms.rivet[2]);
                    g.fillStyle = rgrad;
                    g.beginPath(); g.arc(rx, ry, rr, 0, Math.PI * 2); g.fill();
                }
            }
            const cx = x + size / 2, cy = y + size / 2;
            const sz = Math.max(2, size * 0.16);
            g.save();
            g.shadowColor = ms.armorGlow;
            g.shadowBlur = Math.max(2, size * 0.1);
            g.strokeStyle = ms.armorGlow;
            g.lineWidth = Math.max(1, size * 0.025);
            g.beginPath(); g.arc(cx, cy, sz * 1.4, 0, Math.PI * 2); g.stroke();
            g.restore();
            g.strokeStyle = ms.armorPlus;
            g.lineWidth = Math.max(1, size * 0.022);
            g.beginPath();
            g.moveTo(cx - sz, cy); g.lineTo(cx + sz, cy);
            g.moveTo(cx, cy - sz); g.lineTo(cx, cy + sz);
            g.stroke();
            g.fillStyle = ms.armorPlus;
            g.beginPath(); g.arc(cx, cy, Math.max(1, size * 0.03), 0, Math.PI * 2); g.fill();
            // 装甲墙的造型也按风格区分（中心加号/光圈保持不变，保证可读性）
            // 缩略图里格子可能只有几个像素，内框会算出负半径，这里按尺寸直接跳过装饰
            const as = ms.armorShape || 'frame';
            if (size >= 16 && iw > 1 && ih > 1) {
            if (as === 'dome') {
                const rg3 = g.createRadialGradient(ix + iw * 0.3, iy + ih * 0.22, 0, ix + iw * 0.5, iy + ih * 0.5, iw * 0.75);
                rg3.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
                rg3.addColorStop(1, 'rgba(255, 255, 255, 0)');
                g.fillStyle = rg3; g.fillRect(ix, iy, iw, ih);
            } else if (as === 'facet' || as === 'crystalFrame') {
                g.strokeStyle = ms.armorRim2; g.lineWidth = 1;
                g.beginPath();
                g.moveTo(cx, iy + ih * 0.1); g.lineTo(ix + iw * 0.86, cy);
                g.lineTo(cx, iy + ih * 0.9); g.lineTo(ix + iw * 0.14, cy);
                g.closePath(); g.stroke();
                g.beginPath(); g.moveTo(cx, iy + ih * 0.1); g.lineTo(cx, iy + ih * 0.9); g.stroke();
            } else if (as === 'slab') {
                g.strokeStyle = ms.armorRim2; g.lineWidth = 1;
                for (let i = 1; i <= 2; i++) {
                    g.beginPath();
                    g.moveTo(ix, iy + ih * (i / 3)); g.lineTo(ix + iw, iy + ih * (i / 3));
                    g.stroke();
                }
            } else if (as === 'moss') {
                g.globalAlpha = 0.85;
                g.fillStyle = ms.decoPal.mid;
                for (let i = 0; i < 3; i++) {
                    g.beginPath();
                    g.ellipse(ix + iw * (0.22 + i * 0.28), iy + ih * 0.12, iw * 0.16, ih * 0.07, -0.15, 0, Math.PI * 2);
                    g.fill();
                }
                g.globalAlpha = 1;
            } else if (as === 'sandBrick') {
                g.strokeStyle = ms.armorRim2; g.lineWidth = 1;
                g.beginPath();
                g.moveTo(ix, iy + ih * 0.5); g.lineTo(ix + iw, iy + ih * 0.5);
                g.moveTo(ix + iw * 0.5, iy); g.lineTo(ix + iw * 0.5, iy + ih * 0.5);
                g.moveTo(ix + iw * 0.3, iy + ih * 0.5); g.lineTo(ix + iw * 0.3, iy + ih);
                g.stroke();
            } else if (as === 'stoneBlock') {
                g.strokeStyle = ms.armorRim2; g.lineWidth = 1;
                g.beginPath();
                g.moveTo(ix + iw * 0.18, iy + ih * 0.12);
                g.lineTo(ix + iw * 0.42, iy + ih * 0.52);
                g.lineTo(ix + iw * 0.30, iy + ih * 0.9);
                g.stroke();
                g.beginPath();
                g.moveTo(ix + iw * 0.62, iy + ih * 0.55);
                g.lineTo(ix + iw * 0.9, iy + ih * 0.72);
                g.stroke();
            }
            }
        }

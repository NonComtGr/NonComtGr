<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>迷雾战场 — 2D 大逃杀（在线对战 / 吉普车）</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;cursor:crosshair;
    font-family:system-ui,-apple-system,sans-serif;user-select:none;}
  canvas{display:block;}
  .overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(10,25,40,0.88), rgba(0,0,0,0.97));
    z-index:10;color:#fff;
  }
  .overlay.hidden{display:none;}
  .panel{
    background:rgba(14,22,32,0.96);
    border:1px solid rgba(100,180,255,0.28);
    border-radius:16px;padding:34px 44px;text-align:center;
    box-shadow:0 18px 60px rgba(0,0,0,0.75), 0 0 30px rgba(80,180,255,0.1) inset;
    min-width:360px;max-height:90vh;overflow-y:auto;
  }
  #settings .panel,#online .panel{width:470px;}
  .panel::-webkit-scrollbar{width:8px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(100,180,255,0.3);border-radius:4px;}
  h1{font-size:46px;margin:0 0 4px;letter-spacing:6px;
    color:#7fd3ff;text-shadow:0 0 24px rgba(80,180,255,0.55);font-weight:800;}
  .subtitle{color:rgba(160,200,240,0.45);margin-bottom:34px;letter-spacing:8px;font-size:12px;}
  h2{font-size:24px;margin:0 0 18px;letter-spacing:3px;color:#7fd3ff;}
  .btn{
    display:block;width:100%;padding:14px;margin:12px 0;
    background:rgba(60,120,180,0.18);
    border:1px solid rgba(100,180,255,0.38);
    color:#fff;font-size:16px;letter-spacing:3px;cursor:pointer;
    border-radius:9px;transition:all 0.15s;font-family:inherit;
  }
  .btn:hover{background:rgba(80,160,220,0.32);border-color:rgba(140,210,255,0.75);}
  .btn.primary{background:rgba(60,140,220,0.42);border-color:rgba(120,200,255,0.75);}
  .btn.primary:hover{background:rgba(80,170,240,0.58);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .row{display:flex;align-items:center;justify-content:space-between;margin:16px 0;gap:16px;}
  .row label{font-size:14px;color:rgba(220,240,255,0.85);white-space:nowrap;letter-spacing:1px;}
  .row select,.row input[type=text]{
    background:#0a1520;color:#fff;border:1px solid rgba(100,180,255,0.3);
    border-radius:6px;padding:7px 10px;font-family:inherit;font-size:14px;
    flex:1;max-width:210px;outline:none;
  }
  .row input[type=range]{flex:1;max-width:170px;accent-color:#4ea8ff;}
  #ai-val{color:#7fd3ff;font-weight:700;min-width:22px;text-align:center;}

  .section-title{
    font-size:12px;letter-spacing:2px;color:rgba(140,200,240,0.65);
    margin:22px 0 10px;text-align:left;
    border-bottom:1px solid rgba(100,180,255,0.15);padding-bottom:6px;
  }
  .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;}
  .chk{display:flex;align-items:center;gap:7px;font-size:13px;
    color:rgba(220,240,255,0.85);cursor:pointer;letter-spacing:1px;}
  .chk input{accent-color:#4ea8ff;width:15px;height:15px;cursor:pointer;margin:0;}
  .key-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;}
  .key-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .key-row span{font-size:13px;color:rgba(220,240,255,0.85);letter-spacing:1px;}
  .keybtn{
    background:#0a1520;color:#7fd3ff;border:1px solid rgba(100,180,255,0.35);
    border-radius:6px;padding:5px 10px;font-family:inherit;font-size:12px;
    font-weight:700;cursor:pointer;min-width:78px;transition:all 0.12s;letter-spacing:1px;
  }
  .keybtn:hover{border-color:rgba(140,210,255,0.8);}
  .keybtn.listening{background:#4ea8ff;color:#04121c;border-color:#9fd4ff;}
  .hint{font-size:11px;color:rgba(160,200,240,0.42);margin-top:8px;letter-spacing:1px;text-align:left;}

  /* ===== 历史战绩 ===== */
  #history .panel{width:520px;}
  .hist-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px;}
  .hist-stat{
    background:rgba(20,35,50,0.75);border:1px solid rgba(100,180,255,0.18);
    border-radius:9px;padding:10px 4px;text-align:center;
  }
  .hist-stat b{display:block;font-size:19px;color:#7fd3ff;margin-bottom:3px;font-weight:800;}
  .hist-stat span{font-size:11px;color:rgba(160,200,240,0.6);letter-spacing:1px;}
  .hist-list{max-height:280px;overflow-y:auto;text-align:left;margin-bottom:4px;padding-right:6px;}
  .hist-list::-webkit-scrollbar{width:6px;}
  .hist-list::-webkit-scrollbar-thumb{background:rgba(100,180,255,0.3);border-radius:3px;}
  .hist-row{
    display:flex;align-items:center;gap:12px;
    background:rgba(20,32,46,0.72);border:1px solid rgba(100,180,255,0.13);
    border-radius:9px;padding:10px 12px;margin-bottom:8px;
  }
  .hist-row.win{border-color:rgba(255,217,61,0.45);background:rgba(60,52,18,0.42);}
  .hist-badge{
    flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:1px;
    padding:5px 9px;border-radius:6px;background:rgba(255,82,82,0.16);
    color:#ff8a8a;border:1px solid rgba(255,82,82,0.35);white-space:nowrap;
  }
  .hist-row.win .hist-badge{background:rgba(255,217,61,0.16);color:#ffd93d;
    border-color:rgba(255,217,61,0.45);}
  .hist-main{flex:1;min-width:0;}
  .hist-l1{font-size:13px;color:rgba(230,242,255,0.92);letter-spacing:0.5px;
    display:flex;gap:12px;flex-wrap:wrap;}
  .hist-l1 em{font-style:normal;color:#ff9a6a;font-weight:700;}
  .hist-l2{font-size:11px;color:rgba(160,200,240,0.45);margin-top:4px;letter-spacing:0.5px;}
  .hist-empty{text-align:center;color:rgba(160,200,240,0.45);font-size:13px;
    padding:36px 0;letter-spacing:2px;}

  /* ===== 在线对战 ===== */
  .room-code{font-size:14px;color:rgba(160,200,240,0.7);margin:6px 0 10px;letter-spacing:2px;}
  .room-code b{font-size:28px;color:#7fd3ff;letter-spacing:8px;margin-left:6px;
    text-shadow:0 0 18px rgba(80,180,255,0.55);font-weight:800;}
  .room-hint{font-size:12px;color:rgba(160,200,240,0.5);margin-bottom:14px;
    letter-spacing:1px;min-height:16px;}
  .room-hint.err{color:#ff8080;}
  .player-list{max-height:170px;overflow-y:auto;margin-bottom:14px;text-align:left;padding-right:4px;}
  .player-list::-webkit-scrollbar{width:6px;}
  .player-list::-webkit-scrollbar-thumb{background:rgba(100,180,255,0.3);border-radius:3px;}
  .pl-item{display:flex;align-items:center;gap:8px;padding:8px 11px;margin-bottom:6px;
    background:rgba(20,32,46,0.7);border:1px solid rgba(100,180,255,0.13);border-radius:7px;
    font-size:13px;color:rgba(220,240,255,0.85);letter-spacing:1px;}
  .pl-item .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex:0 0 auto;}
  .pl-item .tag{margin-left:auto;font-size:11px;color:#7fd3ff;letter-spacing:1px;}
  #in-room-code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700;
    color:#7fd3ff;max-width:210px;}
  .net-note{font-size:11px;color:rgba(160,200,240,0.38);margin-top:6px;
    letter-spacing:1px;text-align:left;line-height:1.6;}

  /* ===== 背包 ===== */
  #backpack{cursor:default;}
  #backpack .bp-panel{
    width:760px;max-width:94vw;
    background:rgba(14,22,32,0.97);
    border:1px solid rgba(100,180,255,0.28);
    border-radius:14px;
    padding:20px 24px 18px;
    box-shadow:0 18px 60px rgba(0,0,0,0.8), 0 0 40px rgba(80,180,255,0.08) inset;
    color:#fff;
  }
  .bp-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;padding-bottom:12px;
    border-bottom:1px solid rgba(100,180,255,0.15);
  }
  .bp-title{font-size:22px;letter-spacing:5px;color:#7fd3ff;font-weight:800;
    text-shadow:0 0 16px rgba(80,180,255,0.5);}
  .bp-key{font-size:12px;color:rgba(160,200,240,0.5);letter-spacing:1px;}
  .bp-key b{color:#7fd3ff;}
  .bp-body{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .bp-col-h{
    font-size:12px;letter-spacing:3px;color:rgba(140,200,240,0.65);
    margin-bottom:8px;padding-bottom:6px;
    border-bottom:1px solid rgba(100,180,255,0.1);
  }
  .bp-list{
    min-height:280px;max-height:340px;overflow-y:auto;
    background:rgba(10,18,26,0.55);
    border:1px solid rgba(100,180,255,0.1);
    border-radius:8px;padding:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .bp-list::-webkit-scrollbar{width:6px;}
  .bp-list::-webkit-scrollbar-thumb{background:rgba(100,180,255,0.3);border-radius:3px;}
  .bp-item{
    display:flex;align-items:center;gap:10px;
    background:rgba(30,45,62,0.7);
    border:1px solid rgba(100,180,255,0.15);
    border-radius:6px;
    padding:7px 10px;
    cursor:grab;user-select:none;
    font-size:13px;color:rgba(220,240,255,0.92);
    transition:background 0.1s,border-color 0.1s;
  }
  .bp-item:hover{background:rgba(50,80,110,0.85);border-color:rgba(120,200,255,0.45);}
  .bp-item.dragging{opacity:0.35;}
  .bp-icon{width:24px;height:24px;flex:0 0 auto;image-rendering:auto;}
  .bp-name{flex:1;letter-spacing:0.5px;}
  .bp-count{font-size:12px;color:#ffd34d;font-weight:800;letter-spacing:0.5px;}
  .bp-empty{
    text-align:center;color:rgba(160,200,240,0.3);
    font-size:12px;padding:30px 0;letter-spacing:3px;
  }
  .bp-equip{display:flex;gap:8px;margin-top:14px;}
  .bp-eqslot{
    flex:1;
    background:rgba(20,32,46,0.7);
    border:1px solid rgba(100,180,255,0.15);
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    color:rgba(200,225,245,0.85);
    min-height:46px;
    display:flex;align-items:center;gap:8px;
  }
  .bp-eqslot img{width:20px;height:20px;flex:0 0 auto;}
  .bp-eqslot .lbl{color:rgba(140,200,240,0.55);font-size:11px;letter-spacing:1px;}
  .bp-eqslot .val{color:#7fd3ff;font-weight:700;margin-left:auto;letter-spacing:0.5px;}
  .bp-footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;padding-top:12px;
    border-top:1px solid rgba(100,180,255,0.12);
  }
  .bp-cap{font-size:13px;color:rgba(160,200,240,0.7);letter-spacing:1px;}
  .bp-cap b{font-weight:800;}
  .bp-tip{font-size:11px;color:rgba(160,200,240,0.4);letter-spacing:1px;}
  .bp-ghost{
    position:fixed;pointer-events:none;z-index:1000;
    background:rgba(50,90,130,0.95);
    border:1px solid rgba(140,210,255,0.8);
    border-radius:6px;
    padding:7px 10px;
    font-size:13px;color:#fff;
    transform:translate(-50%,-50%);
    box-shadow:0 6px 24px rgba(0,0,0,0.7), 0 0 16px rgba(80,180,255,0.3);
    opacity:0.92;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>迷雾战场</h1>
    <div class="subtitle">2D BATTLE ROYALE</div>
    <button class="btn primary" id="btnStart">开 始 游 戏</button>
    <button class="btn" id="btnOnline">在 线 对 战</button>
    <button class="btn" id="btnSettings">设 置</button>
    <button class="btn" id="btnHistory">历 史 战 绩</button>
  </div>
</div>

<div id="settings" class="overlay hidden">
  <div class="panel">
    <h2>设 置</h2>
    <div class="row">
      <label>AI 强度</label>
      <input type="range" id="s-ai" min="1" max="5" step="1" value="3">
      <span id="ai-val">3</span>
    </div>
    <div class="row">
      <label>战场人数</label>
      <select id="s-total">
        <option value="10">10 人</option>
        <option value="20">20 人</option>
        <option value="50">50 人</option>
        <option value="100">100 人</option>
      </select>
    </div>
    <div class="row">
      <label>地图</label>
      <select id="s-map">
        <option value="random">随机</option>
        <option value="square">方形</option>
        <option value="circle">圆形</option>
        <option value="cross">十字</option>
        <option value="Lshape">L 形</option>
        <option value="diamond">菱形</option>
        <option value="islands">双子岛</option>
      </select>
    </div>

    <div class="section-title">自动拾取（走近时自动捡起）</div>
    <div class="chk-grid" id="auto-grid"></div>

    <div class="section-title">自动治疗</div>
    <div class="chk-grid">
      <label class="chk">
        <input type="checkbox" id="s-autoheal" checked>
        <span>自动治疗（优先绷带，损失血量足够时才用）</span>
      </label>
    </div>

    <div class="section-title">快捷键（点击按钮后按下新按键）</div>
    <div class="key-grid" id="key-grid"></div>
    <div class="hint">提示：手雷也可以直接用鼠标右键投掷</div>

    <button class="btn primary" id="btnBack">返 回</button>
  </div>
</div>

<!-- ===== 在线对战 ===== -->
<div id="online" class="overlay hidden">
  <div class="panel">
    <h2>在 线 对 战</h2>

    <div id="online-menu">
      <div class="section-title">创建房间</div>
      <div class="row">
        <label>战场人数</label>
        <select id="s-online-total">
          <option value="10">10 人</option>
          <option value="20">20 人</option>
          <option value="50">50 人</option>
          <option value="100" selected>100 人</option>
        </select>
      </div>
      <div class="row">
        <label>地图</label>
        <select id="s-online-map">
          <option value="random">随机</option>
          <option value="square">方形</option>
          <option value="circle">圆形</option>
          <option value="cross">十字</option>
          <option value="Lshape">L 形</option>
          <option value="diamond">菱形</option>
          <option value="islands">双子岛</option>
        </select>
      </div>
      <button class="btn primary" id="btnCreateRoom">创 建 房 间</button>

      <div class="section-title">加入房间</div>
      <div class="row">
        <label>房间码</label>
        <input type="text" id="in-room-code" maxlength="5" placeholder="5 位码">
      </div>
      <button class="btn" id="btnJoinRoom">加 入 房 间</button>

      <div class="net-note">
        联机基于 P2P（房主为主机）。房主须保持页面开启。<br>
        未填满的人数由 AI 补足；人数越少地图越小。
      </div>
    </div>

    <div id="online-room" class="hidden">
      <div class="room-code">房间码<b id="room-code-val">-----</b></div>
      <div class="room-hint" id="room-status">正在连接…</div>
      <div class="player-list" id="room-players"></div>
      <button class="btn primary" id="btnRoomStart">开 始 游 戏</button>
      <button class="btn" id="btnRoomLeave">离 开 房 间</button>
    </div>

    <button class="btn" id="btnOnlineBack">返 回</button>
  </div>
</div>

<!-- ===== 历史战绩 ===== -->
<div id="history" class="overlay hidden">
  <div class="panel">
    <h2>历 史 战 绩</h2>
    <div class="hist-stats" id="hist-stats"></div>
    <div class="hist-list" id="hist-list"></div>
    <button class="btn" id="btnClearHist">清 空 战 绩</button>
    <button class="btn primary" id="btnHistBack">返 回</button>
  </div>
</div>

<!-- ===== 暂停菜单 ===== -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>游 戏 暂 停</h2>
    <button class="btn primary" id="btnResume">继 续 游 戏</button>
    <button class="btn" id="btnReturnMenu">返 回 主 菜 单</button>
    <div class="hint" style="text-align:center;margin-top:14px;">按 ESC 也可继续游戏</div>
  </div>
</div>

<!-- ===== 背包 ===== -->
<div id="backpack" class="overlay hidden">
  <div class="bp-panel">
    <div class="bp-header">
      <span class="bp-title">背 包</span>
      <span class="bp-key"><b id="bp-key-hint">TAB</b> 关闭 · 左键拖拽移动 · 右键使用/装备</span>
    </div>
    <div class="bp-body">
      <div class="bp-col">
        <div class="bp-col-h">我 的 物 品</div>
        <div class="bp-list" id="bp-mine"></div>
      </div>
      <div class="bp-col">
        <div class="bp-col-h">附 近 物 品</div>
        <div class="bp-list" id="bp-ground"></div>
      </div>
    </div>
    <div class="bp-equip" id="bp-equip"></div>
    <div class="bp-footer">
      <div class="bp-cap" id="bp-cap"></div>
      <div class="bp-tip">把物品拖到「附近物品」栏即可丢弃</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   可设置参数
============================================================ */
const CONFIG = {
  WORLD: 9600,          // 100 人时的世界边长基准
  CELL: 30,
  VIEW_R: 560,
  WALL_COUNT: 650,
  VEHICLE_COUNT: 20,
  MINIMAP: {
    enabled: true, size: 260, margin: 18, opacity: 0.92,
    showEnemies: true, showItems: false, showWalls: true,
    showZone: true, showGrid: true,
  }
};

const settings = {
  aiLevel: 3,
  mapShape: 'random',
  totalPlayers: 100,
  autoHeal: true,
  keys: {
    pickup : 'e',
    bandage: 'q',
    medkit : 'f',
    drink  : 'r',
    grenade: 'x',
    vehicle: 'g',
    backpack: 'tab',
  },
  autoPickup: {
    weapon: true, ammo: true, bandage: true, medkit: true,
    drink: true, grenade: true, backpack: true, armor: true, helmet: true,
    scatter: true,
  }
};

/* 运行时世界参数 */
let TOTAL_PLAYERS = 100;
let WORLD_SIZE = CONFIG.WORLD;
let WALL_COUNT = CONFIG.WALL_COUNT;
let VEHICLE_COUNT = CONFIG.VEHICLE_COUNT;
let ITEM_SCALE = 1;
let MAP_SEED = 1;

/* ============================================================
   工具
============================================================ */
const rand  = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const TAU   = Math.PI*2;

/* 种子随机（用于世界生成，保证主机/客户端一致） */
let worldRng = Math.random;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const wrand = (a,b)=>a + worldRng()*(b-a);

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W = 0, H = 0;
function resize(){ W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

/* ============================================================
   数据
============================================================ */
const WEAPONS = {
  sniper: {name:'狙击枪', dmg:88, speed:1800, rate:1.10, spread:0.010, color:'#ffe066', len:28},
  rifle : {name:'步枪',   dmg:25, speed:1200, rate:0.13, spread:0.050, color:'#7fd3ff', len:22},
  pistol: {name:'手枪',   dmg:20, speed: 900, rate:0.30, spread:0.060, color:'#d8d8d8', len:15},
  smg   : {name:'冲锋枪', dmg:13, speed: 700, rate:0.08, spread:0.100, color:'#ff9a6a', len:16},
};
const WEAPON_KEYS = Object.keys(WEAPONS);

const BACKPACKS = [
  {name:'无背包',   cap:6},
  {name:'一级背包', cap:12},
  {name:'二级背包', cap:20},
  {name:'三级背包', cap:32},
];

const ARMOR_REDUCE  = [0, 0.25, 0.40, 0.55];
const HELMET_REDUCE = [0, 0.10, 0.15, 0.20];
const MAX_REDUCE = 0.70;

const ITEM_WEIGHT = { bandage:1, medkit:3, drink:1, grenade:1 };
const AMMO_PER_UNIT = 20;

function rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function drawIcon(c, name, cx, cy, size, color, lw){
  const fn = ICONS[name];
  if(!fn) return;
  c.save();
  c.translate(cx - size/2, cy - size/2);
  c.scale(size/24, size/24);
  c.strokeStyle = color;
  c.fillStyle = color;
  c.lineWidth = lw || 2;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  fn(c);
  c.restore();
}

function fmtTime(s){
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + String(sec).padStart(2,'0');
}

function mapMargin(){ return Math.min(200, WORLD_SIZE*0.08); }

function buildMapPath(c){
  const cx = WORLD_SIZE/2, cy = WORLD_SIZE/2;
  const M = mapMargin();
  c.beginPath();
  if(MAP_SHAPE === 'square'){
    c.rect(0, 0, WORLD_SIZE, WORLD_SIZE);
  } else if(MAP_SHAPE === 'circle'){
    c.arc(cx, cy, WORLD_SIZE/2 - M, 0, TAU);
  } else if(MAP_SHAPE === 'cross'){
    const half = WORLD_SIZE * 0.17;
    c.rect(0, cy - half, WORLD_SIZE, half*2);
    c.rect(cx - half, 0, half*2, WORLD_SIZE);
  } else if(MAP_SHAPE === 'Lshape'){
    const t = WORLD_SIZE * 0.42;
    c.rect(0, 0, t, WORLD_SIZE);
    c.rect(0, WORLD_SIZE - t, WORLD_SIZE, t);
  } else if(MAP_SHAPE === 'diamond'){
    const R = WORLD_SIZE/2 - M;
    c.moveTo(cx, cy - R);
    c.lineTo(cx + R, cy);
    c.lineTo(cx, cy + R);
    c.lineTo(cx - R, cy);
    c.closePath();
  } else if(MAP_SHAPE === 'islands'){
    const x1 = cx - WORLD_SIZE*0.16, y1 = cy - WORLD_SIZE*0.12, r1 = WORLD_SIZE*0.28;
    const x2 = cx + WORLD_SIZE*0.18, y2 = cy + WORLD_SIZE*0.06, r2 = WORLD_SIZE*0.22;
    c.moveTo(x1 + r1, y1);
    c.arc(x1, y1, r1, 0, TAU);
    c.moveTo(x2 + r2, y2);
    c.arc(x2, y2, r2, 0, TAU);
    c.rect(Math.min(x1, x2), (y1 + y2)/2 - WORLD_SIZE*0.02,
           Math.abs(x2 - x1), WORLD_SIZE*0.04);
  }
  c.closePath();
}

function isInMap(x, y){
  const cx = WORLD_SIZE/2, cy = WORLD_SIZE/2;
  const M = mapMargin();
  if(MAP_SHAPE === 'square') return true;
  if(MAP_SHAPE === 'circle'){
    return Math.hypot(x - cx, y - cy) < WORLD_SIZE/2 - M;
  }
  if(MAP_SHAPE === 'cross'){
    const half = WORLD_SIZE * 0.17;
    return Math.abs(y - cy) < half || Math.abs(x - cx) < half;
  }
  if(MAP_SHAPE === 'Lshape'){
    const t = WORLD_SIZE * 0.42;
    return x < t || y > WORLD_SIZE - t;
  }
  if(MAP_SHAPE === 'diamond'){
    return Math.abs(x - cx) + Math.abs(y - cy) < WORLD_SIZE/2 - M;
  }
  if(MAP_SHAPE === 'islands'){
    const x1 = cx - WORLD_SIZE*0.16, y1 = cy - WORLD_SIZE*0.12, r1 = WORLD_SIZE*0.28;
    const x2 = cx + WORLD_SIZE*0.18, y2 = cy + WORLD_SIZE*0.06, r2 = WORLD_SIZE*0.22;
    if(Math.hypot(x - x1, y - y1) < r1) return true;
    if(Math.hypot(x - x2, y - y2) < r2) return true;
    if(x > Math.min(x1,x2) && x < Math.max(x1,x2) &&
       Math.abs(y - (y1+y2)/2) < WORLD_SIZE*0.02) return true;
    return false;
  }
  return true;
}

function wallInMap(x, y, w, h){
  return isInMap(x, y) && isInMap(x+w, y) && isInMap(x, y+h) && isInMap(x+w, y+h);
}

function usedCap(e){
  return e.bandage*ITEM_WEIGHT.bandage
       + e.medkit *ITEM_WEIGHT.medkit
       + e.drink  *ITEM_WEIGHT.drink
       + e.grenade*ITEM_WEIGHT.grenade
       + Math.ceil(e.ammo / AMMO_PER_UNIT);
}
function freeCap(e){
  return Math.max(0, BACKPACKS[e.backpack].cap - usedCap(e));
}
function damageReduction(e){
  return Math.min(MAX_REDUCE, ARMOR_REDUCE[e.armor] + HELMET_REDUCE[e.helmet]);
}

function ensureSpace(ent, needed){
  const free = freeCap(ent);
  if(free >= needed) return true;
  const deficit = needed - free;
  const ammoNeeded = deficit * AMMO_PER_UNIT;
  if(ent.ammo >= ammoNeeded){
    ent.ammo -= ammoNeeded;
    return true;
  }
  return false;
}

/* ============================================================
   世界生成
============================================================ */
let wallGrid = {};
const WALL_GRID_SIZE = 800;

function inWall(x, y, pad){
  const gx0 = Math.floor((x-pad) / WALL_GRID_SIZE);
  const gy0 = Math.floor((y-pad) / WALL_GRID_SIZE);
  const gx1 = Math.floor((x+pad) / WALL_GRID_SIZE);
  const gy1 = Math.floor((y+pad) / WALL_GRID_SIZE);
  for(let gy=gy0; gy<=gy1; gy++){
    for(let gx=gx0; gx<=gx1; gx++){
      const arr = wallGrid[gx + ',' + gy];
      if(!arr) continue;
      for(const w of arr){
        if(x > w.x-pad && x < w.x+w.w+pad && y > w.y-pad && y < w.y+w.h+pad) return true;
      }
    }
  }
  return false;
}

function getWallsInRange(x0, y0, x1, y1){
  const gx0 = Math.floor(Math.min(x0, x1) / WALL_GRID_SIZE);
  const gy0 = Math.floor(Math.min(y0, y1) / WALL_GRID_SIZE);
  const gx1 = Math.floor(Math.max(x0, x1) / WALL_GRID_SIZE);
  const gy1 = Math.floor(Math.max(y0, y1) / WALL_GRID_SIZE);
  const seen = new Set();
  const out = [];
  for(let gy=gy0; gy<=gy1; gy++){
    for(let gx=gx0; gx<=gx1; gx++){
      const arr = wallGrid[gx + ',' + gy];
      if(!arr) continue;
      for(const w of arr){
        if(!seen.has(w)){ seen.add(w); out.push(w); }
      }
    }
  }
  return out;
}

function buildWallGrid(){
  wallGrid = {};
  for(const w of walls){
    const gx0 = Math.floor(w.x / WALL_GRID_SIZE);
    const gy0 = Math.floor(w.y / WALL_GRID_SIZE);
    const gx1 = Math.floor((w.x + w.w) / WALL_GRID_SIZE);
    const gy1 = Math.floor((w.y + w.h) / WALL_GRID_SIZE);
    for(let gy=gy0; gy<=gy1; gy++){
      for(let gx=gx0; gx<=gx1; gx++){
        const k = gx + ',' + gy;
        if(!wallGrid[k]) wallGrid[k] = [];
        wallGrid[k].push(w);
      }
    }
  }
}

function generateWalls(){
  walls = [];
  const ws = WORLD_SIZE / CONFIG.WORLD;
  const dimScale = Math.max(0.55, ws);
  let attempts = 0;
  while(walls.length < WALL_COUNT && attempts < WALL_COUNT * 15){
    attempts++;
    let w, h;
    const t = worldRng();
    if(t < 0.45){       w = wrand(180, 520); h = wrand(40, 70); }
    else if(t < 0.9){   w = wrand(40, 70);   h = wrand(180, 520); }
    else {              w = wrand(120, 260); h = wrand(120, 260); }
    w *= dimScale; h *= dimScale;
    const pad = Math.min(260, WORLD_SIZE*0.1);
    const x = wrand(pad, WORLD_SIZE - pad - w);
    const y = wrand(pad, WORLD_SIZE - pad - h);
    if(wallInMap(x, y, w, h)) walls.push({x, y, w, h});
  }
  buildWallGrid();
}

function findSpot(minDist){
  const pad = Math.min(160, WORLD_SIZE*0.06);
  for(let i=0;i<500;i++){
    const x = wrand(pad, WORLD_SIZE-pad), y = wrand(pad, WORLD_SIZE-pad);
    if(!isInMap(x, y)) continue;
    if(inWall(x, y, 40)) continue;
    let ok = true;
    for(let j=0;j<items.length;j++){
      const it = items[j];
      if(!it || it.removed) continue;
      const dx = it.x-x, dy = it.y-y;
      if(dx*dx + dy*dy < minDist*minDist){ ok = false; break; }
    }
    if(ok) return {x, y};
  }
  for(let i=0;i<300;i++){
    const x = wrand(0, WORLD_SIZE), y = wrand(0, WORLD_SIZE);
    if(isInMap(x, y) && !inWall(x, y, 34)) return {x, y};
  }
  return {x: WORLD_SIZE/2, y: WORLD_SIZE/2};
}

function addItem(type, x, y, extra){
  const it = Object.assign({type, x, y, removed:false, _idx: itemIdxCounter++}, extra||{});
  items.push(it);
  if(net.mode === 'host' && net.started){
    net.newItems.push({i: it._idx, t: type, x, y, e: extra || null});
  }
  return it;
}

function markRemoved(it){
  if(it.removed) return;
  it.removed = true;
  if(net.mode === 'host' && net.started) net.removedList.push(it._idx);
}

/* 按人数缩放数量 */
function scaledCount(base){
  return Math.max(1, Math.round(base * ITEM_SCALE));
}

  const pistolN = scaledCount(40);
  const rifleN  = scaledCount(35);
  const sniperN = scaledCount(18);

  for(let i=0;i<pistolN;i++) gunPlan.push('pistol');
  for(let i=0;i<rifleN;i++)  gunPlan.push('rifle');
  for(let i=0;i<sniperN;i++) gunPlan.push('sniper');

  for(const g of gunPlan){
    const s = findSpot(90);
    addItem('weapon', s.x, s.y, {wkey:g});
    const piles = g === 'sniper' ? 2 : 1;
    const total = g === 'sniper' ? 24 : g === 'rifle' ? 90 : g === 'smg' ? 140 : 70;
    for(let i=0;i<piles;i++){
      const a = wrand(0, TAU), d = wrand(32, 58);
      addItem('ammo', s.x + Math.cos(a)*d, s.y + Math.sin(a)*d,
              {amount: Math.round(total/piles)});

  for(let i=0;i<scaledCount(180);i++){
    const s = findSpot(80);
    addItem('ammo', s.x, s.y, {amount: Math.round(wrand(30,90))});
  }
  for(let i=0;i<scaledCount(200);i++){ const s=findSpot(70); addItem('bandage', s.x, s.y); }
  for(let i=0;i<scaledCount( 80);i++){ const s=findSpot(70); addItem('medkit',  s.x, s.y); }
  for(let i=0;i<scaledCount(120);i++){ const s=findSpot(70); addItem('drink',   s.x, s.y); }
  for(let i=0;i<scaledCount(120);i++){ const s=findSpot(80); addItem('grenade', s.x, s.y); }

  /* 散弹弹丸：不占背包格子的特殊道具 */
  for(let i=0;i<scaledCount(40);i++){ const s=findSpot(90); addItem('scatter', s.x, s.y); }

  for(let i=0;i<scaledCount(80);i++){ const s=findSpot(90); addItem('backpack', s.x, s.y, {level:1}); }
  for(let i=0;i<scaledCount(50);i++){ const s=findSpot(90); addItem('backpack', s.x, s.y, {level:2}); }
  for(let i=0;i<scaledCount(25);i++){ const s=findSpot(90); addItem('backpack', s.x, s.y, {level:3}); }
  for(let i=0;i<scaledCount(60);i++){ const s=findSpot(90); addItem('armor', s.x, s.y, {level:1}); }
  for(let i=0;i<scaledCount(40);i++){ const s=findSpot(90); addItem('armor', s.x, s.y, {level:2}); }
  for(let i=0;i<scaledCount(20);i++){ const s=findSpot(90); addItem('armor', s.x, s.y, {level:3}); }
  for(let i=0;i<scaledCount(60);i++){ const s=findSpot(90); addItem('helmet', s.x, s.y, {level:1}); }
  for(let i=0;i<scaledCount(40);i++){ const s=findSpot(90); addItem('helmet', s.x, s.y, {level:2}); }
  for(let i=0;i<scaledCount(20);i++){ const s=findSpot(90); addItem('helmet', s.x, s.y, {level:3}); }

function generateVehicles(){
  vehicles = [];
  const minGap = Math.min(800, WORLD_SIZE*0.16);
  for(let i=0;i<VEHICLE_COUNT;i++){
    for(let k=0;k<400;k++){
      const x = wrand(300, WORLD_SIZE-300);
      const y = wrand(300, WORLD_SIZE-300);
      if(!isInMap(x, y)) continue;
      if(inWall(x, y, 60)) continue;
      let ok = true;
      for(const v of vehicles){
        if(Math.hypot(v.x-x, v.y-y) < minGap){ ok = false; break; }
      }
      if(ok){
        vehicles.push({
          x, y, angle: wrand(0, TAU),
          vx: 0, vy: 0, speed: 0,
          r: VEHICLE.r,
          driver: null,
          ramCd: {},
        });
        break;
      }
    }
  }
}

function generatePlayers(humanCount){
  const spots = [];
  const minGap = Math.max(120, Math.min(280, WORLD_SIZE*0.055));
  for(let i=0;i<TOTAL_PLAYERS;i++){
    let s = null;
    for(let k=0;k<600;k++){
      const c = {x:wrand(240,WORLD_SIZE-240), y:wrand(240,WORLD_SIZE-240)};
      if(!isInMap(c.x, c.y)) continue;
      if(inWall(c.x, c.y, 40)) continue;
      let ok = true;
      for(const p of spots){
        if(Math.hypot(p.x-c.x, p.y-c.y) < minGap){ ok = false; break; }
      }
      if(ok){ s = c; break; }
    }
    if(!s){
      for(let k=0;k<300;k++){
        const c = {x:wrand(240,WORLD_SIZE-240), y:wrand(240,WORLD_SIZE-240)};
        if(isInMap(c.x, c.y) && !inWall(c.x, c.y, 40)){ s = c; break; }
      }
    }
    if(!s) s = {x: WORLD_SIZE/2, y: WORLD_SIZE/2};
    spots.push(s);
  }

  humanCount = clamp(humanCount|0, 1, TOTAL_PLAYERS);

  player = makeEntity(spots[0].x, spots[0].y, true);
  player.human = true;
  entities.push(player);

  for(let i=1;i<humanCount;i++){
    const h = makeEntity(spots[i].x, spots[i].y, false);
    h.human = true;
    h.angle = wrand(0, TAU);
    entities.push(h);
  }
  for(let i=humanCount;i<TOTAL_PLAYERS;i++){
    const ai = makeEntity(spots[i].x, spots[i].y, false);
    ai.angle = wrand(0, TAU);
    ai.strafeDir = worldRng() < 0.5 ? -1 : 1;
    entities.push(ai);
  }
}

    cx: WORLD_SIZE/2, cy: WORLD_SIZE/2, r: initR,
    phaseIdx: 0, state: 'wait', t: ZONE_PHASES[0].wait,
    fromR: initR, toR: initR, fromX: WORLD_SIZE/2, fromY: WORLD_SIZE/2,
    toX: WORLD_SIZE/2, toY: WORLD_SIZE/2, shrinkTotal: 1, dmg: 0
  };
}

/* humanCount: 人类玩家数量（含本地玩家），其余为 AI */
function generateWorld(seed, shape, total, humanCount){
  MAP_SEED = (seed >>> 0);
  MAP_SHAPE = shape;
  TOTAL_PLAYERS = total;
  worldRng = mulberry32(MAP_SEED);

  const ws = Math.max(0.42, Math.sqrt(TOTAL_PLAYERS / 100));
  WORLD_SIZE  = Math.round(CONFIG.WORLD * ws);
  WALL_COUNT  = Math.max(40, Math.round(CONFIG.WALL_COUNT * ws * ws));
  VEHICLE_COUNT = Math.max(3, Math.round(CONFIG.VEHICLE_COUNT * ws));
  ITEM_SCALE  = Math.max(0.12, ws * ws);

  GW = Math.floor(WORLD_SIZE / CONFIG.CELL);
  GH = Math.floor(WORLD_SIZE / CONFIG.CELL);

  initBuffers();
  nextEntityId = 1;
  itemIdxCounter = 0;

  entities = []; bullets = []; items = []; vehicles = [];
  grenades = []; explosions = [];
  exploredBuf.fill(0);
  visBuf.fill(0);
  time = 0;

  generateWalls();
  generateItems();
  generatePlayers(humanCount || 1);
  generateVehicles();
  generateScenery();
  initZone();

  cam.x = clamp(player.x - W/2, 0, Math.max(0, WORLD_SIZE-W));
  cam.y = clamp(player.y - H/2, 0, Math.max(0, WORLD_SIZE-H));
}

function pickWeighted(list){
  let total = 0;
  for(let i=0;i<list.length;i++) total += list[i].w;
  let r = worldRng() * total;
  for(let i=0;i<list.length;i++){
    r -= list[i].w;
    if(r <= 0) return list[i];
  }
  return list[list.length - 1];
}

function scenerySpot(pad){
  for(let k = 0; k < 30; k++){
    const x = wrand(pad, WORLD_SIZE - pad);
    const y = wrand(pad, WORLD_SIZE - pad);
    if(!isInMap(x, y)) continue;
    if(inWall(x, y, 6)) continue;
    return {x: x, y: y};
  }
  return null;
}

function makeDecal(t, x, y){
  const d = { layer:'decal', t:t, x:x, y:y, a: worldRng()*TAU, s: 20, c: '#000' };
  switch(t){
    case 'crack': {
      d.s  = wrand(40, 110);
      d.lw = wrand(1.5, 3);
      d.c  = 'rgba(0,0,0,0.34)';
      const pts = [[0,0]];
      let ang = d.a, px = 0, py = 0;
      for(let i=0;i<4;i++){
        ang += wrand(-0.8, 0.8);
        px += Math.cos(ang) * (d.s/4);
        py += Math.sin(ang) * (d.s/4);
        pts.push([px, py]);
      }
      d.pts = pts;
      break;
    }
    case 'oil':
      d.s = wrand(20, 50);
      d.c = 'rgba(22,40,50,0.38)';
      break;
    case 'paper':
      d.s = wrand(6, 12);
      d.c = 'rgba(200,205,190,0.22)';
      break;
    case 'grassTuft':
      d.s = wrand(12, 26);
      d.n = 3 + Math.floor(worldRng()*3);
      d.a = -Math.PI/2 + wrand(-0.4, 0.4);
      d.c = ['rgba(96,168,96,0.55)','rgba(126,186,104,0.5)','rgba(72,144,84,0.5)'][Math.floor(worldRng()*3)];
      break;
    case 'dryTuft':
      d.s = wrand(10, 22);
      d.n = 3 + Math.floor(worldRng()*2);
      d.a = -Math.PI/2 + wrand(-0.5, 0.5);
      d.c = 'rgba(150,140,80,0.45)';
      break;
    case 'tuft':
      d.s = wrand(12, 24);
      d.n = 3 + Math.floor(worldRng()*3);
      d.a = -Math.PI/2 + wrand(-0.4, 0.4);
      d.c = 'rgba(110,180,110,0.5)';
      break;
    case 'leaf':
      d.s = wrand(6, 11);
      d.c = ['rgba(120,150,70,0.4)','rgba(150,120,60,0.35)','rgba(90,130,70,0.4)'][Math.floor(worldRng()*3)];
      break;
    case 'moss':
      d.s = wrand(16, 34);
      d.c = 'rgba(70,130,80,0.14)';
      break;
    case 'sandWave':
      d.s = wrand(40, 90);
      d.n = 2 + Math.floor(worldRng()*3);
      d.a = 0;
      d.c = 'rgba(210,190,140,0.10)';
      break;
    case 'pebble':
      d.s = wrand(14, 26);
      d.c = 'rgba(150,140,120,0.28)';
      d.pts = [];
      for(let i=0;i<4;i++){
        d.pts.push([wrand(-d.s, d.s), wrand(-d.s*0.7, d.s*0.7), wrand(1.5, 4)]);
      }
      break;
    case 'snowPatch':
      d.s = wrand(30, 80);
      d.c = 'rgba(210,235,255,0.10)';
      break;
    case 'icePatch':
      d.s = wrand(26, 62);
      d.c = 'rgba(140,205,240,0.14)';
      break;
    case 'lavaCrack': {
      d.s  = wrand(50, 130);
      d.lw = wrand(2, 3.5);
      const pts = [[0,0]];
      let ang = d.a, px = 0, py = 0;
      for(let i=0;i<4;i++){
        ang += wrand(-0.7, 0.7);
        px += Math.cos(ang) * (d.s/4);
        py += Math.sin(ang) * (d.s/4);
        pts.push([px, py]);
      }
      d.pts = pts;
      break;
    }
    case 'ash':
      d.s = wrand(20, 46);
      d.c = 'rgba(120,110,112,0.16)';
      break;
    case 'sandPatch':
      d.s = wrand(40, 100);
      d.c = 'rgba(214,196,140,0.13)';
      break;
    case 'shell':

      d.c = 'rgba(240,232,214,0.40)';

function generateScenery(){
  sceneryDecals = [];
  sceneryProps  = [];
  sceneryStyle  = SCENERY_STYLES[MAP_SHAPE] || SCENERY_STYLES.square;
  const st = sceneryStyle;

  const areaScale = Math.max(0.14, ITEM_SCALE);
  const decalCount = Math.round(1700 * areaScale);
  const propCount  = Math.round(820  * areaScale);

  for(let i = 0; i < decalCount; i++){
    const p = scenerySpot(16);
    if(!p) continue;
    const kind = pickWeighted(st.decals);
    sceneryDecals.push(makeDecal(kind.t, p.x, p.y));
  }
  for(let i = 0; i < propCount; i++){
    const p = scenerySpot(36);
    if(!p) continue;
    const kind = pickWeighted(st.props);
    sceneryProps.push(makeProp(kind.t, p.x, p.y));
  }
}

function drawDecal(d){
  const x = d.x, y = d.y, s = d.s;
  switch(d.t){
    case 'crack': {
      ctx.strokeStyle = d.c;
      ctx.lineWidth = d.lw;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      const p = d.pts;
      ctx.moveTo(x + p[0][0], y + p[0][1]);
      for(let i = 1; i < p.length; i++) ctx.lineTo(x + p[i][0], y + p[i][1]);
      ctx.stroke();
      break;
    }
    case 'oil':
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.62, d.a, 0, TAU);
      ctx.fill();
      break;
    case 'paper':
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(d.a);
      ctx.fillStyle = d.c;
      ctx.fillRect(-s/2, -s/3, s, s*0.66);
      ctx.restore();
      break;
    case 'grassTuft':
    case 'dryTuft':
    case 'tuft': {
      ctx.strokeStyle = d.c;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      const n = d.n;
      for(let i = 0; i < n; i++){
        const ang = d.a + (i - (n-1)/2) * 0.30;
        ctx.beginPath();
        ctx.moveTo(x + (i - (n-1)/2) * 1.6, y);
        ctx.quadraticCurveTo(
          x + Math.cos(ang) * s * 0.45, y + Math.sin(ang) * s * 0.45,
          x + Math.cos(ang) * s,        y + Math.sin(ang) * s
        );
        ctx.stroke();
      }
      break;
    }
    case 'leaf':
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(d.a);
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, s, s * 0.42, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      break;
    case 'moss':
      ctx.fillStyle = d.c;
      for(let i = 0; i < 3; i++){
        const ang = d.a + i * 2.1;
        ctx.beginPath();
        ctx.arc(x + Math.cos(ang) * s * 0.5, y + Math.sin(ang) * s * 0.5, s * 0.55, 0, TAU);
        ctx.fill();
      }
      break;
    case 'sandWave':
      ctx.strokeStyle = d.c;
      ctx.lineWidth = 2;
      for(let i = 0; i < d.n; i++){
        const yy = y + i * 7 - (d.n-1) * 3;
        ctx.beginPath();
        ctx.moveTo(x - s, yy);
        ctx.quadraticCurveTo(x, yy - 9, x + s, yy);
        ctx.stroke();
      }
      break;
    case 'pebble':
      ctx.fillStyle = d.c;
      for(let i = 0; i < d.pts.length; i++){
        const p = d.pts[i];
        ctx.beginPath();
        ctx.arc(x + p[0], y + p[1], p[2], 0, TAU);
        ctx.fill();
      }
      break;
    case 'snowPatch':
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.6, d.a, 0, TAU);
      ctx.fill();
      break;
    case 'icePatch':
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.58, d.a, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, s * 0.62, s * 0.34, d.a, 0, TAU);
      ctx.stroke();
      break;
    case 'lavaCrack': {
      const p = d.pts;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x + p[0][0], y + p[0][1]);
      for(let i = 1; i < p.length; i++) ctx.lineTo(x + p[i][0], y + p[i][1]);
      ctx.strokeStyle = 'rgba(180,50,20,0.42)';
      ctx.lineWidth = d.lw * 2.4;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,140,40,0.80)';
      ctx.lineWidth = d.lw;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,140,0.55)';
      ctx.lineWidth = d.lw * 0.4;
      ctx.stroke();
      break;
    }
    case 'ash':
      ctx.fillStyle = d.c;
      for(let i = 0; i < 3; i++){
        const ang = d.a + i * 2.2;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(ang) * s * 0.6, y + Math.sin(ang) * s * 0.6,
                    s * 0.7, s * 0.45, ang, 0, TAU);
        ctx.fill();
      }
      break;
    case 'sandPatch':
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.7, d.a, 0, TAU);
      ctx.fill();
      break;
    case 'shell':
      ctx.strokeStyle = d.c;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, s, -2.6, -0.5);
      ctx.stroke();
      break;
  }
}

function drawProp(d){
  const x = d.x, y = d.y, s = d.s;

  if(d.t !== 'snowMound'){
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath();
    ctx.ellipse(x + s*0.18, y + s*0.10, s*0.85, s*0.34, 0, 0, TAU);
    ctx.fill();
  }

  switch(d.t){
    case 'rubble': {
      for(let i = 0; i < d.pts.length; i++){
        const p = d.pts[i];
        ctx.fillStyle = p[4];
        ctx.beginPath();
        ctx.ellipse(x + p[0], y + p[1], p[2], p[2]*0.72, p[3], 0, TAU);
        ctx.fill();
      }
      break;
    }
    case 'barrel': {
      const w = s * 0.9, h = s * 1.15;
      ctx.fillStyle = d.c;
      rr(ctx, x - w/2, y - h, w, h, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x - w/2 + 2, y - h + 2, w*0.28, h - 4);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - w/2, y - h*0.72); ctx.lineTo(x + w/2, y - h*0.72);
      ctx.moveTo(x - w/2, y - h*0.32); ctx.lineTo(x + w/2, y - h*0.32);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.ellipse(x, y - h, w/2, w*0.16, 0, 0, TAU);
      ctx.fill();
      break;
    }
    case 'pillar': {
      const w = s * 0.62, h = s * 1.7;
      ctx.fillStyle = '#464f59';
      ctx.fillRect(x - w/2, y - h, w, h);
      ctx.fillStyle = '#5a6570';
      ctx.fillRect(x - w/2, y - h, w*0.34, h);
      ctx.fillStyle = '#333b44';
      ctx.fillRect(x - w*0.75, y - h - s*0.16, w*1.5, s*0.18);
      break;
    }
    case 'pine': {
      const h = s * 1.9;
      ctx.fillStyle = '#33261a';
      ctx.fillRect(x - 2.5, y - s*0.28, 5, s*0.32);
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x + s*0.78, y - s*0.1);
      ctx.lineTo(x - s*0.78, y - s*0.1);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = d.c2;
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x + s*0.26, y - s*0.9);
      ctx.lineTo(x + s*0.02, y - s*0.35);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'bush': {
      for(let i = 0; i < d.pts.length; i++){
        const p = d.pts[i];
        ctx.fillStyle = p[3];
        ctx.beginPath();
        ctx.arc(x + p[0], y + p[1], p[2], 0, TAU);
        ctx.fill();
      }
      break;
    }
    case 'stump': {
      ctx.fillStyle = '#4e3a28';
      ctx.beginPath(); ctx.arc(x, y, s*0.44, 0, TAU); ctx.fill();
      ctx.fillStyle = '#8a6a4a';
      ctx.beginPath(); ctx.arc(x, y - s*0.06, s*0.36, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#5e4630';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y - s*0.06, s*0.2, 0, TAU); ctx.stroke();
      break;
    }
    case 'cactus': {
      ctx.fillStyle = d.c;
      rr(ctx, x - s*0.16, y - s*1.7,  s*0.32, s*1.7,  s*0.16); ctx.fill();
      rr(ctx, x - s*0.78, y - s*1.15, s*0.24, s*0.55, s*0.12); ctx.fill();
      rr(ctx, x - s*0.78, y - s*0.75, s*0.72, s*0.24, s*0.12); ctx.fill();
      rr(ctx, x + s*0.54, y - s*1.40, s*0.24, s*0.50, s*0.12); ctx.fill();
      rr(ctx, x + s*0.12, y - s*1.05, s*0.66, s*0.24, s*0.12); ctx.fill();
      break;
    }
    case 'rock': {
      ctx.fillStyle = d.c;
      ctx.beginPath();
      ctx.moveTo(x - s*0.90, y + s*0.10);
      ctx.lineTo(x - s*0.55, y - s*0.62);
      ctx.lineTo(x + s*0.05, y - s*0.88);
      ctx.lineTo(x + s*0.72, y - s*0.35);
      ctx.lineTo(x + s*0.88, y + s*0.12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = d.c2;
      ctx.beginPath();
      ctx.moveTo(x - s*0.55, y - s*0.62);
      ctx.lineTo(x + s*0.05, y - s*0.88);
      ctx.lineTo(x + s*0.02, y - s*0.10);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'deadwood': {
      ctx.strokeStyle = '#4a3a28';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - s*0.60, y + s*0.05);
      ctx.lineTo(x + s*0.25, y - s*0.75);
      ctx.moveTo(x + s*0.25, y - s*0.75);
      ctx.lineTo(x + s*0.70, y - s*0.55);
      ctx.moveTo(x - s*0.10, y - s*0.30);
      ctx.lineTo(x - s*0.30, y - s*0.95);
      ctx.stroke();
      break;
    }
    case 'snowPine': {
      const h = s * 1.9;
      ctx.fillStyle = '#3a2c20';
      ctx.fillRect(x - 2.5, y - s*0.30, 5, s*0.34);
      ctx.fillStyle = '#1d3a34';
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x + s*0.78, y - s*0.1);
      ctx.lineTo(x - s*0.78, y - s*0.1);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(226,242,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(x, y - h);
      ctx.lineTo(x + s*0.45, y - s*0.55);
      ctx.lineTo(x + s*0.12, y - s*0.62);
      ctx.lineTo(x - s*0.05, y - s*0.90);
      ctx.lineTo(x - s*0.32, y - s*0.52);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'snowRock': {
      ctx.fillStyle = '#3c4a58';
      ctx.beginPath();
      ctx.moveTo(x - s*0.90, y + s*0.10);
      ctx.lineTo(x - s*0.50, y - s*0.60);
      ctx.lineTo(x + s*0.10, y - s*0.85);
      ctx.lineTo(x + s*0.75, y - s*0.30);
      ctx.lineTo(x + s*0.85, y + s*0.12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(228,244,255,0.80)';
      ctx.beginPath();
      ctx.moveTo(x - s*0.50, y - s*0.60);
      ctx.lineTo(x + s*0.10, y - s*0.85);
      ctx.lineTo(x + s*0.65, y - s*0.32);
      ctx.lineTo(x + s*0.10, y - s*0.30);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'snowMound': {
      ctx.fillStyle = 'rgba(200,225,245,0.30)';
      ctx.beginPath();
      ctx.ellipse(x, y, s*1.10, s*0.62, d.a, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(240,250,255,0.22)';
      ctx.beginPath();
      ctx.ellipse(x - s*0.20, y - s*0.16, s*0.70, s*0.40, d.a, 0, TAU);
      ctx.fill();
      break;
    }
    case 'obsidian': {
      ctx.fillStyle = '#241c24';
      ctx.beginPath();
      ctx.moveTo(x - s*0.80, y + s*0.15);
      ctx.lineTo(x - s*0.40, y - s*0.70);
      ctx.lineTo(x + s*0.20, y - s*0.95);
      ctx.lineTo(x + s*0.80, y - s*0.20);
      ctx.lineTo(x + s*0.60, y + s*0.20);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#3b2c3c';
      ctx.beginPath();
      ctx.moveTo(x - s*0.40, y - s*0.70);
      ctx.lineTo(x + s*0.20, y - s*0.95);
      ctx.lineTo(x + s*0.10, y - s*0.10);
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'deadTree': {
      ctx.strokeStyle = '#3a2a22';
      ctx.lineWidth = Math.max(2, s*0.16);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - s*0.05, y - s*1.40);
      ctx.moveTo(x - s*0.05, y - s*1.00);
      ctx.lineTo(x - s*0.55, y - s*1.35);
      ctx.moveTo(x - s*0.05, y - s*1.15);
      ctx.lineTo(x + s*0.50, y - s*1.50);
      ctx.moveTo(x - s*0.05, y - s*0.70);
      ctx.lineTo(x + s*0.45, y - s*0.95);
      ctx.stroke();
      break;
    }
    case 'crystal': {
      ctx.fillStyle = 'rgba(255,130,50,0.08)';
      ctx.beginPath();
      ctx.arc(x, y - s*0.4, s*1.8, 0, TAU);
      ctx.fill();
      const shards = [[0, 1], [-0.55, 0.62], [0.55, 0.55]];
      for(let i = 0; i < shards.length; i++){
        const cx = x + shards[i][0] * s;
        const cy = y - s * 0.45 * shards[i][1];
        const w  = s * 0.28 * shards[i][1];
        const h  = s * 0.90 * shards[i][1];
        ctx.fillStyle = '#ff9a4a';
        ctx.beginPath();
        ctx.moveTo(cx, cy - h);
        ctx.lineTo(cx + w, cy);
        ctx.lineTo(cx, cy + h*0.35);
        ctx.lineTo(cx - w, cy);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,230,180,0.55)';
        ctx.beginPath();
        ctx.moveTo(cx, cy - h);
        ctx.lineTo(cx + w*0.40, cy);
        ctx.lineTo(cx, cy + h*0.35);
        ctx.closePath();
        ctx.fill();
      }
      break;
    }
    case 'palm': {
      const topX = x + s*0.12, topY = y - s*1.55;
      ctx.strokeStyle = '#6b5334';
      ctx.lineWidth = Math.max(3, s*0.17);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x - s*0.18, y - s*0.85, topX, topY);
      ctx.stroke();
      ctx.strokeStyle = d.c;
      ctx.lineWidth = Math.max(2.5, s*0.14);
      for(let i = 0; i < 6; i++){
        const a = -Math.PI/2 + (i - 2.5) * 0.62;
        ctx.beginPath();
        ctx.moveTo(topX, topY);
        ctx.quadraticCurveTo(
          topX + Math.cos(a) * s*0.75, topY + Math.sin(a) * s*0.75,
          topX + Math.cos(a) * s*1.35, topY + Math.sin(a) * s*1.35 + s*0.35
        );
        ctx.stroke();
      }
      ctx.fillStyle = '#5a4028';
      ctx.beginPath(); ctx.arc(topX - 4, topY + 5, 3.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(topX + 5, topY + 6, 3.0, 0, TAU); ctx.fill();
      break;
    }
    case 'reefRock': {
      ctx.fillStyle = '#2e3a3a';
      ctx.beginPath();
      ctx.moveTo(x - s*0.85, y + s*0.10);
      ctx.lineTo(x - s*0.45, y - s*0.55);
      ctx.lineTo(x + s*0.20, y - s*0.75);
      ctx.lineTo(x + s*0.75, y - s*0.15);
      ctx.lineTo(x + s*0.60, y + s*0.15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(120,160,150,0.25)';
      ctx.beginPath();
      ctx.moveTo(x - s*0.45, y - s*0.55);
      ctx.lineTo(x + s*0.20, y - s*0.75);
      ctx.lineTo(x + s*0.05, y - s*0.10);
      ctx.closePath();
      ctx.fill();
      break;
    }
  }
}

function drawScenery(arr, isDecal){
  const left = cam.x - 160, right = cam.x + W + 160;
  const top  = cam.y - 160, bottom = cam.y + H + 160;
  for(let i = 0; i < arr.length; i++){
    const d = arr[i];
    if(d.x < left || d.x > right || d.y < top || d.y > bottom) continue;
    if(isDecal) drawDecal(d); else drawProp(d);
  }
}

/* ============================================================
   迷雾
============================================================ */
function updateFog(){
  if(!player) return;
  visBuf.fill(0);
  const cx = player.x/CONFIG.CELL, cy = player.y/CONFIG.CELL;
  const cr = CONFIG.VIEW_R/CONFIG.CELL, cr2 = cr*cr;
  const x0 = Math.max(0, Math.floor(cx-cr)), x1 = Math.min(GW-1, Math.ceil(cx+cr));
  const y0 = Math.max(0, Math.floor(cy-cr)), y1 = Math.min(GH-1, Math.ceil(cy+cr));

  for(let gy=y0; gy<=y1; gy++){
    const dy = gy + 0.5 - cy;
    for(let gx=x0; gx<=x1; gx++){
      const dx = gx + 0.5 - cx;
      if(dx*dx + dy*dy <= cr2){
        const i = gy*GW + gx;
        visBuf[i] = 1;
        exploredBuf[i] = 1;
      }
    }
  }

  const d = fogData.data;
  for(let i=0, n=GW*GH; i<n; i++){
    const o = i*4;
    d[o] = 8; d[o+1] = 12; d[o+2] = 20;
    d[o+3] = visBuf[i] ? 0 : (exploredBuf[i] ? 145 : 255);
  }
  fogCtx.putImageData(fogData, 0, 0);
}

function isCellVisible(x, y){
  const gx = Math.floor(x/CONFIG.CELL), gy = Math.floor(y/CONFIG.CELL);
  if(gx<0 || gy<0 || gx>=GW || gy>=GH) return false;
  return visBuf[gy*GW + gx] === 1;
}

/* ============================================================
   碰撞
============================================================ */
function resolveWalls(ent){
  const near = getWallsInRange(ent.x - 60, ent.y - 60, ent.x + 60, ent.y + 60);
  for(let iter=0; iter<2; iter++){
    for(let i=0;i<near.length;i++){
      const w = near[i];
      const px = clamp(ent.x, w.x, w.x + w.w);
      const py = clamp(ent.y, w.y, w.y + w.h);
      const dx = ent.x - px, dy = ent.y - py;
      const d2 = dx*dx + dy*dy;
      if(d2 >= ent.r*ent.r) continue;

      if(d2 < 1e-6){
        const L = ent.x - w.x, R = (w.x+w.w) - ent.x;
        const T = ent.y - w.y, B = (w.y+w.h) - ent.y;
        const m = Math.min(L, R, T, B);
        if(m === L)      ent.x = w.x - ent.r;
        else if(m === R) ent.x = w.x + w.w + ent.r;
        else if(m === T) ent.y = w.y - ent.r;
        else             ent.y = w.y + w.h + ent.r;
      } else {
        const d = Math.sqrt(d2);
        const push = ent.r - d;
        ent.x += (dx/d) * push;
        ent.y += (dy/d) * push;
      }
    }
  }
  ent.x = clamp(ent.x, ent.r, WORLD_SIZE - ent.r);
  ent.y = clamp(ent.y, ent.r, WORLD_SIZE - ent.r);

  if(!isInMap(ent.x, ent.y)){
    const dirs = [
      [1,0], [-1,0], [0,1], [0,-1],
      [0.707,0.707], [-0.707,0.707], [0.707,-0.707], [-0.707,-0.707]
    ];
    let best = null, bestD = Infinity;
    for(const dir of dirs){
      for(let step = 6; step <= 400; step += 6){
        const nx = ent.x + dir[0] * step;
        const ny = ent.y + dir[1] * step;
        if(nx < 0 || ny < 0 || nx > WORLD_SIZE || ny > WORLD_SIZE) break;
        if(isInMap(nx, ny) && !inWall(nx, ny, ent.r)){
          if(step < bestD){ bestD = step; best = {x: nx, y: ny}; }
          break;
        }
      }
    }
    if(best){ ent.x = best.x; ent.y = best.y; }
  }
}

function resolveVehicleWalls(v){
  const near = getWallsInRange(v.x - 80, v.y - 80, v.x + 80, v.y + 80);
  let blocked = false;
  for(let i=0;i<near.length;i++){
    const w = near[i];
    const px = clamp(v.x, w.x, w.x + w.w);
    const py = clamp(v.y, w.y, w.y + w.h);
    const dx = v.x - px, dy = v.y - py;
    const d2 = dx*dx + dy*dy;
    if(d2 >= v.r*v.r) continue;
    blocked = true;
    if(d2 < 1e-6){
      const L = v.x - w.x, R = (w.x+w.w) - v.x;
      const T = v.y - w.y, B = (w.y+w.h) - v.y;
      const m = Math.min(L, R, T, B);
      if(m === L)      v.x = w.x - v.r;
      else if(m === R) v.x = w.x + w.w + v.r;
      else if(m === T) v.y = w.y - v.r;
      else             v.y = w.y + w.h + v.r;
    } else {
      const d = Math.sqrt(d2);
      const push = v.r - d;
      v.x += (dx/d) * push;
      v.y += (dy/d) * push;
    }
  }
  v.x = clamp(v.x, v.r, WORLD_SIZE - v.r);
  v.y = clamp(v.y, v.r, WORLD_SIZE - v.r);
  if(blocked){ v.vx *= 0.35; v.vy *= 0.35; v.speed *= 0.35; }
  return blocked;
}

function segRect(x0,y0,x1,y1,r){
  let t0 = 0, t1 = 1;
  const dx = x1-x0, dy = y1-y0;
  const p = [-dx, dx, -dy, dy];
  const q = [x0-r.x, r.x+r.w-x0, y0-r.y, r.y+r.h-y0];
  for(let i=0;i<4;i++){
    if(Math.abs(p[i]) < 1e-9){
      if(q[i] < 0) return false;
    } else {
      const t = q[i]/p[i];
      if(p[i] < 0){
        if(t > t1) return false;
        if(t > t0) t0 = t;
      } else {
        if(t < t0) return false;
        if(t < t1) t1 = t;
      }
    }
  }
  return true;
}

function segCircle(x0,y0,x1,y1,cx,cy,r){
  const dx = x1-x0, dy = y1-y0;
  const fx = x0-cx, fy = y0-cy;
  const a  = dx*dx + dy*dy;
  if(a < 1e-9) return fx*fx + fy*fy <= r*r;
  let t = -(fx*dx + fy*dy) / a;
  t = clamp(t, 0, 1);
  const px = x0 + dx*t - cx, py = y0 + dy*t - cy;
  return px*px + py*py <= r*r;
}

function hasLOS(x0, y0, x1, y1){
  const near = getWallsInRange(x0, y0, x1, y1);
  for(const w of near){
    if(segRect(x0, y0, x1, y1, w)) return false;
  }
  return true;
}

/* ============================================================
   射击 / 伤害
============================================================ */
function tryShoot(ent, angle, spreadMul){
  if(ent.fireCd > 0 || !ent.weapon || ent.ammo <= 0) return false;
  const w = WEAPONS[ent.weapon];
  if(!w) return false;

  const pellets = ent.scatter ? SCATTER_PELLETS : 1;
  if(ent.ammo < pellets) return false;   // 子弹不足 3 发时无法开火

  ent.fireCd = w.rate;
  ent.ammo -= pellets;

  const spread = w.spread * (spreadMul || 1);

  for(let p = 0; p < pellets; p++){
    let off;
    if(pellets === 1){
      off = (Math.random() - 0.5) * spread;
    } else {
      /* 3 颗弹丸：中间一颗 + 左右各一颗 */
      off = (p - (pellets - 1) / 2) * SCATTER_SPREAD
          + (Math.random() - 0.5) * spread * 0.5;
    }
    const a  = angle + off;
    const bx = ent.x + Math.cos(a) * (ent.r + 8);
    const by = ent.y + Math.sin(a) * (ent.r + 8);

    bullets.push({
      x:bx, y:by,
      vx: Math.cos(a) * w.speed,
      vy: Math.sin(a) * w.speed,
      dmg: w.dmg, owner: ent, life: 1.6,
      color: ent.scatter ? '#ffb060' : w.color
    });
  }
  return true;
}

function damage(e, dmg, attacker){
  if(!e.alive) return;
  const real = dmg * (1 - damageReduction(e));
  const applied = Math.min(real, Math.max(0, e.hp));
  e.hp -= real;
  e.hurtFlash = 0.16;

  if(attacker && attacker !== e) attacker.dmgDealt += applied;
  if(e === player) player.dmgTaken += applied;

  if(e.hp <= 0){ e.hp = 0; killEntity(e, attacker); }
}

function killEntity(e, killer){
  if(!e.alive) return;
  e.alive = false;
  if(killer && killer !== e) killer.kills++;
  if(e.inCar){ e.inCar.driver = null; e.inCar = null; }

  let aliveAfter = 0;
  for(const x of entities) if(x.alive) aliveAfter++;
  e.rank = aliveAfter + 1;

  if(e.weapon){
    addItem('weapon', e.x + rand(-20,20), e.y + rand(-20,20), {wkey: e.weapon});
    if(e.ammo > 0)
      addItem('ammo', e.x + rand(-20,20), e.y + rand(-20,20), {amount: e.ammo});
  }
  if(e.bandage > 0) addItem('bandage', e.x + rand(-24,24), e.y + rand(-24,24));
  if(e.medkit  > 0) addItem('medkit',  e.x + rand(-24,24), e.y + rand(-24,24));
  if(e.drink   > 0) addItem('drink',   e.x + rand(-24,24), e.y + rand(-24,24));
  if(e.grenade > 0) addItem('grenade', e.x + rand(-24,24), e.y + rand(-24,24));
  if(e.scatter)     addItem('scatter', e.x + rand(-26,26), e.y + rand(-26,26));
  if(e.backpack > 0) addItem('backpack', e.x + rand(-26,26), e.y + rand(-26,26), {level:e.backpack});
  if(e.armor    > 0) addItem('armor',    e.x + rand(-26,26), e.y + rand(-26,26), {level:e.armor});
  if(e.helmet   > 0) addItem('helmet',   e.x + rand(-26,26), e.y + rand(-26,26), {level:e.helmet});
}

/* ============================================================
   手雷
============================================================ */
function throwGrenade(ent, tx, ty){
  if(ent.throwCd > 0 || ent.grenade <= 0) return false;
  ent.throwCd = 0.9;
  ent.grenade--;

  let angle, speed;
  if(tx !== undefined && ty !== undefined){
    /* 朝目标点投掷：根据空气阻力反推初速，使手雷在引信结束时落在目标点附近 */
    const dx = tx - ent.x, dy = ty - ent.y;
    const dist = Math.hypot(dx, dy);
    angle = dist > 1 ? Math.atan2(dy, dx) : ent.angle;
    const launch = Math.max(0, dist - 22);           // 减去出生点偏移
    const k = GRENADE_DRAG;
    const decay = (1 - Math.exp(-k * GRENADE_FUSE)) / k;
    speed = clamp(launch / decay, 220, 3000);
  } else {
    angle = ent.angle;
    speed = GRENADE_SPEED;
  }

  grenades.push({
    x: ent.x + Math.cos(angle) * 22,
    y: ent.y + Math.sin(angle) * 22,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    timer: GRENADE_FUSE, owner: ent, r: 6
  });
  return true;
}

function explodeGrenade(g){
  explosions.push({x:g.x, y:g.y, t:0, dur:0.5, maxR:GRENADE_RADIUS});
  for(const e of entities){
    if(!e.alive) continue;
    const d = Math.hypot(e.x-g.x, e.y-g.y);
    if(d > GRENADE_RADIUS) continue;
    /* 手雷可穿墙，爆炸伤害不受墙体遮挡 */
    const dmg = GRENADE_DMG_MIN + (GRENADE_DMG_MAX-GRENADE_DMG_MIN) * (1 - d/GRENADE_RADIUS);
    damage(e, dmg, g.owner);
  }
}

function updateGrenades(dt){
  for(let i=grenades.length-1; i>=0; i--){
    const g = grenades[i];
    g.timer -= dt;
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    g.vx *= Math.max(0, 1 - GRENADE_DRAG*dt);
    g.vy *= Math.max(0, 1 - GRENADE_DRAG*dt);
    /* 只做世界边界限制，可自由穿过墙体 */
    if(g.x < 6){ g.x = 6; g.vx = 0; }
    if(g.y < 6){ g.y = 6; g.vy = 0; }
    if(g.x > WORLD_SIZE-6){ g.x = WORLD_SIZE-6; g.vx = 0; }
    if(g.y > WORLD_SIZE-6){ g.y = WORLD_SIZE-6; g.vy = 0; }
    if(g.timer <= 0){
      explodeGrenade(g);
      grenades.splice(i, 1);
    }
  }
  for(let i=explosions.length-1; i>=0; i--){
    explosions[i].t += dt;
    if(explosions[i].t > explosions[i].dur) explosions.splice(i, 1);
  }
}

/* ============================================================
   拾取 / 使用
============================================================ */
function pickupItem(ent, it){
  if(!it || it.removed) return false;

  switch(it.type){
    case 'weapon': {
      if(ent.weapon === it.wkey) return false;
      if(ent.weapon){
        addItem('weapon', ent.x + rand(-28,28), ent.y + rand(-28,28), {wkey: ent.weapon});
      }
      ent.weapon = it.wkey;
      markRemoved(it);
      ent.pickupCd = 1.0;
      return true;
    }
    case 'ammo': {
      const free = freeCap(ent);
      if(free <= 0) return false;
      const curUnits = Math.ceil(ent.ammo / AMMO_PER_UNIT);
      const maxAmmo  = (curUnits + free) * AMMO_PER_UNIT;
      const take = Math.min(it.amount, maxAmmo - ent.ammo);
      if(take <= 0) return false;
      ent.ammo += take;
      it.amount -= take;
      if(it.amount <= 0) markRemoved(it);
      return true;
    }
    case 'bandage':
    case 'drink':
    case 'grenade': {
      if(!ensureSpace(ent, ITEM_WEIGHT[it.type])) return false;
      ent[it.type]++;
      markRemoved(it);
      return true;
    }
    case 'medkit': {
      if(!ensureSpace(ent, ITEM_WEIGHT.medkit)) return false;
      ent.medkit++;
      markRemoved(it);
      return true;
    }
    case 'scatter': {
      /* 散弹弹丸：不占背包格 */
      if(ent.scatter) return false;
      ent.scatter = true;
      markRemoved(it);
      return true;
    }
    case 'backpack': {
      if(it.level <= ent.backpack) return false;
      ent.backpack = it.level;
      markRemoved(it);
      return true;
    }
    case 'armor': {
      if(it.level <= ent.armor) return false;
      ent.armor = it.level;
      markRemoved(it);
      return true;
    }
    case 'helmet': {
      if(it.level <= ent.helmet) return false;
      ent.helmet = it.level;
      markRemoved(it);
      return true;
    }
  }
  return false;
}

function findNearbyItem(ent, radius){
  let best = null, bd = radius;
  for(const it of items){
    if(!it || it.removed) continue;
    const d = Math.hypot(it.x-ent.x, it.y-ent.y);
    if(d < bd){ bd = d; best = it; }
  }
  return best;
}

function pickupBest(ent, radius){
  const list = [];
  for(const it of items){
    if(!it || it.removed) continue;
    const d = Math.hypot(it.x-ent.x, it.y-ent.y);
    if(d < radius) list.push({it, d});
  }
  list.sort((a, b)=>{
    const aw = a.it.type === 'weapon' ? 0 : 1;
    const bw = b.it.type === 'weapon' ? 0 : 1;
    if(aw !== bw) return aw - bw;
    return a.d - b.d;
  });
  for(const o of list){
    if(pickupItem(ent, o.it)) return o.it;
  }
  return null;
}

function findPickupHint(ent, radius){
  let bestW = null, bestWd = radius;
  let best = null, bd = radius;
  for(const it of items){
    if(!it || it.removed) continue;
    const d = Math.hypot(it.x-ent.x, it.y-ent.y);
    if(d >= radius) continue;
    if(d < bd){ bd = d; best = it; }
    if(it.type === 'weapon' && it.wkey !== ent.weapon && d < bestWd){
      bestWd = d;
      bestW = it;
    }
  }
  return bestW || best;
}

function shouldAutoPickup(ent, it){
  switch(it.type){
    case 'weapon':
      if(!ent.weapon) return true;
      return WEAPONS[it.wkey].dmg > WEAPONS[ent.weapon].dmg;
    case 'scatter':  return !ent.scatter;
    case 'backpack': return it.level > ent.backpack;
    case 'armor':    return it.level > ent.armor;
    case 'helmet':   return it.level > ent.helmet;
    default:         return true;
  }
}

function autoPickupTick(ent){
  if(ent.pickupCd > 0) return; 
  if(ent === player && autoPickupSuppress > 0) return;
  for(let i=0; i<items.length; i++){
    const it = items[i];
    if(!it || it.removed) continue;
    if(!settings.autoPickup[it.type]) continue;
    const dx = it.x - ent.x, dy = it.y - ent.y;
    if(dx*dx + dy*dy > 1296) continue;
    if(!shouldAutoPickup(ent, it)) continue;
    pickupItem(ent, it);
  }
}

function useBandage(ent){
  if(ent.useCd > 0 || ent.bandage <= 0 || ent.hp >= ent.maxHp) return false;
  ent.bandage--; ent.useCd = 0.8;
  ent.hp = Math.min(ent.maxHp, ent.hp + HEAL_AMOUNT.bandage);
  return true;
}
function useMedkit(ent){
  if(ent.useCd > 0 || ent.medkit <= 0 || ent.hp >= ent.maxHp) return false;
  ent.medkit--; ent.useCd = 1.4;
  ent.hp = ent.maxHp;
  return true;
}
function useDrink(ent){
  if(ent.useCd > 0 || ent.drink <= 0) return false;
  ent.drink--; ent.useCd = 0.8;
  ent.hp = Math.min(ent.maxHp, ent.hp + HEAL_AMOUNT.drink);
  ent.speedBoost = DRINK_BOOST_TIME;
  return true;
}

/* 自动治疗：优先绷带，只有损失血量 >= 治疗量时才使用 */
function autoHealTick(ent){
  if(!settings.autoHeal || !ent.alive || ent.useCd > 0) return;
  const loss = ent.maxHp - ent.hp;
  if(loss <= 0) return;

  // 1) 优先绷带
  if(ent.bandage > 0 && loss >= HEAL_AMOUNT.bandage){
    if(useBandage(ent)) return;
  }
  // 2) 医疗包：回复量随损失变化，血量低于一半时才用
  if(ent.medkit > 0 && loss >= 50){
    if(useMedkit(ent)) return;
  }
  // 3) 饮料：损失 >= 15，且当前没有加速效果
  if(ent.drink > 0 && loss >= HEAL_AMOUNT.drink && ent.speedBoost <= 0){
    if(useDrink(ent)) return;
  }
}

/* 丢弃物品（本地/房主直接调用；客户端会转成网络消息） */
function dropItemFromEntity(ent, kind){
  if(!ent || !ent.alive) return false;
  switch(kind){
    case 'ammo': {
      if(ent.ammo <= 0) return false;
      const drop = Math.min(ent.ammo, AMMO_PER_UNIT);
      ent.ammo -= drop;
      addItem('ammo', ent.x + rand(-20,20), ent.y + rand(-20,20), {amount: drop});
      ent.pickupCd = 1.0;
      return true;
    }
    case 'bandage': {
      if(ent.bandage <= 0) return false;
      ent.bandage--;
      addItem('bandage', ent.x + rand(-20,20), ent.y + rand(-20,20));
      ent.pickupCd = 1.0;
      return true;
    }
    case 'medkit': {
      if(ent.medkit <= 0) return false;
      ent.medkit--;
      addItem('medkit', ent.x + rand(-20,20), ent.y + rand(-20,20));
      ent.pickupCd = 1.0;
      return true;
    }
    case 'drink': {
      if(ent.drink <= 0) return false;
      ent.drink--;
      addItem('drink', ent.x + rand(-20,20), ent.y + rand(-20,20));
      ent.pickupCd = 1.0;
      return true;
    }
    case 'grenade': {
      if(ent.grenade <= 0) return false;
      ent.grenade--;
      addItem('grenade', ent.x + rand(-20,20), ent.y + rand(-20,20));
      ent.pickupCd = 1.0;
      return true;
    }
    case 'scatter': {
      if(!ent.scatter) return false;
      ent.scatter = false;
      addItem('scatter', ent.x + rand(-20,20), ent.y + rand(-20,20));
      ent.pickupCd = 1.0;
      return true;
    }
  }
  return false;
}

/* ============================================================
   车辆
============================================================ */
function nearestVehicle(ent, maxD){
  let best = null, bd = maxD;
  for(const v of vehicles){
    if(v.driver) continue;
    const d = Math.hypot(v.x-ent.x, v.y-ent.y);
    if(d < bd){ bd = d; best = v; }
  }
  return best;
}

function enterVehicle(ent, v){
  if(ent.inCar || v.driver || !ent.alive) return false;
  ent.inCar = v;
  v.driver = ent;
  ent.x = v.x; ent.y = v.y;
  return true;
}

function exitVehicle(ent){
  if(!ent.inCar) return false;
  const v = ent.inCar;
  const a = v.angle + Math.PI/2;
  let placed = false;
  for(const off of [40, -40, 40*Math.SQRT1_2, -40*Math.SQRT1_2]){
    const ox = v.x + Math.cos(a) * off;
    const oy = v.y + Math.sin(a) * off;
    if(!inWall(ox, oy, 16) && isInMap(ox, oy)){
      ent.x = ox; ent.y = oy;
      placed = true;
      break;
    }
  }
  if(!placed){
    for(const dir of [[1,0],[-1,0],[0,1],[0,-1]]){
      for(let s=30; s<=120; s+=20){
        const ox = v.x + dir[0]*s, oy = v.y + dir[1]*s;
        if(isInMap(ox, oy) && !inWall(ox, oy, 16)){
          ent.x = ox; ent.y = oy;
          placed = true;
          break;
        }
      }
      if(placed) break;
    }
  }
  if(!placed){ ent.x = v.x; ent.y = v.y; }
  v.driver = null;
  ent.inCar = null;
  return true;
}

function updateVehicles(dt){
  for(const v of vehicles){
    for(const k in v.ramCd){
      v.ramCd[k] -= dt;
      if(v.ramCd[k] <= 0) delete v.ramCd[k];
    }

    if(v.driver && v.driver.alive){
      const ent = v.driver;
      const inp = ent.input || {};
      let dx = inp.dx || 0, dy = inp.dy || 0;

      if(dx || dy){
        const l = Math.hypot(dx, dy);
        const tvx = dx/l * VEHICLE.maxSpeed;
        const tvy = dy/l * VEHICLE.maxSpeed;
        const accel = Math.min(1, VEHICLE.accel * dt / VEHICLE.maxSpeed);
        v.vx += (tvx - v.vx) * accel;
        v.vy += (tvy - v.vy) * accel;
        v.angle = Math.atan2(v.vy, v.vx);
      } else {
        const f = Math.max(0, 1 - VEHICLE.friction * dt);
        v.vx *= f;
        v.vy *= f;
        if(Math.hypot(v.vx, v.vy) < 8){ v.vx = 0; v.vy = 0; }
      }

      v.x += v.vx * dt;
      v.y += v.vy * dt;
      v.speed = Math.hypot(v.vx, v.vy);

      resolveVehicleWalls(v);

      if(!isInMap(v.x, v.y)){
        const cx = WORLD_SIZE/2, cy = WORLD_SIZE/2;
        v.x += (cx - v.x) * 0.05;
        v.y += (cy - v.y) * 0.05;
        v.vx *= 0.4; v.vy *= 0.4;
      }

      ent.x = v.x;
      ent.y = v.y;

      if(v.speed > VEHICLE.ramDamageMinSpeed){
        for(const e of entities){
          if(!e.alive || e === ent) continue;
          if(v.ramCd[e.id]) continue;
          const d = Math.hypot(e.x - v.x, e.y - v.y);
          if(d < v.r + e.r + 6){
            const dmg = (v.speed - VEHICLE.ramDamageMinSpeed) * 0.55 + 30;
            damage(e, dmg, ent);
            v.ramCd[e.id] = VEHICLE.ramCooldown;
            v.vx *= 0.82; v.vy *= 0.82;
          }
        }
      }
    } else {
      const f = Math.max(0, 1 - VEHICLE.friction * dt * 2);
      v.vx *= f; v.vy *= f;
      if(Math.hypot(v.vx, v.vy) < 5){ v.vx = 0; v.vy = 0; }
      v.x += v.vx * dt;
      v.y += v.vy * dt;
      v.speed = Math.hypot(v.vx, v.vy);
      if(v.speed > 0.5) resolveVehicleWalls(v);
    }
  }
}

/* ============================================================
   人类玩家输入 → 实体（本地与远端共用）
============================================================ */
function applyHumanInput(ent, inp, dt){
  if(!ent.alive) return;
  inp = inp || {};

  if(ent.inCar){
    ent.angle = inp.aim || 0;
    if(inp.fire) tryShoot(ent, ent.angle, 1);
    return;
  }

  let dx = inp.dx || 0, dy = inp.dy || 0;
  if(dx || dy){
    const l = Math.hypot(dx, dy);
    const sp = ent.speed * (ent.speedBoost > 0 ? 1.35 : 1);
    ent.x += dx/l * sp * dt;
    ent.y += dy/l * sp * dt;
  }
  resolveWalls(ent);

  ent.angle = inp.aim || ent.angle;
  if(inp.fire) tryShoot(ent, ent.angle, 1);

  autoPickupTick(ent);
  autoHealTick(ent);
}

function updateLocalInput(dt){
  if(!player || !player.alive) return;
  const inp = player.input;

  let dx = 0, dy = 0;
  if(!bpUI.open){
    if(keys['w'] || keys['arrowup'])    dy--;
    if(keys['s'] || keys['arrowdown'])  dy++;
    if(keys['a'] || keys['arrowleft'])  dx--;
    if(keys['d'] || keys['arrowright']) dx++;
  }

  inp.dx = dx;
  inp.dy = dy;
  inp.aim = Math.atan2((mouse.y + cam.y) - player.y,
                       (mouse.x + cam.x) - player.x);
  inp.fire = mouse.down && !bpUI.open;

  applyHumanInput(player, inp, dt);
}

/* ============================================================
   AI
============================================================ */
function getAIParams(){
  const lv = settings.aiLevel;
  return {
    visionR:   380 + (lv-1) * 90,
    speedMul:  0.85 + (lv-1) * 0.06,
    spreadMul: 1.50 - (lv-1) * 0.22,
  };
}

function itemScore(ai, it){
  const dist = Math.hypot(it.x-ai.x, it.y-ai.y);
  let s = 1;
  if(it.type === 'weapon'){
    if(!ai.weapon) s = 4;
    else if(WEAPONS[it.wkey].dmg > WEAPONS[ai.weapon].dmg) s = 2.2;
    else s = 0.05;
  } else if(it.type === 'ammo'){
    s = ai.ammo < 60 ? 3.0 : (ai.ammo < 140 ? 1.0 : 0.1);
  } else if(it.type === 'scatter'){
    s = ai.scatter ? 0.02 : 1.4;
  } else if(it.type === 'armor'){
    s = it.level > ai.armor ? 3.0 : 0.02;
  } else if(it.type === 'helmet'){
    s = it.level > ai.helmet ? 3.0 : 0.02;
  } else if(it.type === 'backpack'){
    s = it.level > ai.backpack ? 2.6 : 0.02;
  } else if(it.type === 'medkit'){
    s = ai.medkit < 2 ? 1.6 : 0.15;
  } else if(it.type === 'bandage'){
    s = ai.bandage < 5 ? 1.6 : 0.15;
  } else if(it.type === 'drink'){
    s = ai.drink < 3 ? 1.3 : 0.15;
  } else if(it.type === 'grenade'){
    s = ai.grenade < 2 ? 1.3 : 0.05;
  }
  return dist / Math.max(0.05, s);
}

function nearestItem(ai, maxD){
  let best = null, bs = Infinity;
  for(const it of items){
    if(!it || it.removed) continue;
    const d = Math.hypot(it.x-ai.x, it.y-ai.y);
    if(d > maxD) continue;
    const s = itemScore(ai, it);
    if(s < bs){ bs = s; best = it; }
  }
  return best;
}

function moveTowards(ent, tx, ty, dt, spd){
  const dx = tx-ent.x, dy = ty-ent.y;
  const d = Math.hypot(dx, dy);
  if(d < 2) return;
  ent.x += dx/d * spd * dt;
  ent.y += dy/d * spd * dt;
}

function updateAI(ai, dt){
  if(!ai.alive) return;

  const P = getAIParams();
  const spd = ai.speed * P.speedMul * (ai.speedBoost > 0 ? 1.35 : 1);
  const distZone = Math.hypot(ai.x-zone.cx, ai.y-zone.cy);
  const inZone = distZone <= zone.r * 0.88;

  ai.lastX = ai.x; ai.lastY = ai.y;
  if(ai.stuckT > 0) ai.stuckT -= dt;
  if(ai.itemSearchCd > 0) ai.itemSearchCd -= dt;

  let enemy = null, enemyD = 1e9;
  for(const e of entities){
    if(e === ai || !e.alive) continue;
    const d = Math.hypot(e.x-ai.x, e.y-ai.y);
    if(d < P.visionR && d < enemyD){ enemyD = d; enemy = e; }
  }

  if(ai.hp < 55 && ai.useCd <= 0){
    if(useMedkit(ai))  return;
    if(useBandage(ai)) return;
    if(useDrink(ai))   return;
  }

  if(!inZone && !(enemy && ai.weapon && ai.ammo > 0)){
    moveTowards(ai, zone.cx + rand(-zone.r*0.2, zone.r*0.2),
                    zone.cy + rand(-zone.r*0.2, zone.r*0.2), dt, spd);
    resolveWalls(ai);
    return;
  }

  if(enemy && ai.weapon && ai.ammo > 0){
    const ang = Math.atan2(enemy.y-ai.y, enemy.x-ai.x);
    const los = hasLOS(ai.x, ai.y, enemy.x, enemy.y);

    if(!los){
      if(Math.random() < 0.012) ai.strafeDir *= -1;
      const perp = ang + Math.PI/2 * ai.strafeDir;
      ai.x += Math.cos(perp) * spd * 0.95 * dt;
      ai.y += Math.sin(perp) * spd * 0.95 * dt;
      moveTowards(ai, enemy.x, enemy.y, dt, spd * 0.45);
      resolveWalls(ai);
      ai.angle = ang;
      return;
    }

    ai.angle = ang + (Math.random()-0.5) * 0.08;
    const ideal = ai.weapon === 'sniper' ? 520 :
                  ai.weapon === 'smg'    ? 200 : 340;

    if(enemyD > ideal * 1.2){
      moveTowards(ai, enemy.x, enemy.y, dt, spd);
    } else if(enemyD < ideal * 0.65){
      moveTowards(ai, ai.x + (ai.x-enemy.x), ai.y + (ai.y-enemy.y), dt, spd);
    } else {
      if(Math.random() < 0.012) ai.strafeDir *= -1;
      ai.x += Math.cos(ang + Math.PI/2) * spd * 0.8 * ai.strafeDir * dt;
      ai.y += Math.sin(ang + Math.PI/2) * spd * 0.8 * ai.strafeDir * dt;
    }
    resolveWalls(ai);

    if(ai.grenade > 0 && ai.throwCd <= 0 &&
       enemyD > 150 && enemyD < 420 && Math.random() < 0.006){
      throwGrenade(ai,
        enemy.x + rand(-50, 50),
        enemy.y + rand(-50, 50));
    }

    if(enemyD < 780 && los) tryShoot(ai, ai.angle, P.spreadMul);
    return;
  }

  if(ai.targetItem && ai.targetItem.removed) ai.targetItem = null;
  if(!ai.targetItem && ai.itemSearchCd <= 0){
    if(!ai.weapon || ai.ammo <= 0 || Math.random() < 0.3){
      ai.targetItem = nearestItem(ai, 1600);
      ai.itemSearchCd = 0.8;
    }
  }

  if(ai.targetItem){
    moveTowards(ai, ai.targetItem.x, ai.targetItem.y, dt, spd);
    resolveWalls(ai);
    if(Math.hypot(ai.x-ai.targetItem.x, ai.y-ai.targetItem.y) < 34){
      pickupItem(ai, ai.targetItem);
      ai.targetItem = null;
    }
    return;
  }

  ai.thinkCd -= dt;
  if(!ai.wander || ai.wanderT <= 0 ||
     Math.hypot(ai.x-ai.wander.x, ai.y-ai.wander.y) < 45){
    ai.wander = {
      x: clamp(zone.cx + rand(-zone.r*0.7, zone.r*0.7), 130, WORLD_SIZE-130),
      y: clamp(zone.cy + rand(-zone.r*0.7, zone.r*0.7), 130, WORLD_SIZE-130)
    };
    ai.wanderT = rand(3, 6);
  }
  ai.wanderT -= dt;
  moveTowards(ai, ai.wander.x, ai.wander.y, dt, spd * 0.85);
  resolveWalls(ai);

  if(Math.hypot(ai.x-ai.lastX, ai.y-ai.lastY) < 6 * dt && ai.stuckT <= 0){
    ai.stuckT = 1.2;
    ai.wander.x = clamp(ai.x + rand(-400, 400), 130, WORLD_SIZE-130);
    ai.wander.y = clamp(ai.y + rand(-400, 400), 130, WORLD_SIZE-130);
    ai.wanderT = 3;
  }

  if(ai.thinkCd <= 0){
    ai.thinkCd = 0.45;
    const it = findNearbyItem(ai, 64);
    if(it) pickupItem(ai, it);
    else if(ai.hp < 82 && ai.useCd <= 0) useDrink(ai);
  }
}

/* ============================================================
   子弹
============================================================ */
function updateBullets(dt){
  for(let i=bullets.length-1; i>=0; i--){
    const b = bullets[i];
    const x0 = b.x, y0 = b.y;
    const x1 = b.x + b.vx*dt;
    const y1 = b.y + b.vy*dt;
    b.x = x1; b.y = y1;
    b.life -= dt;

    let dead = (b.life <= 0) ||
               (x1 < 0 || y1 < 0 || x1 > WORLD_SIZE || y1 > WORLD_SIZE);

    if(!dead){
      const near = getWallsInRange(x0, y0, x1, y1);
      for(let k=0;k<near.length;k++){
        if(segRect(x0, y0, x1, y1, near[k])){ dead = true; break; }
      }
    }

    if(!dead){
      for(const e of entities){
        if(!e.alive || e === b.owner) continue;
        if(segCircle(x0, y0, x1, y1, e.x, e.y, e.r)){
          damage(e, b.dmg, b.owner);
          dead = true;
          break;
        }
      }
    }
    if(dead) bullets.splice(i, 1);
  }
}

/* ============================================================
   毒圈
============================================================ */
function updateZone(dt){
  const ph = ZONE_PHASES[zone.phaseIdx];
  if(!ph) return;
  zone.t -= dt;

  if(zone.state === 'wait'){
    if(zone.t <= 0){
      zone.state = 'shrink';
      zone.t = ph.shrink;
      zone.shrinkTotal = ph.shrink;
      zone.fromR = zone.r;
      // 最后一个阶段直接缩到 0，其余阶段保留原来的最小半径
      const isLastPhase = zone.phaseIdx === ZONE_PHASES.length - 1;
      zone.toR = isLastPhase ? 0 : Math.max(WORLD_SIZE * 0.045, zone.r * ph.ratio);
      zone.fromX = zone.cx; zone.fromY = zone.cy;

      const maxOff = isLastPhase ? 0 : Math.max(0, zone.r - zone.toR) * 0.8;
      const a = rand(0, TAU), off = rand(0, maxOff);
      zone.toX = clamp(zone.cx + Math.cos(a)*off, zone.toR, WORLD_SIZE-zone.toR);
      zone.toY = clamp(zone.cy + Math.sin(a)*off, zone.toR, WORLD_SIZE-zone.toR);
      zone.dmg = ph.dmg;
    }
  } else {
    const k = 1 - Math.max(0, zone.t) / zone.shrinkTotal;
    zone.r  = zone.fromR + (zone.toR - zone.fromR) * k;
    zone.cx = zone.fromX + (zone.toX - zone.fromX) * k;
    zone.cy = zone.fromY + (zone.toY - zone.fromY) * k;

    if(zone.t <= 0){
      zone.state = 'wait';
      zone.phaseIdx++;
      const nph = ZONE_PHASES[zone.phaseIdx];
      if(nph) zone.t = nph.wait;
    }
  }
}

const net = {

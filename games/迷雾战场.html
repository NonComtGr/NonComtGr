  hostConn: null,         // client
  roomCode: '',
  myPlayerId: 1,
  started: false,
  connected: false,
  snapTimer: 0,
  inputTimer: 0,
  removedList: [],
  removedSent: 0,
  newItems: [],
  totalPlayers: 100,
  humanCount: 1,
  mySlot: 0,
  finished: false,
  pingTimer: 0,
};

let peerLibState = 0; // 0 未加载 1 加载中 2 已加载 3 失败
const peerLibCbs = [];
function loadPeerJS(cb){
  if(window.Peer){ peerLibState = 2; cb(true); return; }
  peerLibCbs.push(cb);
  if(peerLibState === 1) return;
  if(peerLibState === 3){ cb(false); return; }
  peerLibState = 1;
  const s = document.createElement('script');
  s.src = PEER_CDN;
  s.onload = function(){
    peerLibState = 2;
    while(peerLibCbs.length) peerLibCbs.shift()(true);
  };
  s.onerror = function(){
    peerLibState = 3;
    while(peerLibCbs.length) peerLibCbs.shift()(false);
  };
  document.head.appendChild(s);
}

function randomRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function netReset(){
  try{ if(net.hostConn) net.hostConn.close(); }catch(e){}
  for(const c of net.conns){ try{ c.conn.close(); }catch(e){} }
  try{ if(net.peer) net.peer.destroy(); }catch(e){}
  net.mode = 'offline';
  net.peer = null;
  net.conns = [];
  net.hostConn = null;
  net.roomCode = '';
  net.started = false;
  net.connected = false;
  net.finished = false;
  net.removedList = [];
  net.removedSent = 0;
  net.newItems = [];
  net.myPlayerId = 1;
  net.mySlot = 0;
}

/* ---------- 房主 ---------- */
function createRoom(){
  const code = randomRoomCode();
  const total = parseInt(document.getElementById('s-online-total').value, 10) || 100;
  const mapShape = document.getElementById('s-online-map').value;

  netReset();
  net.mode = 'host';
  net.roomCode = code;
  net.totalPlayers = total;
  net.mapShape = mapShape;

  setRoomStatus('正在连接信令服务器…');
  showRoomView(true);
  document.getElementById('room-code-val').textContent = code;
  document.getElementById('btnRoomStart').disabled = true;

  loadPeerJS(function(ok){
    if(!ok){
      setRoomStatus('无法加载联机库，请检查网络后重试', true);
      return;
    }
    let peer;
    try{
      peer = new Peer(NET_PREFIX + code, { debug: 0 });
    }catch(err){
      setRoomStatus('创建房间失败：' + err.message, true);
      return;
    }
    net.peer = peer;

    peer.on('open', function(){
      setRoomStatus('等待玩家加入…（至少 1 人可直接开始）');
      document.getElementById('btnRoomStart').disabled = false;
      refreshRoomPlayers();
    });

    peer.on('connection', function(conn){
      if(net.started){
        try{ conn.close(); }catch(e){}
        return;
      }
      if(net.conns.length >= 9){
        try{ conn.close(); }catch(e){}
        return;
      }
      const slot = net.conns.length + 1;
      const entry = { conn: conn, slot: slot, entity: null,
                      input: {dx:0,dy:0,aim:0,fire:false}, name: '玩家' + (slot+1) };
      net.conns.push(entry);
      conn.on('data', function(data){ onHostData(entry, data); });
      conn.on('close', function(){ removeHostConn(entry); });
      conn.on('error', function(){ removeHostConn(entry); });
      conn.on('open', function(){
        conn.send({ t:'joined', slot: slot, total: net.totalPlayers,
                    map: net.mapShape, humanCount: net.conns.length + 1 });
        refreshRoomPlayers();
      });
    });

    peer.on('error', function(err){
      if(err.type === 'unavailable-id'){
        setRoomStatus('房间码冲突，请重试', true);
      } else if(err.type === 'peer-unavailable'){
        // 忽略
      } else {
        setRoomStatus('联机错误：' + (err.type || err.message), true);
      }
    });
  });
}

function removeHostConn(entry){
  const i = net.conns.indexOf(entry);
  if(i >= 0) net.conns.splice(i, 1);
  refreshRoomPlayers();
}

function onHostData(entry, data){
  if(!data || typeof data !== 'object') return;
  if(data.t === 'i'){
    entry.input.dx = data.dx || 0;
    entry.input.dy = data.dy || 0;
    entry.input.aim = data.a || 0;
    entry.input.fire = !!data.f;
  } else if(data.t === 'a'){
    hostApplyAction(entry, data.k, data);
  }
}

function hostApplyAction(entry, k, data){
  const ent = entry.entity;
  if(!ent || !ent.alive) return;
  if(k === 'pickup'){
    if(!ent.inCar) pickupBest(ent, 62);
  } else if(k === 'pickupIdx'){
    if(!ent.inCar && data && data.idx != null){
      const it = items[data.idx];
      if(it && !it.removed){
        const d = Math.hypot(it.x - ent.x, it.y - ent.y);
        if(d < 220) pickupItem(ent, it);
      }
    }
  } else if(k === 'drop'){
    if(data && data.kind) dropItemFromEntity(ent, data.kind);
  } else if(k === 'bandage') useBandage(ent);
  else if(k === 'medkit')   useMedkit(ent);
  else if(k === 'drink')    useDrink(ent);
  else if(k === 'grenade')  throwGrenade(ent, data && data.x, data && data.y);
  else if(k === 'vehicle'){
    if(ent.inCar) exitVehicle(ent);
    else {
      const v = nearestVehicle(ent, 70);
      if(v) enterVehicle(ent, v);
    }
  }
}

function hostStartGame(){
  if(net.mode !== 'host' || net.started) return;
  const shape = (net.mapShape === 'random') ? pickRandomShape() : net.mapShape;
  const total = net.totalPlayers;
  const humanCount = Math.min(total, 1 + net.conns.length);
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;

  // 先通知客户端
  for(const c of net.conns){
    try{
      c.conn.send({ t:'start', seed: seed, shape: shape, total: total,
                    humanCount: humanCount, id: c.slot + 1 });
    }catch(e){}
  }

  generateWorld(seed, shape, total, humanCount);

  // 绑定客户端实体
  for(const c of net.conns){
    c.entity = entities[c.slot] || null;
    if(c.entity) c.entity.human = true;
  }

  net.started = true;
  net.removedList = [];
  net.removedSent = 0;
  net.newItems = [];
  net.snapTimer = 0;
  gameState = 'playing';
  showPanel(null);
}

/* ---------- 客户端 ---------- */
function joinRoom(){
  const code = (document.getElementById('in-room-code').value || '').trim().toUpperCase();
  if(code.length !== 5){
    setRoomStatus('请输入 5 位房间码', true);
    return;
  }

  netReset();
  net.mode = 'client';
  net.roomCode = code;

  showRoomView(true);
  document.getElementById('room-code-val').textContent = code;
  document.getElementById('btnRoomStart').style.display = 'none';
  document.getElementById('btnRoomLeave').style.display = '';
  setRoomStatus('正在连接房间…');

  loadPeerJS(function(ok){
    if(!ok){
      setRoomStatus('无法加载联机库，请检查网络后重试', true);
      return;
    }
    let peer;
    try{
      peer = new Peer({ debug: 0 });
    }catch(err){
      setRoomStatus('连接失败：' + err.message, true);
      return;
    }
    net.peer = peer;

    peer.on('open', function(){
      const conn = peer.connect(NET_PREFIX + code, { reliable: true });
      net.hostConn = conn;

      const timer = setTimeout(function(){
        if(!net.connected) setRoomStatus('连接超时，请检查房间码', true);
      }, 12000);

      conn.on('open', function(){
        clearTimeout(timer);
        net.connected = true;
        conn.send({ t:'join' });
        setRoomStatus('已连接，等待房主开始游戏…');
      });
      conn.on('data', onClientData);
      conn.on('close', function(){
        net.connected = false;
        if(gameState === 'playing'){
          gameState = 'lost';
          setRoomStatus('与房主断开连接', true);
        } else {
          setRoomStatus('与房主断开连接', true);
        }
      });
      conn.on('error', function(){
        setRoomStatus('连接出错', true);
      });
    });

    peer.on('error', function(err){
      if(err.type === 'peer-unavailable'){
        setRoomStatus('房间不存在或已关闭', true);
      } else {
        setRoomStatus('联机错误：' + (err.type || err.message), true);
      }
    });
  });
}

function onClientData(data){
  if(!data || typeof data !== 'object') return;

  if(data.t === 'joined'){
    net.mySlot = data.slot;
    net.totalPlayers = data.total;
    net.mapShape = data.map;
    net.humanCount = data.humanCount;
    refreshRoomPlayers();
    return;
  }

  if(data.t === 'start'){
    generateWorld(data.seed, data.shape, data.total, data.humanCount);
    net.myPlayerId = data.id;
    const me = entities[data.id - 1];
    if(me){
      me.isPlayer = true;
      me.human = true;
      player = me;
    }
    for(let i=0;i<data.humanCount;i++){
      if(entities[i]) entities[i].human = true;
    }
    net.started = true;
    net.finished = false;
    gameState = 'playing';
    cam.x = clamp(player.x - W/2, 0, Math.max(0, WORLD_SIZE - W));
    cam.y = clamp(player.y - H/2, 0, Math.max(0, WORLD_SIZE - H));
    showPanel(null);
    return;
  }

  if(data.t === 's'){
    applySnapshot(data);
    return;
  }

  if(data.t === 'end'){
    net.finished = true;
    if(gameState === 'playing'){
      if(player.alive){
        gameState = 'won';
        player.rank = 1;
      } else {
        gameState = 'lost';
      }
      player.surviveTime = time;
      recordMatch(gameState);
    }
    return;
  }
}

function applySnapshot(s){
  time = s.tm;

  if(zone && s.z){
    zone.cx = s.z[0]; zone.cy = s.z[1]; zone.r = s.z[2];
    zone.phaseIdx = s.z[3];
    zone.state = s.z[4] ? 'shrink' : 'wait';
    zone.t = s.z[5];
    zone.shrinkTotal = ZONE_PHASES[Math.min(zone.phaseIdx, ZONE_PHASES.length-1)].shrink;
  }

  // 实体
  if(s.e){
    for(let i=0;i<s.e.length;i++){
      const a = s.e[i];
      const e = entities[a[0]-1];
      if(!e) continue;
      e.hp = a[4];
      e.weapon = a[5] || null;
      e.ammo = a[6] || 0;
      e.armor = a[7] || 0;
      e.helmet = a[8] || 0;
      e.inCar = a[10] ? (e.inCar || {}) : null;
      const wasAlive = e.alive;
      e.alive = true;

      if(e === player){
        // 本地预测：偏差小时保留本地坐标
        const d = Math.hypot(a[1]-e.x, a[2]-e.y);
        if(d > 120 || !wasAlive){
          e.x = a[1]; e.y = a[2];
        }
        e._tx = a[1]; e._ty = a[2];
        e.angle = a[3];
      } else {
        if(!wasAlive){ e.x = a[1]; e.y = a[2]; }
        e._tx = a[1];
        e._ty = a[2];
        e._ta = a[3];
        e.angle = a[3];
      }
    }
  }

  // 子弹
  if(s.b){
    bullets.length = 0;
    for(let i=0;i<s.b.length;i++){
      const a = s.b[i];
      bullets.push({ x:a[0], y:a[1], vx:a[2], vy:a[3], color:a[4],
                     dmg:0, owner:null, life:1 });
    }
  }

  // 手雷
  if(s.g){
    grenades.length = 0;
    for(let i=0;i<s.g.length;i++){
      const a = s.g[i];
      grenades.push({ x:a[0], y:a[1], timer:a[2], owner:null, r:6, vx:0, vy:0 });
    }
  }

  // 爆炸
  if(s.x){
    explosions.length = 0;
    for(let i=0;i<s.x.length;i++){
      const a = s.x[i];
      explosions.push({ x:a[0], y:a[1], t:a[2], dur:a[3], maxR:a[4] });
    }
  }

  // 物品移除
  if(s.r){
    for(let i=0;i<s.r.length;i++){
      const it = items[s.r[i]];
      if(it) it.removed = true;
    }
  }
  // 新物品
  if(s.n){
    for(let i=0;i<s.n.length;i++){
      const ni = s.n[i];
      const it = Object.assign({ type: ni.t, x: ni.x, y: ni.y,
                                 removed: false, _idx: ni.i }, ni.e || {});
      items[ni.i] = it;
      if(items.length <= ni.i) items.length = ni.i + 1;
    }
  }

  // 自己的状态
  if(s.me && player){
    const m = s.me;
    player.hp = m[0];
    player.ammo = m[1];
    player.weapon = m[2] || null;
    player.bandage = m[3];
    player.medkit = m[4];
    player.drink = m[5];
    player.grenade = m[6];
    player.backpack = m[7];
    player.armor = m[8];
    player.helmet = m[9];
    player.kills = m[10];
    player.dmgDealt = m[11];
    player.dmgTaken = m[12];
    player.rank = m[14] || player.rank;
    if(m.length > 15) player.speedBoost = m[15] || 0;
    if(m.length > 16) player.scatter = !!m[16];

    if(!m[13] && player.alive){
      player.alive = false;
      player.surviveTime = time;
      if(gameState === 'playing'){
        gameState = 'lost';
        recordMatch('lost');
      }
    }
  }

  if(bpUI.open) renderBackpackUI();
}

/* ---------- 客户端每帧 ---------- */
function clientFrame(dt){
  if(!player) return;

  // 本地输入 → 本地预测
  const inp = player.input;
  let dx = 0, dy = 0;
  if(!bpUI.open){
    if(keys['w'] || keys['arrowup'])    dy--;
    if(keys['s'] || keys['arrowdown'])  dy++;
    if(keys['a'] || keys['arrowleft'])  dx--;
    if(keys['d'] || keys['arrowright']) dx++;
  }
  inp.dx = dx; inp.dy = dy;
  inp.aim = Math.atan2((mouse.y + cam.y) - player.y,
                       (mouse.x + cam.x) - player.x);
  inp.fire = mouse.down && !bpUI.open;

  if(player.alive && !player.inCar && (dx || dy)){
    const l = Math.hypot(dx, dy);
    const sp = player.speed * (player.speedBoost > 0 ? 1.35 : 1);
    player.x += dx/l * sp * dt;
    player.y += dy/l * sp * dt;
    resolveWalls(player);
  }

  // 其他实体插值
  const k = Math.min(1, dt * 16);
  for(let i=0;i<entities.length;i++){
    const e = entities[i];
    if(e === player) continue;
    if(e._tx === undefined) continue;
    e.x += (e._tx - e.x) * k;
    e.y += (e._ty - e.y) * k;
    if(e._ta !== undefined) e.angle = e._ta;
  }

  // 相机
  const tx = clamp(player.x - W/2, 0, Math.max(0, WORLD_SIZE - W));
  const ty = clamp(player.y - H/2, 0, Math.max(0, WORLD_SIZE - H));
  cam.x += (tx - cam.x) * Math.min(1, dt*12);
  cam.y += (ty - cam.y) * Math.min(1, dt*12);

  updateFog();

  // 发送输入
  net.inputTimer -= dt;
  if(net.inputTimer <= 0){
    net.inputTimer = 0.05;
    sendClientInput();
  }

  if(bpUI.open && player.alive) renderBackpackUI();
}

function sendClientInput(){
  if(!net.hostConn || !net.connected) return;
  const inp = player.input;
  try{
    net.hostConn.send({
      t:'i',
      dx: inp.dx, dy: inp.dy, a: +inp.aim.toFixed(3), f: inp.fire ? 1 : 0
    });
  }catch(e){}
}

function sendNetAction(k, extra){
  if(!net.hostConn || !net.connected) return;
  try{
    const msg = { t:'a', k: k };
    if(extra) Object.assign(msg, extra);
    net.hostConn.send(msg);
  }catch(e){}
}

/* ---------- 主机的快照广播 ---------- */
function buildSnapshot(p, removedDelta, newItems){
  const R = 1750;
  const ents = [];
  for(const e of entities){
    if(!e.alive) continue;
    if(e !== p && Math.hypot(e.x - p.x, e.y - p.y) > R) continue;
    ents.push([
      e.id,
      Math.round(e.x), Math.round(e.y),
      +e.angle.toFixed(2),
      Math.round(e.hp),
      e.weapon || '',
      e.ammo,
      e.armor, e.helmet,
      e.human ? 1 : 0,
      e.inCar ? 1 : 0
    ]);
  }

  const blts = [];
  for(const b of bullets){
    if(Math.hypot(b.x - p.x, b.y - p.y) > R) continue;
    blts.push([Math.round(b.x), Math.round(b.y),
               Math.round(b.vx), Math.round(b.vy), b.color]);
  }

  const grns = [];
  for(const g of grenades){
    if(Math.hypot(g.x - p.x, g.y - p.y) > R) continue;
    grns.push([Math.round(g.x), Math.round(g.y), +g.timer.toFixed(2)]);
  }

  const exps = [];
  for(const ex of explosions){
    if(Math.hypot(ex.x - p.x, ex.y - p.y) > R) continue;
    exps.push([Math.round(ex.x), Math.round(ex.y),
               +ex.t.toFixed(2), ex.dur, ex.maxR]);
  }

  return {
    t: 's',
    tm: +time.toFixed(2),
    z: [Math.round(zone.cx), Math.round(zone.cy), Math.round(zone.r),
        zone.phaseIdx, zone.state === 'shrink' ? 1 : 0, +zone.t.toFixed(1)],
    e: ents,
    b: blts,
    g: grns,
    x: exps,
    r: removedDelta,
    n: newItems,
    me: [
      Math.round(p.hp), p.ammo, p.weapon || '',
      p.bandage, p.medkit, p.drink, p.grenade,
      p.backpack, p.armor, p.helmet,
      p.kills, Math.round(p.dmgDealt), Math.round(p.dmgTaken),
      p.alive ? 1 : 0, p.rank || 0,
      +p.speedBoost.toFixed(2),
      p.scatter ? 1 : 0
    ]
  };
}

function broadcastState(dt){
  if(!net.conns.length) return;
  net.snapTimer -= dt;
  if(net.snapTimer > 0) return;
  net.snapTimer = 0.08;

  const removedDelta = net.removedList.slice(net.removedSent);
  const newItems = net.newItems.slice();

  for(const c of net.conns){
    const ent = c.entity;
    if(!ent || !c.conn || !c.conn.open) continue;
    let snap;
    try{
      snap = buildSnapshot(ent, removedDelta, newItems);
      c.conn.send(snap);
    }catch(e){}
  }

  net.removedSent = net.removedList.length;
  net.newItems.length = 0;
}

function broadcastEnd(){
  for(const c of net.conns){
    if(!c.conn || !c.conn.open) continue;
    try{ c.conn.send({ t:'end' }); }catch(e){}
  }
}

/* ============================================================
   主更新
============================================================ */
function update(dt){
  if(gameState !== 'playing') return;
  if(net.mode === 'client') return;   // 客户端不做本地模拟

  time += dt;
  if(autoPickupSuppress > 0) autoPickupSuppress -= dt;

  updateLocalInput(dt);

  if(net.mode === 'host'){
    for(const c of net.conns){
      const e = c.entity;
      if(e && e.alive) applyHumanInput(e, c.input, dt);
    }
  }

  updateVehicles(dt);

  for(const e of entities){
    if(!e.human && e.alive) updateAI(e, dt);
  }

  for(const e of entities){
    if(!e.alive) continue;
    if(e.fireCd     > 0) e.fireCd     -= dt;
    if(e.useCd      > 0) e.useCd      -= dt;
    if(e.throwCd    > 0) e.throwCd    -= dt;
    if(e.speedBoost > 0) e.speedBoost -= dt;
    if(e.hurtFlash  > 0) e.hurtFlash  -= dt;
    if(e.pickupCd   > 0) e.pickupCd   -= dt;
  }

  updateBullets(dt);
  updateGrenades(dt);
  updateZone(dt);

  for(const e of entities){
    if(!e.alive) continue;
    const d = Math.hypot(e.x-zone.cx, e.y-zone.cy);
    if(d > zone.r){
      e.hp -= zone.dmg * dt;
      if(e === player) player.dmgTaken += Math.min(zone.dmg*dt, Math.max(0, e.hp + zone.dmg*dt));
      if(e.hp <= 0){ e.hp = 0; killEntity(e, null); }
    }
  }

  updateFog();

  const tx = clamp(player.x - W/2, 0, Math.max(0, WORLD_SIZE - W));
  const ty = clamp(player.y - H/2, 0, Math.max(0, WORLD_SIZE - H));
  cam.x += (tx - cam.x) * Math.min(1, dt*12);
  cam.y += (ty - cam.y) * Math.min(1, dt*12);

  if(net.mode === 'host') broadcastState(dt);

  let aliveCount = 0;
  for(const e of entities) if(e.alive) aliveCount++;

  if(!player.alive){
    if(player.rank === 0) player.rank = aliveCount + 1;
    player.surviveTime = time;
    gameState = 'lost';
    recordMatch('lost');
    if(net.mode === 'host') broadcastEnd();
    if(bpUI.open) closeBackpack();
  } else if(aliveCount <= 1){
    player.rank = 1;
    player.surviveTime = time;
    gameState = 'won';
    recordMatch('won');
    if(net.mode === 'host') broadcastEnd();
    if(bpUI.open) closeBackpack();
  }

  if(bpUI.open) renderBackpackUI();
}

/* ============================================================
   渲染 —— 地面 / 墙
============================================================ */
function drawGround(){
  ctx.fillStyle = '#070a0f';
  ctx.fillRect(cam.x, cam.y, W, H);

  ctx.save();
  buildMapPath(ctx);
  ctx.clip();

  ctx.fillStyle = sceneryStyle ? sceneryStyle.ground : '#16211a';
  ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  ctx.strokeStyle = sceneryStyle ? sceneryStyle.grid : 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const step = Math.max(200, WORLD_SIZE/24);
  const gx0 = Math.floor(cam.x / step) * step;
  const gy0 = Math.floor(cam.y / step) * step;
  for(let x = gx0; x < cam.x + W + step; x += step){
    ctx.moveTo(x, cam.y); ctx.lineTo(x, cam.y + H);
  }
  for(let y = gy0; y < cam.y + H + step; y += step){
    ctx.moveTo(cam.x, y); ctx.lineTo(cam.x + W, y);
  }
  ctx.stroke();

  ctx.restore();

  ctx.save();
  buildMapPath(ctx);
  ctx.strokeStyle = 'rgba(120,200,255,0.35)';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.restore();
}

function drawWalls(){
  const left = cam.x - 80, right = cam.x + W + 80;
  const top  = cam.y - 80, bottom = cam.y + H + 80;
  for(const w of walls){
    if(w.x + w.w < left || w.x > right || w.y + w.h < top || w.y > bottom) continue;

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(w.x + 5, w.y + 5, w.w, w.h);

    ctx.fillStyle = '#39424d';
    ctx.fillRect(w.x, w.y, w.w, w.h);

    ctx.fillStyle = '#4d5867';
    ctx.fillRect(w.x, w.y, w.w, Math.min(6, w.h*0.25));

    ctx.strokeStyle = '#6f7d8f';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);

    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(w.w > w.h){
      for(let x = w.x + 50; x < w.x + w.w; x += 50){
        ctx.moveTo(x, w.y + 3); ctx.lineTo(x, w.y + w.h - 3);
      }
    } else {
      for(let y = w.y + 50; y < w.y + w.h; y += 50){
        ctx.moveTo(w.x + 3, y); ctx.lineTo(w.x + w.w - 3, y);
      }
    }
    ctx.stroke();
  }
}

/* ============================================================
   渲染 —— 物品
============================================================ */
function itemIconName(it){
  switch(it.type){
    case 'weapon':   return 'gun';
    case 'ammo':     return 'bullet';
    case 'bandage':  return 'bandage';
    case 'medkit':   return 'medkit';
    case 'drink':    return 'drink';
    case 'grenade':  return 'grenade';
    case 'scatter':  return 'scatter';
    case 'backpack': return 'backpack';
    case 'armor':    return 'armor';
    case 'helmet':   return 'helmet';
  }
  return 'bullet';
}

function itemColor(it){
  switch(it.type){
    case 'weapon':   return WEAPONS[it.wkey] ? WEAPONS[it.wkey].color : '#fff';
    case 'ammo':     return '#ffd34d';
    case 'bandage':  return '#eeeeee';
    case 'medkit':   return '#4ade80';
    case 'drink':    return '#38bdf8';
    case 'grenade':  return '#a3e635';
    case 'scatter':  return '#ff9a4a';
    case 'backpack': return it.level === 1 ? '#b58b5a' : it.level === 2 ? '#8f6ad4' : '#e0a72a';
    case 'armor':    return it.level === 1 ? '#8fa8b8' : it.level === 2 ? '#7fa8d8' : '#5f8fd8';
    case 'helmet':   return it.level === 1 ? '#9a9a9a' : it.level === 2 ? '#88a8c0' : '#6a8fc0';
  }
  return '#ffffff';
}

function drawItems(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for(const it of items){
    if(!it || it.removed) continue;
    if(!isCellVisible(it.x, it.y)) continue;
    const color = itemColor(it);

    ctx.beginPath();
    ctx.arc(it.x, it.y, 17, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.stroke();

    drawIcon(ctx, itemIconName(it), it.x, it.y, 22, color, 2);

    if(it.type === 'ammo'){
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillStyle = '#000';
      ctx.fillText(it.amount, it.x + 1, it.y + 20);
      ctx.fillStyle = '#ffd34d';
      ctx.fillText(it.amount, it.x, it.y + 19);
    }

    if(it.type === 'backpack' || it.type === 'armor' || it.type === 'helmet'){
      const bx = it.x + 12, by = it.y - 12;
      ctx.beginPath();
      ctx.arc(bx, by, 8, 0, TAU);
      ctx.fillStyle = '#0b1016';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillStyle = color;
      ctx.fillText(it.level, bx, by + 1);
    }

    if(it.type === 'weapon'){
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const wn = WEAPONS[it.wkey] ? WEAPONS[it.wkey].name : '';
      ctx.fillText(wn, it.x, it.y + 24);
    }

    if(it.type === 'scatter'){
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,170,110,0.9)';
      ctx.fillText('散弹', it.x, it.y + 24);
    }
  }
}

/* ============================================================
   渲染 —— 车辆
============================================================ */
function drawVehicles(){
  for(const v of vehicles){
    if(!isCellVisible(v.x, v.y)) continue;

    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.rotate(v.angle);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, -v.r*0.9 + 4, -v.r*0.55 + 4, v.r*1.8, v.r*1.15, 6);
    ctx.fill();

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-v.r*0.6, -v.r*0.65, 8, 6);
    ctx.fillRect(-v.r*0.6, v.r*0.5, 8, 6);
    ctx.fillRect(v.r*0.3, -v.r*0.65, 8, 6);
    ctx.fillRect(v.r*0.3, v.r*0.5, 8, 6);

    ctx.fillStyle = v.driver ? '#5f7f4e' : '#4a5a3a';
    rr(ctx, -v.r*0.9, -v.r*0.55, v.r*1.8, v.r*1.15, 6);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    rr(ctx, -v.r*0.9, -v.r*0.55, v.r*1.8, v.r*0.4, 6);
    ctx.fill();

    ctx.strokeStyle = '#2a3a1a';
    ctx.lineWidth = 2;
    rr(ctx, -v.r*0.9, -v.r*0.55, v.r*1.8, v.r*1.15, 6);
    ctx.stroke();

    ctx.fillStyle = 'rgba(30,45,60,0.85)';
    rr(ctx, -2, -v.r*0.45, v.r*0.85, v.r*0.95, 3);
    ctx.fill();

    ctx.fillStyle = '#fffab0';
    ctx.beginPath();
    ctx.arc(v.r*0.82, -v.r*0.35, 3, 0, TAU);
    ctx.arc(v.r*0.82, v.r*0.35, 3, 0, TAU);
    ctx.fill();

    if(v.speed > 50){
      ctx.fillStyle = v.speed > VEHICLE.ramDamageMinSpeed ? '#ff5050' : '#ffb020';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, TAU);
      ctx.fill();
    }

    ctx.restore();
  }
}

/* ============================================================
   渲染 —— 实体
============================================================ */
function drawEntities(){
  for(const e of entities){
    if(!e.alive) continue;
    if(e.inCar) continue;
    if(e !== player && !isCellVisible(e.x, e.y)) continue;

    if(e.weapon && WEAPONS[e.weapon]){
      const w = WEAPONS[e.weapon];
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(e.angle);
      ctx.fillStyle = w.color;
      ctx.fillRect(e.r*0.35, -3, w.len, 6);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, TAU);
    if(e.hurtFlash > 0) ctx.fillStyle = '#ffffff';
    else ctx.fillStyle = e.human ? '#4ea8ff' : '#ff5a5a';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.stroke();

    if(e.armor > 0){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 3, 0, TAU);
      ctx.strokeStyle = ['','rgba(140,168,184,0.8)','rgba(127,168,216,0.9)','rgba(95,143,216,1)'][e.armor];
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if(e.helmet > 0){
      ctx.beginPath();
      ctx.arc(e.x, e.y - e.r - 5, 3.5, 0, TAU);
      ctx.fillStyle = ['','#9a9a9a','#88a8c0','#6a8fc0'][e.helmet];
      ctx.fill();
    }

    if(e.speedBoost > 0){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 8, 0, TAU);
      ctx.strokeStyle = 'rgba(56,189,248,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if(e.scatter){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 8, -0.6, 0.6);
      ctx.strokeStyle = 'rgba(255,154,74,0.85)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    const bw = 34, bh = 5;
    const bx = e.x - bw/2, by = e.y - e.r - 16;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    const ratio = e.hp / e.maxHp;
    ctx.fillStyle = ratio > 0.5 ? '#4ade80' : ratio > 0.25 ? '#facc15' : '#ef4444';
    ctx.fillRect(bx, by, bw*ratio, bh);

    if(e === player){
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 10, 0, TAU);
      ctx.strokeStyle = 'rgba(78,168,255,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  if(player && player.alive && player.inCar && player.weapon && WEAPONS[player.weapon]){
    const w = WEAPONS[player.weapon];
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = w.color;
    ctx.fillRect(14, -2, w.len * 0.8, 4);
    ctx.restore();
  }
}

/* ============================================================
   渲染 —— 子弹 / 手雷 / 爆炸
============================================================ */
function drawBullets(){
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  for(const b of bullets){
    if(!isCellVisible(b.x, b.y)) continue;
    ctx.strokeStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx*0.012, b.y - b.vy*0.012);
    ctx.stroke();
  }
}

function drawGrenadesAndExplosions(){
  for(const g of grenades){
    if(!isCellVisible(g.x, g.y)) continue;

    ctx.beginPath();
    ctx.arc(g.x, g.y, 7, 0, TAU);
    ctx.fillStyle = '#4a5a3a';
    ctx.fill();
    ctx.strokeStyle = '#a3e635';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(g.x, g.y - 8, 3, 0, TAU);
    ctx.fillStyle = '#6a7a5a';
    ctx.fill();

    const blink = Math.sin(time * 26) > 0 ? '#ff4040' : '#ffb020';
    ctx.beginPath();
    ctx.arc(g.x, g.y - 11, 2, 0, TAU);
    ctx.fillStyle = blink;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(g.x, g.y, GRENADE_RADIUS, 0, TAU);
    ctx.strokeStyle = 'rgba(255,120,40,0.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for(const ex of explosions){
    const k = clamp(ex.t / ex.dur, 0, 1);
    const r = ex.maxR * (0.25 + 0.75*k);

    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, TAU);
    ctx.fillStyle = 'rgba(255,120,30,' + (0.30*(1-k)).toFixed(2) + ')';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, TAU);
    ctx.strokeStyle = 'rgba(255,' + Math.round(200*(1-k)+30) + ',40,' + (0.95*(1-k)).toFixed(2) + ')';
    ctx.lineWidth = 7*(1-k) + 1.5;
    ctx.stroke();
  }
}

/* ============================================================
   渲染 —— 迷雾 / 毒圈
============================================================ */
function drawFog(){
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fogCvs, 0, 0, GW, GH, 0, 0, WORLD_SIZE, WORLD_SIZE);
}

function drawZone(){
  ctx.save();
  ctx.beginPath();
  ctx.rect(cam.x, cam.y, W, H);
  ctx.arc(zone.cx, zone.cy, zone.r, 0, TAU, true);
  ctx.fillStyle = 'rgba(190,25,25,0.13)';
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(zone.cx, zone.cy, zone.r, 0, TAU);
  ctx.strokeStyle = zone.state === 'shrink'
    ? 'rgba(120,210,255,0.95)'
    : 'rgba(120,210,255,0.5)';
  ctx.lineWidth = 6;
  ctx.setLineDash([22, 16]);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ============================================================
   渲染 —— 小地图
============================================================ */
function drawMinimap(){
  const M = CONFIG.MINIMAP;
  if(!M.enabled) return;

  const S  = M.size;
  const MX = M.margin;
  const MY = H - M.margin - S;
  const sc = S / WORLD_SIZE;

  const d = mmData.data;
  for(let i=0, n=GW*GH; i<n; i++){
    const o = i*4;
    if(exploredBuf[i]){
      d[o] = 68; d[o+1] = 118; d[o+2] = 88; d[o+3] = 255;
    } else {
      d[o] = 0; d[o+1] = 0; d[o+2] = 0; d[o+3] = 0;
    }
  }
  mmCtx.putImageData(mmData, 0, 0);

  ctx.save();
  ctx.globalAlpha = M.opacity;

  ctx.fillStyle = 'rgba(8,14,20,0.92)';
  ctx.fillRect(MX, MY, S, S);

  ctx.save();
  ctx.beginPath();
  ctx.rect(MX, MY, S, S);
  ctx.clip();

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mmCvs, 0, 0, GW, GH, MX, MY, S, S);
  ctx.imageSmoothingEnabled = true;

  if(M.showWalls){
    ctx.fillStyle = 'rgba(150,162,178,0.9)';
    for(const w of walls){
      ctx.fillRect(MX + w.x*sc, MY + w.y*sc,
                   Math.max(1, w.w*sc), Math.max(1, w.h*sc));
    }
  }

  for(const v of vehicles){
    ctx.fillStyle = v.driver ? '#8fb070' : '#5f7a4a';
    ctx.fillRect(MX + v.x*sc - 2, MY + v.y*sc - 2, 4, 4);
  }

  if(M.showZone && zone){
    ctx.beginPath();
    ctx.arc(MX + zone.cx*sc, MY + zone.cy*sc, zone.r*sc, 0, TAU);
    ctx.strokeStyle = 'rgba(120,210,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  if(M.showEnemies){
    for(const e of entities){
      if(!e.alive || e === player) continue;
      if(!isCellVisible(e.x, e.y)) continue;
      ctx.beginPath();
      ctx.arc(MX + e.x*sc, MY + e.y*sc, 2, 0, TAU);
      ctx.fillStyle = e.human ? '#4ea8ff' : '#ff5a5a';
      ctx.fill();
    }
  }

  ctx.restore();

  ctx.save();
  ctx.translate(MX, MY);
  ctx.scale(sc, sc);
  buildMapPath(ctx);
  ctx.strokeStyle = 'rgba(100,180,220,0.65)';
  ctx.lineWidth = 2 / sc;
  ctx.stroke();
  ctx.restore();

  const px = MX + player.x*sc, py = MY + player.y*sc;
  ctx.beginPath();
  ctx.arc(px, py, 4, 0, TAU);
  ctx.fillStyle = player.inCar ? '#a0e080' : '#4ea8ff';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle) * 16,
             py + Math.sin(player.angle) * 16);
  ctx.strokeStyle = 'rgba(78,168,255,0.85)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.strokeStyle = 'rgba(120,180,220,0.55)';
  ctx.lineWidth = 2;
  ctx.strokeRect(MX, MY, S, S);

  ctx.restore();
}

/* ============================================================
   渲染 —— HUD
============================================================ */
function drawHUD(){
  if(!player) return;
  ctx.save();
  ctx.textBaseline = 'middle';
  const K = settings.keys;
  const kp = k => (k === 'tab' ? 'TAB' : k.toUpperCase());

  const bw = 320, bh = 20;
  const bx = (W - bw)/2, by = H - 62;

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx-3, by-3, bw+6, bh+6);
  ctx.fillStyle = '#242424';
  ctx.fillRect(bx, by, bw, bh);
  const r = player.hp / player.maxHp;
  ctx.fillStyle = r > 0.5 ? '#4ade80' : r > 0.25 ? '#facc15' : '#ef4444';
  ctx.fillRect(bx, by, bw * r, bh);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(player.hp) + ' / 100', bx + bw/2, by + bh/2 + 1);


    /* ---- 武器 + 背包 / 护甲 / 头盔 / 减伤：血条上方居中 ---- */
  {
    const capUsed = usedCap(player);
    const capMax  = BACKPACKS[player.backpack].cap;
    const red     = Math.round(damageReduction(player) * 100);
    const BOLD    = 'bold 15px system-ui, sans-serif';
    const SMALL   = '13px system-ui, sans-serif';

    const parts = [];
    if(player.weapon && WEAPONS[player.weapon]){
      const w = WEAPONS[player.weapon];
      parts.push({ text: w.name + ' · 子弹 ' + player.ammo,
                   color: w.color, font: BOLD });
    } else {
      parts.push({ text: '空手', color: '#777', font: BOLD });
    }
    parts.push(
      { text: '背包 ' + BACKPACKS[player.backpack].name + ' ' + capUsed + '/' + capMax,
        color: capUsed >= capMax ? '#ff8080' : '#9fd4ff', font: SMALL },
      { text: '护甲 ' + (player.armor  ? player.armor  + '级' : '无'),
        color: player.armor  ? '#8fb8e0' : '#666', font: SMALL },
      { text: '头盔 ' + (player.helmet ? player.helmet + '级' : '无'),
        color: player.helmet ? '#8fb8e0' : '#666', font: SMALL },
      { text: '减伤 ' + red + '%',
        color: red > 0 ? '#7fe0a8' : '#666', font: SMALL }
    );

    /* 先按默认间距量一遍；太宽就收紧间距，防止窄屏溢出 */
    let gap = 22;
    const measure = (g)=>{
      let t = 0;
      for(const p of parts){
        ctx.font = p.font;
        t += ctx.measureText(p.text).width;
      }
      return t + g * (parts.length - 1);
    };
    let totalW = measure(gap);
    if(totalW > W - 60){
      gap = 10;
      totalW = measure(gap);
    }

    let cx = W/2 - totalW/2;
    const eqY = by - 72;
    ctx.textAlign = 'left';
    for(const p of parts){
      ctx.font = p.font;
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, cx, eqY);
      cx += ctx.measureText(p.text).width + gap;
    }
  }
  /* ---- 消耗品信息：显示在血条正上方，居中 ---- */
  const iy = by - 46;
  ctx.font = '14px system-ui, sans-serif';
  const entries = [
    { icon:'bandage', color:'#f0f0f0',
      text:'x' + player.bandage + ' [' + kp(K.bandage) + ']' },
    { icon:'medkit',  color:'#4ade80',
      text:'x' + player.medkit  + ' [' + kp(K.medkit)  + ']' },
    { icon:'drink',   color:'#38bdf8',
      text:'x' + player.drink   + ' [' + kp(K.drink)   + ']' },
    { icon:'grenade', color:'#a3e635',
      text:'x' + player.grenade + ' [' + kp(K.grenade) + '/右键]' },
  ];
  if(player.scatter){
    entries.push({ icon:'scatter', color:'#ff9a4a', text:'散弹' });
  }

  const gap = 26;
  const widths = entries.map(e => 22 + ctx.measureText(e.text).width);
  let totalW = widths.reduce((a,b)=>a+b, 0) + gap * (entries.length - 1);
  let cursor = W/2 - totalW/2;

  for(let i = 0; i < entries.length; i++){
    const e = entries[i];
    drawIcon(ctx, e.icon, cursor + 10, iy, 18, e.color, 2);
    ctx.textAlign = 'left';
    ctx.fillStyle = e.color;
    ctx.fillText(e.text, cursor + 22, iy);
    cursor += widths[i] + gap;
  }

  /* ---- 饮料（加速）计时条：位于血条正上方 ---- */
  if(player.speedBoost > 0){
    const barH = 7;
    const barY = by - 16;
    const k = clamp(player.speedBoost / DRINK_BOOST_TIME, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(bx - 3, barY - 3, bw + 6, barH + 6);
    ctx.fillStyle = '#0b2230';
    ctx.fillRect(bx, barY, bw, barH);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(bx, barY, bw * k, barH);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(bx, barY, bw * k, 2);
    ctx.fillStyle = 'rgba(160,235,255,0.95)';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('加速 ' + player.speedBoost.toFixed(1) + 's', bx - 12, barY + barH/2);
  }



  

  ctx.textAlign = 'right';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  const alive = entities.reduce((n,e)=>n + (e.alive?1:0), 0);
  ctx.fillText('存活 ' + alive + ' / ' + TOTAL_PLAYERS, W - 26, 34);

  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = '#ff9a6a';
  ctx.fillText('击杀 ' + player.kills, W - 26, 62);

  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(140,215,255,0.85)';
  if(zone.phaseIdx < ZONE_PHASES.length){
    const txt = zone.state === 'wait'
      ? '安全区 ' + Math.ceil(zone.t) + ' 秒后收缩'
      : '安全区正在收缩！';
    ctx.fillText(txt, W - 26, 90);
  } else {
    ctx.fillText('最终决战', W - 26, 90);
  }

  if(sceneryStyle){
    ctx.textAlign = 'left';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(150,210,255,0.55)';
    ctx.fillText('地形 · ' + sceneryStyle.name, 26, 34);
  }

  if(net.mode !== 'offline'){
    ctx.textAlign = 'center';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(120,200,255,0.55)';
    ctx.fillText((net.mode === 'host' ? '房主' : '客户端') +
                 ' · 房间 ' + net.roomCode, W/2, 24);
  }

  const dz = Math.hypot(player.x - zone.cx, player.y - zone.cy);
  if(dz > zone.r){
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,70,70,' + (0.55 + 0.45*Math.sin(time*8)) + ')';
    ctx.fillText('⚠ 你在安全区外 ⚠', W/2, 74);
  }

  if(player.alive){
    if(player.inCar){
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui, sans-serif';
      ctx.fillStyle = '#8fe8a0';
      const spd = Math.round(player.inCar.speed || 0);
      ctx.fillText('[' + kp(K.vehicle) + '] 下车 · 车速 ' + spd, W/2, H - 160);
    } else {
      const v = nearestVehicle(player, 70);
      if(v){
        ctx.textAlign = 'center';
        ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.fillStyle = '#ffe066';
        ctx.fillText('[' + kp(K.vehicle) + '] 上车', W/2, H - 160);
      }
    }
  }

  const near = findPickupHint(player, 62);
  if(near && player.alive && !player.inCar){
    let name = '';
    if(near.type === 'weapon')        name = WEAPONS[near.wkey] ? WEAPONS[near.wkey].name : '';
    else if(near.type === 'ammo')     name = '子弹 x' + near.amount;
    else if(near.type === 'bandage')  name = '绷带';
    else if(near.type === 'medkit')   name = '医疗包';
    else if(near.type === 'drink')    name = '饮料';
    else if(near.type === 'grenade')  name = '手雷';
    else if(near.type === 'scatter')  name = '散弹弹丸';
    else if(near.type === 'backpack') name = near.level + '级背包';
    else if(near.type === 'armor')    name = near.level + '级护甲';
    else if(near.type === 'helmet')   name = near.level + '级头盔';

    const verb = near.type === 'weapon' ? '换枪' : '拾取';
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('[' + kp(K.pickup) + '] ' + verb + ' ' + name, W/2, H - 138);
  }

  ctx.textAlign = 'left';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.fillText(
    'WASD 移动 · 鼠标瞄准 · 左键射击 · 右键/' + kp(K.grenade) + ' 手雷 · ' +
    kp(K.vehicle) + ' 车辆 · ' + kp(K.backpack) + ' 背包 · ' + kp(K.pickup) + ' 拾取 · ' +
    kp(K.bandage) + ' 绷带 · ' + kp(K.medkit) + ' 医疗包 · ' + kp(K.drink) + ' 饮料' +
    (settings.autoHeal ? ' · 自动治疗已开启' : ''),
    26, H - 26);

  /* ---------- 结算界面 ---------- */
  if(gameState !== 'playing'){
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 54px system-ui, sans-serif';
    ctx.fillStyle = gameState === 'won' ? '#ffd93d' : '#ff5252';
    ctx.fillText(gameState === 'won' ? '大吉大利，今晚吃鸡！' : '你被淘汰了',
                 W/2, H/2 - 190);

    const pw = 400, ph = 258;
    const px = (W - pw)/2, py = H/2 - 120;
    ctx.fillStyle = 'rgba(14,22,32,0.94)';
    rr(ctx, px, py, pw, ph, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(100,180,255,0.28)';
    ctx.lineWidth = 1.5; ctx.stroke();

    const rows = [
      ['击杀数',   String(player.kills),              '#ff9a6a'],
      ['造成伤害', String(Math.round(player.dmgDealt)), '#ffe066'],
      ['承受伤害', String(Math.round(player.dmgTaken)), '#9fd4ff'],
      ['最终排名', '#' + player.rank,                 '#7fe0a8'],
      ['存活时间', fmtTime(player.surviveTime),       '#c8b8ff'],
    ];
    rows.forEach((row, i)=>{
      const y = py + 36 + i*44;
      ctx.textAlign = 'left';
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(180,210,240,0.7)';
      ctx.fillText(row[0], px + 34, y);
      ctx.textAlign = 'right';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = row[2];
      ctx.fillText(row[1], px + pw - 34, y);
    });

    ctx.textAlign = 'center';
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    const tip = net.mode === 'client'
      ? 'ESC 返回主菜单'
      : '空格 重新开始 · ESC 返回主菜单';
    ctx.fillText(tip, W/2, py + ph + 52);
  }

  ctx.restore();
}

function pickRandomShape(){
  const shapes = ['square','circle','cross','Lshape','diamond','islands'];
  return shapes[Math.floor(Math.random() * shapes.length)];
}

function startGame(){
  netReset();
  closeBackpack();
  pauseOpen = false;
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  const shape = settings.mapShape === 'random' ? pickRandomShape() : settings.mapShape;
  generateWorld(seed, shape, settings.totalPlayers, 1);
  gameState = 'playing';
  showPanel(null);
}

/* ============================================================
   历史战绩
============================================================ */
const HISTORY_KEY = 'fog_battle_history_v1';
const HISTORY_MAX = 30;
const MAP_NAMES = {
  square:'方形', circle:'圆形', cross:'十字',
  Lshape:'L 形', diamond:'菱形', islands:'双子岛'
};

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}

function writeHistory(list){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){}
}

function recordMatch(result){
  if(!player) return;
  const rec = {
    result: result,
    kills: player.kills | 0,
    dmgDealt: Math.round(player.dmgDealt),
    dmgTaken: Math.round(player.dmgTaken),
    rank: player.rank || 0,
    survive: Math.round(player.surviveTime),
    total: TOTAL_PLAYERS,
    map: MAP_SHAPE,
    ai: settings.aiLevel,
    online: net.mode !== 'offline',
    ts: Date.now()
  };
  const list = loadHistory();
  list.unshift(rec);
  if(list.length > HISTORY_MAX) list.length = HISTORY_MAX;
  writeHistory(list);
}

function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
         p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderHistory(){
  const list  = loadHistory();
  const total = list.length;
  const wins  = list.filter(r => r.result === 'won').length;
  const kills = list.reduce((s, r) => s + (r.kills || 0), 0);

  document.getElementById('hist-stats').innerHTML =
    '<div class="hist-stat"><b>' + total + '</b><span>总场次</span></div>' +
    '<div class="hist-stat"><b>' + wins + '</b><span>吃鸡次数</span></div>' +
    '<div class="hist-stat"><b>' +
      (total ? Math.round(wins / total * 100) + '%' : '—') +
    '</b><span>胜率</span></div>' +
    '<div class="hist-stat"><b>' + kills + '</b><span>总击杀</span></div>';

  const el = document.getElementById('hist-list');
  if(!total){
    el.innerHTML = '<div class="hist-empty">暂无战绩，快去开一局吧</div>';
    return;
  }

  el.innerHTML = list.map(function(r){
    const win = r.result === 'won';
    return '<div class="hist-row' + (win ? ' win' : '') + '">' +
      '<div class="hist-badge">' + (win ? '吃鸡' : '淘汰') + '</div>' +
      '<div class="hist-main">' +
        '<div class="hist-l1">' +
          '<span>排名 #' + (r.rank || '-') + '</span>' +
          '<span>击杀 <em>' + (r.kills || 0) + '</em></span>' +
          '<span>存活 ' + fmtTime(r.survive || 0) + '</span>' +
        '</div>' +
        '<div class="hist-l2">' +
          (MAP_NAMES[r.map] || '未知地图') +
          ' · ' + (r.total || 100) + ' 人' +
          (r.online ? ' · 联机' : (' · AI ' + (r.ai || '-'))) +
          ' · 伤害 ' + (r.dmgDealt || 0) +
          ' · ' + fmtDate(r.ts) +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

const bpUI = {

  drag: null,       // { source, index, item, ghost, sourceEl }
};

const ICON_CACHE = {};
function iconDataURL(name, color, size){
  const key = name + '|' + color + '|' + size;
  if(ICON_CACHE[key]) return ICON_CACHE[key];
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  drawIcon(g, name, size/2, size/2, size*0.85, color, Math.max(1.5, size/11));
  const url = c.toDataURL();
  ICON_CACHE[key] = url;
  return url;
}

/* 通用标签 / 图标 / 颜色（兼容地面物品与随身条目） */
function bpItemLabel(it){
  const t = it._kind || it.type;
  switch(t){
    case 'weapon':   return (it.wkey && WEAPONS[it.wkey]) ? WEAPONS[it.wkey].name : '武器';
    case 'ammo':     return '子弹';
    case 'bandage':  return '绷带';
    case 'medkit':   return '医疗包';
    case 'drink':    return '饮料';
    case 'grenade':  return '手雷';
    case 'scatter':  return '散弹弹丸';
    case 'backpack': return (it.level || 1) + '级背包';
    case 'armor':    return (it.level || 1) + '级护甲';
    case 'helmet':   return (it.level || 1) + '级头盔';
  }
  return '物品';
}
function bpItemIcon(it){
  const t = it._kind || it.type;
  switch(t){
    case 'weapon':   return 'gun';
    case 'ammo':     return 'bullet';
    case 'bandage':  return 'bandage';
    case 'medkit':   return 'medkit';
    case 'drink':    return 'drink';
    case 'grenade':  return 'grenade';
    case 'scatter':  return 'scatter';
    case 'backpack': return 'backpack';
    case 'armor':    return 'armor';
    case 'helmet':   return 'helmet';
  }
  return 'bullet';
}
function bpItemColor(it){
  const t = it._kind || it.type;
  switch(t){
    case 'weapon':   return (it.wkey && WEAPONS[it.wkey]) ? WEAPONS[it.wkey].color : '#fff';
    case 'ammo':     return '#ffd34d';
    case 'bandage':  return '#eeeeee';
    case 'medkit':   return '#4ade80';
    case 'drink':    return '#38bdf8';
    case 'grenade':  return '#a3e635';
    case 'scatter':  return '#ff9a4a';
    case 'backpack':
      return (it.level || 1) === 1 ? '#b58b5a' : (it.level === 2 ? '#8f6ad4' : '#e0a72a');
    case 'armor':
      return (it.level || 1) === 1 ? '#8fa8b8' : (it.level === 2 ? '#7fa8d8' : '#5f8fd8');
    case 'helmet':
      return (it.level || 1) === 1 ? '#9a9a9a' : (it.level === 2 ? '#88a8c0' : '#6a8fc0');
  }
  return '#fff';
}

/* 随身消耗品（不含装备位） */
function getMyConsumables(){
  const p = player;
  if(!p) return [];
  const out = [];
  if(p.ammo    > 0) out.push({_kind:'ammo',    type:'ammo',    amount:p.ammo,    count:p.ammo});
  if(p.bandage > 0) out.push({_kind:'bandage', type:'bandage', count:p.bandage});
  if(p.medkit  > 0) out.push({_kind:'medkit',  type:'medkit',  count:p.medkit});
  if(p.drink   > 0) out.push({_kind:'drink',   type:'drink',   count:p.drink});
  if(p.grenade > 0) out.push({_kind:'grenade', type:'grenade', count:p.grenade});
  return out;
}

/* 附近地面物品（按距离排序） */
function getNearbyGroundItems(radius){
  const p = player;
  if(!p) return [];
  const out = [];
  for(const it of items){
    if(!it || it.removed) continue;
    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if(d <= radius) out.push({it, d});
  }
  out.sort((a, b) => a.d - b.d);
  return out.map(o => o.it);
}

function makeBPItemEl(item, source, index){
  const el = document.createElement('div');
  el.className = 'bp-item';
  el.dataset.source = source;
  el.dataset.index = String(index);

  const img = document.createElement('img');
  img.className = 'bp-icon';
  img.src = iconDataURL(bpItemIcon(item), bpItemColor(item), 26);
  el.appendChild(img);

  const name = document.createElement('span');
  name.className = 'bp-name';
  name.textContent = bpItemLabel(item);
  el.appendChild(name);

  let count = null;
  if(item._kind) count = item.count;
  else if(item.type === 'ammo') count = item.amount;

  if(count !== null && count > 1){
    const c = document.createElement('span');
    c.className = 'bp-count';
    c.textContent = 'x' + count;
    el.appendChild(c);
  }

  return el;
}

function renderBackpackUI(){
  if(!bpUI.open || !player) return;
  const p = player;

  /* ---- 我的物品 ---- */
  const mineEl = document.getElementById('bp-mine');
  if(mineEl){
    const scrollTop = mineEl.scrollTop;
    mineEl.innerHTML = '';
    const mine = getMyConsumables();
    if(mine.length === 0){
      const e = document.createElement('div');
      e.className = 'bp-empty';
      e.textContent = '空 空 如 也';
      mineEl.appendChild(e);
    } else {
      for(let i = 0; i < mine.length; i++){
        mineEl.appendChild(makeBPItemEl(mine[i], 'mine', i));
      }
    }
    mineEl.scrollTop = scrollTop;
  }

  /* ---- 附近物品 ---- */
  const groundEl = document.getElementById('bp-ground');
  if(groundEl){
    const scrollTop = groundEl.scrollTop;
    groundEl.innerHTML = '';
    const ground = getNearbyGroundItems(220);
    if(ground.length === 0){
      const e = document.createElement('div');
      e.className = 'bp-empty';
      e.textContent = '附 近 没 有 物 品';
      groundEl.appendChild(e);
    } else {
      for(let i = 0; i < ground.length; i++){
        const it = ground[i];
        const el = makeBPItemEl(it, 'ground', i);
        el._itemRef = it;
        groundEl.appendChild(el);
      }
    }
    groundEl.scrollTop = scrollTop;
  }

  /* ---- 装备 ---- */
  const eqEl = document.getElementById('bp-equip');
  if(eqEl){
    eqEl.innerHTML = '';
    const eqs = [
      {lbl:'武器', val: p.weapon ? WEAPONS[p.weapon].name : '无',
       icon: p.weapon ? 'gun' : null,
       color: p.weapon ? WEAPONS[p.weapon].color : '#556'},
      {lbl:'背包', val: BACKPACKS[p.backpack].name,
       icon:'backpack', color:'#b58b5a'},
      {lbl:'护甲', val: p.armor > 0 ? p.armor + '级' : '无',
       icon: p.armor > 0 ? 'armor' : null,
       color:'#8fa8b8'},
      {lbl:'头盔', val: p.helmet > 0 ? p.helmet + '级' : '无',
       icon: p.helmet > 0 ? 'helmet' : null,
       color:'#9a9a9a'},
      {lbl:'散弹', val: p.scatter ? '已激活' : '无',
       icon: p.scatter ? 'scatter' : null,
       color:'#ff9a4a'},
    ];
    for(const d of eqs){
      const div = document.createElement('div');
      div.className = 'bp-eqslot';
      if(d.icon){
        const img = document.createElement('img');
        img.src = iconDataURL(d.icon, d.color, 20);
        div.appendChild(img);
      }
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = d.lbl;
      div.appendChild(lbl);
      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = d.val;
      div.appendChild(val);
      eqEl.appendChild(div);
    }
  }

  /* ---- 容量 ---- */
  const capEl = document.getElementById('bp-cap');
  if(capEl){
    const used = usedCap(p);
    const max = BACKPACKS[p.backpack].cap;
    capEl.innerHTML = '容量 <b style="color:' +
      (used >= max ? '#ff8080' : '#7fd3ff') + '">' + used + '</b> / ' + max;
  }
}

function openBackpack(){
  if(gameState !== 'playing' || !player || !player.alive) return;
  bpUI.open = true;
  mouse.down = false;
  document.getElementById('backpack').classList.remove('hidden');
  renderBackpackUI();
  updateKeyLabels();
}
function closeBackpack(){
  if(!bpUI.open) return;
  bpUI.open = false;
  cancelDrag();
  document.getElementById('backpack').classList.add('hidden');
}
function toggleBackpack(){
  if(bpUI.open) closeBackpack();
  else openBackpack();
}

/* ---------- 拖拽 ---------- */
function startDrag(el, ev){
  const source = el.dataset.source;
  const index = parseInt(el.dataset.index, 10);

  let itemData = null;
  if(source === 'mine'){
    itemData = getMyConsumables()[index];
  } else {
    itemData = el._itemRef || null;
  }
  if(!itemData) return;

  const ghost = el.cloneNode(true);
  ghost.classList.add('bp-ghost');
  ghost.style.left = ev.clientX + 'px';
  ghost.style.top = ev.clientY + 'px';
  document.body.appendChild(ghost);
  el.classList.add('dragging');

  bpUI.drag = {
    source: source,
    index: index,
    item: itemData,
    ghost: ghost,
    sourceEl: el
  };

  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup', onDragUp);
}

function onDragMove(ev){
  if(!bpUI.drag) return;
  bpUI.drag.ghost.style.left = ev.clientX + 'px';
  bpUI.drag.ghost.style.top = ev.clientY + 'px';
}

function onDragUp(ev){
  const d = bpUI.drag;
  if(!d) return;

  window.removeEventListener('mousemove', onDragMove);
  window.removeEventListener('mouseup', onDragUp);

  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  if(d.sourceEl) d.sourceEl.classList.remove('dragging');
  bpUI.drag = null;

  const target = document.elementFromPoint(ev.clientX, ev.clientY);
  if(!target) return;

  const mineList = document.getElementById('bp-mine');
  const groundList = document.getElementById('bp-ground');
  const equipEl = document.getElementById('bp-equip');

  const inMine   = mineList && mineList.contains(target);
  const inGround = groundList && groundList.contains(target);
  const inEquip  = equipEl && equipEl.contains(target);

  if(d.source === 'mine'){
    /* 从自己身上拖出：只有拖到「附近物品」区域才丢弃 */
    if(inGround){
      dropItemKind(d.item._kind);
    }
  } else if(d.source === 'ground'){
    /* 从地面拖入背包或装备区：拾取 */
    if(inMine || inEquip){
      pickupGroundItem(d.item);
    }
  }

  renderBackpackUI();
}

function cancelDrag(){
  if(bpUI.drag){
    if(bpUI.drag.ghost && bpUI.drag.ghost.parentNode){
      bpUI.drag.ghost.parentNode.removeChild(bpUI.drag.ghost);
    }
    if(bpUI.drag.sourceEl) bpUI.drag.sourceEl.classList.remove('dragging');
    window.removeEventListener('mousemove', onDragMove);
    window.removeEventListener('mouseup', onDragUp);
    bpUI.drag = null;
  }
}

/* ---------- 快捷操作 ---------- */
function pickupGroundItem(it){
  if(!it || it.removed || !player || !player.alive) return;
  const d = Math.hypot(it.x - player.x, it.y - player.y);
  if(d > 220) return;

  if(net.mode === 'client'){
    sendNetAction('pickupIdx', { idx: it._idx });
  } else {
    pickupItem(player, it);
  }
}

function dropItemKind(kind){
  if(!kind || !player || !player.alive) return;
  if(net.mode === 'client'){
    sendNetAction('drop', { kind: kind });
  } else {
    dropItemFromEntity(player, kind);
  }
}

function useMyItem(kind){
  if(!player || !player.alive) return;
  if(net.mode === 'client'){
    if(kind === 'grenade')      sendNetAction('grenade');
    else if(kind === 'bandage') sendNetAction('bandage');
    else if(kind === 'medkit')  sendNetAction('medkit');
    else if(kind === 'drink')   sendNetAction('drink');
    return;
  }
  switch(kind){
    case 'bandage': useBandage(player); break;
    case 'medkit':  useMedkit(player);  break;
    case 'drink':   useDrink(player);   break;
    case 'grenade': throwGrenade(player); break;
  }
}

function quickAction(el){
  const source = el.dataset.source;
  const index = parseInt(el.dataset.index, 10);

  if(source === 'mine'){
    const it = getMyConsumables()[index];
    if(!it) return;
    useMyItem(it._kind);
  } else {
    const it = el._itemRef;
    if(!it) return;
    pickupGroundItem(it);
  }
  renderBackpackUI();
}

/* ---------- 背包事件绑定 ---------- */
(function bindBackpackEvents(){
  const panel = document.getElementById('backpack');
  if(!panel) return;

  panel.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    const el = e.target.closest && e.target.closest('.bp-item');
    if(!el) return;
    e.preventDefault();
    startDrag(el, e);
  });

  panel.addEventListener('contextmenu', function(e){
    const el = e.target.closest && e.target.closest('.bp-item');
    if(!el) return;
    e.preventDefault();
    quickAction(el);
  });

  /* 拖动到窗口外松开 → 取消拖拽 */
  window.addEventListener('blur', cancelDrag);
})();

/* ============================================================
   输入
============================================================ */
window.addEventListener('mousemove', e=>{
  const r = cvs.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});

cvs.addEventListener('mousedown', e=>{
  if(pauseOpen) return;
  if(bpUI.open) return;
  if(e.button === 0) mouse.down = true;
  if(e.button === 2 && gameState === 'playing' && player && player.alive){
    const rect = cvs.getBoundingClientRect();
    const wx = (e.clientX - rect.left) + cam.x;
    const wy = (e.clientY - rect.top)  + cam.y;
    if(net.mode === 'client') sendNetAction('grenade', {x: wx, y: wy});
    else throwGrenade(player, wx, wy);
  }
});
window.addEventListener('mouseup', e=>{ if(e.button === 0) mouse.down = false; });
cvs.addEventListener('contextmenu', e=>e.preventDefault());

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();

  if(listeningKey){
    e.preventDefault();
    if(k !== 'escape') settings.keys[listeningKey] = k;
    listeningKey = null;
    updateKeyLabels();
    return;
  }
    /* 暂停菜单打开时：只允许 ESC 关闭，其他按键忽略 */
  if(pauseOpen){
    if(k === 'escape'){
      e.preventDefault();
      closePause();
    }
    return;
  }

  /* 背包开关 */
  if(gameState === 'playing' && player && player.alive && k === settings.keys.backpack){
    e.preventDefault();
    toggleBackpack();
    return;
  }

  /* 背包打开时，只允许 ESC 关闭，其他输入不转发给游戏 */
  if(bpUI.open){
    if(k === 'escape'){
      e.preventDefault();
      closeBackpack();
    }
    return;
  }
  /* 游戏中按 ESC：打开暂停菜单 */
  if(gameState === 'playing' && k === 'escape'){
    e.preventDefault();
    openPause();
    return;
  }
  keys[k] = true;

  if(gameState !== 'playing'){
    if(k === ' ' || k === 'enter'){
      if(gameState === 'won' || gameState === 'lost'){
        if(net.mode === 'client'){
          // 客户端不重开，等房主
        } else {
          startGame();
        }
      }
    }
    if(k === 'escape'){
      netReset();
      gameState = 'menu';
      showPanel('menu');
      return;
    }
    return;
  }

  const K = settings.keys;

  if(net.mode === 'client'){
    if(k === K.pickup)  sendNetAction('pickup');
    if(k === K.bandage) sendNetAction('bandage');
    if(k === K.medkit)  sendNetAction('medkit');
    if(k === K.drink)   sendNetAction('drink');
    if(k === K.grenade){
      if(net.mode === 'client'){
        sendNetAction('grenade', {x: mouse.x + cam.x, y: mouse.y + cam.y});
      } else {
        throwGrenade(player, mouse.x + cam.x, mouse.y + cam.y);
      }
    }
    if(k === K.vehicle) sendNetAction('vehicle');
  } else {
    if(k === K.pickup && !player.inCar){
      const picked = pickupBest(player, 62);
      if(picked && picked.type === 'weapon') autoPickupSuppress = 1.0;
    }
    if(k === K.bandage) useBandage(player);
    if(k === K.medkit ) useMedkit(player);
    if(k === K.drink  ) useDrink(player);
    if(k === K.grenade) throwGrenade(player);
    if(k === K.vehicle){
      if(player.inCar) exitVehicle(player);
      else {
        const v = nearestVehicle(player, 70);
        if(v) enterVehicle(player, v);
      }
    }
  }

  if(['w','a','s','d',' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
    e.preventDefault();
  }
});
window.addEventListener('keyup', e=>{
  keys[e.key.toLowerCase()] = false;
});

/* ============================================================
   菜单 / 面板
============================================================ */
function showPanel(id){
  ['menu','settings','history','online','pause'].forEach(function(p){
    document.getElementById(p).classList.toggle('hidden', p !== id);
  });
  if(id !== 'pause') pauseOpen = false;
  if(id !== 'settings') listeningKey = null;
  updateKeyLabels();
}

function openPause(){
  if(gameState !== 'playing' || !player || !player.alive) return;
  if(bpUI.open) closeBackpack();
  pauseOpen = true;
  mouse.down = false;
  for(const k in keys) keys[k] = false;
  showPanel('pause');

  // 如果是联机客户端，通知主机停止输入
  if(net.mode === 'client' && net.connected){
    player.input.dx = 0;
    player.input.dy = 0;
    player.input.fire = false;
    try{
      net.hostConn.send({
        t:'i', dx:0, dy:0,
        a: +(player.angle || 0).toFixed(3), f:0
      });
    }catch(e){}
  }
}

function closePause(){
  if(!pauseOpen) return;
  pauseOpen = false;
  showPanel(null);
  lastTime = performance.now(); // 防止恢复时 dt 跳变
}

function returnToMenu(){
  pauseOpen = false;
  closeBackpack();
  netReset();
  gameState = 'menu';
  mouse.down = false;
  for(const k in keys) keys[k] = false;
  showPanel('menu');
}

function showRoomView(inRoom){
  document.getElementById('online-menu').classList.toggle('hidden', inRoom);
  document.getElementById('online-room').classList.toggle('hidden', !inRoom);
  document.getElementById('btnOnlineBack').textContent = inRoom ? '返 回 主 菜 单' : '返 回';
}

function setRoomStatus(txt, isErr){
  const el = document.getElementById('room-status');
  el.textContent = txt;
  el.classList.toggle('err', !!isErr);
}

function refreshRoomPlayers(){
  const list = document.getElementById('room-players');
  if(!list) return;
  const total = net.mode === 'host' ? net.totalPlayers : net.totalPlayers;
  let html = '';
  if(net.mode === 'host'){
    html += '<div class="pl-item"><span class="dot"></span>房主（你）<span class="tag">主机</span></div>';
    for(const c of net.conns){
      html += '<div class="pl-item"><span class="dot"></span>玩家' + (c.slot + 1) +
              '<span class="tag">已连接</span></div>';
    }
    const humans = 1 + net.conns.length;
    html += '<div class="pl-item" style="opacity:.65"><span class="dot" ' +
            'style="background:#ffb020"></span>AI 机器人 × ' +
            Math.max(0, total - humans) + '</div>';
  } else {
    html += '<div class="pl-item"><span class="dot"></span>已进入房间' +
            (net.mySlot ? '（你是玩家' + (net.mySlot + 1) + '）' : '') +
            '<span class="tag">' + (net.totalPlayers || '?') + ' 人场</span></div>';
  }
  list.innerHTML = html;
}

document.getElementById('btnStart').onclick    = function(){ startGame(); };
document.getElementById('btnSettings').onclick = function(){ showPanel('settings'); };
document.getElementById('btnHistory').onclick  = function(){ renderHistory(); showPanel('history'); };
document.getElementById('btnOnline').onclick   = function(){
  netReset();
  showRoomView(false);
  document.getElementById('btnRoomStart').style.display = '';
  document.getElementById('btnRoomLeave').style.display = '';
  setRoomStatus('');
  showPanel('online');
};
document.getElementById('btnBack').onclick     = function(){ showPanel('menu'); };
document.getElementById('btnHistBack').onclick = function(){ showPanel('menu'); };
document.getElementById('btnOnlineBack').onclick = function(){
  netReset();
  showRoomView(false);
  showPanel('menu');
};
document.getElementById('btnClearHist').onclick = function(){
  if(!loadHistory().length) return;
  if(confirm('确定要清空全部历史战绩吗？此操作不可撤销。')){
    writeHistory([]);
    renderHistory();
  }
};

document.getElementById('btnCreateRoom').onclick = function(){ createRoom(); };
document.getElementById('btnJoinRoom').onclick   = function(){ joinRoom(); };
document.getElementById('btnRoomStart').onclick  = function(){ hostStartGame(); };
document.getElementById('btnRoomLeave').onclick  = function(){
  netReset();
  showRoomView(false);
  setRoomStatus('');
};
document.getElementById('btnResume').onclick = function(){
  closePause();
};

document.getElementById('btnReturnMenu').onclick = function(){
  returnToMenu();
};
const sAi = document.getElementById('s-ai');
const aiVal = document.getElementById('ai-val');
sAi.value = settings.aiLevel;
aiVal.textContent = settings.aiLevel;
sAi.oninput = ()=>{
  settings.aiLevel = parseInt(sAi.value, 10);
  aiVal.textContent = sAi.value;
};

const sTotal = document.getElementById('s-total');
sTotal.value = String(settings.totalPlayers);
sTotal.onchange = (e)=> settings.totalPlayers = parseInt(e.target.value, 10) || 100;

const sMap = document.getElementById('s-map');
sMap.value = settings.mapShape;
sMap.onchange = (e)=> settings.mapShape = e.target.value;

/* ============================================================
   主循环
============================================================ */
let lastTime = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if(gameState === 'menu'){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, W, H);
  } else {
    if(pauseOpen){
      render(); // 暂停时只渲染当前画面，不更新逻辑
    } else if(net.mode === 'client' && net.started){
      clientFrame(dt);
      render();
    } else {
      update(dt);
      render();
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
